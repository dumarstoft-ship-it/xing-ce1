e_or_counterexample":"同样规模的厂房，可以处于不同所有制和分配关系中。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.17","module_id":"M7","title":"生产关系与经济基础的联系","priority":"A","correct_statement":"一定社会的生产关系从其总和及其对上层建筑的基础作用看，构成经济基础。","incorrect_statement":"生产关系与经济基础是两个完全互不相干的社会层次。","explanation":"不是机器到人际关系再凭空多出一层钱，经济基础是在社会结构关系中讨论生产关系的总体。","necessary_conditions_and_boundaries":"单项生产关系不能自动代表社会经济基础的全部。","example_or_counterexample":"一项分配关系是分析经济基础的内容之一，不是经济基础的全部。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.18","module_id":"M7","title":"上层建筑的两类","priority":"A","correct_statement":"上层建筑包括政治法律制度及相关组织设施，也包括与经济基础相适应的意识形态。","incorrect_statement":"上层建筑只有思想观念，不包括政治组织、法律制度及相关设施。","explanation":"政治上层建筑与观念上层建筑不同，不能把全部上层建筑都说成脑中的观念。","necessary_conditions_and_boundaries":"分类看社会功能与关系，不只看是否可见可触。","example_or_counterexample":"国家组织与政治法律思想可分别对应两类上层建筑。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.19","module_id":"M7","title":"国家政权与上层建筑","priority":"A","correct_statement":"在上层建筑中，政治上层建筑居主导地位，国家政权是其核心。","incorrect_statement":"经济基础是上层建筑内部的一种思想，国家政权则属于生产工具。","explanation":"这些范畴在社会结构中的位置不同，不能因国家机构有物质设施就归为生产工具。","necessary_conditions_and_boundaries":"谈国家政权的政治功能，不是把建筑材料也当成政治观念。","example_or_counterexample":"同一设施可从材料或社会职能分析，题目层次必须清楚。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.20","module_id":"M7","title":"所有制关系与法律规定","priority":"A","correct_statement":"所有制的实际经济关系属于生产关系，确立和保障它的法律制度属于上层建筑。","incorrect_statement":"只要法律条文涉及所有制，这条法律作为制度就自动属于经济基础。","explanation":"被规定的经济关系与规定它的法律形式相联系但不等同。","necessary_conditions_and_boundaries":"材料可能同时包含两个层次，需看题目主语。","example_or_counterexample":"财产由谁实际占有与以何种法律制度确认保障，不能混为一个范畴。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.21","module_id":"M7","title":"经济基础决定与上层建筑反作用","priority":"A","correct_statement":"经济基础决定上层建筑，上层建筑又能维护或调整相应经济关系。","incorrect_statement":"法律政治制度有重大作用，所以经济基础由它们任意创造并根本决定。","explanation":"反作用可以很强，但作用强度不等于本原关系颠倒。","necessary_conditions_and_boundaries":"经济基础变化与上层建筑变化不必立即、全面同步。","example_or_counterexample":"法律改革影响经济运行，但仍需分析其物质条件与所服务的关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.22","module_id":"M7","title":"上层建筑促进发展的条件","priority":"A","correct_statement":"上层建筑服务于适合生产力发展的经济基础时，才能就这种作用说它促进社会进步。","incorrect_statement":"只要上层建筑适应并维护现有经济基础，就无条件促进社会进步。","explanation":"维护某种经济关系可能稳定旧秩序；是否进步还要看该经济关系对生产力的作用。","necessary_conditions_and_boundaries":"不能省掉“服务何种经济基础”这一中间判断。","example_or_counterexample":"维护阻碍生产力的旧关系，不会仅因维护得有效就成为进步力量。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.23","module_id":"M7","title":"社会基本矛盾与主要矛盾","priority":"A","correct_statement":"生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，不等于某阶段社会主要矛盾。","incorrect_statement":"社会主要矛盾表述发生变化，就说明社会基本矛盾不再存在。","explanation":"基本矛盾贯穿社会发展，主要矛盾着眼一定阶段的突出支配关系。","necessary_conditions_and_boundaries":"不随意将不同阶段政治表述当作基本范畴定义。","example_or_counterexample":"某阶段突出问题改变，不表示生产和制度之间的关系消失。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.24","module_id":"M7","title":"根本动力与最终决定力量","priority":"A","correct_statement":"社会基本矛盾运动是社会发展的根本动力，生产力是社会发展的最终决定力量。","incorrect_statement":"阶级斗争是任何社会形态发展的唯一根本动力，生产力与社会基本矛盾无关紧要。","explanation":"根本动力、最终决定力量、具体阶段直接动力，指向不同理论层次。","necessary_conditions_and_boundaries":"固定完整主语，避免把各种“动力”当成同义标签。","example_or_counterexample":"课堂关系表必须保留社会基本矛盾运动的主语。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.25","module_id":"M7","title":"阶级斗争的适用范围","priority":"A","correct_statement":"阶级斗争是阶级社会发展的直接动力，这一表述不能删去阶级社会的限定。","incorrect_statement":"阶级斗争是包括无阶级社会在内的一切社会发展的直接动力。","explanation":"限定语决定命题适用范围，删除后改变命题内容。","necessary_conditions_and_boundaries":"不据此把现实中的所有问题都解释为阶级斗争。","example_or_counterexample":"适用于某类社会的动力表述，不能无限推广。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.26","module_id":"M7","title":"社会主义改革与制度性质","priority":"B","correct_statement":"社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力。","incorrect_statement":"社会主义改革的定义，就是从根本上推翻社会主义基本制度。","explanation":"改革针对不适应发展的具体体制机制，不等于更换基本制度的定义。","necessary_conditions_and_boundaries":"改革可深刻改变具体制度安排，不能由自我完善推出无实质变化。","example_or_counterexample":"完善运行机制可以释放发展动力，而不必改变基本制度性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.27","module_id":"M7","title":"人民群众与人数多数","priority":"A","correct_statement":"人民群众是推动社会历史发展的主体，不能机械等同于任何场合人数较多的一方。","incorrect_statement":"只要在某次争论中人数占多数，就自动成为真理和历史进步的决定标准。","explanation":"历史主体地位与一次投票人数、某个判断真假是不同问题。","necessary_conditions_and_boundaries":"群众的范围有历史性，劳动群众是主体部分。","example_or_counterexample":"多数人一时赞同某说法，不能替代实践检验。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.28","module_id":"M7","title":"群众创造物质精神财富","priority":"A","correct_statement":"人民群众创造物质财富、精神财富，并是社会变革的决定力量。","incorrect_statement":"精神财富只由少数名人创造，因此与群众实践和物质条件完全无关。","explanation":"个体创作有独特贡献，但其资料来源、社会经验与实现条件依赖广泛社会实践。","necessary_conditions_and_boundaries":"不能把群众创造机械理解成每件作品由所有人共同落笔。","example_or_counterexample":"作者署名与作品依托社会生活，两者可以同时成立。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.29","module_id":"M7","title":"群众与杰出个人","priority":"A","correct_statement":"承认群众创造历史，不排斥杰出个人的重要作用；个人作用受历史条件制约。","incorrect_statement":"承认群众创造历史，就必须否认任何个人对具体历史事件起过重要作用。","explanation":"整体社会实践提供基础，个人能组织、发现和选择，影响实现形式、速度和具体事件。","necessary_conditions_and_boundaries":"某些具体环节的关键甚至决定作用，不等于个人随意决定全部历史总趋势。","example_or_counterexample":"一个人的重要决策也要通过现实组织和社会条件才能实现。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"],"review_note":"考场口径：杰出人物对历史发展起重大推动作用，能加速或延缓历史进程，但只能对历史的发展起影响作用，不能决定历史发展的基本趋势；“决定作用”“决定力量”只用来说人民群众。本卡条件栏里“关键甚至决定作用”的说法不要照记。"},{"id":"M7.30","module_id":"M7","title":"历史合力与有意识活动","priority":"B","correct_statement":"历史由人的有意识活动形成，但总体结果不必完全等于任何个人的预定意图。","incorrect_statement":"每个人都有目的，所以社会历史的全部结果都能由某个人的意志任意决定。","explanation":"多种目的在既定条件中相互作用，形成超出个人预期的合力和客观结果。","necessary_conditions_and_boundaries":"客观规律通过人的活动实现，不等于历史无人参与而自动运行。","example_or_counterexample":"各方行动有目标，合成结果仍可能出乎所有单个参与者预料。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.31","module_id":"M7","title":"人的本质与社会关系","priority":"A","correct_statement":"人的本质在其现实性上是一切社会关系的总和，不能只用孤立生物属性解释人的社会性质。","incorrect_statement":"人的本质只由出生时的自然属性固定，社会关系和实践对它毫无影响。","explanation":"人的现实生活在生产、交往和制度关系中展开，社会性不能从孤立个体中完整推出。","necessary_conditions_and_boundaries":"这不否认人的自然属性，也不抹去个体差异。","example_or_counterexample":"同一个体进入不同社会关系，会承担不同角色与责任。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.32","module_id":"M7","title":"道德起源三个定位","priority":"A","correct_statement":"劳动是道德起源的首要前提，社会关系是客观条件，人的自我意识是主观条件。","incorrect_statement":"道德起源的首要前提是人的自我意识，劳动与社会关系都不需要。","explanation":"共同活动形成利益关系和调节需要，人又要能意识到自己与他人的关系，三者不能替换。","necessary_conditions_and_boundaries":"把起源问题与现代道德建设的具体规范区分。","example_or_counterexample":"仅有孤立偏好，不足以说明社会道德规范怎样形成。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.33","module_id":"M7","title":"道德与法律的历史关系","priority":"A","correct_statement":"道德与法律的产生和发展具有社会历史条件，不能说必须先有法律才可能有道德。","incorrect_statement":"没有成文法律以前，人类就不可能存在任何道德规范。","explanation":"社会关系调节可以通过习俗、评价和内心约束进行，不以成文法律先存在为必要条件。","necessary_conditions_and_boundaries":"只作一般起源辨析，不编造具体社会的年代断言。","example_or_counterexample":"共同生活可以形成互助义务和行为评价，而不必先有成文法条。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.34","module_id":"M7","title":"道德法律的区别与联系","priority":"A","correct_statement":"法律和道德都能规范行为，道德侧重教化与内心约束，法律具有国家强制保障。","incorrect_statement":"法律只与行为有关且完全没有思想引导作用，道德只管思想而从不规范行为。","explanation":"作用方式有差别但不能绝对割裂；法律也有教育导向，道德也评价实际行为。","necessary_conditions_and_boundaries":"不据此推导法律可以任意惩罚单纯思想。","example_or_counterexample":"遵守规则既可能受到制度约束，也可能出于道德认同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.35","module_id":"M7","title":"法治德治与互相替代","priority":"B","correct_statement":"法治与德治相辅相成，但道德评价不能任意替代法律规则，法律也不覆盖全部道德要求。","incorrect_statement":"凡道德上不赞同的行为，都必然已经违法，可以不经法律依据直接处罚。","explanation":"两种规范有联系又有范围和实施机制差别，不能把评价标准无条件互换。","necessary_conditions_and_boundaries":"本条是关系辨析，不提供具体案件法律判断。","example_or_counterexample":"某行为不够体贴，不会仅凭这一评价就自动构成违法。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]}],"questions":[{"id":"Q000ac9049a3c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.01"],"stem":"哲学是系统化、理论化的世界观，具有世界观不等于已经形成哲学体系。","answer":"正确","polarity":"正确句"},{"id":"Q34af8e3a27fd","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.01"],"stem":"任何零散的世界看法都已经是完整的哲学，而且凡哲学都天然科学。","answer":"错误","polarity":"易错句"},{"id":"Q869dbe8ea0f5","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.02"],"stem":"世界观决定方法论，方法论体现世界观，这是总体立场与一般方法原则的关系。","answer":"正确","polarity":"正确句"},{"id":"Qaa0abac2593c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.02"],"stem":"方法论决定世界观，世界观只是某个具体技巧的被动体现。","answer":"错误","polarity":"易错句"},{"id":"Q21841f81466f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.03"],"stem":"承认外部世界存在，尚不足以判定唯物主义，还须看是否承认物质第一性。","answer":"正确","polarity":"正确句"},{"id":"Q4da950927591","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.03"],"stem":"只要承认自然界存在，就必然属于唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Q4419d64a6d42","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.04"],"stem":"世界观是对世界的总看法，方法论是认识和改造世界的一般方法原则，二者相互联系。","answer":"正确","polarity":"正确句"},{"id":"Q5923c6862865","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.04"],"stem":"世界观就是某一道题的具体解法，方法论则是对世界的总看法。","answer":"错误","polarity":"易错句"},{"id":"Qd1880501564c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.05"],"stem":"哲学概括自然、社会和思维的一般问题，具体科学研究特定领域，二者可以相互促进。","answer":"正确","polarity":"正确句"},{"id":"Q82d8a0f6ee16","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.05"],"stem":"哲学能够替代各门具体科学，直接提供每个具体问题的答案。","answer":"错误","polarity":"易错句"},{"id":"Q38ab4c660e80","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.06"],"stem":"思维和存在何者第一性，与思维能否正确认识存在，是哲学基本问题的两个方面。","answer":"正确","polarity":"正确句"},{"id":"Q42e2d04446de","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.06"],"stem":"承认世界可以被认识，就已经回答了物质和意识何者第一性。","answer":"错误","polarity":"易错句"},{"id":"Q22841d975ff7","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.07"],"stem":"物质与意识何者第一性，是区分唯物主义和唯心主义的根本依据。","answer":"正确","polarity":"正确句"},{"id":"Q98debbb61b7b","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.07"],"stem":"是否承认意识有作用，是区分唯物主义和唯心主义的根本依据。","answer":"错误","polarity":"易错句"},{"id":"Qd403373e11d1","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.08"],"stem":"可知论肯定认识客观世界的可能性，承认当前认识有限不等于不可知论。","answer":"正确","polarity":"正确句"},{"id":"Q5acc406062e9","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.08"],"stem":"只要承认还有未知事物，就属于不可知论。","answer":"错误","polarity":"易错句"},{"id":"Q95d840d4b5cd","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.09"],"stem":"唯物唯心主要回答世界本原，辩证法与形而上学的对立主要涉及怎样理解联系、变化和矛盾。","answer":"正确","polarity":"正确句"},{"id":"Q8dcf068c440b","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.09"],"stem":"只要是唯物主义，就一定具有辩证的历史观和发展观。","answer":"错误","polarity":"易错句"},{"id":"Q76a639932434","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.10"],"stem":"把某种具体物质形态当作世界本原，是古代朴素唯物主义的典型局限。","answer":"正确","polarity":"正确句"},{"id":"Q2c4a23ced527","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.10"],"stem":"把水等具体物质形态当作世界本原，已经等于辩证唯物主义的物质范畴。","answer":"错误","polarity":"易错句"},{"id":"Qbaa291afb171","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.11"],"stem":"近代机械唯物主义具有机械性、形而上学性，以及历史观上的唯心主义局限。","answer":"正确","polarity":"正确句"},{"id":"Q43beacc9e01f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.11"],"stem":"近代机械唯物主义的主要问题，是完全不承认物质存在。","answer":"错误","polarity":"易错句"},{"id":"Q106ceeffbb37","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.12"],"stem":"把个人感觉、心灵等作为世界本原，属于主观唯心主义的典型立场。","answer":"正确","polarity":"正确句"},{"id":"Q857edfd66eb9","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.12"],"stem":"只要一句话出现“我”“心”或“感觉”，就属于主观唯心主义。","answer":"错误","polarity":"易错句"},{"id":"Q4e7cadc8e982","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.13"],"stem":"把独立于个人的理念、绝对精神等当作世界本原，是客观唯心主义的典型立场。","answer":"正确","polarity":"正确句"},{"id":"Q8f957aee06cf","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.13"],"stem":"客观唯心主义既然带有“客观”二字，就承认物质第一性。","answer":"错误","polarity":"易错句"},{"id":"Qb388399c6513","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.14"],"stem":"主观唯心主义与客观唯心主义都把精神放在本原位置，只是精神的理解不同。","answer":"正确","polarity":"正确句"},{"id":"Qb6d5e697f60f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.14"],"stem":"主观唯心主义以精神为本原，客观唯心主义则以物质为本原。","answer":"错误","polarity":"易错句"},{"id":"Q2e46dd2c745c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.15"],"stem":"科学性强调认识客观规律以及接受实践检验，不意味着理论体系拒绝发展。","answer":"正确","polarity":"正确句"},{"id":"Q18f0e5a9c0b7","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.15"],"stem":"科学性意味着现有理论已经穷尽世界，今后无需丰富发展。","answer":"错误","polarity":"易错句"},{"id":"Qc001caa553f3","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.16"],"stem":"人民性回答根本立场和为谁的问题，实践性强调理论与改变现实的实践相联系。","answer":"正确","polarity":"正确句"},{"id":"Qef0a7f4c743a","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.16"],"stem":"人民性和实践性是同一个概念，可以在任何表述中互换。","answer":"错误","polarity":"易错句"},{"id":"Q053f4dc6d031","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.17"],"stem":"强调科学性、人民性、实践性、发展性，不等于排斥马克思主义的革命性。","answer":"正确","polarity":"正确句"},{"id":"Q6affafb427af","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.17"],"stem":"教材归纳了四个主要特征，因此马克思主义不具有革命性。","answer":"错误","polarity":"易错句"},{"id":"Q65d7a5d7c868","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.18"],"stem":"德国古典哲学、英国古典政治经济学、英法空想社会主义是思想来源，不是马克思主义三个组成部分的名称。","answer":"正确","polarity":"正确句"},{"id":"Q66b63fbc5c55","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.18"],"stem":"德国古典哲学、英国古典政治经济学、英法空想社会主义就是马克思主义的三个组成部分。","answer":"错误","polarity":"易错句"},{"id":"Q9e17dd0d5b19","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.19"],"stem":"唯物史观和剩余价值学说被概括为马克思的两大发现；辩证唯物主义和历史唯物主义是其哲学的两个重要组成。","answer":"正确","polarity":"正确句"},{"id":"Q2a02edd9f57f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.19"],"stem":"马克思的两大发现就是辩证唯物主义和历史唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Qba253daa8b0f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.01"],"stem":"世界的统一性在于物质性，意识依赖物质，不等于意识本身与物质是同一范畴。","answer":"正确","polarity":"正确句"},{"id":"Q623cf6670010","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.01"],"stem":"世界统一于物质，所以任何意识内容本身都已经是一件物质实物。","answer":"错误","polarity":"易错句"},{"id":"Qcb3f6d6f82e2","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.02"],"stem":"意识对人体生理活动具有一定调节作用，但不能任意支配全部生理过程。","answer":"正确","polarity":"正确句"},{"id":"Q7a2311b903c5","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.02"],"stem":"意识具有能动作用，所以人的全部身体状态都完全由意志决定。","answer":"错误","polarity":"易错句"},{"id":"Q1f54aad3a973","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.03"],"stem":"哲学物质范畴概括各种具体物质形态共同具有的客观实在性。","answer":"正确","polarity":"正确句"},{"id":"Q8b5b197e8c3e","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.03"],"stem":"哲学物质就是某种最小粒子，粒子模型改变就证明物质不存在。","answer":"错误","polarity":"易错句"},{"id":"Q48e9bce8db27","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.04"],"stem":"客观实在性专用于说明物质不依赖意识而存在；不能由某种观念确实存在便把它判成物质。","answer":"正确","polarity":"正确句"},{"id":"Q93d622acc221","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.04"],"stem":"一种思想确实存在，所以这种思想本身就具有物质的客观实在性。","answer":"错误","polarity":"易错句"},{"id":"Q2e182e7590eb","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.05"],"stem":"物质的唯一特性是客观实在性，运动是物质的根本属性和存在方式。","answer":"正确","polarity":"正确句"},{"id":"Qebd90cfc1c9f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.05"],"stem":"物质的唯一特性是运动，客观实在性只是它的存在方式。","answer":"错误","polarity":"易错句"},{"id":"Q476c0a416544","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.06"],"stem":"运动是物质的运动，物质是运动着的物质，二者不能分离。","answer":"正确","polarity":"正确句"},{"id":"Qc416c9186853","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.06"],"stem":"可以承认完全没有任何运动的物质，同时坚持辩证唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Q2a269436a359","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.07"],"stem":"否认物质承担者而把运动说成精神自生的运动，会走向唯心主义。","answer":"正确","polarity":"正确句"},{"id":"Q8f9482895e43","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.07"],"stem":"承认运动而否认任何物质承担者，仍足以坚持物质第一性。","answer":"错误","polarity":"易错句"},{"id":"Qf6f326dfdee9","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.08"],"stem":"运动是绝对的，相对静止是物质运动在一定条件下的特殊状态。","answer":"正确","polarity":"正确句"},{"id":"Q821d0802b32b","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.08"],"stem":"相对静止就是一段时间内绝对不存在任何运动。","answer":"错误","polarity":"易错句"},{"id":"Q56c44f586d6c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.09"],"stem":"一定条件下相对位置不变，或事物根本性质暂时稳定，都可体现相对静止。","answer":"正确","polarity":"正确句"},{"id":"Q1db0b861e051","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.09"],"stem":"只有空间位置不动才叫相对静止，性质稳定与静止无关。","answer":"错误","polarity":"易错句"},{"id":"Q9e55bff1335a","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.10"],"stem":"否认绝对运动会走向形而上学，否认相对静止则难以把握事物的确定性。","answer":"正确","polarity":"正确句"},{"id":"Qafbcd1149300","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.10"],"stem":"承认运动绝对，就应否认事物具有任何相对确定的性质。","answer":"错误","polarity":"易错句"},{"id":"Qac17e0a6a32f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.11"],"stem":"时间和空间是运动着的物质的存在形式，不能把它们说成纯粹由个人意志创造。","answer":"正确","polarity":"正确句"},{"id":"Q203754f2b184","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.11"],"stem":"时间和空间是否存在，完全取决于个人是否正在感觉它们。","answer":"错误","polarity":"易错句"},{"id":"Qfc3881d0bfd2","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.12"],"stem":"人脑是意识的生理器官，客观存在是意识内容的来源。","answer":"正确","polarity":"正确句"},{"id":"Q5769f320d18b","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.12"],"stem":"人脑既是意识的生理器官，也是意识全部内容凭空产生的来源。","answer":"错误","polarity":"易错句"},{"id":"Q10220d9e2d5c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.13"],"stem":"意识是自然界长期发展的产物，也是社会实践发展的产物，劳动和语言具有重要作用。","answer":"正确","polarity":"正确句"},{"id":"Q12c7d0fc4931","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.13"],"stem":"意识完全是孤立大脑自然成熟的结果，与劳动、交往和语言无关。","answer":"错误","polarity":"易错句"},{"id":"Q5b9bd79e267d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.14"],"stem":"意识是客观存在的主观映象，内容有客观来源，反映形式具有主观性。","answer":"正确","polarity":"正确句"},{"id":"Q3dcd067162dd","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.14"],"stem":"意识既然反映客观存在，其形式就不具有任何主观性。","answer":"错误","polarity":"易错句"},{"id":"Qb63cbb2714d5","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.15"],"stem":"错误意识也是对客观存在的反映，只是反映可能歪曲、片面或错误组合。","answer":"正确","polarity":"正确句"},{"id":"Q5dc038947885","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.15"],"stem":"只有正确意识来源于客观存在，错误意识不需要任何现实来源。","answer":"错误","polarity":"易错句"},{"id":"Qb37d04c86046","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.16"],"stem":"意识依赖人脑的物质活动，但不能把意识内容直接等同于某种物质分泌物。","answer":"正确","polarity":"正确句"},{"id":"Q75a770c09fb0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.16"],"stem":"既然意识依赖人脑，意识与脑分泌出的物质就是同一种东西。","answer":"错误","polarity":"易错句"},{"id":"Q9b0ea0f081fc","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.17"],"stem":"意识能够选择、加工、预测和创造性构想，但其正确性仍受客观对象约束。","answer":"正确","polarity":"正确句"},{"id":"Q28076c894435","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.17"],"stem":"只要认识包含人的创造性加工，就一定属于唯心主义。","answer":"错误","polarity":"易错句"},{"id":"Q223bd291aedf","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.18"],"stem":"意识对改造客观世界的作用，要通过人的实践活动实现。","answer":"正确","polarity":"正确句"},{"id":"Qf3a0dc53cbf8","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.18"],"stem":"正确意识不经过任何实践，就能直接改变外部物质对象。","answer":"错误","polarity":"易错句"},{"id":"Q786cc7a54a7a","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.19"],"stem":"正确认识有利于实践，实际结果还受条件与实施过程制约。","answer":"正确","polarity":"正确句"},{"id":"Qde600d263c0d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.19"],"stem":"只要意识正确，无论物质条件如何都必然取得预期成功。","answer":"错误","polarity":"易错句"},{"id":"Q1fc3249a95db","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.20"],"stem":"规律揭示本质的、必然的、稳定的联系，不能把任何反复出现的表面现象直接当作规律。","answer":"正确","polarity":"正确句"},{"id":"Q306a9c5b4665","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.20"],"stem":"一种现象只要连续发生几次，就已经证明它是客观规律。","answer":"错误","polarity":"易错句"},{"id":"Qf88c7ffb3be6","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.21"],"stem":"人不能凭意志创造或取消客观规律，但可以认识规律并创造条件加以利用。","answer":"正确","polarity":"正确句"},{"id":"Q9a7b3ad2d3e0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.21"],"stem":"人可以利用规律，因此也能随意创造与取消客观规律。","answer":"错误","polarity":"易错句"},{"id":"Qeb81cc718093","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.22"],"stem":"规律具有客观性，不等于某种具体规律的适用条件和表现形式永远不变。","answer":"正确","polarity":"正确句","hold":"两句都可能把人带偏（核对人审读），暂停自动出题"},{"id":"Qe38e62fbc54c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.22"],"stem":"只要规律是客观的，其适用条件就不可能发生变化。","answer":"错误","polarity":"易错句","hold":"两句都可能把人带偏（核对人审读），暂停自动出题"},{"id":"Q4030943048fd","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.23"],"stem":"规律是客观联系，规则是人制定的行为或操作规范，规则应尊重客观条件。","answer":"正确","polarity":"正确句"},{"id":"Qd7f33d4a60a0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.23"],"stem":"既然规则能够被修改，就证明客观规律也能被任意修改。","answer":"错误","polarity":"易错句"},{"id":"Q9203a0c3a87d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.24"],"stem":"尊重客观规律是正确发挥主观能动性的前提，认识利用规律又需要发挥主观能动性。","answer":"正确","polarity":"正确句"},{"id":"Qc7b00e9b940f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.24"],"stem":"尊重客观规律意味着人只能被动等待，不能主动改变条件。","answer":"错误","polarity":"易错句"},{"id":"Q42118fcd6970","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.01"],"stem":"质变结束原有性质下的量变，并为新性质基础上的量变创造条件。","answer":"正确","polarity":"正确句"},{"id":"Q290e0bccdddf","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.01"],"stem":"一旦发生质变，事物的数量、规模等就永远不再变化。","answer":"错误","polarity":"易错句"},{"id":"Q15d73b9425d2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.02"],"stem":"联系具有普遍性，但具体事物间的具体联系需要相应条件和依据。","answer":"正确","polarity":"正确句"},{"id":"Qbd6caff29cc2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.02"],"stem":"联系具有普遍性，所以任意两个事物之间必有直接联系。","answer":"错误","polarity":"易错句"},{"id":"Q969a6a3df660","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.03"],"stem":"人可以依据客观条件建立新的具体联系，这不否认联系的客观性。","answer":"正确","polarity":"正确句"},{"id":"Q064c4e3d7d36","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.03"],"stem":"只要某种联系是人建立的，它就一定是主观虚构的联系。","answer":"错误","polarity":"易错句"},{"id":"Q94792bb762b6","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.04"],"stem":"具体联系有条件且形式多样，并非所有联系都是因果联系。","answer":"正确","polarity":"正确句"},{"id":"Q30f3b2a505aa","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.04"],"stem":"只要两个对象存在联系，就必然是一方直接造成另一方。","answer":"错误","polarity":"易错句"},{"id":"Q3d26c2d1bd33","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.05"],"stem":"整体由部分构成，部分存在于整体中，二者不能简单等同于共性与个性。","answer":"正确","polarity":"正确句"},{"id":"Q1e889075cd46","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.05"],"stem":"整体与部分就是普遍性与特殊性，两组概念可以随意互换。","answer":"错误","polarity":"易错句"},{"id":"Q57bf7f86fdbf","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.06"],"stem":"整体居于主导地位，同时部分的功能及变化能够影响整体。","answer":"正确","polarity":"正确句"},{"id":"Q13b6d7c69956","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.06"],"stem":"整体居于主导地位，所以任何部分变化都不可能影响整体。","answer":"错误","polarity":"易错句"},{"id":"Q5c612dec7923","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.07"],"stem":"关键部分在一定条件下可以对整体功能产生决定性影响。","answer":"正确","polarity":"正确句"},{"id":"Q04e66749d7ed","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.07"],"stem":"任何部分在任何条件下都决定整体，整体服从部分。","answer":"错误","polarity":"易错句"},{"id":"Qe1d06d4a88c3","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.08"],"stem":"部分以合理结构形成有机整体时，整体功能可能大于部分功能之和。","answer":"正确","polarity":"正确句"},{"id":"Qdcd6f87a6cb0","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.08"],"stem":"任何整体的功能都必然大于部分功能之和。","answer":"错误","polarity":"易错句"},{"id":"Qc9df540674ee","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.09"],"stem":"系统优化要求统筹要素关系，局部最优不必自动构成整体最优。","answer":"正确","polarity":"正确句"},{"id":"Q74e2ceeea712","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.09"],"stem":"只要每个局部各自达到最优，整体就一定最优。","answer":"错误","polarity":"易错句"},{"id":"Qb7051f7192bc","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.10"],"stem":"发展是具有前进上升方向的变化，并非一切运动变化都是发展。","answer":"正确","polarity":"正确句"},{"id":"Q10d25f84706d","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.10"],"stem":"凡是发生了变化，就一定属于发展。","answer":"错误","polarity":"易错句"},{"id":"Q9a1bc39c0fa6","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.11"],"stem":"新旧事物要看是否符合发展的必然趋势，不能只按出现时间和一时力量大小判断。","answer":"正确","polarity":"正确句"},{"id":"Qbb11f23a0e0b","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.11"],"stem":"后出现、宣传新颖或当前力量强大的事物，一定是哲学上的新事物。","answer":"错误","polarity":"易错句"},{"id":"Q83699c210dca","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.12"],"stem":"新事物成长可以经历曲折和暂时挫折，不能因一时弱小就判定没有发展前途。","answer":"正确","polarity":"正确句"},{"id":"Q2f51a9dafce4","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.12"],"stem":"新事物必然在每个阶段、每次竞争中立即战胜旧事物。","answer":"错误","polarity":"易错句"},{"id":"Qad88756c441d","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.13"],"stem":"数量增减和构成要素排列次序的变化，都可能是量变的表现形式。","answer":"正确","polarity":"正确句"},{"id":"Q0d050c369b2b","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.13"],"stem":"量变只能是数量增加，结构排列变化一概不是量变。","answer":"错误","polarity":"易错句"},{"id":"Q6306e030f5ec","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.14"],"stem":"质变的判断关键是根本性质是否变化，不能只按外观变化大小判断。","answer":"正确","polarity":"正确句"},{"id":"Qe79334304d4a","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.14"],"stem":"外观变化越明显就越是质变，外观不明显就不可能发生质变。","answer":"错误","polarity":"易错句"},{"id":"Q20c7c31eefa7","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.15"],"stem":"度是事物保持其质的量的限度，是否超出度是区分量变与质变的重要依据。","answer":"正确","polarity":"正确句"},{"id":"Qcc464eeec455","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.15"],"stem":"度是任意人为规定的目标值，与事物性质是否保持无关。","answer":"错误","polarity":"易错句"},{"id":"Q5744645427b2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.16"],"stem":"量变是质变的必要准备，量变达到一定程度并具备相应条件才会发生质变。","answer":"正确","polarity":"正确句"},{"id":"Q5c0ea0670556","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.16"],"stem":"只要有任何数量变化，就已经必然发生质变。","answer":"错误","polarity":"易错句"},{"id":"Qea19f68ed642","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.17"],"stem":"质变可以表现为进步或倒退，不能把所有质变都等同于发展。","answer":"正确","polarity":"正确句"},{"id":"Q6be24c9ca3d5","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.17"],"stem":"发生质变就说明事物一定进步了。","answer":"错误","polarity":"易错句"},{"id":"Q23d4a85c5869","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.18"],"stem":"总体量变过程中可以包含局部性质变化，整体层次与局部层次要区分。","answer":"正确","polarity":"正确句"},{"id":"Q9b51a7e644f3","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.18"],"stem":"只要局部发生任何质变，就能断定研究对象整体已经质变。","answer":"错误","polarity":"易错句"},{"id":"Q04b8a8fa3f97","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.19"],"stem":"肯定因素维持事物现有性质，否定因素推动其突破现有性质，二者是事物内部的方面。","answer":"正确","polarity":"正确句"},{"id":"Q1e1d8f366a53","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.19"],"stem":"哲学的肯定与否定，就是个人赞成和反对某件事的态度。","answer":"错误","polarity":"易错句"},{"id":"Qee7e3403bb08","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.20"],"stem":"辩证否定是事物内部矛盾推动的自我否定，是发展和联系的环节。","answer":"正确","polarity":"正确句"},{"id":"Q1e019ccc61ac","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.20"],"stem":"只要外力把某物彻底毁掉，就完整体现了辩证否定的实质。","answer":"错误","polarity":"易错句"},{"id":"Q3406ca1318ef","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.21"],"stem":"扬弃是克服旧事物中的消极因素并保留、改造积极因素，不是全盘抛弃。","answer":"正确","polarity":"正确句"},{"id":"Q0cc536b5f826","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.21"],"stem":"扬弃就是把旧事物所有内容一律清除。","answer":"错误","polarity":"易错句"},{"id":"Q92147f4310a0","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.22"],"stem":"否定之否定所体现的回复，包含在更高阶段上对某些因素的重新肯定，不是原样返回起点。","answer":"正确","polarity":"正确句"},{"id":"Q6ede0b57a885","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.22"],"stem":"否定两次以后，事物必然完全恢复原来的状态。","answer":"错误","polarity":"易错句"},{"id":"Q1b9e102e312c","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.23"],"stem":"发展总体的前进趋势可以通过曲折过程实现，不要求每一步都上升。","answer":"正确","polarity":"正确句"},{"id":"Q2de6fed1a53a","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.23"],"stem":"既然发展是前进的，任何暂时倒退都足以否定发展趋势。","answer":"错误","polarity":"易错句"},{"id":"Qfc5ca97846b1","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.24"],"stem":"对立统一规律揭示发展的源泉和动力，质量互变规律揭示发展的形式和状态，否定之否定规律揭示发展的方向和道路。","answer":"正确","polarity":"正确句"},{"id":"Qc77e6d8aeb84","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.24"],"stem":"否定之否定主要揭示发展的根本动力，对立统一只说明数量积累。","answer":"错误","polarity":"易错句"},{"id":"Q27bcd763b783","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.01"],"stem":"对立统一规律是唯物辩证法的实质和核心，矛盾普遍性与特殊性的关系是矛盾问题的精髓。","answer":"正确","polarity":"正确句"},{"id":"Q813dab1bd2fe","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.01"],"stem":"唯物辩证法的实质核心是量变积累，矛盾问题的精髓是所有矛盾完全相同。","answer":"错误","polarity":"易错句"},{"id":"Qb7d1b8365934","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.02"],"stem":"哲学矛盾指事物内部或事物之间的对立统一关系，不等于同一条件下自相矛盾的判断。","answer":"正确","polarity":"正确句"},{"id":"Q4096a09cc35a","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.02"],"stem":"坚持矛盾观点，意味着可以把同一条件下相互否定的两个判断都当作正确。","answer":"错误","polarity":"易错句"},{"id":"Qa081b33ccf40","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.03"],"stem":"矛盾同一性包括相互依存，以及在一定条件下相互贯通、转化。","answer":"正确","polarity":"正确句"},{"id":"Qb056744b9a92","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.03"],"stem":"矛盾同一性意味着双方在性质、作用和立场上完全相同。","answer":"错误","polarity":"易错句"},{"id":"Q58f50a8d139b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.04"],"stem":"斗争性指矛盾双方相互排斥、相互否定的属性，其表现形式可以不同。","answer":"正确","polarity":"正确句"},{"id":"Q50d5b4798feb","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.04"],"stem":"只有发生公开争吵或暴力冲突，才能说明矛盾具有斗争性。","answer":"错误","polarity":"易错句"},{"id":"Q5c3cf7bbb86a","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.05"],"stem":"同一性与斗争性共同推动事物发展，不能把其中一方完全排除。","answer":"正确","polarity":"正确句"},{"id":"Q5d1e6de10bb6","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.05"],"stem":"只有斗争性推动发展，同一性对发展没有作用。","answer":"错误","polarity":"易错句"},{"id":"Qb6c278b5c6e1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.06"],"stem":"同一性具有相对性和条件性；斗争性的绝对性指矛盾双方相互排斥的性质贯穿矛盾运动过程，不意味着具体矛盾或斗争形式永远不变。","answer":"正确","polarity":"正确句"},{"id":"Q3931c4e73145","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.06"],"stem":"斗争性绝对，所以任何具体斗争形式都不受条件限制并永远不变。","answer":"错误","polarity":"易错句"},{"id":"Q68ece1dc9fc4","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.07"],"stem":"矛盾斗争性寓于同一性之中，双方在一定统一关系中相互排斥。","answer":"正确","polarity":"正确句"},{"id":"Q9e241bbc4ab9","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.07"],"stem":"斗争性可以完全脱离双方的统一关系而独立存在。","answer":"错误","polarity":"易错句"},{"id":"Qb6bf2c0b5a65","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.08"],"stem":"矛盾普遍性要求承认矛盾存在于事物及其发展过程中，不等于每个具体矛盾永远不变。","answer":"正确","polarity":"正确句"},{"id":"Q6067c83dbf5b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.08"],"stem":"既然矛盾普遍存在，任何具体矛盾都不可能被解决。","answer":"错误","polarity":"易错句"},{"id":"Q162571441786","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.09"],"stem":"不同事物、同一事物不同阶段，以及同一矛盾不同方面，都可有各自特点。","answer":"正确","polarity":"正确句"},{"id":"Q0d711c6c871d","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.09"],"stem":"矛盾特殊性只指不同事物之间有差异，同一事物各阶段没有特殊性。","answer":"错误","polarity":"易错句"},{"id":"Q0b06504ffa8f","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.10"],"stem":"矛盾普遍性寓于特殊性之中，并通过特殊性表现出来。","answer":"正确","polarity":"正确句"},{"id":"Q2f949d4020e5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.10"],"stem":"普遍性在特殊性之外单独存在，具体对象可以完全不包含共性。","answer":"错误","polarity":"易错句"},{"id":"Q18ffc0181c44","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.11"],"stem":"共性个性描述属性的一般与特殊，整体部分描述对象的构成，二者不能互换。","answer":"正确","polarity":"正确句"},{"id":"Q912094bf7b84","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.11"],"stem":"某种普遍属性就是一个整体，各具体对象就是它的组成零件。","answer":"错误","polarity":"易错句"},{"id":"Q480ded052160","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.12"],"stem":"同一认识在不同范围的比较中，可以表现为相对普遍或相对特殊。","answer":"正确","polarity":"正确句"},{"id":"Q6571ed46d1c0","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.12"],"stem":"某一属性只要曾被称为普遍性，在任何研究范围中都永远是普遍性。","answer":"错误","polarity":"易错句"},{"id":"Q4adb16098030","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.13"],"stem":"在复杂事物的诸多矛盾中，主要矛盾在一定阶段处于支配地位，对发展起决定作用。","answer":"正确","polarity":"正确句"},{"id":"Q13c764f3f60c","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.13"],"stem":"主要矛盾就是同一个矛盾中占优势的那一方。","answer":"错误","polarity":"易错句"},{"id":"Q5ffa2a6474c1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.14"],"stem":"矛盾主要方面是在同一矛盾中处于支配地位、起主导作用的方面。","answer":"正确","polarity":"正确句"},{"id":"Qf6d03f6b63e5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.14"],"stem":"矛盾主要方面是许多矛盾中最需要优先解决的那一组矛盾。","answer":"错误","polarity":"易错句"},{"id":"Q18a37c48797c","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.15"],"stem":"复杂事物的性质，主要由其主要矛盾的主要方面规定。","answer":"正确","polarity":"正确句"},{"id":"Q01e8ded78690","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.15"],"stem":"事物性质主要由某个次要矛盾的任何一方规定，与主要矛盾无关。","answer":"错误","polarity":"易错句"},{"id":"Q2aefe6c904cb","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.16"],"stem":"根本矛盾贯穿事物发展过程并规定根本性质；主要矛盾着眼某一阶段诸矛盾中的支配地位。","answer":"正确","polarity":"正确句"},{"id":"Q0f8279bac962","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.16"],"stem":"根本矛盾和主要矛盾在任何情形下都是完全同义词。","answer":"错误","polarity":"易错句"},{"id":"Q8b9016606e05","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.17"],"stem":"两点论要求兼顾主要矛盾和次要矛盾、同一矛盾的主要方面和次要方面；重点论要求着重把握主要矛盾和矛盾的主要方面。","answer":"正确","polarity":"正确句"},{"id":"Q23600940a6f5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.17"],"stem":"两点论要求对所有方面平均用力，重点论要求完全忽略次要方面。","answer":"错误","polarity":"易错句"},{"id":"Q8cace481cf58","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.18"],"stem":"内因是事物变化的根据，外因是条件，外因通过内因起作用。","answer":"正确","polarity":"正确句"},{"id":"Qfbbecb89b87b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.18"],"stem":"内因是变化根据，所以任何外部条件都没有实际作用。","answer":"错误","polarity":"易错句"},{"id":"Q795f44c5009d","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.19"],"stem":"内外因要依据所研究事物的边界和矛盾关系判断，不能只凭肉眼空间位置分类。","answer":"正确","polarity":"正确句"},{"id":"Q9e2dfbfd64bc","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.19"],"stem":"某因素只要在身体或场地内部，就必然是研究对象的根本内因。","answer":"错误","polarity":"易错句"},{"id":"Qb327331e7dbc","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.20"],"stem":"矛盾双方及主次关系可以在一定条件下转化，转化需要实际条件。","answer":"正确","polarity":"正确句"},{"id":"Q83c7406b6b87","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.20"],"stem":"矛盾双方既然能转化，就可以任意转化成任何互不相关的事物。","answer":"错误","polarity":"易错句"},{"id":"Q1df76e6d8601","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.21"],"stem":"一切从实际出发主要联系物质决定意识；具体问题具体分析主要联系矛盾特殊性；实事求是强调从客观实际出发探求并遵循客观规律。","answer":"正确","polarity":"正确句"},{"id":"Q5281885850d1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.21"],"stem":"具体问题具体分析的直接理论依据是所有事物完全相同、没有特殊性。","answer":"错误","polarity":"易错句"},{"id":"Q0f53ae88d83f","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.01"],"stem":"因果关系的核心是引起与被引起，先后相继或同时变化本身不足以证明因果。","answer":"正确","polarity":"正确句"},{"id":"Q2b7f75381dd0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.01"],"stem":"只要一件事发生在另一件事之前，前者就是后者的原因。","answer":"错误","polarity":"易错句"},{"id":"Q3b4402341045","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.02"],"stem":"一个结果可以在另一段联系中成为原因，反馈不等于颠倒同一具体因果关系。","answer":"正确","polarity":"正确句"},{"id":"Qca32c45b5648","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.02"],"stem":"结果能反作用于原因，所以后发生的事件可以随意造成已经发生的过去事件。","answer":"错误","polarity":"易错句"},{"id":"Q722bc2de63f1","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.03"],"stem":"偶然事件可以有原因，有原因不等于它是所研究发展过程中的必然环节。","answer":"正确","polarity":"正确句"},{"id":"Q88a788c50784","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.03"],"stem":"凡能找到原因的事件都必然发生，偶然性只等于不知道原因。","answer":"错误","polarity":"易错句"},{"id":"Q20341312bc16","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.04"],"stem":"必然趋势通过具体的偶然形式实现，不等于每个具体偶然事件都非发生不可。","answer":"正确","polarity":"正确句"},{"id":"Q55b831be424b","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.04"],"stem":"必然性通过偶然性表现，所以任何已经发生的偶然事件都必然只能这样发生。","answer":"错误","polarity":"易错句"},{"id":"Q0587edbee631","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.05"],"stem":"偶然性不等于无影响，必然性也不能只按发生次数或概率高低判断。","answer":"正确","polarity":"正确句"},{"id":"Q2b60e8576ab2","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.05"],"stem":"偶然事件影响一定很小，次数多的现象就自动成为必然规律。","answer":"错误","polarity":"易错句"},{"id":"Q8574366e1dfe","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.06"],"stem":"可能性有现实根据但尚未实现，现实性指已经实际存在的状态。","answer":"正确","polarity":"正确句"},{"id":"Qb7b0eb4e25a0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.06"],"stem":"只要一个设想在脑中能够被想象，它就必然具有客观可能性。","answer":"错误","polarity":"易错句"},{"id":"Qf7b20a03991e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.07"],"stem":"现实可能与抽象可能主要依据现实根据及必要条件是否具备区分。","answer":"正确","polarity":"正确句"},{"id":"Qd5fa0a223510","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.07"],"stem":"发生概率低的都是抽象可能，发生概率高的都是现实可能。","answer":"错误","polarity":"易错句"},{"id":"Q071bdd7047cc","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.08"],"stem":"在人有目的的活动中，实践可以促使可能转为现实，但自然过程也有可能向现实的转化。","answer":"正确","polarity":"正确句"},{"id":"Q8f8fde8aa3b6","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.08"],"stem":"任何可能转为现实都必须先有人类意识和人的实践参与。","answer":"错误","polarity":"易错句"},{"id":"Qd79910bff7ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.09"],"stem":"内容是构成事物的要素和过程等，形式是其组织结构及表现方式。","answer":"正确","polarity":"正确句"},{"id":"Q458ddd41940e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.09"],"stem":"形式只指外观装饰，任何内部组织结构都不属于形式。","answer":"错误","polarity":"易错句"},{"id":"Q840e46f95a1c","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.10"],"stem":"内容决定形式，形式有相对独立性并能反作用于内容。","answer":"正确","polarity":"正确句"},{"id":"Q7d199050192b","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.10"],"stem":"内容决定形式，所以同一内容只能有唯一一种表达和组织方式。","answer":"错误","polarity":"易错句"},{"id":"Q201984aa70ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.11"],"stem":"内容形式着眼构成和组织，本质现象着眼内在根本性质和外在表现。","answer":"正确","polarity":"正确句"},{"id":"Q8231918f8b2c","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.11"],"stem":"内容完全等于本质，形式完全等于现象，两组词可以随意替换。","answer":"错误","polarity":"易错句"},{"id":"Qc260255233ff","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.12"],"stem":"现象与本质都属于事物自身的方面，不能把现象直接等同于主观感觉。","answer":"正确","polarity":"正确句"},{"id":"Qaea1d4fbdcb1","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.12"],"stem":"只有本质是客观的，任何现象都只是人的主观想象。","answer":"错误","polarity":"易错句"},{"id":"Q0f17adc5b944","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.13"],"stem":"假象是具有迷惑性的客观现象，错觉是主体产生的错误知觉。","answer":"正确","polarity":"正确句"},{"id":"Q42f997729c5a","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.13"],"stem":"假象和错觉都只是主观认识，与客观呈现没有区别。","answer":"错误","polarity":"易错句"},{"id":"Q009dd474d1e8","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.14"],"stem":"假象仍以歪曲、颠倒的方式表现本质，并非与真实过程毫无联系。","answer":"正确","polarity":"正确句"},{"id":"Qb02ad3166175","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.14"],"stem":"假象既然能误导人，就完全不表现本质，也没有研究价值。","answer":"错误","polarity":"易错句"},{"id":"Q5e1803f4438a","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.15"],"stem":"在本组规范表述中，现象表现本质，认识反映对象，二者说的是不同关系。","answer":"正确","polarity":"正确句"},{"id":"Qa3bad2c02205","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.15"],"stem":"现象就是人的认识，因此现象与本质的关系就是主体与客体的关系。","answer":"错误","polarity":"易错句"},{"id":"Q635571fb6a54","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.16"],"stem":"现象本质有区别使深入研究成为必要，二者有联系使由现象认识本质成为可能。","answer":"正确","polarity":"正确句"},{"id":"Qe2437843994e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.16"],"stem":"现象与本质毫无关系，反而保证人可以通过现象认识本质。","answer":"错误","polarity":"易错句"},{"id":"Q972f0dd98afe","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.17"],"stem":"主观辩证法是思维中对客观辩证运动的反映，不能与主观唯心主义等同。","answer":"正确","polarity":"正确句"},{"id":"Q584218987cce","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.17"],"stem":"主观辩证法因为发生在思维中，所以必然否认客观世界。","answer":"错误","polarity":"易错句"},{"id":"Q0f5a5f5d8db7","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.18"],"stem":"分析分解对象的要素方面，综合在把握其联系的基础上形成整体认识。","answer":"正确","polarity":"正确句"},{"id":"Qcb258d35da3e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.18"],"stem":"综合就是把互不相干的材料堆在一起，完全不必研究相互关系。","answer":"错误","polarity":"易错句"},{"id":"Q2246ad3d0b39","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.19"],"stem":"教材常用个别到一般识别归纳、一般到个别识别演绎，可靠演绎还须前提真实与形式有效。","answer":"正确","polarity":"正确句"},{"id":"Qf086145e35ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.19"],"stem":"只要推理是演绎形式，即使前提错误也必然保证结论正确。","answer":"错误","polarity":"易错句"},{"id":"Q85999a0697e0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.20"],"stem":"分析综合着眼分解与联系，归纳演绎着眼一般与个别的推理，二者可以在研究中交叉使用。","answer":"正确","polarity":"正确句"},{"id":"Q2af8ce9849d3","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.20"],"stem":"把一个对象分成三个方面研究，就已经必然完成了从个别到一般的归纳。","answer":"错误","polarity":"易错句"},{"id":"Q37bff0374473","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.01"],"stem":"认识是在实践基础上主体对客体的能动反映，不是机械照相，也不是脱离客体的自生。","answer":"正确","polarity":"正确句"},{"id":"Q21ece88cc098","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.01"],"stem":"主体会选择和加工材料，所以认识可以完全不受客体制约。","answer":"错误","polarity":"易错句"},{"id":"Q6fbfa3c39bb5","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.02"],"stem":"实践是人能动改造客观世界的物质活动，纯粹在脑中设想不自动等于实践。","answer":"正确","polarity":"正确句"},{"id":"Q2d4ce78e1507","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.02"],"stem":"只要人在认真思考，无论是否发生客观活动，都已经等同于实践。","answer":"错误","polarity":"易错句"},{"id":"Q42b3c350f87f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.03"],"stem":"实践的基本形式包括物质生产实践、社会政治实践和科学文化实践，科学实验属于科学文化实践。","answer":"正确","polarity":"正确句"},{"id":"Q452ffe8504d2","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.03"],"stem":"只有体力生产劳动才属于实践，科学实验不属于实践。","answer":"错误","polarity":"易错句"},{"id":"Q1273a7f99d90","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.04"],"stem":"实践的目的可以具有主观性，活动仍受客观对象、手段和条件制约。","answer":"正确","polarity":"正确句"},{"id":"Q79f044ee21ca","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.04"],"stem":"实践有目的有计划，所以它不具有客观物质性。","answer":"错误","polarity":"易错句"},{"id":"Q9b9604e15585","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.05"],"stem":"实践具有直接现实性，指它实际作用于现实，不保证预想目标必然实现。","answer":"正确","polarity":"正确句"},{"id":"Q8d565f93dbe0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.05"],"stem":"实践具有直接现实性，意味着只要付诸行动就一定成功。","answer":"错误","polarity":"易错句"},{"id":"Qe3af92e93c88","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.06"],"stem":"单个人的实践也依赖社会积累和历史条件，不因独自操作就失去社会性。","answer":"正确","polarity":"正确句"},{"id":"Q1e8573a33306","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.06"],"stem":"一个人独立完成实验，就说明该实践完全没有社会历史性。","answer":"错误","polarity":"易错句"},{"id":"Q594bb300aa42","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.07"],"stem":"实践是认识的来源，直接经验与间接经验是个人获取知识的不同途径。","answer":"正确","polarity":"正确句"},{"id":"Qeb91df77c4e0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.07"],"stem":"个人从书上学到知识，就证明认识存在一个完全脱离实践的第二来源。","answer":"错误","polarity":"易错句"},{"id":"Q5c6dc2012f29","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.08"],"stem":"来自实践的认识仍可能片面或错误，来源于实践不自动保证认识正确。","answer":"正确","polarity":"正确句"},{"id":"Q5ca0ea37a690","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.08"],"stem":"只要某结论是在实践中形成的，它就不需要再接受检验。","answer":"错误","polarity":"易错句"},{"id":"Q0b183f4de11b","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.09"],"stem":"实践提供认识材料，也提出新问题、提供工具并推动认识发展，来源与动力各有侧重。","answer":"正确","polarity":"正确句"},{"id":"Q9f5936b87c45","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.09"],"stem":"实践是认识的动力，只是说材料从实践中来，不包括问题与工具的发展。","answer":"错误","polarity":"易错句"},{"id":"Q8744980bb605","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.10"],"stem":"认识的根本任务是透过现象把握本质规律，根本目的是指导实践、改造世界。","answer":"正确","polarity":"正确句"},{"id":"Q1e7ba2e39f1a","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.10"],"stem":"认识的根本目的只是形成理论，理论形成后与实践再无关系。","answer":"错误","polarity":"易错句"},{"id":"Qd6f61fda69c7","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.11"],"stem":"感性和理性区分认识层次，二者都可能正确或错误。","answer":"正确","polarity":"正确句"},{"id":"Q44218ca7d021","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.11"],"stem":"理性认识处于高级阶段，所以理性认识一律正确。","answer":"错误","polarity":"易错句"},{"id":"Qe24fbaa30e4e","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.12"],"stem":"感觉、知觉、表象属于感性认识，表象可在对象不在眼前时再现具体形象。","answer":"正确","polarity":"正确句"},{"id":"Qdeac8a1047b5","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.12"],"stem":"对象不在眼前时产生的任何脑中形象，都已经属于理性认识。","answer":"错误","polarity":"易错句"},{"id":"Qacbb2d2db65d","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.13"],"stem":"概念、判断、推理属于理性认识的基本形式。","answer":"正确","polarity":"正确句"},{"id":"Qa6a9cf870b51","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.13"],"stem":"表象、判断、推理都是理性认识，感觉和概念则属于感性认识。","answer":"错误","polarity":"易错句"},{"id":"Qd660229c1c8f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.14"],"stem":"理性依赖感性材料，感性有待深化为理性，二者相互渗透并统一于实践。","answer":"正确","polarity":"正确句"},{"id":"Q5ce84af8be66","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.14"],"stem":"感性阶段必须完全没有思考，理性阶段必须完全排除感性因素。","answer":"错误","polarity":"易错句"},{"id":"Q52bbb44c3cbc","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.15"],"stem":"在实践基础上从感性认识上升为理性认识是第一次认识飞跃；要获得正确理性认识，需要充分可靠的感性材料和科学的思维加工。","answer":"正确","polarity":"正确句"},{"id":"Q37ebce241579","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.15"],"stem":"感性材料只要积累得足够多，就会自动生成正确理论，无需思考加工。","answer":"错误","polarity":"易错句"},{"id":"Q6535d5639f36","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.16"],"stem":"认识回到实践能实现认识目的并检验、发展认识，因此第二次飞跃具有更重要的意义。","answer":"正确","polarity":"正确句"},{"id":"Q17ae17aa0e25","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.16"],"stem":"第二次飞跃更重要，说明第一阶段形成认识可以完全省略。","answer":"错误","polarity":"易错句"},{"id":"Q162fbd3fcda9","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.17"],"stem":"认识可能多次经历实践与认识的往返，但可以保留成果并逐步深化。","answer":"正确","polarity":"正确句"},{"id":"Q98a75e8b84e7","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.17"],"stem":"认识的反复性意味着每次都必须否定全部旧认识并回到零点。","answer":"错误","polarity":"易错句"},{"id":"Qff2b7a0be288","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.18"],"stem":"人类认识可以不断发展，某个具体问题仍可能在明确条件下获得可靠答案。","answer":"正确","polarity":"正确句"},{"id":"Q840c7dd54623","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.18"],"stem":"认识没有最终终点，所以任何具体问题都永远不可能确定。","answer":"错误","polarity":"易错句"},{"id":"Q4bab631b0585","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.19"],"stem":"真理属于认识，形式具有主观性，其正确内容及最终检验标准具有客观性。","answer":"正确","polarity":"正确句"},{"id":"Q952f1c28e082","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.19"],"stem":"真理既然客观，就必然是一件不属于认识的物质物品。","answer":"错误","polarity":"易错句"},{"id":"Q33aa64150f21","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.20"],"stem":"同一对象、同一条件、同一方面的相互矛盾判断，不能仅因主体不同就都是真理。","answer":"正确","polarity":"正确句"},{"id":"Qe780c519b5fa","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.20"],"stem":"不同人观点不同，因此对同一事实的互相否定判断都可以各自为真。","answer":"错误","polarity":"易错句"},{"id":"Q37161de48dfa","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.21"],"stem":"同一真理既包含确定的客观正确内容，又具有范围、条件和认识程度的有限性。","answer":"正确","polarity":"正确句"},{"id":"Qa1d521302e40","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.21"],"stem":"真理分为两种互斥类型，一种绝对真理完全不相对，另一种相对真理完全不绝对。","answer":"错误","polarity":"易错句"},{"id":"Qdfa05491fac1","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.22"],"stem":"真理相对性强调正确认识的有限性，不等于没有客观正确内容或真假各半。","answer":"正确","polarity":"正确句"},{"id":"Qe5fb56f91f06","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.22"],"stem":"任何真理都有相对性，所以都可以按个人喜好改成相反说法。","answer":"错误","polarity":"易错句"},{"id":"Qd12fbc46cce8","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.23"],"stem":"把在特定条件下成立的认识推广到不适用的条件，可能形成谬误。","answer":"正确","polarity":"正确句"},{"id":"Q1b425524bbde","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.23"],"stem":"一项认识只要在一个条件下成立，就在所有条件下都必然成立。","answer":"错误","polarity":"易错句"},{"id":"Qd64aaf95f5f0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.24"],"stem":"真理与谬误在一定条件下可以转化，但不能在对象条件完全不变时任意混同真假。","answer":"正确","polarity":"正确句"},{"id":"Qef4cd37b3329","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.24"],"stem":"承认真理谬误可以转化，就意味着同一命题在同一条件下既真又假。","answer":"错误","polarity":"易错句"},{"id":"Q92f8b03e660e","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.25"],"stem":"实践是检验认识真理性的唯一标准，逻辑证明发挥重要作用但不能取代最终实践检验。","answer":"正确","polarity":"正确句"},{"id":"Q0e0a731d7d16","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.25"],"stem":"只要理论内部逻辑一致，就无须检验其经验前提是否符合现实。","answer":"错误","polarity":"易错句"},{"id":"Q010901f7f085","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.26"],"stem":"实践标准地位确定，具体实践受条件限制、检验能力可能不充分，二者可以统一。","answer":"正确","polarity":"正确句"},{"id":"Q7e8a3770789b","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.26"],"stem":"实践标准有不确定性，所以在任何时候都无法区分真理与谬误。","answer":"错误","polarity":"易错句"},{"id":"Qf2301b525ea9","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.27"],"stem":"一次成功只支持与其具体条件和检验范围相应的结论，不能自动证明整套解释全部正确。","answer":"正确","polarity":"正确句"},{"id":"Q10d9fe1a506d","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.27"],"stem":"一个错误方法碰巧得到正确结果，就证明该方法的全部解释都是真理。","answer":"错误","polarity":"易错句"},{"id":"Qcf87cfaa535f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.28"],"stem":"真理评价关心是否符合对象，价值评价关心对象对主体需要和发展的意义。","answer":"正确","polarity":"正确句"},{"id":"Qeecbdff6bf94","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.28"],"stem":"某种说法对某人有用，就证明它所描述的事实一定真实。","answer":"错误","polarity":"易错句"},{"id":"Q149dea59117c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.01"],"stem":"社会存在指社会物质生活条件，不能把社会里一切确实存在的观念都直接归为社会存在。","answer":"正确","polarity":"正确句"},{"id":"Q3f1948a47af8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.01"],"stem":"某种思想在社会中确实有人相信，因此该思想本身就属于社会存在而非社会意识。","answer":"错误","polarity":"易错句"},{"id":"Qb733c971765c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.02"],"stem":"地理环境和人口因素影响社会发展，物质资料生产方式是社会历史发展的决定力量。","answer":"正确","polarity":"正确句"},{"id":"Qaf30a2001e19","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.02"],"stem":"一个社会的性质和历史形态完全由人口数量或地理位置决定。","answer":"错误","polarity":"易错句"},{"id":"Q6fde0ec3b1fc","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.03"],"stem":"生产方式是生产力与生产关系的统一，不能把生产关系排除在社会存在之外。","answer":"正确","polarity":"正确句"},{"id":"Q2e30779d0b89","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.03"],"stem":"生产方式只包括机器技术，不包括人与人在生产中的关系。","answer":"错误","polarity":"易错句"},{"id":"Qacc830371241","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.04"],"stem":"社会存在决定社会意识，社会意识能通过实践反作用于社会存在。","answer":"正确","polarity":"正确句"},{"id":"Q3a2b01ea8aa1","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.04"],"stem":"社会意识能够影响现实，就说明社会意识在根本关系上决定社会存在。","answer":"错误","polarity":"易错句"},{"id":"Q137af6616be7","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.05"],"stem":"社会意识可落后或在一定程度上预见趋势，不能要求它与社会存在每一变化完全同步。","answer":"正确","polarity":"正确句"},{"id":"Q18998b15338c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.05"],"stem":"社会存在发生变化后，所有社会观念都必须立即同时改变。","answer":"错误","polarity":"易错句"},{"id":"Q75462481f169","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.06"],"stem":"经济发展水平与某种思想文化发展水平不必机械一一对应。","answer":"正确","polarity":"正确句"},{"id":"Qe5f241b61f31","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.06"],"stem":"某地经济相对落后，就不可能出现任何领先的思想认识。","answer":"错误","polarity":"易错句"},{"id":"Q9e3b9f41f042","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.07"],"stem":"社会意识具有历史继承、形式间相互影响和能动反作用，反作用是其相对独立性的突出表现。","answer":"正确","polarity":"正确句"},{"id":"Q46fcef4c963b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.07"],"stem":"相对独立性意味着社会意识能够完全摆脱社会存在而独立决定历史。","answer":"错误","polarity":"易错句"},{"id":"Q865e5292a6c4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.08"],"stem":"社会意识范围较广，不能把一切自然科学知识都直接判为服务特定经济基础的意识形态。","answer":"正确","polarity":"正确句"},{"id":"Qa475ffa7021b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.08"],"stem":"凡属于社会意识的知识，都必然是具有特定阶级性的观念上层建筑。","answer":"错误","polarity":"易错句"},{"id":"Qa81f09de1094","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.09"],"stem":"生产力着眼人与自然的生产能力，生产关系着眼人与人在生产中的经济关系。","answer":"正确","polarity":"正确句"},{"id":"Q40a304d33999","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.09"],"stem":"生产关系就是人与自然的关系，生产力就是人与人之间的所有制关系。","answer":"错误","polarity":"易错句"},{"id":"Q919c66c6982f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.10"],"stem":"劳动者、劳动资料、劳动对象是生产力基本要素，生产资料包括劳动资料和劳动对象。","answer":"正确","polarity":"正确句"},{"id":"Q26f59f71c3d4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.10"],"stem":"生产资料就是劳动者与劳动对象，不包括劳动资料。","answer":"错误","polarity":"易错句"},{"id":"Qd2e731b2253d","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.11"],"stem":"劳动对象是劳动作用的对象，劳动资料是劳动者用来影响对象的物质条件。","answer":"正确","polarity":"正确句"},{"id":"Q0afe203ac0dd","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.11"],"stem":"用于加工原材料的机器，与被加工的原材料在任何情况下都属于同一概念。","answer":"错误","polarity":"易错句","hold":"答案不唯一（核对人审读），暂停自动出题"},{"id":"Q05097f434ad1","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.12"],"stem":"劳动者是生产力中最活跃的因素，生产工具反映生产力水平，科学技术是第一生产力。","answer":"正确","polarity":"正确句"},{"id":"Qa62f99ee91a4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.12"],"stem":"科学技术是第一生产力，所以劳动者、工具和对象都不再是生产力的必要因素。","answer":"错误","polarity":"易错句"},{"id":"Q5395b5d02746","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.13"],"stem":"生产资料所有制关系、生产中的地位和相互关系、产品分配关系构成生产关系的主要方面。","answer":"正确","polarity":"正确句"},{"id":"Qe5b80f922a92","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.13"],"stem":"生产关系只指最终如何分配产品，与生产资料归谁占有无关。","answer":"错误","polarity":"易错句"},{"id":"Qb2a325d776d7","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.14"],"stem":"生产关系由人参与形成和改变，但受生产力和现实条件制约，不由意志任意选择。","answer":"正确","polarity":"正确句"},{"id":"Qdd9f8323db2c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.14"],"stem":"生产关系需要人建立，所以人可以完全不顾生产力条件随意设定并保证有效。","answer":"错误","polarity":"易错句"},{"id":"Q93061a57e90b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.15"],"stem":"生产力决定生产关系，适合生产力要求的生产关系促进生产力发展，不适合则阻碍。","answer":"正确","polarity":"正确句"},{"id":"Q2c3009f9060f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.15"],"stem":"生产关系能反作用于生产力，因此生产关系在根本关系上决定生产力。","answer":"错误","polarity":"易错句"},{"id":"Qff72f7284a2c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.16"],"stem":"经济基础指一定生产力发展阶段所决定的生产关系总和，不是GDP、货币财富或基础设施的同义词。","answer":"正确","polarity":"正确句"},{"id":"Q16e5bb8a1deb","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.16"],"stem":"经济基础就是一个地方拥有的资金总量和道路厂房总量。","answer":"错误","polarity":"易错句"},{"id":"Q510669d73d0c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.17"],"stem":"一定社会的生产关系从其总和及其对上层建筑的基础作用看，构成经济基础。","answer":"正确","polarity":"正确句"},{"id":"Q3aa214f49695","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.17"],"stem":"生产关系与经济基础是两个完全互不相干的社会层次。","answer":"错误","polarity":"易错句"},{"id":"Q5a80ee831ef5","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.18"],"stem":"上层建筑包括政治法律制度及相关组织设施，也包括与经济基础相适应的意识形态。","answer":"正确","polarity":"正确句"},{"id":"Q20542ca9972e","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.18"],"stem":"上层建筑只有思想观念，不包括政治组织、法律制度及相关设施。","answer":"错误","polarity":"易错句"},{"id":"Q3b2c6fe0c674","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.19"],"stem":"在上层建筑中，政治上层建筑居主导地位，国家政权是其核心。","answer":"正确","polarity":"正确句"},{"id":"Q155510b56ec6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.19"],"stem":"经济基础是上层建筑内部的一种思想，国家政权则属于生产工具。","answer":"错误","polarity":"易错句"},{"id":"Q424d7568f25c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.20"],"stem":"所有制的实际经济关系属于生产关系，确立和保障它的法律制度属于上层建筑。","answer":"正确","polarity":"正确句"},{"id":"Qe2bd14464201","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.20"],"stem":"只要法律条文涉及所有制，这条法律作为制度就自动属于经济基础。","answer":"错误","polarity":"易错句"},{"id":"Q2396bcffdb3c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.21"],"stem":"经济基础决定上层建筑，上层建筑又能维护或调整相应经济关系。","answer":"正确","polarity":"正确句"},{"id":"Qff4d564c0f0a","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.21"],"stem":"法律政治制度有重大作用，所以经济基础由它们任意创造并根本决定。","answer":"错误","polarity":"易错句"},{"id":"Q129930539197","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.22"],"stem":"上层建筑服务于适合生产力发展的经济基础时，才能就这种作用说它促进社会进步。","answer":"正确","polarity":"正确句"},{"id":"Q89b79fa0b0e4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.22"],"stem":"只要上层建筑适应并维护现有经济基础，就无条件促进社会进步。","answer":"错误","polarity":"易错句"},{"id":"Q7f95bda3f77c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.23"],"stem":"生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，不等于某阶段社会主要矛盾。","answer":"正确","polarity":"正确句"},{"id":"Q696364cd282f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.23"],"stem":"社会主要矛盾表述发生变化，就说明社会基本矛盾不再存在。","answer":"错误","polarity":"易错句"},{"id":"Qef3fd0a6cbca","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.24"],"stem":"社会基本矛盾运动是社会发展的根本动力，生产力是社会发展的最终决定力量。","answer":"正确","polarity":"正确句"},{"id":"Qfb388d745236","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.24"],"stem":"阶级斗争是任何社会形态发展的唯一根本动力，生产力与社会基本矛盾无关紧要。","answer":"错误","polarity":"易错句"},{"id":"Qaf2719ab79b3","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.25"],"stem":"阶级斗争是阶级社会发展的直接动力，这一表述不能删去阶级社会的限定。","answer":"正确","polarity":"正确句"},{"id":"Q0ce4bf32ee17","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.25"],"stem":"阶级斗争是包括无阶级社会在内的一切社会发展的直接动力。","answer":"错误","polarity":"易错句"},{"id":"Qa26e085dff3d","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.26"],"stem":"社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力。","answer":"正确","polarity":"正确句"},{"id":"Qdde94c2c5506","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.26"],"stem":"社会主义改革的定义，就是从根本上推翻社会主义基本制度。","answer":"错误","polarity":"易错句"},{"id":"Q03d65bbb40f5","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.27"],"stem":"人民群众是推动社会历史发展的主体，不能机械等同于任何场合人数较多的一方。","answer":"正确","polarity":"正确句"},{"id":"Qa4ec95deb2f3","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.27"],"stem":"只要在某次争论中人数占多数，就自动成为真理和历史进步的决定标准。","answer":"错误","polarity":"易错句"},{"id":"Q9c7a62480703","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.28"],"stem":"人民群众创造物质财富、精神财富，并是社会变革的决定力量。","answer":"正确","polarity":"正确句"},{"id":"Q90223b490905","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.28"],"stem":"精神财富只由少数名人创造，因此与群众实践和物质条件完全无关。","answer":"错误","polarity":"易错句"},{"id":"Q83dad524fe03","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.29"],"stem":"承认群众创造历史，不排斥杰出个人的重要作用；个人作用受历史条件制约。","answer":"正确","polarity":"正确句"},{"id":"Qa5c0e1463da2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.29"],"stem":"承认群众创造历史，就必须否认任何个人对具体历史事件起过重要作用。","answer":"错误","polarity":"易错句"},{"id":"Q5389d306dbef","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.30"],"stem":"历史由人的有意识活动形成，但总体结果不必完全等于任何个人的预定意图。","answer":"正确","polarity":"正确句"},{"id":"Q9b777d6a76f6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.30"],"stem":"每个人都有目的，所以社会历史的全部结果都能由某个人的意志任意决定。","answer":"错误","polarity":"易错句"},{"id":"Q05d8a97025e9","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.31"],"stem":"人的本质在其现实性上是一切社会关系的总和，不能只用孤立生物属性解释人的社会性质。","answer":"正确","polarity":"正确句"},{"id":"Q5747f6676cb6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.31"],"stem":"人的本质只由出生时的自然属性固定，社会关系和实践对它毫无影响。","answer":"错误","polarity":"易错句"},{"id":"Q6efb9e60504b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.32"],"stem":"劳动是道德起源的首要前提，社会关系是客观条件，人的自我意识是主观条件。","answer":"正确","polarity":"正确句"},{"id":"Qc39971c5e4a8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.32"],"stem":"道德起源的首要前提是人的自我意识，劳动与社会关系都不需要。","answer":"错误","polarity":"易错句"},{"id":"Qb8c60ff532a8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.33"],"stem":"道德与法律的产生和发展具有社会历史条件，不能说必须先有法律才可能有道德。","answer":"正确","polarity":"正确句"},{"id":"Q6a652fd2d7ec","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.33"],"stem":"没有成文法律以前，人类就不可能存在任何道德规范。","answer":"错误","polarity":"易错句"},{"id":"Qdaf1ef8f8d94","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.34"],"stem":"法律和道德都能规范行为，道德侧重教化与内心约束，法律具有国家强制保障。","answer":"正确","polarity":"正确句"},{"id":"Q28fdbcf062f2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.34"],"stem":"法律只与行为有关且完全没有思想引导作用，道德只管思想而从不规范行为。","answer":"错误","polarity":"易错句"},{"id":"Q168fd3b843dd","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.35"],"stem":"法治与德治相辅相成，但道德评价不能任意替代法律规则，法律也不覆盖全部道德要求。","answer":"正确","polarity":"正确句"},{"id":"Q38cf0c19a7b2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.35"],"stem":"凡道德上不赞同的行为，都必然已经违法，可以不经法律依据直接处罚。","answer":"错误","polarity":"易错句"},{"id":"N-M1-001","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.06","M1.07"],"lead":"","stem":"哲学基本问题包括两个方面，其中对思维能否正确认识存在这一问题的不同回答，是划分唯物主义和唯心主义的标准。","options":{},"answer":"错误","fix":"哲学基本问题包括两个方面，其中对思维能否正确认识存在这一问题的不同回答，是划分可知论和不可知论的标准。","analysis":"错在“划分唯物主义和唯心主义”。哲学基本问题是思维和存在的关系问题，包括两个方面：一是思维和存在何者为第一性，对它的不同回答是划分唯物主义和唯心主义的唯一标准；二是思维能否正确认识存在（思维和存在有没有同一性），对它的不同回答是划分可知论和不可知论的标准。题干把第二个方面的划分结果安到了唯物、唯心上。黑格尔就是反例：他承认思维能认识存在，却是唯心主义者。","trap":"标准错配：能否认识存在分可知论与不可知论，何者为第一性才分唯物主义与唯心主义。","basis":"教材通行表述：思维和存在何者为第一性是划分唯物主义和唯心主义的唯一标准，思维和存在有没有同一性是划分可知论和不可知论的标准；底稿M1.06、M1.07。","refs":["T"],"note":""},{"id":"N-M1-002","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.16"],"lead":"","stem":"实践性是马克思主义的本质属性，人民至上是马克思主义的政治立场。","options":{},"answer":"错误","fix":"人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场。","analysis":"错在“实践性”。讲义原句是“人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场”。人民性回答马克思主义站在谁的立场、为谁的问题，与后半句的“人民至上”一脉相承。实践性讲的是马克思主义来源于实践、指导改造世界的实践，讲义给它的定位是“实践观点是马克思主义首要的和基本的观点”“实践性是马克思主义区别于其他理论的根本特征”。几个特征各有自己的定位词，题干把“本质属性”安到了实践性上。","trap":"主体偷换：“本质属性”属于人民性；实践性对应的是“首要的和基本的观点”“区别于其他理论的根本特征”。","basis":"讲义第38页“人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场”“实践观点是马克思主义首要的和基本的观点”，第42页“实践性是马克思主义区别于其他理论的根本特征”；底稿M1.16。","refs":["H"],"note":""},{"id":"N-M1-003","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.16"],"lead":"","stem":"马克思主义的人民性是以阶级性为深刻基础的，是无产阶级先进性的体现。","options":{},"answer":"正确","fix":"","analysis":"正确，这是讲义原句。人民性和阶级性并不对立：无产阶级的根本利益同最广大人民的根本利益是一致的，马克思主义站在无产阶级立场上，也就是站在人民立场上，所以它的人民性以阶级性为深刻基础。不能以为讲人民性就要淡化或取消阶级性。","trap":"人民性不排斥阶级性：马克思主义的人民性以阶级性为深刻基础。","basis":"讲义第38页“马克思主义的人民性是以阶级性为深刻基础的，是无产阶级先进性的体现”；底稿M1.16。","refs":["H"],"note":""},{"id":"N-M1-004","src":"新增","kind":"拓展","type":"判断","module":"M1","cards":["M1.18","M1.09"],"lead":"","stem":"马克思主义哲学批判地吸收了黑格尔哲学中唯物主义的“基本内核”和费尔巴哈哲学中辩证法的“合理内核”。","options":{},"answer":"错误","fix":"马克思主义哲学批判地吸收了黑格尔哲学中辩证法的“合理内核”和费尔巴哈哲学中唯物主义的“基本内核”。","analysis":"错在把两人的贡献对调了。黑格尔哲学是唯心主义的，但包含丰富的辩证法思想，马克思主义吸收的是其辩证法的“合理内核”；费尔巴哈恢复了唯物主义的权威，但他的唯物主义是形而上学的，马克思主义吸收的是其唯物主义的“基本内核”。这也说明唯物唯心与辩证形而上学是两组不同的划分：黑格尔是唯心而辩证，费尔巴哈是唯物而形而上学。二人同属三大思想来源中的德国古典哲学。","trap":"主宾颠倒：辩证法的“合理内核”取自黑格尔，唯物主义的“基本内核”取自费尔巴哈。","basis":"教材通行表述：马克思主义批判继承了黑格尔辩证法的“合理内核”和费尔巴哈唯物主义的“基本内核”；底稿附录origin_reference把黑格尔、费尔巴哈列为德国古典哲学的代表；底稿M1.09、M1.18。","refs":["T","H"],"note":""},{"id":"N-M1-005","src":"新增","kind":"拓展","type":"判断","module":"M1","cards":["M1.11","M1.09"],"lead":"","stem":"恩格斯说费尔巴哈“下半截是唯物主义者，上半截是唯心主义者”，指的是费尔巴哈在自然观上坚持唯物主义，在社会历史观上却陷入了唯心主义。","options":{},"answer":"正确","fix":"","analysis":"正确。这句话出自恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》。“下半截”指自然观，“上半截”指社会历史观：费尔巴哈在自然观上坚持唯物主义，但不懂得实践和社会关系的作用，一进入社会历史领域就陷入唯心主义。这是旧唯物主义（包括近代形而上学唯物主义）的共同局限：坚持唯物主义的立场，不等于在一切领域都贯彻了唯物主义。","trap":"唯物主义者也可能是“半截子”的：自然观唯物不等于历史观唯物。","basis":"恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》原句，教材通行引用；底稿M1.11“历史观上的唯心主义局限”。","refs":["T"],"note":""},{"id":"N-M1-006","src":"新增","kind":"仿真题","type":"多选","module":"M1","cards":["M1.15","M1.18","M1.19"],"lead":"19世纪40年代，马克思、恩格斯在批判继承前人优秀思想成果的基础上创立了马克思主义。","stem":"关于马克思主义，下列说法正确的有（　）","options":{"A":"唯物史观和剩余价值学说两大发现，使社会主义从空想变成了科学","B":"马克思主义的三个组成部分是马克思主义哲学、政治经济学和科学社会主义","C":"马克思主义是不断发展的开放的学说，具有与时俱进的理论品质","D":"马克思主义具有科学的世界观和方法论基础，这一基础就是唯物史观和剩余价值学说"},"answer":"ABC","fix":"","analysis":"A项正确：恩格斯把唯物史观和剩余价值学说概括为马克思的两大发现，指出由于这两大发现，社会主义变成了科学。\nB项正确：马克思主义由马克思主义哲学、马克思主义政治经济学和科学社会主义三个基本部分组成；德国古典哲学、英国古典政治经济学、英法空想社会主义是它的思想来源，不是组成部分。\nC项正确：这是发展性的内容，为讲义原句。\nD项错误：讲义原句是“马克思主义具有科学的世界观和方法论基础，即辩证唯物主义和历史唯物主义”；剩余价值学说属于政治经济学，不是世界观和方法论，选项把“两大发现”的名单安到了“世界观和方法论基础”上。另注意：讲义第39页“马克思在哲学史上的两大历史贡献”是另一种提法，不能拿来回答“两大发现”。","trap":"两组“两个”别串：两大发现是唯物史观和剩余价值学说，世界观和方法论基础是辩证唯物主义和历史唯物主义。","basis":"讲义第38页“马克思主义具有科学的世界观和方法论基础，即辩证唯物主义和历史唯物主义”“马克思主义是不断发展的开放的学说，具有与时俱进的理论品质”，第37页三大思想渊源；底稿附录origin_reference的three_components；恩格斯《社会主义从空想到科学的发展》关于两大发现的论述；底稿M1.15、M1.18、M1.19。","refs":["H","G","T"],"note":""},{"id":"N-M1-007","src":"新增","kind":"拓展","type":"多选","module":"M1","cards":["M1.03","M1.12","M1.13","M1.14","M2.04"],"lead":"南宋陆九渊说：“宇宙便是吾心，吾心即是宇宙。”朱熹则说：“未有天地之先，毕竟也只是理。”","stem":"关于这两种观点，下列说法正确的有（　）","options":{"A":"陆九渊把个人的心看作世界的本原，属于主观唯心主义","B":"朱熹并不否认天地万物的存在，但他把“理”当作天地万物的本原，仍属于唯心主义","C":"朱熹所说的“理”虽然不依赖于个人的意识，但仍是精神性的东西，不具有物质的客观实在性","D":"两种观点都以精神为第一性，区别在于这种精神是个人的还是独立于人之外的"},"answer":"ABCD","fix":"","analysis":"四项都正确。\nA项：陆九渊把宇宙归结为“吾心”，以个人的主观精神为本原，属于主观唯心主义。\nB项：朱熹承认有天地万物，但认为“有此理，便有此天地”，把“理”放在第一性，所以仍是唯心主义（客观唯心主义）；承认外部世界存在，不足以判定为唯物主义，关键看何者为第一性。\nC项：客观唯心主义的“客观”只是相对于个人意识而言，“理”本身仍是精神性的；物质的客观实在性是指不依赖于意识而存在，不能把“客观精神”当成物质。\nD项：主观唯心主义和客观唯心主义同属唯心主义，都以精神为第一性，区别在于把个人的精神还是独立于人的精神当作本原。","trap":"B、C两项带着转折，看似可疑，其实都对：承认外界存在≠唯物主义，“客观”精神≠客观实在。","basis":"讲义第39页：主观唯心主义“认为世界的本原是人的精神”，列举“吾心即宇宙”；客观唯心主义“认为世界的本原是人之外的精神”，关键词有“理”；底稿M1.03、M1.12、M1.13、M1.14、M2.04。","refs":["H","T"],"note":""},{"id":"N-M2-001","src":"新增","kind":"拓展","type":"判断","module":"M2","cards":["M2.01","M2.04"],"lead":"","stem":"世界的存在是它的统一性的前提，但世界的统一性并不在于它的存在，而在于它的物质性。","options":{},"answer":"正确","fix":"","analysis":"正确。恩格斯在《反杜林论》中指出：世界的统一性并不在于它的存在，尽管世界的存在是它的统一性的前提；世界的真正的统一性在于它的物质性。“存在”的范围太宽：思想、观念也是存在的，唯心主义也承认世界存在，只是说世界统一于精神。只有说世界统一于物质，才同唯心主义划清界限。题中“并不在于它的存在”看似别扭，恰是原意。","trap":"存在≠物质性：存在只是统一性的前提，统一的根据是物质性。","basis":"恩格斯《反杜林论》“世界的真正的统一性是在于它的物质性”，教材通行引用；底稿M2.01、M2.04。","refs":["T"],"note":""},{"id":"N-M2-002","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.03","M2.05","M1.08","M7.01"],"lead":"列宁指出：“物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。”","stem":"关于这一物质定义，下列理解正确的有（　）","options":{"A":"定义所概括的客观实在性，是在各种具体物质形态之外独立存在的另一个特殊实体","B":"定义坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限","C":"定义中的“复写、摄影、反映”，坚持了可知论，同不可知论划清了界限","D":"客观实在性是物质的唯一特性，人类社会的物质生活条件同样具有客观实在性"},"answer":"BCD","fix":"","analysis":"A项错误：物质范畴是从各种具体物质形态中抽象出来的共同特性，这种共性就存在于具体事物之中，不是在具体事物之外另有一个实体；把共性说成脱离个别事物独立存在的东西，正是“理在事先”一类客观唯心主义的思路。\nB项正确：定义肯定物质不依赖于意识而存在，坚持物质是世界的本原，同唯心主义一元论和二元论划清了界限。\nC项正确：定义肯定物质能为感觉所复写、摄影、反映，坚持了能动的反映论和可知论，同不可知论划清了界限。\nD项正确：客观实在性是物质的唯一特性；地理环境、人口因素和物质资料的生产方式等社会物质生活条件同样不依赖于社会意识而存在，所以列宁的定义也体现了唯物主义自然观与历史观的统一。","trap":"抽象出的共性≠另一个实体：物质范畴概括的客观实在性就存在于具体事物之中。","basis":"列宁《唯物主义和经验批判主义》的物质定义及其意义（教材通行表述：坚持唯物主义一元论，坚持能动的反映论和可知论，体现唯物主义自然观与历史观的统一）；讲义第39页“物质的唯一特性是客观实在性”；底稿M2.03“抽象共同属性不等于脱离具体形态另有一个实体”、M2.05、M7.01。","refs":["T","H"],"note":""},{"id":"N-M2-003","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.12","M2.14","M2.15","M2.16","M2.01"],"lead":"恩格斯指出：“我们的意识和思维，不论它看起来是多么超感觉的，总是物质的、肉体的器官即人脑的产物。”","stem":"关于意识，下列说法正确的有（　）","options":{"A":"意识的内容是客观的，形式是主观的","B":"人脑是意识的物质器官，也是意识内容的源泉","C":"“千里眼”“顺风耳”等虚构的神话形象，也是对客观存在的反映","D":"意识是人脑这一物质器官的产物，因而意识本身也是一种特殊的物质"},"answer":"AC","fix":"","analysis":"A项正确：意识是客观存在的主观映象，内容来自客观对象，反映的形式带有主体的主观特点，是客观内容和主观形式的统一。这里的“客观”指内容来源于客观存在，不是说内容一定正确：错误的意识，内容同样来源于客观存在。\nB项错误：人脑是意识的物质器官，但意识内容的源泉是客观存在；引言说意识是“人脑的产物”，讲的是意识离不开人脑这一物质器官，不是说人脑能凭空产生意识内容。\nC项正确：神话形象是人脑对现实材料加工、组合的产物，眼、耳和看得远、听得远的愿望都来自现实生活，错误的、虚幻的意识同样来源于客观存在。\nD项错误：意识依赖人脑，是人脑的机能和属性，但意识本身不是物质；把意识说成一种物质，就抹杀了物质和意识的区别，庸俗唯物主义把思想看作人脑分泌的物质就是这种错误。","trap":"器官≠源泉；“人脑的产物”≠“意识就是物质”。","basis":"恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》原句，教材通行引用；讲义第40页“意识的生理基础是人脑，意识的本质是对客观存在的主观反映”；底稿M2.12、M2.14、M2.15、M2.16、M2.01。","refs":["T","H"],"note":""},{"id":"N-M2-004","src":"新增","kind":"拓展","type":"单选","module":"M2","cards":["M2.02","M2.18","M1.12"],"lead":"成语“杯弓蛇影”讲的是：有位客人把墙上挂着的弓映在酒杯里的影子当成了蛇，喝下酒后疑心成病；后来弄清杯中的“蛇”只是弓的倒影，病很快就好了。","stem":"对这一故事理解正确的是（　）","options":{"A":"客人的病由“疑心”引起，可见这个故事体现的是主观唯心主义的观点","B":"客人因疑成病，说明意识不经过实践也能直接改造外部物质世界","C":"客人因疑成病、释疑而愈，说明意识能对人体生理活动产生作用","D":"客人释疑而愈，说明意识对人体生理活动起决定作用"},"answer":"C","fix":"","analysis":"A项错误：判断是否属于主观唯心主义，要看是否把个人精神当作世界的本原、认为事物因人的精神而存在；这个故事讲的是心理对生理的影响，并没有主张外物依赖人心而存在，不能因为“疑心”里有个“心”字就归入主观唯心主义。\nB项错误：生病发生在客人自己的身体上，属于意识对生理活动的影响，不是意识直接改造外部物质世界；意识改造外部世界要通过实践。\nC项正确：疑心杯中有蛇而生病，弄清真相后病愈，说明意识能够影响人体的生理活动，讲义称“意识对人体生理活动具有调节和控制作用”。\nD项错误：意识对生理活动有调节作用，但不起决定作用，起决定作用的仍是物质；把“能产生作用”说成“起决定作用”，夸大了意识的作用。","trap":"调节作用≠决定作用；影响自身生理≠直接改造外部世界；有“心”字≠主观唯心主义。","basis":"讲义第40页“意识对人体生理活动具有调节和控制作用”“意识对改造客观世界具有指导作用”，第39页主观唯心主义“认为世界的本原是人的精神”；底稿M2.02、M2.18、M1.12。","refs":["H","T"],"note":""},{"id":"N-M2-005","src":"新增","kind":"拓展","type":"多选","module":"M2","cards":["M2.08","M2.09","M2.10"],"lead":"古希腊哲学家赫拉克利特说“人不能两次踏进同一条河流”，他的追随者克拉底鲁则说“人一次也不能踏进同一条河流”。","stem":"对此，下列理解正确的有（　）","options":{"A":"赫拉克利特的说法肯定了运动的绝对性","B":"克拉底鲁的说法否认了相对静止，走向了相对主义和诡辩论","C":"克拉底鲁的说法否认了绝对运动，陷入了形而上学","D":"河水时刻在流动，但河流在一定时期内仍保持着自身的基本性质，这也是一种相对静止"},"answer":"ABD","fix":"","analysis":"A项正确：河水不断流动，第二次踏进的已不是原来的河水，赫拉克利特以此肯定了事物的运动变化，即运动的绝对性。\nB项正确：克拉底鲁说连一次也不能踏进，等于说事物每一瞬间都不是它自身，否认了相对静止，事物就无法被区分和把握，走向相对主义和诡辩论。\nC项错误：克拉底鲁不但没有否认运动，反而把运动的绝对性夸大到否认任何相对静止；否认绝对运动、把事物看成静止不变的，才是形而上学。\nD项正确：相对静止有两种情形，一是空间位置在一定条件下暂时不变，二是根本性质在一定条件下暂时不变；河流在一定时期内仍是这条河，属于后一种。","trap":"记牢对应：否认相对静止→相对主义、诡辩论；否认绝对运动→形而上学。","basis":"讲义第39页“运动是绝对的、无条件的、永恒的；静止是相对的、有条件的、暂时的”；教材通行表述：只承认绝对运动、否认相对静止会导致相对主义和诡辩论；底稿M2.08、M2.09、M2.10。","refs":["H","T"],"note":""},{"id":"N-M2-006","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.21","M2.22"],"lead":"规律是事物运动发展中本身所固有的本质的、必然的、稳定的联系。","stem":"关于规律，以下表述正确的有（　）","options":{"A":"荀子说“天行有常，不为尧存，不为桀亡”，强调的是规律的客观性","B":"人们修建水库调节水流，说明人可以根据需要改变水往低处流的规律","C":"规律是客观的，但人们可以通过改变条件来限制某些规律的破坏作用","D":"自然界、人类社会和人的思维领域，都有各自的规律"},"answer":"ACD","fix":"","analysis":"A项正确：“天行有常”指自然界的运行有其固有规律，“不为尧存，不为桀亡”指它不因圣君暴君而存亡，体现规律不以人的意志为转移。\nB项错误：修建水库改变的是水流的条件，水仍然往低处流，人并没有改变这条规律；人不能创造、消灭规律，能做的是认识规律、改变规律发生作用的条件。\nC项正确：规律客观不等于规律发生作用的条件永远不变，人们可以在认识规律的基础上改变条件，限制某些规律的破坏作用、扩大其有益作用，如修堤筑坝治理水患。\nD项正确：规律是普遍的，有自然规律、社会规律和思维规律。","trap":"改变条件≠改变规律：水库改变的是条件，不是“水往低处流”。","basis":"教材通行表述：规律是客观的，人们不能创造、消灭规律，但可以认识规律，根据规律发生作用的条件利用规律；荀子《天论》原句；底稿M2.21、M2.22“规律具有客观性，不等于某种具体规律的适用条件和表现形式永远不变”。","refs":["T"],"note":""},{"id":"N-M2-007","src":"新增","kind":"拓展","type":"单选","module":"M2","cards":["M2.24"],"lead":"","stem":"下列古语中，体现尊重客观规律与发挥主观能动性相统一的是（　）","options":{"A":"顺天时，量地利，则用力少而成功多","B":"宋人有闵其苗之不长而揠之者……其子趋而往视之，苗则槁矣","C":"死生有命，富贵在天","D":"郑人买履，宁信度，无自信也"},"answer":"A","fix":"","analysis":"A项正确：出自贾思勰《齐民要术》。“顺天时，量地利”是尊重农业生产的客观规律，“用力”是发挥主观能动性，二者结合才能“用力少而成功多”。\nB项错误：出自《孟子》，即“揠苗助长”，违背禾苗生长的规律，片面夸大主观能动性，结果“苗则槁矣”。\nC项错误：把生死富贵归于命运和天意，否认了人的主观能动性，属于宿命论观点。\nD项错误：郑人宁可相信量好的尺码也不相信自己的脚，讲的是从教条出发而不从实际出发，不是规律与能动性的统一。","trap":"两头都不能偏：只讲能动而违背规律（揠苗）、听天由命而放弃能动（宿命论）都是片面的。","basis":"教材通行表述：尊重客观规律是正确发挥主观能动性的前提，认识和利用规律又必须充分发挥主观能动性；底稿M2.24。","refs":["T"],"note":""},{"id":"N-M3-001","src":"新增","kind":"仿真题","type":"判断","module":"M3","cards":["M3.18"],"lead":"","stem":"唯物辩证法认为，量变和质变是相互渗透的，在事物的质变过程中，也有旧质在量上的收缩和新质在量上的扩张。","options":{},"answer":"正确","fix":"","analysis":"正确。量变和质变的相互渗透有两层意思：一是在总的量变过程中有阶段性和局部性的部分质变；二是在质变过程中也有量的变化，表现为旧质在量上的收缩和新质在量上的扩张。题干说的是第二层，与教材一致。底稿M3.18只练了第一层（总的量变过程中可以包含局部质变），本题补上第二层：质变不是与量毫无关系的一跳，旧质逐步缩小、新质逐步扩大，本身就伴随着量的变化。易错：以为“量变只发生在质变之前，质变过程中没有量变”而判错；或者把两层说反，记成“总的量变过程中有旧质收缩、新质扩张”。","trap":"易误判为错：质变过程中同样有量的变化（旧质收缩、新质扩张）；“部分质变”属于总的量变过程，两层不要说反","basis":"教材通行表述（马工程《马克思主义基本原理》质量互变规律）：量变和质变是相互渗透的，一方面在总的量变过程中有阶段性和局部性的部分质变，另一方面在质变过程中也有旧质在量上的收缩和新质在量上的扩张。讲义第41页只列量变、质变的定义及“前提和必要准备”“必然结果”两条，未写此点。","refs":["T"],"note":""},{"id":"N-M3-002","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.16","M3.14","M3.13","M3.01"],"lead":"量变是事物数量的增减和组成要素排列次序的变动，质变是事物根本性质的变化。","stem":"关于量变和质变，以下表述正确的有（）","options":{"A":"量变达到一定程度，必然引起质变","B":"事物外观发生了明显改变，不一定意味着事物发生了质变","C":"事物组成要素排列次序的变动，也可能引起事物性质的改变","D":"质变既巩固了量变的成果，又为新的量变开辟道路"},"answer":"ABCD","fix":"","analysis":"ABCD。\nA项正确：量变是质变的必要准备，质变是量变的必然结果；这个“必然”有前提，即量变达到一定程度、突破度的界限。\nA项带“必然”却是教材原意，不能见绝对词就判错；错的说法是删掉“达到一定程度”，说成任何量变都立即引起质变。\nB项正确：质变看的是根本性质是否改变，外观变化的幅度与性质是否改变是两回事，外观大变也可能没有变质（如商店重新装修、换了招牌，经营性质未变）。\nC项正确：组成要素排列次序的变动本身属于量变，但它和数量增减一样，突破度以后也会引起质变。如石墨在高温高压下转变为金刚石，碳原子的排列方式改变，物质的性质随之根本改变。易错是以为“排列次序变动只是量变，不会引起质变”。\nD项正确：质变不是运动的终点，它巩固量变的成果，并在新质的基础上开始新的量变。","trap":"四项全对：A项的“必然”带着“达到一定程度”的前提；C项排列次序的变动属于量变，但同样能引起质变。别因绝对词或“只是量变”误删","basis":"讲义第41页“量变：事物数量的增减和组成要素排列次序的变动”“质变：事物根本性质的变化”“（1）量变是质变的前提和必要准备。（2）质变是量变的必然结果。”；教材通行表述“量变达到一定程度必然引起质变”“质变……为新的量变开辟道路”；底稿M3.13条件栏“具体结构变化若已突破度并改变根本性质，应判断为质变”。","refs":["H","T"],"note":""},{"id":"N-M3-003","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.10","M3.17","M3.11","M3.12","M3.21"],"lead":"唯物辩证法认为，发展是前进的、上升的运动，发展的实质是新事物的产生和旧事物的灭亡。","stem":"关于发展和新事物，以下表述正确的有（）","options":{"A":"运动变化的基本趋势是发展，因此事物的根本性质一旦发生了改变，也就意味着它实现了发展","B":"新事物在旧事物的“母体”中孕育成熟，保留了旧事物中合理的、适应新条件的因素","C":"新事物之所以必然战胜旧事物，是因为它在产生之初就比旧事物更加强大、更有力量","D":"新事物具有新的结构和功能，能适应变化了的环境和条件，这是它不可战胜的原因之一"},"answer":"BD","fix":"","analysis":"BD。\nA项错误：前半句是讲义原句，后半句推不出来。“基本趋势”说的是总方向，不是说每一个变化都是发展；根本性质改变就是质变，质变只说明性质变了，这种变化可以是前进上升的，也可以是倒退的（如社会历史中的复辟），只有前进上升的变化才是发展。\nB项正确：新事物是在旧事物的“母体”中孕育成熟的，它既否定旧事物中消极过时的东西，又保留旧事物中合理的、适应新条件的因素，并添加旧事物所不能容纳的新内容。这是新事物必然战胜旧事物的原因之一，也体现了辩证否定是扬弃。\nC项错误：新事物在产生之初往往比较弱小。它必然战胜旧事物，不是因为一开始就强大，而是由它的本质特点决定的：具有新的结构和功能，扬弃了旧事物，在社会历史领域还符合人民群众的根本利益和要求。\nD项正确：理由见C项，这是新事物不可战胜的第一条原因。","trap":"A项借讲义原句“运动变化的基本趋势是发展”推出“质变就是发展”，把总趋势偷换成每一次变化；C项把新事物取胜的原因偷换成“一开始就强大”","basis":"讲义第40页“一切形式的变化就是运动，运动变化的基本趋势是发展，发展的实质是新事物的产生，旧事物的灭亡”；教材通行表述：新事物必然战胜旧事物，一是新事物具有新的结构和功能，适应已经变化了的环境和条件，二是新事物在旧事物的“母体”中孕育成熟，保留旧事物中合理的、适应新条件的因素并添加新内容，三是在社会历史领域新事物符合人民群众的根本利益和要求；底稿M3.17“质变可以表现为进步或倒退”。","refs":["H","T"],"note":""},{"id":"N-M3-004","src":"新增","kind":"拓展","type":"多选","module":"M3","cards":["M3.21","M3.19","M3.22","M3.23"],"lead":"马克思在《资本论》第一卷第二版跋中指出，辩证法“在对现存事物的肯定的理解中同时包含对现存事物的否定的理解，即对现存事物的必然灭亡的理解”。","stem":"关于辩证的否定和否定之否定规律，以下表述正确的有（）","options":{"A":"辩证的否定观既反对“肯定一切”，也反对“否定一切”","B":"肯定方面是事物中维持其存在的方面，因而凡是现存的事物都是合理的、应当保持的","C":"否定之否定阶段在更高的基础上重复肯定阶段的某些特征","D":"只看到事物发展的前进性而看不到曲折性，就会陷入循环论"},"answer":"AC","fix":"","analysis":"AC。\nA项正确：形而上学的否定观要么肯定一切，要么否定一切；辩证否定的实质是扬弃，既克服又保留，所以既反对全盘肯定，也反对全盘否定。底稿M3.21只练了“全盘抛弃”这一头，本项补上“全盘肯定”这一头。\nB项错误：前半句对，肯定方面是事物中维持其存在的方面；但这只描述事物保持现有性质的趋势，推不出“凡是现存的都是合理的、应当保持的”。引言说辩证法对现存事物的理解同时包含对其必然灭亡的理解，任何现存事物内部都有促使其灭亡的否定方面。讲义第41页写的“存在即合理”是简化说法，不能当作价值判断来用。\nC项正确：否定之否定阶段在更高的基础上重复肯定阶段的某些特征，仿佛回到了出发点，但不是原样复归，事物的发展呈螺旋式上升、波浪式前进。\nD项错误：把两种片面性配反了。只看到前进性、看不到曲折性，会把发展看成笔直上升的直线（直线论）；只看到曲折性、看不到前进性，才会把发展看成周而复始的循环（循环论）。","trap":"B项是讲义“存在即合理”的简化，肯定方面不能证明“现存即合理”；D项把直线论、循环论配反","basis":"马克思《资本论》第一卷第二版跋（引言原句）；教材通行表述：辩证否定的实质是扬弃，既克服又保留；否定之否定在更高的基础上重复旧阶段的某些特征，事物发展是前进性与曲折性的统一；底稿appendices.corrected_simplifications“由肯定因素引出‘任何存在都在价值上合理’”的纠正“肯定因素描述维持现有性质，不是价值正当性的通行证”；讲义第41页考点八。","refs":["H","T"],"note":""},{"id":"N-M3-005","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.24","M4.01"],"lead":"恩格斯指出，辩证法“不过是关于自然、人类社会和思维的运动和发展的普遍规律的科学”。","stem":"关于唯物辩证法的总特征和基本规律，以下表述正确的有（）","options":{"A":"联系和发展的观点是唯物辩证法的总特征","B":"对立统一规律揭示了事物发展的源泉和动力","C":"主要矛盾和次要矛盾的关系，是关于事物矛盾问题的精髓","D":"否定之否定规律揭示了事物发展的方向和道路"},"answer":"ABD","fix":"","analysis":"ABD。\nA项正确：唯物辩证法的总特征是联系和发展的观点（普遍联系、永恒发展）；对立统一规律则是唯物辩证法的实质和核心。“总特征”和“实质和核心”是两个不同的定位，不要互换。\nB项正确：三大规律各有侧重，对立统一规律揭示事物发展的源泉和动力，质量互变规律揭示发展的形式和状态，否定之否定规律揭示发展的方向和道路。\nC项错误：被称为“关于事物矛盾的问题的精髓”的，是矛盾的普遍性和特殊性的关系，即共性和个性、绝对和相对的关系（毛泽东《矛盾论》），不是主要矛盾和次要矛盾的关系。主要矛盾和次要矛盾属于矛盾发展的不平衡性，方法论上对应两点论和重点论。\nD项正确：理由见B项。","trap":"定位张冠李戴：“精髓”是矛盾普遍性和特殊性的关系，不是主次矛盾；“总特征”是联系和发展，“实质和核心”是对立统一规律","basis":"恩格斯《反杜林论》（引言）；毛泽东《矛盾论》“这一共性个性、绝对相对的道理，是关于事物矛盾的问题的精髓，不懂得它，就等于抛弃了辩证法”；教材通行表述“对立统一规律是唯物辩证法的实质和核心”，三大规律分别揭示发展的源泉和动力、形式和状态、方向和道路；底稿M3.24条件栏“联系与发展概括唯物辩证法的总特征和基本观点，对立统一是其实质和核心”。","refs":["C","T"],"note":""},{"id":"N-M4-001","src":"新增","kind":"仿真题","type":"判断","module":"M4","cards":["M4.13","M4.14"],"lead":"","stem":"在复杂事物的诸多矛盾中，处于支配地位、对事物发展起决定作用的是矛盾的主要方面。","options":{},"answer":"错误","fix":"在复杂事物的诸多矛盾中，处于支配地位、对事物发展起决定作用的是主要矛盾。","analysis":"错误。错在主语。在诸多矛盾之间比较，得出的是主要矛盾和次要矛盾：主要矛盾处于支配地位，对事物发展起决定作用。在同一个矛盾的两个方面之间比较，得出的才是主要方面和次要方面：主要方面处于支配地位，起主导作用。题干的比较范围是“诸多矛盾”，结论却落在“矛盾的主要方面”，层次配错了。记法：矛盾跟矛盾比，选出主要矛盾，起“决定作用”；方面跟方面比，选出主要方面，起“主导作用”。","trap":"层次混淆：多组矛盾中起决定作用的是主要矛盾；同一矛盾两方中起主导作用的才是主要方面","basis":"讲义第41页“（1）主要矛盾和次要矛盾：主要矛盾处于支配地位起决定性作用，次要矛盾处于从属地位，不起决定性作用。（2）主要方面和次要方面：主要方面处于支配地位起主导作用，次要方面处于被支配地位，起次要作用。”","refs":["H","C"],"note":""},{"id":"N-M4-002","src":"新增","kind":"仿真题","type":"判断","module":"M4","cards":["M4.01"],"lead":"","stem":"是否承认矛盾是事物发展的动力，是唯物辩
