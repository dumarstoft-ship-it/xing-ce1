"LAW","cards":["LAW-015","LAW-007","LAW-012"],"lead":"下列是2025—2026年间的四项法律事件：①生态环境法典开始施行；②治安管理处罚法修订通过；③国家发展规划法开始施行；④修订后的治安管理处罚法开始施行。","stem":"按时间先后排列，正确的是（）","opts":[{"text":"②③④①","correct":false,"why":"错因：把修订后的治安管理处罚法的施行放到了国家发展规划法施行之后（时间替换）。前者2026年1月1日施行，后者2026年3月12日通过并自公布之日起施行。"},{"text":"②④③①","correct":true,"why":"②2025年6月27日修订通过→④2026年1月1日施行→③2026年3月12日通过、自公布之日起施行→①2026年8月15日施行。"},{"text":"②④①③","correct":false,"why":"错因：把生态环境法典的施行提前到了国家发展规划法施行之前（时间替换）。两法同在2026年3月12日通过，规划法自公布之日起施行，法典到2026年8月15日才施行。"},{"text":"③②④①","correct":false,"why":"错因：把国家发展规划法的施行提前到了治安管理处罚法2025年修订通过之前（时间替换）。规划法2026年3月12日才通过。"}],"answer":"","fix":"","explain":"通过、公布、施行可能不在同一天：治安管理处罚法2025年6月27日修订通过、2026年1月1日起施行；国家发展规划法与生态环境法典都在2026年3月12日通过，前者自公布之日起施行，后者2026年8月15日起施行。","condition":"中国大陆法制；治安管理处罚法（2025年修订）、国家发展规划法、生态环境法典；日期以法律文本所载通过、施行日期为准，不以网页转载日期为准；截至2026-11-27。","refs":["LAW-S07","LAW-S03","LAW-S04","IPLAN"],"origin":"自编","review":"","o":195,"t":2},{"id":"F-LAW-016-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-016"],"lead":"","stem":"根据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订），违反治安管理记录封存的适用对象不限于未成年人，成年人的违反治安管理记录同样应当予以封存。","opts":[],"answer":"正确","fix":"","explain":"新法第136条规定违反治安管理的记录应当予以封存，条文没有把封存对象限定为未成年人。封存限制的是记录的对外提供和公开（有关国家机关为办案需要、有关单位根据国家规定查询的除外，查询单位须保密），不是删除记录，也不撤销原处罚。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第136条。","refs":["LAW-S07"],"origin":"自编","review":""},{"id":"F-LAW-016-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-016"],"lead":"2026年3月，成年人李某因违反治安管理被公安机关处以罚款，其违反治安管理的记录依法予以封存。","stem":"根据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订），下列说法正确的是（）。","opts":[{"text":"记录封存后，原罚款决定随之撤销","correct":false,"why":"错因：把记录管理制度换成了实体免责（被替换的是关系）。封存只限制记录的提供和公开，不否定已经认定的违法事实，也不撤销已作出的处罚。"},{"text":"封存就是将该记录从公安机关信息系统中删除","correct":false,"why":"错因：把“封存”换成了“删除”（被替换的是动作）。封存后记录仍然保存，法定情形下还能依法查询，这本身就说明记录没有被抹去。"},{"text":"另一公安机关为办案需要依法查询该记录的，应当对记录情况予以保密","correct":true,"why":"有关国家机关为办案需要查询属于第136条规定的例外；依法进行查询的单位，应当对被封存记录的情况予以保密。"},{"text":"封存后，有关单位需要查询该记录的，应当先取得李某本人同意","correct":false,"why":"错因：把法定查询事由（国家机关为办案需要、有关单位根据国家规定查询）换成了本人同意（被替换的是条件）。符合法定事由即可依法查询，不以本人同意为前提。"}],"answer":"","fix":"","explain":"封存限制的是记录对外提供和公开：原则上不得提供或公开，有关国家机关为办案需要、有关单位根据国家规定查询是法定例外，查询单位负有保密义务。封存不是删除，也不是免罚。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第136条；本题不涉及封存对招录、从业资格的影响，那要另查具体规则。","refs":["LAW-S07"],"origin":"自编","review":"","o":103,"t":1},{"id":"F-LAW-017-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-017"],"lead":"2026年2月，乙在夜市醉酒滋事，无故对甲拳打脚踢，殴打仍在持续。甲为摆脱殴打，用力将乙推开，乙摔倒后手臂擦伤，甲也受了轻微伤。经查，甲推开乙是为了制止乙正在进行的殴打，没有明显超过必要限度。","stem":"依据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订）第19条，对甲的行为，下列判断正确的是（）。","opts":[{"text":"甲的行为不属于违反治安管理行为，不受处罚","correct":true,"why":"乙的殴打正在进行，甲为制止殴打而推开乙，未明显超过必要限度，符合第19条：为了免受正在进行的不法侵害而采取的制止行为造成损害的，不属于违反治安管理行为，不受处罚。"},{"text":"双方都有伤，应按互殴对甲给予治安管理处罚","correct":false,"why":"错因：只看双方受伤的结果，丢掉了侵害正在进行、为了制止侵害、未明显超过必要限度这些判断条件（被替换的是判断依据）。"},{"text":"甲的行为属于违反治安管理，但因乙先动手，应当减轻处罚","correct":false,"why":"错因：把“不属于违反治安管理行为、不受处罚”换成了“违法但应当减轻”（被替换的是处理结果）。应当减轻处罚只适用于制止行为明显超过必要限度、造成较大损害的情形，题中不存在。"},{"text":"甲是否受处罚，取决于乙事后是否谅解甲","correct":false,"why":"错因：把第19条的法定条件换成了对方是否谅解（被替换的是条件）。甲的行为符合第19条，本就不属于违反治安管理行为，不以乙的谅解为前提。"}],"answer":"","fix":"","explain":"治安层面的防卫看三点：不法侵害正在进行，行为是为了制止侵害，没有明显超过必要限度。三点都满足的，造成损害也不属于违反治安管理行为、不受处罚；不能见到双方受伤就按互殴处理。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第19条；只讨论治安管理处罚，不涉及刑事责任。","refs":["LAW-S07"],"origin":"自编","review":"","o":171,"t":2},{"id":"F-LAW-017-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-017"],"lead":"下列四种情形中，行为人的行为都造成了对方受伤。","stem":"依据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订）第19条，行为人依照该条不受处罚或者不予处罚的有（）。","opts":[{"text":"甲被人打了一拳，对方离开后，甲次日找到对方将其打伤“讨个说法”","correct":false,"why":"错因：不法侵害已经结束，次日追打属于事后报复，不再是“为了免受正在进行的不法侵害而采取的制止行为”（被替换的是侵害所处的阶段），不能依第19条免于处罚。"},{"text":"乙正被他人揪住头发殴打，为制止殴打将对方推倒，未明显超过必要限度","correct":true,"why":"侵害正在进行、为了制止侵害、未明显超过必要限度，属于第19条前段情形，不属于违反治安管理行为，不受处罚。"},{"text":"丙为制止正在进行的殴打而反击，明显超过必要限度、造成较大损害，且不属于情节较轻","correct":false,"why":"错因：这种情形第19条的处理是“依法给予处罚，但是应当减轻处罚”，不是不予处罚（被替换的是处理结果）。"},{"text":"丁为制止正在进行的殴打而反击，明显超过必要限度、造成较大损害，但情节较轻","correct":true,"why":"第19条后段：制止行为明显超过必要限度、造成较大损害的，依法处罚但应当减轻；其中情节较轻的，不予处罚。"}],"answer":"","fix":"","explain":"第19条分三层：未明显超过必要限度的制止行为，不属于违反治安管理行为，不受处罚；明显超过必要限度、造成较大损害的，依法处罚但应当减轻；其中情节较轻的，不予处罚。侵害结束后的报复不适用这一条。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第19条；只讨论治安管理处罚，不涉及刑事责任。","refs":["LAW-S07"],"origin":"自编","review":""},{"id":"F-LAW-018-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-018"],"lead":"","stem":"依据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订），下列关于违反治安管理行为人处理的说法，正确的是（）。","opts":[{"text":"17周岁的乙初次违反治安管理，依法应予行政拘留，因系初次违法而不予处罚","correct":false,"why":"错因：把“不执行行政拘留”换成了“不予处罚”（被替换的是环节：拘留是否执行被当成了是否处罚）。已满16周岁不满18周岁、初次违反治安管理、依法应予拘留的，通常不执行拘留，但这不等于不处罚；14至不满18周岁的处罚规则是从轻或者减轻。"},{"text":"15周岁的丙首次违反治安管理、情节一般，依法应予行政拘留，因其已满14周岁，应当执行拘留","correct":false,"why":"错因：把第23条的“不执行”换成了“应当执行”（被替换的是执行规则）。已满14周岁不满16周岁、依法应予拘留的，不执行行政拘留；题中既非情节严重、影响恶劣，也不是一年内二次以上，不属于例外。"},{"text":"72周岁的丁一年以内第二次违反治安管理，依法应予行政拘留，公安机关仍不能对其执行拘留","correct":false,"why":"错因：删掉了新法设置的例外（被替换的是条件）。依第23条第2款，70周岁以上的人一年以内二次以上违反治安管理的，不受“不执行行政拘留”规定的限制。"},{"text":"13周岁的甲违反治安管理，不予处罚，但应当责令其监护人严加管教","correct":true,"why":"不满14周岁的人违反治安管理的，不予处罚，但是应当责令其监护人严加管教。"}],"answer":"","fix":"","explain":"分两步：先看应否处罚（不满14周岁不予处罚；14至不满18周岁从轻或者减轻），再看拘留是否执行（第23条四类人通常不执行）。第23条第2款有两类例外：前三类人（已满14不满16周岁、已满16不满18周岁初次违反、70周岁以上）情节严重、影响恶劣的；第一、三类人一年以内二次以上违反治安管理的，都不受不执行拘留的限制。怀孕或者哺乳自己不满1周岁婴儿的不在这两类例外之列。“初次违法”“不执行拘留”都不等于不处罚。落入例外只是不再受不执行规定的限制，可以依法执行拘留，并不等于必然拘留；不满14周岁不予处罚的依据是第12条。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第12条关于未成年人处罚和第23条第1款、第2款关于不执行行政拘留及其例外的规定；年龄、次数、情节以题干为准，不类推刑事责任年龄（E-LAW-07）。","refs":["LAW-S07","E-LAW-07"],"origin":"自编","review":""},{"id":"F-LAW-018-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-018"],"lead":"","stem":"根据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订），怀孕的李某违反治安管理，依法应当给予行政拘留但不执行，这说明李某的行为不属于违反治安管理行为。","opts":[],"answer":"错误","fix":"根据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订），怀孕的李某违反治安管理，依法应当给予行政拘留但不执行，李某的行为仍属于违反治安管理行为，不执行拘留并不免除其依法应承担的其他责任。","explain":"错因：把“不执行行政拘留”换成了“行为不违法”（被替换的是关系：执行上的豁免被当成了行为性质的改变）。第23条处理的是依法应予拘留之后是否执行，前提恰恰是行为违法；怀孕或者哺乳自己不满1周岁婴儿的情形，不在该条第2款例外之列。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，2026年1月1日起施行）第23条。","refs":["LAW-S07","E-LAW-07"],"origin":"自编","review":""},{"id":"F-LAW-019-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-019"],"lead":"某市起草2026年优化营商环境若干措施，征求意见稿中有以下四项条款。","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，符合该法要求的条款是（）。","opts":[{"text":"本市政府采购项目一律优先授予民营企业，不论其报价和资质如何","correct":false,"why":"错因：把“依法平等对待”换成了按所有制给予的特权（被替换的是关系）。支持民营经济要在法律和政策规定范围内进行，不是无条件优先。"},{"text":"全国统一的市场准入负面清单以外，民营企业与其他各类经济组织均可依法平等进入","correct":true,"why":"国家实行全国统一的市场准入负面清单，清单以外的领域，包括民营经济组织在内的各类经济组织可以依法平等进入。"},{"text":"土地供应、资金安排等先满足国有企业需要，剩余部分再向民营企业配置","correct":false,"why":"错因：把“依法平等使用生产要素和公共服务资源”换成了按所有制排先后（被替换的是关系）。"},{"text":"民营企业依法进入负面清单以外的领域后，不再接受安全生产、环境保护等方面的监管","correct":false,"why":"错因：把准入规则扩大成了免除经营过程中的监管（被替换的是适用范围）。依法进入后，仍须遵守安全、环保、质量等法律制度。"}],"answer":"","fix":"","explain":"民营经济促进法的要求是“依法平等”：平等准入、平等使用生产要素和公共服务资源、平等适用支持政策。既反对歧视民营企业，也不等于给民营企业所有制特权，更不免除依法监管。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-019-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-019"],"lead":"","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，县级人民政府为扶持民营企业制定的政策措施，只要涉及经营主体生产经营活动，也应当经过公平竞争审查。","opts":[],"answer":"正确","fix":"","explain":"该法要求，制定涉及经营主体生产经营活动的政策措施应当经过公平竞争审查，扶持性政策也不例外。公平竞争审查针对的是借政策制造身份歧视和市场壁垒，与依法平等支持民营经济并不冲突。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-020-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-020"],"lead":"2025年8月，某县人民政府依法与一家民营企业订立投资合作协议，约定由县政府为项目配套建设道路。2026年该县政府换届后，有人提出不再履行该协议。","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，下列说法正确的是（）。","opts":[{"text":"该协议属于前任县长的个人承诺，新任县长不认可的可以不再履行","correct":false,"why":"错因：把县政府以组织身份依法订立的协议换成了领导个人的承诺（被替换的是主体）。人员更替不能成为违约毁约的理由。"},{"text":"县政府应当继续履行该协议，不得以政府换届、人员更替为由违约毁约","correct":true,"why":"地方政府及其有关部门应当履行依法作出的政策承诺和依法订立的合同，不得以政府换届、区划调整、机构职能调整、人员更替等理由违约毁约。"},{"text":"如因社会公共利益确需改变约定，县政府可以直接宣布解除协议且无须补偿","correct":false,"why":"错因：删掉了“依照法定权限和程序”“对损失予以补偿”两项要求（被替换的是改变承诺的条件）。"},{"text":"该县若随后因行政区划调整并入邻区，协议约定的义务随之消灭","correct":false,"why":"错因：把行政区划调整当成了义务消灭的理由（被替换的是条件）。法律明确不得以区划调整为由违约毁约。"}],"answer":"","fix":"","explain":"政府依法作出的承诺和订立的合同是组织的义务，不因换届、区划调整、机构职能调整或人员更替而消灭；确因国家利益或者社会公共利益需要改变的，要依法定权限和程序进行，并补偿企业因此受到的损失。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）；题干限定为依法订立的协议，违法承诺不在此列。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-020-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-020"],"lead":"","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，下列做法中违反该法规定的有（）。","opts":[{"text":"某大型企业与中小民营供应商约定，待其收到项目业主付款后再向供应商付款","correct":true,"why":"违反。大型企业不得以收到第三方付款作为向中小民营经济组织支付账款的条件。"},{"text":"某事业单位以本单位负责人调整为由，拖延支付已到期的民营企业账款","correct":true,"why":"违反。国家机关、事业单位、国有企业应当依法或者依合同约定及时支付账款，负责人调整不是拖延付款的理由。"},{"text":"某区机构改革后，承接原部门职能的部门以职能调整为由，拒绝履行原部门依法订立的合同","correct":true,"why":"违反。不得以机构职能调整为由违约毁约，职能划转后，依法订立的合同仍应履行。"},{"text":"某市政府因社会公共利益需要，依照法定权限和程序调整对企业的政策承诺，并补偿企业因此受到的损失","correct":false,"why":"不违反。法律允许因国家利益、社会公共利益确需改变承诺，条件是依照法定权限和程序进行并对损失予以补偿，本项条件齐备。把它当成违法，是把“不得随意违约”误读成了“承诺永远不能调整”（被替换的是关系）。"}],"answer":"","fix":"","explain":"该法同时约束政府守信和账款支付：换届、区划调整、机构职能调整、人员更替都不是违约理由；国家机关、事业单位、国有企业要依法依约及时付款，大型企业不得把收到第三方付款作为付款条件。依法定权限程序并补偿的调整则是允许的。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-021-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-021"],"lead":"","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，为保护民营企业，办案机关不得对本行政区域以外的民营经济组织实施异地执法。","opts":[],"answer":"错误","fix":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，办案机关需要异地执法的，应当遵守法定权限、条件和程序，该法禁止的是为经济利益等目的滥用职权实施异地执法。","explain":"错因：把法律禁止的“为经济利益等目的滥用职权实施异地执法”扩大成了禁止一切异地执法（被替换的是禁止对象的范围）。企业跨地区经营，依法跨地区办案仍可进行，该法还要求健全异地执法协助机制。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-021-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-021"],"lead":"某地办案机关在办理一起涉及民营企业的案件时，拟对相关财产采取查封、扣押、冻结措施。","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》，下列做法符合该法要求的是（）。","opts":[{"text":"为防止转移，对企业负责人亲属名下的房产不加区分一并查封","correct":false,"why":"错因：没有区分涉案人与案外人财产（被替换的是措施对象）。该法要求区分涉案人财产与案外人财产、涉案财物与合法财产，案外人的财产不能因为与当事人有亲属关系就一并查封。"},{"text":"为确保追缴到位，冻结数额可以适当高于涉案金额","correct":false,"why":"错因：突破了数额边界（被替换的是措施范围）。查封、扣押、冻结不得超权限、超范围、超数额、超时限。"},{"text":"区分涉案财物与合法财产、企业与经营者个人财产后，依法定权限和程序采取措施","correct":true,"why":"符合要求：严格区分涉案与非涉案、组织与个人、涉案人与案外人财产，并在法定权限、条件和程序内采取措施。"},{"text":"对两家企业之间的合同欠款纠纷，立案冻结欠款方账户以促成还款","correct":false,"why":"错因：把经济纠纷当成了经济犯罪处理（被替换的是案件性质）。该法要求办案区分经济纠纷与经济犯罪，不能用刑事立案和冻结措施替企业催收欠款。"}],"answer":"","fix":"","explain":"该法不禁止依法查封、扣押、冻结，而是要求每项强制措施对象明确、依据合法：区分经济纠纷与经济犯罪，区分涉案与非涉案、企业与个人、涉案人与案外人财产，不超权限、范围、数额、时限。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）；情境为假设案例，不对任何现实案件下结论。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-022-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-022"],"lead":"","stem":"依据2025年5月20日起施行的《中华人民共和国民营经济促进法》第52条，市场监管领域行政检查原则上实行“双随机、一公开”，但直接涉及公共安全和人民群众生命健康等的特殊行业、重点领域可以依法依规实行全覆盖的重点监管。","opts":[],"answer":"正确","fix":"","explain":"随机抽取检查对象、随机选派检查人员并公开抽查事项和结果是一般规则；直接涉及公共安全、群众生命健康的特殊行业、重点领域依法依规实行全覆盖重点监管是法定例外；对同一对象的多个检查事项还应尽可能合并或跨部门联合。减少干扰与依法监管可以同时成立。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）第52条。","refs":["LAW-S08"],"origin":"自编","review":""},{"id":"F-LAW-022-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-022","GD-013"],"lead":"《广东省2026年优化法治化一流营商环境工作方案》提出推行“亮码入企”、分类监管和综合检查等涉企行政检查改革，以减少随意、多头、重复检查。","stem":"结合2025年5月20日起施行的《中华人民共和国民营经济促进法》的相关规定，下列理解正确的有（）。","opts":[{"text":"对同一企业的多个检查事项尽可能合并或跨部门联合检查，可以减少多头、重复入企","correct":true,"why":"民营经济促进法第52条要求对同一检查对象的多个检查事项尽可能合并或者跨部门联合检查，与广东综合检查改革减少重复检查的方向一致。"},{"text":"减少涉企检查后，即便企业被举报有明确违法线索，也只能等下一轮随机抽查再处理","correct":false,"why":"错因：把“减少随意、重复检查”换成了“有线索也不能依法检查”（被替换的是关系）。是否检查仍应依法根据风险、线索和权限处理。"},{"text":"“亮码入企”让检查主体和事项可识别、可监督，但扫码本身不能证明该次检查实体合法","correct":true,"why":"亮码是可核对的程序工具，便于企业和社会监督检查过程；检查是否合法，仍要看权限、依据和程序。"},{"text":"方案要求公开涉企行政检查相关信息，以减少随意检查、加强对检查的监督","correct":true,"why":"方案要求公开涉企行政检查相关信息，推行亮码入企、分类监管及综合检查改革，目的是减少随意、多头、重复检查并加强监督。"}],"answer":"","fix":"","explain":"减少干扰针对的是随意、多头、重复检查，不是取消依法监管：有明确违法线索的，仍应依法根据风险、线索和权限处理。公开检查信息、亮码入企、综合检查让检查过程可识别、可监督，但不能替代对检查权限和依据的实体判断。","condition":"中国大陆；《中华人民共和国民营经济促进法》（2025年4月30日通过，2025年5月20日起施行）第52条；《广东省2026年优化法治化一流营商环境工作方案》（中共广东省委全面依法治省委员会办公室，2026年2月4日发布）。方案是工作部署，具体检查权限、期限、程序须另依法律法规。","refs":["LAW-S08","GD-S09"],"origin":"自编","review":""},{"id":"F-LAW-023-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-023"],"lead":"","stem":"关于我国新制定的《中华人民共和国法治宣传教育法》，下列表述正确的有（）。","opts":[{"text":"该法于2025年9月12日通过，自通过之日起施行","correct":false,"why":"错因：把施行日期换成了通过日期（被替换的是：阶段）。该法2025年9月12日通过，自2025年11月1日起施行。"},{"text":"法治宣传教育工作实行党委领导、人大监督、政府主导、各方协同、社会参与的工作机制","correct":true,"why":"这是该法规定的工作机制：党委、人大、政府分别对应“领导、监督、主导”，不能互换。"},{"text":"国家实行公民终身法治教育，法治宣传教育并不只面向在校学生","correct":true,"why":"终身法治教育覆盖人的一生，不限于学校阶段。"},{"text":"宪法和中华优秀传统法律文化都属于法治宣传教育的内容","correct":true,"why":"该法规定的内容包括宪法、法律常识和制度、法治实践成就、中华优秀传统法律文化等，不限于背诵现行条文。"}],"answer":"","fix":"","explain":"法治宣传教育法的识别点：2025年11月1日起施行；国家实行公民终身法治教育；党委领导、人大监督、政府主导、各方协同、社会参与；司法行政部门主管相应区域工作，国家机关按“谁执法谁普法”实行责任制；内容包括宪法和中华优秀传统法律文化等。","condition":"中国大陆；《中华人民共和国法治宣传教育法》（2025年9月12日通过，2025年11月1日起施行）。","refs":["LAW-S09"],"origin":"自编","review":"","o":176,"t":2},{"id":"F-LAW-023-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-023"],"lead":"2026年5月，某区市场监督管理局查处一起虚假宣传案件。执法人员向当事商户逐条说明其违反的法律规定和整改要求，随后又在门户网站发布了该案的释法说理文章。","stem":"依据2025年11月1日起施行的《中华人民共和国法治宣传教育法》，对此理解正确的是（）。","opts":[{"text":"释法说理应由司法行政部门承担，市场监管局只需依法作出处罚","correct":false,"why":"错因：把司法行政部门的“主管”换成了“独家承担”（被替换的是责任主体）。国家机关按“谁执法谁普法”承担普法责任，执法机关不能只罚不讲。"},{"text":"这体现了国家机关按照“谁执法谁普法”落实普法责任制","correct":true,"why":"执法机关把释法说理融入执法办案和案例发布，正是“谁执法谁普法”的普法责任制。"},{"text":"该法的法治教育主要面向在校学生，向经营者释法不属于其要求","correct":false,"why":"错因：把“公民终身法治教育”缩小成了学校教育（被替换的是对象范围）。"},{"text":"依该法，法治宣传教育工作由政府领导、党委主导，该局据此开展普法","correct":false,"why":"错因：把“党委领导、政府主导”互换了（被替换的是主体与职责的对应关系）。该法规定的机制是党委领导、人大监督、政府主导、各方协同、社会参与。"}],"answer":"","fix":"","explain":"司法行政部门主管相应区域的法治宣传教育工作，但普法责任不只在司法行政部门：国家机关按“谁执法谁普法”实行责任制，执法办案本身就是普法场景；普法对象是全体公民，覆盖终身。","condition":"中国大陆；《中华人民共和国法治宣传教育法》（2025年9月12日通过，2025年11月1日起施行）。","refs":["LAW-S09"],"origin":"自编","review":""},{"id":"F-LAW-024-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-024"],"lead":"2026年4月，某市在全民阅读活动周期间组织系列活动，市公共图书馆、多家商业书店和数字阅读平台都参与其中。","stem":"依据2026年2月1日起施行的《全民阅读促进条例》，下列说法正确的是（）。","opts":[{"text":"该条例由全国人大常委会通过，属于法律，效力高于行政法规","correct":false,"why":"错因：把制定机关和规范层级换错了（被替换的是层级）。该条例由国务院制定，属于行政法规。"},{"text":"市内商业书店与公共图书馆一样，负有免费开放阅览室、自习室的法定义务","correct":false,"why":"错因：把公共图书馆的法定义务扩大到了商业机构（被替换的是义务主体）。条例规定的是公共图书馆应当免费开放，社会力量是可以参与。"},{"text":"条例要求以数字阅读逐步取代传统纸质阅读","correct":false,"why":"错因：把“数字阅读与传统阅读相结合”换成了“替代”（被替换的是关系）。"},{"text":"市公共图书馆应当免费开放阅览室、自习室等","correct":true,"why":"条例规定公共图书馆应当免费开放阅览室、自习室等。"}],"answer":"","fix":"","explain":"《全民阅读促进条例》是国务院制定的行政法规，2026年2月1日起施行；公共图书馆应当免费开放阅览室、自习室等，社会力量可以参与，数字阅读与传统阅读相结合，不能把公共图书馆的义务扩张到所有商业书店。","condition":"中国大陆；《全民阅读促进条例》（国务院令第823号，行政法规，2026年2月1日起施行）。","refs":["LAW-S10"],"origin":"自编","review":""},{"id":"F-LAW-024-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"LAW","cards":["LAW-024","LAW-019","LAW-023","LAW-015","LAW-030"],"lead":"①《全民阅读促进条例》（某部委网站于2025年12月19日转载其全文）；②《中华人民共和国治安管理处罚法》（2025年修订）；③《中华人民共和国民营经济促进法》；④《中华人民共和国法治宣传教育法》。","stem":"上述法律、行政法规按施行日期由早到晚排列，正确的是（）。","opts":[{"text":"③④②①","correct":true,"why":"③2025年5月20日施行；④2025年11月1日施行；②2026年1月1日施行；①2026年2月1日施行。"},{"text":"③②④①","correct":false,"why":"错因：把②的修订通过日期（2025年6月27日）当成了施行日期（被替换的是阶段：通过→施行）。新治安管理处罚法2026年1月1日起施行。"},{"text":"③④①②","correct":false,"why":"错因：把①的网页转载日期（2025年12月19日）当成了施行日期（被替换的是日期类型：转载→施行）。该条例2026年2月1日起施行，晚于②。"},{"text":"④③②①","correct":false,"why":"错因：把③和④的先后弄反（被替换的是时间顺序）。民营经济促进法2025年5月20日施行，法治宣传教育法2025年11月1日施行。"}],"answer":"","fix":"","explain":"排施行顺序只看各自的施行条款：民营经济促进法2025年5月20日、法治宣传教育法2025年11月1日、新治安管理处罚法2026年1月1日、全民阅读促进条例2026年2月1日。通过日期、公布日期和网页转载日期都不能代替施行日期。","condition":"中国大陆；①国务院令第823号，行政法规，2026年2月1日起施行，网页转载日期2025年12月19日；②2025年6月27日修订通过，2026年1月1日起施行；③2025年4月30日通过，2025年5月20日起施行；④2025年9月12日通过，2025年11月1日起施行。","refs":["LAW-S10","LAW-S08","LAW-S09","LAW-S07"],"origin":"自编","review":""},{"id":"F-LAW-028-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-028"],"lead":"","stem":"依据《中华人民共和国行政处罚法》（2021年修订，2021年7月15日起施行）第33条，在法律、行政法规没有另行规定的情况下，下列说法正确的有（）。","opts":[{"text":"违法行为轻微并及时改正，没有造成危害后果的，不予行政处罚","correct":true,"why":"轻微、及时改正、没有造成危害后果三项同时具备的，不予行政处罚。"},{"text":"初次违法且危害后果轻微并及时改正的，行政机关应当不予行政处罚","correct":false,"why":"错因：把“可以不予行政处罚”换成了“应当不予”（被替换的是处理强度）。初次违法、后果轻微、及时改正三项具备时，行政机关有裁量空间，初次违法不等于必须不罚。"},{"text":"行政机关依法对当事人不予行政处罚，说明该行为不属于违法行为","correct":false,"why":"错因：把处理结果当成了行为性质（被替换的是关系）。不予处罚的前提恰恰是存在违法行为；依法不予处罚的，行政机关还应当对当事人进行教育。"},{"text":"当事人有证据足以证明没有主观过错的，不予行政处罚","correct":true,"why":"有证据足以证明没有主观过错的，不予行政处罚；法律、行政法规另有规定的从其规定，题干已排除这种情况。"}],"answer":"","fix":"","explain":"第33条三种情形强度不同：轻微并及时改正、没有危害后果的“不予”；初次违法、后果轻微并及时改正的“可以不予”；有证据足以证明没有主观过错的“不予”（法律、行政法规另有规定的除外）。不予处罚不等于行为合法，依法不予处罚的应当教育。","condition":"中国大陆；《中华人民共和国行政处罚法》（2021年1月22日修订通过，2021年7月15日起施行）第33条；按一般规定作答，不考虑法律、行政法规的特别规定。","refs":["LAW-S14"],"origin":"自编","review":""},{"id":"F-LAW-028-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-028"],"lead":"2026年5月，某县市场监督管理局检查发现，一家民营超市首次出现一项轻微的经营违法行为，危害后果轻微，超市当天即改正。假定法律、行政法规对该行为没有特别规定。","stem":"依据《中华人民共和国行政处罚法》（2021年修订）第33条，下列说法正确的是（）。","opts":[{"text":"该局可以不予处罚，但决定不予处罚的，应当对超市进行教育","correct":true,"why":"初次违法、危害后果轻微、及时改正三项都具备，可以不予行政处罚；依法不予处罚的，行政机关应当对当事人进行教育。"},{"text":"因属初次违法，该局应当作出不予处罚的决定","correct":false,"why":"错因：把“可以不予行政处罚”换成了“应当不予”（被替换的是处理强度）。初次违法不等于必须不罚。"},{"text":"该局应当给予处罚，可在警告、罚款等处罚种类中选择","correct":false,"why":"错因：删掉了法律给出的“可以不予行政处罚”这一选项（被替换的是处理方式），走到了另一个极端。"},{"text":"超市承诺不再违法的，即使危害后果严重，该局也可以不予处罚","correct":false,"why":"错因：删掉了“危害后果轻微”这一条件（被替换的是条件），把容错变成了只看态度。"}],"answer":"","fix":"","explain":"首违不罚是“可以不罚”，须同时具备初次违法、危害后果轻微、及时改正；条件齐备时行政机关有裁量空间，既不是必须不罚，也不是不能不罚；依法不予处罚的仍应教育。","condition":"中国大陆；《中华人民共和国行政处罚法》（2021年1月22日修订通过，2021年7月15日起施行）第33条；题干已假定没有法律、行政法规的特别规定。","refs":["LAW-S14"],"origin":"自编","review":""},{"id":"F-LAW-029-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-029"],"lead":"2026年6月，个体工商户王某对某县住房和城乡建设局作出的行政处罚决定不服。该局是县人民政府工作部门，不属于实行垂直领导的行政机关；该事项也不属于法律规定须先申请行政复议的情形。","stem":"依据2024年1月1日起施行的《中华人民共和国行政复议法》（2023年修订），下列说法正确的是（）。","opts":[{"text":"王某申请行政复议的，应当向县人民法院提出","correct":false,"why":"错因：把行政复议机关换成了人民法院（被替换的是主体）。人民法院审理行政诉讼，不办理行政复议。"},{"text":"王某申请行政复议的，应当向市住房和城乡建设局提出","correct":false,"why":"错因：把“本级人民政府”换成了“上一级主管部门”（被替换的是复议机关）。对县级以上地方政府工作部门的行为不服，通常向本级政府申请复议，不能死背“总找上一级”；垂直领导等另有规定的情形题干已排除。"},{"text":"王某必须先申请行政复议，对复议决定不服才能起诉","correct":false,"why":"错因：把法定复议前置情形扩大到了所有案件（被替换的是条件）。本案不属于复议前置情形，王某也可以依法直接提起行政诉讼。"},{"text":"王某申请行政复议的，应当向县人民政府提出","correct":true,"why":"现行复议法下，对县级以上地方政府工作部门作出的行政行为不服的，通常向本级人民政府申请行政复议；县住建局是县政府工作部门。"}],"answer":"","fix":"","explain":"行政复议由县级以上人民政府以及法律规定的其他行政机关办理，行政诉讼由人民法院审理；对县级以上地方政府工作部门（垂直领导等另有规定的除外）的行为不服，通常向本级政府申请复议。是否须先复议，要看是否属于法律规定的前置情形。","condition":"中国大陆；《中华人民共和国行政复议法》（2023年9月1日修订通过，2024年1月1日起施行）；题干已限定非垂直领导机关、非复议前置情形。","refs":["LAW-S15"],"origin":"自编","review":""},{"id":"F-LAW-029-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-029"],"lead":"","stem":"《中华人民共和国行政复议法》（2023年修订，2024年1月1日起施行）没有规定须先申请行政复议的情形，公民对行政行为不服的，都可以不经复议直接提起行政诉讼。","opts":[],"answer":"错误","fix":"《中华人民共和国行政复议法》（2023年修订，2024年1月1日起施行）规定了须先申请行政复议的情形；属于这些情形的，应当先申请行政复议，对复议决定不服的再依法提起行政诉讼，其他情形一般可以选择复议或者直接起诉。","explain":"错因：删掉了法定的复议前置情形（被替换的是条件）。现行复议法强调发挥行政复议化解行政争议的主渠道作用；不是所有案件都必须先复议，也不是所有案件都能跳过复议，要先查是否属于法定前置情形。","condition":"中国大陆；《中华人民共和国行政复议法》（2023年9月1日修订通过，2024年1月1日起施行）；本题只考有无复议前置，不考具体前置事项。","refs":["LAW-S15"],"origin":"自编","review":""},{"id":"F-LAW-030-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-030"],"lead":"据《南方日报》2026年11月26日报道，广东省十四届人大常委会第二十八次会议于11月25日召开，会议听取了关于人工智能发展促进条例草案、县域经济振兴条例草案的说明。","stem":"仅依据这则报道，下列判断恰当的是（）。","opts":[{"text":"会议听取草案说明后，两部条例即自11月25日起在全省施行","correct":false,"why":"错因：把“听取草案说明”换成了“施行”（被替换的是阶段）。审议不等于通过，通过、公布也不等于施行，施行日要看正式文本的施行条款。"},{"text":"两部草案中的条文，可以作为当前认定企业权利义务的现行法律依据","correct":false,"why":"错因：把草案当成了现行有效的规范（被替换的是规范状态）。草案条文不能作为现行法答案。"},{"text":"两部条例草案已提请本次会议审议，是否通过、何时施行须另查正式文本","correct":true,"why":"报道只能证明两部条例在报道所述会议上以草案形式提请审议；要认定已经生效，须查正式通过、公布的文本及其施行条款。"},{"text":"据此可以断定，两部条例截至11月27日仍然没有表决通过","correct":false,"why":"错因：把“现有证据不足以证明已经通过”换成了“断定没有通过”（被替换的是判断性质：证据状态被当成了事实结论）。这则报道既不能证明已经通过，也不能证明此后没有通过。"}],"answer":"","fix":"","explain":"法制时事要分清计划、草案、审议、通过、公布、施行：这则报道只说明草案进入常委会审议，既不能据此认定条例已经生效，也不能据此断言此后没有通过，须另查正式公布文本和施行条款。","condition":"广东省地方性法规；证据仅限《南方日报》2026年11月26日关于省十四届人大常委会第二十八次会议（11月25日召开）的报道（广东人大网同日刊载，记载会议听取省人民政府关于两项草案等法规案的说明）；截至2026年11月27日检索，未取得两部条例完整的通过、公布、施行依据，草案实质条文不作现行法答案（E-YF-03）。","refs":["LAW-S16","LAW-S01","E-YF-03"],"origin":"自编","review":""},{"id":"F-LAW-030-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-030"],"lead":"小周在整理2026年法治时事笔记时，对几则材料作出如下判断。","stem":"下列判断中，正确的有（）。","opts":[{"text":"某条例已表决通过并公布，但其规定的施行日期尚未到来，现在已可据以处罚","correct":false,"why":"错因：把“通过、公布”换成了“施行”（被替换的是阶段）。施行日期未到，条例尚未生效，不能作为处罚依据。"},{"text":"某条例已公布并规定自公布之日起施行，但尚未见网站转载，所以还不能认定其已施行","correct":false,"why":"错因：把网站转载当成了生效条件（被替换的是条件）。施行看正式公布文本的施行条款，与网页何时转载无关。"},{"text":"某省条例已列入省人大常委会年度立法工作计划，据此尚不能认定该条例已经生效","correct":true,"why":"立法计划只是工作安排，不能单独证明规则已经现行有效。"},{"text":"核对地方性法规要看全称、制定机关、适用地域和施行日期，广州市法规不能代替广东省法规","correct":true,"why":"省级法规与广州、深圳等市级同名、近名法规的制定机关和适用地域不同，须逐一核对，不能互相替代。"}],"answer":"","fix":"","explain":"核验法律状态看正式文本：立法计划、征求意见、常委会审议都不能单独证明规则已经生效；通过、公布之后还要看施行条款；制定机关、适用地域要逐一核对；网页转载日期、网址年份都不能代替施行条款。","condition":"中国大陆；以《中华人民共和国立法法》（2023年第二次修正）规定的法律、法规通过和公布程序为背景；本题只考核验法律状态的方法，不涉及任何草案的实体内容。","refs":["LAW-S01"],"origin":"自编","review":""},{"id":"F-GD-001-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-001"],"lead":"","stem":"2026年2月召开的广东全省高质量发展大会以制造业与服务业协同发展为主题，这表明广东产业发展的重心已由制造业转向服务业。","opts":[],"answer":"错误","fix":"2026年2月召开的广东全省高质量发展大会以制造业与服务业协同发展为主题，强调两者互相增强，而不是用服务业替代制造业。","explain":"错在后半句：把“协同”换成了“替代”（关系替换）。大会聚焦两业协同，仍强调制造业基础，同时提升服务业的支撑和增值作用；制造活动需要研发、设计、金融、物流等服务，也会带来服务的新需求，不能把服务业举措读成放弃制造业。","condition":"2026年2月24日广东全省高质量发展大会（GD-S02）。","refs":["GD-S02"],"origin":"自编","review":"","o":10,"t":1},{"id":"F-GD-002-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"GD","cards":["GD-002"],"lead":"甲企业原本生产工程机械，近年开始为客户提供设备远程监测、定期运维和整体解决方案。乙企业原本是家居电商平台，依托用户数据和设计能力推出自有品牌家具，委托工厂代工生产，自己不建工厂。","stem":"从业务延伸的方向看，对甲、乙两家企业的判断正确的是（）","opts":[{"text":"甲体现服务业制造化；乙依托数据委托制造，体现制造业服务化","correct":false,"why":"错因：延伸方向倒置（关系替换）。甲的原业务是制造，向运维和解决方案延伸，是制造端长出服务；乙的原业务是电商服务，进入产品制造环节，是服务端进入制造。"},{"text":"甲体现制造业服务化；乙依托数据委托制造，体现服务业制造化","correct":true,"why":"判断看原业务向哪一端延伸：制造企业从卖设备延伸到运维、整体解决方案，可体现制造业服务化；电商平台依托数据和设计，通过委托制造进入产品制造环节，可体现服务业制造化。"},{"text":"甲体现制造业服务化；乙没有自建工厂，不能体现服务业制造化","correct":false,"why":"错因：给服务业制造化加了“必须自建工厂”的条件（条件替换）。委托制造本就是服务主体进入制造环节的方式之一，不要求厂房归自己所有。"},{"text":"甲的运维服务不产出实体产品，不能体现两业融合；乙体现服务业制造化","correct":false,"why":"错因：把“有没有实体产品”当成判断标准（条件替换）。制造企业延伸到运维、整体解决方案，正是制造业服务化的典型表现。"}],"answer":"","fix":"","explain":"判断依据是企业原业务与新增业务之间的延伸方向，不是有没有厂房、有没有实体产品：制造端长出服务是制造业服务化，服务端进入制造是服务业制造化。","condition":"依据《广东省推动制造业与服务业协同融合发展2026年行动方案》（网页2026-03-26公开，GD-S03）；判断的是业务延伸方向，不是企业的统计行业归属。材料为自编情境。","refs":["GD-S03"],"origin":"自编","review":"","o":25,"t":1},{"id":"F-GD-003-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-003"],"lead":"广东推动制造业与服务业协同发展，需要识别哪些服务在直接支撑生产经营。","stem":"按服务对象和功能判断，下列业务中可以体现生产性服务的有（）","opts":[{"text":"某物流公司为整车厂提供零部件入厂配送和库存管理","correct":true,"why":"服务对象是整车厂的生产经营，零部件配送和库存管理属于物流、供应链支撑，可体现生产性服务。"},{"text":"同一家物流公司为小区居民提供生鲜到家配送","correct":false,"why":"错因：服务对象换成了居民生活（对象替换），这是面向居民生活的服务，侧重点不同。同一企业的不同业务要分别按服务对象和功能判断，不能因为企业属于物流业就认定它每项业务都是生产性服务。"},{"text":"某检测机构为电子元器件厂提供出厂前的可靠性检测","correct":true,"why":"检验检测直接支撑制造企业的产品质量和生产经营，是生产性服务的典型入口；服务不产出有形商品，同样可以直接支撑实体生产。"},{"text":"某金融机构根据制造企业的订单为其提供供应链融资","correct":true,"why":"为生产经营提供融资支撑，可体现生产性服务。判断依据是这笔融资服务于企业生产经营，而不是“金融”这个行业标签。"}],"answer":"","fix":"","explain":"生产性服务看服务谁、起什么作用：为生产经营提供研发设计、检验检测、物流、供应链、融资等支撑的，可体现生产性服务；面向居民生活的服务侧重点不同。同一企业可能两类业务都有，要逐项按业务判断。2026年6月广东省政府印发的服务业扩能提质方案也分两条方向：推动生产性服务业向专业化和价值链高端延伸，推进生活性服务业高品质多样化便利化发展。","condition":"依据两业协同2026年行动方案（GD-S03）、2026年广东省政府工作报告（GD-S01）和《广东省推进服务业扩能提质实施方案》（粤府〔2026〕36号，2026-06-13，E-GD-07）；按每项业务的服务对象和功能判断，不按企业名称整体归类。材料为自编情境。","refs":["GD-S03","GD-S01","E-GD-07"],"origin":"自编","review":"","o":186,"t":2},{"id":"F-GD-004-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-004","P2-16"],"lead":"备考小组整理“新兴产业、未来产业”名单，每条笔记都注明了依据文件：2025年《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（简称国家《建议》）、2026年《中华人民共和国国民经济和社会发展第十五个五年规划纲要》（简称国家《纲要》）、2026年广东省政府工作报告。","stem":"下列笔记与所注文件的列法相符的是（）","opts":[{"text":"依据2026年广东省政府工作报告：生物制造列在未来产业的列举中","correct":false,"why":"错因：把国家文件的列法套到了广东报告上（文件替换）。2026年广东省政府工作报告把生物制造列在新兴产业的列举中；该报告的新兴产业与未来产业写在同一小节，要看具体列在哪一组。"},{"text":"依据2025年国家《建议》：低空经济列在未来产业中","correct":false,"why":"错因：把新兴产业的项目移到了未来产业（类别替换）。国家《建议》把新能源、新材料、航空航天、低空经济等列在新兴产业。"},{"text":"依据2026年国家《纲要》：生物制造列在未来产业部分","correct":true,"why":"与所注文件相符：2026年国家《纲要》和2025年国家《建议》都在未来产业部分列生物制造。"},{"text":"依据2025年国家《建议》：纺织列在新兴产业中","correct":false,"why":"错因：把传统产业的项目移到了新兴产业（类别替换）。国家《建议》把船舶、纺织、机械等列在传统产业优化提升中。"}],"answer":"","fix":"","explain":"产业名单是文件语境中的列法：生物制造在2025年国家《建议》和2026年国家《纲要》中列在未来产业，在2026年广东省政府工作报告和《广东省国民经济和社会发展第十五个五年规划纲要》中列入新兴产业。同为十五五纲要，国家与广东省的列法不同，只写“据十五五纲要”不能定答案。答题先认清题干依据哪份文件、哪一年，不要给所有文件套一张统一分类表。","condition":"按各项所注文件判断：国家《建议》2025-10-23通过（G15SUG）；国家《纲要》2026-03-12经全国人大批准，生物制造见第五章第二节“前瞻布局未来产业”（T15、E-DB-01）；广东省政府工作报告2026-01-26作报告、网页2026-01-31发布（GD-S01）；《广东省国民经济和社会发展第十五个五年规划纲要》（2026-01-29省人大批准）不在本题选项中，其列法同广东报告（E-DB-01）。","refs":["GD-S01","G15SUG","T15","E-DB-01"],"origin":"自编","review":"","o":60,"t":1},{"id":"F-GD-004-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-004"],"lead":"","stem":"2026年广东省政府工作报告把生物制造列入新兴产业，与2025年国家十五五《建议》列入未来产业的做法不一致，属于广东报告的归类错误。","opts":[],"answer":"错误","fix":"2026年广东省政府工作报告把生物制造列入新兴产业，与2025年国家十五五《建议》列入未来产业的做法不一致，这是两份文件各自的列法，判断归类要按题干指定的文件和年份。","explain":"错在把文件之间的列举差异推成“某份文件写错”（关系替换：把文件语境中的列法当成唯一的永久分类）。产业名单服务于特定规划文本，同一项目在不同文件中的位置可以不同；答题时锁定文件和年份即可，不要自行判定哪份文件有误。","condition":"2026年广东省政府工作报告（GD-S01）；2025年国家十五五《建议》（G15SUG）；2026年国家十五五规划《纲要》同样在未来产业部分列生物制造（T15）。另据E-DB-01，《广东省国民经济和社会发展第十五个五年规划纲要》（2026-01-29省人大批准）同广东报告列在新兴产业，中央2026年10月《关于发展新质生产力的意见》第（八）项同国家文件列在未来产业；证据未采用任何对差异成因的官方解释。","refs":["GD-S01","G15SUG","T15","E-DB-01"],"origin":"自编","review":""},{"id":"F-GD-005-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-005"],"lead":"","stem":"广东以先进制造业为骨干构建现代化产业体系，同时推进一二三次产业协调融合，这说明“骨干”并不等于整个产业体系只有制造业。","opts":[],"answer":"正确","fix":"","explain":"“骨干”指体系中的重要支撑，不等于整个产业体系只有制造业：农业、服务业仍在体系之中，要推进三次产业协调融合；产业升级也包括传统产业改造。常见错误是把“以先进制造业为骨干”读成淘汰传统产业、压缩农业和服务业，或推出“制造业占比越高越好”。","condition":"依据2026年广东全省高质量发展大会报道（GD-S02）和广东十五五规划纲要新闻发布会实录（GD-S07）。","refs":["GD-S02","GD-S07"],"origin":"自编","review":"","o":141,"t":1},{"id":"F-GD-006-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-006"],"lead":"某同学阅读2026年广东省政府工作报告，记下四条关于经济增长目标的笔记。","stem":"下列笔记正确的是（）","opts":[{"text":"2026年地区生产总值增长4.5%—5%，是报告提出的当年预期目标","correct":true,"why":"报告提出2026年地区生产总值增长4.5%—5%的预期目标：时间范围是2026年一年，性质是预期目标。"},{"text":"十五五时期年均增长5%左右，2026年当年的增长目标也是5%左右","correct":false,"why":"错因：把五年期间的年均口径换成了单年目标（时间范围替换）。2026年当年的预期目标是4.5%—5%。"},{"text":"报告提出的2026年增长4.5%—5%，是广东当年已经实现的增速","correct":false,"why":"错因：把预期目标换成了已实现的统计结果（阶段替换）。目标不等于统计结果，不能从目标推导年底实际增速。"},{"text":"4.5%—5%是十五五时期的年均目标，5%左右是2026年的增长目标","correct":false,"why":"错因：两个目标的时间范围对调（时间范围替换）。4.5%—5%对应2026年，5%左右对应十五五时期的年均增长。"}],"answer":"","fix":"","explain":"单年预期目标（2026年增长4.5%—5%）、五年年均目标（广东十五五时期年均增长5%左右）和已实现的统计结果是三回事：先看时间范围，再看是“预期”还是“已经达到”。5%左右是广东省纲要的全省五年平均目标，不规定每年下限；国家纲要对GDP只写“保持在合理区间、各年度视情提出”，不能把5%左右当作全国五年目标。","condition":"2026年广东省政府工作报告（2026-01-26作报告，网页2026-01-31发布，GD-S01）；十五五时期“全省GDP年均增长5%左右”见《广东省国民经济和社会发展第十五个五年规划纲要》发展目标（2026-01-29省人大批准，E-DB-02；另见GD-S07）。只辨识文件信息，不推断年底实际增速。","refs":["GD-S01","GD-S07","E-DB-02","E-PT-02"],"origin":"自编","review":""},{"id":"F-GD-007-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-007"],"lead":"2026年，广东印发全面推进“百千万工程”实现五年显著变化的行动方案。","stem":"下列关于“百千万工程”和这份行动方案的理解，正确的有（）","opts":[{"text":"工程名称中的“百、千、万”，分别是恰好100个县、1000个镇、10000个村","correct":false,"why":"错因：把名称中的规模概括当成了精确的行政单位数量（数量口径替换）。文件口径是县（市、区）、乡镇（街道）、行政村（社区）；若考具体数量，必须注明所据文件和年份。"},{"text":"工程全称是“百县千镇万村高质量发展工程”，着眼县、镇、村联动发展","correct":true,"why":"全称正确；工程是县镇村整体的高质量发展，不只是农村人居环境整治。"},{"text":"2026年行动方案的部署涉及县域产业、县城引领、镇村赋能、集成改革、社会参与等方面","correct":true,"why":"方案围绕五年显著变化，部署县域产业、县城引领、镇村赋能、集成改革、社会参与五个方面，并配套保障机制。官方消息的措辞是县域产业、县城龙头引领、镇村特色化差异化、集成式改革、社会力量参与，各报道概括略有不同，不影响本项判断。"},{"text":"2026年行动方案的印发，标志着“五年显著变化”的目标已经实现","correct":false,"why":"错因：把部署文件当成了成效验收（阶段替换）。方案发布是作出部署，不等于相关目标在2026年已经完成。"}],"answer":"","fix":"","explain":"记住全称和县镇村联动的范围，名称中的数字不是精确数量。2026年方案是从“三年初见成效”向“五年显著变化”推进的部署，目标、行动和已取得的成果要分开。省委2022年《决定》写明的阶段目标是“到2027年，城乡区域协调发展取得明显成效，县域综合实力明显增强”，2026年发文与2027年阶段目标可以同时成立。","condition":"广东省“百千万工程”指挥部印发的全面推进百千万工程实现五年显著变化行动方案（2026年5月公开报道，GD-S04、GD-S05、E-GD-01）；名称口径参GD-S21。报道日期不等于方案签发日期，签发日和逐字条款未核得；本题不考目标年份（2027年阶段目标见省委2022年《决定》，E-GD-01）。","refs":["GD-S04","GD-S05","GD-S21","E-GD-01"],"origin":"自编","review":"","o":93,"t":1},{"id":"F-GD-008-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-008"],"lead":"某县推进县域医疗卫生服务体系建设：县人民医院向各乡镇卫生院派驻专家、开通远程会诊；乡镇卫生院接收县医院下转的康复病人，并指导村卫生站做好慢病随访；村民常见病在村里、镇里就近处理，大病转到县医院。","stem":"结合“百千万工程”中县城、乡镇、乡村的功能，下列对材料的理解有误的是（）","opts":[{"text":"县人民医院派驻专家、开通远程会诊，体现县城对镇村的辐射带动","correct":false,"why":"理解正确，不选：县城承担连接城乡、辐射镇村的带动作用，县医院把专家和会诊资源送到乡镇正体现这一点。"},{"text":"乡镇卫生院上接县医院、下连村卫生站，体现乡镇联城带村的节点作用","correct":false,"why":"理解正确，不选：乡镇是联城带村的重要节点，乡镇卫生院在县医院和村卫生站之间承上启下。"},{"text":"常见病就近处理、大病转到县医院，说明医疗服务要按实际条件分层组织","correct":false,"why":"理解正确，不选：产业、服务和基础设施需按实际条件组织，常见病和大病分层处理是功能分工。"},{"text":"材料中的分级安排说明，村卫生站应逐步按县医院的规模和科室来建设","correct":true,"why":"这项理解有误，是本题答案：材料体现的是县、镇、村分级分工，这项却读成了村级设施要向县医院看齐（关系替换：功能互补换成了同规模重复建设）。提高基本服务可及性靠合理布局和资源下沉，不是每个村都复制县城的设施规模和形式。"}],"answer":"","fix":"","explain":"在百千万工程语境中，县城辐射带动镇村，乡镇是联城带村的节点，村庄与周边的市场和服务相连；三者功能互补、联动发展，不是同一层级的重复建设。","condition":"百千万工程行动方案语境（GD-S04、GD-S05）；材料为自编情境。","refs":["GD-S05","GD-S04"],"origin":"自编","review":""},{"id":"F-GD-009-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-009"],"lead":"","stem":"新发展格局的战略支点、高质量发展的示范地、中国式现代化的引领地，是对横琴粤澳深度合作区的“一点两地”定位。","opts":[],"answer":"错误","fix":"新发展格局的战略支点、高质量发展的示范地、中国式现代化的引领地，是对粤港澳大湾区的“一点两地”定位。","explain":"错在定位对象：把粤港澳大湾区的区域战略定位移接到了横琴这一单个合作平台（主体替换）。“一点两地”分别落在国内国际循环、发展质量和现代化实践三个层面，主语是粤港澳大湾区。","condition":"定位表述见2026年广东省政府工作报告及2026年全省大湾区办工作会议报道（GD-S01、GD-S19）。","refs":["GD-S01","GD-S19"],"origin":"自编","review":"","o":62,"t":1},{"id":"F-GD-010-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-010"],"lead":"某市与港澳相关机构合作，推动一批产品的检测认证结果在粤港澳三地互认，企业同一批产品检测一次，结果即可在三地使用。","stem":"仅就这一直接举措而言，它最直接体现的是（）","opts":[{"text":"硬联通：产品通关更快、货物往来更多，属于设施互通","correct":false,"why":"错因：按后续效果归类（依据替换）。货物往来增多是结果；硬联通的典型入口是基础设施互联，这项举措并没有新建设施。"},{"text":"软联通：这项举措直接着力于检测认证标准和规则机制的衔接","correct":true,"why":"标准、职业资格、政务规则和机制衔接是软联通的典型入口；检测认证结果互认首先消除的是规则层面的摩擦。"},{"text":"心联通：三地企业交往增多，社会认同随之增强","correct":false,"why":"不如目标项贴切：交往增多、认同增强可能是长期的附带效果，但不是这项举措直接着力的地方（把直接着力点换成了附带效果）。民生交流、青年融合、文化交往才是心联通的典型入口。"},{"text":"软联通：意味着三地取消制度差异，统一适用同一套标准和法律","correct":false,"why":"错因：把“衔接互认”误作“消除制度差异”（关系替换）。软联通是在依法和各自制度框架下实现互认、衔接与合作，不是统一成一套法律。"}],"answer":"","fix":"","explain":"按举措首先消除的障碍判断：修路架桥解决物理通达（硬联通），标准和规则互认解决制度摩擦（软联通），民生和文化交往影响社会认同（心联通）。三者协同，一个项目可能跨越几个维度，问“最直接”时看直接着力点。","condition":"以“直接举措”为限判断；依据广东十五五规划纲要新闻发布会实录和2026年全省大湾区办工作会议报道（GD-S07、GD-S19）。材料为自编情境。","refs":["GD-S07","GD-S19"],"origin":"自编","review":"","o":136,"t":1},{"id":"F-GD-011-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-011"],"lead":"粤港澳大湾区建设中，横琴、前海、南沙、河套是几个重大合作平台。","stem":"关于这几个平台，下列说法正确的有（）","opts":[{"text":"横琴粤澳深度合作区重点围绕促进澳门经济适度多元发展","correct":true,"why":"横琴的主线联系澳门经济适度多元发展，不要移接到前海等深港平台。"},{"text":"前海重点联系深港科技创新合作，河套重点联系深港现代服务业合作","correct":false,"why":"错因：把前海、河套的主线对调了（被替换的是：对应关系）。前海抓深港现代服务业合作，河套抓深港科技创新合作；主线用于区分定位，不表示平台只能发展一种产业。"},{"text":"2019年《粤港澳大湾区发展规划纲要》提出，打造广州南沙粤港澳全面合作示范区","correct":true,"why":"这是2019年大湾区《纲要》的表述。它与2022年南沙方案的“重大战略性平台”各有权威文本依据，不能因为记住了另一种称谓就判它错。"},{"text":"2022年国务院印发的南沙方案提出，把南沙打造成立足湾区、协同港澳、面向世界的重大战略性平台","correct":true,"why":"这是2022年《广州南沙深化面向世界的粤港澳全面合作总体方案》的表述。南沙的称谓要按文件锁定：2019年《纲要》是全面合作示范区，2022年方案是重大战略性平台。"}],"answer":"","fix":"","explain":"四个平台各抓一根主线：横琴—澳门经济适度多元发展，前海—深港现代服务业合作，河套—深港科技创新合作；南沙按文件分别记2019年“全面合作示范区”和2022年“重大战略性平台”。主线用于辨认定位，不是排他的经营范围。","condition":"南沙称谓分别锁定2019年《粤港澳大湾区发展规划纲要》（GD-S23）和2022年国务院印发的南沙方案（2022-06-06印发，GD-S22）；横琴、前海、河套主线据广东省委十五五《建议》（2025）和2026年广东省政府工作报告概括（GD-S18、GD-S01）。","refs":["GD-S18","GD-S01","GD-S22","GD-S23"],"origin":"自编","review":"","o":35,"t":1},{"id":"F-GD-012-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"GD","cards":["GD-012"],"lead":"三家企业向营商环境服务专班反映问题：甲企业用地、用能等要素获取周期长，交易撮合成本高；乙企业遇到多个部门重复检查、执法尺度不一，担心合法权益保护不稳定；丙企业开拓海外市场时，境外经营咨询等服务难找，外籍技术人员来粤办事不便。","stem":"从主要障碍看，三家企业的问题分别最直接对应广东2026年哪项一流营商环境工作方案（）","opts":[{"text":"甲—法治化；乙—市场化；丙—国际化","correct":false,"why":"错因：甲、乙对调（问题与功能错配）。要素获取和交易效率是市场化的着力点；执法检查和权益保护的稳定可预期是法治化的着力点。"},{"text":"甲—市场化；乙—国际化；丙—法治化","correct":false,"why":"错因：乙、丙对调（问题与功能错配）。重复检查、执法尺度不一属于法治化要解决的问题；跨境经营服务和外籍人员往来便利属于国际化。"},{"text":"甲—市场化；乙—法治化；丙—国际化","correct":true,"why":"市场化让要素和交易更有效，对应甲；法治化让权利保护和执法规则更稳定可预期，对应乙；国际化让跨境经营及国际往来更便利，对应丙。"},{"text":"甲—国际化；乙—法治化；丙—市场化","correct":false,"why":"错因：甲、丙对调（问题与功能错配）。用地、用能等要素获取周期长是要素和交易效率问题，属市场化；境外经营和外籍人员往来属国际化。"}],"answer":"","fix":"","explain":"2026年广东分别部署市场化、法治化、国际化营商环境工作：市场化让要素和交易更有效，法治化让权利保护和执法规则更稳定可预期，国际化让跨境经营和国际往来更便利。三者相互支持，实际问题可能交叉，本题按每个问题的主要障碍归类。","condition":"广东省2026年优化市场化、法治化、国际化一流营商环境工作方案（2026年2月初网页公开，GD-S08、GD-S09、GD-S10）；国际化方案经省委、省政府同意，由省商务厅、省委外办于2026-01-31联合印发，其第八项为建设“粤企出海”综合服务港，列有金融、税收、法律、检测认证等资源（E-DB-05）；材料为自编情境。","refs":["GD-S08","GD-S09","GD-S10","E-DB-05"],"origin":"自编","review":""},{"id":"F-GD-012-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-012"],"lead":"某市召开营商环境座谈会，四位发言者谈对广东2026年三项一流营商环境工作方案的理解。","stem":"下列发言中，理解正确的有（）","opts":[{"text":"市场化方案意味着政府不再提供公共服务，也不再依法监管企业经营","correct":false,"why":"错因：把“市场机制更有效”换成了“政府退出一切职责”（关系替换）。市场机制要与必要的公共服务、依法监管相配合。"},{"text":"三项方案各有侧重又相互支持，并不是彼此割裂的","correct":true,"why":"市场化、法治化、国际化分别侧重要素交易效率、执法规则可预期、跨境往来便利，三者相互支持。"},{"text":"国际化方案着力让外资企业享有高于内资企业的身份优待","correct":false,"why":"错因：把“便利跨境经营和国际往来”换成了“无条件的身份优待”（目的替换）。外资依据准入规则和法律公平参与，合法权益受保护。国际化方案第六项要求落实外商投资准入前国民待遇加负面清单管理制度、清理内外资不一致措施，着眼公平准入，不是让外资高于内资。"},{"text":"国际化方案着力让企业跨境经营和人员国际往来更加便利","correct":true,"why":"国际化营商环境工作的功能就是让跨境经营及国际往来更便利。"}],"answer":"","fix":"","explain":"三项方案各管一类主要障碍又相互支持。两种常见误读：把“市场化”读成政府退出服务和监管，把“国际化”读成外资享有高于内资的待遇。","condition":"广东省2026年优化市场化、法治化、国际化一流营商环境工作方案（2026年2月初网页公开，GD-S08、GD-S09、GD-S10）；国际化方案第六项为“落实放宽外资准入政策”，第八项为建设“粤企出海”综合服务港（E-DB-05）；材料为自编情境。","refs":["GD-S08","GD-S09","GD-S10","E-DB-05"],"origin":"自编","review":""},{"id":"F-GD-013-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-013"],"lead":"某食品企业已列入当地涉企行政检查“无事不扰”清单。市场监管部门接到群众举报，反映该企业使用过期原料，举报附有现场照片。","stem":"根据广东2026年法治化营商环境工作方案的精神，下列说法正确的是（）","opts":[{"text":"企业在“无事不扰”清单内，监管部门应把举报转给企业自查，而不入企检查","correct":false,"why":"错因：把优化日常监管方式扩大成了有违法线索也免于检查（条件替换）。是否检查仍应依法根据风险、线索和权限处理。"},{"text":"“亮码入企”是企业缴费换来的免检资格，企业可以凭码拒绝检查","correct":false,"why":"错因：错认了制度的主体和目的（主体、目的替换）。亮码入企是让行政检查过程可识别、可监督，不是企业购买免检资格。"},{"text":"执法人员亮码之后，这次检查即被视为合法，不必再审查权限和程序","correct":false,"why":"错因：把可核验的程序工具当成了实体合法的结论（关系替换）。亮码让检查可识别、可监督，检查是否合法仍要看权限、依据和程序。"},{"text":"“无事不扰”针对随意、多头、重复检查，有违法线索时仍可依法检查","correct":true,"why":"方案公开涉企检查信息、推行亮码入企和综合检查改革，是为了减少随意、多头、重复检查并加强监督；它不等于企业从此免受依法检查。"}],"answer":"","fix":"","explain":"减负不等于失去监管：无事不扰、亮码入企、综合检查减少的是随意、多头、重复的检查，并让检查可被监督；有明确违法线索时，仍应依法检查。方案本身不创设具体的检查权限、期限和程序。","condition":"广东省2026年优化法治化一流营商环境工作方案（网页2026-02-04公开，GD-S09）；材料为自编情境，具体检查权限和程序以法律法规为准。","refs":["GD-S09"],"origin":"自编","review":""},{"id":"F-GD-013-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-013","LAW-022"],"lead":"某市推进涉企行政检查改革，市场监管、生态环境、应急管理等部门都要对同一家企业开展检查。","stem":"结合广东2026年优化法治化一流营商环境工作方案和《中华人民共和国民营经济促进法》（2025年5月20日起施行），下列做法正确的有（）","opts":[{"text":"执法人员入企时亮码，使检查过程可识别、可监督","correct":true,"why":"亮码入企的重点是让行政检查过程可识别、可监督，约束随意检查。"},{"text":"多个部门对同一企业的检查事项，能合并的应当合并，能联合的跨部门联合","correct":true,"why":"《民营经济促进法》第52条要求对同一对象的多个检查事项尽可能合并或跨部门联合；方案推行的综合检查改革也指向减少多头、重复检查。"},{"text":"检查前须先征得企业书面同意，企业不同意就不能检查","correct":false,"why":"错因：把行政机关的法定监管换成了企业的自愿授权（主体、条件替换）。检查依法开展，程序合法并尽量减少干扰。"},{"text":"对直接涉及公共安全和群众生命健康的重点领域，依法依规实行全覆盖重点监管","correct":true,"why":"第52条规定市场监管领域相关部门原则上随机抽取检查对象、随机选派执法人员，并公开事项及结果；同时规定了例外：直接涉及公共安全和群众生命健康等的特殊行业、重点领域，依法依规实行全覆盖重点监管。"}],"answer":"","fix":"","explain":"减少重复干扰与依法监管可以同时成立：亮码入企出自广东方案，让检查可监督；合并、联合检查和重点领域全覆盖监管见民营经济促进法第52条；检查不以企业同意为前提。","condition":"广东省2026年优化法治化一流营商环境工作方案（GD-S09）；《中华人民共和国民营经济促进法》（国家法律，全国适用）第52条（2025-04-30通过，2025-05-20起施行，LAW-S08）。方案不创设具体检查权限、期限和程序。材料为自编情境。","refs":["GD-S09","LAW-S08"],"origin":"自编","review":""},{"id":"F-GD-014-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-014"],"lead":"","stem":"2026年11月18—19日，亚太经合组织（APEC）第三十三次领导人非正式会议在广东深圳举行，本年度三大优先领域为开放、创新、合作。","opts":[],"answer":"正确","fix":"","explain":"会议层次是第三十三次领导人非正式会议，地点深圳；年度主题为“建设亚太共同体，促进共同繁荣”，三大优先领域为开放、创新、合作。常见错项是把优先领域换成“开放、协调、共享”等其他表述里的词，或把领导人会议的举办地换成别的城市——全年系列活动可以分布在其他城市，领导人非正式会议在深圳。","condition":"2026年APEC中国年；会议安排和主题见深圳市政府2025-12-15发布信息及外交部页面（2026-11-27核验，GD-S11、GD-S12）。","refs":["GD-S11","GD-S12"],"origin":"自编","review":"","o":17,"t":1},{"id":"F-GD-014-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"精确名称","module":"GD","cards":["GD-014"],"lead":"2026年中国担任亚太经合组织（APEC）东道主，第三十三次领导人非正式会议在深圳举行。","stem":"本年度APEC的年度主题是（）","opts":[{"text":"建设亚太共同体，促进共同繁荣","correct":true,"why":"这是外交部和深圳市公布的2026年APEC年度主题。"},{"text":"建设亚太共同体，促进共同发展","correct":false,"why":"错因：把“共同繁荣”换成了“共同发展”（措辞替换）。精确名称要守住原词。"},{"text":"开放、创新、合作","correct":false,"why":"错因：把三大优先领域当成了年度主题（层次替换）。开放、创新、合作是本届的三大优先领域。"},{"text":"共促繁荣，共赢未来","correct":false,"why":"错因：这句不是本届APEC的年度主题（层次替换）。APEC年内有不同层次的会议和活动，各项活动的口号不能与年度主题互换；年度主题以外交部公布的表述为准。"}],"answer":"","fix":"","explain":"2026年APEC年度主题是“建设亚太共同体，促进共同繁荣”，三大优先领域是开放、创新、合作；主题、优先领域和其他活动的口号分层记，不要互换。","condition":"2026年APEC中国年；主题以外交部页面为准（逗号写法“建设亚太共同体，促进共同繁荣”，GD-S12），另见深圳市政府2025-12-15发布信息（GD-S11）。","refs":["GD-S11","GD-S12"],"origin":"自编","review":"","o":3,"t":1},{"id":"F-GD-015-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-015"],"lead":"","stem":"亚太经合组织（APEC）有21个成员经济体，中国香港、中国台北都是其中的地区经济体成员。","opts":[],"answer":"正确","fix":"","explain":"APEC的成员称“成员经济体”，其中包括中国香港、中国台北等地区经济体，所以不能说“APEC由21个主权国家组成”。“经济体”的说法让参与范围围绕经济合作组织起来，不把参与资格直接等同于主权国家身份。","condition":"依据APEC官网FAQ和外交部《亚太经合组织概况》（GD-S13、GD-S20）。","refs":["GD-S13","GD-S20"],"origin":"自编","review":"","o":64,"t":1},{"id":"F-GD-015-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-015","GD-016"],"lead":"2026年APEC领导人非正式会议在深圳举行后，某同学为班级时事分享写了四句介绍APEC合作方式的话。","stem":"下列介绍中，准确的有（）","opts":[{"text":"APEC的合作强调自愿和协商一致","correct":true,"why":"APEC合作强调自愿、协商一致，这是它的基本合作方式。"},{"text":"APEC通过多数表决作出决定，各成员须据此统一修改国内法律","correct":false,"why":"错因：同时换了决策方式（用多数表决替换协商一致）和约束性质（用统一国内法律替换自愿合作）。APEC不直接统一成员的国内法律。"},{"text":"APEC领导人会议称“非正式会议”，说明这类会议不形成合作成果","correct":false,"why":"错因：把会议的制度形态换成了“没有成果”（关系替换）。“非正式”说的是合作机制的形态，不是不重要；2026年深圳会议后，外交部已公布2026年APEC领导人深圳展望等成果。"},{"text":"APEC成员作出的合作承诺，不等于对各成员普遍施加条约义务","correct":true,"why":"APEC的合作承诺不等于普遍的条约义务，这与它自愿、协商一致的合作方式相一致。"}],"answer":"","fix":"","explain":"APEC是成员经济体之间的经济合作机制：合作强调自愿和协商一致，承诺不等于普遍的条约义务；“非正式会议”指机制形态，会议照样形成成果文件。","condition":"依据APEC官网FAQ、外交部《亚太经合组织概况》和外交部“中国与亚太经合组织的关系”页面（GD-S13、GD-S20、GD-S12，2026-11-27核验）。","refs":["GD-S13","GD-S20","GD-S12"],"origin":"自编","review":"","o":138,"t":1},{"id":"F-GD-016-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"GD","cards":["GD-016"],"lead":"","stem":"截至2026年11月，中国主办过的亚太经合组织（APEC）领导人非正式会议，按举办时间先后排列，举办城市依次是（）","opts":[{"text":"北京—上海—深圳","correct":false,"why":"错因：前两次的先后顺序颠倒（时间顺序替换）。2001年在上海，2014年在北京。"},{"text":"广州—北京—深圳","correct":false,"why":"错因：把第一次的举办城市上海换成了广州（城市替换）。"},{"text":"上海—北京—深圳","correct":true,"why":"2001年上海、2014年北京、2026年深圳，深圳会议是中国第三次主办。"},{"text":"上海—北京—广州","correct":false,"why":"错因：把2026年领导人非正式会议的举办地深圳换成了广州（城市替换）。"}],"answer":"","fix":"","explain":"中国三次主办APEC领导人非正式会议：2001年上海、2014年北京、2026年深圳，深圳会议不是第一次。会后公布的具体成果和活动数字属于更新项，不要求逐条背。","condition":"外交部“中国与亚太经合组织的关系”页面（2026-11-27核验，GD-S12）。","refs":["GD-S12"],"origin":"自编","review":"","o":85,"t":1},{"id":"F-GD-017-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-017"],"lead":"","stem":"广东推动海洋经济高质量发展的行动方案在2026年公开，实施期为2025—2027年，统筹海洋科技、渔业、装备、能源、运输及专业服务等领域。","opts":[],"answer":"正确","fix":"","explain":"文件网页2026年公开，但实施期按文件标题是2025—2027年，不能按网页年份改成2026—2028年；方案覆盖多种海洋产业，“海上新广东”不是把经济活动都改成捕鱼。","condition":"《广东省推动海洋经济高质量发展行动方案（2025—2027年）》，网页2026-01-30公开（GD-S14）；网页公开年份不改变文件实施期。","refs":["GD-S14"],"origin":"自编","review":""},{"id":"F-GD-018-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-018"],"lead":"某沿海市推进现代化海洋牧场建设，提出四项做法。","stem":"下列做法中，符合现代化海洋牧场发展方向的有（）","opts":[{"text":"主要靠提高近岸野生海产品的捕捞强度来增加产量","correct":false,"why":"错因：把养殖体系建设换成了加大野生捕捞（动作替换），也丢掉了生态约束。现代化海洋牧场不等于提高野生海产品捕捞强度。"},{"text":"建设水产种业基地，培育适合深远海养殖的优质苗种","correct":true,"why":"种业是现代化海洋牧场产业链的起点，稳定的苗种支撑深远海养殖。"},{"text":"发展抗风浪养殖装备，推动养殖向深远海拓展，并评估海域生态承载","correct":true,"why":"装备支撑深远海养殖，同时兼顾生态，不是无约束开发。"},{"text":"配套发展水产品加工，把产业链从养殖延伸到加工环节","correct":true,"why":"现代化海洋牧场强调种业、养殖、加工、装备等环节协同发展。"}],"answer":"","fix":"","explain":"现代化海洋牧场是全产业链协同：种业、养殖、加工、装备一起推进，推动深远海养殖并兼顾生态；它不是只增加近岸网箱，也不是加大野生捕捞。","condition":"依据《广东省推动海洋经济高质量发展行动方案（2025—2027年）》（GD-S14）；只考概念和政策方向，不涉及养殖许可程序。材料为自编情境。","refs":["GD-S14"],"origin":"自编","review":""},{"id":"F-GD-019-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-019","P3-01"],"lead":"某县推进绿美广东生态建设，林业部门讨论来年工作思路时提出四种意见。","stem":"下列意见中，最符合广东2026年林业工作部署方向的是（）","opts":[{"text":"把当年新种植株数作为主要考核指标，苗木种下即算完成任务","correct":false,"why":"错因：用单一的投入数量替代了长期质量和生态效果（评价标准替换）。这也不符合正确政绩观——评价要看实际效果、长期影响和可持续性，不只看任内可见的数字。"},{"text":"开展林分优化和森林抚育，评价时兼顾管护成效和生态功能","correct":true,"why":"2026年广东林业部署继续突出森林质量提升，林分优化、森林抚育正是相关任务；评价不能只看新种了多少棵树。"},{"text":"以保护生态为由，叫停林区内的合理利用和林业产业活动","correct":false,"why":"错因：把保护与合理利用对立起来（关系替换）。2026年部署统筹科学保护、系统治理和合理利用。"},{"text":"把力量集中在新造林上，现有森林的抚育管护暂缓安排","correct":false,"why":"错因：丢掉了森林质量提升这一重点（任务替换）。林分优化、森林抚育是2026年部署突出的任务。"}],"answer":"","fix":"","explain":"绿美广东的增量在森林质量：林分优化、森林抚育，统筹科学保护、系统治理和合理利用；评价不能只算种了多少棵树，这也是正确政绩观落到生态治理的具体场景。","condition":"2026年全省林业工作会议（2026-03-02报道，GD-S15）；政绩观评价标准见P3-01（TZG、T2026Z）。材料为自编情境。","refs":["GD-S15","TZG","T2026Z"],"origin":"自编","review":""},{"id":"F-GD-020-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-020"],"lead":"","stem":"广东省2026年优化法治化一流营商环境工作方案提出加快出台数据、人工智能、低空经济等方面的条例，据此可以认定相关省级条例已经通过并生效。","opts":[],"answer":"错误","fix":"广东省2026年优化法治化一流营商环境工作方案提出加快出台数据、人工智能、低空经济等方面的条例，这是立法工作安排，不能据此认定相关省级条例已经通过或生效。","explain":"错在把政策文件中的立法任务当成了已经生效的法规（阶段替换：工作安排→通过、施行）。立法要分清计划、草案、审议、通过、公布、施行；某部条例是否生效，要另查有权机关正式公布的文本和施行条款。","condition":"广东省2026年优化法治化一流营商环境工作方案（网页2026-02-04公开，GD-S09）；本题只考阶段辨析，不涉及任何条例的具体内容。","refs":["GD-S09"],"origin":"自编","review":""},{"id":"F-GD-020-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-020","LAW-030"],"lead":"2026年11月下旬，小周看到报道：11月25日召开的广东省十四届人大常委会第二十八次会议，听取了关于省人工智能发展促进条例草案的说明。他又查到，省内某市已有同领域的市级地方性法规。","stem":"关于这部省级条例的法律状态，下列判断正确的是（）","opts":[{"text":"判断该条例是否生效，要以正式通过、公布的文本及其施行条款为准","correct":true,"why":"常委会听取草案说明、审议草案只是立法过程中的一个阶段，这则报道本身不能证明条例已经生效；一项规则是否现行有效，要查正式通过、公布的文本及其施行条款。"},{"text":"草案已经提交省人大常委会会议审议，说明该条例此时已在全省施行","correct":false,"why":"错因：把“审议草案”换成了“已经施行”（阶段替换）。审议不能单独证明规则已经生效。"},{"text":"省内某市已有同领域的市级法规，所以全省可以直接适用这部市级法规","correct":false,"why":"错因：偷换了制定机关和适用地域（主体、地域替换）。市级法规由该市制定，不能因此认定全省适用；应分别核对地方立法的机关、权限和适用范围。"},{"text":"网页转载这则草案说明的日期，可以直接当作该条例的生效日期","correct":false,"why":"错因：把转载日期当成了生效日期（日期替换）。生效以法规自身的施行条款为准，网页转载日期、URL里的年份都不能代替。"}],"answer":"","fix":"","explain":"核验法律状态要分清计划、草案、审议、通过、公布、施行：报道审议草案、方案写“加快出台”，都不等于已经生效；还要分别核对制定机关和适用地域，生效日期看施行条款，不看转载日期。","condition":"据2026-11-26南方日报对11月25日省十四届人大常委会第二十八次会议的报道（LAW-S16；广东人大网同日刊载，会上由省人民政府作草案说明，E-YF-03）；截至2026-11-27未取得该条例通过、公布、施行的依据。导语中“省内某市已有同领域法规”为自编情境。本题只考核验法律状态的方法，不断言其后是否通过，也不涉及草案内容。","refs":["GD-S09","LAW-S16","LAW-S01","E-YF-03"],"origin":"自编","review":""},{"id":"F-K-LAW-01-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-01"],"lead":"2026年11月，几位港澳法律执业者咨询：能否依修改后的《中华人民共和国律师法》第62条（2026年9月1日起施行）和司法部《粤港澳大湾区律师执业考试和执业活动管理办法》（2026年10月5日起施行），在内地办理法律业务。","stem":"仅就这一执业通道而言，下列判断正确的是（）。","opts":[{"text":"甲持有香港特别行政区法律执业者资格，未参加大湾区律师执业考试，可以在深圳代理民商事诉讼案件","correct":false,"why":"错因：把港澳当地的执业身份换成了内地执业资质（被替换的是条件）。第62条要求通过国务院司法行政部门组织的粤港澳大湾区律师执业考试、取得内地执业资质；仅有港澳当地律师身份，不能按这一制度直接在内地执业。"},{"text":"乙通过大湾区律师执业考试并取得内地执业资质后，可以在江门办理规定范围的民商事非诉讼法律事务","correct":true,"why":"考试、资质、地域、业务四项都符合：江门是第62条逐一列举的内地九市之一；《办法》第6条把持证人可办业务界定为规定范围的民商事法律事务，含诉讼业务和非诉讼业务。"},{"text":"丙通过大湾区律师执业考试并取得内地执业资质后，可以在清远办理规定范围的民商事诉讼业务","correct":false,"why":"错因：把大湾区内地九市换成了广东省内其他城市（被替换的是地域）。第62条逐一列举的是广州、深圳、珠海、佛山、惠州、东莞、中山、江门、肇庆，清远不在其中。"},{"text":"丁通过大湾区律师执业考试并取得内地执业资质后，可以在广州担任刑事案件的辩护人","correct":false,"why":"错因：把规定范围的民商事法律事务换成了刑事辩护（被替换的是业务范围）。《办法》第6条限定持证人办理规定范围的民商事法律事务，不能单以这一执业资质为据在九市代理刑事案件。"}],"answer":"","fix":"","explain":"按这一通道执业要同时满足四项：通过国务院司法行政部门组织的粤港澳大湾区律师执业考试；取得内地执业资质（《办法》第5条另有培训考核、经接收执业的律师事务所申请、由广东省司法厅发证等环节）；在内地九市执业；办理规定范围的民商事法律事务（含诉讼和非诉讼）。只有港澳当地律师身份或只通过考试都不够，地域、业务任一项不符也不行。依据：E-LAW-01（律师法修改决定第十项新增第62条；司法部令第151号《办法》第5、6条）。","condition":"国家法律与部门规章：《中华人民共和国律师法》第62条（全国人大常委会修改决定2026年8月28日通过，2026年9月1日起施行）；《粤港澳大湾区律师执业考试和执业活动管理办法》（司法部令第151号，2026年10月5日公布并施行）；截至2026年11月27日均已施行；适用于香港特别行政区法律执业者、澳门特别行政区执业律师，执业地域限于大湾区内地九市；只判断这一执业通道，不涉及其他执业途径。","refs":["E-LAW-01"],"origin":"自编","review":"","o":161,"t":2},{"id":"F-K-LAW-01-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-01","LAW-002"],"lead":"2026年11月，某律师事务所组织内部培训，梳理港澳法律执业者在大湾区内地九市执业的制度依据，涉及修改后的《中华人民共和国律师法》和司法部令第151号《粤港澳大湾区律师执业考试和执业活动管理办法》（以下简称《办法》）。","stem":"下列说法正确的是（）。","opts":[{"text":"这一执业通道由司法部的部门规章设立，律师法本身没有相应规定","correct":false,"why":"错因：把国家法律换成了部门规章（被替换的是层级）。全国人大常委会修改决定第十项新增律师法第62条，由法律设立这一通道；《办法》是司法部的配套部门规章。"},{"text":"原试点文件列明的延长期已于2026年10月4日届满，这一执业通道随之终止","correct":false,"why":"错因：沿用旧试点文件的期限（被替换的是依据和时间）。修改后的律师法2026年9月1日起施行，《办法》2026年10月5日起施行，原试点已上升为国家法律制度，不能把2026年10月4日当作通道终止日。"},{"text":"修改律师法的决定于2026年8月28日通过，新增的第62条自通过当日起施行","correct":false,"why":"错因：把通过日换成了施行日（被替换的是阶段）。修改决定2026年8月28日通过、同日以国家主席第84号令公布，2026年9月1日起施行。"},{"text":"律师法第62条设立这一执业通道，《办法》规定具体的考试和执业办法","correct":true,"why":"法律设立通道，部门规章规定具体办法：第62条规定适用对象、考试与执业资质、九市地域和业务范围；《办法》规定培训考核、经接收执业的律师事务所申请、由广东省司法厅发证以及持证人可办业务等。"}],"answer":"","fix":"","explain":"两层依据、三个时点要分开：律师法第62条（修改决定2026年8月28日通过、2026年9月1日起施行）设立通道；司法部令第151号《办法》（2026年10月5日公布并施行）规定具体考试和执业办法；国务院办公厅旧试点办法列明的延长期到2026年10月4日，但原试点已上升为国家法律制度，此后依法定程序执业。依据：E-LAW-01（律师法修改决定第十项；司法部令第151号《办法》；司法部发布《办法》的介绍；国务院办公厅旧试点办法“六、组织实施”）。","condition":"国家法律与部门规章：修改后的《中华人民共和国律师法》（2026年8月28日通过修改决定，国家主席第84号令公布，2026年9月1日起施行）；《粤港澳大湾区律师执业考试和执业活动管理办法》（司法部令第151号，2026年10月5日公布并施行）；截至2026年11月27日均已施行；执业地域限于大湾区内地九市。","refs":["E-LAW-01","LAW-S01"],"origin":"自编","review":""},{"id":"F-K-LAW-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["K-LAW-02"],"lead":"2026年11月下旬，某设区的市及其所辖某县的林业主管部门研究林业发展规划的编制问题。","stem":"依2026年11月6日起施行的修改后《中华人民共和国森林法》第25条，下列说法正确的有（）。","opts":[{"text":"省级以上人民政府林业主管部门都应当编制林业发展规划","correct":true,"why":"修改后第25条规定，省级以上人民政府林业主管部门应当根据森林资源保护发展目标，编制林业发展规划。"},{"text":"该市、该县林业主管部门也都应当编制林业发展规划","correct":false,"why":"错因：把设区的市、县级的“可以根据实际需要”换成了“应当”（被替换的是义务性质）。这是2019年修订森林法第25条“县级以上人民政府林业主管部门”应当编制的旧口径，2026年11月6日以后不再适用。"},{"text":"该县林业主管部门可以根据实际需要编制林业发展规划","correct":true,"why":"修改后第25条规定，设区的市、县级人民政府林业主管部门可以根据实际需要编制林业发展规划。"},{"text":"该县编制的林业发展规划，依据上级林业发展规划编制","correct":true,"why":"修改后第25条保留了下级规划依据上级规划编制的要求。"}],"answer":"","fix":"","explain":"2026年11月6日起，林业发展规划的编制分两档：省级以上林业主管部门“应当”编制；设区的市、县级林业主管部门“可以根据实际需要”编制；下级规划依据上级规划编制。“县级以上一律应当编制”是修改前的旧口径；这次修改只针对林业发展规划，不能推广到其他专项规划。依据：E-LAW-02（全国人大常委会关于修改《中华人民共和国突发事件应对法》等十五部法律的决定第七项；修改后森林法第25条）。","condition":"国家法律：《中华人民共和国森林法》第25条，经全国人大常委会关于修改《中华人民共和国突发事件应对法》等十五部法律的决定（2026年11月6日通过，国家主席第90号令公布，自公布之日起施行）修改；截至2026年11月27日已施行；适用于全国；只涉及林业发展规划。","refs":["E-LAW-02"],"origin":"自编","review":""},{"id":"F-K-LAW-02-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["K-LAW-02","LAW-008"],"lead":"","stem":"截至2026年11月27日，土壤污染防治法已因生态环境法典施行而废止，森林法则继续保留，并经2026年11月6日全国人大常委会的修改决定作了修改，修改后的条文已经施行。","opts":[],"answer":"正确","fix":"","explain":"生态环境法典（2026年3月12日十四届全国人大四次会议通过，2026年8月15日起施行）第1242条列明同时废止的十部法律，其中有土壤污染防治法，未列森林法。森林法继续保留，并经关于修改《中华人民共和国突发事件应对法》等十五部法律的决定（2026年11月6日通过，自公布之日起施行）修改：第25条调整了林业发展规划的编制主体，第74条第3款所引的土壤污染防治法改为生态环境法典。更新引文、修改单行法，不等于该法被并入法典而废止。依据：E-LAW-02（十五部法律修改决定第七项及末段；生态环境法典第1242条）。","condition":"国家法律，适用于全国：生态环境法典（国家主席第70号令公布，2026年8月15日起施行）第1242条；全国人大常委会关于修改《中华人民共和国突发事件应对法》等十五部法律的决定（国家主席第90号令公布，2026年11月6日起施行）；截至2026年11月27日。","refs":["E-LAW-02","LAW-S03"],"origin":"自编","review":""},{"id":"F-K-LAW-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-03","LAW-030"],"lead":"2026年11月6日，十四届全国人大常委会第二十五次会议通过《中华人民共和国检察公益诉讼法》和《全国人民代表大会常务委员会关于修改〈中华人民共和国突发事件应对法〉等十五部法律的决定》，国家主席同日分别以第86号、第90号主席令公布。","stem":"截至2026年11月27日，下列说法正确的是（）。","opts":[{"text":"两项都已公布，但目前只有修改十五部法律的决定已经施行","correct":true,"why":"施行日看各自条款：修改决定自公布之日起施行，11月6日起已施行；检察公益诉讼法第53条规定自2027年1月1日起施行，目前已公布、尚未施行。"},{"text":"两项同日通过、同日公布，因而都已自11月6日起施行","correct":false,"why":"错因：用公布日推定了施行日（被替换的是阶段）。同日公布不等于同日施行，检察公益诉讼法2027年1月1日起施行。"},{"text":"检察公益诉讼法尚未施行，检察机关目前还不能办理公益诉讼案件","correct":false,"why":"错因：把专门法的施行日当成了制度起点（被替换的是关系）。检察机关办理公益诉讼早有法定实践，最高人民检察院《人民检察院公益诉讼办案规则》自2021年7月1日起已施行。"},{"text":"检察公益诉讼法已公布，11月正在办理的案件应当按其新程序办理","correct":false,"why":"错因：把“已公布”换成了“已施行”（被替换的是阶段）。该法2027年1月1日起施行，此前不能用它的新程序裁定具体案件。"}],"answer":"","fix":"","explain":"同日公布不等于同日施行：修改十五部法律的决定（第90号主席令）自公布之日起施行，截至11月27日已施行；检察公益诉讼法（第86号主席令）已公布，2027年1月1日起施行，目前尚未施行。专门法尚未施行，也不意味着检察公益诉讼无从开展，最高检办案规则2021年7月1日已施行。依据：E-LAW-03（《中华人民共和国检察公益诉讼法》第53条；第86号主席令；《人民检察院公益诉讼办案规则》），E-LAW-02（第90号主席令；修改决定末段）。","condition":"国家法律，适用于全国：《中华人民共和国检察公益诉讼法》（2026年11月6日通过，国家主席第86号令公布，2027年1月1日起施行）；全国人大常委会关于修改《中华人民共和国突发事件应对法》等十五部法律的决定（2026年11月6日通过，国家主席第90号令公布，自公布之日起施行）；截至2026年11月27日；只考公布、施行状态，不考主席令序号。","refs":["E-LAW-03","E-LAW-02"],"origin":"自编","review":""},{"id":"F-K-LAW-03-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["K-LAW-03"],"lead":"根据已公布、将于2027年1月1日起施行的《中华人民共和国检察公益诉讼法》：设该法施行后，某市人民检察院在履职中发现，对某法定领域负有监督管理职责的行政机关不依法履行职责，致使社会公共利益受到侵害。","stem":"按该法文本，下列说法正确的有（）。","opts":[{"text":"经调查，检察院应当向该行政机关提出公益诉讼检察建议","correct":true,"why":"第22条规定，对法定领域负有监管职责的行政机关违法行使职权或者不行使职权，导致国家利益或者社会公共利益受侵害的，检察院经调查后应当向行政机关提出公益诉讼检察建议。"},{"text":"行政机关已采取整改措施、依法履行职责的，检察院仍应提起行政公益诉讼","correct":false,"why":"错因：把“应当终结案件”换成了“仍应起诉”（被替换的是条件对应的处理结果）。第26条列举的应当终结案件的情形包括“行政机关已采取整改措施，依法履行职责”。"},{"text":"检察院提出检察建议后，可以对该行政机关作出判决","correct":false,"why":"错因：把人民法院的审判换给了人民检察院（被替换的是主体和动作）。第2条区分人民检察院办理案件与人民法院审理，判决不由检察院作出。"},{"text":"经审查仍存在该法规定的起诉情形的，检察院依法提起行政公益诉讼","correct":true,"why":"依已公布文本，提出检察建议后，经审查仍存在第13条规定情形的，依第25条提起行政公益诉讼。"}],"answer":"","fix":"","explain":"按已公布文本，行政公益诉讼的顺序是：调查—向行政机关提出公益诉讼检察建议—审查：行政机关已整改、依法履职的，属于应当终结案件的情形；仍存在法定起诉情形的，提起行政公益诉讼，由人民法院审理。截至2026年11月27日该法尚未施行，本题只按文本考程序。依据：E-LAW-03（《中华人民共和国检察公益诉讼法》第2、22、25、26、53条）。","condition":"国家法律，适用于全国：《中华人民共和国检察公益诉讼法》（2026年11月6日通过，国家主席第86号令公布，2027年1月1日起施行）；截至2026年11月27日已公布、尚未施行；情境设在该法施行后，不用于裁定施行前的具体案件。","refs":["E-LAW-03"],"origin":"自编","review":""},{"id":"F-K-LAW-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-04"],"lead":"2026年10月，户籍在湖南的小林在佛山务工期间突遇急难，基本生活暂时出现严重困难。","stem":"依2026年7月1日起施行的《中华人民共和国社会救助法》，下列说法正确的是（）。","opts":[{"text":"小林申请临时救助，应当回到湖南户籍所在地的乡镇人民政府或者街道办事处提出","correct":false,"why":"错因：把临时救助的申请地换成了户籍所在地（被替换的是条件）。第37条另款规定，临时救助向急难发生地乡镇人民政府、街道办事处提出。"},{"text":"小林在佛山申请临时救助，应当以已经办理佛山居住证为前提条件","correct":false,"why":"错因：把其他救助事项“有条件的地方可以推进持居住证人员在居住地申请”的安排移到了临时救助上（被替换的是条件）。临时救助直接向急难发生地提出。"},{"text":"小林可以在佛山，向急难发生地的乡镇人民政府或者街道办事处申请临时救助","correct":true,"why":"第37条另款规定，临时救助申请向急难发生地乡镇人民政府、街道办事处提出；当事人本人或者与其共同生活的家庭成员可以提出。小林不必回户籍地，也不以居住证为前提。"},{"text":"小林申请最低生活保障，同样适用“向急难发生地提出”的规定","correct":false,"why":"错因：把临时救助的规则套到了最低生活保障上（被替换的是救助事项）。特困人员供养、低保、医疗救助、住房救助、就业救助一般向户籍所在地申请，有条件的地方可以推进持居住证人员在居住地申请；“向急难发生地提出”是第37条对临时救助的规定。"}],"answer":"","fix":"","explain":"流动人员先辨申请事项：临时救助向急难发生地乡镇人民政府、街道办事处提出，当事人本人或者与其共同生活的家庭成员可以提出；特困人员供养、最低生活保障、医疗救助、住房救助、就业救助一般向户籍所在地申请，有条件的地方可以推进持居住证人员在居住地申请。依据：E-LAW-04（《中华人民共和国社会救助法》第37条）。","condition":"国家法律，适用于全国（本题情境为在粤流动人员）：《中华人民共和国社会救助法》（2026年4月30日通过，国家主席第75号令公布，2026年7月1日起施行）第37条；截至2026年11月27日已施行；不涉及广东省年度低保标准。","refs":["E-LAW-04"],"origin":"自编","review":"","o":156,"t":1},{"id":"F-K-LAW-04-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-04"],"lead":"2026年11月，在东莞务工的老周（户籍在外省）遭遇突发变故，向急难发生地的街道办事处申请临时救助。经了解，其情况紧急。","stem":"依2026年7月1日起施行的《中华人民共和国社会救助法》第50条，要判定对老周“应当先行救助”，除情况紧急外，还须具备的是（）。","opts":[{"text":"所需救助金额较小，并且需要立即采取救助措施","correct":true,"why":"第50条规定：情况紧急、救助金额较小、需立即采取救助措施的，应当先行救助。三项同时具备才能作此判定。"},{"text":"老周已办理东莞居住证，并在当地居住满规定年限","correct":false,"why":"错因：把第50条没有的居住条件加了进来（被替换的是条件）。第50条只列情况紧急、救助金额较小、需立即采取救助措施三项；临时救助本就向急难发生地申请。"},{"text":"老周户籍所在地已出具其家庭经济状况证明","correct":false,"why":"错因：把事后补充说明换成了事前取证（被替换的是条件和环节）。第50条的三项条件中没有户籍地证明；先行救助后，紧急情况解除时再按规定补充说明情况。"},{"text":"这笔救助已事先报经上级部门审批同意","correct":false,"why":"错因：把“先救助、后补充说明”换成了“先审批、后救助”（被替换的是环节顺序）。三项条件齐备时应当先行救助，紧急情况解除后按规定补充说明情况。"}],"answer":"","fix":"","explain":"第50条：情况紧急、救助金额较小、需立即采取救助措施的，应当先行救助；紧急情况解除后，按规定补充说明情况。三项条件要同时具备；手续放在事后补充说明，而不是先审批、先取证再救助。依据：E-LAW-04（《中华人民共和国社会救助法》第50条）。","condition":"国家法律，适用于全国：《中华人民共和国社会救助法》（2026年4月30日通过，2026年7月1日起施行）第50条；截至2026年11月27日已施行；只考第50条的条件，不涉及救助金额标准和实施机关分工。","refs":["E-LAW-04"],"origin":"自编","review":""},{"id":"F-K-LAW-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-05","P4-07"],"lead":"国家民委网站2026年9月22日登载的报道称，首个法定民族团结进步宣传周于9月21日启动，多个部门共同组织实施。某同学据此整理《中华人民共和国民族团结进步促进法》规定的民族工作格局。","stem":"依该法第41条，下列说法正确的是（）。","opts":[{"text":"宣传周由多个部门共同组织实施，说明法定的牵头协调主体是多个部门","correct":false,"why":"错因：把当年活动的组织事实当成了法定分工（被替换的是依据）。多部门共同组织实施是2026年首个宣传周的活动事实，不改变第41条规定的牵头协调主体。"},{"text":"统一战线工作部门牵头协调，民族工作部门履职尽责，各部门通力合作","correct":true,"why":"第41条规定：党委统一领导、政府依法管理、统一战线工作部门牵头协调、民族工作部门履职尽责，各部门通力合作、全社会共同参与。"},{"text":"民族工作部门牵头协调，统一战线工作部门履职尽责，各部门通力合作","correct":false,"why":"错因：把两个部门的职责互换了（被替换的是主体）。牵头协调的是统一战线工作部门，履职尽责的是民族工作部门。"},{"text":"统一战线工作部门统一领导，政府依法管理，民族工作部门履职尽责","correct":false,"why":"错因：把党委的“统一领导”换给了统一战线工作部门（被替换的是主体和动作）。第41条是党委统一领导，统一战线工作部门牵头协调。"}],"answer":"","fix":"","explain":"第41条的民族工作格局：党委统一领导、政府依法管理、统一战线工作部门牵头协调、民族工作部门履职尽责，各部门通力合作、全社会共同参与。最易混的是统战部门（牵头协调）与民族工作部门（履职尽责）；首个宣传周由多部门共同组织实施，是当年的活动事实，不改变法定牵头主体。依据：E-LAW-05（《中华人民共和国民族团结进步促进法》第41条；国家民委网站2026年9月22日登载的报道）。","condition":"国家法律，适用于全国：《中华人民共和国民族团结进步促进法》（2026年3月12日十四届全国人大四次会议通过，国家主席第71号令公布，2026年7月1日起施行）第41条；截至2026年11月27日已施行。","refs":["E-LAW-05"],"origin":"自编","review":"","o":97,"t":1},{"id":"F-K-LAW-05-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"LAW","cards":["K-LAW-05","LAW-024"],"lead":"","stem":"截至2026年11月27日，下列关于民族团结进步宣传周和全民阅读活动周的说法，正确的是（）。","opts":[{"text":"民族团结进步宣传周在每年4月的第四周，全民阅读活动周在每年9月的第四周","correct":false,"why":"错因：把两个活动周的月份互换了（被替换的是时间）。民族团结进步宣传周在每年9月的第四周，全民阅读活动周在每年4月第四周。"},{"text":"民族团结进步宣传周从每年9月21日开始，这是《中华人民共和国民族团结进步促进法》第56条的规定","correct":false,"why":"错因：把2026年首个宣传周的启动日当成了法定日期（被替换的是时间口径）。第56条规定的是“每年9月的第四周”，按月内周次设定，每年公历日期可以不同。"},{"text":"民族团结进步宣传周在每年9月的第四周，全民阅读活动周在每年4月的第四周","correct":true,"why":"《中华人民共和国民族团结进步促进法》第56条规定每年9月的第四周为民族团结进步宣传周；《全民阅读促进条例》规定每年4月第四周为全民阅读活动周。"},{"text":"全民阅读活动周与民族团结进步宣传周一样，由全国人大或其常委会制定的法律规定","correct":false,"why":"错因：把行政法规当成了法律（被替换的是层级）。民族团结进步促进法是全国人大通过的法律；《全民阅读促进条例》是国务院制定的行政法规。"}],"answer":"","fix":"","explain":"两个法定活动周分属不同规范：民族团结进步宣传周依《中华人民共和国民族团结进步促进法》第56条，为每年9月的第四周，按周次设定，2026年9月21日只是首个法定宣传周的启动日；全民阅读活动周依国务院《全民阅读促进条例》（行政法规），为每年4月第四周。依据：E-LAW-05（民族团结进步促进法第56条；国家民委网站2026年9月22日登载的报道）；LAW-S10（《全民阅读促进条例》）。","condition":"适用于全国：国家法律《中华人民共和国民族团结进步促进法》（2026年7月1日起施行）第56条；行政法规《全民阅读促进条例》（国务院令第823号，2026年2月1日起施行）；截至2026年11月27日均已施行。","refs":["E-LAW-05","LAW-S10"],"origin":"自编","review":"","o":74,"t":1},{"id":"F-K-LAW-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["K-LAW-06","LAW-030"],"lead":"2026年11月，广东参保人老陈到外省探亲期间生病住院，想了解能否在就医地直接结算医药费用。他听说《中华人民共和国医疗保障法》已于2026年8月28日通过。","stem":"截至2026年11月27日，下列说法正确的是（）。","opts":[{"text":"该法尚未施行，可见2026年还无法办理跨省异地就医直接结算","correct":false,"why":"错因：把新法施行日当成了既有服务的起点（被替换的是关系）。国家医保局、财政部2022年的通知已安排跨省异地就医直接结算，区分基金支付和个人负担，并安排就医地与参保地的信息传输和结算流程。"},{"text":"该法8月28日通过后即已施行，老陈可以依其第32条主张直接结算","correct":false,"why":"错因：把通过日换成了施行日（被替换的是阶段）。该法2026年8月28日通过、同日以国家主席第80号令公布，2027年1月1日起施行。"},{"text":"该法尚未施行，说明它目前仍处于提请审议阶段，还没有通过和公布","correct":false,"why":"错因：把“已通过公布、尚未施行”换成了“仍在审议”（被替换的是阶段）。该法已经通过并公布，只是施行日期未到。"},{"text":"该法已公布、尚未施行，老陈此次结算还不能直接以其第32条为依据","correct":true,"why":"该法2027年1月1日起施行，截至2026年11月27日已公布、尚未施行，不能直接以第32条裁定当时的权利义务；现行依据须按当时的规则另行核对。"}],"answer":"","fix":"","explain":"三个时间要分开：医疗保障法2026年8月28日通过并公布，2027年1月1日起施行；跨省异地就医直接结算早有经办制度（国家医保局、财政部2022年通知）。截至11月27日，不能直接以尚未施行的第32条裁定当时的权利义务，也不能由此推出2026年不能办理异地直接结算。依据：E-LAW-06（《中华人民共和国医疗保障法》第32、56条；国家医保局、财政部2022年跨省异地就医直接结算通知第三部分第四项）。","condition":"国家法律，适用于全国：《中华人民共和国医疗保障法》（2026年8月28日通过，国家主席第80号令公布，2027年1月1日起施行）；截至2026年11月27日已公布、尚未施行；既有跨省异地就医直接结算依国家医保局、财政部2022年通知等当时的规则办理；不考具体报销比例。","refs":["E-LAW-06"],"origin":"自编","review":""},{"id":"F-K-LAW-06-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["K-LAW-06"],"lead":"","stem":"根据已公布、将于2027年1月1日起施行的《中华人民共和国医疗保障法》第32条，经办机构应当对异地就医参保人员在定点医药机构发生的医药费用及时足额直接结算，这里的“足额”是指按参保人员实际发生的医药费用总额结算并拨付。","opts":[],"answer":"错误","fix":"根据已公布、将于2027年1月1日起施行的《中华人民共和国医疗保障法》第32条，异地就医参保人员在定点医药机构发生的医药费用中，应当由医疗保障基金支付的部分，经办机构应当按照规定审核后及时足额直接结算并拨付；这里的“足额”以基金应付部分为限，不是按实际发生的医药费用总额结算。","explain":"错因：把“应当由医疗保障基金支付的部分”扩大成了实际发生的全部医药费用（被替换的是支付范围）。“足额”是就基金应付部分而言，基金支付和个人负担要分开，国家医保局、财政部2022年跨省异地就医直接结算通知也已作此区分。依据：E-LAW-06（《中华人民共和国医疗保障法》第32条；国家医保局、财政部2022年通知第三部分第四项）。","condition":"国家法律，适用于全国：《中华人民共和国医疗保障法》（2026年8月28日通过，2027年1月1日起施行）第32条；截至2026年11月27日已公布、尚未施行，本题按已公布文本考条文含义。","refs":["E-LAW-06"],"origin":"自编","review":""},{"id":"F-LAW-018-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-018"],"lead":"某公安机关依据2026年1月1日起施行的《中华人民共和国治安管理处罚法》（2025年修订）审查四名违反治安管理行为人，四人的行为依照该法均应当给予行政拘留处罚。","stem":"依该法第23条第2款，下列行为人中，不受第1款“不执行行政拘留处罚”规定限制的有（）。","opts":[{"text":"哺乳自己不满1周岁婴儿的甲违反治安管理，情节严重、影响恶劣","correct":false,"why":"错因：把“情节严重、影响恶劣”的例外扩大到了第1款第四项（被替换的是适用人群）。怀孕或者哺乳自己不满1周岁婴儿的情形不在第2款两类例外之列，依法应予拘留的仍不执行。"},{"text":"17周岁的乙初次违反治安管理，但情节严重、影响恶劣","correct":true,"why":"已满16周岁不满18周岁、初次违反治安管理属于第1款第二项；第2款规定第一、二、三项的行为人违反治安管理情节严重、影响恶劣的，不受前款限制。"},{"text":"71周岁的丙三年多以前曾两次被行政拘留，近一年内只有本次违法，情节一般","correct":false,"why":"错因：把“一年以内二次以上违反治安管理”换成了“曾受过两次拘留”（被替换的是条件）。丙一年以内只有本次违法，本次情节一般，仍属于70周岁以上依法不执行行政拘留的情形。"},{"text":"15周岁的丁在一年以内第二次违反治安管理，本次情节一般","correct":true,"why":"已满14周岁不满16周岁属于第1款第一项；第2款规定第一、三项的行为人在一年以内二次以上违反治安管理的，不受前款限制，这一类例外不以情节严重为条件。"}],"answer":"","fix":"","explain":"第23条第2款的两类例外，适用人群不同：情节严重、影响恶劣的，适用于第1款第一、二、三项（已满14不满16周岁；已满16不满18周岁初次违法；70周岁以上）；一年以内二次以上违反治安管理的，只适用于第一、三项。第四项（怀孕或者哺乳自己不满1周岁婴儿）不在两类例外之列。“不受前款限制”只表示不能再凭身份当然不执行，并不等于必然执行拘留。依据：E-LAW-07（《中华人民共和国治安管理处罚法》第23条第1、2款）。","condition":"中国大陆；《中华人民共和国治安管理处罚法》（2025年6月27日修订通过，国家主席第49号令公布，2026年1月1日起施行）第23条；以依法应当给予行政拘留处罚为前提；年龄、次数、期间、情节以题干为准，不补设“严重”“恶劣”的标准，不类推刑事责任年龄。","refs":["E-LAW-07","LAW-S07"],"origin":"自编","review":""},{"id":"F-LAW-008-5","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-008","LAW-007"],"lead":"","stem":"2026年8月15日，国家《中华人民共和国环境保护法》因生态环境法典施行而废止，《广东省环境保护条例》也于同日废止。","opts":[],"answer":"错误","fix":"2026年8月15日，国家《中华人民共和国环境保护法》因生态环境法典施行而废止；同日，广东省人大常委会2026年7月31日修订通过的《广东省环境保护条例》开始在广东省施行。","explain":"错因：把省条例的“修订施行”换成了“废止”（被替换的是动作）。同一天有两个不同的立法结果：国家《环境保护法》列在生态环境法典第1242条废止名单首项，于法典施行时废止；《广东省环境保护条例》由省十四届人大常委会第二十六次会议2026年7月31日修订通过、省人大常委会第80号公告公布，第1条以生态环境法典为制定依据，8月15日起施行。前者是国家法律，后者是适用于广东省行政区域的地方性法规。依据：E-YF-01（生态环境法典第1242条；广东省人大常委会第80号公告，省条例第1条）。","condition":"国家法律《中华人民共和国生态环境法典》（2026年3月12日通过，国家主席第70号令公布，2026年8月15日起施行）第1242条，适用于全国；广东省地方性法规《广东省环境保护条例》（2026年7月31日修订通过，省人大常委会第80号公告公布，2026年8月15日起施行），适用于广东省行政区域；截至2026年11月27日均已施行。","refs":["E-YF-01","LAW-S03"],"origin":"自编","review":"","o":158,"t":1},{"id":"F-LAW-011-5","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-011"],"lead":"","stem":"依2026年8月15日起施行的《广东省环境保护条例》第3条，各级人民政府对本行政区域的生态环境质量负责，生态环境主管部门实施统一监督管理，街道办事处和基层群众性自治组织协助开展工作。","opts":[],"answer":"正确","fix":"","explain":"第3条把职责分给不同主体：各级人民政府对本行政区域的生态环境质量负责；生态环境主管部门实施统一监督管理；其他有关部门依法分工；街道办事处和基层群众性自治组织协助开展工作。政府对环境质量负责和主管部门统一监管是两项不同职责，政府的质量责任不因主管部门统一监管而转给主管部门；街道办事处和居民委员会、村民委员会是协助者，不是统一监管者。依据：E-YF-01（《广东省环境保护条例》第3条）。","condition":"广东省地方性法规《广东省环境保护条例》（2026年7月31日修订通过，省人大常委会第80号公告公布，2026年8月15日起施行）第3条；适用于广东省行政区域；截至2026年11月27日已施行。","refs":["E-YF-01"],"origin":"自编","review":""},{"id":"F-LAW-030-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-030","LAW-002"],"lead":"广东省十四届人大常委会第二十六次会议于2026年7月31日通过《广东省规范性文件制定和管理监督条例》，省人大常委会同日以第79号公告公布。","stem":"截至2026年11月27日，关于这部条例，下列说法正确的是（）。","opts":[{"text":"它已于7月31日公布，自公布之日起已在广东全省施行","correct":false,"why":"错因：把公布日当成了施行日（被替换的是阶段）。条例第40条定于2027年1月1日起施行。"},{"text":"它是已公布、定于2027年1月1日起施行的地方性法规，目前尚未施行","correct":true,"why":"条例由省人大常委会通过并以公告公布，属于地方性法规；第40条定于2027年1月1日起施行，截至11月27日已公布、尚未施行，不能用它裁定2026年11月的具体行为。"},{"text":"它规范规章以下文件的制定和管理，因此自身也属于规章以下文件","correct":false,"why":"错因：把条例管理的对象当成了条例自身（被替换的是层级）。这部条例是省人大常委会制定的地方性法规，它管理的是规章以下的规范性文件。"},{"text":"它施行后，广东省地方政府规章的制定和管理也以它为依据","correct":false,"why":"错因：扩大了条例的调整对象（被替换的是对象）。条例第2条对地方性法规、地方政府规章等另指其制定和管理的法律依据。"}],"answer":"","fix":"","explain":"看这部条例要分两层：它自身是省人大常委会7月31日通过、第79号公告公布的地方性法规，2027年1月1日起施行，截至11月27日已公布、尚未施行；它管理的是规章以下的规范性文件，地方性法规、地方政府规章的制定和管理另有法律依据。正文网页8月3日发布，也不是施行日。依据：E-YF-02（省人大常委会第79号公告；条例第2、40条）。","condition":"广东省地方性法规《广东省规范性文件制定和管理监督条例》（2026年7月31日通过，省人大常委会第79号公告公布，2027年1月1日起施行），适用于广东省；截至2026年11月27日已公布、尚未施行。","refs":["E-YF-02"],"origin":"自编","review":""},{"id":"F-LAW-002-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-002"],"lead":"某县司法局组织学习已公布、将于2027年1月1日起施行的《广东省规范性文件制定和管理监督条例》，围绕第3条对规范性文件的界定作了梳理。","stem":"根据已公布的该条例文本，下列说法正确的有（）。","opts":[{"text":"规范性文件须具有普遍约束力，并可在一定时期内反复适用","correct":true,"why":"第3条在制定机关、权限程序、公开发布和涉及权利义务之外，还要求“具有普遍约束力、在一定时期内可以反复适用”。"},{"text":"任免某人职务的决定即使已经公开发布，也不属于规范性文件","correct":true,"why":"人事任免属于第3条下一款列举的排除情形；任免决定针对特定对象，公开发布不改变这一点。"},{"text":"机关的内部工作制度在本机关内反复适用，因而属于规范性文件","correct":false,"why":"错因：把“可以反复适用”当成了充分条件，忽略了排除情形（被替换的是条件）。内部工作制度属于第3条下一款列举的排除情形。"},{"text":"对某企业具体事项作出的处理决定，不因涉及其权利义务而成为规范性文件","correct":true,"why":"对具体事项作出的处理决定属于第3条下一款列举的排除情形；涉及权利义务只是要件之一，不能单独决定文件性质。"}],"answer":"","fix":"","explain":"判断是不是规范性文件，看效力和适用方式：除由制定机关依法定权限、程序制定，公开发布，涉及权利义务外，还须具有普遍约束力、在一定时期内可以反复适用；内部工作制度、人事任免、对具体事项作出的处理决定等被明确排除。该条例截至2026年11月27日尚未施行，本题只按已公布文本考定义。依据：E-YF-02（《广东省规范性文件制定和管理监督条例》第3条）。","condition":"广东省地方性法规《广东省规范性文件制定和管理监督条例》（2026年7月31日通过，省人大常委会第79号公告公布，2027年1月1日起施行）第3条，适用于广东省；截至2026年11月27日已公布、尚未施行，本题按已公布文本考定义，不据以裁定施行前的具体行为。","refs":["E-YF-02"],"origin":"自编","review":""},{"id":"F-LAW-030-6","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-030","GD-020","P4-07"],"lead":"广东人大网2026年11月26日刊载南方日报报道，介绍11月25日召开的省十四届人大常委会第二十八次会议。会议议程涉及《广东省人工智能发展促进条例（草案）》《广东省县域经济振兴条例（草案）》。","stem":"下列关于该次会议的说法，与报道记载相符的是（）。","opts":[{"text":"会议听取了省人民政府关于这两项条例实施情况的报告","correct":false,"why":"错因：把“草案说明”换成了“实施情况报告”（被替换的是阶段）。报道中两项均以草案出现；实施情况报告以法规已经施行为前提，本轮也未核到两项的通过、公布、施行依据。"},{"text":"会议听取了省人大法制委员会关于这两项草案审议结果的报告","correct":false,"why":"错因：换了作报告的主体和立法环节（被替换的是主体和环节）。报道记载的是省人民政府作法规案的说明；审议结果报告是立法程序中的另一个环节，报道未作此记载。"},{"text":"会议听取了省人民政府关于这两项草案等法规案的说明","correct":true,"why":"报道记载会议“听取省人民政府关于”两项草案“等法规案的说明”：由省人民政府作说明，省人大常委会会议听取。"},{"text":"会议听取了省政协关于这两项草案的协商意见","correct":false,"why":"错因：把省人民政府换成了省政协（被替换的是主体）。报道记载由省人民政府作法规案的说明；政协是专门协商机构，不是本次会议上作法规案说明的主体。"}],"answer":"","fix":"","explain":"报道只证明到“听取说明”这一步：两项均以草案进入11月25日省人大常委会会议议程，由省人民政府作法规案的说明。草案说明、审议结果报告、通过公告是立法程序中的不同环节；后续是否通过、何时施行须另查正式文本，既不能据此认定已经施行，也不能断言此后没有通过。依据：E-YF-03（广东人大网2026年11月26日刊载的会议报道，来源南方日报）。","condition":"广东省地方性法规的立法程序；证据限于广东人大网2026年11月26日刊载的南方日报报道（报道2026年11月25日省十四届人大常委会第二十八次会议）；截至2026年11月27日未取得两项条例的通过、公布、施行依据；本题只考会议上的立法动作，不涉及草案实体内容。","refs":["E-YF-03","LAW-S16"],"origin":"自编","review":""},{"id":"F-GD-020-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-020","LAW-030"],"lead":"材料一：广东人大网2026年10月11日报道，10月10日在省政务和数据局召开数据立法调研座谈，目的是“扎实做好省数据条例的制定工作”，座谈收集了数据产权登记、跨境流动等方面的意见。材料二：省人大常委会2026年10月30日公布《广东省人大常委会2027年度立法计划（公开征求意见稿）》，反馈截止日为11月30日，“继续审议项目”下列有“广东省低空经济发展条例”。","stem":"截至2026年11月27日，仅依据这两则材料，下列判断恰当的有（）。","opts":[{"text":"材料一证实省数据条例的立法调研已经开展，但没有证实该条例已通过或施行","correct":true,"why":"调研报道证实省数据条例的制定工作已经开展；本轮未核得该条例的通过日期、公布公告或施行条款。"},{"text":"座谈中收集的数据产权登记、跨境流动等意见，已成为企业应当遵守的法定义务","correct":false,"why":"错因：把立法调研中收集的意见换成了法定义务（被替换的是规范状态）。座谈意见只是立法参考，报道没有提供已经生效的行为规范。"},{"text":"材料二征求意见的对象是2027年度立法计划，该计划稿此时仍在反馈期内","correct":true,"why":"10月30日公布的是下一年度立法计划的公开征求意见稿，征求意见的对象是计划本身；反馈截止日为11月30日，截至11月27日仍在征求意见。"},{"text":"假如某项省级法规没有列入这份计划稿，就可以据此判定它已经通过","correct":false,"why":"错因：把“未列入某张计划表”当成了法规状态的证据（被替换的是判断依据）。一个项目未出现在某张计划表中，不足以确定其状态。"}],"answer":"","fix":"","explain":"两则材料各证实到一步：材料一证实数据立法调研已经开展，座谈意见不是法定义务；材料二是2027年度立法计划的征求意见稿，把低空经济发展条例列为“继续审议项目”，只是一份拟议安排。截至核验日，两项省级法规均未核得通过、公布、施行依据；某个项目是否列入某张计划表，也不足以确定其状态。依据：E-YF-04（广东人大网2026年10月11日数据立法调研报道；《广东省人大常委会2027年度立法计划（公开征求意见稿）》），E-YF-03（该稿反馈截止日11月30日）。","condition":"广东省级地方性法规的立法进展；材料限于广东人大网2026年10月11日报道和省人大常委会2026年10月30日公布的2027年度立法计划公开征求意见稿（反馈截止2026年11月30日）；截至2026年11月27日，省数据条例、省低空经济发展条例均未核得通过、公布、施行依据；只考立法动作，不涉及条例实体内容，不断言其是否已经通过；不与广州、深圳等市级法规混用。","refs":["E-YF-04","E-YF-03"],"origin":"自编","review":""},{"id":"F-GD-007-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-007"],"lead":"某同学复习“百县千镇万村高质量发展工程”（简称“百千万工程”），对照2022年12月中共广东省委全会通过的《决定》原文，以及2026年省“百千万工程”指挥部印发五年显著变化行动方案的官方消息（不引用方案全文条款），整理时间节点。","stem":"截至2026年11月27日，下列笔记正确的是（）","opts":[{"text":"“到2027年县域综合实力明显增强”这一目标，是2026年的行动方案首次提出的","correct":false,"why":"错因：把提出阶段目标的文件和年份换成了2026年行动方案（文件、时间替换）。2022年12月省委全会通过的《决定》已经写明到2027年的阶段目标；2026年方案是推进“五年显著变化”目标任务的部署。"},{"text":"“到2027年”是按工程启动年份推算出来的，《决定》原文没有写这一年份","correct":false,"why":"错因：沿用了旧资料“未直接核到2027年”的口径，把可直接引用的原文换成了推算（依据替换）。《决定》第一部分第（四）项依次列2025年、2027年、2035年三个节点，2027年可按原文直接引用。"},{"text":"2022年省委全会通过的《决定》已写明，到2027年城乡区域协调发展取得明显成效","correct":true,"why":"《中共广东省委关于实施“百县千镇万村高质量发展工程”促进城乡区域协调发展的决定》2022年12月8日经省委十三届二次全会通过，第一部分第（四）项写明“到2027年，城乡区域协调发展取得明显成效，县域综合实力明显增强”。2026年方案推进“五年显著变化”，与这一阶段目标可以同时成立。"},{"text":"方案消息于2026年5月8日见于官方网页，可据此认定方案是当天签发的","correct":false,"why":"错因：把网页刊发日期当成了签发日期（日期替换）。官方网页发布的是指挥部印发方案的消息，未载签发日期；广东网信网5月7日已报道指挥部“近日印发”。"}],"answer":"","fix":"","explain":"四种时间含义要分开：2022年12月省委十三届二次全会通过《决定》，其中写明到2027年的阶段目标（《决定》依次列2025年、2027年、2035年三个节点）；2026年指挥部印发行动方案，是推进“五年显著变化”目标任务的部署，与2027年阶段目标可以同时成立；网页刊发日期不等于签发日期。依据：E-GD-01（《中共广东省委关于实施“百县千镇万村高质量发展工程”促进城乡区域协调发展的决定》第一部分第（四）项；2026年行动方案的官方发布消息）。","condition":"依据《中共广东省委关于实施“百县千镇万村高质量发展工程”促进城乡区域协调发展的决定》（中共广东省委，2022-12-08经省委十三届二次全会通过）第一部分第（四）项。2026年省“百千万工程”指挥部印发的五年显著变化行动方案只核到官方发布消息（广东网信网2026-05-07、省委老干部局网页2026-05-08），未取得盖章全文，本题不引用其逐字条文和签发日期。","refs":["E-GD-01","GD-S05"],"origin":"自编","review":""},{"id":"F-K-GD-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["K-GD-02"],"lead":"某市实行城镇、农村两档低保标准。2026年，该市城镇低保标准为每人每月1000元，农村低保标准为每人每月850元；该市一户农村低保家庭按家庭收入情况补差后，每月实际领取低保金400元。","stem":"对照《2026年广东省政府工作报告》附件1（2026年省十件民生实事）第一项的省定要求，下列判断正确的有（）","opts":[{"text":"该市农村低保标准为城镇标准的85%，达到了省定的最低比例","correct":true,"why":"省报告把农村低保标准占城镇低保标准的最低比例定为80%以上；850÷1000=85%，达到要求。比较对象是城镇低保标准。"},{"text":"该户每月实领的400元不到城镇标准的80%，说明该市农村低保未达到省定比例","correct":false,"why":"错因：把每户实领金额换成了农村低保标准（对象替换）。实领金额是按家庭情况补差后的结果，和低保标准是不同口径；判断是否达到省定比例，要用农村低保标准与城镇低保标准相比。"},{"text":"按2026年的要求，农村低保标准达到城镇标准的77%就符合省定比例","correct":false,"why":"错因：沿用了调整前的比例（时间替换）。2026年省报告把最低比例从77%调至80%以上。"},{"text":"若该市把农村低保标准提高到城镇标准的90%，同样符合“80%以上”的要求","correct":true,"why":"“80%以上”是最低比例，不是固定比例，高于80%同样符合要求。汕头2026年农村低保标准817元、城镇872元，农村也超过城镇的80%。"}],"answer":"","fix":"","explain":"农村低保标准与城镇低保标准相比，2026年最低比例由77%调至80%以上，这是下限，不是固定比例；每户实领金额是另一口径，不能用来判断标准是否达标。同项另规定特困人员基本生活保障标准不低于当地低保标准的1.6倍，两个数的比较对象不同。依据：E-GD-02（《2026年广东省政府工作报告》附件1第一项；汕头市民政局2026-05-26通知作市级落实例）。","condition":"省定要求依据《2026年广东省政府工作报告》（广东省人民政府，2026-01-26在省十四届人大五次会议上作报告，网页2026-01-31发布）附件1《2026年省十件民生实事》第一项。材料中的“某市”及其金额为自编，只用来练习省定比例的用法，不代表任何地市的实际标准；汕头数据只作市级落实例。","refs":["E-GD-02","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-02-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["K-GD-02"],"lead":"","stem":"按《2026年广东省政府工作报告》附件1第一项，某市实行城乡统一的低保标准，为每人每月1200元，则该市特困人员基本生活保障标准不应低于每人每月1920元。","opts":[],"answer":"正确","fix":"","explain":"省报告规定特困人员基本生活保障标准不低于当地最低生活保障标准的1.6倍：1200×1.6=1920元。比较基数是当地低保标准；80%是农村低保标准对城镇低保标准的最低比例，两个数字不能互换（误用80%会算成960元）。依据：E-GD-02（《2026年广东省政府工作报告》附件1第一项）。","condition":"《2026年广东省政府工作报告》附件1《2026年省十件民生实事》第一项（省级下限）。“某市”及金额为自编；设定该市城乡低保标准统一，基数唯一。","refs":["E-GD-02","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["K-GD-03"],"lead":"2026年，某县（市）同时得到两方面教育帮扶：一所省内优质高中与该县的公办县中结对，开展教研共建和教师交流；一所师范大学与当地合作，为县域中小学开展教师培训和教研指导。","stem":"对照《2026年广东省政府工作报告》附件1第三项和省教育厅2026年全省教育工作会议的部署，下列理解正确的是（）","opts":[{"text":"优质高中与县中结对属于横向帮扶，师范大学帮扶县域基础教育属于纵向帮扶","correct":true,"why":"省教育厅部署提出完善“横向+纵向”帮扶机制；报告同一项里，232所优质高中参加结对帮扶（高中帮县中），12所师范（教师教育）院校纵向帮扶县域基础教育（高校帮县域基础教育）。材料中的两方面帮扶与此对应。"},{"text":"师范大学与当地合作也属于横向结对帮扶，因为双方同在教育系统内","correct":false,"why":"错因：把师范院校的纵向帮扶换成了横向结对（关系替换）。是否同属教育系统不是区分标准；师范院校纵向帮扶县域基础教育，不承担优质高中的横向结对角色。"},{"text":"报告中的232所，指的是接受优质高中结对帮扶的县中数量","correct":false,"why":"错因：把帮扶方换成了受援方（对象替换）。232所是参加结对帮扶的优质高中，不是受援县中的数量。"},{"text":"优质高中与县中结对属于纵向帮扶，因为它把城市的优质教育资源送到了县域","correct":false,"why":"错因：把横向结对换成了纵向帮扶（关系替换）。“纵向”指师范院校帮扶县域基础教育；优质高中与县中结对是横向的。"}],"answer":"","fix":"","explain":"同一项里有三种做法、三个数：县中托管帮扶覆盖范围从15个县（市）扩大到57个县（市）；232所优质高中参加结对帮扶（高中帮县中）；12所师范（教师教育）院校纵向帮扶县域基础教育（高校帮县域基础教育）。依据：E-GD-03（《2026年广东省政府工作报告》附件1第三项；省教育厅全省教育工作会议部署，汕尾市教育局2026-01-26刊载工作要点）。","condition":"依据《2026年广东省政府工作报告》附件1《2026年省十件民生实事》第三项，以及省教育厅2026年全省教育工作会议部署（提出完善“横向+纵向”帮扶机制）。这些是2026年年度任务；材料为自编情境，不涉及托管帮扶由谁担任托管方。","refs":["E-GD-03","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-03-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["K-GD-03"],"lead":"","stem":"按《2026年广东省政府工作报告》附件1第三项，2026年广东要把县中托管帮扶从15所帮扶高校扩大到57所帮扶高校。","opts":[],"answer":"错误","fix":"按《2026年广东省政府工作报告》附件1第三项，2026年广东要把县中托管帮扶的覆盖范围从15个县（市）扩大到57个县（市）。","explain":"错在覆盖单位：15和57是托管帮扶覆盖的县（市）个数，不是帮扶高校的数量（对象替换：把受援的县（市）换成了帮扶方）。省教育厅部署也写“推动57个县（市）公办县中帮扶工作全覆盖”。这是2026年全年任务，不能仅凭报告认定某一日期已全部完成。依据：E-GD-03（《2026年广东省政府工作报告》附件1第三项）。","condition":"《2026年广东省政府工作报告》附件1《2026年省十件民生实事》第三项（2026年省级年度任务）。","refs":["E-GD-03","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["K-GD-04","LAW-027"],"lead":"小何在广东工作，参加了职工基本医疗保险和职工生育保险。2026年孕期，她先因先兆早产住院安胎，后来按期产检，并住院分娩。","stem":"按《2026年广东省政府工作报告》附件1第四项的省级表述，下列说法正确的有（）","opts":[{"text":"如果她只是在门诊接受安胎治疗、没有住院，这部分门诊费用也属于报告所列的安胎支付情形","correct":false,"why":"错因：把“住院”换成了“门诊”（条件替换）。报告所列的是因晚期先兆流产、宫颈功能不全、先兆早产等安胎和胎位异常外倒转发生的住院医疗费用。"},{"text":"住院分娩期间符合规定支付范围的生育医疗费用，对应职工生育保险参保人员的支付情形","correct":true,"why":"省报告写明，职工生育保险参保人员对应产检和分娩住院期间发生的生育医疗费用，并以符合国家和省规定的药品、诊疗项目和医用耗材支付范围限定。"},{"text":"职工生育保险费是由用人单位缴纳的，因此她安胎住院的医疗费用应由用人单位直接承担","correct":false,"why":"错因：把缴费主体换成了待遇支付方（主体替换）。保费由谁缴、哪些费用能报、由哪个基金支付是三个问题：社会保险法规定职工生育保险费由用人单位缴纳，省报告写明的支付方是职工基本医保统筹基金，不是用人单位。"},{"text":"先兆早产住院安胎发生的、符合规定支付范围的医疗费用，对应职工基本医保参保人员的支付情形","correct":true,"why":"省报告写明，职工基本医保参保人员对应因晚期先兆流产、宫颈功能不全、先兆早产等安胎和胎位异常外倒转发生的住院医疗费用，同样受规定的支付范围限制。"}],"answer":"","fix":"","explain":"按省报告，两类参保人员各对应一类费用：职工生育保险参保人员对应产检和分娩住院期间的生育医疗费用；职工基本医保参保人员对应安胎和胎位异常外倒转发生的住院医疗费用。两支都限于规定的药品、诊疗项目和医用耗材支付范围；缴费主体和支付基金要分开看。依据：E-GD-04（《2026年广东省政府工作报告》附件1第四项），缴费主体见LAW-027（《中华人民共和国社会保险法》）。","condition":"省级口径依据《2026年广东省政府工作报告》附件1《2026年省十件民生实事》第四项（2026年年度任务）。地市的具体病种、实施日期和结算规则以当地文件为准（如河源市文件2026-11-01起实施，只适用于河源市），本题不涉及。材料为自编情境。","refs":["E-GD-04","GD-S01","LAW-S13"],"origin":"自编","review":""},{"id":"F-K-GD-04-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["K-GD-04"],"lead":"","stem":"河源市医保局2026年10月26日发布的政策解读，在相关情形中列有“前置胎盘伴出血”，并说明当地文件自2026年11月1日起实施，据此可以认定广东各地市都自2026年11月1日起把这一情形纳入保障。","opts":[],"answer":"错误","fix":"河源市医保局2026年10月26日发布的政策解读，在相关情形中列有“前置胎盘伴出血”，并说明当地文件自2026年11月1日起实施，这一列举和实施日期只适用于河源市文件，不能据此认定广东其他地市的口径。","explain":"错在把河源市的实施口径外推成了全省各地市的口径（地域、层级替换）。省报告第四项写的是省级年度任务，列举“晚期先兆流产、宫颈功能不全、先兆早产等”情形；河源解读的具体列举和日期只适用于该市文件。其他地市的情形和日期，以及省级文件粤医保函〔2026〕102号的具体内容，须另核正式原件。依据：E-GD-04（河源市医保局《〈关于完善职工生育保险有关事项的通知〉解读》；《2026年广东省政府工作报告》附件1第四项）。","condition":"河源市实施口径：河源市医保局2026-10-26发布的《〈关于完善职工生育保险有关事项的通知〉解读》，当地文件2026-11-01起实施；省级口径：《2026年广东省政府工作报告》附件1第四项。截至2026年11月27日未取得粤医保函〔2026〕102号全文。","refs":["E-GD-04"],"origin":"自编","review":""},{"id":"F-K-GD-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["K-GD-05","GD-020"],"lead":"广东省医疗保障局2026年11月发布《广东省长期护理保险护理服务机构定点管理实施细则》（粤医保规〔2026〕5号），细则写明自2027年1月1日起施行。某市一家养老机构想了解其中的定点规定；该市市民老周的母亲重度失能，他想了解长护险保障什么。","stem":"截至2026年11月27日，下列说法正确的有（）","opts":[{"text":"该细则11月发布即已生效，养老机构11月起申请定点就要按细则办理","correct":false,"why":"错因：把“发布”当成了“施行”（阶段替换）。细则2026-11-03印发、11-05发布，第四十条写明自2027年1月1日起施行、有效期5年；截至2026年11月27日是“已发布、未施行”，不能当作现行规定。"},{"text":"该细则要到2027年1月1日才施行，可以据此推定广东在这之前没有开展过长期护理保险试点","correct":false,"why":"错因：由一份规范性文件的施行日反推整个制度此前空白（推断替换：把机构定点规则的生效时间当成了制度的起点）。细则管的是定点机构的准入、运行与监管，不能据其施行日推定此前没有长护险试点。"},{"text":"按细则将施行的规则，符合条件的养老机构可申请定点，审核合格后与统筹地区医保经办机构签服务协议","correct":true,"why":"细则规定符合条件的养老、医疗或其他照护服务机构可申请定点，审核合格并与统筹地区医保经办机构签订服务协议后纳入定点管理；申请定点的是机构，不是享受待遇的个人。这是2027年1月1日起施行的规则。"},{"text":"2026年省十件民生实事的长护险任务，保障重度失能人员的基本生活照料及密切相关的医疗护理","correct":true,"why":"《2026年广东省政府工作报告》附件1第二项的年度任务，保障对象是重度失能人员，内容是基本生活照料及密切相关的医疗护理，不是按年龄划线。"}],"answer":"","fix":"","explain":"同一材料里分三组看：生效时间——细则2026年11月发布、2027年1月1日起施行，现在是“已发布、未施行”，其中的定点规则只能按“将施行”理解，也不能由施行日推定此前没有长护险试点；签约主体——申请定点的是护理服务机构，不是享受待遇的个人，签服务协议的对方是统筹地区医保经办机构，不是发文的省医保局；保障对象——年度任务针对重度失能人员，不是单纯达到一定年龄。依据：E-GD-05（《2026年广东省政府工作报告》附件1第二项；粤医保规〔2026〕5号第二条、第四十条）。","condition":"年度任务依据《2026年广东省政府工作报告》附件1《2026年省十件民生实事》第二项；机构定点规则依据广东省医疗保障局《广东省长期护理保险护理服务机构定点管理实施细则》（粤医保规〔2026〕5号，2026-11-03印发、11-05发布），已公布、2027年1月1日起施行，截至2026年11月27日尚未施行。材料为自编情境。","refs":["E-GD-05","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-05-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"GD","cards":["K-GD-05"],"lead":"《广东省长期护理保险护理服务机构定点管理实施细则》（粤医保规〔2026〕5号，已公布，自2027年1月1日起施行）第七条，把定点机构提供的服务分为居家护理、社区护理和机构护理。三位参保人的情况是：甲由一家定点护理院派护理员每周三次上门，在甲家中护理；乙白天到住所附近的社区照护站接受护理，傍晚回家；丙入住一家护理院，由院方全天照护。","stem":"按该细则将施行的规则，下列配对正确的是（）","opts":[{"text":"甲—机构护理；乙—社区护理；丙—机构护理","correct":false,"why":"错因：按派出护理员的单位而不是服务地点判断甲（关系替换）。护理员来自护理院，但服务在参保人住所提供，属于居家护理。"},{"text":"甲—居家护理；乙—社区护理；丙—机构护理","correct":true,"why":"居家护理在参保人住所提供；社区护理是依托社区的就近非全日服务；机构护理由机构提供全日服务。三人分别对应。"},{"text":"甲—居家护理；乙—机构护理；丙—社区护理","correct":false,"why":"错因：把“非全日”和“全日”对调（条件替换）。乙白天在社区站、傍晚回家，是依托社区的就近非全日服务；丙入住机构、全天照护，才是机构护理。"},{"text":"甲—社区护理；乙—居家护理；丙—机构护理","correct":false,"why":"错因：把服务地点对调（条件替换）。甲在自己家中接受护理，是居家护理；乙到社区照护站接受服务，是社区护理。"}],"answer":"","fix":"","explain":"三种护理方式看服务在哪里提供、是不是全日：居家护理在参保人住所提供；社区护理是依托社区的就近非全日服务；机构护理由机构提供全日服务。护理员由哪家机构派出，不改变服务方式的归类。依据：E-GD-05（粤医保规〔2026〕5号第七条）。","condition":"依据广东省医疗保障局《广东省长期护理保险护理服务机构定点管理实施细则》（粤医保规〔2026〕5号）第七条；该细则已公布、2027年1月1日起施行，截至2026年11月27日尚未施行，本题按其将施行的规则作答。材料为自编情境。","refs":["E-GD-05"],"origin":"自编","review":""},{"id":"F-K-GD-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["K-GD-06"],"lead":"网约车司机小陈经某出行平台注册接单，平台和小陈都在广东新就业形态人员职业伤害保障试点范围内。2026年9月，他在广东甲市接到一单跨市订单，载客途中在广东乙市发生交通事故受伤；之后回到居住地广东丙市，就近到丙市的线下经办窗口递交职业伤害确认材料。","stem":"按广东省人社厅等三部门《关于加强我省职业伤害保障业务经办和征收管理有关工作的通知》（粤人社规〔2026〕2号），下列说法正确的是（）","opts":[{"text":"材料在丙市递交，职业伤害确认就由丙市人社行政部门负责办理","correct":false,"why":"错因：把受理地换成了确认地（主体替换）。就近受理不改变确认事项的办理地，职业伤害确认由事故伤害发生地人社行政部门负责办理。"},{"text":"订单在甲市接下，职业伤害确认应由甲市人社行政部门负责办理","correct":false,"why":"错因：把事故伤害发生地换成了接单地（条件替换）。确认看事故伤害发生在哪里，不看在哪里接单。"},{"text":"丙市不是事故发生地，丙市窗口应当拒收材料，让他回到乙市的窗口递交","correct":false,"why":"错因：把“就近受理”换成了只能在事故发生地受理（动作替换）。通知对线下业务写明“就近受理、属地办理”，丙市窗口可以就近受理。"},{"text":"丙市窗口可以就近受理材料，职业伤害确认由乙市人社行政部门负责办理","correct":true,"why":"通知对线下业务写明“就近受理、属地办理”，职业伤害确认由事故伤害发生地人社行政部门负责办理。小陈在乙市受伤，丙市窗口受理后，由乙市人社行政部门办理确认。"}],"answer":"","fix":"","explain":"受理窗口和有办理职责的部门要分开：线下“就近受理、属地办理”，材料可以就近递交，职业伤害确认由事故伤害发生地人社行政部门负责；接单地、居住地都不决定确认地。劳动能力鉴定另有相应规定，本题不涉及。依据：E-GD-06（粤人社规〔2026〕2号《关于加强我省职业伤害保障业务经办和征收管理有关工作的通知》第一、二项）。","condition":"依据广东省人社厅、国家税务总局广东省税务局及深圳市税务局《关于加强我省职业伤害保障业务经办和征收管理有关工作的通知》（粤人社规〔2026〕2号，2026-03-01起实施，有效期5年）；甲、乙、丙三市都在广东省内；题干已设定平台和从业者在试点范围内。材料为自编情境。","refs":["E-GD-06"],"origin":"自编","review":""},{"id":"F-K-GD-06-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["K-GD-06","LAW-027"],"lead":"","stem":"按人社部等九部门2025年4月22日落款的《新就业形态人员职业伤害保障办法（试行）》，纳入试点的平台企业为经平台注册接单、符合条件的从业者按订单计费、按月申报缴纳职业伤害保障费；对适用《工伤保险条例》的劳动者，企业仍应依法为其参加工伤保险。","opts":[],"answer":"正确","fix":"","explain":"缴费主体是平台企业，计费单位是订单，申报周期是月；职业伤害保障是试点保障，不替代法定工伤保险，适用《工伤保险条例》的劳动者，企业应当依法为其参加工伤保险。2026年广东省十件民生实事第五项另推动出行、即时配送、同城货运等行业试点扩围。依据：E-GD-06（《新就业形态人员职业伤害保障办法（试行）》第2、7条）。","condition":"人社部等九部门《关于扩大新就业形态人员职业伤害保障试点的通知》所附《新就业形态人员职业伤害保障办法（试行）》，落款2025-04-22；“纳入试点”指平台和从业者都在试点范围内。截至2026年11月27日。","refs":["E-GD-06"],"origin":"自编","review":""},{"id":"F-GD-003-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-003","GD-006"],"lead":"2026年6月，广东省人民政府印发《广东省推进服务业扩能提质实施方案》（粤府〔2026〕36号）。某快递企业随后调整业务：一是为一家果蔬加工厂开通冷链专线，把寄递服务嵌入其原料采购和产品销售的供应链；二是为周边社区居民增设生鲜到家和夜间寄取服务。","stem":"对照该方案，下列理解正确的有（）","opts":[{"text":"第一项业务服务加工厂的供应链，对应方案中推动生产性服务业向专业化和价值链高端延伸","correct":true,"why":"方案总述提出“推动生产性服务业向专业化和价值链高端延伸”；为加工厂做供应链配套，服务对象是生产经营，对应这一方向。"},{"text":"第二项业务面向社区居民生活，对应的是方案中“向专业化和价值链高端延伸”的发展方向","correct":false,"why":"错因：把生产性服务业的发展方向套到了生活性服务业上（关系替换）。方案对生活性服务业提的是“高品质多样化便利化发展”。"},{"text":"方案提出力争到2030年全省服务业增加值突破11万亿元，这是努力目标而非已实现的结果","correct":true,"why":"方案总述写“力争到2030年全省服务业增加值突破11万亿元”：时间是2030年，指标是全省服务业增加值，“力争”表明是努力目标。"},{"text":"方案中“力争到2030年突破11万亿元”这一指标，衡量的是2030年的全省地区生产总值","correct":false,"why":"错因：把“全省服务业增加值”换成了“全省地区生产总值”（指标替换）。《2026年广东省政府工作报告》另有当年地区生产总值增长4.5%—5%的预期目标，两者的时间和指标都不同。"}],"answer":"","fix":"","explain":"按粤府〔2026〕36号方案总述，两条方向分别对应两类服务业：生产性服务业向专业化和价值链高端延伸，生活性服务业高品质多样化便利化发展；同一家企业的两项业务按服务对象分别对应。“力争到2030年全省服务业增加值突破11万亿元”是努力目标，时间、指标都不同于2026年全省地区生产总值的年度预期目标。依据：E-GD-07（《广东省推进服务业扩能提质实施方案》总述，粤府〔2026〕36号）。","condition":"依据广东省人民政府《关于印发〈广东省推进服务业扩能提质实施方案〉的通知》（粤府〔2026〕36号，2026-06-13落款）总述；2026年地区生产总值目标见《2026年广东省政府工作报告》。材料为自编情境，按每项业务的服务对象判断。","refs":["E-GD-07","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-08-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["K-GD-08"],"lead":"某沿海市在《广东省现代化海洋牧场设施设备险实施方案》（粤农农规〔2026〕4号）所列地市范围内。当地一家养殖企业有：已建成并投放至海上的深水养殖网箱，正在船厂建造、尚未投放的一组新网箱，网箱里养殖的金鲳鱼，以及在海上作业的养殖工人。","stem":"截至2026年11月27日，按该方案，下列说法正确的有（）","opts":[{"text":"正在船厂建造、尚未投放的新网箱，已纳入方案的保险标的范围","correct":false,"why":"错因：把“已建成并投放至海上”换成了
