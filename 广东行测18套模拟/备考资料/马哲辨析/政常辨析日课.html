e_or_counterexample":"同样规模的厂房，可以处于不同所有制和分配关系中。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.17","module_id":"M7","title":"生产关系与经济基础的联系","priority":"A","correct_statement":"一定社会的生产关系从其总和及其对上层建筑的基础作用看，构成经济基础。","incorrect_statement":"生产关系与经济基础是两个完全互不相干的社会层次。","explanation":"不是机器到人际关系再凭空多出一层钱，经济基础是在社会结构关系中讨论生产关系的总体。","necessary_conditions_and_boundaries":"单项生产关系不能自动代表社会经济基础的全部。","example_or_counterexample":"一项分配关系是分析经济基础的内容之一，不是经济基础的全部。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.18","module_id":"M7","title":"上层建筑的两类","priority":"A","correct_statement":"上层建筑包括政治法律制度及相关组织设施，也包括与经济基础相适应的意识形态。","incorrect_statement":"上层建筑只有思想观念，不包括政治组织、法律制度及相关设施。","explanation":"政治上层建筑与观念上层建筑不同，不能把全部上层建筑都说成脑中的观念。","necessary_conditions_and_boundaries":"分类看社会功能与关系，不只看是否可见可触。","example_or_counterexample":"国家组织与政治法律思想可分别对应两类上层建筑。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.19","module_id":"M7","title":"国家政权与上层建筑","priority":"A","correct_statement":"在上层建筑中，政治上层建筑居主导地位，国家政权是其核心。","incorrect_statement":"经济基础是上层建筑内部的一种思想，国家政权则属于生产工具。","explanation":"这些范畴在社会结构中的位置不同，不能因国家机构有物质设施就归为生产工具。","necessary_conditions_and_boundaries":"谈国家政权的政治功能，不是把建筑材料也当成政治观念。","example_or_counterexample":"同一设施可从材料或社会职能分析，题目层次必须清楚。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.20","module_id":"M7","title":"所有制关系与法律规定","priority":"A","correct_statement":"所有制的实际经济关系属于生产关系，确立和保障它的法律制度属于上层建筑。","incorrect_statement":"只要法律条文涉及所有制，这条法律作为制度就自动属于经济基础。","explanation":"被规定的经济关系与规定它的法律形式相联系但不等同。","necessary_conditions_and_boundaries":"材料可能同时包含两个层次，需看题目主语。","example_or_counterexample":"财产由谁实际占有与以何种法律制度确认保障，不能混为一个范畴。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.21","module_id":"M7","title":"经济基础决定与上层建筑反作用","priority":"A","correct_statement":"经济基础决定上层建筑，上层建筑又能维护或调整相应经济关系。","incorrect_statement":"法律政治制度有重大作用，所以经济基础由它们任意创造并根本决定。","explanation":"反作用可以很强，但作用强度不等于本原关系颠倒。","necessary_conditions_and_boundaries":"经济基础变化与上层建筑变化不必立即、全面同步。","example_or_counterexample":"法律改革影响经济运行，但仍需分析其物质条件与所服务的关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.22","module_id":"M7","title":"上层建筑促进发展的条件","priority":"A","correct_statement":"上层建筑服务于适合生产力发展的经济基础时，才能就这种作用说它促进社会进步。","incorrect_statement":"只要上层建筑适应并维护现有经济基础，就无条件促进社会进步。","explanation":"维护某种经济关系可能稳定旧秩序；是否进步还要看该经济关系对生产力的作用。","necessary_conditions_and_boundaries":"不能省掉“服务何种经济基础”这一中间判断。","example_or_counterexample":"维护阻碍生产力的旧关系，不会仅因维护得有效就成为进步力量。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.23","module_id":"M7","title":"社会基本矛盾与主要矛盾","priority":"A","correct_statement":"生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，不等于某阶段社会主要矛盾。","incorrect_statement":"社会主要矛盾表述发生变化，就说明社会基本矛盾不再存在。","explanation":"基本矛盾贯穿社会发展，主要矛盾着眼一定阶段的突出支配关系。","necessary_conditions_and_boundaries":"不随意将不同阶段政治表述当作基本范畴定义。","example_or_counterexample":"某阶段突出问题改变，不表示生产和制度之间的关系消失。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.24","module_id":"M7","title":"根本动力与最终决定力量","priority":"A","correct_statement":"社会基本矛盾运动是社会发展的根本动力，生产力是社会发展的最终决定力量。","incorrect_statement":"阶级斗争是任何社会形态发展的唯一根本动力，生产力与社会基本矛盾无关紧要。","explanation":"根本动力、最终决定力量、具体阶段直接动力，指向不同理论层次。","necessary_conditions_and_boundaries":"固定完整主语，避免把各种“动力”当成同义标签。","example_or_counterexample":"课堂关系表必须保留社会基本矛盾运动的主语。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.25","module_id":"M7","title":"阶级斗争的适用范围","priority":"A","correct_statement":"阶级斗争是阶级社会发展的直接动力，这一表述不能删去阶级社会的限定。","incorrect_statement":"阶级斗争是包括无阶级社会在内的一切社会发展的直接动力。","explanation":"限定语决定命题适用范围，删除后改变命题内容。","necessary_conditions_and_boundaries":"不据此把现实中的所有问题都解释为阶级斗争。","example_or_counterexample":"适用于某类社会的动力表述，不能无限推广。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.26","module_id":"M7","title":"社会主义改革与制度性质","priority":"B","correct_statement":"社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力。","incorrect_statement":"社会主义改革的定义，就是从根本上推翻社会主义基本制度。","explanation":"改革针对不适应发展的具体体制机制，不等于更换基本制度的定义。","necessary_conditions_and_boundaries":"改革可深刻改变具体制度安排，不能由自我完善推出无实质变化。","example_or_counterexample":"完善运行机制可以释放发展动力，而不必改变基本制度性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.27","module_id":"M7","title":"人民群众与人数多数","priority":"A","correct_statement":"人民群众是推动社会历史发展的主体，不能机械等同于任何场合人数较多的一方。","incorrect_statement":"只要在某次争论中人数占多数，就自动成为真理和历史进步的决定标准。","explanation":"历史主体地位与一次投票人数、某个判断真假是不同问题。","necessary_conditions_and_boundaries":"群众的范围有历史性，劳动群众是主体部分。","example_or_counterexample":"多数人一时赞同某说法，不能替代实践检验。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.28","module_id":"M7","title":"群众创造物质精神财富","priority":"A","correct_statement":"人民群众创造物质财富、精神财富，并是社会变革的决定力量。","incorrect_statement":"精神财富只由少数名人创造，因此与群众实践和物质条件完全无关。","explanation":"个体创作有独特贡献，但其资料来源、社会经验与实现条件依赖广泛社会实践。","necessary_conditions_and_boundaries":"不能把群众创造机械理解成每件作品由所有人共同落笔。","example_or_counterexample":"作者署名与作品依托社会生活，两者可以同时成立。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.29","module_id":"M7","title":"群众与杰出个人","priority":"A","correct_statement":"承认群众创造历史，不排斥杰出个人的重要作用；个人作用受历史条件制约。","incorrect_statement":"承认群众创造历史，就必须否认任何个人对具体历史事件起过重要作用。","explanation":"整体社会实践提供基础，个人能组织、发现和选择，影响实现形式、速度和具体事件。","necessary_conditions_and_boundaries":"某些具体环节的关键甚至决定作用，不等于个人随意决定全部历史总趋势。","example_or_counterexample":"一个人的重要决策也要通过现实组织和社会条件才能实现。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"],"review_note":"考场口径：杰出人物对历史发展起重大推动作用，能加速或延缓历史进程，但只能对历史的发展起影响作用，不能决定历史发展的基本趋势；“决定作用”“决定力量”只用来说人民群众。本卡条件栏里“关键甚至决定作用”的说法不要照记。"},{"id":"M7.30","module_id":"M7","title":"历史合力与有意识活动","priority":"B","correct_statement":"历史由人的有意识活动形成，但总体结果不必完全等于任何个人的预定意图。","incorrect_statement":"每个人都有目的，所以社会历史的全部结果都能由某个人的意志任意决定。","explanation":"多种目的在既定条件中相互作用，形成超出个人预期的合力和客观结果。","necessary_conditions_and_boundaries":"客观规律通过人的活动实现，不等于历史无人参与而自动运行。","example_or_counterexample":"各方行动有目标，合成结果仍可能出乎所有单个参与者预料。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.31","module_id":"M7","title":"人的本质与社会关系","priority":"A","correct_statement":"人的本质在其现实性上是一切社会关系的总和，不能只用孤立生物属性解释人的社会性质。","incorrect_statement":"人的本质只由出生时的自然属性固定，社会关系和实践对它毫无影响。","explanation":"人的现实生活在生产、交往和制度关系中展开，社会性不能从孤立个体中完整推出。","necessary_conditions_and_boundaries":"这不否认人的自然属性，也不抹去个体差异。","example_or_counterexample":"同一个体进入不同社会关系，会承担不同角色与责任。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.32","module_id":"M7","title":"道德起源三个定位","priority":"A","correct_statement":"劳动是道德起源的首要前提，社会关系是客观条件，人的自我意识是主观条件。","incorrect_statement":"道德起源的首要前提是人的自我意识，劳动与社会关系都不需要。","explanation":"共同活动形成利益关系和调节需要，人又要能意识到自己与他人的关系，三者不能替换。","necessary_conditions_and_boundaries":"把起源问题与现代道德建设的具体规范区分。","example_or_counterexample":"仅有孤立偏好，不足以说明社会道德规范怎样形成。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.33","module_id":"M7","title":"道德与法律的历史关系","priority":"A","correct_statement":"道德与法律的产生和发展具有社会历史条件，不能说必须先有法律才可能有道德。","incorrect_statement":"没有成文法律以前，人类就不可能存在任何道德规范。","explanation":"社会关系调节可以通过习俗、评价和内心约束进行，不以成文法律先存在为必要条件。","necessary_conditions_and_boundaries":"只作一般起源辨析，不编造具体社会的年代断言。","example_or_counterexample":"共同生活可以形成互助义务和行为评价，而不必先有成文法条。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.34","module_id":"M7","title":"道德法律的区别与联系","priority":"A","correct_statement":"法律和道德都能规范行为，道德侧重教化与内心约束，法律具有国家强制保障。","incorrect_statement":"法律只与行为有关且完全没有思想引导作用，道德只管思想而从不规范行为。","explanation":"作用方式有差别但不能绝对割裂；法律也有教育导向，道德也评价实际行为。","necessary_conditions_and_boundaries":"不据此推导法律可以任意惩罚单纯思想。","example_or_counterexample":"遵守规则既可能受到制度约束，也可能出于道德认同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.35","module_id":"M7","title":"法治德治与互相替代","priority":"B","correct_statement":"法治与德治相辅相成，但道德评价不能任意替代法律规则，法律也不覆盖全部道德要求。","incorrect_statement":"凡道德上不赞同的行为，都必然已经违法，可以不经法律依据直接处罚。","explanation":"两种规范有联系又有范围和实施机制差别，不能把评价标准无条件互换。","necessary_conditions_and_boundaries":"本条是关系辨析，不提供具体案件法律判断。","example_or_counterexample":"某行为不够体贴，不会仅凭这一评价就自动构成违法。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]}],"blocks":[{"id":"P3-01","module_id":"P3","title":"政绩观首先决定为谁创造、用什么衡量政绩","priority":"A","new":false,"correct":["正确政绩观要求为人民出政绩、以实干出政绩，从实际出发、按规律办事；评价不能只看材料、排名和任内可见数字，还要看群众实际受益、长期影响与可持续性。"],"why":"指标是观察现实的工具。若把指标本身当最终目的，就可能出现数字改善而公共服务没有改善、当期增速提高而长期债务和生态代价上升。理解政绩观，就是把评价对象从“干部展示了什么”还原到“公共事务实际改善了什么”。这属于机制解释，不表示每项指标都无用。","contrasts":[{"wrong":"项目投资额大，就足以证明政绩好。","reason":"把投入规模直接当成公共效果，跳过需求、成本、质量和后续使用。","correction":"需判断是否符合实际需求、是否有效形成公共收益及长期负担。"},{"wrong":"强调群众评价，就无须法律程序和专业论证。","reason":"价值立场不能取代事实判断和合法程序；个别即时偏好也不等于整体长远利益。","correction":"把群众需要、科学决策、依法履职和实际效果结合起来。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P3-02","P3-03","GD-019"],"source_ids":["TZG","T2026Z"],"exam_eligible":true},{"id":"P3-02","module_id":"P3","title":"功成不必在我与功成必定有我","priority":"A","new":false,"correct":["“功成不必在我”侧重不计个人功名、甘做铺垫的精神境界；“功成必定有我”侧重承担当下责任的历史担当。两句共同要求接续奋斗，兼顾显功与潜功。"],"why":"公共事业的成熟周期可能长于一届任期。前一句降低“必须在我任内出成果、算我功劳”的冲动；后一句防止“反正不是我收获，就等下一任做”的推诿。它们处理的是功名归属与责任承担两个问题，因此可以同时成立。","contrasts":[{"wrong":"功成不必在我，所以见效慢的基础工作可以留给下一任。","reason":"把不计功名偷换成不承担责任。","correction":"即使最终成果不在自己任内显现，也应做好本阶段必须做的工作。"},{"wrong":"功成必定有我，就是要确保最终成果记在自己名下。","reason":"把责任参与偷换为功劳占有。","correction":"强调尽责与贡献，不要求个人包揽全部成绩。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TGONG","TZG"],"exam_eligible":true},{"id":"P3-03","module_id":"P3","title":"显绩、潜绩与一张蓝图绘到底","priority":"A","new":false,"correct":["既做群众当前看得见、得实惠的工作，也做打基础、利长远的工作；政策接续以规划科学、符合实际和群众需要为前提，不能把接续实施解释为永不纠错。"],"why":"显绩和潜绩是成果呈现方式与时间不同，不是好坏等级。基础设施维护、人才培养、风险治理可能暂时不醒目，却支撑长期表现；当前急难愁盼也不能因追求“长远”而被搁置。接续的价值在减少任意翻烧饼，不在保护已经证明错误的方案。","contrasts":[{"wrong":"潜绩比显绩高级，应该少做当下能见效的民生工作。","reason":"把互补关系变成价值排斥。","correction":"把现实需要与长远基础统筹起来。"},{"wrong":"一张蓝图绘到底，意味着发现规划不合实际也不能修改。","reason":"遗漏科学规划和依法调整的条件。","correction":"保持合理战略连续性，同时依法依事实纠偏。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TZG","TGONG"],"exam_eligible":true},{"id":"P3-04","module_id":"P3","title":"2026正确政绩观学习教育：总要求、抓手、检验尺度","priority":"A","new":false,"correct":["2026年学习教育的总要求是立党为公、为民造福、科学决策、真抓实干；抓手是一体推进学查改；要求创造经得起实践、人民、历史检验的实绩。范围是全党，以县处级以上领导班子和领导干部特别是“一把手”为重点。"],"why":"四项总要求依次指向立场、受益对象、决策方式和执行；“学查改”是落实方式；三项检验回答如何判断实际成效。分清层次，比把几个短语混背成一个列表稳定。重点对象不等于只覆盖这些人。","contrasts":[{"wrong":"学查改就是这次学习教育的四项总要求。","reason":"把工作抓手与总体要求错配。","correction":"总要求是四项，学查改是一体推进的抓手。"},{"wrong":"重点是县处级以上，所以其他党员不在学习教育范围内。","reason":"把重点范围误作唯一范围。","correction":"全党开展，重点抓领导班子和领导干部。"}],"question_design":"题干明确为2026年该通知；用层次、对象或行为情境设计题，不必考启动结束的具体日期。","related_ids":[],"source_ids":["T2026Z","E-PT-04"],"exam_eligible":true,"review_note":"核验补充：中办通知安排“春节假期后启动、7月底基本结束”，“不分批次、不划阶段”；8月24日中央党的建设工作领导小组总结会议确认学习教育“目前已基本结束”，习近平重要指示要求“坚持常态化查改问题”；截至2026-11-27集中学习教育已基本结束，但查改问题转入常态，不能说政绩观教育工作随之结束（E-PT-04）。"},{"id":"P3-05","module_id":"P3","title":"历史周期率的两个答案：监督与自我革命","priority":"A","new":false,"correct":["人民监督与自我革命是相互贯通的两方面。自我革命强调党依靠自身力量发现和解决自身问题，并不排斥人民监督；以自我革命引领社会革命，也不等于二者对象相同。"],"why":"人民监督使权力运行受到群众和社会的监督，自我革命强调党主动发现解决自身问题。只有指出问题而缺乏纠正能力，问题难以解决；仅靠自我评价又可能形成信息盲区。这是信息与纠错机制的教学解释，不能理解为人民都是党外主体。","contrasts":[{"wrong":"既然找到了自我革命，就可以替代人民监督。","reason":"把第二个答案当成对第一个答案的废除。","correction":"坚持二者贯通。"},{"wrong":"自我革命就是发动社会成员改变所有社会关系。","reason":"把党的自我建设与社会发展变革的对象混为一谈。","correction":"区分自我革命与社会革命，同时理解相互联系。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TPL5"],"exam_eligible":true},{"id":"P3-06","module_id":"P3","title":"不敢腐、不能腐、不想腐为何要一体推进","priority":"A","new":false,"correct":["不敢腐侧重惩治震慑，不能腐侧重制度约束，不想腐侧重思想自觉；三者一体推进、相互促进，不能当作完成一项后再依次转入下一项的流水线。"],"why":"只有处罚而制度漏洞不补，诱因仍在；只有制度文本而执行无力，约束可能落空；只有思想教育而无监督和追责，也不能替代治理。一个措施可能同时发挥多种作用，问“主要体现”时才比较其最直接机制。","contrasts":[{"wrong":"堵住审批漏洞主要对应不想腐。","reason":"把制度上限制机会与思想上改变意愿混淆。","correction":"首先对应不能腐，也可与其他机制协同。"},{"wrong":"三不腐要求先完成不敢腐，再开始不能腐。","reason":"把协同推进改成排他的时间阶段。","correction":"惩治、制度、教育贯通推进。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TPL5"],"exam_eligible":true},{"id":"P3-07","module_id":"P3","title":"政治建设统领、党章根本与民主集中制","priority":"A","new":false,"correct":["党的政治建设具有统领地位；党章是党的根本大法、全党必须遵循的总规矩；民主集中制是党的根本组织原则和领导制度。2026年二十届五中全会决定强调增强党性是全面从严治党的根本性任务。各概念的固定角色不能互换。"],"why":"这里是辨认不同制度概念的角色：方向和政治要求、根本规范、组织决策规则。党章的“根本大法”地位限于党内规范体系，不是把它置于国家宪法之上；党必须在宪法和法律的范围内活动。选项常在正面名词之间交换固定关系。","contrasts":[{"wrong":"党的纪律建设是统领党的各方面建设的建设。","reason":"把重要工作换到政治建设的特定位置。","correction":"以党的政治建设为统领。"},{"wrong":"民主集中制意味着一把手听取意见后可不受集体决策规则约束。","reason":"集中是依规则形成组织意志，并非个人凌驾组织。","correction":"坚持集体领导、民主集中、个别酝酿、会议决定等规则。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P4-11","LAW-003"],"source_ids":["TPARTY","TPL5","TPL5DEC","E-PT-05"],"exam_eligible":true,"review_note":"核验补充：“增强党性是全面从严治党的根本性任务”见五中全会公报（2026年10月29日）；同次全会《决定》（10月29日通过、11月1日全文公开）第二部分第（二）项另写“把学习、领悟、运用党的创新理论作为加强党性修养的根本途径”；同组材料里“根本”不止一处，设问须给定问的是任务、途径还是统领（E-PT-05）。"},{"id":"P3-08","module_id":"P3","title":"严管与担当：防失控也防不作为","priority":"B","new":false,"correct":["从严管理监督与激励担当作为应相结合；责任追究要依据事实、性质、情节和规则，不可把工作探索中的一切失误都等同违纪违法，也不能借改革名义突破明确纪律法律底线。"],"why":"组织既需要压缩谋私与失控空间，也需要让干部愿意解决问题。若只按“没有任何风险”奖励，就可能激励不作为；若一概免责，又失去责任约束。解释这种张力有助于理解政策，但不能从中猜测某个人真实动机。","contrasts":[{"wrong":"鼓励担当意味着改革中的行为都应免责。","reason":"遗漏依法依规、事实性质等条件。","correction":"区分合理探索与违纪违法，按具体规则判断。"},{"wrong":"严格监督就是只要发生错误便同等处理。","reason":"抹掉责任、主观状态、行为性质等差别。","correction":"准确识别问题，依规依纪依法处理。"}],"question_design":"以一般原则辨析为主；不虚构容错免责的具体法律条件，不据此判定真实案件。","related_ids":[],"source_ids":["T20","TPL5"],"exam_eligible":true},{"id":"P1-01","module_id":"P1","title":"六个必须坚持：六个观察方向，不是排他标签","priority":"A","new":false,"correct":["六个必须坚持是人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下，体现新时代中国特色社会主义思想的立场观点方法。它们可以共同适用于一件事，不能与某一条哲学原理机械一一对应。"],"why":"先问材料突出什么：为谁及依靠谁，偏人民至上；自主探索，偏自信自立；原则与创新，偏守正创新；真实难题，偏问题导向；关联统筹，偏系统观念；人类共同问题，偏胸怀天下。“最体现”是在比较题干重点，不是在否认其他原则可能也成立。","contrasts":[{"wrong":"一个案例只能体现六项中的一项。","reason":"把分类教学误作现实中互相排斥。","correction":"看设问是逐项判断还是比较最直接对应。"},{"wrong":"看见人民二字就必选人民至上。","reason":"只认关键词，忽略材料论证的中心。","correction":"根据行为目的和所处理的主要关系判断。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T6","T20"],"exam_eligible":true},{"id":"P1-02","module_id":"P1","title":"人民至上：受益者与实践主体不能割裂","priority":"A","new":false,"correct":["人民至上不仅意味着成果为了人民，也包含尊重人民主体地位和创造精神、从人民实践中获得认识与力量；以人民为中心贯穿发展目的与发展过程。"],"why":"把群众只当被动接受福利的人，会漏掉群众提供经验、反映问题、参与治理的作用；把参与看成所有专业判断都由即时投票替代，同样越界。这里需要区分价值归属、信息来源、参与机制和法定决策程序。","contrasts":[{"wrong":"人民至上只要求最后把成果分给群众。","reason":"遗漏发展依靠人民及尊重群众创造。","correction":"贯通为了人民、依靠人民、成果由人民共享。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TDEV"],"exam_eligible":true},{"id":"P1-03","module_id":"P1","title":"自信自立与胸怀天下如何同时成立","priority":"A","new":false,"correct":["自信自立要求立足国情、独立自主探索自己的道路，不等于封闭排外；胸怀天下要求关注共同问题、推动共同发展，不等于放弃本国立场和合法利益。"],"why":"自主回答自己的问题，与吸收外部经验不是矛盾。判断的关键是有没有结合自身条件作选择，而不是经验最初来自哪里。国际合作也不是无条件接受外部安排，而是在互利合作与独立判断之间建立关系。","contrasts":[{"wrong":"采用外国成熟技术就违反自信自立。","reason":"把独立自主误解为技术和知识必须完全自生。","correction":"可以学习合作，同时掌握自主选择与创新能力。"},{"wrong":"胸怀天下要求国内发展无条件服从外部要求。","reason":"把共同发展偷换成放弃自主性。","correction":"立足中国、放眼世界，推动互利与共同进步。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20"],"exam_eligible":true},{"id":"P1-04","module_id":"P1","title":"守正创新：守住根本，不冻结具体做法","priority":"A","new":false,"correct":["守正是坚持必须坚持的根本方向、原则与立场，是创新的前提和基础；创新是适应新的实际推进理论和实践发展。不能把“正”理解为所有过去做法，也不能把“新”当作天然正确。"],"why":"若把原则与手段混在一起，任何改进都会被误判为变质；若只看新鲜程度，错误方向也可能披上创新外衣。理解这组关系，需要先识别材料中什么是目标或底线，什么是可调整的实现方式。","contrasts":[{"wrong":"创新是守正的前提，守正只是创新后的结果。","reason":"倒置守住根本方向与推进创新的关系。","correction":"在守正基础上创新，通过创新更好发展。"},{"wrong":"保持过去的全部制度细节才叫守正。","reason":"把根本原则扩大为每项具体安排。","correction":"原则稳定不排斥制度机制和方法改进。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TSHOU"],"exam_eligible":true},{"id":"P1-05","module_id":"P1","title":"问题导向与系统观念的差别","priority":"A","new":false,"correct":["问题导向突出从真实矛盾和实际困难提出任务、寻找解决办法；系统观念突出把对象置于联系中，统筹整体局部、当前长远、宏观微观等关系。二者能够同时运用。"],"why":"一个回答“为什么选这个问题、要解决什么”，另一个回答“解决时会影响哪些方面、怎样协同”。如果某政策只解决眼前指标却把成本转移给邻地或下一任，主要暴露统筹不足，不是因为它没有提出任何问题。","contrasts":[{"wrong":"只要提出一个具体问题，就充分体现了系统观念。","reason":"具体不等于系统，题干还需体现关联与统筹。","correction":"检查是否兼顾影响链条和相关主体。"},{"wrong":"坚持问题导向，就只处理已经出事的地方。","reason":"把问题识别缩窄为事后补救。","correction":"也可前瞻识别潜在问题，未雨绸缪。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","T6"],"exam_eligible":true},{"id":"P1-06","module_id":"P1","title":"两个确立、两个维护、两个结合","priority":"A","new":false,"correct":["两个确立：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。两个维护：维护习近平总书记党中央的核心、全党的核心地位，维护党中央权威和集中统一领导。两个结合：马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。"],"why":"三个“两”回答不同问题：确立谈核心与指导思想；维护谈政治要求与行动上的维护对象；结合谈理论发展路径。第一个确立与第一个维护有对应，但第二个不能机械复制。","contrasts":[{"wrong":"两个维护的第二项是维护新时代思想的指导地位。","reason":"把第二个确立的对象移给第二个维护。","correction":"第二个维护是党中央权威和集中统一领导。"},{"wrong":"第二个结合是把传统文化整体与现代制度直接合并。","reason":"遗漏马克思主义基本原理这一主语以及优秀传统文化的限定。","correction":"是基本原理同中华优秀传统文化相结合。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P1-11","P3-07"],"source_ids":["TPARTY","T20","TCULT"],"exam_eligible":true},{"id":"P1-07","module_id":"P1","title":"四个意识、四个自信与四个全面不是同一类清单","priority":"A","new":false,"correct":["四个意识是政治意识、大局意识、核心意识、看齐意识；四个自信是道路自信、理论自信、制度自信、文化自信。四个全面属于战略布局：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"],"why":"意识强调政治自觉，自信指向道路理论制度文化，全面部署需要推进的战略任务。当前四个全面的第一项已是“全面建设社会主义现代化国家”；历史题提到全面建成小康社会时应服从当时语境。","contrasts":[{"wrong":"2026年四个全面的第一项仍是全面建成小康社会。","reason":"把此前阶段表述当作当前表述。","correction":"当前为全面建设社会主义现代化国家。"},{"wrong":"创新自信是四个自信之一。","reason":"用相关正面词替换固定名称。","correction":"四项为道路、理论、制度、文化。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TPARTY","T20"],"exam_eligible":true},{"id":"P1-08","module_id":"P1","title":"五位一体总体布局与四个全面战略布局","priority":"A","new":false,"correct":["五位一体涵盖经济建设、政治建设、文化建设、社会建设、生态文明建设；四个全面是战略布局。前者强调事业发展的五个方面整体推进，后者强调战略任务与保障的协调部署。"],"why":"教学上可将前者理解为“要建设哪些方面”，后者理解为“当前如何组织关键战略任务”；这只是帮助记忆，不是可替代正式定义的法定分类。文化建设、生态文明建设各有位置，不能因为相互影响就合并成同一个领域。","contrasts":[{"wrong":"生态文明建设属于四个全面中的一项。","reason":"把总体布局的一方面移入战略布局。","correction":"生态文明建设属于五位一体。"},{"wrong":"文化对生态有影响，所以生态文明建设就是文化建设的下位项目。","reason":"把相互联系等同于分类包含。","correction":"二者同属五位一体的不同方面，并可协同。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P1-13","P2-15"],"source_ids":["T20","TPARTY"],"exam_eligible":true},{"id":"P1-09","module_id":"P1","title":"十个明确、十四个坚持、十三个方面成就、六个必须坚持","priority":"B","new":false,"correct":["十个明确、十四个坚持、十三个方面成就概括这一思想的主要内容；六个必须坚持体现贯穿其中的立场观点方法。辅助理解：明确偏核心理论命题，坚持偏基本方略，成就偏实践展开与成果，六项偏世界观方法论。"],"why":"这四组不是四套互相竞争的理论，也不必在当前备考阶段把每组全部条目另背一遍。最有价值的是在题干给出“方法论”“基本方略”等定位时不张冠李戴；辅助概括不能被扩大为彼此完全没有内容交叉。","contrasts":[{"wrong":"六个必须坚持就是新时代坚持和发展中国特色社会主义的十四项基本方略。","reason":"把两套数量、层次和功能都不同的概括合并。","correction":"六项侧重立场观点方法，十四个坚持是基本方略。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20"],"exam_eligible":true},{"id":"P1-10","module_id":"P1","title":"中国式现代化的五个中国特色及其边界","priority":"A","new":false,"correct":["五个中国特色：人口规模巨大；全体人民共同富裕；物质文明和精神文明相协调；人与自然和谐共生；走和平发展道路。中国式现代化是中国共产党领导的社会主义现代化，既具有各国现代化共同特征，也具有基于国情的中国特色。"],"why":"人口规模改变资源和治理问题的量级；共同富裕限定发展成果的对象；两个文明限定现代化不能只看物质财富；人与自然限定发展方式；和平发展限定国际路径。五个特征与报告所列“本质要求”不是同一张清单，不能因某词正确就判断它属于题目所问列表。","contrasts":[{"wrong":"全体人民共同富裕要求所有人在同一时间达到同一收入水平。","reason":"把共同目标改成同步、均等的收入结果。","correction":"允许合理差别，循序推进共同富裕，反对两极分化。"},{"wrong":"中国式现代化没有各国现代化的共同特征。","reason":"把中国特色解释成完全脱离现代化一般规律。","correction":"共同特征与中国特色相统一。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P4-13","H27"],"source_ids":["T20"],"exam_eligible":true},{"id":"P1-11","module_id":"P1","title":"两个结合与传统文化的创造性转化、创新性发展","priority":"A","new":false,"correct":["第二个结合强调马克思主义基本原理同中华优秀传统文化相结合；不是将二者简单拼接。文化传承应推进创造性转化、创新性发展，坚持古为今用，不能把历史上存在过的全部习俗制度都当作必须复原的对象。"],"why":"传统提供可理解的价值资源、表达方式与共同记忆；当代问题又要求筛选、解释和创造。以民本思想帮助理解重视民生，不等于古代民本与现代人民当家作主是同一种制度。相通可以成为结合条件，但不能抹掉历史差别。","contrasts":[{"wrong":"只要是传统文化，就应原样恢复。","reason":"遗漏“优秀”与面向当代的转化发展。","correction":"有鉴别地传承，并结合现实创造。"},{"wrong":"传统民本思想已经等同于现代人民民主制度。","reason":"把价值上的相关性当成制度同一。","correction":"可讨论文化联系，但须区分制度、主体和历史条件。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TCULT","T20"],"exam_eligible":true},{"id":"P1-12","module_id":"P1","title":"中华文明五个突出特性：从叙述识别侧重点","priority":"B","new":false,"correct":["五个突出特性是连续性、创新性、统一性、包容性、和平性。连续性不等于没有变化，创新性不等于否定历史；统一性与包容性可以共同成立，包容性也不等于取消自身文化主体。"],"why":"比较相邻材料：强调文明赓续，偏连续；强调革故鼎新，偏创新；强调共同体凝聚与国家统一，偏统一；强调兼收并蓄与交流互鉴，偏包容；强调和睦相处与反对霸权，偏和平。材料可以兼有多个角度，出题要给足最直接的辨别线索。","contrasts":[{"wrong":"中华文明连续性意味着基本内容从未发生变化。","reason":"把传承理解为静止不变。","correction":"连续性是在历史变迁和创新中实现的。"},{"wrong":"强调包容意味着不同文明必须最终变成同一种文化。","reason":"把交流互鉴误作消灭差异。","correction":"尊重差异，吸收有益成果。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TCULT"],"exam_eligible":true},{"id":"P1-13","module_id":"P1","title":"文化主体性与文化建设的现实作用","priority":"C","new":false,"correct":["文化建设涉及价值认同、精神生活、社会凝聚、文化传承和文明交流，不仅指文旅产业或文物保护。2023年文化传承发展座谈会是重要节点，不能据此认定此前没有文化建设；生态文明也并非文化建设的同义词。"],"why":"从治理机制理解，共同的语言和历史记忆能帮助人们理解制度与公共目标，公共文化服务满足精神需求，文化创新和交流提升表达能力。可以据此分析文化为何在政策中反复出现；但“唯一真实原因是转移经济压力”等隐秘动机断言没有由这些事实推出。","contrasts":[{"wrong":"文化传承议题在2023年受到强调，说明国家文化建设始于2023年。","reason":"把一个重要会议节点误作全部事业的起点。","correction":"区分长期建设与阶段性部署。"},{"wrong":"文化能服务发展，所以它的价值最终只是提高GDP。","reason":"将经济效益扩大为唯一目的，遗漏精神生活与公共价值。","correction":"兼顾社会效益、公共文化需求及合理经济效益。"}],"question_design":"作为理解材料保留。只能将其中有来源的事实改编为客观题；对文化政策真实动机的讨论采用开放解释，不设唯一答案。","related_ids":[],"source_ids":["TCULT","T20"],"exam_eligible":false},{"id":"P2-01","module_id":"P2","title":"新发展阶段、理念、格局、高质量发展各回答什么","priority":"A","new":false,"correct":["新发展阶段指全面建设社会主义现代化国家、向第二个百年奋斗目标进军的阶段；新发展理念提供创新、协调、绿色、开放、共享的指导原则；新发展格局指国内大循环为主体、国内国际双循环相互促进；高质量发展是全面建设社会主义现代化国家的首要任务。"],"why":"它们分别偏向历史方位、指导原则、循环结构和发展质量要求，不能只看都有“发展”便互换。新发展阶段仍处于社会主义初级阶段，不意味着进入发达阶段或改变了基本国情。","contrasts":[{"wrong":"我国进入新发展阶段，已经不再处于社会主义初级阶段。","reason":"把初级阶段内部的新阶段误作跨越初级阶段。","correction":"新发展阶段是初级阶段中的一个阶段。"},{"wrong":"构建新发展理念，就是以国内大循环为主体。","reason":"将理念与格局的名称偷换。","correction":"双循环对应新发展格局。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TDEV"],"exam_eligible":true},{"id":"P2-02","module_id":"P2","title":"五大发展理念与五类重点问题","priority":"A","new":false,"correct":["创新注重发展动力，协调注重发展不平衡，绿色注重人与自然和谐共生，开放注重发展内外联动，共享注重社会公平正义。五者相互联系，要完整、准确、全面贯彻。"],"why":"协调常问地区、城乡、产业等关系能否相互促进；共享常问发展成果怎样更公平地惠及群众。同一公共服务政策既可能缩小区域差距，又可能促进公平，必须根据题干所强调的矛盾判断，不能仅凭扶贫、乡村等词自动选择。","contrasts":[{"wrong":"提高居民分享发展成果的公平性，主要回答开放发展问题。","reason":"把成果分配与内外联动错配。","correction":"主要对应共享。"},{"wrong":"创新发展只等于实验室技术发明。","reason":"将发展动力的创新缩窄为单一科技环节。","correction":"科技、制度、管理等创新均可影响发展动力，具体看材料。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TDEV","T20"],"exam_eligible":true},{"id":"P2-03","module_id":"P2","title":"国内大循环为主体，不是关门搞循环","priority":"A","new":false,"correct":["新发展格局以国内大循环为主体，国内国际双循环相互促进；强调国内市场、供需衔接和自主发展能力，同时坚持高水平对外开放。它是全国层面的循环，不能分割成各地区自给自足的小循环。"],"why":"增强国内循环的意义在提高经济运行的内生支撑和韧性，而国际市场、技术合作与要素流动仍有价值。地方保护会割裂更大的国内市场，恰好妨碍国内大循环。","contrasts":[{"wrong":"以国内大循环为主体，要求尽可能减少正常国际经贸往来。","reason":"把主体与封闭混淆。","correction":"国内国际循环相互促进。"},{"wrong":"各省都建设不依赖外省的产业体系，最有利于国内大循环。","reason":"把全国统一市场分割为地方小循环。","correction":"在统一规则下发挥地区比较优势和分工协作。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","TMARKET"],"exam_eligible":true},{"id":"P2-04","module_id":"P2","title":"高质量发展：质量与合理数量、实体与数字","priority":"A","new":false,"correct":["高质量发展要求质的有效提升和量的合理增长，把发展经济的着力点放在实体经济上。数字经济可以赋能实体经济，不能把“实体经济”直接替换为“数字经济”，也不能把实体经济仅等同于有形产品制造。"],"why":"只增加资源投入而产出质量和效率不改善，不能充分体现高质量；但完全没有合理增长，也可能无法增加就业、改善民生。工业软件、研发设计、物流等服务可直接支撑生产，虚实不能按“能不能摸到”机械划分。","contrasts":[{"wrong":"质量比速度重要，所以经济增长数量不再具有意义。","reason":"把质量优先推成排斥数量。","correction":"追求有效质量提升与合理数量增长。"},{"wrong":"把发展经济的着力点放在数字经济上，是正式固定表述。","reason":"把实体经济的政策定位换给其中相关领域。","correction":"固定表述是实体经济，数字化是重要赋能方向。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["T20","T15"],"exam_eligible":true},{"id":"P2-05","module_id":"P2","title":"新质生产力：核心标志不是行业名字新","priority":"A","new":false,"correct":["新质生产力是创新起主导作用、具有高科技高效能高质量特征的先进生产力质态；以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先进生产力。"],"why":"关键看生产能力与效率发生什么变化，而非企业名称里是否有AI、低空、量子。技术突破、要素创新配置、产业深度转型都可能促成这种跃升；单纯扩大设备数量或贴新概念标签并不足够。","contrasts":[{"wrong":"新质生产力的核心标志是新兴产业数量大幅增加。","reason":"把产业数量与全要素生产率混淆。","correction":"核心标志是全要素生产率大幅提升。"},{"wrong":"只有互联网和人工智能企业才有可能形成新质生产力。","reason":"把生产力质态限定为几种行业。","correction":"传统产业改造、新兴和未来产业发展都可成为载体。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TNEWQ","TNEW26","E-DB-01"],"exam_eligible":true,"review_note":"核验补充：中共中央、国务院《关于发展新质生产力的意见》由新华社2026年10月9日受权发布（底稿来源页所标10月14日是转载日），总体要求同样以“全要素生产率大幅提升为核心标志”说明新质生产力；该文第（八）项的产业列举是另一回事，不与核心标志混用（E-DB-01）。"},{"id":"P2-06","module_id":"P2","title":"因地制宜发展新质生产力与传统产业升级","priority":"A","new":false,"correct":["发展新质生产力要因地制宜，兼顾传统产业改造、新兴产业壮大、未来产业培育，遵循先立后破；不能把传统产业一概视为落后产能，也不要求各地同建一套热门产业。"],"why":"地区的技术基础、人才、市场和资源条件不同，盲目复制可能形成重复建设。传统行业经过数智化、绿色化改造，能够提高效率和产品质量；“传统”标示产业发展历史，并不自动判定每家企业的技术水平。","contrasts":[{"wrong":"推动新质生产力，需要先关闭本地所有传统产业。","reason":"将产业更新等同于整体淘汰，并颠倒先立后破。","correction":"在改造提升与培育新动能中平稳转型。"},{"wrong":"因地制宜意味着地方可不顾统一市场规则自行设置进入壁垒。","reason":"把发展特色扩大成破坏市场统一的权限。","correction":"依靠禀赋和能力形成优势，遵守统一基本规则。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TNEW26","TMARKET"],"exam_eligible":true},{"id":"P2-07","module_id":"P2","title":"科技创新、产业创新、中试与企业主体地位","priority":"A","new":false,"correct":["科技创新与产业创新应深度融合；中试是把试制阶段的新产品转向生产过程的过渡性试验，是成果产业化的重要环节。强化企业科技创新主体地位，不等于所有科研都只能由企业承担。"],"why":"实验室证明能做出来，尚未证明能够稳定、低成本、规模化地做出来。中试帮助暴露工艺、设备、质量和成本问题；完成中试仍不保证市场需求和商业成功。高校、科研院所、国家实验室与企业的功能可互补。","contrasts":[{"wrong":"样品成功就说明已经完成产业化，中试只是扩大营销。","reason":"把技术可行、工程可行和商业可行混成一个阶段。","correction":"中试主要验证走向生产的技术工艺等条件。"},{"wrong":"企业是创新主体，所以高校不应再承担基础研究。","reason":"把主体地位理解成排他垄断。","correction":"各类创新主体按功能分工协同。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["GD-001","GD-002"],"source_ids":["TMID","TNEW26"],"exam_eligible":true},{"id":"P2-08","module_id":"P2","title":"教科人才：稳定关系与不同文件口径","priority":"B","new":false,"correct":["稳定记忆：科技是第一生产力，人才是第一资源，创新是第一动力；教育、科技、人才是基础性、战略性支撑。《辅导百问》第44问写教育是基础、科技是关键、人才是根本；教育部另有权威文章写科技是关键、人才是基础、教育是根本。两种措辞均有依据，脱离指定文本不设唯一对错。"],"why":"前期资料校勘曾把第二组不同说法笼统视为讲义颠倒，这一判断在本次复核中撤回。有关基础、根本的表达会依论述角度变化，不能只因与一份材料不同便宣布普遍错误，也不应虚构新口径全面取代旧口径。训练优先掌握三个“第一”和教科人才协同；名称记“科教兴国战略”。","contrasts":[{"wrong":"不必限定文件，就能认定所有“教育是根本、人才是基础”的表述都错。","reason":"忽略权威材料中实际存在的不同表述。","correction":"先限定引用文件；未限定时改考稳定关系和机制，不制造歧义题。"},{"wrong":"科技是第一资源，人才是第一动力。","reason":"将科技、人才、创新的角色轮换。","correction":"科技第一生产力、人才第一资源、创新第一动力。"}],"question_design":"优先考稳定关系；禁止将教育基础/根本与人才基础/根本做成不限定来源的固定真假题。","related_ids":["GD-004"],"source_ids":["TEDU","TEDU25","T20"],"exam_eligible":true},{"id":"P2-09","module_id":"P2","title":"市场决定性作用与更好发挥政府作用","priority":"A","new":false,"correct":["市场在资源配置中起决定性作用，更好发挥政府作用；有效市场和有为政府相结合。政府通过制度规则、公共服务、监管、宏观调控等履职，不是代替所有经营主体作微观经营决策。"],"why":"市场能利用分散信息形成价格和竞争激励，但公共产品、外部性和公平竞争需要制度保障。政府的作用不是按“干预越多越好”衡量，也不是完全退出；应判断措施是否补足公共职能、是否扭曲公平竞争。","contrasts":[{"wrong":"因为政府负责公共目标，所以政府应在一般资源配置中起决定性作用。","reason":"把政府必要作用与市场决定性作用倒置。","correction":"市场决定性作用与政府更好履职结合。"},{"wrong":"凡是补贴和政府投资都违反市场经济原则。","reason":"把是否有政府参与当成唯一标准。","correction":"判断法定依据、公共目的、竞争影响及具体制度条件。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["LAW-019","GD-012"],"source_ids":["T20","T15","TMARKET"],"exam_eligible":true},{"id":"P2-10","module_id":"P2","title":"全国统一大市场统一什么","priority":"B","new":false,"correct":["统一大市场重点在统一市场基础制度规则、促进要素商品服务畅通流动和公平竞争，破除地方保护与市场分割；不要求所有地方产业结构、商品价格和发展路径相同。"],"why":"规则统一使不同地区能够在更大范围分工竞争，差异化的产业优势反而可以更好发挥。统一不是抹平差别，而是避免地区用身份、注册地、隐性资质门槛等把竞争者排除。","contrasts":[{"wrong":"各省同一种商品必须执行同一市场价格，才算统一市场。","reason":"将统一规则与统一具体交易价格混淆。","correction":"在公平透明规则下依法形成价格。"},{"wrong":"为发展本地经济，在政府采购中优先限定本地注册企业有利于统一市场。","reason":"用地方身份壁垒排斥公平竞争。","correction":"依法制定与采购需求相关的条件，不违法排外。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["LAW-019","GD-013"],"source_ids":["TMARKET"],"exam_eligible":true},{"id":"P2-11","module_id":"P2","title":"耐心资本与投资于人","priority":"B","new":false,"correct":["耐心资本强调与较长创新和成长周期相匹配的长期稳定资金支持，不等于不考虑回报、风险或退出，也不限于财政资金。投资于人重视人的能力、健康、发展与公共服务，可以与投资于物相结合。"],"why":"前者解决资金期限与创新周期不匹配，后者提醒发展最终落到人的需要和能力。建学校有物的投入，也应关注师资和学习质量；不能把所有以人为目的的政策支出都直接归入统计上的固定资产投资。","contrasts":[{"wrong":"耐心资本意味着投资之后永远不能退出。","reason":"把长期支持误成永久锁定。","correction":"按项目周期和约定合理安排退出。"},{"wrong":"评价投资于人只需看新增GDP，不必考虑人的福祉和全面发展。","reason":"将经济产出变成唯一目的，排除以人民为中心的目的价值。","correction":"人的福祉和能力本身具有目标价值，也能支持长期发展。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TPAT","T15","TPEOPLEINV"],"exam_eligible":true},{"id":"P2-12","module_id":"P2","title":"十五五指导思想中各概念的固定角色","priority":"A","new":false,"correct":["在十五五纲要的指导思想语境中，以经济建设为中心，以推动高质量发展为主题，以改革创新为根本动力，以满足人民日益增长的美好生活需要为根本目的，以全面从严治党为根本保障。"],"why":"这些都重要，但中心、主题、动力、目的、保障不是同义词。可以用任务组织、发展要求、改变的来源、最终受益目标、组织保障五个问题分别记忆，防止正面词互换后仍凭语感接受。","contrasts":[{"wrong":"十五五发展的根本目的是改革创新。","reason":"把动力换到目的位置。","correction":"根本目的是满足人民日益增长的美好生活需要。"},{"wrong":"十五五的中心是全面从严治党，主题是经济建设。","reason":"把中心、主题、保障错配。","correction":"中心经济建设、主题高质量发展、根本保障全面从严治党。"}],"question_design":"题干必须限定“十五五纲要指导思想”，不要外推为所有文件都只能使用相同关系词。","related_ids":[],"source_ids":["T15"],"exam_eligible":true},{"id":"P2-13","module_id":"P2","title":"碳达峰、碳中和与碳排放强度不是同一个指标","priority":"B","new":false,"correct":["碳达峰关注二氧化碳排放总量达到峰值后逐步下降的过程；碳中和关注人为排放与清除、吸收之间的平衡，不是社会活动从此完全没有排放。碳排放强度通常指单位GDP的二氧化碳排放。"],"why":"强度是比值，总量还受经济规模影响。教学算例：GDP增长10%，碳排放强度下降5%，排放总量按1.10×0.95变为原来的1.045倍，即增加4.5%。强度下降不能单独证明总量下降，更不能据此直接宣布已经碳中和。","contrasts":[{"wrong":"单位GDP碳排放降低，就说明碳排放总量必然减少。","reason":"遗漏GDP规模变化。","correction":"需同时计算经济规模与强度。"},{"wrong":"实现碳中和要求经济活动中完全不产生任何碳排放。","reason":"把净平衡误作没有排放。","correction":"需统筹减排、碳汇等实现净排放平衡。"}],"question_design":"概念辨析或简单比值计算；算例为自编，不是历史统计数据，不引入复杂碳核算。","related_ids":["P2-14","LAW-009"],"source_ids":["GCARBDEF","GCARBON"],"exam_eligible":true},{"id":"P2-14","module_id":"P2","title":"碳双控分阶段、先立后破与安全约束","priority":"B","new":false,"correct":["十五五时期碳排放双控以强度控制为主、总量控制为辅；碳达峰后以总量控制为主、强度控制为辅。积极稳妥推进双碳，要统筹能源安全、经济发展和群众正常生活，避免运动式减碳和不分条件一刀切。"],"why":"尚需发展的阶段先提高每单位产出的碳效率并控制总量增长；达峰后更强调总量下降。能源替代能力、产业技术和电网调节需要配套，不能把先立后破理解为永不退出落后产能，也不能先关停全部可靠供给再等待替代。","contrasts":[{"wrong":"十五五碳双控与达峰后的主次安排完全相同，都是总量为主。","reason":"抹去阶段差异。","correction":"十五五强度为主，达峰后总量为主。"},{"wrong":"先立后破意味着传统能源和高碳设备没有退出要求。","reason":"把有序替代误作保留一切现状。","correction":"依法有序退出不合要求的产能，同时保障替代和供给。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["GCARBON","GPEAK26"],"exam_eligible":true},{"id":"P2-15","module_id":"P2","title":"治水四水四定与十六字思路","priority":"B","new":false,"correct":["治水思路为节水优先、空间均衡、系统治理、两手发力；四水四定为以水定城、以水定地、以水定人、以水定产，强调以水资源承载能力约束布局和规模。两手发力指政府和市场作用共同发挥。"],"why":"资源约束要求先看能承受多少需求，再优化人口、产业与空间安排；不等于完全不能调水，也不等于只修工程就能突破一切约束。上下游、左右岸、干支流有联系，因此流域治理不能各管一小段而把问题转移出去。","contrasts":[{"wrong":"四水四定是先按城市人口和产业计划确定需要，再不限量找水满足。","reason":"把承载力约束改成需求无限刚性。","correction":"在资源条件下安排发展规模，并节约集约利用。"},{"wrong":"两手发力只指同时治理地表水和地下水。","reason":"将治理机制中的政府市场关系换成水体分类。","correction":"是发挥政府与市场的作用。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["LAW-011"],"source_ids":["GWATER","GWATER2"],"exam_eligible":true},{"id":"P2-16","module_id":"P2","title":"产业名单是文件语境中的分类：保留已讲锚点","priority":"B","new":false,"correct":["按2025年国家十五五建议所列：船舶、纺织、机械等见于传统产业优化提升；新能源、新材料、航空航天、低空经济等见于新兴产业；量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等见于未来产业。此表只用于该文件，不代替别的文件分类。"],"why":"传统不等于落后，新兴不等于已经具有高效率，未来不等于现在完全没有产品。对于跨文件有差异的项目，最关键的不是强背一个永恒标签，而是回到题干明确援引的文本。广东报告对生物制造的列法另见GD-004。","contrasts":[{"wrong":"按2025年国家十五五建议，船舶属于所列新兴支柱产业。","reason":"该文本将船舶列于传统产业优化提升。","correction":"在指定文件语境中按原文归属判断。"},{"wrong":"某产业在文件中属于传统产业，因此其中企业不会产生新质生产力。","reason":"将政策分类扩大为企业技术和效率结论。","correction":"传统产业可通过深度转型形成先进生产力。"}],"question_design":"题干明确年份及国家建议；禁止脱离文件让生物制造等跨文本项目成为唯一标准分类。","related_ids":["GD-004"],"source_ids":["G15SUG","TNEW26","E-DB-01"],"exam_eligible":true,"review_note":"核验补充：本表只对2025年国家《建议》成立；2026年国家纲要第五章第二节、中央2026年10月《关于发展新质生产力的意见》第（八）项同样把生物制造列在未来产业，但《广东省国民经济和社会发展第十五个五年规划纲要》和广东2026年政府工作报告列在新兴产业，跨文件设题须写明国家或广东省及文件全名（E-DB-01）。"},{"id":"P4-01","module_id":"P4","title":"国体、政体、根本制度、根本政治制度","priority":"A","new":false,"correct":["国体是人民民主专政，政体是人民代表大会制度；社会主义制度是根本制度，人民代表大会制度是根本政治制度。我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度是基本政治制度。"],"why":"国体回答国家性质和权力属于谁；政体回答国家政权怎样组织。根本制度讲社会制度的根本性质，根本政治制度讲国家政权的组织形式。因此把“人民代表大会”机关名称直接当作“人民代表大会制度”，或者把“根本”删掉，都可能改变答案。","contrasts":[{"wrong":"社会主义制度是我国的根本政治制度。","reason":"遗漏制度分类中的限定词，混淆根本制度与根本政治制度。","correction":"社会主义制度是根本制度；人大制度是根本政治制度。"},{"wrong":"我国的国体是人民代表大会制度。","reason":"将国家性质与政权组织形式对调。","correction":"国体为人民民主专政，政体为人大制度。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["ICONST","T20"],"exam_eligible":true},{"id":"P4-02","module_id":"P4","title":"二十大、二十届四中、十四届人大四次怎么读","priority":"A","new":false,"correct":["党的二十大是中国共产党第二十次全国代表大会；它产生第二十届中央委员会。二十届四中全会是第二十届中央委员会第四次全体会议。十四届全国人大四次会议是第十四届全国人民代表大会任期内的第四次大会；政协也有自己的届次与会议次数。"],"why":"不要把所有“届”“次”硬套一条字面规则。先识别组织：党代会、中央委员会、全国人大、政协；再看是哪一任期中的哪次会议。全国人大和党的全国代表大会不是一套机构，因此号码没有必要相同。","contrasts":[{"wrong":"二十届四中全会就是党的第二十四次全国代表大会。","reason":"把任期内全会次数与党代会序号相加。","correction":"是第二十届中央委员会第四次全体会议。"},{"wrong":"十四届全国人大四次会议会选出第十五届全国人大。","reason":"把一届内的会议次数当作届次更替。","correction":"仍处于第十四届任期内，换届另依程序。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["P4-04","P4-05","H24"],"source_ids":["TPARTY","ICONST","IPLEN4"],"exam_eligible":true},{"id":"P4-03","module_id":"P4","title":"党代会、中央全会、政治局和常委会的关系","priority":"A","new":false,"correct":["党的全国代表大会通常每五年举行一次，选举中央委员会和中央纪律检查委员会。中央委员会全体会议选举中央政治局、中央政治局常委会和中央委员会总书记；总书记须从政治局常委中产生。中央全会每年至少一次；中央政治局及其常委会在中央全会闭会期间行使中央委员会职权。地方党代会通常每五年一次；地方党委全会每年至少两次，不能把中央与地方的最低次数混写。"],"why":"这是大规模代表机构、届内领导机构和经常性决策机构之间的分工。不能把五年一次理解为中央五年才作一次决策，也不能把党代会产生中央委员会说成直接选举总书记的同一步骤。","contrasts":[{"wrong":"党的全国代表大会直接选举中央委员会总书记。","reason":"把产生中央委员会与其全会选举总书记的程序合并。","correction":"总书记由中央委员会全体会议选举。"},{"wrong":"中央政治局常委会只在党代会召开的几天工作。","reason":"颠倒经常性领导机构与代表大会的运行节奏。","correction":"政治局及其常委会在中央全会闭会期间履职。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["TPARTY","IPLEN1","ILPARTY"],"exam_eligible":true},{"id":"P4-04","module_id":"P4","title":"二十届一至五中全会：用实际议题反驳死口诀","priority":"B","new":false,"correct":["二十届一中全会（2022年10月）主要产生中央领导机构；二中（2023年2月）涉及国家机构领导人建议名单和机构改革；三中（2024年7月）部署进一步全面深化改革、推进中国式现代化；四中（2025年10月）通过十五五规划建议；五中（2026年10月）通过持之以恒推进全面从严治党若干重大问题的决定。"],"why":"会议次数体现该届召开顺序，具体议题来自当时任务，并非法条规定“几中只能讨论什么”。历史上常见议题可以帮助定位，不能把经验口诀当作永久制度；当前四中研究十五五就足以防止机械套“五中必谈五年规划”。","contrasts":[{"wrong":"所有届次的五中全会都必须通过五年规划建议。","reason":"把历史常见安排当成法定唯一议题。","correction":"具体按该届公报核对，二十届四中通过十五五建议。"},{"wrong":"二十届三中全会批准了国家十五五纲要。","reason":"会议、文本类型和批准主体三重错配。","correction":"三中部署改革；四中通过建议；国家纲要由全国人大审查批准。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["IPLEN1","IPLEN2","IPLEN3","IPLEN4","TPL5"],"exam_eligible":true},{"id":"P4-05","module_id":"P4","title":"两会、人大、人大常委会：会议频次与职权不同","priority":"A","new":false,"correct":["通常所说全国两会是全国人民代表大会会议和全国政协会议。全国人大每届任期五年，会议每年举行一次，依法可召开临时会议；其常委会是常设机关。全国人大是最高国家权力机关，地方各级人大是地方国家权力机关，不能都加“最高”。"],"why":"全国人大及县级以上地方人大设常委会，乡镇人大不设常委会。常委会便于闭会期间经常履职，但并非任何事项都能无条件替代大会。政府工作报告、法律案、预算案、规划纲要涉及不同职权与程序，不能看见“审议”就机械判同一种权力。","contrasts":[{"wrong":"全国两会是党的全国代表大会和全国人大会议。","reason":"将党代会代入政协位置。","correction":"全国两会通常指全国人大与全国政协会议。"},{"wrong":"人大每年只准开一次会，所以一年内第二次会议不可能存在。","reason":"将通常安排误作禁止增加会议。","correction":"可依法召开临时会议。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["ICONST","ICPPCC","ILOCAL"],"exam_eligible":true},{"id":"P4-06","module_id":"P4","title":"中央和广东的大会次数为何未必相同","priority":"B","new":false,"correct":["2026年全国召开十四届全国人大四次会议，广东召开省十四届人大五次会议；广东2025年10月另行举行省十四届人大四次会议，因此不应按年份机械推算次数。全国与省政协也各自编号，不能按人大次数套用。"],"why":"各机构依法可以有不同的会期安排。届次告诉你任期，次数告诉你该任期中已举行的大会次序；同一年、同一“十四届”也不推出次数相同。此例用于理解制度，不要求冲刺背所有省份的会议号码。","contrasts":[{"wrong":"2026年全国人大是四次会议，所以广东省人大也必须是四次。","reason":"假定国家和省的召开次数同步。","correction":"分别核对，广东当年为省十四届人大五次会议。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["IGD4","IGD5","IPLAN"],"exam_eligible":true},{"id":"P4-07","module_id":"P4","title":"党、人大、政府、政协各承担什么角色","priority":"A","new":false,"correct":["党发挥总揽全局、协调各方的领导核心作用；人大及其常委会依各自法定权限履行立法、决定、监督、任免等职权，并非每一级人大均有地方性法规制定权；政府是国家行政机关；政协是统一战线组织、专门协商机构，主要职能为政治协商、民主监督、参政议政。"],"why":"同一项发展任务可以经党委研究方向、政府形成方案、人大依法审查批准、政协协商建言，然后由政府组织实施并接受监督。不是每个事项都按完全相同流水线走，具体取决于法定职权；政协意见有政治和实践作用，但不是另一院的法律表决。","contrasts":[{"wrong":"政协与人大分别构成我国议会的上院和下院。","reason":"套用不适用的两院制模型。","correction":"政协是专门协商机构，不是国家权力机关。"},{"wrong":"政府编制规划纲要，就意味着政府独自完成最终法定批准。","reason":"将编制与批准合并。","correction":"依法提请人大审查批准相应纲要。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["LAW-012","LAW-013"],"source_ids":["ICONST","ICPPCC","IPLAN","TPARTY"],"exam_eligible":true},{"id":"P4-08","module_id":"P4","title":"党委书记、省长与人大：政治领导和法定履职衔接","priority":"A","new":false,"correct":["省党委领导本地区工作，省委书记主持省委工作；省长领导省政府工作。省人大依法选举省长；党委对有关人选的推荐与人大法定选举是不同环节。国家层面，国家主席与国务院总理也属于不同职务和职权系统。"],"why":"现实中可有党政交叉任职，但同一个人兼任不同职务，并不会使机构的法定权限合并。理解“谁提出人选、谁依法决定、谁主持行政工作”比按新闻中站位猜职权更可靠。","contrasts":[{"wrong":"省委书记在法律上直接行使省长的全部行政职权。","reason":"将政治领导与行政机关法定职权混同。","correction":"按党和国家机构各自权限履职。"},{"wrong":"党委推荐省长人选后，人大选举程序已无必要。","reason":"政治程序不能替代法定产生程序。","correction":"推荐与依法选举相衔接。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["ILPARTY","ILOCAL","ICONST"],"exam_eligible":true},{"id":"P4-09","module_id":"P4","title":"中央到地方：领导、监督、指导不能随意互换","priority":"A","new":false,"correct":["国务院统一领导全国地方各级国家行政机关；地方政府对本级人大和上一级国家行政机关负责并报告工作。县级以上地方政府在本级人大闭会期间对本级人大常委会负责并报告工作。上级法院监督下级法院审判工作；上级检察院领导下级检察院工作；上级监察委员会领导下级监察委员会工作。"],"why":"不同机关的上下关系由制度设计确定，不是都按企业总部—分公司的行政命令模型运行。法院的监督与审级制度相联系，不能用政府的行政领导关系理解具体案件；检察、监察则有法定上下领导关系。","contrasts":[{"wrong":"上级人民法院像上级政府一样行政领导下级法院的全部工作。","reason":"把审判监督关系替换为行政层级领导。","correction":"依法监督审判工作，依审级和程序履职。"},{"wrong":"所有地方国家机关只向上一级机关负责，不受本级人大监督。","reason":"忽略国家权力机关的法定监督与负责关系。","correction":"分别看本级人大与上级机关的责任、监督或领导关系。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["ICONST","ILOCAL"],"exam_eligible":true},{"id":"P4-10","module_id":"P4","title":"条块关系与基层自治","priority":"B","new":false,"correct":["地方政府统一领导所属部门；业务部门还依法接受上级主管部门业务指导或者领导，具体按法律法规确定。村委会、居委会是基层群众性自治组织，乡镇政府是基层国家行政机关；不能把村委会当作一级政府。"],"why":"“块”便于统筹本地区事务，“条”便于保持专业标准与纵向协调，但垂直管理、双重管理等具体安排不能用一个口诀包办。基层自治使居民依法办理自己的事务，并不取消党的领导、法律约束以及政府的指导支持。","contrasts":[{"wrong":"某省厅名称与国务院部门相似，所以只接受该中央部门领导。","reason":"忽略所属地方政府统一领导及具体管理制度。","correction":"结合组织法和该系统规定判断。"},{"wrong":"村委会是我国最基层的一级人民政府。","reason":"将自治组织与国家行政机关混同。","correction":"乡镇政府是基层政府，村委会是自治组织。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["ICONST","ILOCAL"],"exam_eligible":true},{"id":"P4-11","module_id":"P4","title":"政法委、纪委与监委：不能靠名字推权限","priority":"B","new":false,"correct":["党委政法委员会是党委领导和管理政法工作的职能部门，履行统筹协调等职责，不能取代法院、检察院等依法履职。纪委是党的纪律检查机关；监委是国家监察机关；纪委与监委合署办公，但党内监督和国家监察的身份与依据应区分。"],"why":"“政法”的字序本身证明不了现代机关的全部法定权限，名称沿革也不能直接推出个人可任意干预案件。合署办公说明组织运行衔接紧密，不意味着党纪处理、监察调查与刑事审判是同一种法律行为。","contrasts":[{"wrong":"政法委名称中政在法前，所以可以直接代替法院作出生效判决。","reason":"用词序代替制度和法定权限依据。","correction":"应据政法工作条例、宪法和法律分清党委领导与审判职权。"},{"wrong":"纪委监委合署办公，所以纪委本身就是人民法院。","reason":"把不同监督、调查与审判职能合并。","correction":"纪委、监委、法院有不同制度身份与职权。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["IPOLLAW","ICCDI","ICONST"],"exam_eligible":true},{"id":"P4-12","module_id":"P4","title":"五年规划怎样落到年度工作与省级行动","priority":"A","new":false,"correct":["五年规划提出中期目标和任务，年度国民经济和社会发展计划、预算及具体政策工程推动实施。国家发展规划具有统领作用；省级纲要依法衔接国家规划，并由本级人大批准。国家建议、国家纲要、省级纲要、年度政府工作报告不是同一份文件。"],"why":"五年目标若没有年度安排、资金和责任，就难落实；但年度政府工作报告也不能在发布时自动修改人大批准的全部规划。中央和省的编制可以并行衔接，不必机械想象国家纲要正式批准后各省才从零起草。2026广东1月批准省纲要、国家3月批准国家纲要，正好说明程序需要区分。","contrasts":[{"wrong":"省级纲要必须等国家纲要正式批准后才能开始编制。","reason":"把衔接一致误作全部工作只能串行进行。","correction":"可以在前期部署与建议基础上并行衔接，最终依法批准。"},{"wrong":"政府工作报告中的年度工作就是一份新的五年规划。","reason":"混淆年度部署与中期纲要。","correction":"按文件类型、期限、编制批准程序区分。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["LAW-012","LAW-013","H32"],"source_ids":["IPLAN","IGD5","T15","E-PT-02","E-DB-02","E-DB-07"],"exam_eligible":true,"review_note":"核验补充：同年的增长数字要对应文件——全国2026年预期4.5%—5%出自国务院政府工作报告，国家纲要对GDP只写“保持在合理区间、各年度视情提出”，广东“年均增长5%左右”出自省纲要；广东省纲要2026年1月29日获批，早于国家发展规划法3月12日施行，该法第36条是现行一般程序，不能倒推为广东1月批准时的依据（E-PT-02、E-DB-02、E-DB-07）。"},{"id":"P4-13","module_id":"P4","title":"2030、2035、本世纪中叶与2029各是什么节点","priority":"A","new":false,"correct":["十五五规划期是2026—2030年；新时代现代化两步走安排是到2035年基本实现社会主义现代化、到本世纪中叶建成社会主义现代化强国。二十届三中全会决定提出到2029年完成其部署的改革任务，不能把2029直接当十五五收官年。"],"why":"同一国家发展进程有战略目标、五年规划和专项改革任务等不同时间轴。一个节点提前，不等于其他期限自动改变。1987年原三步走中的世纪中叶目标属于当时历史安排，不能拿来替换当前2035节点。","contrasts":[{"wrong":"十五五在2035年结束，并于2029年基本实现现代化。","reason":"将五年期、改革期限、战略目标交叉换位。","correction":"十五五2030收官；基本现代化2035；相关改革任务2029。"},{"wrong":"当前2035目标与1987年三步走的第二步是同一时间目标。","reason":"把不同时期的路线图混写。","correction":"原三步走第二步到20世纪末人民生活达到小康。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":["H27","H32"],"source_ids":["T20","T15","I2029"],"exam_eligible":true},{"id":"P4-14","module_id":"P4","title":"广东1310部署：一、三、十各处于哪个层次","priority":"B","new":false,"correct":["1310指锚定“走在前列”总目标，激活改革、开放、创新三大动力，奋力实现十大新突破。十大方面依次涉及：思想解放和高质量发展；改革开放与现代化体制机制；自立自强与产业科技互促；实体经济和制造业；百千万与城乡区域协调；海洋强省；绿美广东；文化强省；民生和共同富裕；法治平安广东与新安全格局。"],"why":"总目标、动力、任务领域不是同一层级。“十”中的文化、民生、法治安全等说明并非十个工业项目；后续年度大会在既有部署中选择重点，也不意味着整套部署被替换。优先识别一与三，十掌握领域和归属，不逐字默写全部长标题。","contrasts":[{"wrong":"1310中的三是制造业、服务业和农业三个行业。","reason":"把动力类别换成产业类别。","correction":"三大动力是改革、开放、创新。"},{"wrong":"2026年讲两业协同，说明1310部署不再包括文化与民生。","reason":"把年度突出主题误作删除全局任务。","correction":"年度主题与总体部署衔接，不能据主题推其他任务取消。"}],"question_design":"判断并纠错，或给出新情境比较最符合的关系；题干保留主体、范围和必要条件。","related_ids":[],"source_ids":["I1310"],"exam_eligible":true},{"id":"H01","module_id":"H","title":"四个历史时期：先看任务，再定位事件","priority":"A","new":false,"correct":["党史中的四个大时期：新民主主义革命时期（1921—1949）；社会主义革命和建设时期（1949—1978）；改革开放和社会主义现代化建设新时期（1978—2012）；中国特色社会主义新时代（2012年党的十八大以来）。","新民主主义革命在中国近现代史中的起点通常标为1919年五四运动；党成立于1921年。因此“革命史分期起点”与“党史叙述起点”可以不同。","依次抓任务：争取民族独立、人民解放；完成社会主义革命并推进建设；改革开放、解放发展生产力；新时代推进民族复兴。"],"why":"阶段名称是给主要历史任务定位，不是说下一阶段不再建设社会主义。题目若使用专门分期，“社会主义革命和建设时期”通常指1949—1978，不能把1987年的三步走因为含有“建设”二字就放进去。边界年要结合具体事件，1978年12月十一届三中全会、2012年11月十八大是转折节点。","contrasts":[{"wrong":"第一次国共合作发生在社会主义建设时期。","reason":"把1920年代事件搬到了新中国成立后。","correction":"第一次国共合作发生在新民主主义革命时期。"},{"wrong":"中国新民主主义革命在1921年开始。","reason":"混用了革命史与党史的叙述起点。","correction":"新民主主义革命通常以1919年五四运动为开端；1921年是建党。"}],"question_design":"适合阶段归类、多选逐项判断；不要用1987年仍在社会主义建设这一广义事实否定专门分期。","related_ids":[],"source_ids":["HS01","HS02"],"exam_eligible":true},{"id":"H02","module_id":"H","title":"建党的思想与阶级条件：几个起点不能互换","priority":"B","new":false,"correct":["1917年俄国十月革命、1919年五四运动与中国共产党1921年成立，是不同事件；党是在马克思列宁主义同中国工人运动结合中产生的。","五四运动既是思想传播和社会动员的重要节点，也是中国新民主主义革命的开端；它不是中国共产党正式成立的会议。","共产党早期组织的成员已同改良主义、无政府主义等思潮进行论战，并批判第二国际修正主义，强调革命方向；不能说早期完全没有划清相关界限。","新民主主义革命由无产阶级领导，现阶段主要处理反帝反封建等民主革命任务，其发展前途是社会主义。领导阶级、当前任务、发展前途是三个不同维度。"],"why":"理解这个顺序，才能明白为什么共产党可以参与民主革命并与其他阶层合作：长期目标不会使现实社会结构和眼前任务自动消失。所谓“新”，主要不能只按是否已经实现社会主义所有制判断。","contrasts":[{"wrong":"无产阶级领导的革命，其当时任务必然是立即消灭一切私人资本。","reason":"把领导力量、历史阶段和政策对象压成一个概念。","correction":"新民主主义革命仍有民主革命阶段的任务，不能跳过条件。"},{"wrong":"五四运动正式建立了中国共产党。","reason":"把思想和群众运动条件换成组织成立节点。","correction":"正式成立以1921年中共一大为标志。"}],"question_design":"适合排序和维度辨析；遇到“早期没有与第二国际改良主义划界”可据事实判断，但不扩展第二国际派别史。","related_ids":[],"source_ids":["HS01","HS03","HS21","HS47"],"exam_eligible":true},{"id":"H03","module_id":"H","title":"一大：建党、纲领、中央局与纪念日","priority":"A","new":false,"correct":["中共一大于1921年7月23日在上海开幕，最后一天会议转至浙江嘉兴南湖游船；它宣告中国共产党正式成立。","一大通过党的第一个纲领和决议，选举中央局，陈独秀任中央局书记。","7月1日是党的成立纪念日，不能当作一大在上海开幕的准确日期。"],"why":"命题人最方便换的是相近名词：第一个纲领与第一部党章、中央局书记与总书记、成立纪念日与实际开幕日。它们都与建党有关，却指不同制度事实。","contrasts":[{"wrong":"一大通过第一部党章。","reason":"把一大的纲领换成二大的党章。","correction":"第一部党章由1922年二大通过。"},{"wrong":"一大选举陈独秀为总书记。","reason":"把当时职称换成后来的称谓。","correction":"准确职称是中央局书记。"},{"wrong":"一大于1921年7月1日在嘉兴南湖开幕。","reason":"日期和起始地点同时被替换。","correction":"7月23日上海开幕，最后一天转到嘉兴南湖。"}],"question_design":"只训练已列出的日期、地点、文件、职称；不记代表全名单和人数。","related_ids":[],"source_ids":["HS03","HS04"],"exam_eligible":true},{"id":"H04","module_id":"H","title":"二大：最高纲领与最低纲领为何要同时存在","priority":"A","new":false,"correct":["1922年中共二大第一次提出明确的反帝反封建的民主革命纲领，区分最高纲领与最低纲领，并通过第一部党章。","最高纲领指向共产主义的最终目标；最低纲领针对当时民主革命阶段，主要是反对帝国主义、军阀统治，争取独立、统一的民主共和国。"],"why":"“最低”表示当前阶段必须解决的任务，并不是道德标准降低，也不是放弃长期目标。把最终目的直接当作眼前操作方案，会错过当时需要联合的力量和先处理的问题。","contrasts":[{"wrong":"二大的最低纲领就是立即实现共产主义。","reason":"把当前阶段任务与最终奋斗目标互换。","correction":"最低纲领是民主革命阶段纲领，最高纲领指向共产主义。"},{"wrong":"区分最高和最低纲领意味着二大不再坚持共产主义。","reason":"两者具有阶段衔接关系，不是二选一。","correction":"长期目标和阶段任务同时保留。"}],"question_design":"适合把目标、任务、党章分别归入二大；不考最低纲领全部原文背诵。","related_ids":[],"source_ids":["HS04","HS42"],"exam_eligible":true},{"id":"H05","module_id":"H","title":"中共三大与国民党一大：决定合作与正式形成","priority":"A","new":false,"correct":["1923年中共三大在广州召开，决定共产党员以个人身份加入国民党，同时保持共产党在政治、思想、组织上的独立性。","1924年国民党一大在广州召开，标志着第一次国共合作正式形成；合作形式是党内合作。","国民党一大对三民主义作新解释；新三民主义是合作的政治基础，联俄、联共、扶助农工是三大政策。二者相关，但不是同一份三项清单。"],"why":"先在共产党内部决定合作方式，再通过国民党的改组使合作成立，是两个组织各自完成步骤。个人加入不等于共产党整党取消自身组织，合作也不等于所有政治目标完全一致。","contrasts":[{"wrong":"第一次国共合作在1923年中共三大已正式形成。","reason":"把决策环节替换为完成环节。","correction":"三大作出合作决策，国民党一大标志正式形成。"},{"wrong":"共产党作为整个组织并入国民党。","reason":"把党员个人参加误写成取消党独立存在。","correction":"党员以个人身份参加，党保持独立性。"},{"wrong":"新三民主义就是联俄、联共、扶助农工三个主义。","reason":"把纲领体系与实施政策混成同义词。","correction":"三民主义仍是民族、民权、民生；三大政策为联俄、联共、扶助农工。"}],"question_design":"可做会议—地点—成果三列配对；“正式形成”必须绑定1924年国民党一大。","related_ids":[],"source_ids":["HS05","HS07"],"exam_eligible":true},{"id":"H06","module_id":"H","title":"四大：合作中仍有领导权与工农联盟问题","priority":"B","new":false,"correct":["1925年中共四大在上海召开，提出无产阶级在民主革命中的领导权问题和工农联盟问题。","联合多种社会力量与争取无产阶级领导权并不互相排斥；工农联盟是党史中需要单独识别的关系。"],"why":"一个联合行动既要回答“和谁共同做”，也要回答“靠谁作基础、谁掌握方向”。有共同目标，不等于各方组织、利益和领导权问题自然消失。这是四大对已有合作经验的进一步认识。","contrasts":[{"wrong":"三大首次提出工农联盟和无产阶级领导权。","reason":"把四大的成果提前给三大。","correction":"三大记合作形式；四大记领导权、工农联盟。"},{"wrong":"一旦国共合作，领导权问题就不再存在。","reason":"合作扩大参与者，反而仍须安排政治方向。","correction":"合作与保持独立、争取领导权可以同时存在。"}],"question_design":"作为三大的近邻辨析，不扩展四大全部组织条文。","related_ids":[],"source_ids":["HS06","HS07"],"exam_eligible":true},{"id":"H07","module_id":"H","title":"广东早期党史：以地点和功能连接，避免地方史泛背","priority":"B","new":false,"correct":["广州对应1923年中共三大、1924年国民党一大，也对应国共合作背景下创办的黄埔军校和农民运动讲习所。","黄埔军校主要联系军事人才培养；广州农民运动讲习所主要联系农民运动骨干培养。","彭湃与广东海丰农民运动相连；1923年海丰县总农会成立，是中国第一个县级农会。1922年的六人农会与1923年的县级农会不是同一组织规模节点。","1925年爆发的省港大罢工主要连接广州、香港与反帝工人运动。"],"why":"用功能把四个广东坐标挂到同一段历史：合作组织、军事骨干、农民动员、工人运动。这样需要记的是互相区别的用途，而不是把城市名字当作万能答案。","contrasts":[{"wrong":"海丰县总农会在1922年与六人农会同时成立。","reason":"把基层初创组织与后来的县级组织合并了。","correction":"六人农会1922年；县总农会1923年。"},{"wrong":"黄埔军校与广州农讲所的主要培养对象相同。","reason":"分别对应军官骨干与农民运动骨干。","correction":"按功能配对，不只按都在广州判断。"}],"question_design":"适合广东地点—事件—功能配对；不考所有届次主持人和学员名单。","related_ids":[],"source_ids":["HS02","HS07","HS08"],"exam_eligible":true},{"id":"H08","module_id":"H","title":"1927年三个节点：起义、方针、道路探索","priority":"A","new":false,"correct":["1927年南昌起义是党独立领导革命战争、创建人民军队和武装夺取政权的开端。","1927年八七会议确定实行土地革命和武装起义的方针。","秋收起义后，毛泽东率部转向井冈山，建立农村革命根据地；农村包围城市、武装夺取政权的道路是在实践中逐步探索和概括的。"],"why":"先有革命失败后的武装反抗和方向调整，再在力量对比下寻找能保存发展力量的空间。不能因为八七会议强调武装起义，就把后来逐步形成的整套道路理论一次性安在会议名下。","contrasts":[{"wrong":"八七会议完整确立农村包围城市的革命道路。","reason":"把土地革命和武装起义的一般方针，当成后来成熟的空间路径。","correction":"八七会议确定土地革命和武装起义方针；道路在之后的根据地实践中形成。"},{"wrong":"井冈山根据地由南昌起义当天直接建立。","reason":"把相连但不同的起义和根据地建设节点合并。","correction":"井冈山根据地主要联系秋收起义后的转向与创建。"}],"question_design":"适合节点定位；不要求战役路线、兵力、伤亡和参加者名单。","related_ids":[],"source_ids":["HS01","HS02"],"exam_eligible":true},{"id":"H09","module_id":"H","title":"南昌、三湾、古田：建军与党对军队领导","priority":"A","new":false,"correct":["1927年三湾改编的重要内容包括把党支部建在连上，从组织上加强党对军队的领导。","1929年古田会议确立思想建党、政治建军原则。","关于党对军队绝对领导的根本原则和制度，可以使用权威概括：发端于南昌起义、奠基于三湾改编、定型于古田会议。"],"why":"打出一支武装，不等于它已经稳定服从同一政治目标。支部到连，是让党的组织进入基层作战单位；思想和政治原则则回答军队为什么而战、执行什么任务。它们是不同层面的建设，不能用一个大会包揽。","contrasts":[{"wrong":"支部建在连上由古田会议首次提出。","reason":"把三湾改编的标志性组织安排移给后来的古田会议。","correction":"三湾记支部建连；古田记思想建党、政治建军。"},{"wrong":"三湾改编就是把部队数量缩小，与党的领导无关。","reason":"把军制整编的表层动作当成全部内容。","correction":"核心还在于党组织与党代表制度等政治组织建设。"}],"question_design":"宜用措施—会议匹配；不把“发端/奠基/定型”随意改成“首次建立一切制度”。","related_ids":[],"source_ids":["HS09"],"exam_eligible":true},{"id":"H10","module_id":"H","title":"遵义会议：领导地位与正式职务不能混写","priority":"A","new":false,"correct":["遵义会议于1935年1月在长征途中召开，集中处理迫切的军事和组织问题。","规范表述是：事实上确立毛泽东在党中央和红军的领导地位；开始确立以毛泽东为主要代表的正确路线在党中央的领导地位；开始形成第一代中央领导集体。","会议并非选举毛泽东担任总书记；会后中央负总责的安排与军事指挥分工还继续调整。"],"why":"历史性领导作用，未必等于某一天授予一个后来熟悉的职称。遵义解决了当时最急迫的指挥和组织问题，思想路线认识仍有后续发展，不能把“一次生死攸关转折”说成“所有历史问题当场彻底解决”。","contrasts":[{"wrong":"遵义会议选举毛泽东为中共中央总书记。","reason":"将领导地位换成未经会议作出的任职。","correction":"应表述为事实上确立领导地位；不能造出总书记任职。"},{"wrong":"遵义会议一次性从思想、政治、组织各方面完成全部拨乱反正。","reason":"超出了当时会议集中处理的问题。","correction":"把它把握为军事、组织问题和领导路线转折，后续还有整风等工作。"}],"question_design":"适合规范动词辨析：事实上、开始；不考细碎职务交接日地。","related_ids":[],"source_ids":["HS01","HS43"],"exam_eligible":true},{"id":"H11","module_id":"H","title":"长征在做什么：战略转移与两次结束节点","priority":"B","new":false,"correct":["1934年中央红军因中央革命根据地第五次反“围剿”失利进行战略转移；出发时不是已经按一份固定线路计划前往陕北。","1935年10月中央红军到达陕北吴起镇，完成中央红军长征；1936年10月红一、红二、红四方面军在会宁、将台堡地区会师，标志红军长征胜利结束。","1935年《论反对日本帝国主义的策略》以宣言书、宣传队、播种机概括长征意义；这是说明影响的修辞，不是长征出发时的一份行政任务清单。","“中央红军到达陕北”与“红军三大主力会师”对象和时间不同；不能把所有队伍写成同一条路线、同一地点、同一天到达。"],"why":"理解长征，先把它看成带着军队与政治组织寻找生存和继续斗争条件的战略转移，过程中受敌情、地理、补给和根据地条件影响不断调整。失去原有根据地与保存骨干、重新立足，是不同层次的结果；承认前者的巨大损失，并不妨碍解释后者为何被视为战略转折。此段是依据史实的教学分析，不是单一原因公式。","contrasts":[{"wrong":"长征从开始就是按预定路线北上陕北抗日。","reason":"把后来形成的目的地倒写为最初完整计划。","correction":"中央红军最初行动方案和落脚方向经历多次调整。"},{"wrong":"1935年三大主力在吴起镇会师，全部长征结束。","reason":"对象、地点、年份三项混淆。","correction":"1935吴起镇对应中央红军；1936会宁、将台堡对应主力会师。"}],"question_design":"核心只练原因、性质、两组节点，补记已讲的长征论断出处；路线与战略评价的解释不设唯一心理动机答案。","related_ids":["H10","H12"],"source_ids":["HS10","HS01","HS48"],"exam_eligible":true},{"id":"H12","module_id":"H","title":"两次国共合作：组织形式、共同任务、形成节点","priority":"A","new":false,"correct":["第一次国共合作：1924年国民党一大正式形成，采用共产党员个人加入国民党的党内合作形式，主要联系国民革命和北伐。","1936年西安事变和平解决，对促成第二次国共合作和团结抗日起了重大作用。","1937年9月国共合作宣言与蒋介石相关谈话公开，标志以国共合作为基础的抗日民族统一战线正式形成；第二次采取党外合作。"],"why":"合作不是因为所有矛盾已消失，而是在共同任务下形成联合。第一轮的组织载体是改组后的国民党；第二轮两党组织分别存在，结合共同抗日展开合作。因此“停止内战的关键推动”与“合作正式形成”仍要分开。","contrasts":[{"wrong":"西安事变和平解决标志第二次国共合作正式形成。","reason":"把重大促成事件提前写成正式形成节点。","correction":"促成看1936西安事变；正式形成看1937年9月相关公开文件。"},{"wrong":"两次合作都要求共产党员以个人身份加入国民党。","reason":"把第一次的组织方式复制到第二次。","correction":"第一次党内合作；第二次党外合作。"}],"question_design":"用表格对比即可，不扩成抗战全史；党外合作不等于双方从无摩擦。","related_ids":[],"source_ids":["HS07","HS11","HS45"],"exam_eligible":true},{"id":"H13","module_id":"H","title":"1949、1953、1956：建国与社会主义改造是不同层次","priority":"A","new":false,"correct":["1949年中华人民共和国成立，标志新民主主义革命取得伟大胜利并进入向社会主义过渡的历史进程。","1953年正式提出过渡时期总路线，简称“一化三改”：社会主义工业化；对农业、手工业和资本主义工商业的社会主义改造。","1956年三大改造基本完成，社会主义基本制度在我国确立。不要写成工业化在1956年已经全部完成。"],"why":"建立新国家解决国家政权和独立问题；此后改变经济制度、建设工业基础仍需要过程。一化是发展生产能力的长期任务，三改侧重制度改造，它们同时推进但不可能用同一个年份表示全部完成。","contrasts":[{"wrong":"1949年新中国成立时，社会主义改造已经完成。","reason":"把国家成立与所有制改造完成混同。","correction":"社会主义改造基本完成看1956年。"},{"wrong":"一化三改的“一化”指农业集体化。","reason":"把主体工业化与农业改造互换。","correction":"一化是社会主义工业化；农业改造属于三改之一。"},{"wrong":"三改完成意味着我国已成为工业化强国。","reason":"所有制结构变更不等于生产力目标立即完成。","correction":"制度确立与工业化发展水平须分别判断。"}],"question_design":"适合时间—任务—完成程度辨析；“基本完成”不替换为消除全部问题。","related_ids":[],"source_ids":["HS01","HS12"],"exam_eligible":true},{"id":"H14","module_id":"H","title":"1956与1957两篇建设时期著作","priority":"A","new":false,"correct":["《论十大关系》（1956）关注社会主义建设中的重大关系，基本方针是调动一切积极因素为社会主义事业服务；例如重工业与农业轻工业、中央与地方、沿海与内地。","《关于正确处理人民内部矛盾的问题》（1957）区分不同性质的社会矛盾，强调用民主方法处理人民内部矛盾；“团结—批评—团结”是相应方法概括。","两篇都在新中国建设语境中，不能因为出现“矛盾”二字就都归入1937年的《矛盾论》。"],"why":"前一篇面对的是“国家建设怎样处理结构关系”，后一篇面对的是“制度转变以后怎样处理社会和政治生活中的矛盾”。作品名称里的关系、矛盾都有日常含义，识别时须同时看问题对象和历史阶段。","contrasts":[{"wrong":"《论十大关系》提出新民主主义革命的三大法宝。","reason":"把建设问题与革命经验总结互换。","correction":"三大法宝见1939年《〈共产党人〉发刊词》。"},{"wrong":"人民内部矛盾都应按敌我矛盾使用专政方法处理。","reason":"抹掉了著作最关键的性质与处理方式区别。","correction":"人民内部矛盾强调民主方法，不能一概敌我化。"}],"question_design":"只训练作品—时代—代表主张；马哲矛盾原理不在本文件重讲。","related_ids":["H15","H18"],"source_ids":["HS13","HS14"],"exam_eligible":true},{"id":"H15","module_id":"H","title":"社会主要矛盾的三种历史表述","priority":"A","new":false,"correct":["1956年八大：人民对于建立先进工业国的要求同落后农业国现实的矛盾，以及人民对经济文化迅速发展的需要同当前不能满足这种需要状况的矛盾；主要任务落到发展生产力、实现国家工业化。","1981年历史决议：社会主义改造基本完成后，主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。","2017年十九大：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"],"why":"三种表述相连但有各自时间和具体内容。1956突出工业化阶段，1981在历史总结中明确需要与生产的关系，2017面对需求升级和发展结构问题。讲主要矛盾变化，不等于否认我国仍处于社会主义初级阶段。","contrasts":[{"wrong":"1956年八大提出“美好生活需要和不平衡不充分的发展”。","reason":"把十九大表述提前六十多年。","correction":"八大要保留当时工业国要求与农业国现实等表述。"},{"wrong":"2017年主要矛盾变化意味着社会主义初级阶段结束。","reason":"阶段性主要矛盾与长期基本国情不是同一判断。","correction":"主要矛盾变化没有改变社会主义初级阶段的基本国情。"}],"question_design":"允许将八大两项准确合并概括，但不制造只靠教材措辞差别的伪错项。","related_ids":[],"source_ids":["HS15","HS16","HS36"],"exam_eligible":true},{"id":"H16","module_id":"H","title":"曲折探索：用历史结论理解1978年的转折","priority":"B","new":false,"correct":["1958年开始的“大跃进”和人民公社化运动出现急于求成、违背经济规律等严重问题；1959—1961年国民经济发生严重困难。","1966—1976年的“文化大革命”是严重曲折；1981年历史决议对其性质及错误作出明确评价。","这些历史背景有助于理解为什么改革开放强调实事求是、经济建设和制度建设，但不能把1949—1978整个时期抹成没有建设成就。"],"why":"追求速度的目标一旦压倒真实信息和生产条件，层层加码、虚报与资源错配会互相强化。这是解释政策失误的一种机制，不是把复杂历史归结为唯一原因。历史评价也应同时区分阶段成就、具体政策失误和严重政治运动，不做全盘肯定或否定。","contrasts":[{"wrong":"1959—1961年的困难完全由自然灾害造成。","reason":"回避了经济政策失误和其他多重因素。","correction":"政策错误是必须面对的重要原因，不能全推给自然因素。"},{"wrong":"否定文化大革命，就等于否定1949年以来全部建设。","reason":"把特定事件评价扩大成全部时期评价。","correction":"具体错误与时期内取得的制度、工业等成就分别评价。"}],"question_design":"作为理解背景；不扩展伤亡数字、内部人事传闻，不用教学机制推断制作唯一因果选择题。","related_ids":[],"source_ids":["HS16","HS01"],"exam_eligible":true},{"id":"H17","module_id":"H","title":"1930年两篇著作：同年不能替代主旨识别","priority":"A","new":false,"correct":["《星星之火，可以燎原》（1930）联系革命前途、农村根据地和红色政权发展问题。","《反对本本主义》（1930）联系调查研究、反对脱离实际的教条主义；“没有调查，没有发言权”是其标志性论断。","题干只给1930年，不能在这两篇之间唯一选择；必须再看主张或问题对象。"],"why":"两篇的共同背景是探索中国革命道路，但一个更侧重“局部力量怎样发展为整体胜利”，一个更侧重“根据什么认识真实情况、作出决策”。年份提供时代约束，主旨才提供同年的区分度。","contrasts":[{"wrong":"1930年的调查研究论断必出自《星星之火，可以燎原》。","reason":"把同年作品当成可以互换。","correction":"调查研究、没有调查没有发言权对应《反对本本主义》。"},{"wrong":"反对本本主义就是不学习任何书本理论。","reason":"反对的是教条化套用，不是知识和理论本身。","correction":"理论要同实际结合，调查用于纠正脱离实际。"}],"question_design":"可改编著作配对题；标为自编或改编，不能把作者相同当成唯一依据。","related_ids":[],"source_ids":["HS17","HS18"],"exam_eligible":true},{"id":"H18","module_id":"H","title":"1937年《实践论》《矛盾论》：这里只保留作品索引","priority":"B","new":false,"correct":["《实践论》和《矛盾论》均写于1937年抗日战争时期的延安，构成批判教条主义、总结革命经验的重要哲学著作。","《实践论》侧重认识与实践的关系；《矛盾论》侧重矛盾问题与辩证法。","本汇总仅纳入作品名称、年份和主旨索引；实践、真理、矛盾等概念辨析由独立马哲底稿负责。"],"why":"同一年的两篇可先用问题域区分，避免看到“矛盾”便想到1957年的社会矛盾著作，也避免把1930年的调查研究文章和1937年的哲学论述混在一起。","contrasts":[{"wrong":"《关于正确处理人民内部矛盾的问题》就是1937年的《矛盾论》。","reason":"书名相似不等于作品、阶段与问题层次相同。","correction":"1937《矛盾论》；1957《正确处理人民内部矛盾》。"}],"question_design":"只做作品匹配；禁止借此自动生成马哲定义题。","related_ids":[],"source_ids":["HS19"],"exam_eligible":true},{"id":"H19","module_id":"H","title":"1939年《〈共产党人〉发刊词》与三大法宝","priority":"A","new":false,"correct":["1939年《〈共产党人〉发刊词》概括统一战线、武装斗争、党的建设为中国革命的三大法宝。","三大法宝不可与理论联系实际、密切联系群众、批评和自我批评的三大优良作风互换。"],"why":"可以分别理解为组织广泛共同力量、取得和保卫政治力量、维持领导组织自身能力。这是帮助记忆的功能解释，不意味着每个法宝只承担一种作用。三大作风则是工作和组织行为方式，分类层次不同。","contrasts":[{"wrong":"三大法宝是理论联系实际、密切联系群众、批评和自我批评。","reason":"将作风清单偷换为革命法宝。","correction":"法宝为统一战线、武装斗争、党的建设。"},{"wrong":"《论联合政府》首次提出中国革命三大法宝。","reason":"作品和固定概括错配。","correction":"三大法宝对应1939年《〈共产党人〉发刊词》。"}],"question_design":"适合混入一项相邻清单后判断；避免只用“有三个词”进行机械记忆。","related_ids":["H20"],"source_ids":["HS20","HS22"],"exam_eligible":true},{"id":"H20","module_id":"H","title":"1940与1945：新民主主义方案和联合政府","priority":"A","new":false,"correct":["《新民主主义论》（1940）系统阐述新民主主义政治、经济、文化纲领；文化主张对应民族的、科学的、大众的文化。","《论联合政府》（1945）是毛泽东提交中共七大的政治报告，围绕打败侵略者、建立新中国及联合政府主张展开。","《论联合政府》概括党的三大优良作风：理论联系实际、密切联系群众、批评和自我批评。"],"why":"1940年的重点是描画民主革命阶段应建设怎样的国家和社会；1945年抗战接近胜利，重点进一步落到政治前途和政府安排。两篇都与新民主主义有关，但题目若问会议报告或三大作风，就能区别。","contrasts":[{"wrong":"《新民主主义论》是1945年七大政治报告。","reason":"将理论纲领著作与特定大会报告互换。","correction":"七大政治报告为《论联合政府》。"},{"wrong":"《论联合政府》只讨论政治联合，与党的作风无关。","reason":"以标题限定了全文所有内容。","correction":"它同时概括了党的三大优良作风。"}],"question_design":"作品配对要给具有区分度的细节；仅问“与新民主主义有关”可有多个正确项。","related_ids":[],"source_ids":["HS21","HS22"],"exam_eligible":true},{"id":"H21","module_id":"H","title":"1978年：思想解放与工作中心转移","priority":"A","new":false,"correct":["1978年关于真理标准问题的大讨论，冲破“两个凡是”等思想束缚，为历史转折准备思想条件。","1978年12月十一届三中全会，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。","1981年十一届六中全会通过第二个历史决议；不能把它与1978年的工作中心转移混成同一次会议。"],"why":"如果过去形成的每项判断都不能重新检验，政策纠偏就缺少空间；思想路线讨论因而与调整工作重点相连。但讨论提供条件、全会作出决策、历史决议总结评价，是各自的环节。","contrasts":[{"wrong":"改革开放和工作中心转移由1981年十一届六中全会首次决定。","reason":"把后续历史总结替换了1978年的转折会议。","correction":"十一届三中全会是1978年的关键节点。"},{"wrong":"1978年讨论反对两个凡是，就是否定一切既有理论。","reason":"针对不加条件的盲从，不是全面抛弃理论。","correction":"强调以实践检验并从实际出发。"}],"question_design":"只考历史节点与作用；不在此重复马哲真理标准原理题。","related_ids":[],"source_ids":["HS23","HS16","HS28"],"exam_eligible":true},{"id":"H22","module_id":"H","title":"改革的实践入口：家庭承包与经济特区","priority":"B","new":false,"correct":["1978年安徽小岗村的大包干探索，是农村改革的代表事件；家庭联产承包责任制是在土地集体所有基础上调整经营方式，不等于土地私有化。","1980年设立深圳、珠海、汕头、厦门经济特区，前三个在广东，厦门在福建。","经济特区是改革开放的试验窗口和示范区域，不是独立于国家主权与法律之外的地区。"],"why":"农村改革通过责任、收益与劳动之间的联系调动积极性；特区通过限定空间中的先行探索积累经验。这是两种改革实施路径，不要求先把全国所有制度同时改完，也不能把政策灵活性理解成没有规则。","contrasts":[{"wrong":"家庭承包把农村集体土地变成农户私人所有。","reason":"把承包经营权及经营方式变化当成所有权私有化。","correction":"土地集体所有基础仍保留。"},{"wrong":"1980年四个经济特区都位于广东。","reason":"忽略厦门属于福建。","correction":"广东三市加福建厦门。"}],"question_design":"优先训练所有权与经营方式、地点与阶段；不背所有开放城市名单。","related_ids":[],"source_ids":["HS24","HS25","HS01"],"exam_eligible":true},{"id":"H23","module_id":"H","title":"三份历史决议：评什么历史，在什么关头","priority":"A","new":false,"correct":["1945年六届七中全会：《关于若干历史问题的决议》，主要总结建党以来、尤其六届四中全会至遵义会议前这一段的经验教训，为七大统一思想。","1981年十一届六中全会：《关于建国以来党的若干历史问题的决议》，主要评价新中国成立后重大历史问题及毛泽东的历史地位，坚持并发展毛泽东思想。","2021年十九届六中全会：《中共中央关于党的百年奋斗重大成就和历史经验的决议》，总结百年成就和经验。"],"why":"历史决议不是给每个人的所有言行作评价，而是用关键历史认识统一当前方向。文件标题已经提示范围：若干问题、建国以来、百年奋斗。1981年评价毛泽东晚年错误，与把毛泽东思想界定为经过实践检验的正确理论成果，是可以同时成立的。","contrasts":[{"wrong":"三份历史决议都在党的全国代表大会上通过。","reason":"把中央全会与党代会混为一类。","correction":"分别是六届七中、十一届六中、十九届六中全会。"},{"wrong":"1981年历史决议否定毛泽东思想。","reason":"混淆对具体错误的评价与理论体系的历史地位。","correction":"决议作出错误评价，同时坚持和发展毛泽东思想。"}],"question_design":"以年份—会议—标题和重点配对，不扩展起草人数及修改稿次。","related_ids":[],"source_ids":["HS26","HS16","HS01"],"exam_eligible":true},{"id":"H24","module_id":"H","title":"十二大与十二届三中：道路命题与经济体制认识","priority":"B","new":false,"correct":["1982年党的十二大，邓小平在开幕词中提出走自己的道路、建设有中国特色的社会主义。","1984年十二届三中全会通过经济体制改革决定，提出社会主义经济是公有制基础上的有计划的商品经济。","十二大、十二届三中全会并不是同一场会议；前者为党代会，后者为该届中央委员会的一次全会。"],"why":"“走什么道路”是总体方向；“商品经济与社会主义制度是否兼容”是经济体制认识。改革概念逐步发展，不能把1992年市场经济改革目标直接提前给1982年或1984年。","contrasts":[{"wrong":"1982年十二大确定建立社会主义市场经济体制。","reason":"将1992年十四大的成果提前十年。","correction":"十二大记中国特色社会主义道路；十四大记市场经济体制改革目标。"},{"wrong":"有计划的商品经济与计划经济、市场经济三个名称完全同义。","reason":"忽略不同阶段政策概念的特定含义。","correction":"按1984年文件语境识别，不将概念简单抹平。"}],"question_design":"主要练12大—13大—14大近邻对照，1984节点为理解补充。","related_ids":[],"source_ids":["HS27","HS28","HS31"],"exam_eligible":true},{"id":"H25","module_id":"H","title":"十三大之一：社会主义初级阶段两个判断","priority":"A","new":false,"correct":["1987年十三大系统阐述社会主义初级阶段理论，完整概括党在社会主义初级阶段的基本路线，并制定三步走发展战略。","初级阶段包含两个相连判断：我国社会已经是社会主义社会；我国社会主义社会仍处于初级阶段。","“已经是”防止否认制度性质，“仍初级”防止超越现实发展条件。"],"why":"制度性质和发展程度不是同一个变量。承认社会主义，不等于已经富足发达；承认不发达，也不等于尚未进入社会主义。这种双重限定有助于理解为何既坚持制度方向，又要求发展生产力和改革。","contrasts":[{"wrong":"处于初级阶段，说明我国当时尚未进入社会主义社会。","reason":"用发展程度低否定制度性质。","correction":"已是社会主义，但发展程度仍在初级阶段。"},{"wrong":"十三大才第一次开始改革开放。","reason":"把理论系统概括误当成改革起点。","correction":"改革开放关键转折在1978年十一届三中全会。"}],"question_design":"三项成果可以成组记忆；理论、路线、战略不是同义词。","related_ids":[],"source_ids":["HS29","HS44"],"exam_eligible":true},{"id":"H26","module_id":"H","title":"十三大之二：一个中心、两个基本点","priority":"A","new":false,"correct":["基本路线的核心概括是“一个中心、两个基本点”：以经济建设为中心，坚持四项基本原则，坚持改革开放。","四项基本原则是坚持社会主义道路、人民民主专政、中国共产党的领导、马克思列宁主义毛泽东思想。","经济建设为中心、四项基本原则、改革开放分别关联发展任务、政治方向和发展动力；不能把三者列成互相取代的选项。"],"why":"基本路线同时约束做什么、沿什么方向、怎样推进。只抓建设而忽略制度方向，或把坚持原则解释成拒绝一切改革，都把组合关系拆坏了。三者功能不同，但相互联系。","contrasts":[{"wrong":"两个基本点是经济建设和改革开放。","reason":"把中心挪进基本点，漏掉四项基本原则。","correction":"中心为经济建设；基本点为四项基本原则与改革开放。"},{"wrong":"四项基本原则中的“道路”指任何具体政策都不得调整。","reason":"把政治制度方向扩张为政策一成不变。","correction":"基本政治方向与可调整的具体政策分别判断。"}],"question_design":"可作清单纠错、核心与组成关系判断；不以“改革/坚持”字面相反制造伪冲突。","related_ids":[],"source_ids":["HS30","HS44"],"exam_eligible":true},{"id":"H27","module_id":"H","title":"十三大之三：原三步走与当前现代化时间表","priority":"A","new":false,"correct":["1987年十三大制定的原三步走：第一步解决温饱；第二步到20世纪末达到小康；第三步到21世纪中叶基本实现现代化。","原战略第一步对应20世纪80年代发展任务，常用到1990年表述；这是历史方案，不能用当前目标替换其第三步的时间。","当前目标中的2035年基本实现社会主义现代化，属于后来的战略安排；它不改变1987年原三步走当时如何表述的历史事实。"],"why":"规划和战略会随着条件变化而调整。历史题问“当时提出什么”，应按当时文本；当前政治题问“现在目标是什么”，应按现行安排。把新时间表回填旧会议，是很自然却很常见的错法。","contrasts":[{"wrong":"十三大原三步走第三步的目标年份为2035年。","reason":"将当前现代化时间安排倒填到1987年。","correction":"原三步走第三步为21世纪中叶基本实现现代化。"},{"wrong":"三步走提出于1956年社会主义建设时期。","reason":"把改革开放时期成果放到前一专门分期。","correction":"三步走由1987年十三大制定。"}],"question_design":"题干必须明确“十三大原三步走”或“当前战略安排”；不使用无时间限定的第三步问法。","related_ids":[],"source_ids":["HS29","HS44","HS36"],"exam_eligible":true},{"id":"H28","module_id":"H","title":"1992—1993：认识突破、确立目标、搭建制度框架","priority":"A","new":false,"correct":["1992年邓小平南方谈话强调计划和市场都是经济手段，不能用计划多一点还是市场多一点机械区分社会主义与资本主义。","1992年十四大明确我国经济体制改革目标是建立社会主义市场经济体制。","1993年十四届三中全会通过相关决定，把十四大目标系统化、具体化，提出建立社会主义市场经济体制的基本框架。","三个有利于标准分别联系社会主义社会生产力、社会主义国家综合国力、人民生活水平。"],"why":"一项改革先要解除认识障碍，再形成正式目标，再设计制度架构。确定市场经济目标，不代表否定宏观调控，也不意味着当年所有制度已建设完成。","contrasts":[{"wrong":"十四大宣布社会主义市场经济体制已经建成。","reason":"把改革目标错换成完成状态。","correction":"十四大确定建立该体制的目标。"},{"wrong":"1993年十四届三中全会第一次提出市场经济改革目标。","reason":"把具体化方案当成首次定目标。","correction":"目标由1992年十四大确立，次年全会给出框架。"},{"wrong":"南方谈话认为社会主义必须取消一切计划。","reason":"把计划市场都是手段误解为只准用一种手段。","correction":"承认市场机制与必要计划、宏观调控可以并存。"}],"question_design":"最适合动词替换题：论述、确定、具体化、建成；不只背1992。","related_ids":[],"source_ids":["HS28","HS31","HS32"],"exam_eligible":true},{"id":"H29","module_id":"H","title":"指导思想的历史节点：毛泽东思想与邓小平理论","priority":"A","new":false,"correct":["1945年七大把毛泽东思想确立为党的指导思想并载入党章。","1992年十四大已将“邓小平同志建设有中国特色社会主义的理论”写入党章。","1997年十五大以“邓小平理论”的规范概括，把它同马克思列宁主义、毛泽东思想一道确立为党的指导思想并载入党章。"],"why":"一个理论被逐步概括、被写入文件、以特定名称确立指导地位，是不同制度节点。学习表格常只列“十五大—邓小平理论”，便容易误以为1992年党章完全没有相关理论内容。训练要保留动词和名称的限定。","contrasts":[{"wrong":"1935年遵义会议将毛泽东思想写入党章。","reason":"把领导路线的转折换成1945年七大的党章节点。","correction":"毛泽东思想确立为指导思想并入章看七大。"},{"wrong":"1997年以前，邓小平建设有中国特色社会主义理论从未写入党章。","reason":"忽略十四大党章已载入相关理论。","correction":"1992年理论内容入章；1997年以邓小平理论概括确立指导地位。"}],"question_design":"避免裸问“邓小平理论何时写入党章”后又以1992细节制造争议；明确规范名称与指导地位。","related_ids":[],"source_ids":["HS02","HS31","HS33"],"exam_eligible":true},{"id":"H30","module_id":"H","title":"2002、2007、2012、2017：写入与确立的区别","priority":"A","new":false,"correct":["2002年十六大把“三个代表”重要思想确立为党的指导思想并写入党章。","2007年十七大将科学发展观等重大战略思想写入党章；2012年十八大把科学发展观确立为党的指导思想。","2017年十九大把习近平新时代中国特色社会主义思想确立为党的指导思想并写入党章。"],"why":"尤其科学发展观有两个高频容易合并的节点：首次写入党章与作为指导思想列入行动指南不在同一届大会。它提示一切“首次、确立、形成、提出”的题都要核对动作，不能只认大会数字。","contrasts":[{"wrong":"科学发展观首次写入党章是在2012年十八大。","reason":"忽略2007年已经入章。","correction":"2007写入；2012确立指导思想。"},{"wrong":"习近平新时代中国特色社会主义思想在2012年十八大写入党章。","reason":"将新时代起点与特定思想入章节点互换。","correction":"入章并确立指导思想为2017年十九大。"}],"question_design":"适合名称—大会—动作匹配；不扩为各次大会全部政策清单。","related_ids":[],"source_ids":["HS34","HS35","HS36"],"exam_eligible":true},{"id":"H31","module_id":"H","title":"人物题先定位事迹时代，不把题词年代当事迹年代","priority":"B","new":false,"correct":["李大钊是建党先驱，《青春》文章发表于1916年；其主要革命活动对应建党前后。","焦裕禄在20世纪60年代河南兰考工作，是社会主义建设时期的典型人物。","“两弹一星”主要创业成就集中于新中国社会主义建设阶段；题目可能通过“惊天动地、隐姓埋名”等群体标签指向这一事业。","判断“主要事迹发生于何时”时，应定位被歌颂的人或事业；后人写诗、题词、授勋的年代不是该人物事迹年代。"],"why":"这种题分两步：先还原对象，再放到历史阶段。直接看材料引用的句子什么时候写成，会把纪念叙述的时间和事件本身的时间混在一起。群体标签也不能无依据压缩成某一人的独占原话。","contrasts":[{"wrong":"某首歌颂焦裕禄的词写于改革开放后，所以焦裕禄主要事迹属于改革开放时期。","reason":"把纪念作品的时间代替人物工作时间。","correction":"焦裕禄在兰考的主要事迹发生于20世纪60年代。"},{"wrong":"凡提“隐姓埋名”就能唯一确定某位科学家个人。","reason":"群体性叙述未必有唯一人物对应。","correction":"结合具体材料区分人物、群体和事业，不制造唯一原话归属。"}],"question_design":"框架内的候选补漏。可做时代归类；不背生卒年月和科学工程参数。","related_ids":[],"source_ids":["HS37","HS38","HS01"],"exam_eligible":true},{"id":"H32","module_id":"H","title":"五年计划历史：起点、调整间隔、名称变化","priority":"A","new":false,"correct":["第一个五年计划的实施期为1953—1957年；不要从1949年建国直接连续数五年。","二五为1958—1962年，1963—1965年有三年继续调整，三五从1966年开始；因此不能用1953加5的机械公式推全部届次。","从十一五（2006—2010）开始，名称由五年“计划”改为五年“规划”。十五指第十个五年计划（2001—2005），十五五指第十五个五年规划（2026—2030），二者不同。","十四五为2021—2025；十五五为2026—2030。规划编制、批准、实施制度详见国家制度与规划模块。"],"why":"名称变化反映市场经济条件下宏观战略引导与政府职责的调整，不意味着国家停止规划，也不能把所有具体指标都变成对市场主体的行政指令。历史时间轴中的间隔解释了为什么“从一五按连续等差数列算到今天”会出错。","contrasts":[{"wrong":"第一个五年计划从1949年开始。","reason":"把国家成立与国民经济恢复后的计划起点合并。","correction":"一五实施起点为1953年。"},{"wrong":"十三五才开始把计划改名为规划。","reason":"换成了更近、但错误的届次。","correction":"改名从十一五开始。"},{"wrong":"十五就是十五五的简称。","reason":"中文届次“十”和“十五”以及尾字用途混淆。","correction":"十五为第十个五年计划；十五五为第十五个五年规划。"}],"question_design":"与中央—省规划模块合并去重；这里只需五个时间锚点和一次间隔，不背全部建设项目。","related_ids":["P4-12","P4-13","LAW-012"],"source_ids":["HS39","HS40","HS41","T15"],"exam_eligible":true},{"id":"LAW-001","module_id":"LAW","title":"法律结构要同时看“管什么”和“谁制定”","priority":"A","new":false,"correct":["法律部门按调整的社会关系和规范特点分类，例如民法商法、行政法、刑法、生态环境法；法律渊源及效力层级则关注宪法、法律、行政法规、地方性法规、规章等形式。前一组是领域分类，后一组是制定权限与效力关系，两条轴不能混排。"],"why":"同一领域可以同时存在法律、行政法规和地方性法规；一部法律也可能含有不同性质的规则。先问事件涉及何种关系，再问引用的规范是谁依何种程序制定，才不会把“行政法”误当成“行政法规”。","contrasts":[{"wrong":"行政法就是国务院制定的行政法规。","reason":"把法律部门和法的形式混为一谈。","correction":"行政法是领域；行政法规是国务院依法制定的一种规范形式。"},{"wrong":"地方性法规只能处理地方事务，与民商、生态环境等法律部门无关。","reason":"地域权限不等于内容领域。","correction":"地方性法规可以在权限范围内涉及多种法律领域。"}],"question_design":"适合概念配对和短情境归类；不要仅凭题名中的“行政”二字作答。","related_ids":[],"source_ids":["LAW-S01","LAW-S05"],"exam_eligible":true},{"id":"LAW-002","module_id":"LAW","title":"看制定主体识别法律、法规、规章","priority":"A","new":false,"correct":["全国人大及其常委会行使国家立法权；全国人大制定和修改基本法律，常委会制定其他法律并可在全国人大闭会期间依法部分补充修改基本法律。国务院依法制定行政法规；有立法权的地方人大及其常委会制定地方性法规；国务院有关部门和有规章制定权的地方政府制定相应规章。"],"why":"名称只是线索，制定主体和法定权限才决定规范形式。国务院公布的《全民阅读促进条例》属于行政法规；“条例”也可能是地方人大制定的地方性法规。主席公布法律是法律公布程序，不能据此说法律由主席个人制定。","contrasts":[{"wrong":"文件叫“条例”，所以一定是国务院的行政法规。","reason":"同一名称可能对应不同制定主体。","correction":"核对制定机关和法律形式。"},{"wrong":"省政府可以制定地方性法规。","reason":"把地方政府和地方人大职权交换。","correction":"省政府制定地方政府规章；省人大及其常委会制定地方性法规。"}],"question_design":"给出制定机关和名称判断规范类别；若考特区授权或自治条例，必须另给授权/自治条件，不套普通规则。","related_ids":[],"source_ids":["LAW-S01","LAW-S10"],"exam_eligible":true},{"id":"LAW-003","module_id":"LAW","title":"效力层级不是一根把所有文件串起来的绳","priority":"A","new":false,"correct":["宪法效力最高；法律高于行政法规、地方性法规、规章；行政法规高于地方性法规、规章。地方性法规高于本级和下级地方政府规章。部门规章与地方政府规章之间具有同等效力，在各自权限范围内施行；地方性法规与部门规章冲突不能简单按“中央部门高于地方”判断。"],"why":"层级规则比较的是特定法律形式，不是机关在日常印象中谁更“大”。地方人大制定的法规与国务院某部门制定的规章发生冲突，有专门处理程序，不能自行画成一条统一高低顺序。","contrasts":[{"wrong":"部门规章来自中央，因此当然高于地方性法规。","reason":"行政隶属直觉代替法定冲突规则。","correction":"不能一概如此；不能确定如何适用时按立法法规定处理。"},{"wrong":"法律由全国人大常委会制定，效力低于全国人大制定的法典。","reason":"把制定权限差异解释成“法典”独立效力等级。","correction":"法典属于法律层次；具体冲突看特别规定、时间和法定解决规则。"}],"question_design":"只考确定的层级关系；地方性法规与部门规章的完整裁决步骤列为B级，不用复杂冲突链拖长训练。","related_ids":["P3-07","LAW-004","LAW-005"],"source_ids":["LAW-S01","LAW-S02"],"exam_eligible":true},{"id":"LAW-004","module_id":"LAW","title":"新法、特别法、上位法分别解决不同冲突","priority":"B","new":true,"correct":["先判断效力层级和法定适用范围；在同一效力位阶并满足立法法相应条件时，同一机关制定的规范中特别规定优于一般规定、新规定优于旧规定。这些规则不能越过上位法，更不能使普通法律高于宪法。新的“一般规定”与旧的“特别规定”冲突且不能确定如何适用时，不能仅喊“新法优先”。规范一般不溯及既往，保护权利利益的特别规定是法定例外。"],"why":"“新”回答时间先后，“特别”回答具体适用对象，“上位”回答效力层级。三个维度不能互相覆盖。民法典第11条明确保留其他法律对民事关系的特别规定，正好反证法典不是一出现就压倒所有单行法。","contrasts":[{"wrong":"法典较新，所以任何民事单行法一律不再适用。","reason":"忽略特别规定及是否已被明文废止。","correction":"先查适用范围、特别规定和废止条款。"},{"wrong":"新法生效后，所有此前行为都直接按新法评价。","reason":"忽略时间效力与过渡规则。","correction":"一般不溯及既往；有特别规定时按特别规定。"}],"question_design":"题干必须写清规范制定机关、效力位阶、适用范围、时间和一般/特别关系；新法/特别法优先不可越过宪法或其他上位法。不要编需复杂司法解释才能唯一作答的案例。","related_ids":[],"source_ids":["LAW-S01","LAW-S02"],"exam_eligible":true},{"id":"LAW-005","module_id":"LAW","title":"法典化：把一个领域组织成有内在结构的法律","priority":"A","new":false,"correct":["法典化是通过立法对一领域规则作系统整合、编订纂修、协调和必要更新，形成有统一结构、原则与制度联系的法典。法律汇编通常是将现有文本编在一起，汇编本身不当然改变原法效力。制定一部针对特定事项的单行法，也不等于完成法典化。"],"why":"像重构大型系统：不仅把文件搬到一个目录，还处理重复定义、规则冲突、共同原则、漏洞与前后衔接。法律生效和旧法废止来自法定立法安排，不来自编书动作。","contrasts":[{"wrong":"把所有环境法律装订成一本书，就是生态环境法典。","reason":"只做物理汇集，没有法定整合与生效。","correction":"法典须依法编纂、通过和公布。"},{"wrong":"法典化意味着该领域今后只准有一部法律。","reason":"系统化不等于穷尽全部特殊规则。","correction":"法典可以与相关专门法律并行，具体看立法安排。"}],"question_design":"适合“编纂/汇编/单行立法”三者辨析；类比用于理解，不作为法律定义原话。","related_ids":[],"source_ids":["LAW-S02","LAW-S05"],"exam_eligible":true},{"id":"LAW-006","module_id":"LAW","title":"民法典七编：权利、行为和救济组织在一起","priority":"B","new":false,"correct":["民法典于2020年5月28日通过，2021年1月1日施行，七编为总则、物权、合同、人格权、婚姻家庭、继承、侵权责任，另有附则，共1260条。施行时婚姻法、继承法、民法通则、收养法、担保法、合同法、物权法、侵权责任法、民法总则九法同时废止。"],"why":"总则提供主体、行为、权利和责任的一般规则；物权看物的归属利用，合同看交易关系，人格权保护人的尊严与人格利益，婚姻家庭继承处理家庭与财产延续，侵权责任处理侵害后的责任。人格权独立成编，不代表此前完全没有人格权保护。","contrasts":[{"wrong":"民法典包含刑事责任编。","reason":"民事权利救济与犯罪刑罚被混排。","correction":"七编中没有刑事责任编。"},{"wrong":"民法典施行后公司法等全部民商事单行法废止。","reason":"把九部列明废止法扩大为全部民商法律。","correction":"仅按明文废止清单判断；相关特别法仍可适用。"}],"question_design":"优先理解编的功能与法典化；条数、九法名单仅识别级，默认不训练生僻顺序。","related_ids":[],"source_ids":["LAW-S02"],"exam_eligible":true},{"id":"LAW-007","module_id":"LAW","title":"2026生态环境法典：通过与施行、第二部与第一部","priority":"A","new":false,"correct":["生态环境法典2026年3月12日由十四届全国人大四次会议通过，2026年8月15日起施行；截至本次核验已施行。它是继民法典后我国第二部以“法典”命名的法律，五编1242条。它属于法律，不是国务院行政法规。"],"why":"通过、公布、施行可能是不同时间。备考中最容易出现“还在编纂”“2026年通过当天即施行”“第一部法典”等版本和顺序错位；不能拿2025年草案新闻替代2026年正式文本。","contrasts":[{"wrong":"生态环境法典自2026年3月12日起施行。","reason":"把通过日期替换为施行日期。","correction":"施行日期为2026年8月15日。"},{"wrong":"生态环境法典是国务院制定的生态环境行政法规。","reason":"制定主体和规范形式均错。","correction":"全国人大通过的法律。"}],"question_design":"日期训练只抓通过年、施行日与当前状态；可将民法典与生态法典并排辨认，避免机械堆主席令序号。","related_ids":[],"source_ids":["LAW-S03","LAW-S04"],"exam_eligible":true},{"id":"LAW-008","module_id":"LAW","title":"适度法典化：吸收、保留和留空间","priority":"A","new":false,"correct":["生态环境法典采取适度法典化：10部法律编订后全部纳入，法典施行时依法废止；森林法、草原法、国家公园法、长江保护法、能源法等20余部法律择取要旨纳入或体现，继续保留；对气候变化、双碳等新需求作原则性和引领性规定，为后续制度留下空间。"],"why":"要整合的是跨领域共性和衔接，不是把所有自然资源、能源、流域规则硬塞成一本。保留专门法可承载独特制度；先给新领域共同原则，又可避免用尚不成熟的细节把未来锁死。","contrasts":[{"wrong":"法典生效后森林法、长江保护法一并废止。","reason":"混淆全部吸收废止与择要纳入保留。","correction":"它们属于继续保留的专门法律。"},{"wrong":"只有原则性规定说明该领域尚未纳入法典。","reason":"原则规范也属于法律规范。","correction":"绿色低碳和气候治理已入法典，但部分制度继续细化。"}],"question_design":"最有价值的问法是给出环境保护法/森林法等，识别“是否因本次法典施行废止”；必须按正式废止条款，不按名称猜。","related_ids":[],"source_ids":["LAW-S03","LAW-S05","E-LAW-02","E-YF-01"],"exam_eligible":true,"review_note":"核验补充：法典第1242条列明同时废止的十部全国法律（首项环境保护法，含土壤污染防治法），未列森林法；森林法继续保留，并经2026年11月6日全国人大常委会修改十五部法律的决定（第90号主席令，自公布之日起施行）修改，第25条改为省级以上林业主管部门“应当”编制林业发展规划、设区的市和县级“可以根据实际需要”编制，旧版“县级以上应当编制”已过时（E-LAW-02、E-YF-01）。"},{"id":"LAW-009","module_id":"LAW","title":"生态法典为何有污染防治、生态保护、绿色低碳三大实体编","priority":"A","new":false,"correct":["五编依次为总则、污染防治、生态保护、绿色低碳发展、法律责任和附则。污染防治关注污染物和公害治理；生态保护关注生态系统、物种、自然资源和重要地理单元；绿色低碳发展覆盖循环经济、能源节约与转型、气候变化等。"],"why":"同一现实问题可能跨编协同：工厂减排需要污染控制，也涉及能源结构；河流治理需要治污、生态修复和流域保护。三编按制度重心组织，不能理解成现实问题彼此隔绝，更不能把生态保护缩成事后罚企业。","contrasts":[{"wrong":"绿色低碳只是宣传口号，法典没有单独安排。","reason":"忽略第四编。","correction":"绿色低碳发展为独立一编。"},{"wrong":"生态保护只包括森林种树，不涉及城市乡村。","reason":"把生态环境缩为原始自然。","correction":"法典覆盖天然和人工改造环境及其联系，城市乡村也在定义中。"}],"question_design":"可以做制度重心配对；一个场景横跨多制度时不能强行断定仅属于某一编。","related_ids":[],"source_ids":["LAW-S03"],"exam_eligible":true},{"id":"LAW-010","module_id":"LAW","title":"法律部门由七到八：新增的是分类，不是新行政机关","priority":"B","new":false,"correct":["全国人大常委会法工委宪法室2026年文章明确，法律部门由七个增加至八个：宪法相关法、民法商法、行政法、经济法、社会法、生态环境法、刑法、诉讼与非诉讼程序法。这里的“部门”指法律规范的分类，不是新设一个国务院部门。宪法仍是法律体系核心。"],"why":"生态环境规范过去分散在行政法、经济法等分类中；法典与相关专门法律形成更完整规范群后，分类作相应调整。背“七个法律部门”的旧材料需要版本更新，但不必据此背每类现有多少件法律。","contrasts":[{"wrong":"新增生态环境法律部门，意味着新成立生态环境部。","reason":"把法学分类与国家机构混为一谈。","correction":"法律部门不是行政机构。"},{"wrong":"我国法律部门永远固定为七个。","reason":"把过去阶段性归类当成不变规则。","correction":"2026权威说明已调整为八个。"}],"question_design":"若出数字分类题，要注明现行截至时间；不要把2024旧题按2026新增分类倒改。","related_ids":[],"source_ids":["LAW-S05"],"exam_eligible":true},{"id":"LAW-011","module_id":"LAW","title":"生态原则落到行动：预防、系统治理、公众参与、损害担责","priority":"B","new":true,"correct":["生态环境法典第6条规定预防为主、系统治理、生态优先、绿色发展、公众参与、损害担责；任何单位和个人都有保护义务。生态修复坚持自然恢复为主、自然恢复与人工修复相结合；水资源刚性约束强调以水定城、定地、定人、定产。"],"why":"事后交钱不能替代源头预防；把污染转移到下游也不算系统治理；保护不等于所有地方不许开发，而是开发受承载力与法定边界约束。这里最适合考方向相近但行动相反的情境。","contrasts":[{"wrong":"坚持自然恢复为主，意味着任何人工修复都违法。","reason":"把为主扩大为唯一。","correction":"自然恢复与人工修复相结合。"},{"wrong":"地方先无限扩张，再跨流域调水即可满足以水定产。","reason":"把约束条件倒置为需求满足。","correction":"布局和规模应与水资源承载能力相适应。"}],"question_design":"优先场景判断；“为主”不能改“只靠”，“协同”不能改“先破坏后修复”。","related_ids":[],"source_ids":["LAW-S03"],"exam_eligible":true},{"id":"LAW-012","module_id":"LAW","title":"规划法把党的建议、政府编制、人大批准接起来","priority":"A","new":false,"correct":["国家发展规划法2026年3月12日通过并自公布之日起施行。国家发展规划指国民经济和社会发展五年规划纲要，包括根据需要提出的远景目标。依据党中央建议和部署由国务院组织编制，规划主管部门会同有关部门具体起草；报党中央、国务院审议后，由国务院提请全国人大审查批准，国务院组织实施。"],"why":"这条链把政治方向、行政专业编制和国家权力机关批准连在一起。党中央提出建议不等于跳过人大程序；发改部门承担具体工作也不等于它独自批准国家纲要。","contrasts":[{"wrong":"党中央全会通过规划建议后，建议直接等同全国人大批准的纲要。","reason":"文件性质和法定环节混同。","correction":"建议提供方向，纲要经法定编制与人大批准。"},{"wrong":"国家发展改革委独立审查批准全国五年规划。","reason":"具体编制机关被替换为批准机关。","correction":"全国人大审查批准。"}],"question_design":"适合流程排序和主体替换；此条与制度模块合并训练以免重复。","related_ids":["P4-12","H32"],"source_ids":["IPLAN"],"exam_eligible":true},{"id":"LAW-013","module_id":"LAW","title":"规划可以调整，但要走程序；省级纲要批准与备案不同","priority":"B","new":false,"correct":["国家规划公布后未经法定程序不得调整；确需调整，由国务院提出方案，报党中央同意后，提请全国人大常委会审查批准。省级五年规划纲要草案报国务院规划主管部门衔接，经本级人大批准后，再报该主管部门备案。规划体系以国家发展规划为统领、国土空间规划为基础、专项和区域规划为支撑。"],"why":"既不能把规划当随时改口的口号，也不能把长周期规划当无法应对环境变化的死命令。省级衔接和备案维护全国一致，本级人大批准则体现本级法定程序；备案不是让国家发改委代替省人大批准。","contrasts":[{"wrong":"省五年规划必须由国务院批准才生效。","reason":"把国土空间等特定规划的审批逻辑套到省五年纲要。","correction":"本级人大审查批准，向国务院规划主管部门备案。"},{"wrong":"规划法定意味着五年内无论情况怎样都不可调整。","reason":"把不得任意调整误读为不得依法调整。","correction":"按法定条件和程序可以调整。"}],"question_design":"给出“省级国民经济和社会发展五年规划纲要”，不要仅说“省规划”导致审批类型不明。","related_ids":["P4-12","P3-03"],"source_ids":["IPLAN","E-DB-07"],"exam_eligible":true,"review_note":"核验补充：国家发展规划法第21条——确需调整的国家规划提请全国人大常委会“审查和批准”；第30条——中期评估报告提请全国人大常委会“审议”，评估不自动改变规划目标；第36条——省级纲要报国务院规划主管部门衔接、经本级人大审查批准后再备案；广东省纲要2026年1月29日获批，早于该法3月12日施行，不能用第36条倒推为当时的依据（E-DB-07）。"},{"id":"LAW-014","module_id":"LAW","title":"民事、行政、刑事责任看保护对象与处理机制","priority":"A","new":true,"correct":["民事责任主要处理民事权益受侵害后的责任，行政处罚针对违反行政管理秩序的行为，刑事责任针对构成犯罪的行为。治安管理处罚是行政处罚的一类，行政拘留不是刑罚。违法给他人造成损害的，承担行政或刑事责任不当然排除民事责任；构成犯罪的不能以治安处罚替代刑事处罚。"],"why":"同一行为可能既损害私人权益，又破坏公共秩序，所以赔偿、行政处理或刑事追责之间不是选一个就全结清。分类要看法律性质，而不是是否“被关起来”“交了钱”这样的外观。","contrasts":[{"wrong":"只要被行政拘留，就说明已经构成犯罪并受到了刑罚。","reason":"用是否被限制自由替代法律性质判断。","correction":"行政拘留是行政处罚；不能据此断定构成犯罪。"},{"wrong":"被公安罚款后，对受害人便不再需要赔偿。","reason":"公法处罚与私法赔偿不同。","correction":"依法应负的民事责任仍要承担。"}],"question_design":"仅做基本法律性质分类；不扩展刑事诉讼程序。","related_ids":[],"source_ids":["LAW-S02","LAW-S07","LAW-S14"],"exam_eligible":true},{"id":"LAW-015","module_id":"LAW","title":"新治安法的时间和边界：2026施行，仍要区分违法与犯罪","priority":"A","new":true,"correct":["2025年6月27日修订通过的治安管理处罚法自2026年1月1日起施行。治安处罚包括警告、罚款、行政拘留、吊销公安机关发放的许可证件；构成犯罪的依法追究刑事责任，尚不够刑事处罚的依法给予治安处罚。"],"why":"2026题目若写“根据现行治安管理处罚法”，应使用新版本。不能把新纳入治安法的行为简单说成“从此入刑”，也不能把不构成犯罪理解为没有法律责任。","contrasts":[{"wrong":"新治安法2025年通过，因此2025年通过当天全部新规则生效。","reason":"公布通过与施行时间不同。","correction":"2026年1月1日施行。"},{"wrong":"某行为违反治安法，就是刑事犯罪。","reason":"把行政违法与犯罪混为一层。","correction":"是否犯罪须依刑法构成判断。"}],"question_design":"先识别版本再判规则；不默认训练大量罚款金额和拘留天数。","related_ids":[],"source_ids":["LAW-S07"],"exam_eligible":true},{"id":"LAW-016","module_id":"LAW","title":"治安违法记录封存：限制外部提供，不是删除或免罚","priority":"A","new":true,"correct":["现行治安管理处罚法第136条规定违反治安管理记录应予封存，原则上不得提供或公开；有关国家机关为办案需要、有关单位根据国家规定查询属于例外，依法查询单位须保密。条文没有把封存范围仅限定为未成年人。"],"why":"封存调整的是记录传播和查询方式，不是否定违法事实、撤销原处罚或保证任何职业资格都不受影响。保留合法查询例外也说明“封存”不同于把记录从系统彻底抹去。","contrasts":[{"wrong":"治安记录封存后，任何机关任何情况下都不能查询。","reason":"删掉法定查询例外。","correction":"特定办案或国家规定查询可依法进行并须保密。"},{"wrong":"封存意味着违法行为从未发生，处罚也自动撤销。","reason":"记录管理制度被误当实体免责。","correction":"处罚与记录封存是不同问题。"}],"question_design":"适合纠错句和法条边界；不要凭封存推断特定招录资格，须另核具体招录规则。","related_ids":["LAW-014","LAW-015"],"source_ids":["LAW-S07"],"exam_eligible":true},{"id":"LAW-017","module_id":"LAW","title":"治安层面的防卫：不能见到双方受伤就判互殴","priority":"A","new":true,"correct":["新治安法第19条规定，为免受正在进行的不法侵害而采取的制止行为造成损害，不属于违反治安管理行为，不受处罚；明显超过必要限度、造成较大损害的，依法处罚但应减轻，情节较轻的不予处罚。"],"why":"关键是侵害是否正在发生、行为是否为制止侵害、是否明显越过必要限度及损害程度。反击的外观相似，性质可能不同；事后追打报复已经失去制止正在侵害这一前提。","contrasts":[{"wrong":"只要把对方打伤就必须按互殴处罚。","reason":"只看损害结果，不看行为目的、起因和限度。","correction":"符合制止正在进行的不法侵害条件，可不受治安处罚。"},{"wrong":"对方先动手，因此任何强度反击和事后报复都免责。","reason":"忽略正在进行和必要限度。","correction":"须逐项满足法定边界，不能无限扩大。"}],"question_design":"案例需交代侵害状态、制止目的、必要限度，不能只写“甲先打乙”就要求唯一结论。","related_ids":[],"source_ids":["LAW-S07"],"exam_eligible":true},{"id":"LAW-018","module_id":"LAW","title":"未成年人不予处罚与不执行行政拘留不是同一件事","priority":"B","new":true,"correct":["不满14周岁违反治安管理不予处罚，但责令监护人严加管教；14至不满18周岁从轻或减轻。第23条通常不执行行政拘留的四类人群是：①14至不满16周岁；②16至不满18周岁初次违反治安管理；③70周岁以上；④怀孕或哺乳自己不满1周岁婴儿。新法对其中部分人群设例外，不能背一概不拘留。"],"why":"先判断应否处罚，再判断拘留是否执行；不执行拘留不等于无违法、无教育矫治或无民事责任。第23条例外：上述①②③情节严重、影响恶劣，或者①③一年内二次以上违反治安管理，不受前款不执行规定限制。④孕期/哺乳情形不在这一例外所列范围。这里讨论治安规则，不能类推刑事责任年龄。","contrasts":[{"wrong":"未满18岁违反治安管理一概不处罚。","reason":"不同年龄及处罚、执行规则混为一谈。","correction":"不满14不予处罚；14至不满18从轻或减轻，拘留执行另看第23条。"},{"wrong":"不执行行政拘留意味着不用承担任何其他责任。","reason":"执行豁免扩大为全面免责。","correction":"仍可能有其他依法处理、矫治教育及民事责任。"}],"question_design":"数字边界复杂，列B级；若出题必须给出精确年龄、初次与否、次数期间、情节和影响，不能条件不足。","related_ids":[],"source_ids":["LAW-S07","E-LAW-07"],"exam_eligible":true,"review_note":"核验补充：第23条第2款原文已核，可作答案依据——已满14不满16、已满16不满18初次违反、70周岁以上的人“情节严重、影响恶劣的”，以及已满14不满16、70周岁以上的人“在一年以内二次以上违反治安管理的”，不受不执行拘留的限制；怀孕或哺乳自己不满1周岁婴儿者不在例外之列；不满14周岁不予处罚另依第12条；设问须先给出“依法应当给予行政拘留”，只问是否当然不执行，不能推出必然拘留（E-LAW-07）。"},{"id":"LAW-019","module_id":"LAW","title":"民营经济促进：平等准入、平等资源、平等保护","priority":"A","new":true,"correct":["民营经济促进法2025年4月30日通过、5月20日起施行。国家实行全国统一的市场准入负面清单；清单外各类经济组织可以依法平等进入。民营经济组织依法平等使用生产要素和公共服务资源、适用支持政策；涉及经营主体生产经营活动的政策措施应经过公平竞争审查。"],"why":"要纠正的是不合理的身份歧视和市场壁垒，法定要求是依法平等。支持民营不等于民营优先于一切所有制，也不意味着清单外连安全、环保、质量等经营规则都不用守。","contrasts":[{"wrong":"支持民营经济，政府采购应无条件优先所有民营企业。","reason":"把公平竞争替换为所有制特权。","correction":"依法平等对待，各项支持须在法律和政策规定范围内。"},{"wrong":"清单外非禁即入意味着经营全程不受监管。","reason":"准入规则被扩大为免除运行规则。","correction":"依法进入后仍遵守相应法律制度。"}],"question_design":"适合政府采购、资质门槛、资源配置情境，广东营商环境模块可交叉引用，不重复计学习时间。","related_ids":[],"source_ids":["LAW-S08","E-DB-05"],"exam_eligible":true,"review_note":"核验补充：本法规定的是全国统一的市场准入负面清单；外资准入另行适用外商投资准入前国民待遇加负面清单管理制度（广东2026年国际化方案第六项），两张清单不要混写（E-DB-05）。"},{"id":"LAW-020","module_id":"LAW","title":"政府承诺与企业账款：换届不是免责按钮","priority":"A","new":true,"correct":["地方政府及部门应履行依法作出的政策承诺和订立的合同，不得以政府换届、区划调整、机构职能调整、人员更替等违约毁约。因国家或公共利益确需改变的，应依法定权限程序并补偿损失。国家机关、事业单位、国企应依法或依约及时付款；大型企业不得以收到第三方付款作为向中小民企付款条件。"],"why":"政府以组织身份作出合法承诺，不是某位领导的私人承诺，所以换人不消灭义务；公共利益调整又需要法律程序和补偿，不能被简化成合同永不可变。账款规则则防止强势主体把全部现金流风险向下游转嫁。","contrasts":[{"wrong":"新领导可以不认前任依法订立的合同。","reason":"组织责任被偷换成人员个人责任。","correction":"换届或人员更替不能作为违约理由。"},{"wrong":"为了公共利益改变承诺后，无须补偿企业。","reason":"忽略程序和损失补偿要求。","correction":"依法改变，并对由此受到的损失予以补偿。"}],"question_design":"与正确政绩观“新官理旧账”联动；题干须限定依法承诺，不能让违法承诺也变成必须照单履行。","related_ids":["P3-03","GD-013"],"source_ids":["LAW-S08"],"exam_eligible":true},{"id":"LAW-021","module_id":"LAW","title":"异地执法：禁止逐利滥权，不是禁止跨地区办案","priority":"B","new":true,"correct":["民营经济促进法要求异地执法遵守法定权限、条件和程序，健全协助机制；禁止为经济利益等目的滥用职权实施异地执法。办案应区分经济纠纷与经济犯罪；查扣冻须区分涉案与非涉案、组织与个人、涉案人与案外人财产，不能超权限范围数额时限。"],"why":"跨地域经营需要依法跨地域查案，问题在非法目的和越权方式。保护企业合法财产同样不是对企业所有财产绝对免于调查，而是让每一项强制措施有明确对象与法律依据。","contrasts":[{"wrong":"民营经济促进法禁止一切异地执法。","reason":"将被禁止的滥用行为扩大为全部跨地区执法。","correction":"合法异地执法仍可进行。"},{"wrong":"企业涉案后，可以把企业主亲属所有财产先全部冻结。","reason":"省略涉案关联、财产权属和比例边界。","correction":"严格识别财产性质，依法定条件措施处理。"}],"question_design":"适合行政行为合法性判断；不就信息不足的现实具体案件下结论。","related_ids":[],"source_ids":["LAW-S08"],"exam_eligible":true},{"id":"LAW-022","module_id":"LAW","title":"涉企检查：减少重复干扰与依法监管可以同时成立","priority":"B","new":true,"correct":["民营经济促进法第52条规定市场监管领域相关部门原则上实行随机抽对象、随机选人员并公开事项及结果；直接涉及公共安全、群众生命健康等特殊行业重点领域依法依规实行全覆盖重点监管是例外。对同一对象的多个检查事项应尽可能合并或跨部门联合。"],"why":"减少干扰针对的是重复、任意和不必要的检查，不是取消公共风险治理。随机抽查也不是任何事项都不能主动检查；对高风险领域的法定例外与一般营商便利措施要一起读。","contrasts":[{"wrong":"优化营商环境意味着检查前必须征得企业同意。","reason":"把行政法定监管改成企业自愿授权。","correction":"检查依法开展，程序合法并尽量减少干扰。"},{"wrong":"双随机一公开适用于一切行业，公共安全领域也不能全覆盖。","reason":"删掉特殊行业和重点领域例外。","correction":"符合规定的重点领域可依法全覆盖监管。"}],"question_design":"与广东亮码入企、无事不扰政策合并出题；“扫码”是可核程序工具，不能自动推定检查实体合法。","
