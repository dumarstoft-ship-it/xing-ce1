related_ids":["GD-013"],"source_ids":["LAW-S08"],"exam_eligible":true},{"id":"LAW-023","module_id":"LAW","title":"法治宣传教育法：谁执法谁普法，覆盖人的一生","priority":"B","new":true,"correct":["法治宣传教育法2025年9月12日通过、11月1日起施行。国家实行公民终身法治教育；机制为党委领导、人大监督、政府主导、各方协同、社会参与；司法行政部门主管相应区域工作，国家机关按谁执法谁普法实行责任制。内容包括法治思想、宪法、法律常识制度、实践成就和优秀传统法律文化等。"],"why":"普法不是司法行政机关单独办讲座，而是把规则解释嵌入立法、执法、案件办理、服务和教育。终身也意味着不只教在校学生。它与2024爱国主义教育法题的“内容范围、责任主体”结构相近，但本轮只据此判断练习价值，不称必考。","contrasts":[{"wrong":"普法是司法局的事，行政执法机关只需处罚不必释法。","reason":"主管机关责任被误当所有其他机关无责任。","correction":"国家机关承担普法责任，行政机关应融入日常执法服务。"},{"wrong":"中华优秀传统法律文化不属法治宣传内容。","reason":"把法治宣传狭窄化为现行条文背诵。","correction":"法律明确包含相应文化内容。"}],"question_design":"优先题型：主要内容多选、机制主体配对、执法场景是否合法履责；只背少量有区分度的词。","related_ids":[],"source_ids":["LAW-S09","LAW-E24"],"exam_eligible":true},{"id":"LAW-024","module_id":"LAW","title":"全民阅读促进条例：文化政策已形成可问的服务义务","priority":"B","new":true,"correct":["全民阅读促进条例由国务院制定，2026年2月1日施行，属于行政法规。每年4月第四周为全民阅读活动周；新闻出版主管部门负责相应工作。公共图书馆应免费开放阅览室、自习室等；社会力量可参与，数字阅读与传统阅读相结合。公益、基本、均等、便利是体系建设要求。"],"why":"国家推动文化不只靠主题宣传，还通过公共设施、服务可及、特殊群体支持形成制度。注意条文的应当、鼓励、可以不同：公共图书馆的法定义务不能直接扩张为所有商业书店必须提供全部免费服务。","contrasts":[{"wrong":"全民阅读促进条例属于全国人大制定的法律。","reason":"因重要性而误判制定层级。","correction":"国务院行政法规。"},{"wrong":"数字化发展意味着应完全替代纸质阅读。","reason":"将相结合改成替代。","correction":"支持数字与传统阅读相结合。"}],"question_design":"候选题型：日期识别、法规层级、场所义务情境；不要求背45条。","related_ids":[],"source_ids":["LAW-S10"],"exam_eligible":true},{"id":"LAW-025","module_id":"LAW","title":"国歌：看用途和场合，不只看“爱国动机”","priority":"C","new":false,"correct":["国歌法规定升国旗仪式、宪法宣誓、重大体育赛事等场合应当奏唱国歌，倡导在其他适宜场合奏唱。禁止用于或变相用于商标、商业广告，禁止用于私人丧事等不适宜场合，禁止作为公共场所背景音乐。"],"why":"庄严仪式与日常商业背景用途不同。“我出于爱国”不自动使使用方式合规；公共场所背景音乐被禁止，也不等于公共场所一概不能举行合规奏唱仪式。仓库2026-Q014无配套答案，按法第8条可独立判定C。","contrasts":[{"wrong":"为了营造爱国氛围，商场可以全天循环国歌作背景音乐。","reason":"动机没有改变禁止用途。","correction":"不能将国歌作公共场所背景音乐。"},{"wrong":"凡在公共场所奏唱国歌均违法。","reason":"禁止特定用途被扩大为禁止一切行为。","correction":"合规仪式和适宜场合可奏唱。"}],"question_design":"用户已做过真题，只安排保温错题，不把它算2026新法。","related_ids":[],"source_ids":["LAW-S11","LAW-E26"],"exam_eligible":true},{"id":"LAW-026","module_id":"LAW","title":"爱国主义教育内容：历史文化与自然河山均在范围内","priority":"C","new":false,"correct":["爱国主义教育法主要内容包括党的创新理论和相关指导思想、历史、制度成就、三类文化、国家象征标志、壮美河山和历史文化遗产、宪法法律与国家统一安全国防观念、英烈和模范事迹等。2024年1月1日起施行。"],"why":"“爱国”通过历史共同体、制度、文化、地域空间及责任意识表达，因此壮美河山并非与政治无关就自动排除。仓库2024-Q015四项分别对应法定内容，参考答案全选可由第6条核验。","contrasts":[{"wrong":"自然风景与政治无关，所以祖国壮美河山不是爱国主义教育内容。","reason":"凭日常学科分类排除法定范围。","correction":"法律明确列入。"},{"wrong":"爱国主义教育只讲党史和国旗国歌。","reason":"把部分列举当成穷尽。","correction":"范围还包括文化、法治、安全、河山遗产等。"}],"question_design":"保留一题确认旧错点即可；新训练转向普法法等增量。","related_ids":[],"source_ids":["LAW-S12","LAW-E24"],"exam_eligible":true},{"id":"LAW-027","module_id":"LAW","title":"社保缴费主体：工伤、生育由单位缴，职工不缴","priority":"C","new":false,"correct":["依社会保险法关于职工参保的规定，工伤保险费、生育保险费由用人单位缴纳，职工不缴纳；职工基本养老、基本医疗和失业保险通常由单位与职工共同缴纳。此处不推广到城乡居民、灵活就业或各类补充保险。"],"why":"题目考的是法定缴费主体，而不是谁能享受待遇，也不是实际操作由谁代扣。单位代扣代缴职工承担部分，不等于所有费用均由单位最终负担。","contrasts":[{"wrong":"工资单上的社保都由单位代缴，因此五险均无需职工负担。","reason":"经办方式和缴费义务混淆。","correction":"区分单位代扣和法定费用承担。"},{"wrong":"生育保险只关乎女职工，男性职工完全不在制度内。","reason":"由待遇直觉反推参保范围。","correction":"该法按职工参保规定，不以性别概括排除；具体待遇另查条件。"}],"question_design":"仅保留仓库2025-Q014的主体辨析，不扩展待遇数字。","related_ids":[],"source_ids":["LAW-S13","LAW-E25","E-LAW-06","E-GD-04","E-GD-06"],"exam_eligible":true,"review_note":"核验补充：本块缴费主体仍依社会保险法；《医疗保障法》2026年8月28日公布、2027年1月1日施行，截至2026-11-27尚未施行；生育医疗待遇范围（广东2026年民生实事）和新就业形态职业伤害保障（平台按单计费、按月申报缴纳）是另外的问题，不改变本块结论（E-LAW-06、E-GD-04、E-GD-06）。"},{"id":"LAW-028","module_id":"LAW","title":"首违不罚：可不罚需要条件，不能只看第一次","priority":"B","new":true,"correct":["行政处罚法第33条：违法行为轻微、及时改正、没有危害后果的，不予处罚；初次违法、危害后果轻微、及时改正的，可以不予处罚；有充分证据证明无主观过错的原则上不予处罚，法律行政法规另有规定除外。依法不予处罚仍应教育。"],"why":"“不予”与“可以不予”强度不同；“没有后果”与“后果轻微”也不同。容错要以风险与改正为条件，否则第一次严重损害公共利益也免罚，便违背制度目的。","contrasts":[{"wrong":"首次违法只要认错，行政机关必须不罚。","reason":"省略轻微后果、及时改正，并把可以换成必须。","correction":"法定条件满足时可以不予；并非首违自动免罚。"},{"wrong":"不予行政处罚就是行为合法。","reason":"处理结果不等于行为性质。","correction":"违法仍可被教育、要求改正，其他责任依规定判断。"}],"question_design":"条件组合题最有价值；明确按行政处罚法一般规定，不混入另有特殊规定的案件。","related_ids":["LAW-022","GD-013"],"source_ids":["LAW-S14"],"exam_eligible":true},{"id":"LAW-029","module_id":"LAW","title":"行政复议与诉讼：都救济行政争议，承办体系不同","priority":"B","new":true,"correct":["行政复议由县级以上政府以及法律规定的其他行政机关履职，行政诉讼由法院审理。现行复议法强调化解行政争议主渠道；通常对县级以上地方政府工作部门行为不服，向本级政府申请复议；法律对垂直管理等另有规定。不是所有案件都必须先复议，也不是一概可以跳过复议。"],"why":"复议在行政系统中纠正违法或不当行为，诉讼通过司法审查保障权利。具体管辖和前置程序取决于行为、机关与法定例外，不能死背“总找上一级”或者“总先告法院”。","contrasts":[{"wrong":"行政复议就是向法院申请复查。","reason":"复议与诉讼承办机关混淆。","correction":"向有管辖权的行政复议机关申请。"},{"wrong":"所有行政争议都可任选直接起诉，不必考虑复议前置。","reason":"忽略法律列明先复议情形。","correction":"先查是否属于法定复议前置。"}],"question_design":"训练主体区分和典型普通地方部门案件即可；税务海关等例外若出题须补明法律依据。","related_ids":[],"source_ids":["LAW-S15"],"exam_eligible":true},{"id":"LAW-030","module_id":"LAW","title":"法制时事的证据闸门：计划、草案、通过、公布、施行分开","priority":"B","new":true,"correct":["列入立法计划、征求意见、常委会审议，均不能单独证明一项规则已经现行生效；应查正式通过、公布文本及施行条款。2026年11月25日省人大常委会会议报道中，省人工智能发展促进条例和县域经济振兴条例以草案出现；截至本次检索未取得其完整通过公布生效依据，不收入现行法正确答案库。"],"why":"这是证据状态判断，不是断言到11月27日一定尚未通过。省级与广州、深圳同名近名法规也不能混用。网页转载日期、URL年份、草案页面所谓有效标签，都不能代替正式施行条款。","contrasts":[{"wrong":"某条例已列入年度立法工作计划，所以相关义务现在即可据此处罚。","reason":"计划不是已生效规则。","correction":"须找到有权机关正式文本和施行依据。"},{"wrong":"广州市某条例已通过，所以广东全省同名条例已生效。","reason":"地域和制定机关偷换。","correction":"逐一核规范全名、主体、适用地域、程序与生效。"}],"question_design":"这个块默认只生成“如何核验法律状态”的元规则题；草案实质条文不生成现行法题。","related_ids":["GD-020"],"source_ids":["LAW-S01","LAW-S16","E-YF-03","E-LAW-03","E-LAW-06","E-YF-02"],"exam_eligible":true,"review_note":"核验补充：11月25日会上由省政府就人工智能发展促进、县域经济振兴两项草案作说明，两项也列在2027年度立法计划征求意见稿“继续审议项目”（该计划本身仍在征求意见）；已公布未施行的实例有检察公益诉讼法、医疗保障法和《广东省规范性文件制定和管理监督条例》，均自2027年1月1日起施行，截至2026-11-27不能据其裁定当日权利义务（E-YF-03、E-LAW-03、E-LAW-06、E-YF-02）。"},{"id":"GD-001","module_id":"GD","title":"2026广东高质量发展大会：两业协同的年度主题","priority":"A","new":false,"correct":["2026年2月24日广东高质量发展大会聚焦制造业与服务业协同发展。理解重点是两者互相增强，不是用服务业替代制造业。"],"why":"制造活动既需要研发、设计、金融、物流等服务，也会产生服务的新需求。广东选择这个主题，考题可同时测试年度事实和产业关系，记一个会名之外，还要会识别实际举措。","contrasts":[{"wrong":"2026大会转向服务业，意味着制造业当家退出。","reason":"把协同发展误读成发展重心之间的替代。","correction":"仍强调制造业基础，同时提升服务业的支撑和增值作用。"}],"question_design":"会名—年份—主题配对，或用工厂研发/售后/供应链场景判断两业协同；不要把所有服务业举措都说成放弃制造业。","related_ids":[],"source_ids":["GD-S02","E-DB-04"],"exam_eligible":true,"review_note":"核验补充：11月25日省人大常委会联组会议就两业协同开展专题询问，常委会组成人员和人大代表提问、省政府11个部门负责同志到会应询；会上讲的“制造业服务化、服务业制造化、平台生态化”是落实路径，不能替代2月全省高质量发展大会的主题名称，会上谈到研究制定法规也不等于已经通过法规（E-DB-04）。"},{"id":"GD-002","module_id":"GD","title":"制造业服务化与服务业制造化：看从哪一端向哪一端延伸","priority":"A","new":false,"correct":["制造企业从卖产品延伸到研发、运维、整体解决方案等，可体现制造业服务化。设计、电商等服务主体依靠渠道、数据、技术，通过委托制造等方式进入产品制造环节，可体现服务业制造化；不要求必须自建工厂。"],"why":"这里考的是业务边界的延伸方向。一个卖设备的企业开始卖设备全生命周期维护，是制造端长出服务；一家设计平台组织生产自有品牌产品，是服务端进入制造。判断依据不是企业有没有厂房，而是原业务与新增业务之间的关系。","contrasts":[{"wrong":"电商平台委托工厂生产自有品牌产品，因为没有厂房，所以不可能体现服务业制造化。","reason":"把制造化狭窄理解为资产必须归服务企业所有。","correction":"委托制造、品牌授权等本来就是方案列明的延伸方式。"},{"wrong":"制造企业对外提供设备维护属于服务业制造化。","reason":"把延伸方向倒置。","correction":"这是制造企业扩展服务，可体现制造业服务化。"}],"question_design":"给两个简短企业案例做方向配对；必须交代企业原业务，避免单凭某项兼营业务强行确定行业统计归属。","related_ids":["P2-04","P2-07"],"source_ids":["GD-S03"],"exam_eligible":true},{"id":"GD-003","module_id":"GD","title":"生产性服务看服务对象和功能，不看有没有实体产品","priority":"B","new":false,"correct":["为生产经营提供研发设计、检验检测、物流、供应链、融资等支撑的服务，是理解生产性服务业的典型入口；面向居民生活的服务有另一侧重点。具体业务需按功能判断，不能仅按企业名称二分。"],"why":"一辆卡车给工厂配送零部件，与给居民送生活物品，服务功能不同。产业融合后，同一企业可能同时面向企业和居民。题目若不给具体业务，不能仅凭‘金融’或‘物流’标签断言其全部服务的属性。","contrasts":[{"wrong":"服务业不生产有形商品，因此都脱离实体经济。","reason":"把有形商品生产当作支持真实生产活动的唯一形式。","correction":"设计、物流、检验等可以直接支撑实体生产。"},{"wrong":"企业属于物流行业，所以其每项业务必然都是生产性服务。","reason":"省略了具体服务对象和业务用途。","correction":"题目需给出为产业生产经营提供服务的条件。"}],"question_design":"具体案例判断，不考脱离业务条件的绝对归类。","related_ids":[],"source_ids":["GD-S03","GD-S01","E-GD-07"],"exam_eligible":true,"review_note":"核验补充：2026年6月13日《广东省推进服务业扩能提质实施方案》（粤府〔2026〕36号）分两条方向——推动生产性服务业向专业化和价值链高端延伸、推进生活性服务业高品质多样化便利化发展；同文“力争到2030年全省服务业增加值突破11万亿元”是2030年的努力目标，不是2026年的GDP目标（E-GD-07）。"},{"id":"GD-004","module_id":"GD","title":"新兴/未来产业必须锁定文件：生物制造是防误设答案的关键例子","priority":"A","new":true,"correct":["国家2025年十五五《建议》和2026年国家《纲要》在未来产业部分列生物制造；广东2026年政府工作报告把生物制造列在新兴产业段。训练题必须写明依据哪个文件、哪一年，不能给所有文件建立永久统一的行业分类表。"],"why":"这些名单服务于特定规划文本，并非对每项技术作永恒的本体分类。实际材料已经出现不同文本的列举差异，因此先辨认题干的文件范围，才有唯一可靠的答案。不要自行推断某份文件写错。","contrasts":[{"wrong":"生物制造在任何国家或地方文件中都只能列为未来产业。","reason":"用一份文件覆盖另一份文件，已与广东2026报告的实际表述不符。","correction":"注明国家建议/国家纲要/广东年度报告的来源范围。"},{"wrong":"传统产业就是落后产业，先进制造只存在于新兴产业。","reason":"混淆产业发展阶段与制造技术、质量和效率水平。","correction":"传统产业也可以通过改造升级形成先进制造能力。"}],"question_design":"按指定文件列举判断；默认不用生物制造等跨文件归类不同的项目做无出处裸题。","related_ids":["P2-16","P2-08"],"source_ids":["GD-S01","G15SUG","T15","E-DB-01"],"exam_eligible":true,"review_note":"核验补充：同为“十五五”纲要，国家纲要第五章第二节把生物制造列在“前瞻布局未来产业”，《广东省国民经济和社会发展第十五个五年规划纲要》（2026年1月29日省人大批准）与广东2026年政府工作报告一样列在新兴产业，中央2026年10月《关于发展新质生产力的意见》第（八）项仍列未来产业；题面只写“据十五五纲要”不能设唯一答案，必须写明国家或广东省及文件全名（E-DB-01）。"},{"id":"GD-005","module_id":"GD","title":"先进制造业是骨干，现代化产业体系仍包括一二三产业","priority":"B","new":false,"correct":["广东强调以先进制造业为骨干构建现代化产业体系，同时推进一二三次产业协调融合。骨干指重要支撑，不等于整个产业体系只有制造业；产业升级也包括传统产业改造。"],"why":"骨干像一个系统里的主要支撑部分。农业提供食物和原料，服务业参与研发、融资和流通，制造业需要与它们协同。若把骨干直接等同全体，就会把现代化产业体系误缩成工业清单。","contrasts":[{"wrong":"构建以先进制造业为骨干的体系，应主要淘汰传统产业并压缩农业服务业。","reason":"把突出支撑环节变成排斥其他产业，也忽略传统产业升级。","correction":"统筹传统、新兴、未来产业及三次产业的协同发展。"}],"question_design":"关系判断、案例判断；不用‘骨干’推出所有行业占比必须相同或制造业占比越高越好。","related_ids":[],"source_ids":["GD-S02","GD-S07"],"exam_eligible":true},{"id":"GD-006","module_id":"GD","title":"年度目标、五年目标和已实现成果要分开","priority":"C","new":true,"correct":["广东2026年政府工作报告提出当年GDP增长4.5%—5%的预期目标；十五五时期提出年均增长5%左右。二者的时间范围不同，也都不等于已实现的统计结果。"],"why":"一个是单年增长目标，一个是五年期间的年均目标。命题人可不考复杂经济学，只把时间范围或‘预期’换成‘已经达到’，就造出错误选项。精确数字本身作为低优先级补充，核心是读清时间和语气。","contrasts":[{"wrong":"广东2026年GDP已经增长5%左右，因为规划作了这一规定。","reason":"将规划目标写成统计事实，并混用单年与五年年均口径。","correction":"保留预期目标、时间范围和年度口径。"}],"question_design":"文件信息辨识；不从目标推导年底实际增速。","related_ids":[],"source_ids":["GD-S01","GD-S07","E-DB-02","E-PT-02"],"exam_eligible":true,"review_note":"核验补充：4.5%—5%是广东2026年政府工作报告“主要预期目标”中的全年预期，5%左右出自《广东省国民经济和社会发展第十五个五年规划纲要》“全省GDP年均增长5%左右”，不规定每年下限；全国2026年预期同为4.5%—5%，但出自国务院政府工作报告，国家纲要对GDP只写“保持在合理区间、各年度视情提出”，没有五年年均数字（E-DB-02、E-PT-02）。"},{"id":"GD-007","module_id":"GD","title":"百千万工程的2026增量：从三年初见成效向五年显著变化推进","priority":"A","new":false,"correct":["百千万工程全称为百县千镇万村高质量发展工程；名称中的百、千、万不能机械读成恰好100个县、1000个镇、10000个村。2026年公开的行动方案围绕五年显著变化部署县域产业、县城引领、镇村赋能、集成改革、社会参与五个方面，并配套保障机制。文件发布不等于相关目标在2026年已经全部完成。"],"why":"城乡区域差距不是一次整治能解决的，需要产业承载、公共服务、要素制度和参与机制一起改变。新方案更适合考‘哪一项属于推进路径’及阶段目标，而不必把所有小项目当作独立背诵点。","contrasts":[{"wrong":"百千万工程只是农村人居环境整治工程。","reason":"把县镇村的整体高质量发展缩成村庄外观整治。","correction":"同时涉及县域产业、城镇功能、公共服务、改革等。"},{"wrong":"2026年出台五年显著变化方案，意味着2026年已经完成所有五年目标。","reason":"将部署文件当作成效验收。","correction":"分清目标、行动和已取得成果。"},{"wrong":"百千万工程仅针对恰好100个县、1000个镇、10000个村。","reason":"把工程名称中的规模概括当作精确行政单位数量，也忽略县（市、区）、乡镇（街道）、行政村（社区）的文件口径。","correction":"记全称和县镇村联动的对象范围；若考具体数量，必须注明所据文件及年份。"}],"question_design":"阶段目标与措施配对、缺项/错项辨析；不强制记五大行动的逐字排序。 名称中的数字不作为精确数量题；本次核到的2026公开方案摘要未直接核到2027这一目标年份，不依据启动年份自行换算并写入标准答案。","related_ids":[],"source_ids":["GD-S04","GD-S05","GD-S21","E-GD-01"],"exam_eligible":true,"review_note":"核验补充：2027年阶段目标已可出题——省委2022年12月8日《关于实施“百县千镇万村高质量发展工程”促进城乡区域协调发展的决定》第一部分第（四）项写明“到2027年，城乡区域协调发展取得明显成效，县域综合实力明显增强”，题目须注明依据该《决定》；2026年方案由省“百千万工程”指挥部印发，官方把五项行动概括为县域产业、县城龙头引领、镇村特色化差异化、集成式改革、社会力量参与，其签发日和逐字条款仍未核得（E-GD-01）。"},{"id":"GD-008","module_id":"GD","title":"县城、乡镇、乡村：功能互补，不是同一个层级重复建设","priority":"A","new":false,"correct":["在百千万方案语境中，县城承担连接城乡和辐射镇村的带动作用，乡镇是联城带村的重要节点；产业、服务和基础设施需按实际条件组织。"],"why":"服务设施和产业链存在规模需求。把县城做强，可承接教育医疗就业等功能；镇是连接县城与村的中间节点；村庄发展也要与周边市场相连。这是组织资源的分工，不是要求所有村都复制城市。","contrasts":[{"wrong":"为实现区域协调，每个村都应建设与县城同规模同类别的公共设施。","reason":"把基本服务可及和质量改善误写成设施规模、形式完全一致。","correction":"通过合理布局和资源下沉提高可及性，允许因地制宜。"},{"wrong":"县城做强就意味着可以放弃乡村发展。","reason":"割裂了县城带动镇村的政策关系。","correction":"县城、镇、村之间是联动关系。"}],"question_design":"县域医疗、教育、物流情境判断；如果问‘最体现哪个功能’，解释其他相关项为何不如目标项贴切，而非宣布它们全错。","related_ids":[],"source_ids":["GD-S05","GD-S04"],"exam_eligible":true},{"id":"GD-009","module_id":"GD","title":"大湾区一点两地：三个定位不要换对象","priority":"B","new":false,"correct":["粤港澳大湾区的一点两地定位对应新发展格局的战略支点、高质量发展的示范地、中国式现代化的引领地。它是区域战略定位，不能把每个词移接到任意单个园区。"],"why":"这组表述分别落在国内国际循环、发展质量、现代化实践三个层面。用这三个关联记忆，比孤立背‘一点两地’更能识别题目中的名词替换。","contrasts":[{"wrong":"一点两地是每个百千万典型村都必须取得的行政等级。","reason":"把大湾区战略定位变成基层项目资格。","correction":"按文件主语锁定粤港澳大湾区。"}],"question_design":"短语配对或主语替换；允许概念理解，但原文填空必须保留正式用语。","related_ids":[],"source_ids":["GD-S01","GD-S19"],"exam_eligible":true},{"id":"GD-010","module_id":"GD","title":"硬联通、软联通、心联通：识别直接着力点","priority":"A","new":false,"correct":["基础设施互联是硬联通的典型入口；标准、职业资格、政务规则和机制衔接是软联通的典型入口；民生交流、青年融合和文化交往可体现心联通。三者协同，实际项目可能跨越多个维度。"],"why":"桥修好解决物理通达，证照互认解决制度摩擦，长期生活与交流影响社会认同。题目给出一种直接措施时，可按它首先消除的障碍判断；不能把一项措施的附带效果说成它唯一的性质。","contrasts":[{"wrong":"职业资格认可属于硬联通，因为会增加跨境人员流动。","reason":"按后续效果分类，忽略措施直接作用于制度规则。","correction":"直接着力点是规则机制衔接，通常归软联通。"},{"wrong":"软联通要求粤港澳取消制度差异、统一采用一套法律。","reason":"把衔接对接误作制度消灭。","correction":"在依法和各自制度框架下实现互认、衔接与合作。"}],"question_design":"最直接体现题；题干必须限定‘直接举措’，不把跨维度项目做成所有其他解释均错误的单选。","related_ids":[],"source_ids":["GD-S07","GD-S19","E-LAW-01"],"exam_eligible":true,"review_note":"核验补充：职业资格衔接的新实例——港澳律师在大湾区内地九市执业已由2026年8月28日律师法修改决定入法（9月1日施行），司法部第151号令《粤港澳大湾区律师执业考试和执业活动管理办法》10月5日起施行；须通过大湾区律师执业考试、取得内地执业资质，限于广州等九市和规定范围的民商事法律事务，旧试点文件所列2026-10-04不是通道终止日（E-LAW-01）。"},{"id":"GD-011","module_id":"GD","title":"四大合作平台：每个只抓一根主线","priority":"B","new":false,"correct":["横琴重点联系澳门经济适度多元发展；前海重点联系深港现代服务业合作；河套重点联系深港科技创新合作。南沙应锁定文本：2019年《粤港澳大湾区发展规划纲要》提出打造广州南沙粤港澳全面合作示范区；2022年《南沙方案》提出打造立足湾区、协同港澳、面向世界的重大战略性平台。2025广东十五五《建议》继续强调南沙深化面向世界的粤港澳全面合作及门户枢纽功能。以上是辨认主线，不表示各平台只有一种产业。"],"why":"这些平台的区位、合作对象和改革任务各有侧重。选择题容易把全部正确的政策名词换错平台，因此抓‘平台—合作对象—核心任务’比背项目数量有效。","contrasts":[{"wrong":"促进澳门经济适度多元发展的核心对应平台是前海。","reason":"把琴澳主线移接到深港平台。","correction":"这一核心对应横琴。"},{"wrong":"河套主要任务既然是科技创新，就不得发展任何现代服务。","reason":"将主线理解成排他经营范围。","correction":"主线用于区分定位，不排斥配套产业。"}],"question_design":"匹配题、多选逐项判断；不以含‘金融/科创’单个词就唯一判别平台。 原文填空须区分2019大湾区纲要与2022南沙方案；全面合作示范区和重大战略性平台均有各自权威文本依据，不能把其中一种称呼当作无条件错误项。","related_ids":[],"source_ids":["GD-S18","GD-S01","GD-S22","GD-S23"],"exam_eligible":true},{"id":"GD-012","module_id":"GD","title":"2026三大营商环境方案：市场化、法治化、国际化分别解决什么","priority":"A","new":true,"correct":["2026广东分别部署市场化、法治化、国际化营商环境工作。可用三个功能理解：让要素和交易更有效；让权利保护和执法规则更稳定可预期；让跨境经营及国际往来更便利。三者相互支持。"],"why":"企业可能同时遇到融资、执法不确定、跨境办事三类障碍。给出具体问题后，先辨认主要制度抓手，就能理解方案，而不是机械猜‘哪种好政策都叫市场化’。","contrasts":[{"wrong":"市场化意味着政府不提供服务，也不监管。","reason":"把市场机制有效误解为政府退出一切职责。","correction":"市场机制与必要的公共服务、依法监管相配合。"},{"wrong":"优化国际化营商环境要求外资获得高于内资的全部权利。","reason":"把便利国际经营误解为无条件身份优待。","correction":"依据准入规则和法律保障公平参与、保护合法权益。"}],"question_design":"以问题—措施匹配为主；可考三项年度方案名称，避免把交叉措施强行绝对分类。","related_ids":[],"source_ids":["GD-S08","GD-S09","GD-S10","E-DB-05"],"exam_eligible":true,"review_note":"核验补充：国际化方案经省委、省政府同意，由省商务厅、省委外办于2026年1月31日联合印发；第六项“落实外商投资准入前国民待遇加负面清单管理制度”解决外资进入，第八项“建设‘粤企出海’综合服务港”服务粤企走出去；印发机关与同意机关要分开，年度任务也不能证明服务载体已建成（E-DB-05）。"},{"id":"GD-013","module_id":"GD","title":"亮码入企、综合查一次、无事不扰：减负不等于失去监管","priority":"A","new":true,"correct":["2026广东法治化营商环境方案要求公开涉企行政检查相关信息，推行亮码入企、分类监管及综合检查改革，以减少随意、多头、重复检查并加强监督。它不等于企业从此免受依法检查。"],"why":"企业负担既可能来自违法检查，也可能来自多个部门各来一次的重复流程。将检查主体、频次、标准和执行记录透明化，既约束执法权，也保留发现和纠正风险的能力。","contrasts":[{"wrong":"进入无事不扰清单后，即使出现明确违法线索也不得检查。","reason":"把优化日常监管方式扩大为违法免责。","correction":"是否检查仍应依法根据风险、线索和权限处理。"},{"wrong":"亮码入企是企业交费购买免检查资格。","reason":"错认制度主体与目的。","correction":"其重点是行政检查过程可识别、可监督。"}],"question_design":"简短行政执法场景判断；若考具体权限、期限、程序，须另引法律法规，不能仅凭方案创造规则。","related_ids":["LAW-021","LAW-022","LAW-028"],"source_ids":["GD-S09"],"exam_eligible":true},{"id":"GD-014","module_id":"GD","title":"2026深圳APEC：先抓地点、主题、优先领域","priority":"A","new":true,"correct":["2026年11月18—19日，APEC第三十三次领导人非正式会议已在广东深圳举办；年度主题为“建设亚太共同体，促进共同繁荣”，三大优先领域为“开放、创新、合作”。"],"why":"这是2026发生在广东、全国国际影响都很大的公开事项。地点和主题在2025年底已经公布，备考价值不依赖于假定命题人能赶上临考前新闻。初次学习先掌握这组可稳定配对的信息。","contrasts":[{"wrong":"2026深圳APEC的三大优先领域是开放、协调、共享。","reason":"把其他政治表述中的词移入年度主题。","correction":"本届对应开放、创新、合作。"},{"wrong":"2026会议的举办城市是广州，因为广州也举办了APEC高官会。","reason":"把系列会议的举办地替换成领导人会议举办地。","correction":"领导人非正式会议为深圳；系列活动可分布在其他城市。"}],"question_design":"会议层次—城市—年份—主题配对；不要把全年所有APEC活动都说成在深圳举行。","related_ids":["GD-015"],"source_ids":["GD-S11","GD-S12"],"exam_eligible":true},{"id":"GD-015","module_id":"GD","title":"为什么APEC说成员经济体，而不是21个国家","priority":"A","new":true,"correct":["APEC有21个成员经济体，成员中包括中国香港、中国台北等地区经济体。APEC合作强调自愿和协商一致，其合作承诺不等于对成员普遍施加条约义务。"],"why":"‘经济体’这个词使参与范围围绕经济合作组织起来，避免把参与资格直接等同主权国家身份。‘非正式会议’也不是不重要，而是合作机制的制度形态与具有条约义务的组织有区别。","contrasts":[{"wrong":"APEC由21个主权国家组成。","reason":"忽略地区经济体的成员身份。","correction":"应称21个成员经济体。"},{"wrong":"APEC以多数表决直接制定各成员必须执行的统一国内法律。","reason":"同时错置了决策方式和法律约束性质。","correction":"强调自愿合作、协商一致，不直接统一成员国内法律。"}],"question_design":"国际组织基本性质题；不扩展背所有成员、历届主办国。","related_ids":[],"source_ids":["GD-S13","GD-S20"],"exam_eligible":true},{"id":"GD-016","module_id":"GD","title":"APEC中国三次主办与会后新文件：分层记","priority":"C","new":true,"correct":["中国此前在2001年上海、2014年北京主办APEC领导人非正式会议，2026年为深圳。外交部已公布2026年APEC领导人深圳展望等成果。会后具体成果属于较新的更新项，默认不要求逐条背诵。"],"why":"三座城市的对应关系比数百场活动和机构名单稳定，也更容易形成明晰题目。会后文件虽真实，但没有公开命题截稿时间，不能因最新就推断必考或必不考。","contrasts":[{"wrong":"深圳会议是中国第一次主办APEC领导人非正式会议。","reason":"抹去了上海和北京的既有主办经历。","correction":"2026是第三次。"},{"wrong":"11月才公布的成果一定不会出题。","reason":"在没有依据时替命题机构设定截稿规则。","correction":"只标注信息发布时间和较低投入优先级。"}],"question_design":"城市年份配对可训练；会后成果默认放可选更新，不以公布321场活动、75项成果等数字制造大量题目。","related_ids":[],"source_ids":["GD-S12","E-DB-03"],"exam_eligible":true,"review_note":"核验补充：外交部11月19日《中国担任2026年亚太经合组织东道主成果清单》把《2026年亚太经合组织领导人深圳展望》列为会议成果文件；“成立亚太共同体研究中心（深圳）”“倡议成立世界湾区经济合作联盟（深圳）”是中方举措，后者只是倡议成立，不能说联盟已成立或成员负有加入义务（E-DB-03）。"},{"id":"GD-017","module_id":"GD","title":"海上新广东不是只发展捕捞业","priority":"B","new":false,"correct":["广东推动海洋经济高质量发展的行动方案覆盖2025—2027年，2026年公开的文本统筹海洋科技、渔业、装备、能源、运输及专业服务等。海洋经济涉及多种产业，不是把经济活动都改成捕鱼。"],"why":"海洋既是食物和资源来源，也是交通空间、工程场景和科技应用场景。同一条产业链可能需要装备制造、养殖、保险、物流和法律服务，因此海洋经济也与两业协同相连。","contrasts":[{"wrong":"海上新广东主要意味着用捕捞替代陆地制造业。","reason":"把综合海洋产业体系缩成单一初级产业。","correction":"涉及多产业及陆海统筹。"},{"wrong":"网页发表于2026年，因此方案实施期必为2026—2028年。","reason":"以网页年份擅改文件标题中的实施期。","correction":"按原文2025—2027年识别。"}],"question_design":"产业范围或文件时段辨析；不背每个海工项目参数。","related_ids":[],"source_ids":["GD-S14"],"exam_eligible":true},{"id":"GD-018","module_id":"GD","title":"现代化海洋牧场：大食物观、全产业链和生态约束","priority":"B","new":false,"correct":["现代化海洋牧场强调从种业、养殖到加工、装备等环节协同发展，推动深远海养殖并兼顾生态；并非只增加近岸网箱数量，也不等于提高野生海产品捕捞强度。"],"why":"把海洋当作食物供给空间，需要稳定苗种、抗风浪装备、养殖管理和加工冷链共同支撑。深远海拓展也增加安全和技术要求，所以不能从向海要食物推出无限开发。","contrasts":[{"wrong":"发展海洋牧场，就是不受生态约束地扩大野生海洋捕捞。","reason":"把养殖体系建设与无约束捕捞混为一谈。","correction":"关注可持续养殖、产业链和资源环境条件。"}],"question_design":"给种业—装备—养殖—加工链条识别；限定为概念与政策边界，不生成未核实的海水养殖许可程序题。","related_ids":[],"source_ids":["GD-S14","E-GD-09","E-GD-08"],"exam_eligible":true,"review_note":"核验补充：“标准海”这一特定机制已有正式依据，可以出题——县级以上政府主管部门划定适养海域、提前完成区域整体海域使用论证等前期工作，单个开放式养殖用海的海洋牧场项目据此办理审批或出让、无需重复论证；“标准海”以外的养殖用海许可仍须另核；2026年海洋牧场设施设备险只保已建成并投放海上的设施设备（E-GD-09、E-GD-08）。"},{"id":"GD-019","module_id":"GD","title":"绿美广东的增量：森林质量，而非只算种树数量","priority":"B","new":false,"correct":["广东2026林业部署继续突出森林质量提升，并统筹科学保护、系统治理和合理利用。林分优化、森林抚育等任务表明，评价不能只看新种多少棵树。"],"why":"森林的树种和结构、成活管护、生态功能与灾害风险都会影响质量。只追求一时种植数量，可能与长期生态效益脱节；这也是正确政绩观可以落到生态治理的具体场景。","contrasts":[{"wrong":"绿美建设应以短期植树总株数作为唯一成效标准。","reason":"以单一投入数量替代长期质量和生态效果。","correction":"同时关注质量、管护、生态系统功能和群众受益。"},{"wrong":"生态保护排斥任何合理利用和林业产业。","reason":"把保护与合理利用一概对立。","correction":"在资源环境约束和法律要求下统筹保护与利用。"}],"question_design":"生态治理与政绩观的情境题；不以无依据的树种排行、园林技术细节扩充常识库。","related_ids":["P3-01","LAW-011"],"source_ids":["GD-S15"],"exam_eligible":true},{"id":"GD-020","module_id":"GD","title":"年度文件中的计划、草案、通过、施行不能混写","priority":"A","new":true,"correct":["广东2026年初法治营商环境方案提出加快出台数据、人工智能、低空经济等相关条例，是立法工作安排。仅凭这一表述，不能认定某部省级条例已经通过或生效；必须另核公告和施行条款。"],"why":"制度建设要经历不同阶段。考试可把‘开展立法’换成‘已经施行’，或把广州、深圳同名法规换成广东省法规。网页题库应记录制定机关、适用地域和效力日期，缺一就容易生成错答案。","contrasts":[{"wrong":"2026方案提出加快出台人工智能发展促进条例，说明该条例已于方案发布日起生效。","reason":"把政策任务与正式立法效力混为一谈。","correction":"以正式通过公布的法规及其施行条款为准。"},{"wrong":"深圳市已经有同领域法规，因此广东全省当然适用同一部法规。","reason":"混淆制定主体和地域适用范围。","correction":"分别核对地方立法的机关、权限和适用范围。"}],"question_design":"阶段与法律效力辨析；本条不替任何尚未核实的条例生成实体权利义务题。","related_ids":["LAW-030"],"source_ids":["GD-S09","E-YF-03","E-YF-04"],"exam_eligible":true,"review_note":"核验补充：截至2026-11-27，四项省级条例只核到立法动作——人工智能发展促进、县域经济振兴两项草案于11月25日省人大常委会会议由省政府作说明，数据条例已开展立法调研（10月10日），低空经济发展条例列入2027年度立法计划征求意见稿“继续审议项目”；均未核得通过、公布、施行依据，不能断言已通过或未通过（E-YF-03、E-YF-04）。"},{"id":"K-LAW-01","module_id":"LAW","title":"港澳律师在大湾区内地九市执业：考试、资质、地域、业务","priority":"A","new":true,"correct":["《全国人民代表大会常务委员会关于修改〈中华人民共和国律师法〉的决定》由十四届全国人大常委会第二十四次会议于2026年8月28日通过，同日以国家主席第84号令公布，2026年9月1日起施行。修改决定第十项新增律师法第62条，适用于香港特别行政区法律执业者、澳门特别行政区执业律师。","律师法第62条规定的条件包括通过国务院司法行政部门组织的粤港澳大湾区律师执业考试、取得内地执业资质；执业地点逐一列举广州、深圳、珠海、佛山、惠州、东莞、中山、江门、肇庆九市；业务限于规定范围的法律业务。","配套部门规章《粤港澳大湾区律师执业考试和执业活动管理办法》由司法部以第151号令于2026年10月5日公布，同日起施行。第5条规定培训考核、通过接收执业的律师事务所申请、由广东省司法厅发证等环节；第6条把持证人可办业务界定为规定范围的民商事法律事务（含诉讼业务和非诉讼业务）。","截至2026年11月27日，修改决定和《办法》均已施行。法律设立通道，部门规章规定具体考试与执业办法；仅有港澳当地律师身份，或仅通过该项考试，均不足以按此制度直接执业；办案须同时符合执业资质、地域和业务类型要求。"],"why":"司法部介绍，此次修改将原试点上升为国家法律制度，《办法》适用后可依法定程序继续执业。国务院办公厅旧试点办法（2023年9月28日上网）曾列明延长期到2026年10月4日；沿用旧文件、把这一天当作通道终止日，会产生时效错误。可与GD-010对照：职业资格衔接是软联通的典型入口。","contrasts":[{"wrong":"持有香港律师资格，就可以按大湾区执业制度直接在深圳代理内地案件。","reason":"把港澳当地执业身份当成了内地执业资质（条件替换）。","correction":"还须通过粤港澳大湾区律师执业考试、取得内地执业资质，并在九市内办理规定范围的民商事法律事务。"},{"wrong":"通过大湾区律师执业考试，就等于取得了内地执业资质。","reason":"把考试合格当成取得执业证（阶段替换）。","correction":"依《办法》第5条，还有培训考核、经接收执业的律师事务所申请、由广东省司法厅发证等环节。"},{"wrong":"取得大湾区律师执业资质后，可以在广东全省执业。","reason":"把大湾区内地九市扩大为广东全省（地域替换）。","correction":"限于广州、深圳、珠海、佛山、惠州、东莞、中山、江门、肇庆九市。"},{"wrong":"取得大湾区律师执业资质后，可以凭此在九市担任刑事案件辩护人。","reason":"把规定范围的民商事法律事务换成刑事辩护（业务替换）。","correction":"《办法》第6条限于规定范围的民商事法律事务（含诉讼和非诉讼业务），不能单以该资质为据代理刑事案件。"},{"wrong":"旧试点文件列明延长期到2026年10月4日，此后港澳律师在九市执业的通道终止。","reason":"沿用旧文件期限，忽略已施行的国家法律和部门规章（时效错误）。","correction":"修改后的律师法2026年9月1日起施行、《办法》2026年10月5日起施行，原试点已上升为国家法律制度。"},{"wrong":"这一执业通道由司法部的部门规章设立。","reason":"国家法律与部门规章层级混淆（层级替换）。","correction":"律师法第62条设立通道，司法部规章规定具体考试与执业办法。"}],"question_design":"以情境判断为主：给出执业者身份、是否通过考试并取得内地执业资质、执业城市、业务类型，四项同时符合才能按此制度执业。题干写明修改后的律师法（2026年9月1日起施行）和/或司法部第151号令《办法》（2026年10月5日起施行），并限定“仅就这一执业通道而言”，不涉及其他执业途径。证据卡未给出的细节（执业年限、第6条第二款第三款的具体列举、培训时长等）不出题。","related_ids":["GD-010","GD-012","LAW-002"],"source_ids":["E-LAW-01"],"exam_eligible":true,"candidate":true},{"id":"K-LAW-02","module_id":"LAW","title":"森林法继续保留并于2026年11月修改：林业发展规划谁“应当”编、谁“可以”编","priority":"A","new":true,"correct":["《全国人民代表大会常务委员会关于修改〈中华人民共和国突发事件应对法〉等十五部法律的决定》由十四届全国人大常委会第二十五次会议于2026年11月6日通过，同日以国家主席第90号令公布，自公布之日起施行；截至2026年11月27日，修改后的森林法条文已生效。","修改后的森林法第25条：省级以上人民政府林业主管部门应当根据森林资源保护发展目标，编制林业发展规划；设区的市、县级人民政府林业主管部门可以根据实际需要编制林业发展规划；下级规划仍依据上级规划编制。","该决定还把森林法第74条第3款所引的土壤污染防治法改为生态环境法典。生态环境法典由十四届全国人大四次会议于2026年3月12日通过，同日以国家主席第70号令公布，2026年8月15日施行；其第1242条列明同时废止的十部法律，其中有土壤污染防治法，未列森林法。森林法继续保留并被修改。"],"why":"证据卡的结论直接取自修改决定和法典附则，未采用单独解读。理解时可对照新旧文本：2019年修订的森林法第25条把“县级以上人民政府林业主管部门”统一列为应当编制规划的主体，2026年11月6日起改为省级以上“应当”、设区的市和县级“可以根据实际需要”。","contrasts":[{"wrong":"县级以上人民政府林业主管部门一律应当编制林业发展规划。","reason":"用2019年修订文本回答2026年11月6日以后的问题，把设区的市、县级的“可以根据实际需要”换成了“应当”（版本与义务性质替换）。","correction":"省级以上应当编制；设区的市、县级可以根据实际需要编制。"},{"wrong":"修改后，设区的市、县级林业主管部门不得再编制林业发展规划。","reason":"把“可以”换成“不得”（义务性质替换）。","correction":"可以根据实际需要编制，下级规划依据上级规划编制。"},{"wrong":"森林法第74条改引生态环境法典，说明森林法已并入法典而废止。","reason":"把更新引文、修改单行法当成整部法律被废止（关系替换）。","correction":"法典第1242条废止名单有土壤污染防治法，未列森林法；森林法继续保留，并在2026年11月6日被修改。"},{"wrong":"这次修改把各类专项规划的编制义务都限定在省级以上。","reason":"把林业发展规划的规定推广到其他规划（范围替换）。","correction":"修改后的森林法第25条调整的是林业发展规划的编制主体，不能据此推广到其他专项规划；其他规划由谁编制，看各自法律的规定。"}],"question_design":"题干写明“2026年11月6日以后”或“截至2026年11月27日”及“修改后的森林法第25条”，限定为林业发展规划；用于2026年11月6日以前情境的旧题按当时文本作答，不倒改。可与LAW-008并用，考“保留并修改”与“吸收并废止”的区别，按正式废止条款判断。","related_ids":["LAW-008","LAW-030","LAW-007"],"source_ids":["E-LAW-02","LAW-S03"],"exam_eligible":true,"candidate":true},{"id":"K-LAW-03","module_id":"LAW","title":"检察公益诉讼法：已公布、2027年1月1日施行；行政公益诉讼先提检察建议","priority":"B","new":true,"correct":["《中华人民共和国检察公益诉讼法》由十四届全国人大常委会第二十五次会议于2026年11月6日通过，国家主席同日以第86号令公布；第53条规定“本法自2027年1月1日起施行”。截至2026年11月27日已公布、尚未施行。","同日以第90号主席令公布的《全国人民代表大会常务委员会关于修改〈中华人民共和国突发事件应对法〉等十五部法律的决定》自公布之日起施行；截至2026年11月27日，同日公布的两项中只有后者已施行。","根据已公布的新文本：第2条区分人民检察院办理案件与人民法院审理；第22条规定，对法定领域负有监管职责的行政机关违法行使或者不行使职权，导致国家利益或者社会公共利益受侵害的，检察院经调查后应当向行政机关提出公益诉讼检察建议；经审查仍存在第13条规定情形的，依第25条提起行政公益诉讼；第26条列举的应当终结案件的情形包括“行政机关已采取整改措施，依法履行职责”。","检察机关办理公益诉讼早已有法定实践，最高人民检察院《人民检察院公益诉讼办案规则》自2021年7月1日起施行；专门法的施行日不能充当制度起点。"],"why":"证据卡只采用已公布法条和最高检前期办案规则，没有把媒体评述作为新的法定程序。理解时可按“调查—提出检察建议—审查：整改到位、依法履职的终结案件，仍有法定起诉情形的提起行政公益诉讼—人民法院审理”的顺序把握。","contrasts":[{"wrong":"检察公益诉讼法2026年11月6日通过，当日起施行。","reason":"把通过、公布日当成施行日（阶段替换）。","correction":"第53条规定2027年1月1日起施行。"},{"wrong":"检察公益诉讼法尚未施行，检察机关目前还不能办理公益诉讼案件。","reason":"把专门法施行日当成制度起点（关系替换）。","correction":"检察机关办理公益诉讼早有法定实践，最高检办案规则2021年7月1日已施行。"},{"wrong":"同日公布的第86号、第90号主席令所公布的法律文件都已施行。","reason":"用公布日推定施行日（阶段替换）。","correction":"修改十五部法律的决定自公布之日起施行；检察公益诉讼法2027年1月1日起施行。"},{"wrong":"行政机关已整改到位、依法履行职责的，检察院仍应提起行政公益诉讼。","reason":"把终结案件的情形换成起诉（条件与结果替换）。","correction":"按已公布文本第26条，属于应当终结案件的情形。"},{"wrong":"检察院提出检察建议后，可以对行政机关作出判决。","reason":"把法院的审判职能换给检察院（主体与动作替换）。","correction":"检察院办理案件、提起诉讼，人民法院审理。"}],"question_design":"状态题可比较同日公布的第86号、第90号主席令所公布的文本，只考公布、施行和当前状态，不机械背令号。考实体程序必须在题干写明“根据已公布、将于2027年1月1日起施行的《中华人民共和国检察公益诉讼法》”，情境设在施行后或只问文本含义，不得用其裁定2026年11月的具体案件。证据卡未给出第13条的具体内容，不出相关细节题。","related_ids":["P4-07","LAW-030"],"source_ids":["E-LAW-03","E-LAW-02"],"exam_eligible":true,"candidate":true},{"id":"K-LAW-04","module_id":"LAW","title":"社会救助法：临时救助向急难发生地申请，三项条件齐备应当先行救助","priority":"A","new":true,"correct":["《中华人民共和国社会救助法》由十四届全国人大常委会第二十二次会议于2026年4月30日通过，国家主席同日以第75号令公布，2026年7月1日起施行；截至2026年11月27日已施行。","第37条：特困人员供养、最低生活保障、医疗救助、住房救助、就业救助一般向户籍所在地乡镇人民政府或者街道办事处申请，有条件的地方可以推进持居住证人员在居住地申请；临时救助的申请向急难发生地乡镇人民政府、街道办事处提出（第37条另款），可以由当事人本人或者与其共同生活的家庭成员提出。","第50条：“情况紧急、救助金额较小、需立即采取救助措施的，应当先行救助”；紧急情况解除后，按规定补充说明情况。"],"why":"全国人大常委会法工委有关负责人（司法部智慧普法平台2026年5月1日刊载）把临时救助的适用对象解释为遭受突发性、紧迫性、灾难性等困难，导致基本生活暂时出现严重困难的人员，救助方式可以包括救助金或者实物。对流动人员，先辨申请事项，再看申请地；判定“应当先行救助”须三项条件齐备。","contrasts":[{"wrong":"户籍在外省的来粤务工人员突遇急难，必须先回户籍地申请临时救助。","reason":"把临时救助的申请地换成户籍所在地（条件替换）。","correction":"临时救助向急难发生地乡镇人民政府、街道办事处提出。"},{"wrong":"最低生活保障也向急难发生地申请。","reason":"把临时救助的规则套到其他救助事项上（事项替换）。","correction":"低保等一般向户籍所在地申请，有条件的地方可以推进持居住证人员在居住地申请。"},{"wrong":"在急难发生地申请临时救助，须以持有当地居住证为前提。","reason":"把其他救助事项的居住地申请安排移到临时救助上（条件替换）。","correction":"临时救助直接向急难发生地提出。"},{"wrong":"只要情况紧急，就应当先行救助。","reason":"三项法定条件缺了两项（条件不全）。","correction":"情况紧急、救助金额较小、需立即采取救助措施三项齐备时，应当先行救助。"},{"wrong":"先行救助后，不再需要任何手续。","reason":"删去事后补充说明的要求（环节替换）。","correction":"紧急情况解除后，按规定补充说明情况。"}],"question_design":"题干给出申请事项（临时救助或其他救助）、急难发生地和户籍地；要判定“应当先行救助”，必须同时给出情况紧急、救助金额较小、需立即采取救助措施三项事实。证据卡未写明先行救助的实施机关和金额标准，不出相关细节题；不与广东年度低保比例（E-GD-02）混用。","related_ids":["P4-07"],"source_ids":["E-LAW-04"],"exam_eligible":true,"candidate":true},{"id":"K-LAW-05","module_id":"LAW","title":"民族团结进步促进法：统战部门牵头协调，9月第四周为宣传周","priority":"B","new":true,"correct":["《中华人民共和国民族团结进步促进法》由十四届全国人大四次会议于2026年3月12日通过，国家主席同日以第71号令公布，2026年7月1日起施行；截至2026年11月27日已施行。","该法序言把铸牢中华民族共同体意识同时列为党的民族工作和民族地区各项工作的主线。","第41条在民族工作格局中区分“党委统一领导、政府依法管理、统一战线工作部门牵头协调、民族工作部门履职尽责”，并列明各部门通力合作、全社会共同参与。牵头协调的主体是统一战线工作部门，民族工作部门承担条文明列的履职尽责职责。","第56条规定“每年9月的第四周为民族团结进步宣传周”，集中开展铸牢中华民族共同体意识宣传教育活动。宣传周按月内周次设定，每年公历日期可以不同。"],"why":"国家民委网站2026年9月22日登载的《中国民族报》文章记载，首个法定宣传周于2026年9月21日启动，多个部门共同组织实施。这是当年的活动事实，不改变第41条规定的牵头协调主体，也不使9月21日成为每年固定日期。","contrasts":[{"wrong":"民族工作由民族工作部门牵头协调。","reason":"把统战部门与民族工作部门的职责互换（主体替换）。","correction":"统一战线工作部门牵头协调，民族工作部门履职尽责。"},{"wrong":"统一战线工作部门统一领导民族工作。","reason":"把党委的统一领导换给统战部门（动作替换）。","correction":"党委统一领导，统一战线工作部门牵头协调。"},{"wrong":"首个宣传周由多个部门共同组织，说明法定牵头协调主体是多个部门。","reason":"把当年活动事实当成法定分工（依据替换）。","correction":"牵头协调的法定主体仍是统一战线工作部门。"},{"wrong":"民族团结进步宣传周从每年9月21日开始。","reason":"把首届启动日当成法定固定日期（周次与日期混淆）。","correction":"法定为每年9月的第四周，公历日期每年可以不同。"},{"wrong":"民族团结进步宣传周在每年4月的第四周。","reason":"与全民阅读活动周（《全民阅读促进条例》，每年4月第四周）混淆。","correction":"民族团结进步宣传周在每年9月的第四周。"}],"question_design":"优先考统战部门与民族工作部门的分工，日期只作附加辨认；不能把首届多部门共同组织改写成法定牵头主体发生变化；与LAW-024的全民阅读活动周对照时，写明各自文件和层级（法律／行政法规）。","related_ids":["LAW-024","P4-07"],"source_ids":["E-LAW-05"],"exam_eligible":true,"candidate":true},{"id":"K-LAW-06","module_id":"LAW","title":"医疗保障法：已公布、2027年1月1日施行；异地直接结算的“足额”限于基金应付部分","priority":"B","new":true,"correct":["《中华人民共和国医疗保障法》由十四届全国人大常委会第二十四次会议于2026年8月28日通过，国家主席同日以第80号令公布，第56条规定2027年1月1日起施行；截至2026年11月27日已公布、尚未施行。","已公布文本第32条：异地就医的参保人员在定点医药机构发生的医药费用，以“应当由医疗保障基金支付的部分”为限，经办机构“应当按照规定审核后及时足额直接结算并拨付”。“足额”限定在应由基金支付的范围之内。","新法公布日、施行日与原有服务开始办理的时间是三个不同事实。国家医保局、财政部2022年跨省异地就医直接结算通知（中国政府网页面标注2022-07-27）已区分基金支付和个人负担，并安排就医地与参保地的信息传输和结算流程。到2026年11月27日，不能直接以尚未施行的第32条裁定当日权利义务，也不能由此推出异地直接结算在2026年尚不能办理。"],"why":"全国人大常委会法工委行政法室负责人（国家医保局2026年8月31日刊载答记者问）把建立健全直接结算机制、推行联网结算、优化异地结算服务列为新法完善便民服务的措施。","contrasts":[{"wrong":"依医疗保障法，异地就医发生的医药费用都由医保基金足额支付。","reason":"把“应当由医疗保障基金支付的部分”扩大成全部费用（支付范围替换）。","correction":"“足额”以基金应付部分为限，与个人负担部分相区分。"},{"wrong":"医疗保障法2027年才施行，所以2026年还不能办理跨省异地就医直接结算。","reason":"把新法施行日当成既有服务的起点（关系替换）。","correction":"国家医保局、财政部2022年通知已安排跨省异地就医直接结算流程。"},{"wrong":"医疗保障法2026年8月28日通过，当日起施行。","reason":"通过、公布与施行混淆（阶段替换）。","correction":"2027年1月1日起施行。"},{"wrong":"2026年11月发生的异地结算争议，可以直接依医疗保障法第32条裁定。","reason":"用尚未施行的条文裁定当时的权利义务（时间替换）。","correction":"问现行依据，须按题干日期核对当时的规则。"}],"question_design":"考第32条须写明“根据已公布、将于2027年1月1日起施行的《中华人民共和国医疗保障法》”；状态题区分公布、施行、既有服务三个时间；不考具体报销比例，不推及医疗救助。","related_ids":["LAW-027","LAW-030"],"source_ids":["E-LAW-06"],"exam_eligible":true,"candidate":true},{"id":"K-GD-02","module_id":"GD","title":"城乡低保最低比例与特困人员保障标准：两个比较对象不同","priority":"A","new":true,"correct":["《2026年广东省政府工作报告》（广东省人民政府，省长孟凡利2026-01-26在省十四届人大五次会议上作报告，网页2026-01-31发布）附件1《2026年省十件民生实事》第一项，把农村低保标准占城镇低保标准的最低比例从77%调至80%以上。","同项规定特困人员基本生活保障标准不低于当地最低生活保障标准的1.6倍。前一个比例比较的是农村低保标准与城镇低保标准，后一个倍数比较的是特困人员基本生活保障标准与当地低保标准。","市级落实例：汕头市民政局《关于印发2026年全市城乡最低生活保障等社会救助标准的通知》（2026-05-26发布）列出，汕头2026年城镇、农村低保标准分别为872元、817元/人月（农村超过城镇的80%），城镇、农村特困人员基本生活供养标准分别为1396元、1308元/人月。市级金额只用来核对省定下限的含义。"],"why":"省报告给的是下限：农村低保标准要达到城镇低保标准的一定比例，特困人员基本生活保障标准要达到当地低保标准的一定倍数，各地在下限之上确定本地金额。同项还以当地上年补差水平约束当年补差；最低比例、实际比例、每户实领金额、城乡低保补差水平是不同口径。未另引官方解读，汕头通知同时列出城乡低保标准、补差水平和特困供养标准，可直接对照。","contrasts":[{"wrong":"2026年农村低保标准达到城镇低保标准的77%，就符合省定比例。","reason":"沿用了调整前的比例（时间替换）。","correction":"2026年省定最低比例为80%以上。"},{"wrong":"特困人员基本生活保障标准不低于当地低保标准的80%。","reason":"把城乡低保比例的数字套到特困标准上，比较对象和数值都换了。","correction":"特困人员基本生活保障标准不低于当地低保标准的1.6倍。"},{"wrong":"某户农村低保家庭每月实领金额不到城镇标准的80%，说明当地未达到省定比例。","rea 示，公示结果不影响发展入党的，可以列为发展对象。"},{"wrong":"新细则要求报上级党委同意，所以确定入党积极分子也要先经上级党委同意。","reason":"把发展对象环节的“同意”套到了入党积极分子环节。","correction":"确定入党积极分子后按第8条报上级党委备案。"},{"wrong":"先公示，公示无异议后再报上级党委同意。","reason":"颠倒了上级党委同意与公示的先后。","correction":"先报上级党委同意，再对拟列为发展对象的人选进行公示。"},{"wrong":"公示期不超过五个工作日；流动人员只在流入地公示。","reason":"把“不少于”改成了“不超过”，又漏掉了流出地。","correction":"公示期不少于五个工作日；对拟列为发展对象的流动人员，流出地、流入地同时公示。"},{"wrong":"细则自新华社2026年5月18日报道全文之日起施行。","reason":"把网页刊载、报道日当成了施行日。","correction":"第44条规定自发布之日起施行，中共中央办公厅发布日为2026年5月11日。"}],"question_design":"题干写明《中国共产党发展党员工作细则》2026年修订版（2026-05-11发布并施行）。分别判断：入党积极分子与发展对象两个身份阶段，上级党委“备案”与“同意”两个动作，上级党委同意与公示的先后，公示期“不少于五个工作日”，流动人员流出地、流入地同时公示。适合用跨地区流动人员情境。不用2014年旧版第13条判断现行程序；不扩展考细则其他条款。","related_ids":["P3-07"],"source_ids":["E-PT-07"],"exam_eligible":true,"candidate":true},{"id":"K-GD-10","module_id":"GD","title":"2026年省十件民生实事第六至十项：指标量的是什么","priority":"B","new":true,"correct":["2026年广东省政府工作报告附件1《2026年省十件民生实事》（省政府2026年1月26日向省人大报告，全文网页1月31日发布）第六至十项，分别涉及青少年心理健康、基层健康与检查检验互认、农村污水与河湖、食品药品监管、农村公路与出行服务；各项指标均为2026年度安排。","第六项同时写青少年心理服务和学生体育锻炼。","第七项要求扩大医疗机构间的互认项目库，用“项目数增加20%以上”衡量扩容；互认项目数的增长不能换算成某位患者就诊时的互认率。","第八项针对“已建成自然村的生活污水治理设施”安排改造提升；对既有设施改造运维与新建处理设施是不同动作。","第九项分别规定食品快检、抽检与药品监督抽检的范围；其中集采中选药品的抽检覆盖目标限于省内生产的该类药品。","第十项同时安排农村公路新建改造、高速公路服务区和充电设施等任务；农村公路里程把新建、改造提升合计计算。"],"why":"证据卡未另引解读。2026年11月25日省人大常委会会议另行听取了省政府关于本年度实事实施情况及下一年度候选项目安排的报告（广东人大网11月26日报道），会议报道没有给出十项全部完成的结论。","contrasts":[{"wrong":"第七项互认项目数增加20%以上，就是患者就诊时检查检验结果被互认的比例提高20%以上。","reason":"把项目库中的项目数换成了患者层面的互认率（分母替换）。","correction":"“项目数增加20%以上”衡量的是医疗机构间互认项目库的扩容。"},{"wrong":"第八项对已建成的自然村生活污水治理设施，安排的是新建处理设施。","reason":"把对既有设施的改造提升换成了新建（动作替换）。","correction":"第八项针对已建成的自然村生活污水治理设施安排改造提升；改造运维与新建是不同动作。"},{"wrong":"第九项集采中选药品的抽检覆盖在广东销售的全部该类药品。","reason":"扩大了覆盖范围（地域、范围替换）。","correction":"集采中选药品的抽检覆盖目标限于省内生产的该类药品。"},{"wrong":"第十项的农村公路里程只计新建部分。","reason":"漏掉了改造提升的里程。","correction":"农村公路里程把新建、改造提升合计计算。"},{"wrong":"省人大常委会11月听取了实施情况报告，说明十件民生实事已全部完成。","reason":"把年度任务、实施情况报告当成了完成结果（阶段替换）。","correction":"各项是2026年度安排；听取实施情况报告不等于确认十项全部完成，不能据此推断已全部完成（11月26日的会议报道也没有给出全部完成的结论）。"}],"question_design":"题干写明“2026年广东省政府工作报告附件1《2026年省十件民生实事》”及项次。从同一项抽取对象和动作，让选项替换分母、地域或覆盖范围，保留“省内生产”“已建成”“项目数”等条件；任务与结果分开，不从年度安排或会议听取报告推断完成情况；原文整套数量指标只作查阅，不背。第一至五项另有证据卡（E-GD-02至E-GD-06），不在本块。","related_ids":["GD-006"],"source_ids":["E-DB-06","GD-S01"],"exam_eligible":true,"candidate":true}],"questions":[{"id":"Q000ac9049a3c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.01"],"stem":"哲学是系统化、理论化的世界观，具有世界观不等于已经形成哲学体系。","answer":"正确","polarity":"正确句"},{"id":"Q34af8e3a27fd","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.01"],"stem":"任何零散的世界看法都已经是完整的哲学，而且凡哲学都天然科学。","answer":"错误","polarity":"易错句"},{"id":"Q869dbe8ea0f5","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.02"],"stem":"世界观决定方法论，方法论体现世界观，这是总体立场与一般方法原则的关系。","answer":"正确","polarity":"正确句"},{"id":"Qaa0abac2593c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.02"],"stem":"方法论决定世界观，世界观只是某个具体技巧的被动体现。","answer":"错误","polarity":"易错句"},{"id":"Q21841f81466f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.03"],"stem":"承认外部世界存在，尚不足以判定唯物主义，还须看是否承认物质第一性。","answer":"正确","polarity":"正确句"},{"id":"Q4da950927591","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.03"],"stem":"只要承认自然界存在，就必然属于唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Q4419d64a6d42","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.04"],"stem":"世界观是对世界的总看法，方法论是认识和改造世界的一般方法原则，二者相互联系。","answer":"正确","polarity":"正确句"},{"id":"Q5923c6862865","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.04"],"stem":"世界观就是某一道题的具体解法，方法论则是对世界的总看法。","answer":"错误","polarity":"易错句"},{"id":"Qd1880501564c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.05"],"stem":"哲学概括自然、社会和思维的一般问题，具体科学研究特定领域，二者可以相互促进。","answer":"正确","polarity":"正确句"},{"id":"Q82d8a0f6ee16","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.05"],"stem":"哲学能够替代各门具体科学，直接提供每个具体问题的答案。","answer":"错误","polarity":"易错句"},{"id":"Q38ab4c660e80","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.06"],"stem":"思维和存在何者第一性，与思维能否正确认识存在，是哲学基本问题的两个方面。","answer":"正确","polarity":"正确句"},{"id":"Q42e2d04446de","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.06"],"stem":"承认世界可以被认识，就已经回答了物质和意识何者第一性。","answer":"错误","polarity":"易错句"},{"id":"Q22841d975ff7","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.07"],"stem":"物质与意识何者第一性，是区分唯物主义和唯心主义的根本依据。","answer":"正确","polarity":"正确句"},{"id":"Q98debbb61b7b","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.07"],"stem":"是否承认意识有作用，是区分唯物主义和唯心主义的根本依据。","answer":"错误","polarity":"易错句"},{"id":"Qd403373e11d1","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.08"],"stem":"可知论肯定认识客观世界的可能性，承认当前认识有限不等于不可知论。","answer":"正确","polarity":"正确句"},{"id":"Q5acc406062e9","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.08"],"stem":"只要承认还有未知事物，就属于不可知论。","answer":"错误","polarity":"易错句"},{"id":"Q95d840d4b5cd","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.09"],"stem":"唯物唯心主要回答世界本原，辩证法与形而上学的对立主要涉及怎样理解联系、变化和矛盾。","answer":"正确","polarity":"正确句"},{"id":"Q8dcf068c440b","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.09"],"stem":"只要是唯物主义，就一定具有辩证的历史观和发展观。","answer":"错误","polarity":"易错句"},{"id":"Q76a639932434","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.10"],"stem":"把某种具体物质形态当作世界本原，是古代朴素唯物主义的典型局限。","answer":"正确","polarity":"正确句"},{"id":"Q2c4a23ced527","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.10"],"stem":"把水等具体物质形态当作世界本原，已经等于辩证唯物主义的物质范畴。","answer":"错误","polarity":"易错句"},{"id":"Qbaa291afb171","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.11"],"stem":"近代机械唯物主义具有机械性、形而上学性，以及历史观上的唯心主义局限。","answer":"正确","polarity":"正确句"},{"id":"Q43beacc9e01f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.11"],"stem":"近代机械唯物主义的主要问题，是完全不承认物质存在。","answer":"错误","polarity":"易错句"},{"id":"Q106ceeffbb37","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.12"],"stem":"把个人感觉、心灵等作为世界本原，属于主观唯心主义的典型立场。","answer":"正确","polarity":"正确句"},{"id":"Q857edfd66eb9","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.12"],"stem":"只要一句话出现“我”“心”或“感觉”，就属于主观唯心主义。","answer":"错误","polarity":"易错句"},{"id":"Q4e7cadc8e982","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.13"],"stem":"把独立于个人的理念、绝对精神等当作世界本原，是客观唯心主义的典型立场。","answer":"正确","polarity":"正确句"},{"id":"Q8f957aee06cf","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.13"],"stem":"客观唯心主义既然带有“客观”二字，就承认物质第一性。","answer":"错误","polarity":"易错句"},{"id":"Qb388399c6513","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.14"],"stem":"主观唯心主义与客观唯心主义都把精神放在本原位置，只是精神的理解不同。","answer":"正确","polarity":"正确句"},{"id":"Qb6d5e697f60f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.14"],"stem":"主观唯心主义以精神为本原，客观唯心主义则以物质为本原。","answer":"错误","polarity":"易错句"},{"id":"Q2e46dd2c745c","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.15"],"stem":"科学性强调认识客观规律以及接受实践检验，不意味着理论体系拒绝发展。","answer":"正确","polarity":"正确句"},{"id":"Q18f0e5a9c0b7","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.15"],"stem":"科学性意味着现有理论已经穷尽世界，今后无需丰富发展。","answer":"错误","polarity":"易错句"},{"id":"Qc001caa553f3","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.16"],"stem":"人民性回答根本立场和为谁的问题，实践性强调理论与改变现实的实践相联系。","answer":"正确","polarity":"正确句"},{"id":"Qef0a7f4c743a","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.16"],"stem":"人民性和实践性是同一个概念，可以在任何表述中互换。","answer":"错误","polarity":"易错句"},{"id":"Q053f4dc6d031","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.17"],"stem":"强调科学性、人民性、实践性、发展性，不等于排斥马克思主义的革命性。","answer":"正确","polarity":"正确句"},{"id":"Q6affafb427af","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.17"],"stem":"教材归纳了四个主要特征，因此马克思主义不具有革命性。","answer":"错误","polarity":"易错句"},{"id":"Q65d7a5d7c868","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.18"],"stem":"德国古典哲学、英国古典政治经济学、英法空想社会主义是思想来源，不是马克思主义三个组成部分的名称。","answer":"正确","polarity":"正确句"},{"id":"Q66b63fbc5c55","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.18"],"stem":"德国古典哲学、英国古典政治经济学、英法空想社会主义就是马克思主义的三个组成部分。","answer":"错误","polarity":"易错句","o":143,"t":1},{"id":"Q9e17dd0d5b19","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.19"],"stem":"唯物史观和剩余价值学说被概括为马克思的两大发现；辩证唯物主义和历史唯物主义是其哲学的两个重要组成。","answer":"正确","polarity":"正确句"},{"id":"Q2a02edd9f57f","src":"底稿","kind":"基础判断","type":"判断","module":"M1","cards":["M1.19"],"stem":"马克思的两大发现就是辩证唯物主义和历史唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Qba253daa8b0f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.01"],"stem":"世界的统一性在于物质性，意识依赖物质，不等于意识本身与物质是同一范畴。","answer":"正确","polarity":"正确句"},{"id":"Q623cf6670010","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.01"],"stem":"世界统一于物质，所以任何意识内容本身都已经是一件物质实物。","answer":"错误","polarity":"易错句"},{"id":"Qcb3f6d6f82e2","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.02"],"stem":"意识对人体生理活动具有一定调节作用，但不能任意支配全部生理过程。","answer":"正确","polarity":"正确句"},{"id":"Q7a2311b903c5","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.02"],"stem":"意识具有能动作用，所以人的全部身体状态都完全由意志决定。","answer":"错误","polarity":"易错句"},{"id":"Q1f54aad3a973","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.03"],"stem":"哲学物质范畴概括各种具体物质形态共同具有的客观实在性。","answer":"正确","polarity":"正确句"},{"id":"Q8b5b197e8c3e","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.03"],"stem":"哲学物质就是某种最小粒子，粒子模型改变就证明物质不存在。","answer":"错误","polarity":"易错句"},{"id":"Q48e9bce8db27","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.04"],"stem":"客观实在性专用于说明物质不依赖意识而存在；不能由某种观念确实存在便把它判成物质。","answer":"正确","polarity":"正确句"},{"id":"Q93d622acc221","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.04"],"stem":"一种思想确实存在，所以这种思想本身就具有物质的客观实在性。","answer":"错误","polarity":"易错句"},{"id":"Q2e182e7590eb","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.05"],"stem":"物质的唯一特性是客观实在性，运动是物质的根本属性和存在方式。","answer":"正确","polarity":"正确句"},{"id":"Qebd90cfc1c9f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.05"],"stem":"物质的唯一特性是运动，客观实在性只是它的存在方式。","answer":"错误","polarity":"易错句","o":178,"t":2},{"id":"Q476c0a416544","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.06"],"stem":"运动是物质的运动，物质是运动着的物质，二者不能分离。","answer":"正确","polarity":"正确句"},{"id":"Qc416c9186853","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.06"],"stem":"可以承认完全没有任何运动的物质，同时坚持辩证唯物主义。","answer":"错误","polarity":"易错句"},{"id":"Q2a269436a359","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.07"],"stem":"否认物质承担者而把运动说成精神自生的运动，会走向唯心主义。","answer":"正确","polarity":"正确句"},{"id":"Q8f9482895e43","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.07"],"stem":"承认运动而否认任何物质承担者，仍足以坚持物质第一性。","answer":"错误","polarity":"易错句"},{"id":"Qf6f326dfdee9","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.08"],"stem":"运动是绝对的，相对静止是物质运动在一定条件下的特殊状态。","answer":"正确","polarity":"正确句"},{"id":"Q821d0802b32b","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.08"],"stem":"相对静止就是一段时间内绝对不存在任何运动。","answer":"错误","polarity":"易错句"},{"id":"Q56c44f586d6c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.09"],"stem":"一定条件下相对位置不变，或事物根本性质暂时稳定，都可体现相对静止。","answer":"正确","polarity":"正确句"},{"id":"Q1db0b861e051","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.09"],"stem":"只有空间位置不动才叫相对静止，性质稳定与静止无关。","answer":"错误","polarity":"易错句"},{"id":"Q9e55bff1335a","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.10"],"stem":"否认绝对运动会走向形而上学，否认相对静止则难以把握事物的确定性。","answer":"正确","polarity":"正确句"},{"id":"Qafbcd1149300","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.10"],"stem":"承认运动绝对，就应否认事物具有任何相对确定的性质。","answer":"错误","polarity":"易错句"},{"id":"Qac17e0a6a32f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.11"],"stem":"时间和空间是运动着的物质的存在形式，不能把它们说成纯粹由个人意志创造。","answer":"正确","polarity":"正确句"},{"id":"Q203754f2b184","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.11"],"stem":"时间和空间是否存在，完全取决于个人是否正在感觉它们。","answer":"错误","polarity":"易错句"},{"id":"Qfc3881d0bfd2","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.12"],"stem":"人脑是意识的生理器官，客观存在是意识内容的来源。","answer":"正确","polarity":"正确句"},{"id":"Q5769f320d18b","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.12"],"stem":"人脑既是意识的生理器官，也是意识全部内容凭空产生的来源。","answer":"错误","polarity":"易错句"},{"id":"Q10220d9e2d5c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.13"],"stem":"意识是自然界长期发展的产物，也是社会实践发展的产物，劳动和语言具有重要作用。","answer":"正确","polarity":"正确句","o":100,"t":1},{"id":"Q12c7d0fc4931","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.13"],"stem":"意识完全是孤立大脑自然成熟的结果，与劳动、交往和语言无关。","answer":"错误","polarity":"易错句"},{"id":"Q5b9bd79e267d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.14"],"stem":"意识是客观存在的主观映象，内容有客观来源，反映形式具有主观性。","answer":"正确","polarity":"正确句"},{"id":"Q3dcd067162dd","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.14"],"stem":"意识既然反映客观存在，其形式就不具有任何主观性。","answer":"错误","polarity":"易错句"},{"id":"Qb63cbb2714d5","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.15"],"stem":"错误意识也是对客观存在的反映，只是反映可能歪曲、片面或错误组合。","answer":"正确","polarity":"正确句"},{"id":"Q5dc038947885","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.15"],"stem":"只有正确意识来源于客观存在，错误意识不需要任何现实来源。","answer":"错误","polarity":"易错句"},{"id":"Qb37d04c86046","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.16"],"stem":"意识依赖人脑的物质活动，但不能把意识内容直接等同于某种物质分泌物。","answer":"正确","polarity":"正确句"},{"id":"Q75a770c09fb0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.16"],"stem":"既然意识依赖人脑，意识与脑分泌出的物质就是同一种东西。","answer":"错误","polarity":"易错句"},{"id":"Q9b0ea0f081fc","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.17"],"stem":"意识能够选择、加工、预测和创造性构想，但其正确性仍受客观对象约束。","answer":"正确","polarity":"正确句"},{"id":"Q28076c894435","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.17"],"stem":"只要认识包含人的创造性加工，就一定属于唯心主义。","answer":"错误","polarity":"易错句"},{"id":"Q223bd291aedf","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.18"],"stem":"意识对改造客观世界的作用，要通过人的实践活动实现。","answer":"正确","polarity":"正确句"},{"id":"Qf3a0dc53cbf8","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.18"],"stem":"正确意识不经过任何实践，就能直接改变外部物质对象。","answer":"错误","polarity":"易错句"},{"id":"Q786cc7a54a7a","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.19"],"stem":"正确认识有利于实践，实际结果还受条件与实施过程制约。","answer":"正确","polarity":"正确句"},{"id":"Qde600d263c0d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.19"],"stem":"只要意识正确，无论物质条件如何都必然取得预期成功。","answer":"错误","polarity":"易错句"},{"id":"Q1fc3249a95db","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.20"],"stem":"规律揭示本质的、必然的、稳定的联系，不能把任何反复出现的表面现象直接当作规律。","answer":"正确","polarity":"正确句"},{"id":"Q306a9c5b4665","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.20"],"stem":"一种现象只要连续发生几次，就已经证明它是客观规律。","answer":"错误","polarity":"易错句"},{"id":"Qf88c7ffb3be6","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.21"],"stem":"人不能凭意志创造或取消客观规律，但可以认识规律并创造条件加以利用。","answer":"正确","polarity":"正确句"},{"id":"Q9a7b3ad2d3e0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.21"],"stem":"人可以利用规律，因此也能随意创造与取消客观规律。","answer":"错误","polarity":"易错句"},{"id":"Qeb81cc718093","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.22"],"stem":"规律具有客观性，不等于某种具体规律的适用条件和表现形式永远不变。","answer":"正确","polarity":"正确句","hold":"两句都可能把人带偏（核对人审读），暂停自动出题"},{"id":"Qe38e62fbc54c","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.22"],"stem":"只要规律是客观的，其适用条件就不可能发生变化。","answer":"错误","polarity":"易错句","hold":"两句都可能把人带偏（核对人审读），暂停自动出题"},{"id":"Q4030943048fd","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.23"],"stem":"规律是客观联系，规则是人制定的行为或操作规范，规则应尊重客观条件。","answer":"正确","polarity":"正确句"},{"id":"Qd7f33d4a60a0","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.23"],"stem":"既然规则能够被修改，就证明客观规律也能被任意修改。","answer":"错误","polarity":"易错句"},{"id":"Q9203a0c3a87d","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.24"],"stem":"尊重客观规律是正确发挥主观能动性的前提，认识利用规律又需要发挥主观能动性。","answer":"正确","polarity":"正确句","o":57,"t":1},{"id":"Qc7b00e9b940f","src":"底稿","kind":"基础判断","type":"判断","module":"M2","cards":["M2.24"],"stem":"尊重客观规律意味着人只能被动等待，不能主动改变条件。","answer":"错误","polarity":"易错句"},{"id":"Q42118fcd6970","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.01"],"stem":"质变结束原有性质下的量变，并为新性质基础上的量变创造条件。","answer":"正确","polarity":"正确句"},{"id":"Q290e0bccdddf","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.01"],"stem":"一旦发生质变，事物的数量、规模等就永远不再变化。","answer":"错误","polarity":"易错句"},{"id":"Q15d73b9425d2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.02"],"stem":"联系具有普遍性，但具体事物间的具体联系需要相应条件和依据。","answer":"正确","polarity":"正确句"},{"id":"Qbd6caff29cc2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.02"],"stem":"联系具有普遍性，所以任意两个事物之间必有直接联系。","answer":"错误","polarity":"易错句","o":121,"t":1},{"id":"Q969a6a3df660","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.03"],"stem":"人可以依据客观条件建立新的具体联系，这不否认联系的客观性。","answer":"正确","polarity":"正确句","o":168,"t":2},{"id":"Q064c4e3d7d36","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.03"],"stem":"只要某种联系是人建立的，它就一定是主观虚构的联系。","answer":"错误","polarity":"易错句"},{"id":"Q94792bb762b6","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.04"],"stem":"具体联系有条件且形式多样，并非所有联系都是因果联系。","answer":"正确","polarity":"正确句"},{"id":"Q30f3b2a505aa","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.04"],"stem":"只要两个对象存在联系，就必然是一方直接造成另一方。","answer":"错误","polarity":"易错句"},{"id":"Q3d26c2d1bd33","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.05"],"stem":"整体由部分构成，部分存在于整体中，二者不能简单等同于共性与个性。","answer":"正确","polarity":"正确句"},{"id":"Q1e889075cd46","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.05"],"stem":"整体与部分就是普遍性与特殊性，两组概念可以随意互换。","answer":"错误","polarity":"易错句"},{"id":"Q57bf7f86fdbf","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.06"],"stem":"整体居于主导地位，同时部分的功能及变化能够影响整体。","answer":"正确","polarity":"正确句"},{"id":"Q13b6d7c69956","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.06"],"stem":"整体居于主导地位，所以任何部分变化都不可能影响整体。","answer":"错误","polarity":"易错句"},{"id":"Q5c612dec7923","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.07"],"stem":"关键部分在一定条件下可以对整体功能产生决定性影响。","answer":"正确","polarity":"正确句"},{"id":"Q04e66749d7ed","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.07"],"stem":"任何部分在任何条件下都决定整体，整体服从部分。","answer":"错误","polarity":"易错句"},{"id":"Qe1d06d4a88c3","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.08"],"stem":"部分以合理结构形成有机整体时，整体功能可能大于部分功能之和。","answer":"正确","polarity":"正确句"},{"id":"Qdcd6f87a6cb0","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.08"],"stem":"任何整体的功能都必然大于部分功能之和。","answer":"错误","polarity":"易错句"},{"id":"Qc9df540674ee","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.09"],"stem":"系统优化要求统筹要素关系，局部最优不必自动构成整体最优。","answer":"正确","polarity":"正确句"},{"id":"Q74e2ceeea712","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.09"],"stem":"只要每个局部各自达到最优，整体就一定最优。","answer":"错误","polarity":"易错句"},{"id":"Qb7051f7192bc","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.10"],"stem":"发展是具有前进上升方向的变化，并非一切运动变化都是发展。","answer":"正确","polarity":"正确句"},{"id":"Q10d25f84706d","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.10"],"stem":"凡是发生了变化，就一定属于发展。","answer":"错误","polarity":"易错句"},{"id":"Q9a1bc39c0fa6","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.11"],"stem":"新旧事物要看是否符合发展的必然趋势，不能只按出现时间和一时力量大小判断。","answer":"正确","polarity":"正确句"},{"id":"Qbb11f23a0e0b","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.11"],"stem":"后出现、宣传新颖或当前力量强大的事物，一定是哲学上的新事物。","answer":"错误","polarity":"易错句","o":139,"t":1},{"id":"Q83699c210dca","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.12"],"stem":"新事物成长可以经历曲折和暂时挫折，不能因一时弱小就判定没有发展前途。","answer":"正确","polarity":"正确句"},{"id":"Q2f51a9dafce4","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.12"],"stem":"新事物必然在每个阶段、每次竞争中立即战胜旧事物。","answer":"错误","polarity":"易错句"},{"id":"Qad88756c441d","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.13"],"stem":"数量增减和构成要素排列次序的变化，都可能是量变的表现形式。","answer":"正确","polarity":"正确句"},{"id":"Q0d050c369b2b","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.13"],"stem":"量变只能是数量增加，结构排列变化一概不是量变。","answer":"错误","polarity":"易错句"},{"id":"Q6306e030f5ec","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.14"],"stem":"质变的判断关键是根本性质是否变化，不能只按外观变化大小判断。","answer":"正确","polarity":"正确句"},{"id":"Qe79334304d4a","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.14"],"stem":"外观变化越明显就越是质变，外观不明显就不可能发生质变。","answer":"错误","polarity":"易错句"},{"id":"Q20c7c31eefa7","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.15"],"stem":"度是事物保持其质的量的限度，是否超出度是区分量变与质变的重要依据。","answer":"正确","polarity":"正确句","o":128,"t":1},{"id":"Qcc464eeec455","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.15"],"stem":"度是任意人为规定的目标值，与事物性质是否保持无关。","answer":"错误","polarity":"易错句"},{"id":"Q5744645427b2","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.16"],"stem":"量变是质变的必要准备，量变达到一定程度并具备相应条件才会发生质变。","answer":"正确","polarity":"正确句"},{"id":"Q5c0ea0670556","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.16"],"stem":"只要有任何数量变化，就已经必然发生质变。","answer":"错误","polarity":"易错句"},{"id":"Qea19f68ed642","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.17"],"stem":"质变可以表现为进步或倒退，不能把所有质变都等同于发展。","answer":"正确","polarity":"正确句"},{"id":"Q6be24c9ca3d5","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.17"],"stem":"发生质变就说明事物一定进步了。","answer":"错误","polarity":"易错句"},{"id":"Q23d4a85c5869","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.18"],"stem":"总体量变过程中可以包含局部性质变化，整体层次与局部层次要区分。","answer":"正确","polarity":"正确句"},{"id":"Q9b51a7e644f3","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.18"],"stem":"只要局部发生任何质变，就能断定研究对象整体已经质变。","answer":"错误","polarity":"易错句"},{"id":"Q04b8a8fa3f97","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.19"],"stem":"肯定因素维持事物现有性质，否定因素推动其突破现有性质，二者是事物内部的方面。","answer":"正确","polarity":"正确句"},{"id":"Q1e1d8f366a53","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.19"],"stem":"哲学的肯定与否定，就是个人赞成和反对某件事的态度。","answer":"错误","polarity":"易错句"},{"id":"Qee7e3403bb08","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.20"],"stem":"辩证否定是事物内部矛盾推动的自我否定，是发展和联系的环节。","answer":"正确","polarity":"正确句","o":160,"t":2},{"id":"Q1e019ccc61ac","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.20"],"stem":"只要外力把某物彻底毁掉，就完整体现了辩证否定的实质。","answer":"错误","polarity":"易错句"},{"id":"Q3406ca1318ef","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.21"],"stem":"扬弃是克服旧事物中的消极因素并保留、改造积极因素，不是全盘抛弃。","answer":"正确","polarity":"正确句"},{"id":"Q0cc536b5f826","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.21"],"stem":"扬弃就是把旧事物所有内容一律清除。","answer":"错误","polarity":"易错句"},{"id":"Q92147f4310a0","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.22"],"stem":"否定之否定所体现的回复，包含在更高阶段上对某些因素的重新肯定，不是原样返回起点。","answer":"正确","polarity":"正确句"},{"id":"Q6ede0b57a885","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.22"],"stem":"否定两次以后，事物必然完全恢复原来的状态。","answer":"错误","polarity":"易错句"},{"id":"Q1b9e102e312c","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.23"],"stem":"发展总体的前进趋势可以通过曲折过程实现，不要求每一步都上升。","answer":"正确","polarity":"正确句"},{"id":"Q2de6fed1a53a","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.23"],"stem":"既然发展是前进的，任何暂时倒退都足以否定发展趋势。","answer":"错误","polarity":"易错句"},{"id":"Qfc5ca97846b1","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.24"],"stem":"对立统一规律揭示发展的源泉和动力，质量互变规律揭示发展的形式和状态，否定之否定规律揭示发展的方向和道路。","answer":"正确","polarity":"正确句","o":127,"t":1},{"id":"Qc77e6d8aeb84","src":"底稿","kind":"基础判断","type":"判断","module":"M3","cards":["M3.24"],"stem":"否定之否定主要揭示发展的根本动力，对立统一只说明数量积累。","answer":"错误","polarity":"易错句","o":131,"t":1},{"id":"Q27bcd763b783","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.01"],"stem":"对立统一规律是唯物辩证法的实质和核心，矛盾普遍性与特殊性的关系是矛盾问题的精髓。","answer":"正确","polarity":"正确句","o":65,"t":1},{"id":"Q813dab1bd2fe","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.01"],"stem":"唯物辩证法的实质核心是量变积累，矛盾问题的精髓是所有矛盾完全相同。","answer":"错误","polarity":"易错句"},{"id":"Qb7d1b8365934","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.02"],"stem":"哲学矛盾指事物内部或事物之间的对立统一关系，不等于同一条件下自相矛盾的判断。","answer":"正确","polarity":"正确句"},{"id":"Q4096a09cc35a","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.02"],"stem":"坚持矛盾观点，意味着可以把同一条件下相互否定的两个判断都当作正确。","answer":"错误","polarity":"易错句"},{"id":"Qa081b33ccf40","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.03"],"stem":"矛盾同一性包括相互依存，以及在一定条件下相互贯通、转化。","answer":"正确","polarity":"正确句"},{"id":"Qb056744b9a92","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.03"],"stem":"矛盾同一性意味着双方在性质、作用和立场上完全相同。","answer":"错误","polarity":"易错句"},{"id":"Q58f50a8d139b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.04"],"stem":"斗争性指矛盾双方相互排斥、相互否定的属性，其表现形式可以不同。","answer":"正确","polarity":"正确句"},{"id":"Q50d5b4798feb","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.04"],"stem":"只有发生公开争吵或暴力冲突，才能说明矛盾具有斗争性。","answer":"错误","polarity":"易错句"},{"id":"Q5c3cf7bbb86a","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.05"],"stem":"同一性与斗争性共同推动事物发展，不能把其中一方完全排除。","answer":"正确","polarity":"正确句"},{"id":"Q5d1e6de10bb6","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.05"],"stem":"只有斗争性推动发展，同一性对发展没有作用。","answer":"错误","polarity":"易错句"},{"id":"Qb6c278b5c6e1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.06"],"stem":"同一性具有相对性和条件性；斗争性的绝对性指矛盾双方相互排斥的性质贯穿矛盾运动过程，不意味着具体矛盾或斗争形式永远不变。","answer":"正确","polarity":"正确句"},{"id":"Q3931c4e73145","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.06"],"stem":"斗争性绝对，所以任何具体斗争形式都不受条件限制并永远不变。","answer":"错误","polarity":"易错句"},{"id":"Q68ece1dc9fc4","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.07"],"stem":"矛盾斗争性寓于同一性之中，双方在一定统一关系中相互排斥。","answer":"正确","polarity":"正确句"},{"id":"Q9e241bbc4ab9","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.07"],"stem":"斗争性可以完全脱离双方的统一关系而独立存在。","answer":"错误","polarity":"易错句"},{"id":"Qb6bf2c0b5a65","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.08"],"stem":"矛盾普遍性要求承认矛盾存在于事物及其发展过程中，不等于每个具体矛盾永远不变。","answer":"正确","polarity":"正确句"},{"id":"Q6067c83dbf5b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.08"],"stem":"既然矛盾普遍存在，任何具体矛盾都不可能被解决。","answer":"错误","polarity":"易错句"},{"id":"Q162571441786","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.09"],"stem":"不同事物、同一事物不同阶段，以及同一矛盾不同方面，都可有各自特点。","answer":"正确","polarity":"正确句"},{"id":"Q0d711c6c871d","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.09"],"stem":"矛盾特殊性只指不同事物之间有差异，同一事物各阶段没有特殊性。","answer":"错误","polarity":"易错句"},{"id":"Q0b06504ffa8f","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.10"],"stem":"矛盾普遍性寓于特殊性之中，并通过特殊性表现出来。","answer":"正确","polarity":"正确句","o":123,"t":1},{"id":"Q2f949d4020e5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.10"],"stem":"普遍性在特殊性之外单独存在，具体对象可以完全不包含共性。","answer":"错误","polarity":"易错句"},{"id":"Q18ffc0181c44","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.11"],"stem":"共性个性描述属性的一般与特殊，整体部分描述对象的构成，二者不能互换。","answer":"正确","polarity":"正确句"},{"id":"Q912094bf7b84","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.11"],"stem":"某种普遍属性就是一个整体，各具体对象就是它的组成零件。","answer":"错误","polarity":"易错句"},{"id":"Q480ded052160","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.12"],"stem":"同一认识在不同范围的比较中，可以表现为相对普遍或相对特殊。","answer":"正确","polarity":"正确句"},{"id":"Q6571ed46d1c0","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.12"],"stem":"某一属性只要曾被称为普遍性，在任何研究范围中都永远是普遍性。","answer":"错误","polarity":"易错句"},{"id":"Q4adb16098030","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.13"],"stem":"在复杂事物的诸多矛盾中，主要矛盾在一定阶段处于支配地位，对发展起决定作用。","answer":"正确","polarity":"正确句"},{"id":"Q13c764f3f60c","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.13"],"stem":"主要矛盾就是同一个矛盾中占优势的那一方。","answer":"错误","polarity":"易错句"},{"id":"Q5ffa2a6474c1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.14"],"stem":"矛盾主要方面是在同一矛盾中处于支配地位、起主导作用的方面。","answer":"正确","polarity":"正确句"},{"id":"Qf6d03f6b63e5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.14"],"stem":"矛盾主要方面是许多矛盾中最需要优先解决的那一组矛盾。","answer":"错误","polarity":"易错句"},{"id":"Q18a37c48797c","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.15"],"stem":"复杂事物的性质，主要由其主要矛盾的主要方面规定。","answer":"正确","polarity":"正确句","o":197,"t":2},{"id":"Q01e8ded78690","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.15"],"stem":"事物性质主要由某个次要矛盾的任何一方规定，与主要矛盾无关。","answer":"错误","polarity":"易错句"},{"id":"Q2aefe6c904cb","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.16"],"stem":"根本矛盾贯穿事物发展过程并规定根本性质；主要矛盾着眼某一阶段诸矛盾中的支配地位。","answer":"正确","polarity":"正确句"},{"id":"Q0f8279bac962","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.16"],"stem":"根本矛盾和主要矛盾在任何情形下都是完全同义词。","answer":"错误","polarity":"易错句"},{"id":"Q8b9016606e05","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.17"],"stem":"两点论要求兼顾主要矛盾和次要矛盾、同一矛盾的主要方面和次要方面；重点论要求着重把握主要矛盾和矛盾的主要方面。","answer":"正确","polarity":"正确句","o":196,"t":2},{"id":"Q23600940a6f5","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.17"],"stem":"两点论要求对所有方面平均用力，重点论要求完全忽略次要方面。","answer":"错误","polarity":"易错句"},{"id":"Q8cace481cf58","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.18"],"stem":"内因是事物变化的根据，外因是条件，外因通过内因起作用。","answer":"正确","polarity":"正确句"},{"id":"Qfbbecb89b87b","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.18"],"stem":"内因是变化根据，所以任何外部条件都没有实际作用。","answer":"错误","polarity":"易错句"},{"id":"Q795f44c5009d","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.19"],"stem":"内外因要依据所研究事物的边界和矛盾关系判断，不能只凭肉眼空间位置分类。","answer":"正确","polarity":"正确句"},{"id":"Q9e2dfbfd64bc","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.19"],"stem":"某因素只要在身体或场地内部，就必然是研究对象的根本内因。","answer":"错误","polarity":"易错句"},{"id":"Qb327331e7dbc","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.20"],"stem":"矛盾双方及主次关系可以在一定条件下转化，转化需要实际条件。","answer":"正确","polarity":"正确句"},{"id":"Q83c7406b6b87","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.20"],"stem":"矛盾双方既然能转化，就可以任意转化成任何互不相关的事物。","answer":"错误","polarity":"易错句"},{"id":"Q1df76e6d8601","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.21"],"stem":"一切从实际出发主要联系物质决定意识；具体问题具体分析主要联系矛盾特殊性；实事求是强调从客观实际出发探求并遵循客观规律。","answer":"正确","polarity":"正确句"},{"id":"Q5281885850d1","src":"底稿","kind":"基础判断","type":"判断","module":"M4","cards":["M4.21"],"stem":"具体问题具体分析的直接理论依据是所有事物完全相同、没有特殊性。","answer":"错误","polarity":"易错句"},{"id":"Q0f53ae88d83f","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.01"],"stem":"因果关系的核心是引起与被引起，先后相继或同时变化本身不足以证明因果。","answer":"正确","polarity":"正确句"},{"id":"Q2b7f75381dd0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.01"],"stem":"只要一件事发生在另一件事之前，前者就是后者的原因。","answer":"错误","polarity":"易错句"},{"id":"Q3b4402341045","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.02"],"stem":"一个结果可以在另一段联系中成为原因，反馈不等于颠倒同一具体因果关系。","answer":"正确","polarity":"正确句"},{"id":"Qca32c45b5648","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.02"],"stem":"结果能反作用于原因，所以后发生的事件可以随意造成已经发生的过去事件。","answer":"错误","polarity":"易错句"},{"id":"Q722bc2de63f1","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.03"],"stem":"偶然事件可以有原因，有原因不等于它是所研究发展过程中的必然环节。","answer":"正确","polarity":"正确句"},{"id":"Q88a788c50784","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.03"],"stem":"凡能找到原因的事件都必然发生，偶然性只等于不知道原因。","answer":"错误","polarity":"易错句"},{"id":"Q20341312bc16","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.04"],"stem":"必然趋势通过具体的偶然形式实现，不等于每个具体偶然事件都非发生不可。","answer":"正确","polarity":"正确句"},{"id":"Q55b831be424b","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.04"],"stem":"必然性通过偶然性表现，所以任何已经发生的偶然事件都必然只能这样发生。","answer":"错误","polarity":"易错句"},{"id":"Q0587edbee631","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.05"],"stem":"偶然性不等于无影响，必然性也不能只按发生次数或概率高低判断。","answer":"正确","polarity":"正确句"},{"id":"Q2b60e8576ab2","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.05"],"stem":"偶然事件影响一定很小，次数多的现象就自动成为必然规律。","answer":"错误","polarity":"易错句"},{"id":"Q8574366e1dfe","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.06"],"stem":"可能性有现实根据但尚未实现，现实性指已经实际存在的状态。","answer":"正确","polarity":"正确句"},{"id":"Qb7b0eb4e25a0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.06"],"stem":"只要一个设想在脑中能够被想象，它就必然具有客观可能性。","answer":"错误","polarity":"易错句"},{"id":"Qf7b20a03991e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.07"],"stem":"现实可能与抽象可能主要依据现实根据及必要条件是否具备区分。","answer":"正确","polarity":"正确句"},{"id":"Qd5fa0a223510","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.07"],"stem":"发生概率低的都是抽象可能，发生概率高的都是现实可能。","answer":"错误","polarity":"易错句"},{"id":"Q071bdd7047cc","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.08"],"stem":"在人有目的的活动中，实践可以促使可能转为现实，但自然过程也有可能向现实的转化。","answer":"正确","polarity":"正确句"},{"id":"Q8f8fde8aa3b6","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.08"],"stem":"任何可能转为现实都必须先有人类意识和人的实践参与。","answer":"错误","polarity":"易错句"},{"id":"Qd79910bff7ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.09"],"stem":"内容是构成事物的要素和过程等，形式是其组织结构及表现方式。","answer":"正确","polarity":"正确句"},{"id":"Q458ddd41940e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.09"],"stem":"形式只指外观装饰，任何内部组织结构都不属于形式。","answer":"错误","polarity":"易错句"},{"id":"Q840e46f95a1c","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.10"],"stem":"内容决定形式，形式有相对独立性并能反作用于内容。","answer":"正确","polarity":"正确句"},{"id":"Q7d199050192b","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.10"],"stem":"内容决定形式，所以同一内容只能有唯一一种表达和组织方式。","answer":"错误","polarity":"易错句"},{"id":"Q201984aa70ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.11"],"stem":"内容形式着眼构成和组织，本质现象着眼内在根本性质和外在表现。","answer":"正确","polarity":"正确句"},{"id":"Q8231918f8b2c","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.11"],"stem":"内容完全等于本质，形式完全等于现象，两组词可以随意替换。","answer":"错误","polarity":"易错句"},{"id":"Qc260255233ff","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.12"],"stem":"现象与本质都属于事物自身的方面，不能把现象直接等同于主观感觉。","answer":"正确","polarity":"正确句"},{"id":"Qaea1d4fbdcb1","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.12"],"stem":"只有本质是客观的，任何现象都只是人的主观想象。","answer":"错误","polarity":"易错句"},{"id":"Q0f17adc5b944","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.13"],"stem":"假象是具有迷惑性的客观现象，错觉是主体产生的错误知觉。","answer":"正确","polarity":"正确句"},{"id":"Q42f997729c5a","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.13"],"stem":"假象和错觉都只是主观认识，与客观呈现没有区别。","answer":"错误","polarity":"易错句"},{"id":"Q009dd474d1e8","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.14"],"stem":"假象仍以歪曲、颠倒的方式表现本质，并非与真实过程毫无联系。","answer":"正确","polarity":"正确句"},{"id":"Qb02ad3166175","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.14"],"stem":"假象既然能误导人，就完全不表现本质，也没有研究价值。","answer":"错误","polarity":"易错句"},{"id":"Q5e1803f4438a","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.15"],"stem":"在本组规范表述中，现象表现本质，认识反映对象，二者说的是不同关系。","answer":"正确","polarity":"正确句"},{"id":"Qa3bad2c02205","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.15"],"stem":"现象就是人的认识，因此现象与本质的关系就是主体与客体的关系。","answer":"错误","polarity":"易错句"},{"id":"Q635571fb6a54","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.16"],"stem":"现象本质有区别使深入研究成为必要，二者有联系使由现象认识本质成为可能。","answer":"正确","polarity":"正确句"},{"id":"Qe2437843994e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.16"],"stem":"现象与本质毫无关系，反而保证人可以通过现象认识本质。","answer":"错误","polarity":"易错句"},{"id":"Q972f0dd98afe","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.17"],"stem":"主观辩证法是思维中对客观辩证运动的反映，不能与主观唯心主义等同。","answer":"正确","polarity":"正确句"},{"id":"Q584218987cce","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.17"],"stem":"主观辩证法因为发生在思维中，所以必然否认客观世界。","answer":"错误","polarity":"易错句"},{"id":"Q0f5a5f5d8db7","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.18"],"stem":"分析分解对象的要素方面，综合在把握其联系的基础上形成整体认识。","answer":"正确","polarity":"正确句"},{"id":"Qcb258d35da3e","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.18"],"stem":"综合就是把互不相干的材料堆在一起，完全不必研究相互关系。","answer":"错误","polarity":"易错句"},{"id":"Q2246ad3d0b39","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.19"],"stem":"教材常用个别到一般识别归纳、一般到个别识别演绎，可靠演绎还须前提真实与形式有效。","answer":"正确","polarity":"正确句"},{"id":"Qf086145e35ba","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.19"],"stem":"只要推理是演绎形式，即使前提错误也必然保证结论正确。","answer":"错误","polarity":"易错句"},{"id":"Q85999a0697e0","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.20"],"stem":"分析综合着眼分解与联系，归纳演绎着眼一般与个别的推理，二者可以在研究中交叉使用。","answer":"正确","polarity":"正确句"},{"id":"Q2af8ce9849d3","src":"底稿","kind":"基础判断","type":"判断","module":"M5","cards":["M5.20"],"stem":"把一个对象分成三个方面研究，就已经必然完成了从个别到一般的归纳。","answer":"错误","polarity":"易错句"},{"id":"Q37bff0374473","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.01"],"stem":"认识是在实践基础上主体对客体的能动反映，不是机械照相，也不是脱离客体的自生。","answer":"正确","polarity":"正确句"},{"id":"Q21ece88cc098","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.01"],"stem":"主体会选择和加工材料，所以认识可以完全不受客体制约。","answer":"错误","polarity":"易错句"},{"id":"Q6fbfa3c39bb5","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.02"],"stem":"实践是人能动改造客观世界的物质活动，纯粹在脑中设想不自动等于实践。","answer":"正确","polarity":"正确句","o":119,"t":1},{"id":"Q2d4ce78e1507","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.02"],"stem":"只要人在认真思考，无论是否发生客观活动，都已经等同于实践。","answer":"错误","polarity":"易错句"},{"id":"Q42b3c350f87f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.03"],"stem":"实践的基本形式包括物质生产实践、社会政治实践和科学文化实践，科学实验属于科学文化实践。","answer":"正确","polarity":"正确句","o":115,"t":1},{"id":"Q452ffe8504d2","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.03"],"stem":"只有体力生产劳动才属于实践，科学实验不属于实践。","answer":"错误","polarity":"易错句"},{"id":"Q1273a7f99d90","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.04"],"stem":"实践的目的可以具有主观性，活动仍受客观对象、手段和条件制约。","answer":"正确","polarity":"正确句"},{"id":"Q79f044ee21ca","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.04"],"stem":"实践有目的有计划，所以它不具有客观物质性。","answer":"错误","polarity":"易错句"},{"id":"Q9b9604e15585","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.05"],"stem":"实践具有直接现实性，指它实际作用于现实，不保证预想目标必然实现。","answer":"正确","polarity":"正确句"},{"id":"Q8d565f93dbe0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.05"],"stem":"实践具有直接现实性，意味着只要付诸行动就一定成功。","answer":"错误","polarity":"易错句"},{"id":"Qe3af92e93c88","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.06"],"stem":"单个人的实践也依赖社会积累和历史条件，不因独自操作就失去社会性。","answer":"正确","polarity":"正确句","o":172,"t":2},{"id":"Q1e8573a33306","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.06"],"stem":"一个人独立完成实验，就说明该实践完全没有社会历史性。","answer":"错误","polarity":"易错句"},{"id":"Q594bb300aa42","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.07"],"stem":"实践是认识的来源，直接经验与间接经验是个人获取知识的不同途径。","answer":"正确","polarity":"正确句","o":109,"t":1},{"id":"Qeb91df77c4e0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.07"],"stem":"个人从书上学到知识，就证明认识存在一个完全脱离实践的第二来源。","answer":"错误","polarity":"易错句","o":126,"t":1},{"id":"Q5c6dc2012f29","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.08"],"stem":"来自实践的认识仍可能片面或错误，来源于实践不自动保证认识正确。","answer":"正确","polarity":"正确句"},{"id":"Q5ca0ea37a690","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.08"],"stem":"只要某结论是在实践中形成的，它就不需要再接受检验。","answer":"错误","polarity":"易错句"},{"id":"Q0b183f4de11b","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.09"],"stem":"实践提供认识材料，也提出新问题、提供工具并推动认识发展，来源与动力各有侧重。","answer":"正确","polarity":"正确句"},{"id":"Q9f5936b87c45","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.09"],"stem":"实践是认识的动力，只是说材料从实践中来，不包括问题与工具的发展。","answer":"错误","polarity":"易错句","o":151,"t":1},{"id":"Q8744980bb605","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.10"],"stem":"认识的根本任务是透过现象把握本质规律，根本目的是指导实践、改造世界。","answer":"正确","polarity":"正确句","o":55,"t":1},{"id":"Q1e7ba2e39f1a","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.10"],"stem":"认识的根本目的只是形成理论，理论形成后与实践再无关系。","answer":"错误","polarity":"易错句"},{"id":"Qd6f61fda69c7","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.11"],"stem":"感性和理性区分认识层次，二者都可能正确或错误。","answer":"正确","polarity":"正确句"},{"id":"Q44218ca7d021","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.11"],"stem":"理性认识处于高级阶段，所以理性认识一律正确。","answer":"错误","polarity":"易错句"},{"id":"Qe24fbaa30e4e","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.12"],"stem":"感觉、知觉、表象属于感性认识，表象可在对象不在眼前时再现具体形象。","answer":"正确","polarity":"正确句"},{"id":"Qdeac8a1047b5","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.12"],"stem":"对象不在眼前时产生的任何脑中形象，都已经属于理性认识。","answer":"错误","polarity":"易错句"},{"id":"Qacbb2d2db65d","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.13"],"stem":"概念、判断、推理属于理性认识的基本形式。","answer":"正确","polarity":"正确句"},{"id":"Qa6a9cf870b51","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.13"],"stem":"表象、判断、推理都是理性认识，感觉和概念则属于感性认识。","answer":"错误","polarity":"易错句","o":187,"t":2},{"id":"Qd660229c1c8f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.14"],"stem":"理性依赖感性材料，感性有待深化为理性，二者相互渗透并统一于实践。","answer":"正确","polarity":"正确句"},{"id":"Q5ce84af8be66","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.14"],"stem":"感性阶段必须完全没有思考，理性阶段必须完全排除感性因素。","answer":"错误","polarity":"易错句"},{"id":"Q52bbb44c3cbc","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.15"],"stem":"在实践基础上从感性认识上升为理性认识是第一次认识飞跃；要获得正确理性认识，需要充分可靠的感性材料和科学的思维加工。","answer":"正确","polarity":"正确句"},{"id":"Q37ebce241579","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.15"],"stem":"感性材料只要积累得足够多，就会自动生成正确理论，无需思考加工。","answer":"错误","polarity":"易错句"},{"id":"Q6535d5639f36","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.16"],"stem":"认识回到实践能实现认识目的并检验、发展认识，因此第二次飞跃具有更重要的意义。","answer":"正确","polarity":"正确句","o":73,"t":1},{"id":"Q17ae17aa0e25","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.16"],"stem":"第二次飞跃更重要，说明第一阶段形成认识可以完全省略。","answer":"错误","polarity":"易错句"},{"id":"Q162fbd3fcda9","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.17"],"stem":"认识可能多次经历实践与认识的往返，但可以保留成果并逐步深化。","answer":"正确","polarity":"正确句"},{"id":"Q98a75e8b84e7","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.17"],"stem":"认识的反复性意味着每次都必须否定全部旧认识并回到零点。","answer":"错误","polarity":"易错句"},{"id":"Qff2b7a0be288","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.18"],"stem":"人类认识可以不断发展，某个具体问题仍可能在明确条件下获得可靠答案。","answer":"正确","polarity":"正确句"},{"id":"Q840c7dd54623","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.18"],"stem":"认识没有最终终点，所以任何具体问题都永远不可能确定。","answer":"错误","polarity":"易错句"},{"id":"Q4bab631b0585","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.19"],"stem":"真理属于认识，形式具有主观性，其正确内容及最终检验标准具有客观性。","answer":"正确","polarity":"正确句"},{"id":"Q952f1c28e082","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.19"],"stem":"真理既然客观，就必然是一件不属于认识的物质物品。","answer":"错误","polarity":"易错句"},{"id":"Q33aa64150f21","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.20"],"stem":"同一对象、同一条件、同一方面的相互矛盾判断，不能仅因主体不同就都是真理。","answer":"正确","polarity":"正确句"},{"id":"Qe780c519b5fa","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.20"],"stem":"不同人观点不同，因此对同一事实的互相否定判断都可以各自为真。","answer":"错误","polarity":"易错句"},{"id":"Q37161de48dfa","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.21"],"stem":"同一真理既包含确定的客观正确内容，又具有范围、条件和认识程度的有限性。","answer":"正确","polarity":"正确句"},{"id":"Qa1d521302e40","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.21"],"stem":"真理分为两种互斥类型，一种绝对真理完全不相对，另一种相对真理完全不绝对。","answer":"错误","polarity":"易错句","o":189,"t":2},{"id":"Qdfa05491fac1","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.22"],"stem":"真理相对性强调正确认识的有限性，不等于没有客观正确内容或真假各半。","answer":"正确","polarity":"正确句"},{"id":"Qe5fb56f91f06","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.22"],"stem":"任何真理都有相对性，所以都可以按个人喜好改成相反说法。","answer":"错误","polarity":"易错句"},{"id":"Qd12fbc46cce8","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.23"],"stem":"把在特定条件下成立的认识推广到不适用的条件，可能形成谬误。","answer":"正确","polarity":"正确句"},{"id":"Q1b425524bbde","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.23"],"stem":"一项认识只要在一个条件下成立，就在所有条件下都必然成立。","answer":"错误","polarity":"易错句"},{"id":"Qd64aaf95f5f0","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.24"],"stem":"真理与谬误在一定条件下可以转化，但不能在对象条件完全不变时任意混同真假。","answer":"正确","polarity":"正确句"},{"id":"Qef4cd37b3329","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.24"],"stem":"承认真理谬误可以转化，就意味着同一命题在同一条件下既真又假。","answer":"错误","polarity":"易错句"},{"id":"Q92f8b03e660e","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.25"],"stem":"实践是检验认识真理性的唯一标准，逻辑证明发挥重要作用但不能取代最终实践检验。","answer":"正确","polarity":"正确句"},{"id":"Q0e0a731d7d16","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.25"],"stem":"只要理论内部逻辑一致，就无须检验其经验前提是否符合现实。","answer":"错误","polarity":"易错句"},{"id":"Q010901f7f085","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.26"],"stem":"实践标准地位确定，具体实践受条件限制、检验能力可能不充分，二者可以统一。","answer":"正确","polarity":"正确句"},{"id":"Q7e8a3770789b","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.26"],"stem":"实践标准有不确定性，所以在任何时候都无法区分真理与谬误。","answer":"错误","polarity":"易错句"},{"id":"Qf2301b525ea9","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.27"],"stem":"一次成功只支持与其具体条件和检验范围相应的结论，不能自动证明整套解释全部正确。","answer":"正确","polarity":"正确句"},{"id":"Q10d9fe1a506d","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.27"],"stem":"一个错误方法碰巧得到正确结果，就证明该方法的全部解释都是真理。","answer":"错误","polarity":"易错句"},{"id":"Qcf87cfaa535f","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.28"],"stem":"真理评价关心是否符合对象，价值评价关心对象对主体需要和发展的意义。","answer":"正确","polarity":"正确句"},{"id":"Qeecbdff6bf94","src":"底稿","kind":"基础判断","type":"判断","module":"M6","cards":["M6.28"],"stem":"某种说法对某人有用，就证明它所描述的事实一定真实。","answer":"错误","polarity":"易错句"},{"id":"Q149dea59117c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.01"],"stem":"社会存在指社会物质生活条件，不能把社会里一切确实存在的观念都直接归为社会存在。","answer":"正确","polarity":"正确句"},{"id":"Q3f1948a47af8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.01"],"stem":"某种思想在社会中确实有人相信，因此该思想本身就属于社会存在而非社会意识。","answer":"错误","polarity":"易错句"},{"id":"Qb733c971765c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.02"],"stem":"地理环境和人口因素影响社会发展，物质资料生产方式是社会历史发展的决定力量。","answer":"正确","polarity":"正确句","o":148,"t":1},{"id":"Qaf30a2001e19","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.02"],"stem":"一个社会的性质和历史形态完全由人口数量或地理位置决定。","answer":"错误","polarity":"易错句"},{"id":"Q6fde0ec3b1fc","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.03"],"stem":"生产方式是生产力与生产关系的统一，不能把生产关系排除在社会存在之外。","answer":"正确","polarity":"正确句"},{"id":"Q2e30779d0b89","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.03"],"stem":"生产方式只包括机器技术，不包括人与人在生产中的关系。","answer":"错误","polarity":"易错句"},{"id":"Qacc830371241","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.04"],"stem":"社会存在决定社会意识，社会意识能通过实践反作用于社会存在。","answer":"正确","polarity":"正确句"},{"id":"Q3a2b01ea8aa1","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.04"],"stem":"社会意识能够影响现实，就说明社会意识在根本关系上决定社会存在。","answer":"错误","polarity":"易错句"},{"id":"Q137af6616be7","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.05"],"stem":"社会意识可落后或在一定程度上预见趋势，不能要求它与社会存在每一变化完全同步。","answer":"正确","polarity":"正确句"},{"id":"Q18998b15338c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.05"],"stem":"社会存在发生变化后，所有社会观念都必须立即同时改变。","answer":"错误","polarity":"易错句"},{"id":"Q75462481f169","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.06"],"stem":"经济发展水平与某种思想文化发展水平不必机械一一对应。","answer":"正确","polarity":"正确句"},{"id":"Qe5f241b61f31","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.06"],"stem":"某地经济相对落后，就不可能出现任何领先的思想认识。","answer":"错误","polarity":"易错句"},{"id":"Q9e3b9f41f042","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.07"],"stem":"社会意识具有历史继承、形式间相互影响和能动反作用，反作用是其相对独立性的突出表现。","answer":"正确","polarity":"正确句","o":199,"t":2},{"id":"Q46fcef4c963b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.07"],"stem":"相对独立性意味着社会意识能够完全摆脱社会存在而独立决定历史。","answer":"错误","polarity":"易错句"},{"id":"Q865e5292a6c4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.08"],"stem":"社会意识范围较广，不能把一切自然科学知识都直接判为服务特定经济基础的意识形态。","answer":"正确","polarity":"正确句"},{"id":"Qa475ffa7021b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.08"],"stem":"凡属于社会意识的知识，都必然是具有特定阶级性的观念上层建筑。","answer":"错误","polarity":"易错句"},{"id":"Qa81f09de1094","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.09"],"stem":"生产力着眼人与自然的生产能力，生产关系着眼人与人在生产中的经济关系。","answer":"正确","polarity":"正确句"},{"id":"Q40a304d33999","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.09"],"stem":"生产关系就是人与自然的关系，生产力就是人与人之间的所有制关系。",
