"answer":"错误","polarity":"易错句"},{"id":"Q919c66c6982f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.10"],"stem":"劳动者、劳动资料、劳动对象是生产力基本要素，生产资料包括劳动资料和劳动对象。","answer":"正确","polarity":"正确句"},{"id":"Q26f59f71c3d4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.10"],"stem":"生产资料就是劳动者与劳动对象，不包括劳动资料。","answer":"错误","polarity":"易错句","o":135,"t":1},{"id":"Qd2e731b2253d","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.11"],"stem":"劳动对象是劳动作用的对象，劳动资料是劳动者用来影响对象的物质条件。","answer":"正确","polarity":"正确句"},{"id":"Q0afe203ac0dd","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.11"],"stem":"用于加工原材料的机器，与被加工的原材料在任何情况下都属于同一概念。","answer":"错误","polarity":"易错句","hold":"答案不唯一（核对人审读），暂停自动出题"},{"id":"Q05097f434ad1","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.12"],"stem":"劳动者是生产力中最活跃的因素，生产工具反映生产力水平，科学技术是第一生产力。","answer":"正确","polarity":"正确句","o":77,"t":1},{"id":"Qa62f99ee91a4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.12"],"stem":"科学技术是第一生产力，所以劳动者、工具和对象都不再是生产力的必要因素。","answer":"错误","polarity":"易错句"},{"id":"Q5395b5d02746","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.13"],"stem":"生产资料所有制关系、生产中的地位和相互关系、产品分配关系构成生产关系的主要方面。","answer":"正确","polarity":"正确句","o":185,"t":2},{"id":"Qe5b80f922a92","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.13"],"stem":"生产关系只指最终如何分配产品，与生产资料归谁占有无关。","answer":"错误","polarity":"易错句"},{"id":"Qb2a325d776d7","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.14"],"stem":"生产关系由人参与形成和改变，但受生产力和现实条件制约，不由意志任意选择。","answer":"正确","polarity":"正确句"},{"id":"Qdd9f8323db2c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.14"],"stem":"生产关系需要人建立，所以人可以完全不顾生产力条件随意设定并保证有效。","answer":"错误","polarity":"易错句"},{"id":"Q93061a57e90b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.15"],"stem":"生产力决定生产关系，适合生产力要求的生产关系促进生产力发展，不适合则阻碍。","answer":"正确","polarity":"正确句"},{"id":"Q2c3009f9060f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.15"],"stem":"生产关系能反作用于生产力，因此生产关系在根本关系上决定生产力。","answer":"错误","polarity":"易错句"},{"id":"Qff72f7284a2c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.16"],"stem":"经济基础指一定生产力发展阶段所决定的生产关系总和，不是GDP、货币财富或基础设施的同义词。","answer":"正确","polarity":"正确句"},{"id":"Q16e5bb8a1deb","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.16"],"stem":"经济基础就是一个地方拥有的资金总量和道路厂房总量。","answer":"错误","polarity":"易错句"},{"id":"Q510669d73d0c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.17"],"stem":"一定社会的生产关系从其总和及其对上层建筑的基础作用看，构成经济基础。","answer":"正确","polarity":"正确句"},{"id":"Q3aa214f49695","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.17"],"stem":"生产关系与经济基础是两个完全互不相干的社会层次。","answer":"错误","polarity":"易错句"},{"id":"Q5a80ee831ef5","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.18"],"stem":"上层建筑包括政治法律制度及相关组织设施，也包括与经济基础相适应的意识形态。","answer":"正确","polarity":"正确句"},{"id":"Q20542ca9972e","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.18"],"stem":"上层建筑只有思想观念，不包括政治组织、法律制度及相关设施。","answer":"错误","polarity":"易错句"},{"id":"Q3b2c6fe0c674","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.19"],"stem":"在上层建筑中，政治上层建筑居主导地位，国家政权是其核心。","answer":"正确","polarity":"正确句","o":117,"t":1},{"id":"Q155510b56ec6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.19"],"stem":"经济基础是上层建筑内部的一种思想，国家政权则属于生产工具。","answer":"错误","polarity":"易错句"},{"id":"Q424d7568f25c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.20"],"stem":"所有制的实际经济关系属于生产关系，确立和保障它的法律制度属于上层建筑。","answer":"正确","polarity":"正确句"},{"id":"Qe2bd14464201","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.20"],"stem":"只要法律条文涉及所有制，这条法律作为制度就自动属于经济基础。","answer":"错误","polarity":"易错句"},{"id":"Q2396bcffdb3c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.21"],"stem":"经济基础决定上层建筑，上层建筑又能维护或调整相应经济关系。","answer":"正确","polarity":"正确句"},{"id":"Qff4d564c0f0a","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.21"],"stem":"法律政治制度有重大作用，所以经济基础由它们任意创造并根本决定。","answer":"错误","polarity":"易错句"},{"id":"Q129930539197","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.22"],"stem":"上层建筑服务于适合生产力发展的经济基础时，才能就这种作用说它促进社会进步。","answer":"正确","polarity":"正确句"},{"id":"Q89b79fa0b0e4","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.22"],"stem":"只要上层建筑适应并维护现有经济基础，就无条件促进社会进步。","answer":"错误","polarity":"易错句"},{"id":"Q7f95bda3f77c","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.23"],"stem":"生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，不等于某阶段社会主要矛盾。","answer":"正确","polarity":"正确句","o":181,"t":2},{"id":"Q696364cd282f","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.23"],"stem":"社会主要矛盾表述发生变化，就说明社会基本矛盾不再存在。","answer":"错误","polarity":"易错句"},{"id":"Qef3fd0a6cbca","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.24"],"stem":"社会基本矛盾运动是社会发展的根本动力，生产力是社会发展的最终决定力量。","answer":"正确","polarity":"正确句"},{"id":"Qfb388d745236","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.24"],"stem":"阶级斗争是任何社会形态发展的唯一根本动力，生产力与社会基本矛盾无关紧要。","answer":"错误","polarity":"易错句"},{"id":"Qaf2719ab79b3","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.25"],"stem":"阶级斗争是阶级社会发展的直接动力，这一表述不能删去阶级社会的限定。","answer":"正确","polarity":"正确句"},{"id":"Q0ce4bf32ee17","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.25"],"stem":"阶级斗争是包括无阶级社会在内的一切社会发展的直接动力。","answer":"错误","polarity":"易错句"},{"id":"Qa26e085dff3d","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.26"],"stem":"社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力。","answer":"正确","polarity":"正确句","o":137,"t":1},{"id":"Qdde94c2c5506","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.26"],"stem":"社会主义改革的定义，就是从根本上推翻社会主义基本制度。","answer":"错误","polarity":"易错句"},{"id":"Q03d65bbb40f5","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.27"],"stem":"人民群众是推动社会历史发展的主体，不能机械等同于任何场合人数较多的一方。","answer":"正确","polarity":"正确句"},{"id":"Qa4ec95deb2f3","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.27"],"stem":"只要在某次争论中人数占多数，就自动成为真理和历史进步的决定标准。","answer":"错误","polarity":"易错句"},{"id":"Q9c7a62480703","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.28"],"stem":"人民群众创造物质财富、精神财富，并是社会变革的决定力量。","answer":"正确","polarity":"正确句","o":54,"t":1},{"id":"Q90223b490905","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.28"],"stem":"精神财富只由少数名人创造，因此与群众实践和物质条件完全无关。","answer":"错误","polarity":"易错句"},{"id":"Q83dad524fe03","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.29"],"stem":"承认群众创造历史，不排斥杰出个人的重要作用；个人作用受历史条件制约。","answer":"正确","polarity":"正确句"},{"id":"Qa5c0e1463da2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.29"],"stem":"承认群众创造历史，就必须否认任何个人对具体历史事件起过重要作用。","answer":"错误","polarity":"易错句"},{"id":"Q5389d306dbef","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.30"],"stem":"历史由人的有意识活动形成，但总体结果不必完全等于任何个人的预定意图。","answer":"正确","polarity":"正确句"},{"id":"Q9b777d6a76f6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.30"],"stem":"每个人都有目的，所以社会历史的全部结果都能由某个人的意志任意决定。","answer":"错误","polarity":"易错句"},{"id":"Q05d8a97025e9","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.31"],"stem":"人的本质在其现实性上是一切社会关系的总和，不能只用孤立生物属性解释人的社会性质。","answer":"正确","polarity":"正确句"},{"id":"Q5747f6676cb6","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.31"],"stem":"人的本质只由出生时的自然属性固定，社会关系和实践对它毫无影响。","answer":"错误","polarity":"易错句"},{"id":"Q6efb9e60504b","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.32"],"stem":"劳动是道德起源的首要前提，社会关系是客观条件，人的自我意识是主观条件。","answer":"正确","polarity":"正确句"},{"id":"Qc39971c5e4a8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.32"],"stem":"道德起源的首要前提是人的自我意识，劳动与社会关系都不需要。","answer":"错误","polarity":"易错句"},{"id":"Qb8c60ff532a8","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.33"],"stem":"道德与法律的产生和发展具有社会历史条件，不能说必须先有法律才可能有道德。","answer":"正确","polarity":"正确句"},{"id":"Q6a652fd2d7ec","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.33"],"stem":"没有成文法律以前，人类就不可能存在任何道德规范。","answer":"错误","polarity":"易错句"},{"id":"Qdaf1ef8f8d94","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.34"],"stem":"法律和道德都能规范行为，道德侧重教化与内心约束，法律具有国家强制保障。","answer":"正确","polarity":"正确句"},{"id":"Q28fdbcf062f2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.34"],"stem":"法律只与行为有关且完全没有思想引导作用，道德只管思想而从不规范行为。","answer":"错误","polarity":"易错句"},{"id":"Q168fd3b843dd","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.35"],"stem":"法治与德治相辅相成，但道德评价不能任意替代法律规则，法律也不覆盖全部道德要求。","answer":"正确","polarity":"正确句"},{"id":"Q38cf0c19a7b2","src":"底稿","kind":"基础判断","type":"判断","module":"M7","cards":["M7.35"],"stem":"凡道德上不赞同的行为，都必然已经违法，可以不经法律依据直接处罚。","answer":"错误","polarity":"易错句"},{"id":"N-M1-001","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.06","M1.07"],"lead":"","stem":"哲学基本问题包括两个方面，其中对思维能否正确认识存在这一问题的不同回答，是划分唯物主义和唯心主义的标准。","options":{},"answer":"错误","fix":"哲学基本问题包括两个方面，其中对思维能否正确认识存在这一问题的不同回答，是划分可知论和不可知论的标准。","analysis":"错在“划分唯物主义和唯心主义”。哲学基本问题是思维和存在的关系问题，包括两个方面：一是思维和存在何者为第一性，对它的不同回答是划分唯物主义和唯心主义的唯一标准；二是思维能否正确认识存在（思维和存在有没有同一性），对它的不同回答是划分可知论和不可知论的标准。题干把第二个方面的划分结果安到了唯物、唯心上。黑格尔就是反例：他承认思维能认识存在，却是唯心主义者。","trap":"标准错配：能否认识存在分可知论与不可知论，何者为第一性才分唯物主义与唯心主义。","basis":"教材通行表述：思维和存在何者为第一性是划分唯物主义和唯心主义的唯一标准，思维和存在有没有同一性是划分可知论和不可知论的标准；底稿M1.06、M1.07。","refs":["T"],"note":"","o":82,"t":1},{"id":"N-M1-002","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.16"],"lead":"","stem":"实践性是马克思主义的本质属性，人民至上是马克思主义的政治立场。","options":{},"answer":"错误","fix":"人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场。","analysis":"错在“实践性”。讲义原句是“人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场”。人民性回答马克思主义站在谁的立场、为谁的问题，与后半句的“人民至上”一脉相承。实践性讲的是马克思主义来源于实践、指导改造世界的实践，讲义给它的定位是“实践观点是马克思主义首要的和基本的观点”“实践性是马克思主义区别于其他理论的根本特征”。几个特征各有自己的定位词，题干把“本质属性”安到了实践性上。","trap":"主体偷换：“本质属性”属于人民性；实践性对应的是“首要的和基本的观点”“区别于其他理论的根本特征”。","basis":"讲义第38页“人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场”“实践观点是马克思主义首要的和基本的观点”，第42页“实践性是马克思主义区别于其他理论的根本特征”；底稿M1.16。","refs":["H"],"note":"","o":14,"t":1},{"id":"N-M1-003","src":"新增","kind":"仿真题","type":"判断","module":"M1","cards":["M1.16"],"lead":"","stem":"马克思主义的人民性是以阶级性为深刻基础的，是无产阶级先进性的体现。","options":{},"answer":"正确","fix":"","analysis":"正确，这是讲义原句。人民性和阶级性并不对立：无产阶级的根本利益同最广大人民的根本利益是一致的，马克思主义站在无产阶级立场上，也就是站在人民立场上，所以它的人民性以阶级性为深刻基础。不能以为讲人民性就要淡化或取消阶级性。","trap":"人民性不排斥阶级性：马克思主义的人民性以阶级性为深刻基础。","basis":"讲义第38页“马克思主义的人民性是以阶级性为深刻基础的，是无产阶级先进性的体现”；底稿M1.16。","refs":["H"],"note":"","o":89,"t":1},{"id":"N-M1-004","src":"新增","kind":"拓展","type":"判断","module":"M1","cards":["M1.18","M1.09"],"lead":"","stem":"马克思主义哲学批判地吸收了黑格尔哲学中唯物主义的“基本内核”和费尔巴哈哲学中辩证法的“合理内核”。","options":{},"answer":"错误","fix":"马克思主义哲学批判地吸收了黑格尔哲学中辩证法的“合理内核”和费尔巴哈哲学中唯物主义的“基本内核”。","analysis":"错在把两人的贡献对调了。黑格尔哲学是唯心主义的，但包含丰富的辩证法思想，马克思主义吸收的是其辩证法的“合理内核”；费尔巴哈恢复了唯物主义的权威，但他的唯物主义是形而上学的，马克思主义吸收的是其唯物主义的“基本内核”。这也说明唯物唯心与辩证形而上学是两组不同的划分：黑格尔是唯心而辩证，费尔巴哈是唯物而形而上学。二人同属三大思想来源中的德国古典哲学。","trap":"主宾颠倒：辩证法的“合理内核”取自黑格尔，唯物主义的“基本内核”取自费尔巴哈。","basis":"教材通行表述：马克思主义批判继承了黑格尔辩证法的“合理内核”和费尔巴哈唯物主义的“基本内核”；底稿附录origin_reference把黑格尔、费尔巴哈列为德国古典哲学的代表；底稿M1.09、M1.18。","refs":["T","H"],"note":"","o":164,"t":2},{"id":"N-M1-005","src":"新增","kind":"拓展","type":"判断","module":"M1","cards":["M1.11","M1.09"],"lead":"","stem":"恩格斯说费尔巴哈“下半截是唯物主义者，上半截是唯心主义者”，指的是费尔巴哈在自然观上坚持唯物主义，在社会历史观上却陷入了唯心主义。","options":{},"answer":"正确","fix":"","analysis":"正确。这句话出自恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》。“下半截”指自然观，“上半截”指社会历史观：费尔巴哈在自然观上坚持唯物主义，但不懂得实践和社会关系的作用，一进入社会历史领域就陷入唯心主义。这是旧唯物主义（包括近代形而上学唯物主义）的共同局限：坚持唯物主义的立场，不等于在一切领域都贯彻了唯物主义。","trap":"唯物主义者也可能是“半截子”的：自然观唯物不等于历史观唯物。","basis":"恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》原句，教材通行引用；底稿M1.11“历史观上的唯心主义局限”。","refs":["T"],"note":""},{"id":"N-M1-006","src":"新增","kind":"仿真题","type":"多选","module":"M1","cards":["M1.15","M1.18","M1.19"],"lead":"19世纪40年代，马克思、恩格斯在批判继承前人优秀思想成果的基础上创立了马克思主义。","stem":"关于马克思主义，下列说法正确的有（　）","options":{"A":"唯物史观和剩余价值学说两大发现，使社会主义从空想变成了科学","B":"马克思主义的三个组成部分是马克思主义哲学、政治经济学和科学社会主义","C":"马克思主义是不断发展的开放的学说，具有与时俱进的理论品质","D":"马克思主义具有科学的世界观和方法论基础，这一基础就是唯物史观和剩余价值学说"},"answer":"ABC","fix":"","analysis":"A项正确：恩格斯把唯物史观和剩余价值学说概括为马克思的两大发现，指出由于这两大发现，社会主义变成了科学。\nB项正确：马克思主义由马克思主义哲学、马克思主义政治经济学和科学社会主义三个基本部分组成；德国古典哲学、英国古典政治经济学、英法空想社会主义是它的思想来源，不是组成部分。\nC项正确：这是发展性的内容，为讲义原句。\nD项错误：讲义原句是“马克思主义具有科学的世界观和方法论基础，即辩证唯物主义和历史唯物主义”；剩余价值学说属于政治经济学，不是世界观和方法论，选项把“两大发现”的名单安到了“世界观和方法论基础”上。另注意：讲义第39页“马克思在哲学史上的两大历史贡献”是另一种提法，不能拿来回答“两大发现”。","trap":"两组“两个”别串：两大发现是唯物史观和剩余价值学说，世界观和方法论基础是辩证唯物主义和历史唯物主义。","basis":"讲义第38页“马克思主义具有科学的世界观和方法论基础，即辩证唯物主义和历史唯物主义”“马克思主义是不断发展的开放的学说，具有与时俱进的理论品质”，第37页三大思想渊源；底稿附录origin_reference的three_components；恩格斯《社会主义从空想到科学的发展》关于两大发现的论述；底稿M1.15、M1.18、M1.19。","refs":["H","G","T"],"note":"","o":56,"t":1},{"id":"N-M1-007","src":"新增","kind":"拓展","type":"多选","module":"M1","cards":["M1.03","M1.12","M1.13","M1.14","M2.04"],"lead":"南宋陆九渊说：“宇宙便是吾心，吾心即是宇宙。”朱熹则说：“未有天地之先，毕竟也只是理。”","stem":"关于这两种观点，下列说法正确的有（　）","options":{"A":"陆九渊把个人的心看作世界的本原，属于主观唯心主义","B":"朱熹并不否认天地万物的存在，但他把“理”当作天地万物的本原，仍属于唯心主义","C":"朱熹所说的“理”虽然不依赖于个人的意识，但仍是精神性的东西，不具有物质的客观实在性","D":"两种观点都以精神为第一性，区别在于这种精神是个人的还是独立于人之外的"},"answer":"ABCD","fix":"","analysis":"四项都正确。\nA项：陆九渊把宇宙归结为“吾心”，以个人的主观精神为本原，属于主观唯心主义。\nB项：朱熹承认有天地万物，但认为“有此理，便有此天地”，把“理”放在第一性，所以仍是唯心主义（客观唯心主义）；承认外部世界存在，不足以判定为唯物主义，关键看何者为第一性。\nC项：客观唯心主义的“客观”只是相对于个人意识而言，“理”本身仍是精神性的；物质的客观实在性是指不依赖于意识而存在，不能把“客观精神”当成物质。\nD项：主观唯心主义和客观唯心主义同属唯心主义，都以精神为第一性，区别在于把个人的精神还是独立于人的精神当作本原。","trap":"B、C两项带着转折，看似可疑，其实都对：承认外界存在≠唯物主义，“客观”精神≠客观实在。","basis":"讲义第39页：主观唯心主义“认为世界的本原是人的精神”，列举“吾心即宇宙”；客观唯心主义“认为世界的本原是人之外的精神”，关键词有“理”；底稿M1.03、M1.12、M1.13、M1.14、M2.04。","refs":["H","T"],"note":"","o":191,"t":2},{"id":"N-M2-001","src":"新增","kind":"拓展","type":"判断","module":"M2","cards":["M2.01","M2.04"],"lead":"","stem":"世界的存在是它的统一性的前提，但世界的统一性并不在于它的存在，而在于它的物质性。","options":{},"answer":"正确","fix":"","analysis":"正确。恩格斯在《反杜林论》中指出：世界的统一性并不在于它的存在，尽管世界的存在是它的统一性的前提；世界的真正的统一性在于它的物质性。“存在”的范围太宽：思想、观念也是存在的，唯心主义也承认世界存在，只是说世界统一于精神。只有说世界统一于物质，才同唯心主义划清界限。题中“并不在于它的存在”看似别扭，恰是原意。","trap":"存在≠物质性：存在只是统一性的前提，统一的根据是物质性。","basis":"恩格斯《反杜林论》“世界的真正的统一性是在于它的物质性”，教材通行引用；底稿M2.01、M2.04。","refs":["T"],"note":"","o":183,"t":2},{"id":"N-M2-002","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.03","M2.05","M1.08","M7.01"],"lead":"列宁指出：“物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。”","stem":"关于这一物质定义，下列理解正确的有（　）","options":{"A":"定义所概括的客观实在性，是在各种具体物质形态之外独立存在的另一个特殊实体","B":"定义坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限","C":"定义中的“复写、摄影、反映”，坚持了可知论，同不可知论划清了界限","D":"客观实在性是物质的唯一特性，人类社会的物质生活条件同样具有客观实在性"},"answer":"BCD","fix":"","analysis":"A项错误：物质范畴是从各种具体物质形态中抽象出来的共同特性，这种共性就存在于具体事物之中，不是在具体事物之外另有一个实体；把共性说成脱离个别事物独立存在的东西，正是“理在事先”一类客观唯心主义的思路。\nB项正确：定义肯定物质不依赖于意识而存在，坚持物质是世界的本原，同唯心主义一元论和二元论划清了界限。\nC项正确：定义肯定物质能为感觉所复写、摄影、反映，坚持了能动的反映论和可知论，同不可知论划清了界限。\nD项正确：客观实在性是物质的唯一特性；地理环境、人口因素和物质资料的生产方式等社会物质生活条件同样不依赖于社会意识而存在，所以列宁的定义也体现了唯物主义自然观与历史观的统一。","trap":"抽象出的共性≠另一个实体：物质范畴概括的客观实在性就存在于具体事物之中。","basis":"列宁《唯物主义和经验批判主义》的物质定义及其意义（教材通行表述：坚持唯物主义一元论，坚持能动的反映论和可知论，体现唯物主义自然观与历史观的统一）；讲义第39页“物质的唯一特性是客观实在性”；底稿M2.03“抽象共同属性不等于脱离具体形态另有一个实体”、M2.05、M7.01。","refs":["T","H"],"note":"","o":179,"t":2},{"id":"N-M2-003","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.12","M2.14","M2.15","M2.16","M2.01"],"lead":"恩格斯指出：“我们的意识和思维，不论它看起来是多么超感觉的，总是物质的、肉体的器官即人脑的产物。”","stem":"关于意识，下列说法正确的有（　）","options":{"A":"意识的内容是客观的，形式是主观的","B":"人脑是意识的物质器官，也是意识内容的源泉","C":"“千里眼”“顺风耳”等虚构的神话形象，也是对客观存在的反映","D":"意识是人脑这一物质器官的产物，因而意识本身也是一种特殊的物质"},"answer":"AC","fix":"","analysis":"A项正确：意识是客观存在的主观映象，内容来自客观对象，反映的形式带有主体的主观特点，是客观内容和主观形式的统一。这里的“客观”指内容来源于客观存在，不是说内容一定正确：错误的意识，内容同样来源于客观存在。\nB项错误：人脑是意识的物质器官，但意识内容的源泉是客观存在；引言说意识是“人脑的产物”，讲的是意识离不开人脑这一物质器官，不是说人脑能凭空产生意识内容。\nC项正确：神话形象是人脑对现实材料加工、组合的产物，眼、耳和看得远、听得远的愿望都来自现实生活，错误的、虚幻的意识同样来源于客观存在。\nD项错误：意识依赖人脑，是人脑的机能和属性，但意识本身不是物质；把意识说成一种物质，就抹杀了物质和意识的区别，庸俗唯物主义把思想看作人脑分泌的物质就是这种错误。","trap":"器官≠源泉；“人脑的产物”≠“意识就是物质”。","basis":"恩格斯《路德维希·费尔巴哈和德国古典哲学的终结》原句，教材通行引用；讲义第40页“意识的生理基础是人脑，意识的本质是对客观存在的主观反映”；底稿M2.12、M2.14、M2.15、M2.16、M2.01。","refs":["T","H"],"note":"","o":16,"t":1},{"id":"N-M2-004","src":"新增","kind":"拓展","type":"单选","module":"M2","cards":["M2.02","M2.18","M1.12"],"lead":"成语“杯弓蛇影”讲的是：有位客人把墙上挂着的弓映在酒杯里的影子当成了蛇，喝下酒后疑心成病；后来弄清杯中的“蛇”只是弓的倒影，病很快就好了。","stem":"对这一故事理解正确的是（　）","options":{"A":"客人的病由“疑心”引起，可见这个故事体现的是主观唯心主义的观点","B":"客人因疑成病，说明意识不经过实践也能直接改造外部物质世界","C":"客人因疑成病、释疑而愈，说明意识能对人体生理活动产生作用","D":"客人释疑而愈，说明意识对人体生理活动起决定作用"},"answer":"C","fix":"","analysis":"A项错误：判断是否属于主观唯心主义，要看是否把个人精神当作世界的本原、认为事物因人的精神而存在；这个故事讲的是心理对生理的影响，并没有主张外物依赖人心而存在，不能因为“疑心”里有个“心”字就归入主观唯心主义。\nB项错误：生病发生在客人自己的身体上，属于意识对生理活动的影响，不是意识直接改造外部物质世界；意识改造外部世界要通过实践。\nC项正确：疑心杯中有蛇而生病，弄清真相后病愈，说明意识能够影响人体的生理活动，讲义称“意识对人体生理活动具有调节和控制作用”。\nD项错误：意识对生理活动有调节作用，但不起决定作用，起决定作用的仍是物质；把“能产生作用”说成“起决定作用”，夸大了意识的作用。","trap":"调节作用≠决定作用；影响自身生理≠直接改造外部世界；有“心”字≠主观唯心主义。","basis":"讲义第40页“意识对人体生理活动具有调节和控制作用”“意识对改造客观世界具有指导作用”，第39页主观唯心主义“认为世界的本原是人的精神”；底稿M2.02、M2.18、M1.12。","refs":["H","T"],"note":"","o":110,"t":1},{"id":"N-M2-005","src":"新增","kind":"拓展","type":"多选","module":"M2","cards":["M2.08","M2.09","M2.10"],"lead":"古希腊哲学家赫拉克利特说“人不能两次踏进同一条河流”，他的追随者克拉底鲁则说“人一次也不能踏进同一条河流”。","stem":"对此，下列理解正确的有（　）","options":{"A":"赫拉克利特的说法肯定了运动的绝对性","B":"克拉底鲁的说法否认了相对静止，走向了相对主义和诡辩论","C":"克拉底鲁的说法否认了绝对运动，陷入了形而上学","D":"河水时刻在流动，但河流在一定时期内仍保持着自身的基本性质，这也是一种相对静止"},"answer":"ABD","fix":"","analysis":"A项正确：河水不断流动，第二次踏进的已不是原来的河水，赫拉克利特以此肯定了事物的运动变化，即运动的绝对性。\nB项正确：克拉底鲁说连一次也不能踏进，等于说事物每一瞬间都不是它自身，否认了相对静止，事物就无法被区分和把握，走向相对主义和诡辩论。\nC项错误：克拉底鲁不但没有否认运动，反而把运动的绝对性夸大到否认任何相对静止；否认绝对运动、把事物看成静止不变的，才是形而上学。\nD项正确：相对静止有两种情形，一是空间位置在一定条件下暂时不变，二是根本性质在一定条件下暂时不变；河流在一定时期内仍是这条河，属于后一种。","trap":"记牢对应：否认相对静止→相对主义、诡辩论；否认绝对运动→形而上学。","basis":"讲义第39页“运动是绝对的、无条件的、永恒的；静止是相对的、有条件的、暂时的”；教材通行表述：只承认绝对运动、否认相对静止会导致相对主义和诡辩论；底稿M2.08、M2.09、M2.10。","refs":["H","T"],"note":"","o":88,"t":1},{"id":"N-M2-006","src":"新增","kind":"仿真题","type":"多选","module":"M2","cards":["M2.21","M2.22"],"lead":"规律是事物运动发展中本身所固有的本质的、必然的、稳定的联系。","stem":"关于规律，以下表述正确的有（　）","options":{"A":"荀子说“天行有常，不为尧存，不为桀亡”，强调的是规律的客观性","B":"人们修建水库调节水流，说明人可以根据需要改变水往低处流的规律","C":"规律是客观的，但人们可以通过改变条件来限制某些规律的破坏作用","D":"自然界、人类社会和人的思维领域，都有各自的规律"},"answer":"ACD","fix":"","analysis":"A项正确：“天行有常”指自然界的运行有其固有规律，“不为尧存，不为桀亡”指它不因圣君暴君而存亡，体现规律不以人的意志为转移。\nB项错误：修建水库改变的是水流的条件，水仍然往低处流，人并没有改变这条规律；人不能创造、消灭规律，能做的是认识规律、改变规律发生作用的条件。\nC项正确：规律客观不等于规律发生作用的条件永远不变，人们可以在认识规律的基础上改变条件，限制某些规律的破坏作用、扩大其有益作用，如修堤筑坝治理水患。\nD项正确：规律是普遍的，有自然规律、社会规律和思维规律。","trap":"改变条件≠改变规律：水库改变的是条件，不是“水往低处流”。","basis":"教材通行表述：规律是客观的，人们不能创造、消灭规律，但可以认识规律，根据规律发生作用的条件利用规律；荀子《天论》原句；底稿M2.21、M2.22“规律具有客观性，不等于某种具体规律的适用条件和表现形式永远不变”。","refs":["T"],"note":"","o":61,"t":1},{"id":"N-M2-007","src":"新增","kind":"拓展","type":"单选","module":"M2","cards":["M2.24"],"lead":"","stem":"下列古语中，体现尊重客观规律与发挥主观能动性相统一的是（　）","options":{"A":"顺天时，量地利，则用力少而成功多","B":"宋人有闵其苗之不长而揠之者……其子趋而往视之，苗则槁矣","C":"死生有命，富贵在天","D":"郑人买履，宁信度，无自信也"},"answer":"A","fix":"","analysis":"A项正确：出自贾思勰《齐民要术》。“顺天时，量地利”是尊重农业生产的客观规律，“用力”是发挥主观能动性，二者结合才能“用力少而成功多”。\nB项错误：出自《孟子》，即“揠苗助长”，违背禾苗生长的规律，片面夸大主观能动性，结果“苗则槁矣”。\nC项错误：把生死富贵归于命运和天意，否认了人的主观能动性，属于宿命论观点。\nD项错误：郑人宁可相信量好的尺码也不相信自己的脚，讲的是从教条出发而不从实际出发，不是规律与能动性的统一。","trap":"两头都不能偏：只讲能动而违背规律（揠苗）、听天由命而放弃能动（宿命论）都是片面的。","basis":"教材通行表述：尊重客观规律是正确发挥主观能动性的前提，认识和利用规律又必须充分发挥主观能动性；底稿M2.24。","refs":["T"],"note":"","o":162,"t":2},{"id":"N-M3-001","src":"新增","kind":"仿真题","type":"判断","module":"M3","cards":["M3.18"],"lead":"","stem":"唯物辩证法认为，量变和质变是相互渗透的，在事物的质变过程中，也有旧质在量上的收缩和新质在量上的扩张。","options":{},"answer":"正确","fix":"","analysis":"正确。量变和质变的相互渗透有两层意思：一是在总的量变过程中有阶段性和局部性的部分质变；二是在质变过程中也有量的变化，表现为旧质在量上的收缩和新质在量上的扩张。题干说的是第二层，与教材一致。底稿M3.18只练了第一层（总的量变过程中可以包含局部质变），本题补上第二层：质变不是与量毫无关系的一跳，旧质逐步缩小、新质逐步扩大，本身就伴随着量的变化。易错：以为“量变只发生在质变之前，质变过程中没有量变”而判错；或者把两层说反，记成“总的量变过程中有旧质收缩、新质扩张”。","trap":"易误判为错：质变过程中同样有量的变化（旧质收缩、新质扩张）；“部分质变”属于总的量变过程，两层不要说反","basis":"教材通行表述（马工程《马克思主义基本原理》质量互变规律）：量变和质变是相互渗透的，一方面在总的量变过程中有阶段性和局部性的部分质变，另一方面在质变过程中也有旧质在量上的收缩和新质在量上的扩张。讲义第41页只列量变、质变的定义及“前提和必要准备”“必然结果”两条，未写此点。","refs":["T"],"note":"","o":94,"t":1},{"id":"N-M3-002","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.16","M3.14","M3.13","M3.01"],"lead":"量变是事物数量的增减和组成要素排列次序的变动，质变是事物根本性质的变化。","stem":"关于量变和质变，以下表述正确的有（）","options":{"A":"量变达到一定程度，必然引起质变","B":"事物外观发生了明显改变，不一定意味着事物发生了质变","C":"事物组成要素排列次序的变动，也可能引起事物性质的改变","D":"质变既巩固了量变的成果，又为新的量变开辟道路"},"answer":"ABCD","fix":"","analysis":"ABCD。\nA项正确：量变是质变的必要准备，质变是量变的必然结果；这个“必然”有前提，即量变达到一定程度、突破度的界限。\nA项带“必然”却是教材原意，不能见绝对词就判错；错的说法是删掉“达到一定程度”，说成任何量变都立即引起质变。\nB项正确：质变看的是根本性质是否改变，外观变化的幅度与性质是否改变是两回事，外观大变也可能没有变质（如商店重新装修、换了招牌，经营性质未变）。\nC项正确：组成要素排列次序的变动本身属于量变，但它和数量增减一样，突破度以后也会引起质变。如石墨在高温高压下转变为金刚石，碳原子的排列方式改变，物质的性质随之根本改变。易错是以为“排列次序变动只是量变，不会引起质变”。\nD项正确：质变不是运动的终点，它巩固量变的成果，并在新质的基础上开始新的量变。","trap":"四项全对：A项的“必然”带着“达到一定程度”的前提；C项排列次序的变动属于量变，但同样能引起质变。别因绝对词或“只是量变”误删","basis":"讲义第41页“量变：事物数量的增减和组成要素排列次序的变动”“质变：事物根本性质的变化”“（1）量变是质变的前提和必要准备。（2）质变是量变的必然结果。”；教材通行表述“量变达到一定程度必然引起质变”“质变……为新的量变开辟道路”；底稿M3.13条件栏“具体结构变化若已突破度并改变根本性质，应判断为质变”。","refs":["H","T"],"note":"","o":28,"t":1},{"id":"N-M3-003","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.10","M3.17","M3.11","M3.12","M3.21"],"lead":"唯物辩证法认为，发展是前进的、上升的运动，发展的实质是新事物的产生和旧事物的灭亡。","stem":"关于发展和新事物，以下表述正确的有（）","options":{"A":"运动变化的基本趋势是发展，因此事物的根本性质一旦发生了改变，也就意味着它实现了发展","B":"新事物在旧事物的“母体”中孕育成熟，保留了旧事物中合理的、适应新条件的因素","C":"新事物之所以必然战胜旧事物，是因为它在产生之初就比旧事物更加强大、更有力量","D":"新事物具有新的结构和功能，能适应变化了的环境和条件，这是它不可战胜的原因之一"},"answer":"BD","fix":"","analysis":"BD。\nA项错误：前半句是讲义原句，后半句推不出来。“基本趋势”说的是总方向，不是说每一个变化都是发展；根本性质改变就是质变，质变只说明性质变了，这种变化可以是前进上升的，也可以是倒退的（如社会历史中的复辟），只有前进上升的变化才是发展。\nB项正确：新事物是在旧事物的“母体”中孕育成熟的，它既否定旧事物中消极过时的东西，又保留旧事物中合理的、适应新条件的因素，并添加旧事物所不能容纳的新内容。这是新事物必然战胜旧事物的原因之一，也体现了辩证否定是扬弃。\nC项错误：新事物在产生之初往往比较弱小。它必然战胜旧事物，不是因为一开始就强大，而是由它的本质特点决定的：具有新的结构和功能，扬弃了旧事物，在社会历史领域还符合人民群众的根本利益和要求。\nD项正确：理由见C项，这是新事物不可战胜的第一条原因。","trap":"A项借讲义原句“运动变化的基本趋势是发展”推出“质变就是发展”，把总趋势偷换成每一次变化；C项把新事物取胜的原因偷换成“一开始就强大”","basis":"讲义第40页“一切形式的变化就是运动，运动变化的基本趋势是发展，发展的实质是新事物的产生，旧事物的灭亡”；教材通行表述：新事物必然战胜旧事物，一是新事物具有新的结构和功能，适应已经变化了的环境和条件，二是新事物在旧事物的“母体”中孕育成熟，保留旧事物中合理的、适应新条件的因素并添加新内容，三是在社会历史领域新事物符合人民群众的根本利益和要求；底稿M3.17“质变可以表现为进步或倒退”。","refs":["H","T"],"note":"","o":39,"t":1},{"id":"N-M3-004","src":"新增","kind":"拓展","type":"多选","module":"M3","cards":["M3.21","M3.19","M3.22","M3.23"],"lead":"马克思在《资本论》第一卷第二版跋中指出，辩证法“在对现存事物的肯定的理解中同时包含对现存事物的否定的理解，即对现存事物的必然灭亡的理解”。","stem":"关于辩证的否定和否定之否定规律，以下表述正确的有（）","options":{"A":"辩证的否定观既反对“肯定一切”，也反对“否定一切”","B":"肯定方面是事物中维持其存在的方面，因而凡是现存的事物都是合理的、应当保持的","C":"否定之否定阶段在更高的基础上重复肯定阶段的某些特征","D":"只看到事物发展的前进性而看不到曲折性，就会陷入循环论"},"answer":"AC","fix":"","analysis":"AC。\nA项正确：形而上学的否定观要么肯定一切，要么否定一切；辩证否定的实质是扬弃，既克服又保留，所以既反对全盘肯定，也反对全盘否定。底稿M3.21只练了“全盘抛弃”这一头，本项补上“全盘肯定”这一头。\nB项错误：前半句对，肯定方面是事物中维持其存在的方面；但这只描述事物保持现有性质的趋势，推不出“凡是现存的都是合理的、应当保持的”。引言说辩证法对现存事物的理解同时包含对其必然灭亡的理解，任何现存事物内部都有促使其灭亡的否定方面。讲义第41页写的“存在即合理”是简化说法，不能当作价值判断来用。\nC项正确：否定之否定阶段在更高的基础上重复肯定阶段的某些特征，仿佛回到了出发点，但不是原样复归，事物的发展呈螺旋式上升、波浪式前进。\nD项错误：把两种片面性配反了。只看到前进性、看不到曲折性，会把发展看成笔直上升的直线（直线论）；只看到曲折性、看不到前进性，才会把发展看成周而复始的循环（循环论）。","trap":"B项是讲义“存在即合理”的简化，肯定方面不能证明“现存即合理”；D项把直线论、循环论配反","basis":"马克思《资本论》第一卷第二版跋（引言原句）；教材通行表述：辩证否定的实质是扬弃，既克服又保留；否定之否定在更高的基础上重复旧阶段的某些特征，事物发展是前进性与曲折性的统一；底稿appendices.corrected_simplifications“由肯定因素引出‘任何存在都在价值上合理’”的纠正“肯定因素描述维持现有性质，不是价值正当性的通行证”；讲义第41页考点八。","refs":["H","T"],"note":"","o":40,"t":1},{"id":"N-M3-005","src":"新增","kind":"仿真题","type":"多选","module":"M3","cards":["M3.24","M4.01"],"lead":"恩格斯指出，辩证法“不过是关于自然、人类社会和思维的运动和发展的普遍规律的科学”。","stem":"关于唯物辩证法的总特征和基本规律，以下表述正确的有（）","options":{"A":"联系和发展的观点是唯物辩证法的总特征","B":"对立统一规律揭示了事物发展的源泉和动力","C":"主要矛盾和次要矛盾的关系，是关于事物矛盾问题的精髓","D":"否定之否定规律揭示了事物发展的方向和道路"},"answer":"ABD","fix":"","analysis":"ABD。\nA项正确：唯物辩证法的总特征是联系和发展的观点（普遍联系、永恒发展）；对立统一规律则是唯物辩证法的实质和核心。“总特征”和“实质和核心”是两个不同的定位，不要互换。\nB项正确：三大规律各有侧重，对立统一规律揭示事物发展的源泉和动力，质量互变规律揭示发展的形式和状态，否定之否定规律揭示发展的方向和道路。\nC项错误：被称为“关于事物矛盾的问题的精髓”的，是矛盾的普遍性和特殊性的关系，即共性和个性、绝对和相对的关系（毛泽东《矛盾论》），不是主要矛盾和次要矛盾的关系。主要矛盾和次要矛盾属于矛盾发展的不平衡性，方法论上对应两点论和重点论。\nD项正确：理由见B项。","trap":"定位张冠李戴：“精髓”是矛盾普遍性和特殊性的关系，不是主次矛盾；“总特征”是联系和发展，“实质和核心”是对立统一规律","basis":"恩格斯《反杜林论》（引言）；毛泽东《矛盾论》“这一共性个性、绝对相对的道理，是关于事物矛盾的问题的精髓，不懂得它，就等于抛弃了辩证法”；教材通行表述“对立统一规律是唯物辩证法的实质和核心”，三大规律分别揭示发展的源泉和动力、形式和状态、方向和道路；底稿M3.24条件栏“联系与发展概括唯物辩证法的总特征和基本观点，对立统一是其实质和核心”。","refs":["C","T"],"note":"","o":26,"t":1},{"id":"N-M4-001","src":"新增","kind":"仿真题","type":"判断","module":"M4","cards":["M4.13","M4.14"],"lead":"","stem":"在复杂事物的诸多矛盾中，处于支配地位、对事物发展起决定作用的是矛盾的主要方面。","options":{},"answer":"错误","fix":"在复杂事物的诸多矛盾中，处于支配地位、对事物发展起决定作用的是主要矛盾。","analysis":"错误。错在主语。在诸多矛盾之间比较，得出的是主要矛盾和次要矛盾：主要矛盾处于支配地位，对事物发展起决定作用。在同一个矛盾的两个方面之间比较，得出的才是主要方面和次要方面：主要方面处于支配地位，起主导作用。题干的比较范围是“诸多矛盾”，结论却落在“矛盾的主要方面”，层次配错了。记法：矛盾跟矛盾比，选出主要矛盾，起“决定作用”；方面跟方面比，选出主要方面，起“主导作用”。","trap":"层次混淆：多组矛盾中起决定作用的是主要矛盾；同一矛盾两方中起主导作用的才是主要方面","basis":"讲义第41页“（1）主要矛盾和次要矛盾：主要矛盾处于支配地位起决定性作用，次要矛盾处于从属地位，不起决定性作用。（2）主要方面和次要方面：主要方面处于支配地位起主导作用，次要方面处于被支配地位，起次要作用。”","refs":["H","C"],"note":"","o":34,"t":1},{"id":"N-M4-002","src":"新增","kind":"仿真题","type":"判断","module":"M4","cards":["M4.01"],"lead":"","stem":"是否承认矛盾是事物发展的动力，是唯物辩证法和形而上学的根本分歧。","options":{},"answer":"正确","fix":"","analysis":"正确。唯物辩证法和形而上学在联系还是孤立、发展还是静止、全面还是片面等问题上都对立，其中根本的分歧在于是否承认矛盾是事物发展的动力。形而上学并不一概否认变化：毛泽东在《矛盾论》中指出，形而上学即使承认变化，也只承认数量的增减和场所的变更，并把变化的原因归于外力的推动；唯物辩证法则认为事物发展的根本原因在于事物内部的矛盾性。所以根本分歧不是“承不承认变化”，而是“承不承认矛盾是发展的动力”。","trap":"易误判为错：根本分歧在于是否承认矛盾是发展的动力，而不是是否承认运动变化（形而上学也可以承认量的增减和位置的变更）","basis":"底稿M4.01条件栏“辩证法与形而上学的重要根本分歧在于是否承认矛盾是事物发展的动力，不能简化为是否承认任何变化”；毛泽东《矛盾论》第一部分“两种宇宙观”：形而上学“如果说有变化，也只是数量的增减和场所的变更。而这种增减和变更的原因，不在事物的内部而在事物的外部，即是由于外力的推动”。","refs":["C","T"],"note":"","o":86,"t":1},{"id":"N-M4-003","src":"新增","kind":"仿真题","type":"判断","module":"M4","cards":["M4.05"],"lead":"","stem":"矛盾的同一性促进矛盾双方力量的变化，造成双方力量发展的不平衡，为对立面的转化和事物的质变创造条件。","options":{},"answer":"错误","fix":"矛盾的斗争性促进矛盾双方力量的变化，造成双方力量发展的不平衡，为对立面的转化和事物的质变创造条件。","analysis":"错误。题干说的是矛盾斗争性在事物发展中的作用，主语被换成了同一性。斗争性的作用：矛盾双方的斗争促进双方力量的变化，造成双方力量发展的不平衡，为对立面的转化、事物的质变创造条件；斗争还是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量。同一性的作用是另一组：矛盾双方相互依存、互为存在的前提，使事物得以存在；双方相互吸取有利于自身的因素，在相互作用中各自得到发展；同一性还规定着事物转化的可能和发展的趋势。2024年广东真题第12题D项是把斗争性的“过渡的决定性力量”安到同一性上，本题换成了斗争性的另一条作用。","trap":"作用张冠李戴：使双方力量此消彼长、为转化和质变创造条件的是斗争性，不是同一性","basis":"教材通行表述（马工程《马克思主义基本原理》对立统一规律）：矛盾的斗争性在事物发展中的作用，一是促进矛盾双方力量的变化，造成双方力量发展的不平衡，为对立面的转化、事物的质变创造条件，二是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量；讲义第40页“斗争性：指矛盾双方相互排斥、相互分离的情况”。","refs":["T","H"],"note":"","o":177,"t":2},{"id":"N-M4-004","src":"新增","kind":"仿真题","type":"多选","module":"M4","cards":["M4.15","M4.16","M4.14","M4.20"],"lead":"毛泽东在《矛盾论》中指出：“研究任何过程，如果是存在着两个以上矛盾的复杂过程的话，就要用全力找出它的主要矛盾。”","stem":"关于主要矛盾和矛盾的主要方面，以下表述正确的有（）","options":{"A":"事物的性质主要由主要矛盾的主要方面决定，矛盾的次要方面对事物的性质毫无影响","B":"主要矛盾贯穿于事物发展过程的始终，并且规定着事物的根本性质","C":"确定矛盾的主要方面，看的是地位和作用，而不是哪一方数量多","D":"主要矛盾的主次方面在一定条件下相互转化，事物的性质也随之变化"},"answer":"CD","fix":"","analysis":"CD。\nA项错误：前半句是教材原句，两层限定（主要矛盾、主要方面）都要保留；错在后半句。教材说的是性质“主要”由主要方面决定，不是“完全”由它决定，次要方面处于被支配地位、起次要作用，并非毫无影响；而且在一定条件下次要方面还可能上升为主要方面（见D项）。“主要”被偷换成了“唯一”。\nB项错误：贯穿事物发展过程始终、规定事物根本性质的是根本矛盾；主要矛盾是在事物发展的一定阶段上处于支配地位、起决定作用的矛盾，阶段变了，主要矛盾可以变化。二者可能重合，但不是同一个概念。\nC项正确：主要方面是同一矛盾中处于支配地位、起主导作用的方面，看的是地位和作用，不是数量多少。例如封建社会中地主阶级人数远少于农民，却在生产资料占有和政治统治中处于支配地位，是这一矛盾的主要方面。\nD项正确：《矛盾论》指出，矛盾的主要和非主要的方面互相转化着，事物的性质也就随着起变化。事物的性质由主要矛盾的主要方面规定，所以主要矛盾的主次方面一旦易位，事物的性质随之改变。","trap":"A项把“主要由……决定”偷换成次要方面“毫无影响”；B项把根本矛盾的规定（贯穿始终、规定根本性质）安到主要矛盾上","basis":"毛泽东《矛盾论》第四部分“事物的性质，主要地是由取得支配地位的矛盾的主要方面所规定的”“矛盾的主要和非主要的方面互相转化着，事物的性质也就随着起变化”，第三部分“事物发展过程的根本矛盾及为此根本矛盾所规定的过程的本质，非到过程完结之日，是不会消灭的”；教材通行表述“事物的性质主要是由主要矛盾的主要方面决定的”；底稿M4.14条件栏“优势不能只机械理解为人数或数量多”。","refs":["C","H"],"note":"","o":44,"t":1},{"id":"N-M4-005","src":"新增","kind":"拓展","type":"多选","module":"M4","cards":["M4.03","M4.04","M4.06","M4.07"],"lead":"毛泽东在《矛盾论》中指出：“矛盾和斗争是普遍的、绝对的，但是解决矛盾的方法，即斗争的形式，则因矛盾的性质不同而不相同。”","stem":"关于矛盾的斗争性及其与同一性的关系，以下表述正确的有（）","options":{"A":"矛盾双方相互依存、互为存在的前提，这是矛盾斗争性的表现","B":"对抗是矛盾斗争的一种形式，而不是矛盾斗争的一切形式","C":"非对抗性矛盾在一定条件下也可能转化为对抗性矛盾","D":"斗争性寓于同一性之中，离开同一性的斗争性是不存在的"},"answer":"BCD","fix":"","analysis":"BCD。\nA项错误：相互依存、互为存在的前提，是矛盾同一性的第一层含义（另一层是在一定条件下相互贯通、相互转化）；斗争性是矛盾双方相互排斥、相互分离的性质和趋势。\nA项把同一性的含义安到了斗争性上。\nB项正确：这是《矛盾论》原话。凡有矛盾必有斗争，但斗争形式多种多样，对抗只是其中一种，非对抗性矛盾中同样有斗争性。\nC项正确：《矛盾论》指出，根据事物的具体发展，有些矛盾由原来非对抗性的发展为对抗性的，也有些由对抗性的发展为非对抗性的。矛盾是对抗性还是非对抗性，不是一经确定就永远不变，要看具体条件；斗争性是绝对的，表现斗争的形式却是有条件的。\nD项正确：斗争性寓于同一性之中，矛盾双方总是在一定的统一关系中相互排斥，没有同一性也就没有斗争性。","trap":"A项把同一性的含义（相互依存）安到斗争性上；B、C项提醒：对抗只是斗争的一种形式，而且对抗与非对抗随条件转化","basis":"毛泽东《矛盾论》第六部分“对抗在矛盾中的地位”：“对抗是矛盾斗争的一种形式，而不是矛盾斗争的一切形式”，有些矛盾由非对抗性发展为对抗性，也有些由对抗性发展为非对抗性；讲义第40页“斗争性：指矛盾双方相互排斥、相互分离的情况，凡有矛盾必有斗争”“同一性：矛盾双方相互依存，矛盾双方在一定条件下可以相互转化”“矛盾的斗争性寓于同一性之中”。","refs":["C","H"],"note":"","o":84,"t":1},{"id":"N-M4-006","src":"新增","kind":"拓展","type":"多选","module":"M4","cards":["M4.10","M4.12","M4.08","M4.21"],"lead":"毛泽东在《矛盾论》中指出：“矛盾的普遍性和矛盾的特殊性的关系，就是矛盾的共性和个性的关系。”","stem":"关于矛盾的普遍性和特殊性，以下表述正确的有（）","options":{"A":"矛盾的普遍性和特殊性辩证关系的原理，是马克思主义基本原理同中国具体实际相结合的哲学基础","B":"在一定场合为普遍性的东西，在另一场合可以变为特殊性","C":"矛盾的普遍性是指矛盾存在于一切事物的发展过程中，并贯穿于每一事物发展过程的始终","D":"具体问题具体分析的客观依据是矛盾的普遍性，即矛盾存在于一切事物之中"},"answer":"ABC","fix":"","analysis":"ABC。\nA项正确：马克思主义基本原理是普遍真理，中国具体实际是特殊情况；普遍性寓于特殊性之中并通过特殊性表现出来，所以必须把二者结合起来，这一原理是马克思主义中国化的哲学基础。\nB项正确：《矛盾论》指出，由于事物范围的极其广大、发展的无限性，在一定场合为普遍性的东西，在另一场合则变为特殊性，反之亦然；普遍和特殊的区分随比较范围而定。\nC项正确：矛盾的普遍性有两层意义，一是矛盾存在于一切事物的发展过程中，二是每一事物的发展过程中存在着自始至终的矛盾运动（讲义概括为“时时有矛盾、处处有矛盾”）。\nC项带“一切”“始终”，却是正确的。\nD项错误：后半句对普遍性的解释本身不错，错在把它当成具体问题具体分析的依据。具体问题具体分析的客观依据是矛盾的特殊性：不同事物、同一事物的不同阶段、同一矛盾的不同方面各有特点，所以要具体分析；把依据说成普遍性，是把共性和个性换了位置。","trap":"D项把具体问题具体分析的依据由矛盾的特殊性偷换成普遍性；C项带绝对词却正确","basis":"毛泽东《矛盾论》第二部分“矛盾的普遍性或绝对性这个问题有两方面的意义。其一是说，矛盾存在于一切事物的发展过程中；其二是说，每一事物的发展过程中存在着自始至终的矛盾运动”，第三部分“在一定场合为普遍性的东西，而在另一一定场合则变为特殊性”；讲义第40页“普遍性：时时有矛盾、处处有矛盾”“普遍性寓于特殊性之中，并通过特殊性表现出来”；教材通行表述“矛盾的普遍性和特殊性辩证关系的原理是马克思主义普遍原理同各国具体实际相结合的哲学基础”；底稿M4.21“具体问题具体分析主要联系矛盾特殊性”。","refs":["C","H","T"],"note":"","o":36,"t":1},{"id":"N-M4-007","src":"新增","kind":"拓展","type":"多选","module":"M4","cards":["M4.18","M4.19"],"lead":"毛泽东在《矛盾论》中指出：“鸡蛋因得适当的温度而变化为鸡子，但温度不能使石头变为鸡子，因为二者的根据是不同的。”","stem":"关于内因和外因，以下表述正确的有（）","options":{"A":"外因对事物的发展可以起加速或延缓的作用","B":"区分内因和外因，要以所研究的事物为界限，不能只看空间位置","C":"事物发展的根本原因，在于该事物与其他事物之间的相互联系和相互影响","D":"同一外部条件作用于不同的事物，可能产生不同的结果"},"answer":"ABD","fix":"","analysis":"ABD。\nA项正确：外因是事物变化发展的条件，它不决定事物的根本性质和发展方向，但可以加速或延缓事物的发展；“条件”不等于“无用”。\nB项正确：内因是事物内部的矛盾，外因是事物与他事物之间的矛盾，归属要看研究对象的边界，不能凭空间位置划分。例如研究一个企业的发展，企业之间的市场竞争是外因；把整个行业作为研究对象时，这种竞争就成了行业内部的矛盾。\nC项错误：错在把“第二位的原因”升格为“根本原因”。联系具有普遍性、客观性，一事物和他事物的相互联系、相互影响确实会影响事物的发展，但它们是外因，是事物发展的第二位的原因；事物发展的根本原因在事物内部，在于事物内部的矛盾性。刚学过“联系具有普遍性”，容易顺势把发展的根本原因也放到事物之间的联系中去。\nD项正确：同样的温度作用于鸡蛋和石头，结果不同，因为二者的内在根据不同；同一外部条件作用于内部结构不同的事物，可能产生不同的结果。","trap":"C项把事物之间的相互联系和影响（外因、第二位的原因）升格为根本原因；B项提醒内外因按研究对象划分，不按空间位置划分","basis":"毛泽东《矛盾论》“事物发展的根本原因，不是在事物的外部而是在事物的内部，在于事物内部的矛盾性”“一事物和他事物的互相联系和互相影响则是事物发展的第二位的原因”“唯物辩证法认为外因是变化的条件，内因是变化的根据，外因通过内因而起作用”及鸡蛋、石头一例（引言）；教材通行表述“外因对事物的发展起加速或延缓的作用”；底稿M4.19“内外因要依据所研究事物的边界和矛盾关系判断，不能只凭肉眼空间位置分类”。","refs":["C","H"],"note":"","o":63,"t":1},{"id":"N-M4-008","src":"新增","kind":"拓展","type":"单选","module":"M4","cards":["M4.20","M3.16","M4.21","M4.17"],"lead":"","stem":"下列古语、俗语与其蕴含的哲理，对应正确的是（）","options":{"A":"“冰冻三尺，非一日之寒”——质变是事物量变的前提和必要准备","B":"“一把钥匙开一把锁”——要集中力量抓住并解决事物的主要矛盾","C":"“牵牛要牵牛鼻子”——坚持两点论，全面看待主要矛盾和次要矛盾的作用","D":"“祸兮福之所倚，福兮祸之所伏”——矛盾双方在一定条件下相互转化"},"answer":"D","fix":"","analysis":"D。\nD项正确：祸与福相互依存，并在一定条件下相互转化，体现矛盾的同一性，即矛盾双方在一定条件下相互转化。\nA项错误：三尺厚的冰是长期寒冷积累的结果，这句话体现的是量变是质变的前提和必要准备；\nA项把二者的关系说反了。\nB项错误：一把钥匙开一把锁，说的是不同的矛盾要用不同的方法去解决，体现矛盾的特殊性，要求具体问题具体分析，不是抓主要矛盾。\nC项错误：牵牛要牵牛鼻子，说的是抓关键、抓重点，体现重点论（着重把握主要矛盾和矛盾的主要方面），不是两点论；两点论说的是既看主要矛盾也看次要矛盾、既看主要方面也看次要方面，与这句俗语的意思不对应。","trap":"名句对原理：冰冻三尺是量变为质变作准备（不是质变为前提），一把钥匙开一把锁是具体问题具体分析，牵牛鼻子是重点论不是两点论","basis":"讲义第41页“（1）量变是质变的前提和必要准备”；讲义第40页“同一性：……矛盾双方在一定条件下可以相互转化”“特殊性：具体事物包含的矛盾以及每一矛盾的各个方面都有其特点”；讲义第40—41页矛盾发展的不平衡性；名句释义为公考通行理解。另：2020年广东真题（县级卷第19题）已考“塞翁失马”对应矛盾转化、“千里之堤，溃于蚁穴”作干扰，本题改用其他名句以免撞题。","refs":["H","T"],"note":"","o":92,"t":1},{"id":"N-M5-001","src":"新增","kind":"仿真题","type":"判断","module":"M5","cards":["M5.17"],"lead":"","stem":"主观辩证法即辩证的思维，而客观辩证法则是主观辩证法的反映。","options":{},"answer":"错误","fix":"主观辩证法即辩证的思维，它是客观辩证法在人的思维中的反映。","analysis":"错在主宾颠倒。客观辩证法是自然界和人类社会本身的辩证运动及其规律，主观辩证法即辩证思维，是客观辩证法在人的思维中的反映：是思维反映客观，不是客观反映思维。说客观辩证法反映主观辩证法，就把思维当成了第一性的东西，滑向唯心主义。另须注意，主观辩证法存在于思维之中，并不因此就是主观唯心主义。","trap":"主宾颠倒：是主观辩证法反映客观辩证法","basis":"教材通行表述：客观辩证法指客观事物的辩证运动及其规律，主观辩证法即辩证思维，是客观辩证法在人的思维中的反映；恩格斯《自然辩证法》：所谓主观辩证法，即辩证的思维，不过是在自然界中到处发生作用的、对立中的运动的反映；底稿M5.17","refs":["T","K"],"note":"","o":198,"t":2},{"id":"N-M5-002","src":"新增","kind":"仿真题","type":"判断","module":"M5","cards":["M5.07","M5.06"],"lead":"","stem":"现实的可能已经具备了实现的根据和条件，因此它已经是现实，而不再是可能。","options":{},"answer":"错误","fix":"现实的可能虽然具备了实现的根据和条件，但它仍然是可能，还不是现实。","analysis":"错在把“现实的可能”偷换成“现实”。“现实的可能”是与“抽象的可能”相对的一类可能：它在现实中有充分根据、条件已经具备、能够实现，但在实现之前仍然只是可能；“现实”指已经实际存在的事物和状态。讲义说“可能不等于现实，现实已经不是可能”。“现实的”这个定语说的是根据和条件具备，不是已经实现。","trap":"名称陷阱：“现实的可能”仍是可能，不等于现实","basis":"讲义第42页：“可能不等于现实，现实已经不是可能……一旦主客观条件成熟，可能就会转化为现实”；教材通行表述：现实的可能是在现实中有充分根据、条件具备、可以实现的可能，抽象的可能是缺乏充分根据和条件、目前不能实现的可能；底稿M5.07（“现实可能仍然没有实际实现”）","refs":["H","K","T"],"note":""},{"id":"N-M5-003","src":"新增","kind":"仿真题","type":"判断","module":"M5","cards":["M5.05"],"lead":"","stem":"必然和偶然的区分是相对的，在一定条件下二者可以相互转化。","options":{},"answer":"正确","fix":"","analysis":"正确。必然和偶然是对立统一的，在一定条件下可以相互转化：由于事物联系的广泛性和发展过程的复杂性，在这一过程、这一关系中是必然的东西，在另一过程、另一关系中可以是偶然的，反之亦然。常举的例子是生物个体的偶然变异，经过自然选择被保存和积累，可以成为新物种的必然特征。注意转化需要条件或关系的改变，不是偶然事件出现的次数多了就自动变成必然。","trap":"易误判为必然偶然界限绝对、不能转化；转化要有条件，不靠次数累积","basis":"讲义第42页：“必然和偶然是对立统一关系……必然和偶然在一定程度上可以相互转化”；教材通行表述：必然和偶然在一定条件下可以相互转化；底稿M5.05（“相互转化需要条件或关系改变，不是机械积累次数”）","refs":["H","K","T"],"note":""},{"id":"N-M5-004","src":"新增","kind":"拓展","type":"单选","module":"M5","cards":["M5.11","M5.16"],"lead":"马克思在《资本论》中指出：“如果事物的表现形式和事物的本质会直接合而为一，一切科学就都成为多余的了。”","stem":"对这句话理解正确的是（）","options":{"A":"句中与“本质”相对的“表现形式”，属于“内容与形式”这对范畴中的形式","B":"现象与本质有区别，因而需要通过科学研究透过现象去把握本质","C":"人们只能认识事物的现象，事物的本质是不可认识的","D":"科学研究可以撇开现象，直接从概念中推出事物的本质"},"answer":"B","fix":"","analysis":"这句话是说现象和本质不直接同一，所以才需要科学研究。\nA项错误，句中与“本质”相对的“表现形式”指的是现象，属于“现象与本质”这对范畴，不能因为有“形式”二字就套到“内容与形式”上；内容与形式着眼于构成要素和组织结构，现象与本质着眼于外在表现和内在联系。\nB项正确，现象与本质有区别，使透过现象把握本质的深入研究成为必要。\nC项错误，这句话肯定的是科学能够透过现象把握本质，并没有说本质不可认识，读成不可知论是曲解。\nD项错误，本质总是通过现象表现出来，二者有联系，认识本质必须从现象出发，不能撇开现象从概念中推出本质。故选B。","trap":"字面陷阱：“表现形式”在这里指现象，不是“内容与形式”中的形式","basis":"马克思《资本论》第三卷：“如果事物的表现形式和事物的本质会直接合而为一，一切科学就都成为多余的了”；讲义第41页：“现象是事物的外部联系和表面特征，可以通过感官感知，本质是事物的内在联系和根本性质，通过理性思维才能把握”；底稿M5.11、M5.16","refs":["H","T"],"note":""},{"id":"N-M5-005","src":"新增","kind":"拓展","type":"多选","module":"M5","cards":["M5.04","M5.05","M7.29"],"lead":"恩格斯在1894年的一封书信中写道：“恰巧某个伟大人物在一定时间出现于某一国家，这当然纯粹是一种偶然现象。但是，如果我们把这个人除掉，那时就会需要有另外一个人来代替他，并且这个代替者是会出现的。”","stem":"对这段话理解正确的有（）","options":{"A":"某个伟大人物恰好在某一时间出现于某一国家，对历史发展的必然趋势而言具有偶然性","B":"历史发展需要有人来承担特定的历史任务，这种历史需要体现了必然性","C":"必然性通过偶然性为自己开辟道路，因此具体由哪个人来承担这一角色也是预先注定的","D":"某个伟大人物恰好在这时出现虽然是偶然的，但他的个人品质和作为会对历史进程起加速或延缓的作用"},"answer":"ABD","fix":"","analysis":"A项正确，恩格斯明确说某个伟大人物在一定时间出现于某一国家“纯粹是一种偶然现象”。\nB项正确，“就会需要有另外一个人来代替他，并且这个代替者是会出现的”，说明这种历史需要是必然的，它通过偶然出现的具体人物来实现。\nC项错误，必然性通过偶然性表现出来，指的是历史需要有人承担这一角色；具体是谁、何时、以何种方式出现并非预先注定，把必然趋势的实现等同于每个具体细节都非如此不可，是宿命论。\nD项正确，偶然不等于没有影响：偶然因素对必然过程起促进或延缓作用；杰出人物虽然不能决定历史发展的基本趋势，但能对历史进程起加速或延缓的作用。故选ABD。","trap":"C项把必然趋势偷换成具体细节的注定；D项提醒偶然不等于无影响","basis":"恩格斯1894年书信（通行中译文）；讲义第42页：“必然存在于偶然之中，通过大量的偶然表现出来……偶然居于从属地位，对发展的必然过程起促进或延缓作用”，第44页：“杰出人物对历史发展起过重大推动作用，但只能对历史的发展起影响作用，而不能决定历史发展的基本趋势”；底稿M5.04、M5.05、M7.29","refs":["H","T"],"note":"","o":104,"t":1},{"id":"N-M5-006","src":"新增","kind":"仿真题","type":"多选","module":"M5","cards":["M5.12","M5.13","M5.14"],"lead":"现象和本质是揭示客观事物的外在表现和内在联系的一对范畴。现象有真象和假象之分。","stem":"关于现象和本质，下列说法正确的有（）","options":{"A":"现象和本质都是客观的，现象可以通过感官直接感知，本质只有通过理性思维才能把握","B":"真象从正面直接地表现本质，假象从反面歪曲地表现本质","C":"错觉也可能有一定的客观诱因，但错觉本身是主体的错误知觉，不同于作为客观现象的假象","D":"现象是个别的、具体的、多变易逝的，本质是一般的、普遍的、相对稳定的"},"answer":"ABCD","fix":"","analysis":"A项正确，现象和本质都属于事物自身：现象是外部联系和表面特征，能被感官感知；本质是内在联系和根本性质，只能靠理性思维把握。能被感官感知，不等于现象就是人的主观感觉。\nB项正确，真象和假象都是现象，都表现本质，区别在于从正面直接表现还是从反面歪曲表现；假象也表现本质，并非与本质毫无联系。\nC项正确，一种客观呈现可能诱发错觉，但错觉本身属于主体一侧的错误知觉，假象则是对象一侧的客观现象，二者层次不同。\nD项正确，这是讲义原句；“相对稳定”也说明本质并非永远不变。四项均正确。","trap":"四项都对：易把假象误当成不表现本质，或因错觉有客观诱因就把错觉当成客观现象","basis":"讲义第41页：“现象和本质是揭示客观事物的外在表现和内在联系的一对范畴，现象是事物的外部联系和表面特征，可以通过感官感知，本质是事物的内在联系和根本性质，通过理性思维才能把握，现象是个别的、具体的、多变易逝的，本质是一般的、普遍的、相对稳定的”；教材通行表述：真象从正面直接地表现本质，假象从反面歪曲地表现本质，假象不同于错觉；底稿M5.12—M5.14","refs":["H","K","T"],"note":"","o":80,"t":1},{"id":"N-M5-007","src":"新增","kind":"仿真题","type":"多选","module":"M5","cards":["M5.20","M5.18","M5.19"],"lead":"唯物辩证法既是世界观，也是方法论。在认识活动中，人们需要自觉运用科学的思维方法。","stem":"关于辩证思维方法，下列说法正确的有（）","options":{"A":"分析与综合是分别从个别到一般、从一般到个别的两种推理方法","B":"抽象与具体、逻辑与历史相统一，也属于辩证思维方法","C":"分析是在思维中把对象分解为各个部分或因素分别加以考察，并不要求把对象实际拆开","D":"归纳与演绎相互依存，演绎所依据的一般性前提往往来自归纳"},"answer":"BCD","fix":"","analysis":"A项错误，张冠李戴：“从个别到一般”“从一般到个别”说的是归纳与演绎；分析与综合着眼的是部分与整体，分析把对象分解为部分分别考察，综合在把握各部分联系的基础上形成整体认识。两组方法可以在研究中交叉使用，但不能互换定义。\nB项正确，教材所列辩证思维方法主要有归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一等。\nC项正确，分析是思维中的分解，不必真的拆毁对象。\nD项正确，演绎从一般原理出发，而一般原理往往是归纳概括的结果；归纳又需要一定理论的指导，二者相互依存、相互补充。故选BCD。","trap":"A项张冠李戴：个别到一般、一般到个别是归纳与演绎","basis":"教材通行表述：辩证思维方法主要有归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一等；归纳是从个别到一般的方法，演绎是从一般到个别的方法；分析是在思维中把对象分解为各个部分或因素分别考察，综合是把各部分或因素结合为统一体加以考察；底稿M5.18—M5.20；参照2025年第10题对辩证思维方法的考法","refs":["T","K"],"note":"","o":125,"t":1},{"id":"N-M6-001","src":"新增","kind":"仿真题","type":"判断","module":"M6","cards":["M6.17","M6.18"],"lead":"","stem":"认识的无限性，是指人对一个复杂事物的认识往往要经过多次反复才能完成。","options":{},"answer":"错误","fix":"认识的反复性，是指人对一个复杂事物的认识往往要经过多次反复才能完成。","analysis":"错在张冠李戴。“对一个复杂事物的认识往往要经过由感性认识到理性认识、再由理性认识到实践的多次反复才能完成”，说的是认识的反复性；认识的无限性是指对于事物发展过程的推移来说，人类的认识永无止境、无限发展，表现为“实践、认识、再实践、再认识”的循环往复，每一循环都进到高一级的程度。前者着眼一个具体认识过程要多次往返，后者着眼人类认识整体没有终点。","trap":"张冠李戴：“多次反复才能完成”是反复性，不是无限性","basis":"讲义第43页：“认识的反复性是指，人对于一个复杂事物的认识往往要经过由感性认识到理性认识，再由理性认识到实践的多次反复才能完成”“认识的无限性是指，对于事物发展过程的推移来说，人类的认识是永无止境、无限发展的”；底稿M6.17、M6.18","refs":["H","P"],"note":"","o":46,"t":1},{"id":"N-M6-002","src":"新增","kind":"仿真题","type":"判断","module":"M6","cards":["M6.26"],"lead":"","stem":"实践标准的不确定性，是指实践能否作为检验真理的标准是不确定的。","options":{},"answer":"错误","fix":"实践标准的不确定性，是指具体的实践总要受一定条件的制约，不能完全证实或驳倒一切认识。","analysis":"错在层次混淆。实践标准的确定性指实践是检验真理的唯一标准，这一地位是确定的；不确定性指每一次具体实践都受历史条件限制，检验的能力和范围有限，不能一次性完全证实或驳倒一切认识。把具体实践的局限说成“实践能否作标准不确定”，就否定了实践标准本身。两方面是统一的：检验有局限不等于没有检验作用，更不能另找权威作最终标准。","trap":"层次混淆：不确定的是具体实践的检验范围，不是实践的标准地位","basis":"教材通行表述：实践标准是确定性和不确定性的统一，确定性指实践是检验真理的唯一标准，不确定性指具体实践受条件制约，不能完全证实或驳倒一切认识；底稿M6.26","refs":["E","T"],"note":"","o":71,"t":1},{"id":"N-M6-003","src":"新增","kind":"仿真题","type":"判断","module":"M6","cards":["M6.07","M6.08"],"lead":"","stem":"间接经验如果在前人直接经验时科学地反映了客观事物，就是可靠的知识。","options":{},"answer":"正确","fix":"","analysis":"正确。《实践论》指出，人不能事事直接经验，多数知识是间接经验；这些知识在古人、外人那里是直接经验，如果当时科学地反映了客观事物，就是可靠的，否则就不可靠。可见知识可靠与否，看它是否科学地反映了客观事物，不看它是亲身得来还是从书本、他人那里得来：间接经验不因“间接”而不可靠，直接经验也不因“亲身”就一定正确，来源于实践并不自动保证认识正确。","trap":"维度区分：直接或间接是获取途径，可靠与否看是否科学反映客观事物","basis":"《实践论》：这些知识在古人在外人是直接经验的东西，如果在古人外人直接经验时是符合于列宁所说的条件“科学的抽象”，是科学地反映了客观的事物，那末这些知识是可靠的，否则就是不可靠的；底稿M6.07、M6.08","refs":["P","H"],"note":"","o":155,"t":1},{"id":"N-M6-004","src":"新增","kind":"仿真题","type":"判断","module":"M6","cards":["M6.03"],"lead":"","stem":"人类的生产活动是最基本的实践活动，是决定其他一切活动的东西。","options":{},"answer":"正确","fix":"","analysis":"正确。这是《实践论》的原话。实践的基本形式包括物质生产实践、社会政治实践和科学文化实践，其中物质生产实践是最基本的实践活动，决定着其他实践活动；但“最基本”不等于“唯一”，科学实验等同样属于实践。句中的“一切”是原文表述，不能见到绝对词就判错。","trap":"绝对词出现在正确句中：物质生产是最基本的实践，但不是唯一的实践","basis":"《实践论》：“马克思主义者认为人类的生产活动是最基本的实践活动，是决定其他一切活动的东西”；教材通行表述：实践的基本形式包括物质生产实践、社会政治实践和科学文化实践；底稿M6.03","refs":["P","H"],"note":"","o":78,"t":1},{"id":"N-M6-005","src":"新增","kind":"仿真题","type":"单选","module":"M6","cards":["M6.09","M6.07","M6.10"],"lead":"","stem":"下列选项中，主要体现“实践是认识发展的动力”的是（）","options":{"A":"学生通过阅读教材，掌握前人总结出的科学知识","B":"一种新药经过大规模临床试验，才被确认为安全有效","C":"工程师运用力学原理，为一座新桥制定设计方案","D":"航海需要精确测定船只方位，推动了天文学的研究"},"answer":"D","fix":"","analysis":"D项正确，航海实践提出了新的需要和问题，推动了天文学研究，体现实践是认识发展的动力；实践还能为认识提供新的工具和手段。\nA项体现的是个人通过间接经验获取知识，属于获取知识的途径，并不是实践推动认识发展。\nB项体现实践是检验认识真理性的标准。\nC项体现认识对实践的指导，即认识的目的在于指导实践、改造世界。故选D。","trap":"作用错配：来源、动力、标准、目的各有所指","basis":"教材通行表述：实践是认识的来源、认识发展的动力、检验认识真理性的唯一标准，也是认识的目的；恩格斯：“社会一旦有技术上的需要，则这种需要就会比十所大学更能把科学推向前进”；底稿M6.09（“新实践难题推动研究，仪器改进使原先不能研究的问题进入视野”）","refs":["H","E","T"],"note":"","o":24,"t":1},{"id":"N-M6-006","src":"新增","kind":"拓展","type":"单选","module":"M6","cards":["M6.15"],"lead":"","stem":"《实践论》所说的“去粗取精、去伪存真、由此及彼、由表及里”的改造制作工夫，指的是（）","options":{"A":"人的感觉器官直接接触外界事物、形成感觉和印象的过程","B":"把理论运用于实践、看它能否达到预想目的的过程","C":"对丰富的感性材料进行思维加工、使感性认识上升为理性认识的过程","D":"在实践中多次失败后纠正错误认识、使认识与客观规律相符合的过程"},"answer":"C","fix":"","analysis":"C项正确，《实践论》指出，要反映事物的本质和内部规律性，就必须经过思考作用，将丰富的感觉材料加以“去粗取精、去伪存真、由此及彼、由表及里”的改造制作工夫，造成概念和理论的系统，从感性认识跃进到理性认识。这是实现第一次飞跃的思维加工，也是获得正确理性认识的条件之一，另一个条件是感性材料十分丰富、合于实际。\nA项是感觉阶段，还没有思维加工。\nB项是理性认识回到实践的第二次飞跃。\nD项讲的是认识的反复性。故选C。","trap":"阶段错配：十六字讲的是第一次飞跃中的思维加工","basis":"《实践论》：“将丰富的感觉材料加以去粗取精、去伪存真、由此及彼、由表及里的改造制作工夫，造成概念和理论的系统，就必须从感性认识跃进到理性认识”“只有感觉的材料十分丰富（不是零碎不全）和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来”；底稿M6.15","refs":["P","H"],"note":"","o":129,"t":1},{"id":"N-M6-007","src":"新增","kind":"拓展","type":"单选","module":"M6","cards":["M6.28"],"lead":"实用主义真理观主张“有用即真理”，认为一个观念只要对人有用，它就是真的。","stem":"从马克思主义认识论看，对这一观点评析正确的是（）","options":{"A":"它以对主体是否有用来判定真假，混淆了真理评价与价值评价","B":"它看到了真理对人是有价值的，因而坚持了真理的客观性","C":"它把是否有用当作检验标准，体现了实践是检验真理的唯一标准","D":"它的错误在于承认真理有价值，因为真理本身对人是没有价值的"},"answer":"A","fix":"","analysis":"A项正确，真理评价看认识是否符合对象，价值评价看客体对主体需要和发展的意义；“有用”是价值属性，“真”是符合对象的属性，以有用定真假就混淆了二者，实际上否认了真理的客观性。\nB项错误，以对主体是否有用判定真假，会使真理随主体需要而变，恰恰否认了真理的客观性。\nC项错误，马克思主义讲的实践是改造世界的客观物质活动，检验的是认识与对象是否相符；实用主义讲的有用是对个人或集团的效用，二者不能混同。\nD项错误，真理本身是有价值的，真理与价值是辩证统一的；实用主义的错误不在于承认真理有价值，而在于以价值代替真理、以有用作为真理的标准。故选A。","trap":"属性混同：有用（价值）不等于真（符合对象）","basis":"教材通行表述：真理与价值是辩证统一的，实用主义“有用即真理”否认真理的客观性；底稿M6.28（“有益、有用与符合事实不是同一属性”）","refs":["E","T"],"note":"","o":96,"t":1},{"id":"N-M6-008","src":"新增","kind":"仿真题","type":"多选","module":"M6","cards":["M6.01"],"lead":"《实践论》指出：“马克思以前的唯物论，离开人的社会性，离开人的历史发展，去观察认识问题，因此不能了解认识对社会实践的依赖关系，即认识对生产和阶级斗争的依赖关系。”","stem":"关于认识的本质，下列说法正确的有（）","options":{"A":"辩证唯物主义认识论把实践的观点引入认识论，把辩证法应用于反映论","B":"旧唯物主义认识论坚持从物到感觉和思想的认识路线，是能动的革命的反映论","C":"唯心主义认识论坚持从思想和感觉到物的认识路线，否认认识是对客观世界的反映","D":"认识是主体对客体的能动反映，主体对材料的选择和加工并不意味着认识可以不受客体制约"},"answer":"ACD","fix":"","analysis":"A项正确，这是辩证唯物主义认识论区别于旧唯物主义认识论的两个要点：把实践的观点引入认识论，把辩证法应用于反映论，因而是能动的革命的反映论。\nB项错误，前半句对，旧唯物主义认识论坚持从物到感觉和思想的唯物主义路线；后半句错，它离开实践考察认识，把认识看成消极被动的直观反映，不是能动的革命的反映论。\nC项正确，唯心主义认识论坚持从思想和感觉到物的路线，否认认识是对客观世界的反映。\nD项正确，能动反映是摹写与创造的统一，主体选择、加工材料体现能动性，但认识的内容仍受客体制约，不能偷换成任意建构。故选ACD。","trap":"B项前半句对、后半句把辩证唯物主义认识论的特点安到了旧唯物主义上","basis":"教材通行表述：认识是主体在实践基础上对客体的能动反映；唯物主义认识论坚持从物到感觉和思想的路线，唯心主义认识论坚持从思想和感觉到物的路线；旧唯物主义认识论是直观的、被动的反映论；《实践论》：“马克思以前的唯物论，离开人的社会性，离开人的历史发展，去观察认识问题”；底稿M6.01","refs":["P","E","T"],"note":"","o":49,"t":1},{"id":"N-M6-009","src":"新增","kind":"仿真题","type":"多选","module":"M6","cards":["M6.11","M6.12","M6.13","M6.14"],"lead":"《实践论》指出：“理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。”","stem":"关于感性认识和理性认识，下列说法正确的有（）","options":{"A":"唯理论只承认理性认识可靠，其错误在于否认理性认识依赖于感性认识","B":"感觉、知觉和概念是感性认识的三种基本形式","C":"感性认识与理性认识的区别在于，前者可能出错，后者则是正确的认识","D":"经验论以为只有感性认识可靠，其错误在于把认识停留在感性阶段"},"answer":"AD","fix":"","analysis":"A项正确，《实践论》指出唯理论“只承认理性的实在性，不承认经验的实在性”，错在颠倒了事实，“理性的东西所以靠得住，正是由于它来源于感性”。\nB项错误，感性认识的三种形式是感觉、知觉和表象；概念与判断、推理一起属于理性认识。\nC项错误，感性与理性区分的是认识的层次，正确与错误区分的是认识是否符合对象，这是两个维度；感性认识可能出错，理性认识同样可能因前提或推理错误而出错。\nD项正确，经验论“以为认识可以停顿在低级的感性阶段，以为只有感性认识可靠”，不懂得感性认识有待于发展到理性认识。故选AD。","trap":"B项层次偷换（概念不属于感性认识），C项维度混同（感性理性不是错误正确）","basis":"《实践论》：“理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论”；讲义第42页：感性认识“包括感觉、知觉和表象三种形式”，理性认识“包括概念、判断、推理三种形式”；底稿附录corrected_simplifications：“感性理性是层次，正确错误是是否符合对象”；底稿M6.11—M6.14","refs":["P","H"],"note":"","o":38,"t":1},{"id":"N-M6-010","src":"新增","kind":"仿真题","type":"多选","module":"M6","cards":["M6.25","M6.16"],"lead":"《实践论》指出：“判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。”","stem":"关于检验真理的标准，下列说法正确的有（）","options":{"A":"实践具有直接现实性，能把主观和客观联系起来，因而能够检验认识的真理性","B":"理论是否符合客观实际的问题，只有把理性认识再回到实践中去才能完全解决","C":"许多自然科学理论之所以被称为真理，不仅在于其创立之时，还在于它们为尔后的科学实践所证实","D":"逻辑证明是与实践并列的另一个检验真理的标准，二者在检验中相互补充、缺一不可"},"answer":"ABC","fix":"","analysis":"A项正确，真理的本性是主观同客观相符合，实践是主观见之于客观的活动，具有直接现实性，能把认识与对象联系起来加以对照，所以能担当检验标准。\nB项正确，理论是否符合客观真理性，在由感性到理性的认识运动中没有完全解决，也不能完全解决，只有把理性认识再回到社会实践中去才能完全解决；这也是第二次飞跃更为重要的原因之一。\nC项正确，《实践论》指出，许多自然科学理论之所以被称为真理，不但在于创立这些学说的时候，而且在于为尔后的科学实践所证实的时候。\nD项错误，逻辑证明在认识中有重要作用，可以作为实践检验的补充，但它本身要以实践为基础，不是与实践并列的另一个标准，实践是检验真理的唯一标准。故选ABC。","trap":"D项偷换：逻辑证明是补充手段，不是另一个检验标准","basis":"《实践论》：“判定认识或理论之是否真理……依客观上社会实践的结果如何而定”“理论的东西之是否符合于客观真理性这个问题，在前面说的由感性到理性之认识运动中是没有完全解决的，也不能完全解决的”“许多自然科学理论之所以被称为真理，不但在于自然科学家们创立这些学说的时候，而且在于为尔后的科学实践所证实的时候”；教材通行表述：实践是检验真理的唯一标准；底稿M6.25、M6.16","refs":["P","E","T"],"note":"","o":20,"t":1},{"id":"N-M6-011","src":"新增","kind":"仿真题","type":"多选","module":"M6","cards":["M6.19","M6.20","M6.23","M6.24"],"lead":"列宁曾经指出，真理只要再多走一小步，哪怕是向同一方向多走一小步，便会变成错误。","stem":"关于真理，下列说法正确的有（）","options":{"A":"真理的形式是客观的，而真理的内容是主观的","B":"真理是具体的，任何真理都有其适用的条件和范围","C":"真理具有一元性，在同一条件下，对于特定的认识对象只有一个正确的认识","D":"真理和谬误相比较而存在、相斗争而发展，在一定条件下可以相互转化"},"answer":"BCD","fix":"","analysis":"A项错误，主客颠倒：真理是对客观事物及其规律的正确反映，它以概念、判断等认识形式存在，形式具有主观性，所包含的正确内容则是客观的，不以人的意志为转移。\nB项正确，引文说明任何真理都有其适用的条件和范围，超出这一条件和范围，哪怕向同一方向多走一小步，真理也会变成谬误，所以真理是具体的。\nC项正确，这是真理一元性的完整表述：在同一条件下，对于特定的认识对象只有一个正确认识，不存在多元真理；同一事物可以从不同方面、在不同条件下有多个正确认识（如对一座桥分别认识其用途和结构），并不违背一元性。若删掉“同一条件下”“特定的认识对象”，说成“对同一事物只能有一个正确认识”，就不对了。\nD项正确，真理和谬误相互对立，又相比较而存在、相斗争而发展，在一定条件下可以相互转化，但不能在对象和条件都不变时混同真假。故选BCD。","trap":"A项主客颠倒；C项是一元性的完整表述，“同一条件下”“特定的认识对象”两个限定都在，判对","basis":"教材通行表述：真理是对客观事物及其规律的正确反映，真理的内容是客观的；真理是具体的、有条件的；真理的一元性是指在同一条件下对于特定的认识对象只能有一个正确的认识；真理和谬误相比较而存在、相斗争而发展，在一定条件下相互转化；引言为列宁《共产主义运动中的“左派”幼稚病》中论述的大意；底稿M6.19、M6.20、M6.23、M6.24","refs":["E","T"],"note":"","o":27,"t":1},{"id":"N-M6-012","src":"新增","kind":"仿真题","type":"多选","module":"M6","cards":["M6.21"],"lead":"《实践论》指出：“在绝对真理的长河中，人们对于在各个一定发展阶段上的具体过程的认识只具有相对的真理性。”","stem":"关于真理的绝对性和相对性，下列说法正确的有（）","options":{"A":"任何真理都只是对客观世界某一阶段、某一部分的正确认识，这体现了真理的绝对性","B":"承认人能够获得关于无限发展着的物质世界的正确认识，也就是承认了真理的绝对性","C":"无数相对真理的总和构成绝对真理，真理的绝对性寓于相对性之中","D":"真理的绝对性是指某一具体真理已经穷尽了对对象一切方面和条件的认识"},"answer":"BC","fix":"","analysis":"A项错误，张冠李戴：任何真理都只是对客观世界某一阶段、某一部分的正确认识，说的是真理的相对性（认识的广度有待扩展），不是绝对性。\nB项正确，真理绝对性的一层含义是，人类认识按其本性能够正确认识无限发展着的物质世界，承认世界的可知性也就是承认真理的绝对性；另一层含义是任何真理都包含不依赖于人的客观内容。\nC项正确，《实践论》说“无数相对的真理之总和，就是绝对的真理”，绝对性寓于相对性之中，二者是同一真理的两种属性，不是两类真理。\nD项错误，绝对性不是说某个具体认识已经穷尽一切，任何具体真理都只是对对象一定方面、一定层次和一定程度的正确认识。故选BC。","trap":"A项把相对性的含义安到绝对性上，D项把绝对性误解为穷尽一切","basis":"教材通行表述：真理的绝对性是指真理主客观统一的确定性和发展的无限性，真理的相对性是指人们对客观事物及其规律的正确认识总是有限度的、不完善的；《实践论》：“无数相对的真理之总和，就是绝对的真理”；底稿M6.21","refs":["E","P","T"],"note":"","o":48,"t":1},{"id":"N-M7-001","src":"新增","kind":"仿真题","type":"判断","module":"M7","cards":["M7.07"],"lead":"","stem":"历史继承性是社会意识相对独立性的突出表现。","options":{},"answer":"错误","fix":"社会意识对社会存在的能动反作用是社会意识相对独立性的突出表现，历史继承性是相对独立性的表现之一。","analysis":"错误，错在“突出表现”的归属。社会意识的相对独立性，是指社会意识在反映社会存在的同时，还有自身特有的发展形式和规律，主要表现为：与社会存在发展的不完全同步性，与社会经济发展水平的不平衡性，历史继承性，各种社会意识形式之间的相互作用和相互影响，对社会存在的能动反作用。其中，能动反作用是相对独立性的突出表现：社会意识通过指导人们的实践，能够促进或阻碍社会存在的发展。历史继承性是相对独立性的表现之一，但不是“突出表现”。","trap":"作用张冠李戴：相对独立性的“突出表现”是对社会存在的能动反作用，不是历史继承性；与2025年真题把“根本特征”安到科学性上是同一种偷换。","basis":"依据：教材通行表述（马工程《马克思主义基本原理》“社会意识的相对独立性”）“社会意识对社会存在的能动反作用是社会意识相对独立性的突出表现”；底稿M7.07正确句“反作用是其相对独立性的突出表现”。讲义第43页只讲社会存在与社会意识、意识形态与非意识形态，没有展开相对独立性。","refs":["S","T"],"note":"","o":32,"t":1},{"id":"N-M7-002","src":"新增","kind":"拓展","type":"判断","module":"M7","cards":["M7.04","M7.02","M7.24"],"lead":"","stem":"恩格斯认为，一切社会变迁和政治变革的终极原因，不应当到人们的头脑中、到人们对永恒的真理和正义的日益增进的认识中去寻找，而应当到生产方式和交换方式的变更中去寻找。","options":{},"answer":"正确","fix":"","analysis":"正确。这是恩格斯在《反杜林论》中阐述唯物史观的原话（后收入《社会主义从空想到科学的发展》）：社会变迁和政治变革的终极原因不在人们头脑中的观念，而在生产方式和交换方式的变更，“不应当到有关时代的哲学中去寻找，而应当到有关时代的经济中去寻找”。它体现了社会存在决定社会意识、物质资料的生产方式是社会发展的决定力量。题干里的“一切”“永恒”是原文用语，不能凭绝对词判错。还要和教材的几个标签分开：社会发展的根本动力是社会基本矛盾，最终决定力量是生产力。2026年广东第4题（网友回忆版）把“根本动力”安到生产关系上，又借用了“终极原因”的说法，按教材应判错误；本题考的是恩格斯原话，判正确。","trap":"名句原文：恩格斯把“终极原因”落在生产方式和交换方式的变更上，“一切”“永恒”是原话不是改动；也不要把“终极原因”和“根本动力”当成同一个标签。","basis":"依据：恩格斯《反杜林论》第三编第二章（亦见《社会主义从空想到科学的发展》第三部分）：“一切社会变迁和政治变革的终极原因，不应当到人们的头脑中，到人们对永恒的真理和正义的日益增进的认识中去寻找，而应当到生产方式和交换方式的变更中去寻找；不应当到有关时代的哲学中去寻找，而应当到有关时代的经济中去寻找。”","refs":["T"],"note":"","o":188,"t":2},{"id":"N-M7-003","src":"新增","kind":"仿真题","type":"单选","module":"M7","cards":["M7.09","M7.10","M7.13","M7.03"],"lead":"","stem":"下列关于生产力和生产关系的说法，正确的是（）","options":{"A":"企业实行员工持股，并按股份把部分利润分给职工，属于生产关系方面的调整","B":"生产资料属于生产关系，生产资料所有制是生产关系中最基本的方面","C":"工厂引进智能化生产线以后，劳动生产率大幅提高，这属于生产关系方面的变革","D":"生产方式就是生产资料，即人们在生产中使用的劳动资料和加工的劳动对象的总和"},"answer":"A","fix":"","analysis":"选A。\nA项正确：员工持股改变了企业生产资料的占有结构，按股分红改变了产品（利润）的分配方式，二者都是人与人在生产中的经济关系，属于生产关系方面的调整。\nB项错误：生产资料（劳动资料和劳动对象）是生产力的实体性要素，表现的是人与自然的关系；属于生产关系的是“生产资料所有制关系”，即生产资料归谁所有。后半句“所有制关系是生产关系中最基本的方面”本身是对的，错在前半句。\nC项错误：智能化生产线是劳动资料的改进，劳动生产率提高是生产力的发展，属于生产力方面的变化。\nD项错误：生产方式是生产力和生产关系的统一，生产资料只是生产力的要素，不等于生产方式；后半句对生产资料的界定本身是对的。","trap":"层次混淆：“生产资料”是物，属于生产力；“生产资料所有制”是归属关系，属于生产关系；生产方式是生产力和生产关系的统一。","basis":"依据：讲义第43页，生产力“由实体性要素（劳动者、劳动对象、劳动资料，其中劳动对象和劳动资料合称生产资料）和渗透性要素（科学技术、经济管理等）构成”；生产关系“包括生产资料所有制关系、生产中人与人的关系和产品分配关系，其中生产资料所有制关系是最基本的”。底稿M7.03“生产方式是生产力与生产关系的统一”。","refs":["H","R"],"note":"","o":50,"t":1},{"id":"N-M7-004","src":"新增","kind":"仿真题","type":"单选","module":"M7","cards":["M7.32"],"lead":"马克思主义道德观认为，道德是人类社会特有的现象，它的产生有其前提和条件。","stem":"在道德起源问题上，“社会关系”“人的自我意识”“劳动”依次是道德产生的（）","options":{"A":"主观条件、客观条件、首要前提","B":"首要前提、主观条件、客观条件","C":"客观条件、主观条件、首要前提","D":"客观条件、首要前提、主观条件"},"answer":"C","fix":"","analysis":"选C。马克思主义道德观认为：劳动是道德起源的首要前提，劳动创造了人本身和人类社会，人们在共同劳动中结成一定的社会关系；社会关系是道德赖以产生的客观条件，有了人与人之间的关系和利益关系，才产生调节这些关系的需要；人的自我意识是道德产生的主观条件，人要能意识到自己同他人、同集体的关系，才能形成道德规范和道德评价。题中三项依次是客观条件、主观条件、首要前提，C项正确。\nA项把社会关系与自我意识的主、客观位置对调；\nB项把社会关系与劳动对调；\nD项把自我意识与劳动对调。","trap":"定位互换：社会关系是“客观”条件，自我意识是“主观”条件，劳动是“首要前提”；题中故意打乱了三者的顺序，不能按背诵顺序直接选。","basis":"依据：马工程《思想道德与法治》第五章“道德的起源”：劳动是道德起源的首要前提，社会关系是道德赖以产生的客观条件，人的自我意识是道德产生的主观条件（底稿M7.32正确句；2024年广东第14题A、C、D项分别是这三句）。","refs":["D"],"note":""},{"id":"N-M7-005","src":"新增","kind":"拓展","type":"单选","module":"M7","cards":["M7.04","M7.01"],"lead":"","stem":"下列古语中，最能体现“社会存在决定社会意识”的是（）","options":{"A":"水能载舟，亦能覆舟","B":"人心齐，泰山移","C":"道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格","D":"仓廪实而知礼节，衣食足而知荣辱"},"answer":"D","fix":"","analysis":"选D。\nD项出自《管子·牧民》，意思是粮仓充实、衣食丰足以后，人们才能普遍懂得礼节、荣辱，说的是物质生活条件制约着人们的道德观念，体现社会存在决定社会意识。\nA项强调民众的力量关系到政权的安危，体现人民群众在历史发展中的决定作用。\nB项强调人心一致、团结一心的力量，体现意识的能动作用。\nC项出自《论语·为政》，意思是只用政令引导、用刑罚整治，百姓只求免于刑罚而没有羞耻之心；用道德引导、用礼制规范，百姓就有羞耻之心并能自我约束。它强调道德教化的作用，属于社会意识对人和社会的反作用，方向与题干相反。","trap":"看作用方向：D是物质生活条件决定道德观念（社会存在→社会意识）；B、C说的是精神、道德对人的作用（社会意识的反作用），不要因为C谈“德”“礼”就选它。","basis":"依据：讲义第43页“社会存在和社会意识的关系问题是社会历史观的基本问题”；教材通行表述“社会存在决定社会意识，社会意识是社会存在的反映”。古语出处为《管子·牧民》《论语·为政》。","refs":["H","S"],"note":"","o":69,"t":1},{"id":"N-M7-006","src":"新增","kind":"仿真题","type":"多选","module":"M7","cards":["M7.24","M7.25","M7.23","M7.26","M7.15"],"lead":"唯物史观从社会基本矛盾的运动中揭示社会历史发展的动力。","stem":"关于社会发展的动力，下列说法正确的有（）","options":{"A":"在阶级社会中，阶级斗争是社会发展的根本动力，社会革命是阶级斗争的最高形式","B":"生产力和生产关系、经济基础和上层建筑之间的矛盾是社会基本矛盾，它是社会发展的根本动力","C":"生产关系是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量","D":"在社会主义社会中，改革是社会发展的直接动力"},"answer":"BD","fix":"","analysis":"选BD。\nB项正确：生产力和生产关系、经济基础和上层建筑之间的矛盾是社会基本矛盾，是社会发展的根本动力；它贯穿社会发展过程，和某一发展阶段处于支配地位的社会主要矛盾不是一回事。\nD项正确：社会主义改革是社会主义制度的自我完善和发展，不改变社会主义基本制度，是社会主义社会发展的直接动力。\nA项错误：在阶级社会中，社会基本矛盾表现为阶级矛盾，要通过阶级斗争来解决，所以阶级斗争是阶级社会发展的直接动力，不是根本动力；A保留了“阶级社会”的限定，后半句“社会革命是阶级斗争的最高形式”也是对的，错在前半句把“直接”换成“根本”。\nC项错误：生产力是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量；C把这句话的主语从生产力换成了生产关系，生产关系对生产力有反作用，但不是最基本的动力因素，也不是最终决定力量。","trap":"两处真题式偷换：A把阶级斗争的“直接动力”换成“根本动力”，C把“最终决定力量”从生产力移到生产关系（2026年广东第4题网友回忆版正是把“根本动力”安到了生产关系上）。","basis":"依据：教材通行表述（马工程《马克思主义基本原理》“社会历史发展的动力”）：社会基本矛盾是社会发展的根本动力；生产力是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量；阶级斗争是阶级社会发展的直接动力。底稿M7.23、M7.24、M7.25正确句，M7.26“社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力”。","refs":["R","T"],"note":"","o":29,"t":1},{"id":"N-M7-007","src":"新增","kind":"仿真题","type":"多选","module":"M7","cards":["M7.05","M7.06","M7.04"],"lead":"社会意识是社会存在的反映，又具有相对独立性。恩格斯曾说，经济上落后的国家在哲学上仍然能够“演奏第一小提琴”。","stem":"关于社会意识的相对独立性，下列说法正确的有（）","options":{"A":"经济上相对落后的国家，在哲学等思想领域可以处于领先地位，这是社会意识与社会经济发展水平不平衡的表现","B":"先进的社会意识能够预见社会发展的趋势，走在社会存在变化的前面，说明它可以不以现实的社会存在为根据","C":"社会存在发生变化以后，旧的思想观念往往还会延续一段时间，这是社会意识与社会存在发展不完全同步的表现","D":"社会意识与社会存在的发展不完全同步，但这并不否定社会存在对社会意识的决定作用"},"answer":"ACD","fix":"","analysis":"选ACD。\nA项正确：社会意识与社会经济发展水平具有不平衡性，经济上相对落后的国家在思想上可以领先，恩格斯说的就是这种情况。\nC项正确：社会意识与社会存在的发展不完全同步，社会存在变化后，旧观念往往还会延续，落后于社会存在。A、C是两种不同的表现：A比较的是思想水平和经济发展水平，C比较的是社会意识的变化与社会存在的变化在时间上是否一致。\nD项正确：不同步说明社会意识有自身的发展特点，但社会意识归根到底仍由社会存在决定，不能由不同步推出社会存在不起决定作用。\nB项错误：先进的社会意识能够正确反映社会发展的客观规律，所以能预见趋势、走在社会存在变化的前面，但它正是在现实的社会存在基础上产生的，有现实根据，不是脱离社会存在凭空产生的；前两句都对，错在最后的推论。","trap":"两种表现别串：A是与经济发展水平“不平衡”，C是与社会存在发展“不同步”；B把“能预见趋势”偷换成“可以不以社会存在为根据”。","basis":"依据：教材通行表述（马工程“社会意识的相对独立性”）：社会意识与社会存在发展的不完全同步性、与社会经济发展水平的不平衡性等是相对独立性的表现；恩格斯1890年10月27日致康·施米特的信谈到经济上落后的国家在哲学上仍然能够“演奏第一小提琴”。底稿M7.05界限“超前意识仍有现实根据，并非脱离存在凭空产生”，M7.06界限“不能反过来否认社会意识的物质根源”。","refs":["S","T"],"note":"","o":22,"t":1},{"id":"N-M7-008","src":"新增","kind":"拓展","type":"多选","module":"M7","cards":["M7.15","M7.21","M7.04","M4.14","M4.13"],"lead":"毛泽东在《矛盾论》中指出：“生产力、实践、经济基础，一般地表现为主要的决定的作用，谁不承认这一点，谁就不是唯物论者。然而，生产关系、理论、上层建筑这些方面，在一定条件之下，又转过来表现其为主要的决定的作用，这也是必须承认的。”","stem":"结合这段话和唯物史观的基本观点，下列认识正确的有（）","options":{"A":"当不变更生产关系、生产力就不能发展的时候，生产关系的变更就起了主要的决定的作用","B":"这段话运用的是矛盾的主要方面和次要方面在一定条件下相互转化的原理","C":"历史过程中的决定性因素归根到底是现实生活的生产和再生产，但不能把经济因素说成唯一决定性的因素","D":"生产力和生产关系谁决定谁要看具体条件，二者之间并不存在一般的决定关系"},"answer":"ABC","fix":"","analysis":"选ABC。\nA项正确：这是《矛盾论》紧接着举的例子；同样，当着政治文化等上层建筑阻碍经济基础发展的时候，政治上和文化上的革新就成为主要的决定的东西。\nB项正确：生产力和生产关系、实践和理论、经济基础和上层建筑，各是同一对矛盾的两个方面。这段话出自《矛盾论》“主要的矛盾和主要的矛盾方面”一节，针对的是“它们的地位并不互相转化”的机械论看法，讲的是矛盾的主要方面和次要方面在一定条件下相互转化，不是几对矛盾之间主要矛盾和次要矛盾的转化。\nC项正确：这是恩格斯1890年致约·布洛赫信中的观点，经济因素归根到底起决定作用，但如果说它是唯一决定性的因素，就把唯物史观的命题变成毫无内容的空话；它和毛泽东的论述一致，都反对机械地理解决定作用。选项里的“唯一”是被否定的对象，不能凭这个词判错。\nD项错误：毛泽东明确说生产力、实践、经济基础“一般地表现为主要的决定的作用”，不承认这一点就不是唯物论者；他还指出，承认反作用在一定条件下起主要的决定的作用并不违反唯物论，因为在总的历史发展中，是物质的东西决定精神的东西，是社会存在决定社会意识。D把“一定条件下”的情况夸大成否认一般的决定关系。","trap":"两头都别走偏：一定条件下反作用可以起“主要的决定的作用”，但一般地、归根到底仍是生产力、经济基础起决定作用；这里转化的是同一矛盾的“主要方面”，不是“主要矛盾”。","basis":"依据：毛泽东《矛盾论》第四部分“主要的矛盾和主要的矛盾方面”原文，含“当着不变更生产关系，生产力就不能发展的时候，生产关系的变更就起了主要的决定的作用”“我们承认总的历史发展中是物质的东西决定精神的东西，是社会的存在决定社会的意识”；恩格斯1890年9月致约·布洛赫的信“如果有人在这里加以歪曲，说经济因素是唯一决定性的因素，那么他就是把这个命题变成毫无内容的、抽象的、荒诞无稽的空话”。底稿M4.14“矛盾主要方面是在同一矛盾中处于支配地位、起主导作用的方面”。","refs":["C","T"],"note":"","o":175,"t":2},{"id":"N-M7-009","src":"新增","kind":"仿真题","type":"多选","module":"M7","cards":["M7.16","M7.18","M7.19","M7.20","M7.11"],"lead":"恩格斯在《在马克思墓前的讲话》中说：“直接的物质的生活资料的生产，从而一个民族或一个时代的一定的经济发展阶段，便构成基础，人们的国家设施、法的观点、艺术以至宗教观念，就是从这个基础上发展起来的。”","stem":"按照唯物史观对社会结构的分析，下列说法正确的有（）","options":{"A":"生产资料归谁所有的实际经济关系属于经济基础，确认和保护这种所有制的法律制度属于上层建筑","B":"政治法律思想属于观念上层建筑，而不属于政治上层建筑","C":"厂房、道路属于广义的劳动资料，一个地区厂房、道路的多少并不是唯物史观所说的经济基础","D":"军队、警察、法庭、监狱等国家机器虽然看得见、摸得着，但属于政治上层建筑"},"answer":"ABCD","fix":"","analysis":"选ABCD。\nA项正确：实际的所有制关系是生产关系中最基本的部分，属于经济基础；把这种关系确认下来并加以保护的法律制度属于政治上层建筑。被规定的经济关系与规定它的法律形式相联系，但不在同一层次。\nB项正确：上层建筑分为观念上层建筑和政治上层建筑；政治法律思想是意识形态，属于观念上层建筑，政治法律制度及设施和政治组织才属于政治上层建筑，不能见到“政治”二字就归入政治上层建筑。\nC项正确：厂房、道路是劳动过程所需的物质条件，属于广义的劳动资料，是生产力的要素；经济基础是一定发展阶段的生产力所决定的生产关系的总和，不是物质财富或基础设施的数量。\nD项正确：军队、警察、法庭、监狱是国家政权的组成部分，属于政治上层建筑中的组织和设施；划分上层建筑看的是它在社会结构中的地位和功能，不看是否看得见、摸得着。","trap":"四项都是“反直觉但正确”：涉及所有制的法律不等于经济基础；带“政治”的思想不等于政治上层建筑；“经济基础”不是基础设施；看得见的国家机器仍是上层建筑。","basis":"依据：讲义第43—44页“经济基础是由社会一定发展阶段的生产力所决定的生产关系的总和”“上层建筑……包括观念上层建筑（意识形态）和政治上层建筑（政治法律制度及设施和政治组织），其中政治上层建筑居主导地位，国家政权是核心”；马克思《资本论》第一卷第五章把厂房、运河、道路列为经过劳动改造的劳动资料；底稿M7.16、M7.18、M7.19、M7.20。","refs":["H","R"],"note":"","o":42,"t":1},{"id":"N-M7-010","src":"新增","kind":"仿真题","type":"多选","module":"M7","cards":["M7.22","M7.14","M7.17","M7.31"],"lead":"马克思在《〈政治经济学批判〉序言》中写道：“人们在自己生活的社会生产中发生一定的、必然的、不以他们的意志为转移的关系，即同他们的物质生产力的一定发展阶段相适合的生产关系。这些生产关系的总和构成社会的经济结构，即有法律的和政治的上层建筑竖立其上并有一定的社会意识形式与之相适应的现实基础。”","stem":"关于唯物史观，下列说法正确的有（）","options":{"A":"上层建筑有效地巩固和维护了它所服务的经济基础，就说明它在社会发展中起着进步作用，是推动社会前进的力量","B":"人们可以根据生产力发展的要求主动调整生产关系，但不能离开生产力状况随意选择生产关系","C":"生产关系是相对于生产力而言的，一定社会生产关系的总和相对于上层建筑而言，就是这个社会的经济基础","D":"人的本质在其现实性上是一切社会关系的总和，而生产关系是各种社会关系中最基本的关系"},"answer":"BCD","fix":"","analysis":"选BCD。\nB项正确：生产关系是人们在生产中结成的，人们可以能动地调整它，但它不以人的意志为转移，必须适合生产力状况，不能脱离生产力随意设定。\nC项正确：同一类关系，相对生产力叫生产关系；一定社会生产关系的总和，从它对上层建筑的基础作用看，就是经济基础，单项生产关系不能代表经济基础的全部。\nD项正确：马克思在《关于费尔巴哈的提纲》中指出，人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和；生产关系是社会关系中最基本的关系，制约着其他社会关系。\nA项错误：上层建筑对经济基础的反作用集中表现为为经济基础服务，但它是不是进步力量，还要看它服务的经济基础是否适合生产力发展的要求；如果维护的是阻碍生产力发展的经济基础，维护得越有效，越是阻碍社会发展的消极力量；“有效维护”推不出“进步作用”。","trap":"条件被删：上层建筑是否进步，要看它所服务的经济基础是否适合生产力发展，而不是看它是否有效地维护了经济基础。","basis":"依据：讲义第43—44页，生产关系是“不以人的意志为转移的经济关系，是社会关系中最基本的关系”；“经济基础是由社会一定发展阶段的生产力所决定的生产关系的总和”；上层建筑“当它为适合生产力发展要求的经济基础服务时，就会成为推动社会发展的进步力量，反之，就会成为阻碍社会发展的消极力量”。马克思《关于费尔巴哈的提纲》第六条。底稿附录corrected_simplifications：不能“仅以维护现有经济基础就认定上层建筑促进进步”。","refs":["H","R"],"note":"","o":58,"t":1},{"id":"N-M7-011","src":"新增","kind":"拓展","type":"多选","module":"M7","cards":["M7.29","M7.28","M7.27","M5.04"],"lead":"恩格斯在一封书信中写道：“恰巧拿破仑这个科西嘉人做了被本身的战争弄得精疲力竭的法兰西共和国所需要的军事独裁者，这是个偶然现象。但是，假如没有拿破仑这个人，他的角色就会由另一个人来扮演。”","stem":"关于人民群众和杰出人物在历史发展中的作用，下列说法正确的有（）","options":{"A":"杰出人物的出现是必然性和偶然性的统一","B":"杰出人物的个人特点能够影响历史事件的具体面貌","C":"人民群众是社会物质财富的创造者，社会精神财富则主要由杰出人物创造","D":"人民群众是一个历史范畴，在不同历史时期有不同的内容，但始终以从事物质资料生产的劳动群众为主体"},"answer":"ABD","fix":"","analysis":"选ABD。\nA项正确：时代需要有人来完成一定的历史任务，这样的人物迟早会出现，这是必然的；恰好由谁来担当、在什么时候出现，带有偶然性，恩格斯这段话说的正是这一点。\nB项正确：“角色会由另一个人来扮演”，说的是历史任务和历史发展的基本趋势不取决于某一个人；但具体由谁担当，他的才能、性格会影响历史事件的具体面貌和进程快慢，杰出人物对历史发展起重大推动作用。\nD项正确：人民群众是推动社会历史发展的人们，其范围随历史条件变化，但始终以劳动群众为主体，不能简单理解为某一场合人数多的一方。\nC项错误：人民群众是社会物质财富的创造者，也是社会精神财富的创造者，还是社会变革的决定力量；专业创作者的贡献是真实的，但精神财富的源泉、素材和实现条件来自人民群众的实践，不能把精神财富的创造者移给杰出人物。","trap":"张冠李戴：C把“社会精神财富的创造者”从人民群众移给了杰出人物；另外不要把“角色可由别人扮演”误读成个人对历史事件毫无影响。","basis":"依据：讲义第44页“人民群众是社会物质财富的创造者、社会精神财富的创造者和社会变革的决定力量……杰出人物对历史发展起过重大推动作用，但只能对历史的发展起影响作用，而不能决定历史发展的基本趋势”；恩格斯1894年1月25日的书信（《马克思恩格斯选集》第4卷收作致瓦·博尔吉乌斯）；底稿M7.27界限“劳动群众是主体部分”，M5.04“必然趋势通过具体的偶然形式实现”。","refs":["H","T"],"note":"","o":12,"t":1},{"id":"N-M7-012","src":"新增","kind":"仿真题","type":"多选","module":"M7","cards":["M7.33","M7.34","M7.08","M7.35","M7.32"],"lead":"恩格斯指出：“我们断定，一切以往的道德论归根到底都是当时的社会经济状况的产物。”","stem":"关于道德及其与法律的关系，下列说法正确的有（）","options":{"A":"道德和法律一样，都是在私有制、阶级和国家出现以后，才作为调节社会关系的规范产生的","B":"道德和自然科学都属于社会意识，但道德属于意识形态，自然科学不属于意识形态","C":"有的行为在道德上受到谴责却不一定违法，不能仅凭道德评价给予法律处罚","D":"法律和道德都能规范人们的行为，二者都依靠国家强制力保证实施"},"answer":"BC","fix":"","analysis":"选BC。\nB项正确：道德反映并服务于一定的经济基础，属于意识形态（观念上层建筑）；自然科学反映自然现象，不属于特定的经济基础，属于非意识形态的社会意识，没有阶级性。\nC项正确：法律和道德调整的范围、实施方式不同，法律不能也不必把全部道德要求都规定为法律义务；某一行为在道德上不被认可，不等于违法，给予处罚必须有法律依据。\nA项错误：法律是随着私有制、阶级和国家的出现而产生的；道德的产生以劳动为首要前提、以社会关系为客观条件、以人的自我意识为主观条件，在阶级和国家出现以前就已存在，并不以国家和法律为前提。\nD项错误：两者都能规范行为，但法律依靠国家强制力保证实施，道德主要依靠社会舆论、传统习俗和人们的内心信念发挥作用，D把法律的保障方式安到了道德上。","trap":"两处张冠李戴：A把法律的产生条件（私有制、阶级、国家）、D把法律的保障方式（国家强制力）安到了道德上。","basis":"依据：讲义第43页“意识形态反映并服务于经济基础，具有鲜明的阶级性；非意识形态反映自然现象和不属于特定经济基础的某些社会现象，不具有阶级性”；马工程《思想道德与法治》关于道德起源（劳动首要前提、社会关系客观条件、自我意识主观条件）和道德与法律关系的论述；恩格斯《反杜林论》第一编“道德和法。永恒真理”；底稿M7.33、M7.34、M7.35。","refs":["D","L","H"],"note":"","o":75,"t":1},{"id":"N-X-001","src":"新增","kind":"拓展","type":"单选","module":"M2","cards":["M2.21","M2.24"],"lead":"荀子在《天论》中说：“天行有常，不为尧存，不为桀亡。”又说：“从天而颂之，孰与制天命而用之！”","stem":"对这两句话所蕴含哲理的理解，正确的是（）","options":{"A":"前一句说明规律是客观的，后一句说明人可以凭自己的意志创造规律","B":"前一句说明人在规律面前只能被动顺从，与后一句的意思相互矛盾","C":"前一句说明规律是客观的，后一句说明人能够认识和利用规律","D":"后一句出现“天命”二字，表明荀子在这里宣扬唯心主义的天命观"},"answer":"C","fix":"","analysis":"两句都出自战国末期荀子的《天论》。“天行有常，不为尧存，不为桀亡”的原意是：自然界的运行有它固有的常规，不因为有尧这样的圣君就存在，也不因为有桀这样的暴君就消亡，讲的是规律不以人的意志为转移，即规律的客观性。“从天而颂之，孰与制天命而用之”的原意是：与其顺从天、歌颂天，不如掌握自然的变化规律来利用它，讲的是人可以认识和利用规律，发挥主观能动性。\nC项正确：前一句讲规律客观、要尊重规律，后一句讲认识和利用规律，二者统一。\nA项错误：“制天命”是掌握、利用规律，不是制造规律。人可以改变条件、利用规律，但不能凭意志创造或消灭规律。\nB项错误：承认规律客观，不等于只能消极等待。尊重客观规律是正确发挥主观能动性的前提，认识和利用规律又要发挥主观能动性，两句并不矛盾。\nD项错误：这里的“天命”指自然界的运行变化及其规律，不是有意志的上天的命令；这句话恰恰反对消极地崇拜天、听天由命。判断哲学立场要看完整命题，不能凭“天命”这类字眼。","trap":"单字陷阱：“制天命而用之”的“天命”指自然规律，整句讲利用规律，不是天命观；利用规律也不等于创造规律","basis":"依据：底稿M2.21正确句“人不能凭意志创造或取消客观规律，但可以认识规律并创造条件加以利用”，M2.24正确句“尊重客观规律是正确发挥主观能动性的前提，认识利用规律又需要发挥主观能动性”；附录corrected_simplifications第1条“按完整命题判断何者第一性”。两句为《荀子·天论》原文，是教材讲规律客观性与主观能动性的常用例句","refs":["H","T"],"note":"","o":102,"t":1},{"id":"N-X-002","src":"新增","kind":"拓展","type":"单选","module":"M4","cards":["M4.18","M4.19"],"lead":"苏轼在《范增论》中写道：“物必先腐也，而后虫生之；人必先疑也，而后谗入之。”","stem":"这句话蕴含的哲学道理是（）","options":{"A":"外因是事物变化发展的根据，内因只是事物变化发展的条件","B":"内因是事物变化发展的根据，外因通过内因而起作用","C":"内因是事物变化发展的根据，外部条件对事物的变化不起作用","D":"矛盾双方在一定条件下可以相互转化，坏事可以变成好事"},"answer":"B","fix":"","analysis":"出自北宋苏轼的史论《范增论》。楚汉相争时，陈平用反间计离间项羽和谋士范增，项羽起了疑心，范增愤而离去，途中病死。苏轼认为根子在项羽自己：东西一定是自己先腐烂了，然后才生虫；人一定是自己先起了疑心，然后谗言才听得进去（文中接着说“陈平虽智，安能间无疑之主哉”）。以腐物生虫作比，说明事物内部先有可乘之隙，外部因素才能起作用。\nB项正确：内因是事物变化发展的根据，外因是变化发展的条件，外因通过内因而起作用。判断内外因要先确定研究对象：这里研究的是项羽与范增关系的破裂，项羽的猜疑是内因，陈平的离间是外因。\nA项错误：把根据和条件颠倒了。\nC项错误：“虫生之”“谗入之”恰恰说明外因起了实际作用。内因是根据，不等于外因没有作用；外因可以加速或延缓事物的变化，只是要通过内因起作用。\nD项错误：讲的是矛盾双方的相互转化（如“祸兮福之所倚，福兮祸之所伏”），本句讲的是变化的内部根据与外部条件，不是对立面的转化。","trap":"根据与条件：内因是根据、外因是条件，外因通过内因起作用；“内因是根据”推不出“外因不起作用”","basis":"依据：底稿M4.18正确句“内因是事物变化的根据，外因是条件，外因通过内因起作用”及易错句“内因是变化根据，所以任何外部条件都没有实际作用”，M4.19正确句“内外因要依据所研究事物的边界和矛盾关系判断”；《矛盾论》“外因是变化的条件，内因是变化的根据，外因通过内因而起作用”","refs":["C","T"],"note":"","o":98,"t":1},{"id":"N-X-003","src":"新增","kind":"拓展","type":"多选","module":"M1","cards":["M1.07","M1.03","M1.10","M1.12","M1.13","M1.14"],"lead":"判断一种观点属于唯物主义还是唯心主义，根本依据是看它怎样回答物质和意识何者为第一性的问题。","stem":"下列古语中，属于唯心主义观点的有（）","options":{"A":"天下惟器而已矣。道者器之道，器者不可谓之道之器也","B":"理也者，形而上之道也，生物之本也；气也者，形而下之器也，生物之具也","C":"天地合而万物生，阴阳接而变化起","D":"宇宙便是吾心，吾心即是宇宙"},"answer":"BD","fix":"","analysis":"本题不能凭“心”“道”“理”“气”“器”等单字下结论，要看完整命题把什么当作第一性。\nA项不选：出自明清之际王夫之《周易外传》卷五（《系辞上传》）。意思是天下只有具体的事物（器），道是器的道，不能说器是道的器——道（规律、原理）依存于具体事物。句中三次出现“道”，但主张器第一性，是唯物主义。\nB项当选：出自南宋朱熹《答黄道夫书》。意思是理是形而上的道，是产生万物的根本；气是形而下的器，是产生万物的材料。句中也有“气”“器”，也承认气的存在，但把理当作“生物之本”，气只是“生物之具”，理第一性，属于客观唯心主义（承认物质存在不等于承认物质第一性）。\nC项不选：出自《荀子·礼论》。意思是天地相合而万物产生，阴阳相交接而发生变化。用天地、阴阳这些自然的东西说明万物的产生和变化，没有把精神当作本原，属于朴素唯物主义（也含有朴素辩证法思想）。\nD项当选：南宋陆九渊语（见《陆九渊集》）。宇宙指无穷的空间和时间（古人说“四方上下曰宇，往古来今曰宙”），他说宇宙就是我的心，我的心就是宇宙，把个人的心当作世界的本原，属于主观唯心主义。\n对照A、B两项：同样出现“道”“器”，立场相反，关键在谁是“本”、谁依附于谁。讲义第38—39页把“气”“器”列为朴素唯物主义的关键词、“理”“道”列为客观唯心主义的关键词，只能当作初步提示，不能当作判断标准。","trap":"单字陷阱：含“道”的可以是唯物主义（王夫之），含“气”“器”的可以是唯心主义（朱熹）；要看谁是第一性","basis":"依据：底稿M1.07正确句“物质与意识何者第一性，是区分唯物主义和唯心主义的根本依据”，M1.03正确句“承认外部世界存在，尚不足以判定唯物主义，还须看是否承认物质第一性”，M1.12易错句“只要一句话出现‘我’‘心’或‘感觉’，就属于主观唯心主义”；附录corrected_simplifications第1条“按完整命题判断何者第一性”；讲义第38页把“天地合而万物生，阴阳接而变化起”列为古代朴素唯物主义例句","refs":["H","T"],"note":"","o":149,"t":1},{"id":"N-X-004","src":"新增","kind":"拓展","type":"多选","module":"M7","cards":["M2.18","M7.04","M7.05","M7.15","M7.21","M7.22"],"lead":"物质与意识、生产力与生产关系、经济基础与上层建筑、社会存在与社会意识，是马克思主义哲学中四对“决定—反作用”关系。","stem":"关于这四对关系，以下表述正确的有（）","options":{"A":"意识对物质的反作用，要通过人的实践活动才能转化为改造客观世界的现实力量","B":"生产关系对生产力的反作用有时十分显著，这就说明，在二者的关系中是生产关系从根本上决定生产力","C":"社会意识可以落后于社会存在，先进的社会意识也能在一定程度上预见社会发展的趋势","D":"上层建筑只要适应并维护现有的经济基础，就会成为推动社会发展的进步力量"},"answer":"AC","fix":"","analysis":"四对关系可以并排记：决定的一方是物质、生产力、经济基础、社会存在；反作用的一方是意识、生产关系、上层建筑、社会意识。反作用可以很大，方向要看条件，但都不颠倒谁决定谁。\nA项正确：意识本身不能直接改变物质对象，要通过指导实践才能变成改造世界的现实力量（设计图本身建不起桥）。\nB项错误：生产关系适合生产力时促进、不适合时阻碍，作用再显著，也是在生产力决定生产关系的前提下发生的，不能因为作用强就颠倒决定关系。《矛盾论》承认生产关系、上层建筑在一定条件下可以“表现其为主要的决定的作用”，那是讲具体条件下矛盾主次方面的转化，同时明确生产力、经济基础“一般地表现为主要的决定的作用”，不等于生产关系从根本上决定生产力。\nC项正确：社会意识有相对独立性，与社会存在的变化不完全同步，可能落后，也可能在一定程度上超前；超前的意识仍以社会存在为根据，不是凭空产生。\nD项错误：上层建筑起进步还是阻碍作用，要看它所服务的经济基础是否适合生产力发展的要求——为适合生产力发展要求的经济基础服务时是进步力量，反之是消极力量。只凭“维护现有经济基础”就判定进步，删掉了这个中间条件。\n四对关系中反作用的方向各有条件：意识看正确与否，生产关系看是否适合生产力，上层建筑看所服务的经济基础是否适合生产力，社会意识看先进与否。","trap":"反作用≠决定：反作用再大也不颠倒决定关系；上层建筑是否进步，要看它服务的经济基础是否适合生产力发展","basis":"依据：讲义第43页“生产力决定生产关系，生产关系对生产力具有反作用——生产关系适合生产力发展要求时，对生产力的发展起积极的推动作用；不适合生产力发展的客观要求时，则阻碍生产力的发展”，第44页“当它为适合生产力发展要求的经济基础服务时，就会成为推动社会发展的进步力量，反之，就会成为阻碍社会发展的消极力量”；底稿M2.18、M7.05、M7.15、M7.22正确句；《矛盾论》第四节关于生产力与生产关系、经济基础与上层建筑主次作用的论述","refs":["H","S","R","C"],"note":"","o":52,"t":1},{"id":"N-X-005","src":"新增","kind":"拓展","type":"多选","module":"M7","cards":["M7.03","M7.08","M7.15","M7.17","M7.18"],"lead":"社会存在与社会意识、生产力与生产关系、经济基础与上层建筑这几对范畴相互交叉，同一个范畴放在不同的关系中，所处的位置可能不同。","stem":"以下表述正确的有（）","options":{"A":"生产关系相对于生产力是被决定的一方，其总和相对于上层建筑又是起决定作用的经济基础","B":"生产方式是生产力与生产关系的统一，因此生产关系属于社会存在，不属于社会意识","C":"自然科学属于社会意识，所以它和政治法律思想、道德、宗教、艺术、哲学等一样，也属于观念上层建筑","D":"意识形态既是上层建筑的组成部分，又属于社会意识"},"answer":"ABD","fix":"","analysis":"同一个范畴的位置，要放到具体的那对关系里看。\nA项正确：在生产力与生产关系这对关系中，生产关系被生产力决定，又反作用于生产力；在经济基础与上层建筑这对关系中，一定社会生产关系的总和就是经济基础，处于决定上层建筑的一方。\nB项正确：社会存在主要包括地理环境、人口因素和物质生活资料的生产方式，生产方式是生产力与生产关系的统一，所以生产关系属于社会存在（是物质的社会关系），不能因为它是“人与人的关系”就归入社会意识。\nC项错误：自然科学属于社会意识，但它反映自然现象，不属于特定的经济基础，是非意识形态，没有阶级性，因而不属于观念上层建筑；政治法律思想、道德、宗教、艺术、哲学等才属于意识形态（观念上层建筑）。错在由“属于社会意识”直接推出“属于观念上层建筑”。\nD项正确：观念上层建筑就是意识形态。它在经济基础与上层建筑的关系中属于上层建筑，在社会存在与社会意识的关系中属于社会意识；社会意识的范围比意识形态宽。\n小结：生产关系在三对关系里都出现——被生产力决定，作为经济基础决定上层建筑，又属于社会存在；意识形态在两对关系里出现——属于上层建筑，也属于社会意识。","trap":"层次混淆：生产关系在一对关系中被决定、在另一对关系中（作为经济基础）起决定作用；社会意识≠意识形态，自然科学不属于上层建筑","basis":"依据：讲义第43页“社会存在是指社会物质生活条件的总和，主要包括地理环境、人口因素和物质生活资料的生产方式”“社会意识……按其对经济基础的关系可分为意识形态和非意识形态”“经济基础是由社会一定发展阶段的生产力所决定的生产关系的总和”，第44页“上层建筑……包括观念上层建筑（意识形态）和政治上层建筑”；底稿M7.03、M7.08、M7.17、M7.18正确句","refs":["H","S","R"],"note":"","o":79,"t":1},{"id":"N-X-006","src":"新增","kind":"拓展","type":"多选","module":"M7","cards":["M7.24","M7.25","M7.26","M6.09"],"lead":"马克思主义哲学在不同层次上讲“动力”：有认识发展的动力，有社会发展的根本动力，有阶级社会和社会主义社会各自的直接动力，还有社会发展的最终决定力量。","stem":"以下表述正确的有（）","options":{"A":"在任何社会形态中，阶级斗争都是社会发展的直接动力","B":"推动社会发展的根本动力是社会基本矛盾的运动，最终决定力量则是生产力","C":"改革是社会主义社会发展的直接动力","D":"实践不断提出新的问题，并为认识提供新的工具和手段，是认识发展的动力"},"answer":"BCD","fix":"","analysis":"“动力”一类的说法，要连主语和适用范围一起记。\nA项错误：阶级斗争是阶级社会发展的直接动力；原始社会和未来的共产主义社会没有阶级，也就没有阶级斗争。马克思、恩格斯说“阶级斗争是历史的直接动力”，指的是有阶级以来的历史，不能推广到“任何社会形态”。\nB项正确：生产力与生产关系、经济基础与上层建筑的矛盾是社会基本矛盾，社会基本矛盾运动是社会发展的根本动力；生产力是社会发展的最终决定力量。两句层次不同：前句说动力来自哪对矛盾的运动，后句说这对矛盾中起最终决定作用的是什么。\nC项正确：社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力，不是改变社会主义基本制度。\nD项正确：实践不断提出新问题，又为认识提供新的经验材料、工具和手段，推动认识向前发展，所以实践是认识发展的动力（实践还是认识的来源、目的和检验真理的唯一标准）。\n对照记：根本动力——社会基本矛盾运动；最终决定力量——生产力；直接动力——阶级社会是阶级斗争，社会主义社会是改革；认识发展的动力——实践。","trap":"扩大范围：阶级斗争只是阶级社会发展的直接动力；根本动力、最终决定力量、直接动力各有主语，不能互换","basis":"依据：底稿M7.24正确句“社会基本矛盾运动是社会发展的根本动力，生产力是社会发展的最终决定力量”，M7.25正确句“阶级斗争是阶级社会发展的直接动力，这一表述不能删去阶级社会的限定”，M7.26正确句“社会主义改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力”，M6.09正确句“实践提供认识材料，也提出新问题、提供工具并推动认识发展”","refs":["T","R","P"],"note":"","o":112,"t":1},{"id":"N-X-007","src":"新增","kind":"拓展","type":"多选","module":"M6","cards":["M7.12","M6.10","M6.25","M4.16"],"lead":"“唯一”“根本”“第一”这类限定词，用来指明某一范畴最关键的规定，在不同原理中各有固定的搭配对象。","stem":"以下表述正确的有（）","options":{"A":"科学技术是第一生产力，劳动者则是生产力中最活跃的因素","B":"认识活动的根本目的，就在于透过事物的现象去把握事物的本质和规律","C":"检验认识是否具有真理性，唯一的标准是实践，逻辑证明有重要作用，但代替不了实践检验","D":"根本矛盾规定事物发展全过程的本质，主要矛盾是某一阶段中处于支配地位的矛盾"},"answer":"ACD","fix":"","analysis":"A项正确：“第一生产力”说的是科学技术在现代生产力发展中的首要推动作用；“最活跃的因素”说的是劳动者是生产力中能动的主体要素。两种定位角度不同，不是互相排斥的排名——科学技术要被劳动者掌握、物化在劳动资料中，才能变成现实的生产力，不能因为科技是“第一”就说劳动者不再重要（生产工具则是生产力发展水平的重要标志）。\nB项错误：透过现象把握本质和规律，是认识的根本任务；认识的根本目的是指导实践、改造世界。《实践论》说，十分重要的问题不在于懂得了客观世界的规律性因而能够解释世界，而在于拿这种认识去能动地改造世界。本项偷换了“任务”与“目的”。\nC项正确：实践具有直接现实性，能把认识同客观对象联系起来对照，所以是检验真理的唯一标准；逻辑证明有重要作用，但不能代替实践检验（不能理解成逻辑证明没有价值）。\nD项正确：根本矛盾贯穿事物发展过程的始终，规定过程的本质；主要矛盾是某一发展阶段诸矛盾中处于支配地位、起决定作用的矛盾。二者可能重合，但不是同义词。另需分清：某一阶段事物的性质，主要由主要矛盾的主要方面规定，这与“根本矛盾规定全过程的本质”说的是不同层次。","trap":"任务与目的互换：把握本质和规律是认识的根本任务，指导实践、改造世界才是根本目的；“第一生产力”与“最活跃的因素”角度不同，不互相排斥","basis":"依据：底稿M7.12正确句“劳动者是生产力中最活跃的因素，生产工具反映生产力水平，科学技术是第一生产力”及易错句“科学技术是第一生产力，所以劳动者、工具和对象都不再是生产力的必要因素”，M6.10正确句“认识的根本任务是透过现象把握本质规律，根本目的是指导实践、改造世界”，M6.25正确句，M4.16正确句；《实践论》“马克思主义的哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界”","refs":["T","R","P","C"],"note":"","o":9,"t":1},{"id":"N-X-008","src":"新增","kind":"拓展","type":"多选","module":"M4","cards":["M2.08","M2.10","M4.05","M4.06","M6.21"],"lead":"马克思主义哲学多处用到“绝对”与“相对”：运动与静止，矛盾的斗争性与同一性，真理的绝对性与相对性。","stem":"以下表述正确的有（）","options":{"A":"相对静止是运动在一定条件下的特殊状态，否认相对静止，就难以区分和把握具体事物","B":"斗争性的绝对性，是指相互排斥的性质贯穿矛盾运动的始终，并不是说某种具体斗争形式永远不变","C":"人类认识按其本性来说能够正确认识无限发展着的物质世界，这是真理绝对性的一种含义","D":"同一性是相对的、有条件的，但它和斗争性共同推动事物的发展"},"answer":"ABCD","fix":"","analysis":"三处“绝对—相对”要分别理解。\nA项正确：运动是绝对的、无条件的；静止是相对的、有条件的，是运动的特殊状态——相对于某一参照系位置不变，或事物的根本性质暂时稳定，并不是没有任何运动。否认绝对运动会走向形而上学的不变论；否认相对静止，事物就无法确定和区分，会走向相对主义、诡辩论（如克拉底鲁说“人一次也不能踏进同一条河流”）。\nB项正确：斗争性的“绝对”，指矛盾双方相互排斥、相互否定的性质贯穿一切矛盾运动的始终；具体矛盾和具体的斗争形式（对抗或非对抗）会随条件变化，可以缓和，也可以解决。\nC项正确：真理的绝对性有两层意思：一是任何真理都包含不依赖于人的客观内容，同谬误有原则界限；二是人类认识按其本性能够正确认识无限发展着的物质世界，每前进一步都是对它的接近。这不等于某个具体真理已经穷尽了对象。真理的相对性指正确认识在范围、条件和深度上有限；绝对性和相对性是同一真理的两种属性，不是两类真理。\nD项正确：同一性“相对”是说它有条件、可变，不是说它不重要。相互依存为双方提供发展的条件，相互贯通、转化推动事物发展，同一性与斗争性共同推动事物发展。\n四项都对。常见误读是把“相对”理解成“次要、可有可无”，把“绝对”理解成“具体形式永远不变”或“认识已经到顶”。","trap":"“相对”≠次要、无用，“绝对”≠具体形式永远不变或认识已到顶；四项都对，不要因“否认……就……”“无限”等字眼误排","basis":"依据：讲义第39页“运动是绝对的、无条件的、永恒的，静止是相对的、有条件的、暂时的”，第40页“矛盾的斗争性是绝对的、无条件的。矛盾的同一性是相对的、有条件的”；底稿M2.08、M2.10、M4.05、M4.06、M6.21正确句，M6.21条件与边界“绝对性还指就认识本性而言，人类能够正确认识无限发展的物质世界”","refs":["H","C","E"],"note":"","o":68,"t":1},{"id":"N-X-009","src":"新增","kind":"拓展","type":"多选","module":"M5","cards":["M2.14","M2.15","M5.12","M5.13","M6.19","M6.28"],"lead":"“客观”“主观”是马克思主义哲学的常用词，在意识、真理、现象和价值评价等不同原理中，含义要结合语境把握。","stem":"以下表述正确的有（）","options":{"A":"真理是客观的，因此真理和物质一样，是不依赖于人的认识而存在的","B":"意识是客观存在的主观映象，其反映形式是主观的，内容来源于客观存在","C":"价值评价具有主体性，但它总要受到对象的客观属性和主体实际需要的制约","D":"假象虽然是一种现象，但它和错觉一样，都属于主体一侧的主观认识"},"answer":"BC","fix":"","analysis":"A项错误：真理的客观性是指真理的内容符合客观对象、不以人的意志为转移，检验真理的标准也是客观的；但真理本身属于认识，以概念、判断、推理等主观形式存在，不是像物质那样不依赖于认识而存在的东西。这里的“客观”不等于“物质实物”。\nB项正确：意识是客观存在在人脑中的主观映象：内容来源于客观存在（错误的意识也有现实来源，只是歪曲、片面），形式是主观的。这里的“主观”不等于“错误”或“唯心”。\nC项正确：价值评价以主体需要为尺度，具有主体性、多样性；但对象有没有某种属性、主体的需要是否真实，都有客观的一面。主体性不等于任意性，价值评价也不能代替对事实真假的判断。\nD项错误：现象（包括假象）都是事物本身的客观表现，假象是以歪曲、颠倒的方式表现本质的客观现象；错觉才是主体产生的错误知觉。例如筷子插进水里“看起来弯折”是光的折射造成的客观呈现，把它当成筷子真的弯了，才是主体一侧的误认。这里的“客观”也不等于“真实无误”。","trap":"“客观”≠物质实物（真理是客观的，但属于认识），“客观”≠真实无误（假象是客观的，却会误导人）；“主观”≠错误或任意","basis":"依据：讲义第40页“意识的本质是对客观存在的主观反映”；底稿M2.14、M5.13、M6.19、M6.28正确句，claude_handoff.content_integrity_rules“不把主观一词等同于错误或唯心，不把客观一词等同于物质实物”","refs":["H","K","E"],"note":"","o":87,"t":1},{"id":"N-X-010","src":"新增","kind":"拓展","type":"多选","module":"M6","cards":["M6.01","M2.17","M2.19","M6.04","M6.05"],"lead":"“能动”一词在意识、认识和实践等原理中反复出现。","stem":"以下表述正确的有（）","options":{"A":"认识是主体对客体的能动反映，无论怎样选择、加工材料，其正确与否都要受客体制约","B":"旧唯物主义离开实践考察认识，把认识看成消极、被动的直观反映，不了解认识的能动性","C":"实践有目的、有计划，具有自觉能动性，又受客观对象、手段和条件制约，具有客观物质性","D":"意识具有能动作用，正确的认识能够指导实践，因此只要认识正确，实践就必然能够取得预期的成功"},"answer":"ABC","fix":"","analysis":"A项正确：认识是能动的反映，不是镜子式的照相——主体会选择、加工材料，进行抽象和创造性构想；但认识正确与否，仍以是否符合客体为准，不能由主体任意建构。\nB项正确：旧唯物主义坚持反映论，但离开实践考察认识，把认识看成消极、被动、直观的反映，不了解认识的能动性和辩证发展过程。马克思在《关于费尔巴哈的提纲》中批评以往一切唯物主义只是从客体的或者直观的形式去理解对象，而不是当作实践、从主体方面去理解。辩证唯物主义认识论是能动的反映论。\nC项正确：实践有自觉能动性（有目的、有计划，体现主体的意愿和创造性），又有客观物质性（活动的对象、手段、过程和结果都是客观的），两种性质并不冲突，目的的主观性不改变实践是客观物质活动。\nD项错误：前半句“正确的认识能够指导实践”没有错，错在由此推出“只要认识正确，实践就必然能够取得预期的成功”。实践的结果还受物质条件、时机和实施过程等制约，正确认识不是成功的充分条件。实践的直接现实性也只是说它实际作用于对象，不保证每次都成功。\n小结：“能动”不等于“任意”，也不等于“保证成功”。","trap":"能动≠任意、≠保证成功：认识正确与否受客体制约；正确认识能指导实践，却不能保证实践必然成功","basis":"依据：讲义第40页“意识活动具有目的性、计划性”“意识活动具有主动创造性”，第42页实践的“客观实在性/直接现实性”“自觉能动性/主体能动性”；底稿M6.01、M2.17、M2.19、M6.04、M6.05正确句；《关于费尔巴哈的提纲》第一条","refs":["H","P","T"],"note":"","o":59,"t":1},{"id":"GD2015-XJ-Q081","src":"真题","kind":"广东真题","type":"单选","module":"M6","cards":["M6.01","M6.07","M2.15"],"lead":"","stem":"全国两会开幕前，人大代表、政协委员们为了提交议案、提案，会对经济社会发展问题进行深入的调查研究。这体现的哲理是（）。","options":{"A":"主观与客观具体的历史的统一","B":"具体问题具体分析","C":"科学理论对实践具有指导作用","D":"意识是人脑对客观事物的正确反映"},"answer":"A","fix":"","analysis":"A正确：先调查研究再提议案，是让认识（议案）符合实际情况，体现主观与客观、认识与实践的具体的历史的统一，也就是一切从实际出发、实事求是。\nB错误：具体问题具体分析说的是对不同的矛盾用不同的方法解决，题干没有“针对不同情况采取不同办法”的意思。\nC错误：题干是先调研、后形成认识，讲的是认识来源于实际，不是已有理论指导实践。\nD错误：意识是人脑对客观存在的反映，这种反映可能正确也可能错误，说“正确反映”把反映的内容限定错了。","trap":"“调查研究”对应的是让主观符合客观；D把意识的本质偷换成“正确反映”。","basis":"2015年广东省考县级卷第81题（乡镇卷第82题同题），答案A，见答案解析PDF第12页。","refs":["H"],"note":"","o":153,"t":1},{"id":"GD2018-Q073","src":"真题","kind":"广东真题","type":"单选","module":"M3","cards":["M3.18"],"lead":"","stem":"党的十九大报告指出：“中国特色社会主义进入新时代。”这一论断体现的哲学原理是（）。","options":{"A":"事物是质变与量变的统一","B":"“两点论”与“重点论”的统一","C":"矛盾是社会发展的动力","D":"事物是普遍联系的"},"answer":"A","fix":"","analysis":"A正确：中国特色社会主义的根本性质没有变，但发展进入了新的历史阶段，这是总的量变过程中的阶段性部分质变，体现量变与质变的统一。\nB错误：两点论与重点论讲的是看问题既要全面又要抓重点，题干是对发展阶段的判断。\nC错误：新时代的判断依据之一是社会主要矛盾的变化，但这一论断本身体现的是发展阶段的变化，不是“矛盾是动力”。\nD错误：题干没有讲事物之间的相互联系。","trap":"“进入新阶段而性质不变”是阶段性部分质变，不要被“主要矛盾变化”带到C。","basis":"2018年广东省考（县级、乡镇统一卷）第73题，答案A，见答案解析PDF第14页。","refs":["H"],"note":"","o":146,"t":1},{"id":"GD2019-XJ-Q080","src":"真题","kind":"广东真题","type":"单选","module":"M2","cards":["M2.21","M2.24"],"lead":"","stem":"只要把握住历史发展大势，抓住历史变革时机，奋发有为，锐意进取，人类社会就能更好前进。这句话体现的哲学原理是（）。","options":{"A":"物质和意识的辩证关系","B":"规律是可以认识和利用的","C":"事物发展是前进性和曲折性的统一","D":"实践是检验认识正确与否的唯一标准"},"answer":"B","fix":"","analysis":"B正确：“历史发展大势”就是社会发展规律，“把握大势、抓住时机、奋发有为”是在认识规律的基础上利用规律，体现尊重客观规律与发挥主观能动性的统一。\nA错误：题干的落点是认识和利用规律，不是笼统的物质决定意识、意识反作用于物质；有“奋发有为”就选A是常见的误选。\nC错误：题干没有讲发展道路的曲折。\nD错误：题干没有讲用实践检验认识。","trap":"看到“大势”“规律”就想到规律可以认识和利用；只凭“奋发有为”选物质意识关系会选偏。","basis":"2019年广东省考县级卷第80题（乡镇卷第68题同题），答案B，见答案解析PDF第14页。","refs":["H"],"note":"","o":170,"t":2},{"id":"GD2020-XJ-Q019","src":"真题","kind":"广东真题","type":"单选","module":"M4","cards":["M4.20","M4.03"],"lead":"","stem":"针对我国疫情防控工作，习近平总书记指出“要变压力为动力，善于化危为机”。以下典故与“善于化危为机”所蕴含的哲学原理一致的是（）。","options":{"A":"塞翁失马，焉知非福","B":"绳锯木断，水滴石穿","C":"千里之堤，溃于蚁穴","D":"南橘北枳，便分两等"},"answer":"A","fix":"","analysis":"A正确：“化危为机”“塞翁失马”都讲矛盾的对立双方在一定条件下相互转化（矛盾的同一性）。\nB错误：水滴石穿讲量的积累引起质变。\nC错误：千里之堤溃于蚁穴讲小问题积累成大祸，也是量变引起质变（防微杜渐）。\nD错误：南橘北枳讲环境、条件对事物的影响（联系的条件性）。","trap":"“危”与“机”、“祸”与“福”是对立面在一定条件下转化；B、C都是量变质变，D是条件。","basis":"2020年广东省考县级以上卷第19题（乡镇卷第11题同题），答案A，见参考答案及解析PDF第6页。","refs":["H","C"],"note":"","o":133,"t":1},{"id":"GD2024-Q012","src":"真题","kind":"广东真题","type":"多选","module":"M4","cards":["M4.03","M4.05","M4.07"],"lead":"矛盾是反映事物内部或者事物之间对立统一关系的哲学范畴。矛盾的同一性是指矛盾着的对立面相互依存、相互贯通的性质和趋势。","stem":"关于矛盾的同一性，以下表述正确的有（）。","options":{"A":"在矛盾双方中，一方的发展以另一方的发展为条件","B":"矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展","C":"事物的发展方向、趋势不是随意的，而是有规律地向自己的对立面转化","D":"矛盾双方的统一是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量"},"answer":"ABC","fix":"","analysis":"A正确：矛盾双方相互依存、互为条件，一方的发展以另一方的发展为条件，这是同一性在发展中的作用。\nB正确：矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展，也是同一性的作用。\nC正确：同一性使对立面相互贯通、在一定条件下相互转化，规定着事物发展的方向和趋势。\nD错误：推动一种矛盾统一体向另一种矛盾统一体过渡的决定性力量是矛盾双方的斗争（斗争性），不是双方的统一。","trap":"作用张冠李戴：“新旧矛盾统一体过渡的决定性力量”属于斗争性。","basis":"2024年广东省考第12题，答案ABC。","refs":["H","C","T"],"note":""},{"id":"GD2024-Q014","src":"真题","kind":"广东真题","type":"多选","module":"M7","cards":["M7.32"],"lead":"马克思主义道德观认为，人类社会的实际情况是“物质生活的生产方式制约着整个社会生活、政治生活和精神生活的过程。”","stem":"关于道德起源问题，以下认识正确的有（）。","options":{"A":"劳动是道德起源的首要前提","B":"道德起源于人与生俱来的善性","C":"社会关系是道德赖以产生的客观条件","D":"人的自我意识是道德产生的主观条件"},"answer":"ACD","fix":"","analysis":"A正确：劳动创造了人和人类社会，是道德起源的首要前提。\nB错误：“与生俱来的善性”是天赋道德论一类的唯心主义观点；马克思主义认为道德是社会历史的产物。\nC正确：社会关系的形成是道德赖以产生的客观条件。\nD正确：人的自我意识的形成和发展是道德产生的主观条件。","trap":"三个定位别对调：首要前提＝劳动，客观条件＝社会关系，主观条件＝自我意识；“与生俱来”是唯心论。","basis":"2024年广东省考第14题，答案ACD；马工程《思想道德与法治》道德起源部分。","refs":["D"],"note":""},{"id":"GD2025-Q004","src":"真题","kind":"广东真题","type":"判断","module":"M1","cards":["M1.15","M1.16"],"lead":"","stem":"科学性是马克思主义理论区别于其他理论的根本特征。","options":{},"answer":"错误","fix":"","analysis":"错在主语：区别于其他理论的特征是实践性。讲义第42页原句是“实践性是马克思主义区别于其他理论的根本特征”（马工程教材的写法是“显著特征”）。另外两个常被串用的说法：人民性是马克思主义的本质属性（讲义第38页），实践的观点是马克思主义首要的和基本的观点。","trap":"主体偷换：科学性、人民性、实践性、发展性各有专门的说法，题干把实践性换成了科学性。","basis":"2025年广东省考第4题，答案为错误。","refs":["H","T"],"note":""},{"id":"GD2025-Q010","src":"真题","kind":"广东真题","type":"多选","module":"M5","cards":["M4.01","M5.17","M5.18","M5.20"],"lead":"一个民族要走在时代前列，就一刻不能没有理论思维，一刻不能没有正确思想指引。中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行。唯物辩证法是马克思主义世界观和方法论的核心内容，为人们认识世界和改造世界提供了根本方法。","stem":"以下关于唯物辩证法的认识正确的有（）。","options":{"A":"矛盾分析法在唯物辩证法的方法论体系中居于核心地位","B":"唯物辩证法是客观辩证法在人的思维中的反映","C":"分析与综合不属于提高辩证思维能力的方法","D":"唯物辩证法本质上是批判的和革命的"},"answer":"ABD","fix":"","analysis":"A正确：对立统一规律是唯物辩证法的实质和核心，与之相应，矛盾分析法是唯物辩证法方法论体系的核心。\nB正确：客观辩证法是客观事物本身的辩证运动，唯物辩证法作为理论（主观辩证法）是客观辩证法在人的思维中的反映。\nC错误：归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一，都是辩证思维方法。\nD正确：马克思说辩证法“按其本质来说，它是批判的和革命的”。","trap":"C用“不属于”否定了一个本属于的方法；B要分清客观辩证法与主观辩证法谁反映谁。","basis":"2025年广东省考第10题，答案ABD。","refs":["H","T","K"],"note":""},{"id":"GD2026-Q004","src":"真题","kind":"广东真题","type":"判断","module":"M7","cards":["M7.24","M7.23","M7.15"],"lead":"","stem":"生产关系是人类社会发展的根本动力，也是一切社会变迁和政治变革的终极原因。","options":{},"answer":"错误","fix":"","analysis":"错在主语：社会发展的根本动力是社会基本矛盾（生产力与生产关系、经济基础与上层建筑的矛盾），生产力是社会发展的最终决定力量。恩格斯说一切社会变迁和政治变革的终极原因“应当到生产方式和交换方式的变更中去寻找”，不能说成生产关系本身。","trap":"“根本动力＝社会基本矛盾”“最终决定力量＝生产力”“直接动力＝阶级斗争（阶级社会）、改革（社会主义社会）”，三个层次别串。","basis":"2026年广东省考第4题。2026年为网友回忆版，仓库里没有官方答案，按教材判为错误。","refs":["H","T","R"],"note":""},{"id":"GD2026-Q010","src":"真题","kind":"广东真题","type":"多选","module":"M2","cards":["M2.03","M2.05","M2.01"],"lead":"物质范畴是一切唯物主义哲学的理论基石。马克思主义的物质范畴是一个高度抽象的哲学概念，是对世界上客观存在的各种事物共同本质的概括。","stem":"关于马克思主义的物质范畴，下列选项正确的有（）。","options":{"A":"物质的根本属性是运动","B":"世界的本原是多种物质的集合","C":"物质是标志客观实在的哲学范畴","D":"物质资料的生产方式构成了人类社会存在的基础"},"answer":"ACD","fix":"","analysis":"A正确：运动是物质的根本属性和存在方式（唯一特性是客观实在性，别混）。\nB错误：把世界的本原归结为某几种具体物质的集合，是古代朴素唯物主义的看法；马克思主义的物质范畴是对一切物质共同特性（客观实在性）的抽象概括。\nC正确：列宁的定义——物质是标志客观实在的哲学范畴。\nD正确：物质资料的生产方式是人类社会存在和发展的基础，体现了社会生活的物质性。","trap":"“唯一特性”是客观实在性，“根本属性”是运动；把物质当成具体物质的集合是朴素唯物主义。","basis":"2026年广东省考第10题。2026年为网友回忆版，仓库里没有官方答案，按教材判为ACD。","refs":["H","T"],"note":""},{"id":"F-P3-01-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P3","cards":["P3-01"],"lead":"某区对辖区内一批新建的社区养老服务中心开展年度评估，评估组提出了几种思路。","stem":"下列评估思路中，最符合正确政绩观要求的是（）","opts":[{"text":"既看投资总额也看建成数量，投入越多、建得越多，成绩就越好","correct":false,"why":"错因：把衡量标准从“群众实际受益”换成了“投入规模和建设数量”。投资多、建得多不等于服务有效，还要看是否符合需求、质量如何、建成后是否用得起来以及长期负担（被替换的是：关系——把投入规模当成了公共效果）。"},{"text":"主要看汇报材料是否齐全、宣传报道是否充分，据此评定成绩","correct":false,"why":"错因：把评价对象从“公共事务实际改善了什么”换成了“干部展示了什么”。材料和报道不能代替群众实际受益（被替换的是：关系——把材料展示当成了实际成效）。"},{"text":"看老人实际使用和受益情况，同时测算后续运营成本和可持续性","correct":true,"why":"正确政绩观要求为人民出政绩，评价不能只看材料、排名和任内可见数字，还要看群众实际受益、长期影响与可持续性；这一思路两方面都照顾到了。"},{"text":"既然重视群众评价，就用一次居民投票代替专业评估和审计","correct":false,"why":"错因：把“重视群众评价”推成了“群众评价取代专业论证和法定程序”。群众需要要与科学决策、依法履职、实际效果结合起来，一次即时投票也不等于整体长远利益（被替换的是：关系——结合换成了替代）。"}],"answer":"","fix":"","explain":"正确政绩观回答为谁创造政绩、用什么衡量政绩：为人民出政绩、以实干出政绩，评价不只看材料、排名和任内可见数字，还要看群众实际受益、长期影响与可持续性；重视群众评价也不等于取消专业论证和法定程序。","condition":"","refs":["TZG","T2026Z"],"origin":"自编","review":"","o":120,"t":1},{"id":"F-P3-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P3","cards":["P3-02"],"lead":"某市一项流域生态修复工程预计要十多年才能明显见效。现任市委、市政府持续投入，完成截污管网、生态补水等前期工程，并建立长效管护机制，没有为了在本届任内“出亮点”而压缩工期、追求速成。","stem":"对这一做法理解最准确的是（）","opts":[{"text":"既体现“功成不必在我”的境界，也体现“功成必定有我”的担当","correct":true,"why":"不为在本届任内出亮点而追求速成，是不计个人功名、甘做铺垫的“功成不必在我”；扎实完成本阶段的前期工程和管护机制，是承担当下责任的“功成必定有我”。两句分别处理功名归属和责任承担，可以同时成立。"},{"text":"体现了“功成不必在我”，但与“功成必定有我”的要求相矛盾","correct":false,"why":"错因：把两句话的互补关系换成了相互矛盾。二者共同要求接续奋斗、兼顾显功与潜功（被替换的是：关系）。"},{"text":"“功成必定有我”要求成果在本届显现，该做法偏离了这一要求","correct":false,"why":"错因：把“承担当下责任”换成了“成果要在本人任内显现”，即把责任参与偷换成功劳归属（被替换的是：关系——责任承担换成了功劳占有）。"},{"text":"既然“功成不必在我”，前期工程也可以留给下一届再启动","correct":false,"why":"错因：把“不计个人功名”换成了“不承担本阶段责任”。最终成果不必在本人任内显现，但本阶段该做的工作必须做好（被替换的是：动作——做好本阶段工作换成了推给下一届）。"}],"answer":"","fix":"","explain":"“功成不必在我”侧重不计个人功名、甘做铺垫的精神境界，“功成必定有我”侧重承担当下责任的历史担当；两句共同要求接续奋斗、兼顾显功与潜功，既不能拿前一句推卸责任，也不能把后一句理解为功劳归己。","condition":"","refs":["TGONG","TZG"],"origin":"自编","review":"","o":107,"t":1},{"id":"F-P3-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P3","cards":["P3-03"],"lead":"某县新一届领导班子研究年度工作安排时，形成了以下几种意见。","stem":"其中符合“显绩与潜绩”“一张蓝图绘到底”要求的有（）","opts":[{"text":"既办好群众急需的学校扩容，也持续推进见效较慢的地质灾害隐患排查","correct":true,"why":"既做群众当前看得见、得实惠的工作，也做打基础、利长远的工作，显绩与潜绩统筹兼顾。"},{"text":"打基础的潜绩比民生实事更重要，应压减当年的民生实事安排","correct":false,"why":"错因：把显绩与潜绩的互补关系换成了高低排斥关系。二者是成果显现的方式和时间不同，不是好坏等级，群众当前的急难愁盼不能因追求长远而搁置（被替换的是：关系）。"},{"text":"上一届制定的产业规划经评估总体符合实际，应保持连续性、接续推进","correct":true,"why":"政策接续以规划科学、符合实际和群众需要为前提；规划经评估总体符合实际，接续推进正是“一张蓝图绘到底”，可避免任意“翻烧饼”。"},{"text":"一张蓝图绘到底，规划某部分经论证确实脱离实际，仍应原样执行","correct":false,"why":"错因：遗漏了“规划科学、符合实际”这一前提，把接续实施解释成永不纠错；发现脱离实际的部分，应依法依事实调整（被替换的是：条件）。"}],"answer":"","fix":"","explain":"显绩与潜绩互补：既做群众当前看得见、得实惠的工作，也做打基础、利长远的工作。“一张蓝图绘到底”以规划科学、符合实际和群众需要为前提，保持合理的连续性，但不等于永不纠错。","condition":"","refs":["TZG","TGONG"],"origin":"自编","review":"","o":144,"t":1},{"id":"F-P3-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P3","cards":["P3-04"],"lead":"2026年，中共中央办公厅印发通知，在全党开展树立和践行正确政绩观学习教育。","stem":"根据该通知，下列对应关系正确的是（）","opts":[{"text":"总要求——一体推进学查改","correct":false,"why":"错因：把工作抓手放到了总要求的位置。“一体推进学查改”是抓手，总要求是立党为公、为民造福、科学决策、真抓实干（被替换的是：层级——抓手换成了总要求）。"},{"text":"工作抓手——立党为公、为民造福、科学决策、真抓实干","correct":false,"why":"错因：把四项总要求放到了抓手的位置；抓手是一体推进学查改（被替换的是：层级——总要求换成了抓手）。"},{"text":"开展范围——县处级以上领导班子和领导干部，其他党员不参加","correct":false,"why":"错因：把重点对象当成了全部范围。学习教育在全党开展，以县处级以上领导班子和领导干部特别是“一把手”为重点（被替换的是：主体——重点对象换成了唯一对象）。"},{"text":"实绩要求——经得起实践、人民、历史检验","correct":true,"why":"通知要求创造经得起实践、人民、历史检验的实绩，这是判断学习教育实际成效的尺度。"}],"answer":"","fix":"","explain":"2026年正确政绩观学习教育要分清层次：总要求是立党为公、为民造福、科学决策、真抓实干；抓手是一体推进学查改；实绩要经得起实践、人民、历史检验。范围是全党，以县处级以上领导班子和领导干部特别是“一把手”为重点，重点对象不等于唯一对象。时效上，通知安排春节假期后启动、7月底基本结束，不分批次、不划阶段；8月24日总结会议确认已基本结束，此后要求坚持常态化查改问题，集中教育结束不等于整改结束。","condition":"依据2026年中共中央办公厅关于在全党开展树立和践行正确政绩观学习教育的通知（新华社2026年2月23日播发）；不考启动、结束的具体日期；实施状态见2026年8月24日总结会议报道（E-PT-04）。","refs":["T2026Z","E-PT-04"],"origin":"自编","review":"","o":41,"t":1},{"id":"F-P3-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P3","cards":["P3-05"],"lead":"","stem":"自我革命强调党依靠自身力量发现和解决自身问题，但这并不排斥人民监督，二者是相互贯通的。","opts":[],"answer":"正确","fix":"","explain":"正确。人民监督与自我革命是跳出治乱兴衰历史周期率的两个答案，是相互贯通的两方面：自我革命强调党主动发现和解决自身问题，并不排斥人民监督，找到第二个答案也不是废除第一个答案。另须注意，以自我革命引领社会革命，不等于二者对象相同。","condition":"“自我革命是跳出治乱兴衰历史周期率的第二个答案”的表述见党的二十大报告（2022年）。","refs":["T20","TPL5"],"origin":"自编","review":"","o":8,"t":1},{"id":"F-P3-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P3","cards":["P3-06"],"lead":"某市在工程建设招投标领域推行全流程电子化交易，评标专家从专家库中随机抽取，关键岗位人员定期轮岗。","stem":"对这些做法理解最准确的是（）","opts":[{"text":"主要体现不敢腐，通过严厉惩处形成震慑","correct":false,"why":"错因：把“制度约束”换成了“惩治震慑”。材料中的措施是改流程、分权力、防操控，没有涉及查处和惩戒（被替换的是：动作——制度约束换成了惩治）。"},{"text":"主要体现不想腐，通过思想教育增强廉洁自觉","correct":false,"why":"错因：把“从制度上限制机会”换成了“从思想上改变意愿”，材料没有涉及
