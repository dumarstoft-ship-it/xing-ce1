<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>政常辨析日课</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* 布局：单栏练习本。顶栏固定（倒计时＋分栏），下面一张题卡；题面用宋体，界面用黑体。马哲、政常两个题库共用一套。 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #eaedf2;
  --ink: #18202e;
  --muted: #586274;
  --line: #d8dde6;
  --accent: #2c4a8a;
  --accent-soft: #e4eaf6;
  --ok: #1b7650;
  --ok-soft: #e1f2ea;
  --bad: #b03c2c;
  --bad-soft: #f8e4df;
  --warn: #8c6210;
  --warn-soft: #f6ecd6;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131a; --surface: #171b24; --sunk: #1f2430; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2b313d;
    --accent: #93aee8; --accent-soft: #1f2a42; --ok: #5cc596; --ok-soft: #15302a; --bad: #f08b78; --bad-soft: #3a201c;
    --warn: #ddb057; --warn-soft: #352a14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #171b24; --sunk: #1f2430; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2b313d;
  --accent: #93aee8; --accent-soft: #1f2a42; --ok: #5cc596; --ok-soft: #15302a; --bad: #f08b78; --bad-soft: #3a201c;
  --warn: #ddb057; --warn-soft: #352a14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--accent); font-weight: 700; }
nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { flex: 0 0 auto; padding: 8px 8px 9px; text-decoration: none; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
nav.tabs .n { font-size: 11px; margin-left: 3px; color: var(--bad); font-variant-numeric: tabular-nums; }
@media (max-width: 430px) { nav.tabs a { padding-left: 6px; padding-right: 6px; } }

main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; text-wrap: balance; }
.panel h3 { margin: 14px 0 6px; font-size: 15px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.loading { color: var(--muted); padding: 24px 0; text-align: center; }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); }

/* 今日 */
.today { display: grid; gap: 14px; }
.today .big { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.mix { display: flex; gap: 8px; flex-wrap: wrap; }
details.more > summary { cursor: pointer; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; color: var(--muted); }
details.more[open] > summary::before { content: "▾ "; }
details.more[open] > summary { margin-bottom: 12px; }
details.more > .panel { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 0 0; margin-top: 14px; }
details.more > .sub { margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill.a { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.mods { display: grid; gap: 6px; }
.mod { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.mod:hover { border-color: var(--line); background: var(--sunk); }
.mod .id { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.mod .t { min-width: 0; }
.mod .t span { display: block; font-size: 14px; }
.bar { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.mod .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 做题 */
.runbar { display: flex; align-items: center; gap: 12px; }
.runbar .prog { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.runbar .prog i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.runbar .pos { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.qmeta .pill { white-space: normal; }
.lead { font-family: var(--serif); color: var(--muted); margin: 0 0 8px; font-size: 15px; }
.stem { font-family: var(--serif); font-size: 18px; line-height: 1.75; margin: 0 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 1.8em 1fr; gap: 8px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--serif); font-size: 16px; line-height: 1.6; width: 100%; }
.opt .L { font-family: var(--sans); font-weight: 700; color: var(--muted); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.missed { border-color: var(--ok); border-style: dashed; }
.opt[disabled] { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { grid-template-columns: 1fr; text-align: center; font-family: var(--sans); font-size: 16px; font-weight: 500; padding: 12px; }
.tf .opt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.why { margin-top: 12px; display: grid; gap: 8px; }
.why input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; font-weight: 700; margin-top: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict span { font-weight: 400; color: var(--ink); }
.reveal { display: grid; gap: 10px; margin-top: 12px; }
.blk { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.blk .h { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.blk p { margin: 2px 0 0; white-space: pre-line; }
.blk.good { border-color: var(--ok); }
.blk.good .h { color: var(--ok); }
.blk.trap { border-color: var(--bad); }
.blk.trap .h { color: var(--bad); }
.blk.warn { border-color: var(--warn); background: var(--warn-soft); padding: 6px 10px 6px 12px; border-radius: 0 6px 6px 0; }
.blk.warn .h { color: var(--warn); }
.blk.fix { border-color: var(--accent); }
.blk.fix .h { color: var(--accent); }
.blk .serif { font-family: var(--serif); }
.mine { font-size: 13px; color: var(--muted); }
.runfoot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.kbd { font-size: 12px; color: var(--muted); }
.flag { font-size: 12px; color: var(--warn); }

/* 概念卡、错题本 */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.search { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.cardlist { display: grid; gap: 8px; }
details.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.card summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
details.card summary::-webkit-details-marker { display: none; }
details.card .cid { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
details.card .ct { min-width: 0; font-weight: 500; }
details.card .body { padding: 0 12px 12px; display: grid; gap: 10px; }
.wrongq { font-family: var(--serif); font-size: 14px; margin: 4px 0 0; padding-left: 12px; border-left: 2px solid var(--bad); }
.setting { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.setting label { font-size: 14px; }
select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); }

/* 附录、记录 */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 90px; margin-top: 8px; }
.days div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.days div.zero { background: var(--sunk); }
.daylbl { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.optwhy { display: grid; gap: 6px; }
.optwhy div { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px; font-size: 14px; }
.optwhy b { font-variant-numeric: tabular-nums; }
.optwhy .y { color: var(--ok); }
.optwhy .n { color: var(--bad); }
.dims { display: flex; gap: 4px; flex-wrap: wrap; }
.entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.entry { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.entry:hover { border-color: var(--accent); }
.entry b { font-weight: 700; font-size: 14px; }
.entry span { font-size: 12px; color: var(--muted); }
.selfrate { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.selfrate .chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.selfrate .chip.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }
textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
.subh { font-size: 13px; color: var(--muted); margin: 10px 0 4px; letter-spacing: 0.04em; }
@media (max-width: 480px) {
  .stem { font-size: 17px; }
  .stats3 .v { font-size: 18px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="mz-data" type="application/json">{"cards":[{"id":"M1.01","module_id":"M1","title":"哲学与零散世界观","priority":"B","correct_statement":"哲学是系统化、理论化的世界观，具有世界观不等于已经形成哲学体系。","incorrect_statement":"任何零散的世界看法都已经是完整的哲学，而且凡哲学都天然科学。","explanation":"系统程度与认识正确性是不同维度；有总体看法不等于形成理论体系，形成体系也不保证正确。","necessary_conditions_and_boundaries":"不可把哲学定义中的系统性偷换成正确性。","example_or_counterexample":"个人几句零散感想不自动构成系统哲学。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.02","module_id":"M1","title":"世界观决定与方法论体现","priority":"B","correct_statement":"世界观决定方法论，方法论体现世界观，这是总体立场与一般方法原则的关系。","incorrect_statement":"方法论决定世界观，世界观只是某个具体技巧的被动体现。","explanation":"总体立场影响研究和行动的一般原则，但具体技术可以被不同立场的人共同使用。","necessary_conditions_and_boundaries":"不能由一个具体技巧反推出唯一的世界观。","example_or_counterexample":"不同立场的人都能做实验，不因此具有完全相同的哲学立场。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.03","module_id":"M1","title":"外界存在与物质第一性","priority":"A","correct_statement":"承认外部世界存在，尚不足以判定唯物主义，还须看是否承认物质第一性。","incorrect_statement":"只要承认自然界存在，就必然属于唯物主义。","explanation":"一些唯心主义也承认自然界存在，却把它解释为精神的产物。","necessary_conditions_and_boundaries":"“承认存在”与“承认其本原地位”分开判断。","example_or_counterexample":"说自然由绝对精神产生，仍然是精神第一性的主张。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.04","module_id":"M1","title":"世界观与方法论","priority":"B","correct_statement":"世界观是对世界的总看法，方法论是认识和改造世界的一般方法原则，二者相互联系。","incorrect_statement":"世界观就是某一道题的具体解法，方法论则是对世界的总看法。","explanation":"总看法提供一般立场，一般方法原则指导怎样研究和行动；某个操作技巧不自动构成哲学方法论。","necessary_conditions_and_boundaries":"一般思想与具体技术分层，不能见到“方法”就归为方法论。","example_or_counterexample":"相信对象存在联系，会引导研究者考察条件；某道题用代入法只是具体方法。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.05","module_id":"M1","title":"哲学与具体科学","priority":"B","correct_statement":"哲学概括自然、社会和思维的一般问题，具体科学研究特定领域，二者可以相互促进。","incorrect_statement":"哲学能够替代各门具体科学，直接提供每个具体问题的答案。","explanation":"一般世界观与方法论不能代替各学科的具体证据、模型和研究；具体科学的发展又能推动哲学思考。","necessary_conditions_and_boundaries":"一般与特殊的关系，不是学科高低排名。","example_or_counterexample":"哲学的联系观点不能直接算出一座桥的承载数值。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.06","module_id":"M1","title":"哲学基本问题的两个方面","priority":"A","correct_statement":"思维和存在何者第一性，与思维能否正确认识存在，是哲学基本问题的两个方面。","incorrect_statement":"承认世界可以被认识，就已经回答了物质和意识何者第一性。","explanation":"本原问题与可知性问题是两条分类轴；回答能否认识世界，没有直接回答世界由什么决定。","necessary_conditions_and_boundaries":"“思维与存在”在此用于哲学基本问题的特定讨论。","example_or_counterexample":"主张精神是本原的人，也可能相信人能够认识世界。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.07","module_id":"M1","title":"唯物唯心的划分","priority":"B","correct_statement":"物质与意识何者第一性，是区分唯物主义和唯心主义的根本依据。","incorrect_statement":"是否承认意识有作用，是区分唯物主义和唯心主义的根本依据。","explanation":"唯物主义可以承认意识的能动作用；唯心主义的关键是把精神放在本原或决定性位置。","necessary_conditions_and_boundaries":"承认反作用不等于承认第一性。","example_or_counterexample":"强调思想指导行动，尚不足以判断该观点属于唯心主义。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"],"review_note":"通行说法是“对思维和存在（物质和意识）何者为第一性问题的不同回答，是划分唯物主义和唯心主义的唯一标准”。这里的“唯一标准”是教材原话，要判正确；能否认识世界划分的是可知论与不可知论。"},{"id":"M1.08","module_id":"M1","title":"可知论与不可知论","priority":"B","correct_statement":"可知论肯定认识客观世界的可能性，承认当前认识有限不等于不可知论。","incorrect_statement":"只要承认还有未知事物，就属于不可知论。","explanation":"未知是当前尚未认识；不可知论涉及原则上能否认识。认识尚未完成与根本不能认识不同。","necessary_conditions_and_boundaries":"有限的认识状态不能直接推出认识能力被原则上封闭。","example_or_counterexample":"不知道某现象原因，不等于宣布其原因永远不可认识。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.09","module_id":"M1","title":"唯物唯心与辩证形而上学","priority":"B","correct_statement":"唯物唯心主要回答世界本原，辩证法与形而上学的对立主要涉及怎样理解联系、变化和矛盾。","incorrect_statement":"只要是唯物主义，就一定具有辩证的历史观和发展观。","explanation":"两组划分针对的问题不同，近代机械唯物主义说明物质立场与辩证观点并非自动同时具备。","necessary_conditions_and_boundaries":"这里的形而上学按本课程与辩证法相对立的用法理解。","example_or_counterexample":"不能因为一个观点承认物质，就自动认定它承认事物内部矛盾。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.10","module_id":"M1","title":"古代朴素唯物主义","priority":"B","correct_statement":"把某种具体物质形态当作世界本原，是古代朴素唯物主义的典型局限。","incorrect_statement":"把水等具体物质形态当作世界本原，已经等于辩证唯物主义的物质范畴。","explanation":"它坚持物质本原的方向，但把共同的客观实在性限制在某种具体东西上，缺少科学论证。","necessary_conditions_and_boundaries":"必须看完整命题，不能凭一个“水”“气”字判定学派。","example_or_counterexample":"“水是万物的始基”与“水是一种物质形态”不是同一个主张。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.11","module_id":"M1","title":"近代机械唯物主义","priority":"B","correct_statement":"近代机械唯物主义具有机械性、形而上学性，以及历史观上的唯心主义局限。","incorrect_statement":"近代机械唯物主义的主要问题，是完全不承认物质存在。","explanation":"它在自然观上坚持唯物主义，但可能把复杂运动归结为机械运动，不能科学说明社会历史。","necessary_conditions_and_boundaries":"区分其唯物主义立场与机械、片面的解释方式。","example_or_counterexample":"承认物质存在，同时用孤立静止方式理解对象，仍可能是机械唯物主义。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.12","module_id":"M1","title":"主观唯心主义","priority":"A","correct_statement":"把个人感觉、心灵等作为世界本原，属于主观唯心主义的典型立场。","incorrect_statement":"只要一句话出现“我”“心”或“感觉”，就属于主观唯心主义。","explanation":"学派判断看是否让人的精神决定对象存在，不能按关键词分类。","necessary_conditions_and_boundaries":"普通心理描述与本体论主张必须区分。","example_or_counterexample":"“我感到天气冷”不等于“天气因我的感觉才存在”。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.13","module_id":"M1","title":"客观唯心主义","priority":"B","correct_statement":"把独立于个人的理念、绝对精神等当作世界本原，是客观唯心主义的典型立场。","incorrect_statement":"客观唯心主义既然带有“客观”二字，就承认物质第一性。","explanation":"这里的客观是相对个人意识而言，但其本原仍是精神性的存在，不是物质。","necessary_conditions_and_boundaries":"不能把“客观精神”与物质的客观实在性混同。","example_or_counterexample":"把自然界看作绝对精神的产物，仍把精神放在第一性。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.14","module_id":"M1","title":"两种唯心主义的共同点","priority":"B","correct_statement":"主观唯心主义与客观唯心主义都把精神放在本原位置，只是精神的理解不同。","incorrect_statement":"主观唯心主义以精神为本原，客观唯心主义则以物质为本原。","explanation":"二者都属于唯心主义；分歧在本原是个人意识还是独立于个人的精神。","necessary_conditions_and_boundaries":"共同立场与内部分类不能混为同一层次。","example_or_counterexample":"个人感觉和绝对精神不同，但都不能因此变成物质本原。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.15","module_id":"M1","title":"马克思主义的科学性","priority":"B","correct_statement":"科学性强调认识客观规律以及接受实践检验，不意味着理论体系拒绝发展。","incorrect_statement":"科学性意味着现有理论已经穷尽世界，今后无需丰富发展。","explanation":"科学理论能够包含正确内容，同时随对象、实践和研究深化而发展；科学性不等于终结性。","necessary_conditions_and_boundaries":"区分坚持已验证内容与把全部现有表述永久固定。","example_or_counterexample":"理论可以在保留正确认识的同时补充适用条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.16","module_id":"M1","title":"人民性与实践性","priority":"A","correct_statement":"人民性回答根本立场和为谁的问题，实践性强调理论与改变现实的实践相联系。","incorrect_statement":"人民性和实践性是同一个概念，可以在任何表述中互换。","explanation":"本质属性、政治立场与实践观点各有明确主语和语义，不能看见“根本”就机械换词。","necessary_conditions_and_boundaries":"沿用本课讲义的完整表述：人民性是马克思主义的本质属性；实践观点是马克思主义首要的和基本的观点。","example_or_counterexample":"“为谁服务”与“怎样同现实活动相联系”不是一个问题。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"],"review_note":"讲义原句：人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场；实践性是马克思主义区别于其他理论的根本特征（教材作“显著特征”）；实践的观点是马克思主义首要的和基本的观点。考题常把这几个定位词互换，本卡正确句把“本质属性”和“政治立场”揉成了一句，别照记。"},{"id":"M1.17","module_id":"M1","title":"发展性与革命性","priority":"B","correct_statement":"强调科学性、人民性、实践性、发展性，不等于排斥马克思主义的革命性。","incorrect_statement":"教材归纳了四个主要特征，因此马克思主义不具有革命性。","explanation":"特征归纳不是互斥穷尽的单字名单；革命性与科学性、实践性可以统一。","necessary_conditions_and_boundaries":"不同教材提问若使用“根本特征”“本质属性”，须保留完整主语。","example_or_counterexample":"不能因目录没有单列某一性质，就推导出理论否定它。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.18","module_id":"M1","title":"三大来源与三个组成部分","priority":"A","correct_statement":"德国古典哲学、英国古典政治经济学、英法空想社会主义是思想来源，不是马克思主义三个组成部分的名称。","incorrect_statement":"德国古典哲学、英国古典政治经济学、英法空想社会主义就是马克思主义的三个组成部分。","explanation":"来源说理论吸收了什么；组成部分说形成的理论体系包含什么，即哲学、政治经济学、科学社会主义。","necessary_conditions_and_boundaries":"本课只记来源与组成的区分，不展开马政经。","example_or_counterexample":"原材料的来源与制成品内部结构，不能用同一份名单替代。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M1.19","module_id":"M1","title":"两大发现与哲学两部分","priority":"B","correct_statement":"唯物史观和剩余价值学说被概括为马克思的两大发现；辩证唯物主义和历史唯物主义是其哲学的两个重要组成。","incorrect_statement":"马克思的两大发现就是辩证唯物主义和历史唯物主义。","explanation":"“两大发现”与“哲学组成”不是同一个提问，历史唯物主义可在两种讨论中出现，但另一个对应项不同。","necessary_conditions_and_boundaries":"不要把哲学、整个马克思主义体系和科学社会主义的理论基础混作一层。","example_or_counterexample":"看到“两大”先确认题目问的是发现、组成，还是其他关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T","B","G"]},{"id":"M2.01","module_id":"M2","title":"世界的物质统一性","priority":"A","correct_statement":"世界的统一性在于物质性，意识依赖物质，不等于意识本身与物质是同一范畴。","incorrect_statement":"世界统一于物质，所以任何意识内容本身都已经是一件物质实物。","explanation":"物质第一性与意识的派生性可以统一说明世界，不必把精神与物质的区别抹平。","necessary_conditions_and_boundaries":"“统一于物质”不能偷换成所有现象都是同一种具体物质形态。","example_or_counterexample":"人的思想依赖物质条件，但不能按思想的长度去称量其重量。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.02","module_id":"M2","title":"意识对生理活动的作用","priority":"B","correct_statement":"意识对人体生理活动具有一定调节作用，但不能任意支配全部生理过程。","incorrect_statement":"意识具有能动作用，所以人的全部身体状态都完全由意志决定。","explanation":"承认调节作用不能取消客观生理条件，也不能把意志当作无条件充分原因。","necessary_conditions_and_boundaries":"仅作哲学关系辨析，不推导任何医疗或健康处置建议。","example_or_counterexample":"专注状态能影响行为表现，不意味着可以凭意志取消一切生理限制。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.03","module_id":"M2","title":"物质范畴与具体形态","priority":"A","correct_statement":"哲学物质范畴概括各种具体物质形态共同具有的客观实在性。","incorrect_statement":"哲学物质就是某种最小粒子，粒子模型改变就证明物质不存在。","explanation":"具体科学模型可以更新，共同的不依赖意识而存在的特性并不因此消失。","necessary_conditions_and_boundaries":"抽象共同属性不等于脱离具体形态另有一个实体。","example_or_counterexample":"原子模型的改进是对物质认识的发展，不是物质被意识创造。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.04","module_id":"M2","title":"客观实在与客观存在","priority":"B","correct_statement":"客观实在性专用于说明物质不依赖意识而存在；不能由某种观念确实存在便把它判成物质。","incorrect_statement":"一种思想确实存在，所以这种思想本身就具有物质的客观实在性。","explanation":"现实中存在精神现象，不等于精神现象与物质在哲学分类上没有区别。","necessary_conditions_and_boundaries":"“客观存在”在日常及不同教材中用法较宽，训练时用完整命题判断。","example_or_counterexample":"某种信仰确实有人持有，不证明该信仰所描述的对象必然存在。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.05","module_id":"M2","title":"唯一特性与根本属性","priority":"A","correct_statement":"物质的唯一特性是客观实在性，运动是物质的根本属性和存在方式。","incorrect_statement":"物质的唯一特性是运动，客观实在性只是它的存在方式。","explanation":"唯一特性用于划分物质与意识；根本属性与存在方式说明物质怎样存在。","necessary_conditions_and_boundaries":"注意题干是“唯一特性”还是“根本属性”。","example_or_counterexample":"把两个熟悉名词互换，是典型关系替换错误。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.06","module_id":"M2","title":"物质与运动不可分","priority":"B","correct_statement":"运动是物质的运动，物质是运动着的物质，二者不能分离。","incorrect_statement":"可以承认完全没有任何运动的物质，同时坚持辩证唯物主义。","explanation":"物质具有变化、过程和相互作用；抽掉一切运动，把物质理解为绝对不变，会走向形而上学。","necessary_conditions_and_boundaries":"暂时没有某种运动，不等于没有一切运动。","example_or_counterexample":"桌子相对房间不移动，仍有内部运动并参与地球运动。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.07","module_id":"M2","title":"离开物质谈运动","priority":"B","correct_statement":"否认物质承担者而把运动说成精神自生的运动，会走向唯心主义。","incorrect_statement":"承认运动而否认任何物质承担者，仍足以坚持物质第一性。","explanation":"运动不能脱离运动着的对象独立悬空存在；精神自生论改变了本原立场。","necessary_conditions_and_boundaries":"区分数学上抽象研究运动关系，与哲学上否认物质承担者。","example_or_counterexample":"为了计算而简化对象，不等于宣布现实没有物质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.08","module_id":"M2","title":"运动与相对静止","priority":"B","correct_statement":"运动是绝对的，相对静止是物质运动在一定条件下的特殊状态。","incorrect_statement":"相对静止就是一段时间内绝对不存在任何运动。","explanation":"静止只相对一定参照关系或性质而言，不能扩张为停止一切变化。","necessary_conditions_and_boundaries":"必须说清相对什么、保持什么。","example_or_counterexample":"两列同速同向列车相对位置不变，不表示它们不运动。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.09","module_id":"M2","title":"相对静止的两种情形","priority":"B","correct_statement":"一定条件下相对位置不变，或事物根本性质暂时稳定，都可体现相对静止。","incorrect_statement":"只有空间位置不动才叫相对静止，性质稳定与静止无关。","explanation":"哲学运动不只指机械位移，相对静止也不限于位置关系。","necessary_conditions_and_boundaries":"性质相对稳定不排除数量变化和内部活动。","example_or_counterexample":"一个组织成员有所变化而基本性质未变，可从性质稳定角度理解。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.10","module_id":"M2","title":"否认静止与否认运动","priority":"B","correct_statement":"否认绝对运动会走向形而上学，否认相对静止则难以把握事物的确定性。","incorrect_statement":"承认运动绝对，就应否认事物具有任何相对确定的性质。","explanation":"若连相对稳定都否认，对象无法被区分、认识与比较；变化与暂时确定并存。","necessary_conditions_and_boundaries":"“绝对运动”不是“每个性质每一刻都已经改变”。","example_or_counterexample":"测量和识别都需要对象在相关条件下有可把握的确定性。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"],"review_note":"考场口径：否认运动的绝对性，会导致形而上学不变论；否认相对静止，会导致相对主义和诡辩论（如克拉底鲁说“人一次也不能踏进同一条河流”）。"},{"id":"M2.11","module_id":"M2","title":"时间空间与物质","priority":"B","correct_statement":"时间和空间是运动着的物质的存在形式，不能把它们说成纯粹由个人意志创造。","incorrect_statement":"时间和空间是否存在，完全取决于个人是否正在感觉它们。","explanation":"人的时空观念会变化，但观念变化不等于客观时空由观念制造。","necessary_conditions_and_boundaries":"不把某一具体时空模型永久化。","example_or_counterexample":"计时方式不同，不证明客观过程由时钟创造。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.12","module_id":"M2","title":"意识的器官与内容来源","priority":"A","correct_statement":"人脑是意识的生理器官，客观存在是意识内容的来源。","incorrect_statement":"人脑既是意识的生理器官，也是意识全部内容凭空产生的来源。","explanation":"器官提供形成意识的物质条件，不等于内容无需接触现实就能自生。","necessary_conditions_and_boundaries":"来源、器官、形式是不同提问。","example_or_counterexample":"有记忆能力不等于生来已经掌握所有知识。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.13","module_id":"M2","title":"意识起源的自然与社会方面","priority":"B","correct_statement":"意识是自然界长期发展的产物，也是社会实践发展的产物，劳动和语言具有重要作用。","incorrect_statement":"意识完全是孤立大脑自然成熟的结果，与劳动、交往和语言无关。","explanation":"人类意识的形成既有生物演化条件，也有社会实践和交往条件，不能只保留一个方面。","necessary_conditions_and_boundaries":"讨论起源，不等于要求每个个体重新经历全部历史。","example_or_counterexample":"个人学习语言承接社会成果，并非独自发明人类语言。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"],"review_note":"考场口径：意识是自然界长期发展的产物，更是社会劳动的产物；劳动在意识的产生和发展中起决定作用，语言是思维的物质外壳。遇到“劳动在意识的产生和发展中起决定作用”要判正确。"},{"id":"M2.14","module_id":"M2","title":"意识内容与形式","priority":"B","correct_statement":"意识是客观存在的主观映象，内容有客观来源，反映形式具有主观性。","incorrect_statement":"意识既然反映客观存在，其形式就不具有任何主观性。","explanation":"不同主体会选择、加工、表达材料；客观来源与主观反映形式并不排斥。","necessary_conditions_and_boundaries":"“内容有客观来源”不等于内容描述都正确。","example_or_counterexample":"同一对象可以被用不同语言和图式表达。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"],"review_note":"教材原句：意识是客观内容和主观形式的统一，意识的内容是客观的，形式是主观的。“内容是客观的”指内容来源于客观存在，不等于内容都正确；遇到这句原话要判正确。"},{"id":"M2.15","module_id":"M2","title":"错误意识的来源","priority":"A","correct_statement":"错误意识也是对客观存在的反映，只是反映可能歪曲、片面或错误组合。","incorrect_statement":"只有正确意识来源于客观存在，错误意识不需要任何现实来源。","explanation":"来源与正确性是两条判断轴；现实材料可以在加工中被误认或错误组合。","necessary_conditions_and_boundaries":"“反映”不自动包含“正确反映”的限定。","example_or_counterexample":"虚构形象可以组合现实中的形态，但不因此在现实中真实存在。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.16","module_id":"M2","title":"意识不是物质分泌物","priority":"B","correct_statement":"意识依赖人脑的物质活动，但不能把意识内容直接等同于某种物质分泌物。","incorrect_statement":"既然意识依赖人脑，意识与脑分泌出的物质就是同一种东西。","explanation":"意识具有对对象的意义和映象关系，依赖物质条件不等于与该条件在概念上同一。","necessary_conditions_and_boundaries":"不讨论具体神经科学机制或对人工意识作绝对预言。","example_or_counterexample":"纸张承载文字，不等于纸张重量就是文字表达的意义。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.17","module_id":"M2","title":"能动反映与任意创造","priority":"B","correct_statement":"意识能够选择、加工、预测和创造性构想，但其正确性仍受客观对象约束。","incorrect_statement":"只要认识包含人的创造性加工，就一定属于唯心主义。","explanation":"反映可以是能动的；唯心主义错误在于把精神放在决定客观世界的位置。","necessary_conditions_and_boundaries":"创造观念、模型与创造客观规律不同。","example_or_counterexample":"提出一个新模型，不等于模型对应的规律由人制造。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.18","module_id":"M2","title":"意识作用与实践中介","priority":"A","correct_statement":"意识对改造客观世界的作用，要通过人的实践活动实现。","incorrect_statement":"正确意识不经过任何实践，就能直接改变外部物质对象。","explanation":"认识能够指导行动，实际改变对象的是受认识指导的物质活动。","necessary_conditions_and_boundaries":"意识对自身状态的影响与对外部对象的改造不能混为一谈。","example_or_counterexample":"设计图本身不能把桥建起来。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.19","module_id":"M2","title":"能动作用不保证成功","priority":"B","correct_statement":"正确认识有利于实践，实际结果还受条件与实施过程制约。","incorrect_statement":"只要意识正确，无论物质条件如何都必然取得预期成功。","explanation":"正确认识不是取消条件的魔法；实践仍受资源、时机和执行等约束。","necessary_conditions_and_boundaries":"“指导作用”不能偷换成单一充分条件。","example_or_counterexample":"知道正确方案而缺少必要材料，仍可能无法实施。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.20","module_id":"M2","title":"规律与表面现象","priority":"B","correct_statement":"规律揭示本质的、必然的、稳定的联系，不能把任何反复出现的表面现象直接当作规律。","incorrect_statement":"一种现象只要连续发生几次，就已经证明它是客观规律。","explanation":"重复可提供线索，但还需辨明条件、机制与联系性质。","necessary_conditions_and_boundaries":"稳定性不等于某个外在表现永远相同。","example_or_counterexample":"连续几次碰巧同时发生，不能单凭次数认定有因果规律。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.21","module_id":"M2","title":"规律客观与利用规律","priority":"A","correct_statement":"人不能凭意志创造或取消客观规律，但可以认识规律并创造条件加以利用。","incorrect_statement":"人可以利用规律，因此也能随意创造与取消客观规律。","explanation":"改变条件、建立新的具体联系，与凭意志创造或取消客观规律不是一回事。","necessary_conditions_and_boundaries":"这里的“创造条件”不等于不受任何规律限制。","example_or_counterexample":"利用浮力造船，是利用已有联系，不是创造浮力规律。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"],"review_note":"考场口径补一个词：规律是客观的，人们不能创造、消灭，也不能改变规律；能做的是认识规律，并根据规律发生作用的条件去利用它。"},{"id":"M2.22","module_id":"M2","title":"规律客观与条件变化","priority":"A","correct_statement":"规律具有客观性，不等于某种具体规律的适用条件和表现形式永远不变。","incorrect_statement":"只要规律是客观的，其适用条件就不可能发生变化。","explanation":"客观性否定意志任意决定，不能推出适用范围无限或作用条件恒定。","necessary_conditions_and_boundaries":"区分规律的客观性与具体认识的适用边界。","example_or_counterexample":"改变环境条件后，不能不加分析地照搬原有经验公式。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"],"review_note":"本卡正确句“规律的适用条件和表现形式不是永远不变”容易被读成“规律会随条件改变”，易错句“规律客观则其适用条件不可能变化”又可以读成对的（规律所要求的条件属于规律本身），两道判断题都已暂停自动出题。考场口径：规律是客观的，不能被创造、消灭或改变；规律发生作用需要一定条件，现实条件变了，规律起作用的范围和形式会随之变化；人们可以通过改变条件来利用规律或限制其破坏作用（如修堤筑坝治水）。"},{"id":"M2.23","module_id":"M2","title":"规律与规则","priority":"B","correct_statement":"规律是客观联系，规则是人制定的行为或操作规范，规则应尊重客观条件。","incorrect_statement":"既然规则能够被修改，就证明客观规律也能被任意修改。","explanation":"制度、规程和客观联系不是同一种对象；制定规则不等于制定自然或社会发展的全部规律。","necessary_conditions_and_boundaries":"“规律”与“规则”不能只凭字面相近互换。","example_or_counterexample":"修改比赛规则，不等于修改运动员身体活动所遵循的客观条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M2.24","module_id":"M2","title":"客观规律与主观能动性","priority":"A","correct_statement":"尊重客观规律是正确发挥主观能动性的前提，认识利用规律又需要发挥主观能动性。","incorrect_statement":"尊重客观规律意味着人只能被动等待，不能主动改变条件。","explanation":"能动活动必须立足客观条件，同时可以通过研究和行动开辟实际可行的路径。","necessary_conditions_and_boundaries":"既不能唯意志论，也不能把客观性理解成无所作为。","example_or_counterexample":"了解约束以后调整方案，是能动性发挥的一种表现。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","T"]},{"id":"M3.01","module_id":"M3","title":"质变后的新量变","priority":"A","correct_statement":"质变结束原有性质下的量变，并为新性质基础上的量变创造条件。","incorrect_statement":"一旦发生质变，事物的数量、规模等就永远不再变化。","explanation":"量变质变相互衔接，质变不是一切运动的终点，而是形成新的发展基础。","necessary_conditions_and_boundaries":"先说明研究对象及其新旧性质。","example_or_counterexample":"进入新阶段后，仍可以发生数量积累和新的变化。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.02","module_id":"M3","title":"普遍联系与任意联系","priority":"B","correct_statement":"联系具有普遍性，但具体事物间的具体联系需要相应条件和依据。","incorrect_statement":"联系具有普遍性，所以任意两个事物之间必有直接联系。","explanation":"普遍联系不抹去联系的具体条件、方向和中介，更不等于所有对象两两直接作用。","necessary_conditions_and_boundaries":"尤其保留“具体”“直接”等限定。","example_or_counterexample":"不能因为两件事发生在同一天，就断言它们直接相关。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.03","module_id":"M3","title":"联系客观与人为联系","priority":"B","correct_statement":"人可以依据客观条件建立新的具体联系，这不否认联系的客观性。","incorrect_statement":"只要某种联系是人建立的，它就一定是主观虚构的联系。","explanation":"人为活动也使用客观对象并受客观规律约束；建立现实联系与仅在脑中想象不同。","necessary_conditions_and_boundaries":"人为事物的联系也具有客观性。","example_or_counterexample":"修建道路形成交通联系，需要真实工程条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.04","module_id":"M3","title":"联系的条件性与多样性","priority":"B","correct_statement":"具体联系有条件且形式多样，并非所有联系都是因果联系。","incorrect_statement":"只要两个对象存在联系，就必然是一方直接造成另一方。","explanation":"联系可以表现为相互制约、共同条件、结构关系等，因果只是其中一种。","necessary_conditions_and_boundaries":"不能把“相关”“依存”“引起”一概替换。","example_or_counterexample":"两个指标可能受同一因素影响，并非互为原因。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.05","module_id":"M3","title":"整体与部分的层次","priority":"B","correct_statement":"整体由部分构成，部分存在于整体中，二者不能简单等同于共性与个性。","incorrect_statement":"整体与部分就是普遍性与特殊性，两组概念可以随意互换。","explanation":"整体部分问构成关系，共性个性问属性关系；构成对象的一个部件不等于该对象的一个特殊种类。","necessary_conditions_and_boundaries":"同一材料可以有多种分析视角，须看题目问的关系。","example_or_counterexample":"一辆车与车轮是整体部分，汽车与某款汽车更接近一般与个别。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.06","module_id":"M3","title":"整体主导与部分作用","priority":"B","correct_statement":"整体居于主导地位，同时部分的功能及变化能够影响整体。","incorrect_statement":"整体居于主导地位，所以任何部分变化都不可能影响整体。","explanation":"整体通过部分实现功能，主导不等于取消构成条件及反馈。","necessary_conditions_and_boundaries":"影响程度取决于部分所处位置和具体条件。","example_or_counterexample":"一个关键部件失效可能导致系统无法正常运转。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.07","module_id":"M3","title":"关键部分的条件","priority":"B","correct_statement":"关键部分在一定条件下可以对整体功能产生决定性影响。","incorrect_statement":"任何部分在任何条件下都决定整体，整体服从部分。","explanation":"关键性是结构和条件中的地位，不能从个别关键部件推出所有部分始终决定整体。","necessary_conditions_and_boundaries":"不要漏掉“关键”“一定条件”。","example_or_counterexample":"关键控制环节失效可致停机，不等于任意装饰部件都决定系统性能。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.08","module_id":"M3","title":"整体功能与部分之和","priority":"B","correct_statement":"部分以合理结构形成有机整体时，整体功能可能大于部分功能之和。","incorrect_statement":"任何整体的功能都必然大于部分功能之和。","explanation":"组合方式可能协同，也可能冲突、内耗；优势需要结构和协调条件。","necessary_conditions_and_boundaries":"教材的优化要求不能改写成无条件事实判断。","example_or_counterexample":"人员增加但协作混乱，不一定提高整体效率。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"],"review_note":"考场口径：当各部分以合理的结构形成整体时，整体就具有全新的功能，整体的功能就会大于各部分功能之和；结构欠佳会损害整体功能的发挥。本卡把“就会”写成了“可能”，遇到教材原句要判正确；错的说法是删掉“合理结构”这一条件，说成任何整体的功能都大于部分之和。"},{"id":"M3.09","module_id":"M3","title":"系统优化与局部最优","priority":"B","correct_statement":"系统优化要求统筹要素关系，局部最优不必自动构成整体最优。","incorrect_statement":"只要每个局部各自达到最优，整体就一定最优。","explanation":"局部使用同一资源、产生外部影响时，各自最优可能彼此冲突。","necessary_conditions_and_boundaries":"要看约束是否共享以及局部之间怎样作用。","example_or_counterexample":"各部门各自占满公共资源，可能降低系统整体效率。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.10","module_id":"M3","title":"运动变化与发展","priority":"B","correct_statement":"发展是具有前进上升方向的变化，并非一切运动变化都是发展。","incorrect_statement":"凡是发生了变化，就一定属于发展。","explanation":"变化的范围更广，可以包含倒退、衰亡与平移；发展具有方向性规定。","necessary_conditions_and_boundaries":"不能把客观发生与进步性评价混同。","example_or_counterexample":"设备性能下降也是变化，却不能据此称为发展。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.11","module_id":"M3","title":"新旧事物的判断标准","priority":"A","correct_statement":"新旧事物要看是否符合发展的必然趋势，不能只按出现时间和一时力量大小判断。","incorrect_statement":"后出现、宣传新颖或当前力量强大的事物，一定是哲学上的新事物。","explanation":"时间新、形式新、力量强与历史进步性不是同一个属性。","necessary_conditions_and_boundaries":"“新”在哲学中是专门概念。","example_or_counterexample":"旧内容可以换一个新名称继续出现。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.12","module_id":"M3","title":"新事物成长与曲折","priority":"B","correct_statement":"新事物成长可以经历曲折和暂时挫折，不能因一时弱小就判定没有发展前途。","incorrect_statement":"新事物必然在每个阶段、每次竞争中立即战胜旧事物。","explanation":"总趋势与每个具体环节不同；新事物的优势需要条件展开。","necessary_conditions_and_boundaries":"不能借规律给任何自称“新”的项目保证成功。","example_or_counterexample":"一项符合发展方向的创新仍可能在具体实施中失败。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.13","module_id":"M3","title":"量变与结构变化","priority":"A","correct_statement":"数量增减和构成要素排列次序的变化，都可能是量变的表现形式。","incorrect_statement":"量变只能是数量增加，结构排列变化一概不是量变。","explanation":"量的变化不限于多与少，也可以发生在比例、排列和结构参数上。","necessary_conditions_and_boundaries":"具体结构变化若已突破度并改变根本性质，应判断为质变。","example_or_counterexample":"不能只看题目有没有数字，还要看性质是否改变。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.14","module_id":"M3","title":"质变与外观变化","priority":"A","correct_statement":"质变的判断关键是根本性质是否变化，不能只按外观变化大小判断。","incorrect_statement":"外观变化越明显就越是质变，外观不明显就不可能发生质变。","explanation":"可见幅度与性质变化是不同维度，重大外观变化可能未变质，关键性质变化也可能不显眼。","necessary_conditions_and_boundaries":"先确定研究对象及其质。","example_or_counterexample":"组织名称换了不必改变性质，关键制度关系改变则可能影响性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.15","module_id":"M3","title":"度与关节点","priority":"B","correct_statement":"度是事物保持其质的量的限度，是否超出度是区分量变与质变的重要依据。","incorrect_statement":"度是任意人为规定的目标值，与事物性质是否保持无关。","explanation":"度把质与量联系起来；关节点是量变转入质变的界限。","necessary_conditions_and_boundaries":"具体度需要具体分析，不能脱离条件背一个万能阈值。","example_or_counterexample":"工程上可容许的范围依对象和条件确定。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"],"review_note":"讲义写“量变和质变的区分标志：是否超出一定的限度”，教材、教辅常说“根本标志”。遇到“事物的变化是否超出度，是区分量变和质变的根本标志”要判正确。"},{"id":"M3.16","module_id":"M3","title":"量变准备与质变条件","priority":"A","correct_statement":"量变是质变的必要准备，量变达到一定程度并具备相应条件才会发生质变。","incorrect_statement":"只要有任何数量变化，就已经必然发生质变。","explanation":"必要准备不等于任意一点变化就是充分条件，必须注意程度和条件。","necessary_conditions_and_boundaries":"“质变是量变的必然结果”不能删去达到一定程度的语境。","example_or_counterexample":"积累尚未越过界限时，性质可以保持稳定。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"],"review_note":"考场口径：质变是量变的必然结果，量变达到一定程度（突破度的关节点）必然引起质变。本卡正确句多写了“并具备相应条件”，遇到“量变达到一定程度必然引起质变”要判正确。"},{"id":"M3.17","module_id":"M3","title":"质变与发展的方向","priority":"A","correct_statement":"质变可以表现为进步或倒退，不能把所有质变都等同于发展。","incorrect_statement":"发生质变就说明事物一定进步了。","explanation":"质变描述性质改变，发展额外要求前进上升方向。","necessary_conditions_and_boundaries":"分类标准不同：是否变质与朝何方向。","example_or_counterexample":"制度性质变化不自动获得进步性评价。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.18","module_id":"M3","title":"量变质变的交错","priority":"A","correct_statement":"总体量变过程中可以包含局部性质变化，整体层次与局部层次要区分。","incorrect_statement":"只要局部发生任何质变，就能断定研究对象整体已经质变。","explanation":"同一过程可有不同层次，局部变化是否引起整体性质变化取决于其位置和范围。","necessary_conditions_and_boundaries":"先固定对象与分析层次。","example_or_counterexample":"一个部门调整不一定改变整个组织的根本性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.19","module_id":"M3","title":"肯定因素与否定因素","priority":"B","correct_statement":"肯定因素维持事物现有性质，否定因素推动其突破现有性质，二者是事物内部的方面。","incorrect_statement":"哲学的肯定与否定，就是个人赞成和反对某件事的态度。","explanation":"这里描述事物内部维持和改变的趋势，不是在投赞成票或反对票。","necessary_conditions_and_boundaries":"不能由肯定因素推出“凡存在都在价值上正当”。","example_or_counterexample":"系统中维持原结构的机制与促使其改变的因素可同时存在。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.20","module_id":"M3","title":"辩证否定与外力毁灭","priority":"B","correct_statement":"辩证否定是事物内部矛盾推动的自我否定，是发展和联系的环节。","incorrect_statement":"只要外力把某物彻底毁掉，就完整体现了辩证否定的实质。","explanation":"摧毁旧物不等于形成包含继承联系的发展过程，自我否定强调内部根据。","necessary_conditions_and_boundaries":"外部条件可以参与，但不能替代内部根据的分析。","example_or_counterexample":"砸碎学习笔记不等于在原有认识基础上取得更高认识。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.21","module_id":"M3","title":"扬弃与全盘抛弃","priority":"A","correct_statement":"扬弃是克服旧事物中的消极因素并保留、改造积极因素，不是全盘抛弃。","incorrect_statement":"扬弃就是把旧事物所有内容一律清除。","explanation":"发展需要既突破局限又保持联系，保留什么由具体内容决定。","necessary_conditions_and_boundaries":"也不能机械理解为各取一半。","example_or_counterexample":"修改文章可保留有效论据，重写不成立的论证。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.22","module_id":"M3","title":"否定之否定与原样复归","priority":"A","correct_statement":"否定之否定所体现的回复，包含在更高阶段上对某些因素的重新肯定，不是原样返回起点。","incorrect_statement":"否定两次以后，事物必然完全恢复原来的状态。","explanation":"发展中的保留经过改造，不能按形式逻辑的双重否定等同处理。","necessary_conditions_and_boundaries":"不能只凭三个阶段或“又回来了”就认定已证明这一规律。","example_or_counterexample":"先重形式、后重内容、再结合二者，可帮助理解扬弃，但不单独证明普遍规律。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.23","module_id":"M3","title":"前进性与曲折性","priority":"B","correct_statement":"发展总体的前进趋势可以通过曲折过程实现，不要求每一步都上升。","incorrect_statement":"既然发展是前进的，任何暂时倒退都足以否定发展趋势。","explanation":"总体方向和局部路径属于不同层次，局部挫折不自动推翻总体判断。","necessary_conditions_and_boundaries":"也不能把所有倒退都无条件说成必然进步。","example_or_counterexample":"需分析挫折是否改变关键条件和总体趋势。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M3.24","module_id":"M3","title":"三大规律与辩证法核心","priority":"B","correct_statement":"对立统一规律揭示发展的源泉和动力，质量互变规律揭示发展的形式和状态，否定之否定规律揭示发展的方向和道路。","incorrect_statement":"否定之否定主要揭示发展的根本动力，对立统一只说明数量积累。","explanation":"三个规律各有侧重，不能把对应关系互换；对立统一是核心，但不意味着其他规律可以省略。","necessary_conditions_and_boundaries":"联系与发展概括唯物辩证法的总特征和基本观点，对立统一是其实质和核心，主语要完整。","example_or_counterexample":"看到“根本动力”要追问其所属理论层次，不能随意换成前进曲折。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C","K"]},{"id":"M4.01","module_id":"M4","title":"辩证法核心与矛盾问题精髓","priority":"A","correct_statement":"对立统一规律是唯物辩证法的实质和核心，矛盾普遍性与特殊性的关系是矛盾问题的精髓。","incorrect_statement":"唯物辩证法的实质核心是量变积累，矛盾问题的精髓是所有矛盾完全相同。","explanation":"理论整体的核心规律与矛盾问题中的关键关系，主语和层次不同；共性不抹去个性。","necessary_conditions_and_boundaries":"辩证法与形而上学的重要根本分歧在于是否承认矛盾是事物发展的动力，不能简化为是否承认任何变化。","example_or_counterexample":"同样出现“核心”“精髓”一类词，仍需核对其完整主语和对应项。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.02","module_id":"M4","title":"哲学矛盾与逻辑矛盾","priority":"B","correct_statement":"哲学矛盾指事物内部或事物之间的对立统一关系，不等于同一条件下自相矛盾的判断。","incorrect_statement":"坚持矛盾观点，意味着可以把同一条件下相互否定的两个判断都当作正确。","explanation":"现实中的对立统一与思维违反不矛盾律不同，辩证法不授权逻辑混乱。","necessary_conditions_and_boundaries":"判断是否矛盾需固定对象、时间、方面和条件。","example_or_counterexample":"供给与需求具有对立统一关系，不等于“同一商品此刻既有库存又完全无库存”都真。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.03","module_id":"M4","title":"同一性不等于相同","priority":"A","correct_statement":"矛盾同一性包括相互依存，以及在一定条件下相互贯通、转化。","incorrect_statement":"矛盾同一性意味着双方在性质、作用和立场上完全相同。","explanation":"同一性说双方如何构成统一关系，不是抹掉差别；没有对立就无所谓矛盾双方的同一性。","necessary_conditions_and_boundaries":"仅仅共同出现或名称相似，不足以证明构成矛盾同一性。","example_or_counterexample":"生产和消费不同，但在社会再生产中相互联系和制约。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.04","module_id":"M4","title":"斗争性不等于争吵","priority":"A","correct_statement":"斗争性指矛盾双方相互排斥、相互否定的属性，其表现形式可以不同。","incorrect_statement":"只有发生公开争吵或暴力冲突，才能说明矛盾具有斗争性。","explanation":"对立关系可能以非对抗方式表现，不能把哲学概念缩成日常冲突。","necessary_conditions_and_boundaries":"对抗只是矛盾斗争的某些形式，不是全部。","example_or_counterexample":"协商中的不同要求，也可能体现相互制约的对立。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.05","module_id":"M4","title":"同一斗争与发展动力","priority":"A","correct_statement":"同一性与斗争性共同推动事物发展，不能把其中一方完全排除。","incorrect_statement":"只有斗争性推动发展，同一性对发展没有作用。","explanation":"相互依存提供双方发展的联系和条件，排斥否定推动变化；两者不能脱离。","necessary_conditions_and_boundaries":"共同作用不表示作用方式或地位完全相同。","example_or_counterexample":"双方在相互依赖中竞争，会影响各自的调整和发展。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.06","module_id":"M4","title":"同一性相对与斗争性绝对","priority":"A","correct_statement":"同一性具有相对性和条件性；斗争性的绝对性指矛盾双方相互排斥的性质贯穿矛盾运动过程，不意味着具体矛盾或斗争形式永远不变。","incorrect_statement":"斗争性绝对，所以任何具体斗争形式都不受条件限制并永远不变。","explanation":"绝对性说对立运动的普遍性质，不是给每场具体冲突永久性、无条件性。","necessary_conditions_and_boundaries":"具体矛盾及具体斗争形式始终需要具体分析。","example_or_counterexample":"一种冲突可以缓和或消失，不等于世界不再存在矛盾运动。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.07","module_id":"M4","title":"斗争性寓于同一性","priority":"A","correct_statement":"矛盾斗争性寓于同一性之中，双方在一定统一关系中相互排斥。","incorrect_statement":"斗争性可以完全脱离双方的统一关系而独立存在。","explanation":"只有发生具体关系的对立双方，才能谈它们之间的排斥和否定。","necessary_conditions_and_boundaries":"“寓于”说存在关系，不是说斗争性由主观和解创造。","example_or_counterexample":"不能把两个没有确定关系的对象随意指定为矛盾双方。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.08","module_id":"M4","title":"矛盾普遍性与具体矛盾","priority":"B","correct_statement":"矛盾普遍性要求承认矛盾存在于事物及其发展过程中，不等于每个具体矛盾永远不变。","incorrect_statement":"既然矛盾普遍存在，任何具体矛盾都不可能被解决。","explanation":"解决的是一定的具体矛盾，解决后仍可能形成新的关系和矛盾。","necessary_conditions_and_boundaries":"普遍存在与个别矛盾的存续是两个层次。","example_or_counterexample":"一个技术难题解决后，实践还会提出新的问题。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.09","module_id":"M4","title":"矛盾特殊性的层次","priority":"B","correct_statement":"不同事物、同一事物不同阶段，以及同一矛盾不同方面，都可有各自特点。","incorrect_statement":"矛盾特殊性只指不同事物之间有差异，同一事物各阶段没有特殊性。","explanation":"具体分析既要横向区分对象，也要纵向区分阶段，并区分矛盾双方。","necessary_conditions_and_boundaries":"不是只给对象贴一个名称就完成具体分析。","example_or_counterexample":"同一学习任务在入门、熟练、应试阶段的困难可能不同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.10","module_id":"M4","title":"普遍性寓于特殊性","priority":"A","correct_statement":"矛盾普遍性寓于特殊性之中，并通过特殊性表现出来。","incorrect_statement":"普遍性在特殊性之外单独存在，具体对象可以完全不包含共性。","explanation":"共性存在于个性之中，认识共性要通过具体对象，不能另造脱离个体的共性实体。","necessary_conditions_and_boundaries":"“寓于”不是数量包含或集合大小比较。","example_or_counterexample":"一般规律通过具体过程表现，不能悬在过程之外发挥作用。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.11","module_id":"M4","title":"共性个性与整体部分","priority":"B","correct_statement":"共性个性描述属性的一般与特殊，整体部分描述对象的构成，二者不能互换。","incorrect_statement":"某种普遍属性就是一个整体，各具体对象就是它的组成零件。","explanation":"属性与对象构成不是同一维度，把共性当成物件会混淆关系。","necessary_conditions_and_boundaries":"可用不同视角研究同一对象，但要说明视角。","example_or_counterexample":"“三角形有三条边”是共性；一条边是三角形的组成部分。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.12","module_id":"M4","title":"普遍特殊的相对转化","priority":"B","correct_statement":"同一认识在不同范围的比较中，可以表现为相对普遍或相对特殊。","incorrect_statement":"某一属性只要曾被称为普遍性，在任何研究范围中都永远是普遍性。","explanation":"普遍和特殊的关系具有层次，改变比较范围会改变相对地位。","necessary_conditions_and_boundaries":"不能在不改变对象或范围时随意交换称谓。","example_or_counterexample":"某类企业的共性，相对于全部企业又可能是特殊性。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.13","module_id":"M4","title":"主要矛盾与次要矛盾","priority":"A","correct_statement":"在复杂事物的诸多矛盾中，主要矛盾在一定阶段处于支配地位，对发展起决定作用。","incorrect_statement":"主要矛盾就是同一个矛盾中占优势的那一方。","explanation":"主要矛盾比较多组矛盾；主要方面比较同一组矛盾的双方。","necessary_conditions_and_boundaries":"先数分析的是多组关系还是一组关系的两面。","example_or_counterexample":"在若干瓶颈中确定关键瓶颈，是主要矛盾视角。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.14","module_id":"M4","title":"主要方面与次要方面","priority":"A","correct_statement":"矛盾主要方面是在同一矛盾中处于支配地位、起主导作用的方面。","incorrect_statement":"矛盾主要方面是许多矛盾中最需要优先解决的那一组矛盾。","explanation":"“方面”与“矛盾”不是同一层级，不能把一组关系和其中一方混同。","necessary_conditions_and_boundaries":"优势不能只机械理解为人数或数量多。","example_or_counterexample":"分析一个事物的性质，要考察何种方面实际占主导。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.15","module_id":"M4","title":"事物性质与主要方面","priority":"A","correct_statement":"复杂事物的性质，主要由其主要矛盾的主要方面规定。","incorrect_statement":"事物性质主要由某个次要矛盾的任何一方规定，与主要矛盾无关。","explanation":"性质判断与发展中的问题排序有关但不相同，规范表述须保留两层限定。","necessary_conditions_and_boundaries":"不能省略主语后用“主要矛盾决定一切”替代。","example_or_counterexample":"判断一个组织的性质，不只看其中是否出现个别不一致现象。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.16","module_id":"M4","title":"主要矛盾与根本矛盾","priority":"A","correct_statement":"根本矛盾贯穿事物发展过程并规定根本性质；主要矛盾着眼某一阶段诸矛盾中的支配地位。","incorrect_statement":"根本矛盾和主要矛盾在任何情形下都是完全同义词。","explanation":"二者的分析范围和作用侧重不同，可能相关或重合，但不能机械等同。","necessary_conditions_and_boundaries":"避免把阶段性突出问题自动升格为贯穿全程的根本矛盾。","example_or_counterexample":"某阶段最紧迫的障碍未必就是事物根本性质的全部依据。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.17","module_id":"M4","title":"两点论与重点论","priority":"B","correct_statement":"两点论要求兼顾主要矛盾和次要矛盾、同一矛盾的主要方面和次要方面；重点论要求着重把握主要矛盾和矛盾的主要方面。","incorrect_statement":"两点论要求对所有方面平均用力，重点论要求完全忽略次要方面。","explanation":"全面不等于均分资源，抓重点也不等于把其余因素宣布为零。","necessary_conditions_and_boundaries":"主次在一定条件下可以转化。","example_or_counterexample":"抓主要瓶颈时仍需防止次要环节发展成新的瓶颈。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.18","module_id":"M4","title":"内因与外因","priority":"A","correct_statement":"内因是事物变化的根据，外因是条件，外因通过内因起作用。","incorrect_statement":"内因是变化根据，所以任何外部条件都没有实际作用。","explanation":"内部结构规定怎样回应作用，外部条件能显著影响实现过程；根据与条件不是重要与无用。","necessary_conditions_and_boundaries":"需固定研究对象，同一因素的内外归属可能随对象变化。","example_or_counterexample":"同一外部刺激作用于不同结构，可能产生不同结果。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.19","module_id":"M4","title":"内外因不能按空间死分","priority":"A","correct_statement":"内外因要依据所研究事物的边界和矛盾关系判断，不能只凭肉眼空间位置分类。","incorrect_statement":"某因素只要在身体或场地内部，就必然是研究对象的根本内因。","explanation":"物理位置不自动给出哲学分析中的对象边界和作用机制。","necessary_conditions_and_boundaries":"先定义研究对象，再看因素与其的关系。","example_or_counterexample":"一个团队内部的外来设备，未必因此就是其制度问题的根本根据。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.20","module_id":"M4","title":"矛盾转化的条件","priority":"B","correct_statement":"矛盾双方及主次关系可以在一定条件下转化，转化需要实际条件。","incorrect_statement":"矛盾双方既然能转化，就可以任意转化成任何互不相关的事物。","explanation":"可转化的是有具体关系的双方及其地位，不是取消事物性质和条件的随意变化。","necessary_conditions_and_boundaries":"不能用“转化”替代对机制与条件的说明。","example_or_counterexample":"优势与劣势的转换需要相关条件变化，不是改称呼即可实现。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M4.21","module_id":"M4","title":"三个方法论表述的对应","priority":"B","correct_statement":"一切从实际出发主要联系物质决定意识；具体问题具体分析主要联系矛盾特殊性；实事求是强调从客观实际出发探求并遵循客观规律。","incorrect_statement":"具体问题具体分析的直接理论依据是所有事物完全相同、没有特殊性。","explanation":"认识对象的不同特点，才能选择适当办法；共性指导不能取代个别分析。","necessary_conditions_and_boundaries":"三个表述有联系，但不可用单字机械替换或宣布彼此毫无关系。","example_or_counterexample":"同一原则用于不同地方，需要研究各自条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","C"]},{"id":"M5.01","module_id":"M5","title":"原因结果与先后相关","priority":"B","correct_statement":"因果关系的核心是引起与被引起，先后相继或同时变化本身不足以证明因果。","incorrect_statement":"只要一件事发生在另一件事之前，前者就是后者的原因。","explanation":"时间顺序可以是辨别因果的必要线索，但还需具体联系和作用机制。","necessary_conditions_and_boundaries":"排除共同原因、偶合及其他解释。","example_or_counterexample":"先打雷后接到电话，不证明雷声引起了来电。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.02","module_id":"M5","title":"因果转换与反馈","priority":"B","correct_statement":"一个结果可以在另一段联系中成为原因，反馈不等于颠倒同一具体因果关系。","incorrect_statement":"结果能反作用于原因，所以后发生的事件可以随意造成已经发生的过去事件。","explanation":"连续过程中的角色转换，与单一关系的方向不同。","necessary_conditions_and_boundaries":"固定同一对象、时间顺序与具体联系。","example_or_counterexample":"训练改善成绩，成绩又影响下一轮训练。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.03","module_id":"M5","title":"偶然性与有原因","priority":"B","correct_statement":"偶然事件可以有原因，有原因不等于它是所研究发展过程中的必然环节。","incorrect_statement":"凡能找到原因的事件都必然发生，偶然性只等于不知道原因。","explanation":"因果解释与事件在特定发展联系中的必然地位不是同一问题。","necessary_conditions_and_boundaries":"必然偶然需固定研究对象、关系和条件。","example_or_counterexample":"某次外部事故有成因，但不是每个生产过程必经的步骤。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.04","module_id":"M5","title":"必然性寓于偶然性","priority":"A","correct_statement":"必然趋势通过具体的偶然形式实现，不等于每个具体偶然事件都非发生不可。","incorrect_statement":"必然性通过偶然性表现，所以任何已经发生的偶然事件都必然只能这样发生。","explanation":"把总体趋势的实现与某个具体细节的唯一性等同，会滑向宿命论。","necessary_conditions_and_boundaries":"模型只能解释关系，不能用一次抽签证明所有历史规律。","example_or_counterexample":"正常完成随机抽一张票，必有一张被抽出，具体号码却不因此被预定。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.05","module_id":"M5","title":"必然偶然与频率重要性","priority":"A","correct_statement":"偶然性不等于无影响，必然性也不能只按发生次数或概率高低判断。","incorrect_statement":"偶然事件影响一定很小，次数多的现象就自动成为必然规律。","explanation":"在过程中的地位、具体影响大小和统计频率是不同维度。","necessary_conditions_and_boundaries":"相互转化需要条件或关系改变，不是机械积累次数。","example_or_counterexample":"一次偶发事件可能显著改变具体进程。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.06","module_id":"M5","title":"可能性与现实性","priority":"B","correct_statement":"可能性有现实根据但尚未实现，现实性指已经实际存在的状态。","incorrect_statement":"只要一个设想在脑中能够被想象，它就必然具有客观可能性。","explanation":"可以想象不等于有客观根据；可能也不等于已经发生。","necessary_conditions_and_boundaries":"对同一对象的同一状态固定时间条件。","example_or_counterexample":"现实中已完成的任务，又能为未来任务提供新的可能条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.07","module_id":"M5","title":"现实可能与抽象可能","priority":"A","correct_statement":"现实可能与抽象可能主要依据现实根据及必要条件是否具备区分。","incorrect_statement":"发生概率低的都是抽象可能，发生概率高的都是现实可能。","explanation":"条件是否具备与概率大小不是同一条分类轴；抽象可能仍需一定根据。","necessary_conditions_and_boundaries":"现实可能仍然没有实际实现；抽象可能不同于违背规律的幻想。","example_or_counterexample":"已纳入正常随机抽取的号码，即使中签率低也有现实可能。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.08","module_id":"M5","title":"可能转化与人的实践","priority":"B","correct_statement":"在人有目的的活动中，实践可以促使可能转为现实，但自然过程也有可能向现实的转化。","incorrect_statement":"任何可能转为现实都必须先有人类意识和人的实践参与。","explanation":"人的实践是人类实现目标的重要途径，不是全部自然变化的先决条件。","necessary_conditions_and_boundaries":"不能将人类活动中的方法论无限推广为宇宙条件。","example_or_counterexample":"自然界的过程不因无人参与就无法发生。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.09","module_id":"M5","title":"内容与形式","priority":"B","correct_statement":"内容是构成事物的要素和过程等，形式是其组织结构及表现方式。","incorrect_statement":"形式只指外观装饰，任何内部组织结构都不属于形式。","explanation":"形式既可外在表现，也包括内容要素怎样结合；不能将其缩成包装。","necessary_conditions_and_boundaries":"写作中的日常用法可能比哲学范畴窄。","example_or_counterexample":"文章的论证结构也涉及形式，不只修辞属于形式。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.10","module_id":"M5","title":"内容决定与形式反作用","priority":"B","correct_statement":"内容决定形式，形式有相对独立性并能反作用于内容。","incorrect_statement":"内容决定形式，所以同一内容只能有唯一一种表达和组织方式。","explanation":"决定关系不是一一映射，形式可以滞后、调整或采用不同实现方式。","necessary_conditions_and_boundaries":"形式是否适合内容影响作用方向。","example_or_counterexample":"同一研究结果可以用不同结构呈现，组织方式影响其发挥作用。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.11","module_id":"M5","title":"内容形式与本质现象","priority":"A","correct_statement":"内容形式着眼构成和组织，本质现象着眼内在根本性质和外在表现。","incorrect_statement":"内容完全等于本质，形式完全等于现象，两组词可以随意替换。","explanation":"全部要素与根本性质不同，组织结构与表面呈现也不同。","necessary_conditions_and_boundaries":"不要仅按“内外”两个字作一一对应。","example_or_counterexample":"列举文章全部素材，不等于已经指出其根本性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.12","module_id":"M5","title":"现象与本质的客观性","priority":"A","correct_statement":"现象与本质都属于事物自身的方面，不能把现象直接等同于主观感觉。","incorrect_statement":"只有本质是客观的，任何现象都只是人的主观想象。","explanation":"客观呈现与主体怎样感知是不同层次，现象可成为认识的对象。","necessary_conditions_and_boundaries":"本质相对稳定，不是永远不变。","example_or_counterexample":"观察记录要区分对象表现和观察者解释。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.13","module_id":"M5","title":"假象与错觉","priority":"A","correct_statement":"假象是具有迷惑性的客观现象，错觉是主体产生的错误知觉。","incorrect_statement":"假象和错觉都只是主观认识，与客观呈现没有区别。","explanation":"一种客观呈现可能诱发误认，但呈现与误认本身不是同一个对象。","necessary_conditions_and_boundaries":"错觉也可有客观诱因；客观不等于直接呈现全部真实结构。","example_or_counterexample":"水中直筷子的光学呈现有客观条件，误把实体知觉为弯曲属于主体一侧。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"],"review_note":"考场口径：插入水中的筷子看起来弯折，是光的折射形成的客观现象，属于假象；如果由此断定筷子真的弯了，是认识上的错误判断。杯弓蛇影、草木皆兵这类才是错觉。"},{"id":"M5.14","module_id":"M5","title":"假象仍表现本质","priority":"A","correct_statement":"假象仍以歪曲、颠倒的方式表现本质，并非与真实过程毫无联系。","incorrect_statement":"假象既然能误导人，就完全不表现本质，也没有研究价值。","explanation":"假象有产生机制，调查其条件和形成过程可以帮助认识真实关系。","necessary_conditions_and_boundaries":"“表现”不等于直接、完整、如实地展示。","example_or_counterexample":"佯动是实际作战活动的一部分，可通过调查识别其真实作用。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.15","module_id":"M5","title":"表现与反映的层次","priority":"B","correct_statement":"在本组规范表述中，现象表现本质，认识反映对象，二者说的是不同关系。","incorrect_statement":"现象就是人的认识，因此现象与本质的关系就是主体与客体的关系。","explanation":"前者是对象自身的层次关系，后者是认识主体对对象的关系。","necessary_conditions_and_boundaries":"不把这条术语辨析推广为禁止日常汉语使用“反映”一词。","example_or_counterexample":"现象可以被不同主体认识，不能因认识不同就说没有客观现象。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.16","module_id":"M5","title":"科学研究的必要与可能","priority":"B","correct_statement":"现象本质有区别使深入研究成为必要，二者有联系使由现象认识本质成为可能。","incorrect_statement":"现象与本质毫无关系，反而保证人可以通过现象认识本质。","explanation":"若完全一致则无需深入，若毫无联系则没有认识通路。","necessary_conditions_and_boundaries":"这是关系上的解释，不是断言观察一次就可掌握本质。","example_or_counterexample":"调查需要从可观察材料出发，再追究其形成机制。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.17","module_id":"M5","title":"客观与主观辩证法","priority":"A","correct_statement":"主观辩证法是思维中对客观辩证运动的反映，不能与主观唯心主义等同。","incorrect_statement":"主观辩证法因为发生在思维中，所以必然否认客观世界。","explanation":"存在于思维这一侧，与主张思维是世界本原，是不同问题。","necessary_conditions_and_boundaries":"不是所有个人意见都自动成为正确的主观辩证法。","example_or_counterexample":"研究对象在变化，思维也需要把握这种变化及其关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.18","module_id":"M5","title":"分析与综合","priority":"B","correct_statement":"分析分解对象的要素方面，综合在把握其联系的基础上形成整体认识。","incorrect_statement":"综合就是把互不相干的材料堆在一起，完全不必研究相互关系。","explanation":"综合需要恢复和理解联系，不是简单加总；分析为综合提供细化基础。","necessary_conditions_and_boundaries":"分解在思维中进行，不必真的拆毁对象。","example_or_counterexample":"分别研究产业人口交通，再考察它们的相互影响。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.19","module_id":"M5","title":"归纳与演绎","priority":"B","correct_statement":"教材常用个别到一般识别归纳、一般到个别识别演绎，可靠演绎还须前提真实与形式有效。","incorrect_statement":"只要推理是演绎形式，即使前提错误也必然保证结论正确。","explanation":"有效形式保证的是从真前提出发的保真关系，不能自动修复假前提。","necessary_conditions_and_boundaries":"严格逻辑中的演绎定义不限于方向口诀，本课不作过度概括。","example_or_counterexample":"从多个案例提炼共性与按一般规则判断一个案例，推理方向不同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M5.20","module_id":"M5","title":"两组思维方法不可互换","priority":"A","correct_statement":"分析综合着眼分解与联系，归纳演绎着眼一般与个别的推理，二者可以在研究中交叉使用。","incorrect_statement":"把一个对象分成三个方面研究，就已经必然完成了从个别到一般的归纳。","explanation":"分解对象不等于从样本概括普遍命题，不完全归纳也不能只凭若干正例保证无例外结论。","necessary_conditions_and_boundaries":"整理分类不自动是归纳，汇总材料不自动是综合。","example_or_counterexample":"分析多个案例之后再提炼共性，可以先分析后归纳。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","K","T"]},{"id":"M6.01","module_id":"M6","title":"认识本质与能动反映","priority":"A","correct_statement":"认识是在实践基础上主体对客体的能动反映，不是机械照相，也不是脱离客体的自生。","incorrect_statement":"主体会选择和加工材料，所以认识可以完全不受客体制约。","explanation":"加工是能动性，是否正确仍受对象约束；能动反映不能被偷换成任意建构。","necessary_conditions_and_boundaries":"反映与创造性不是非此即彼。","example_or_counterexample":"构造模型需要接受与对象关系的检验。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.02","module_id":"M6","title":"实践与纯思维","priority":"B","correct_statement":"实践是人能动改造客观世界的物质活动，纯粹在脑中设想不自动等于实践。","incorrect_statement":"只要人在认真思考，无论是否发生客观活动，都已经等同于实践。","explanation":"认识可指导实践并渗透实践，但两者概念仍有区别。","necessary_conditions_and_boundaries":"学习活动含多种成分，不能笼统宣布学习全部是或全不是实践。","example_or_counterexample":"在脑中构想实验与实际操作、测量，不是同一活动环节。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.03","module_id":"M6","title":"实践的基本形式","priority":"B","correct_statement":"实践的基本形式包括物质生产实践、社会政治实践和科学文化实践，科学实验属于科学文化实践。","incorrect_statement":"只有体力生产劳动才属于实践，科学实验不属于实践。","explanation":"实践不限于体力劳动；科学文化实践指具有现实物质活动性质的活动，不能把纯粹想象或逻辑推演一概归为实践。实验使用物质手段作用对象并产生现实结果。","necessary_conditions_and_boundaries":"物质生产是基础性的实践活动，不等于实践唯一形式。","example_or_counterexample":"测量、操作仪器和开展实验，不因目的是获得知识就失去实践性质。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"],"review_note":"实践的基本形式有两种口径，都算对：新版教材是物质生产实践、社会政治实践、科学文化实践；旧版是生产实践、处理社会关系的实践、科学实验。两种说法里，物质生产实践都是最基本的实践活动。"},{"id":"M6.04","module_id":"M6","title":"实践客观性与目的性","priority":"B","correct_statement":"实践的目的可以具有主观性，活动仍受客观对象、手段和条件制约。","incorrect_statement":"实践有目的有计划，所以它不具有客观物质性。","explanation":"目的与过程条件分别从主体和客体方面说明活动，两种性质并不冲突。","necessary_conditions_and_boundaries":"计划不能任意改变实际结果。","example_or_counterexample":"希望工程成功，不能替代真实的施工条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.05","module_id":"M6","title":"直接现实性与成功","priority":"B","correct_statement":"实践具有直接现实性，指它实际作用于现实，不保证预想目标必然实现。","incorrect_statement":"实践具有直接现实性，意味着只要付诸行动就一定成功。","explanation":"行动可以产生未预料结果或失败，仍然是真实发生的活动。","necessary_conditions_and_boundaries":"直接现实性与客观物质性相关但不是同一个词义。","example_or_counterexample":"失败实验同样对对象进行了现实操作。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.06","module_id":"M6","title":"实践的社会历史性","priority":"B","correct_statement":"单个人的实践也依赖社会积累和历史条件，不因独自操作就失去社会性。","incorrect_statement":"一个人独立完成实验，就说明该实践完全没有社会历史性。","explanation":"语言、仪器、知识和协作制度都有社会历史背景。","necessary_conditions_and_boundaries":"社会性不能简化成现场人数超过一人。","example_or_counterexample":"独自使用已有实验仪器，仍承接社会知识与技术。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.07","module_id":"M6","title":"认识来源与获得途径","priority":"A","correct_statement":"实践是认识的来源，直接经验与间接经验是个人获取知识的不同途径。","incorrect_statement":"个人从书上学到知识，就证明认识存在一个完全脱离实践的第二来源。","explanation":"个人传承知识的渠道与整个人类知识形成的基础，是不同层次。","necessary_conditions_and_boundaries":"理论可在已有知识上推导，不要求个人重做全部发现过程。","example_or_counterexample":"读教材获得前人实验研究的成果，属于间接经验。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.08","module_id":"M6","title":"认识来源与正确性","priority":"A","correct_statement":"来自实践的认识仍可能片面或错误，来源于实践不自动保证认识正确。","incorrect_statement":"只要某结论是在实践中形成的，它就不需要再接受检验。","explanation":"材料和经验要经过加工，条件判断、概括和推理可能出错。","necessary_conditions_and_boundaries":"来自实践与经过充分实践检验是不同表述。","example_or_counterexample":"一次经验被过度推广，可能形成错误的一般结论。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.09","module_id":"M6","title":"实践的来源与动力","priority":"A","correct_statement":"实践提供认识材料，也提出新问题、提供工具并推动认识发展，来源与动力各有侧重。","incorrect_statement":"实践是认识的动力，只是说材料从实践中来，不包括问题与工具的发展。","explanation":"来源强调形成基础，动力强调为何继续发展以及发展条件如何改善。","necessary_conditions_and_boundaries":"四种作用彼此联系，但不能把术语随意替换。","example_or_counterexample":"新实践难题推动研究，仪器改进使原先不能研究的问题进入视野。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.10","module_id":"M6","title":"认识任务与目的","priority":"B","correct_statement":"认识的根本任务是透过现象把握本质规律，根本目的是指导实践、改造世界。","incorrect_statement":"认识的根本目的只是形成理论，理论形成后与实践再无关系。","explanation":"认识阶段内部的深化目标，与整个认识活动的实践归宿不同。","necessary_conditions_and_boundaries":"不要求所有研究立即具有直接应用。","example_or_counterexample":"解释形成后仍需接受检验，并可能用于进一步行动。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.11","module_id":"M6","title":"感性理性与正确错误","priority":"A","correct_statement":"感性和理性区分认识层次，二者都可能正确或错误。","incorrect_statement":"理性认识处于高级阶段，所以理性认识一律正确。","explanation":"高级是抽象与深入的层次，不是对每个结论自动颁发正确证明。","necessary_conditions_and_boundaries":"不要把“理性”按日常“合理正确”的褒义理解。","example_or_counterexample":"用错误前提作抽象推理，仍可能得到错误解释。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.12","module_id":"M6","title":"感性认识三形式","priority":"A","correct_statement":"感觉、知觉、表象属于感性认识，表象可在对象不在眼前时再现具体形象。","incorrect_statement":"对象不在眼前时产生的任何脑中形象，都已经属于理性认识。","explanation":"是否当场呈现与是否抽象把握本质不是同一标准。","necessary_conditions_and_boundaries":"回忆具体形象不同于形成抽象概念。","example_or_counterexample":"闭眼回忆桥梁外形，仍可属于表象。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.13","module_id":"M6","title":"理性认识三形式","priority":"A","correct_statement":"概念、判断、推理属于理性认识的基本形式。","incorrect_statement":"表象、判断、推理都是理性认识，感觉和概念则属于感性认识。","explanation":"表象保留具体形象，概念通过抽象把握共同属性，分类依据不能颠倒。","necessary_conditions_and_boundaries":"名词记忆须联系实际含义。","example_or_counterexample":"对“桥”作概念界定，与回忆某座桥的颜色形状不同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.14","module_id":"M6","title":"感性与理性的统一","priority":"A","correct_statement":"理性依赖感性材料，感性有待深化为理性，二者相互渗透并统一于实践。","incorrect_statement":"感性阶段必须完全没有思考，理性阶段必须完全排除感性因素。","explanation":"真实认识不是两个密封箱，已有理解会影响观察，理论表达也依赖具体材料和语言。","necessary_conditions_and_boundaries":"相互渗透不等于取消层次区别。","example_or_counterexample":"掌握电路概念以后，更容易从图中注意到关键连接关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.15","module_id":"M6","title":"第一次认识飞跃","priority":"A","correct_statement":"在实践基础上从感性认识上升为理性认识是第一次认识飞跃；要获得正确理性认识，需要充分可靠的感性材料和科学的思维加工。","incorrect_statement":"感性材料只要积累得足够多，就会自动生成正确理论，无需思考加工。","explanation":"材料丰富与概括正确不同，零散印象需要分析、综合与抽象。","necessary_conditions_and_boundaries":"这里的正确性条件不能偷换成一切理性认识都已经正确。","example_or_counterexample":"大量案例若被错误归类，可能支持错误概括。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.16","module_id":"M6","title":"第二次认识飞跃","priority":"A","correct_statement":"认识回到实践能实现认识目的并检验、发展认识，因此第二次飞跃具有更重要的意义。","incorrect_statement":"第二次飞跃更重要，说明第一阶段形成认识可以完全省略。","explanation":"更重要说完成认识过程的功能，不是取消前提，也不是执行必然正确。","necessary_conditions_and_boundaries":"应用需要结合具体条件，不能机械照搬。","example_or_counterexample":"把方法用于新情境，可能暴露原先遗漏的限制。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.17","module_id":"M6","title":"认识反复性与原地循环","priority":"A","correct_statement":"认识可能多次经历实践与认识的往返，但可以保留成果并逐步深化。","incorrect_statement":"认识的反复性意味着每次都必须否定全部旧认识并回到零点。","explanation":"反复是过程特点，不是内容全部清空；真确内容可以被继承和发展。","necessary_conditions_and_boundaries":"复杂对象通常需要多次认识，不等于所有简单判断都无从确定。","example_or_counterexample":"修改一个错误条件，不必丢弃整个已验证的分析框架。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"],"review_note":"讲义定义：认识的反复性是指，人对于一个复杂事物的认识往往要经过由感性认识到理性认识、再由理性认识到实践的多次反复才能完成。考试常把它和无限性的定义对调。"},{"id":"M6.18","module_id":"M6","title":"认识无限性与具体确定性","priority":"A","correct_statement":"人类认识可以不断发展，某个具体问题仍可能在明确条件下获得可靠答案。","incorrect_statement":"认识没有最终终点，所以任何具体问题都永远不可能确定。","explanation":"整体认识的无限性与某些具体认识的确定性是不同层次。","necessary_conditions_and_boundaries":"每个人、每代人的认识又受实践和历史条件限制。","example_or_counterexample":"一道条件清楚的问题可以解决，之后仍会出现新问题。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"],"review_note":"讲义定义：认识的无限性是指，对于事物发展过程的推移来说，人类的认识是永无止境、无限发展的，表现为“实践、认识、再实践、再认识”循环往复以至无穷，每一循环都比较地进到了高一级的程度。"},{"id":"M6.19","module_id":"M6","title":"真理客观与形式主观","priority":"A","correct_statement":"真理属于认识，形式具有主观性，其正确内容及最终检验标准具有客观性。","incorrect_statement":"真理既然客观，就必然是一件不属于认识的物质物品。","explanation":"内容是否符合对象不由喜好决定；形式主观主要指真理以主体的概念、判断、推理等认识形式存在，不只是语言表达可以选择。","necessary_conditions_and_boundaries":"不要把认识的客观内容与物质本体混为一谈。","example_or_counterexample":"不同语言可表达相同关系，但这只是帮助理解主观形式的辅助例子。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.20","module_id":"M6","title":"真理一元性与多角度","priority":"A","correct_statement":"同一对象、同一条件、同一方面的相互矛盾判断，不能仅因主体不同就都是真理。","incorrect_statement":"不同人观点不同，因此对同一事实的互相否定判断都可以各自为真。","explanation":"客观性要求事实不能随立场改变；不同方面的多种正确认识并不冲突。","necessary_conditions_and_boundaries":"必须保留对象、条件和方面的限定。","example_or_counterexample":"对一座桥分别描述用途与结构可以都对，不是同一数值可随意取两个相冲突结果。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"],"review_note":"考场口径：真理是一元的——在同一条件下，对于特定的认识对象只有一个正确认识，不存在多元真理。“特定的认识对象”指同一对象的同一方面、同一层次；对同一事物不同方面的多个正确认识互不冲突。遇到“真理是一元的”这类教材原句要判正确。"},{"id":"M6.21","module_id":"M6","title":"真理绝对性与相对性","priority":"A","correct_statement":"同一真理既包含确定的客观正确内容，又具有范围、条件和认识程度的有限性。","incorrect_statement":"真理分为两种互斥类型，一种绝对真理完全不相对，另一种相对真理完全不绝对。","explanation":"两方面是同一真理的属性，不是把知识分成两个互不相交的仓库。","necessary_conditions_and_boundaries":"绝对性还指就认识本性而言，人类能够正确认识无限发展的物质世界；不能理解成某个具体认识已穷尽全部对象和条件。","example_or_counterexample":"已正确认识对象的一方面，不等于已经穷尽对象所有方面。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.22","module_id":"M6","title":"相对性不等于真假各半","priority":"B","correct_statement":"真理相对性强调正确认识的有限性，不等于没有客观正确内容或真假各半。","incorrect_statement":"任何真理都有相对性，所以都可以按个人喜好改成相反说法。","explanation":"范围有限不是真假任意，不能从尚未全面推出已知部分全无确定性。","necessary_conditions_and_boundaries":"理论整体可能含错误，但真理性内容不能由个人随意否定。","example_or_counterexample":"研究只覆盖条件C，不等于在C内的正确内容可以任意颠倒。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.23","module_id":"M6","title":"真理条件性与越界应用","priority":"A","correct_statement":"把在特定条件下成立的认识推广到不适用的条件，可能形成谬误。","incorrect_statement":"一项认识只要在一个条件下成立，就在所有条件下都必然成立。","explanation":"原来的限定命题与被扩大后的命题并非同一内容，扩张需要新的证据。","necessary_conditions_and_boundaries":"真理具体性要求与具体对象和历史条件相符合。","example_or_counterexample":"某方案对A类问题有效，不自动证明对B类问题有效。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.24","module_id":"M6","title":"真理与谬误的转换","priority":"A","correct_statement":"真理与谬误在一定条件下可以转化，但不能在对象条件完全不变时任意混同真假。","incorrect_statement":"承认真理谬误可以转化，就意味着同一命题在同一条件下既真又假。","explanation":"转换涉及适用条件、认识内容或纠错过程的变化，不是否定确定界限。","necessary_conditions_and_boundaries":"过去被当作真理的说法，不因曾被相信就必然是真理。","example_or_counterexample":"补上遗漏条件或纠正错误推理，可把原来的错误认识改正。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.25","module_id":"M6","title":"实践标准与逻辑证明","priority":"A","correct_statement":"实践是检验认识真理性的唯一标准，逻辑证明发挥重要作用但不能取代最终实践检验。","incorrect_statement":"只要理论内部逻辑一致，就无须检验其经验前提是否符合现实。","explanation":"形式一致不能自动保证经验前提真实，认识与现实的符合需通过实践考察。","necessary_conditions_and_boundaries":"不把这一命题粗暴改写成“数学证明没有价值”。","example_or_counterexample":"一个模型推导严密，还要研究它的假设是否适用于真实对象。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.26","module_id":"M6","title":"实践标准确定与不确定","priority":"A","correct_statement":"实践标准地位确定，具体实践受条件限制、检验能力可能不充分，二者可以统一。","incorrect_statement":"实践标准有不确定性，所以在任何时候都无法区分真理与谬误。","explanation":"检验范围有限不等于没有检验作用，也不允许改用权威作另一最终标准。","necessary_conditions_and_boundaries":"某个可靠反例可否定与它冲突的全称断言，不必无限等待。","example_or_counterexample":"一种工况通过测试，不能自动覆盖所有工况。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.27","module_id":"M6","title":"实践成功与整体证明","priority":"B","correct_statement":"一次成功只支持与其具体条件和检验范围相应的结论，不能自动证明整套解释全部正确。","incorrect_statement":"一个错误方法碰巧得到正确结果，就证明该方法的全部解释都是真理。","explanation":"结果与理由要分别分析，还要排除巧合、其他原因和适用条件遗漏。","necessary_conditions_and_boundaries":"失败也要辨明理论、条件和执行过程中的具体问题。","example_or_counterexample":"蒙对一个选项，不能证明错误推理成立。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M6.28","module_id":"M6","title":"真理评价与价值评价","priority":"A","correct_statement":"真理评价关心是否符合对象，价值评价关心对象对主体需要和发展的意义。","incorrect_statement":"某种说法对某人有用，就证明它所描述的事实一定真实。","explanation":"有益、有用与符合事实不是同一属性；价值评价也受客观属性和实际需要制约。","necessary_conditions_and_boundaries":"主体性不等于任意性，不把价值多样偷换成真假随意。","example_or_counterexample":"某种安慰让人高兴，不能仅凭效果证明其中事实判断正确。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","P","E"]},{"id":"M7.01","module_id":"M7","title":"社会存在与日常存在","priority":"B","correct_statement":"社会存在指社会物质生活条件，不能把社会里一切确实存在的观念都直接归为社会存在。","incorrect_statement":"某种思想在社会中确实有人相信，因此该思想本身就属于社会存在而非社会意识。","explanation":"这里的存在是专门范畴，与日常“有没有”不同；社会意识本身也确实存在，但分类上属于精神方面。","necessary_conditions_and_boundaries":"社会物质生活条件包括地理环境、人口因素和生产方式。","example_or_counterexample":"一种风俗观念确实流行，不等于观念本身成为物质生产方式。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.02","module_id":"M7","title":"生产方式与地理人口","priority":"B","correct_statement":"地理环境和人口因素影响社会发展，物质资料生产方式是社会历史发展的决定力量。","incorrect_statement":"一个社会的性质和历史形态完全由人口数量或地理位置决定。","explanation":"社会需要物质生活条件，但组织和进行生产的方式在社会结构变化中具有决定地位。","necessary_conditions_and_boundaries":"影响作用不等于决定社会形态的作用。","example_or_counterexample":"相近地理条件下可以出现不同社会制度，不能以地理单因解释全部历史。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.03","module_id":"M7","title":"生产方式的两个方面","priority":"B","correct_statement":"生产方式是生产力与生产关系的统一，不能把生产关系排除在社会存在之外。","incorrect_statement":"生产方式只包括机器技术，不包括人与人在生产中的关系。","explanation":"生产既涉及怎样利用自然，也涉及人们怎样结合并分配成果。","necessary_conditions_and_boundaries":"生产方式不等于生产资料。","example_or_counterexample":"同样使用某种设备，不代表所有制和分配关系相同。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.04","module_id":"M7","title":"社会存在决定与意识反作用","priority":"B","correct_statement":"社会存在决定社会意识，社会意识能通过实践反作用于社会存在。","incorrect_statement":"社会意识能够影响现实，就说明社会意识在根本关系上决定社会存在。","explanation":"能动反作用与本原、决定关系不同，不能因观念有效就倒置二者。","necessary_conditions_and_boundaries":"意识作用通过现实主体的实践实现。","example_or_counterexample":"改革理念指导行动，要依靠实际组织、资源和制度活动才能改变现实。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.05","module_id":"M7","title":"社会意识的不同步","priority":"A","correct_statement":"社会意识可落后或在一定程度上预见趋势，不能要求它与社会存在每一变化完全同步。","incorrect_statement":"社会存在发生变化后，所有社会观念都必须立即同时改变。","explanation":"观念有积累、惯性和预测能力，决定关系不是机械同步关系。","necessary_conditions_and_boundaries":"超前意识仍有现实根据，并非脱离存在凭空产生。","example_or_counterexample":"旧习惯可能在经济条件变化后继续存在。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.06","module_id":"M7","title":"经济水平与思想水平","priority":"B","correct_statement":"经济发展水平与某种思想文化发展水平不必机械一一对应。","incorrect_statement":"某地经济相对落后，就不可能出现任何领先的思想认识。","explanation":"社会意识有相对独立性，文化积累、交往和主体活动会影响具体认识的发展。","necessary_conditions_and_boundaries":"不能反过来否认社会意识的物质根源。","example_or_counterexample":"不能只按地区财富排名判断某个思想是否先进。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.07","module_id":"M7","title":"社会意识相对独立的表现","priority":"A","correct_statement":"社会意识具有历史继承、形式间相互影响和能动反作用，反作用是其相对独立性的突出表现。","incorrect_statement":"相对独立性意味着社会意识能够完全摆脱社会存在而独立决定历史。","explanation":"相对说明有自身发展特点，仍然以社会存在为基础；独立不是绝对自生。","necessary_conditions_and_boundaries":"与物质基础相联系又有自身规律。","example_or_counterexample":"哲学、道德和艺术可以互相影响，并承接过去的思想成果。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"],"review_note":"社会意识相对独立性的表现，教材列五项：与社会存在发展的不完全同步性；与社会经济发展水平的不平衡性；历史继承性；各种社会意识形式之间的相互作用和相互影响；对社会存在的能动反作用（这一项是突出表现）。本卡只写了后三项，多选题别漏选前两项。"},{"id":"M7.08","module_id":"M7","title":"社会意识与意识形态","priority":"A","correct_statement":"社会意识范围较广，不能把一切自然科学知识都直接判为服务特定经济基础的意识形态。","incorrect_statement":"凡属于社会意识的知识，都必然是具有特定阶级性的观念上层建筑。","explanation":"上层建筑意识形式与非上层建筑意识形式需要区分，研究内容与社会用途也不相同。","necessary_conditions_and_boundaries":"科学活动的制度组织可涉及上层建筑，不等于科学命题本身因阶级而变真或变假。","example_or_counterexample":"一项数学或自然科学关系，不因使用者阶级不同而自动改变真假。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"],"review_note":"考场口径：社会意识按与经济基础的关系分为意识形态和非意识形态。政治法律思想、道德、宗教、艺术、哲学等属于意识形态（观念上层建筑），有阶级性；自然科学、语言学、形式逻辑等属于非意识形态，不属于上层建筑，没有阶级性。"},{"id":"M7.09","module_id":"M7","title":"生产力与生产关系的对象","priority":"A","correct_statement":"生产力着眼人与自然的生产能力，生产关系着眼人与人在生产中的经济关系。","incorrect_statement":"生产关系就是人与自然的关系，生产力就是人与人之间的所有制关系。","explanation":"二者在同一生产过程中统一，但分析对象不同。","necessary_conditions_and_boundaries":"技术与制度可能共同变化，需看材料强调的具体内容。","example_or_counterexample":"机器改进与收益分配方式改变，通常分别侧重两种关系。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.10","module_id":"M7","title":"生产力基本要素","priority":"B","correct_statement":"劳动者、劳动资料、劳动对象是生产力基本要素，生产资料包括劳动资料和劳动对象。","incorrect_statement":"生产资料就是劳动者与劳动对象，不包括劳动资料。","explanation":"主体、工具条件、被加工对象各有位置；不能把劳动者列成生产资料的一部分。","necessary_conditions_and_boundaries":"劳动资料范围比生产工具更广。","example_or_counterexample":"工人、设备、原材料可分别帮助识别三类要素。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.11","module_id":"M7","title":"劳动对象与劳动资料","priority":"B","correct_statement":"劳动对象是劳动作用的对象，劳动资料是劳动者用来影响对象的物质条件。","incorrect_statement":"用于加工原材料的机器，与被加工的原材料在任何情况下都属于同一概念。","explanation":"分析岗位取决于它在具体劳动过程中的作用，不能只按物品名称永久分类。","necessary_conditions_and_boundaries":"同一物品在不同过程可有不同角色。","example_or_counterexample":"修理机器时机器可成为劳动对象，使用机器加工时它是劳动资料。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"],"review_note":"本卡的易错句“机器与原材料在任何情况下都属于同一概念”可以读成对的：二者都属于生产资料。这道判断题答案不唯一，已暂停自动出题。考场口径：生产资料包括劳动资料（如机器、工具）和劳动对象（如原材料）；同一物在不同劳动过程中可以分别充当劳动资料或劳动对象。"},{"id":"M7.12","module_id":"M7","title":"劳动者工具科技的定位","priority":"B","correct_statement":"劳动者是生产力中最活跃的因素，生产工具反映生产力水平，科学技术是第一生产力。","incorrect_statement":"科学技术是第一生产力，所以劳动者、工具和对象都不再是生产力的必要因素。","explanation":"三种定位分别说主体能动性、水平标志和科技作用，不能当作互相排斥的排名。","necessary_conditions_and_boundaries":"技术作用需与劳动者、资料和实际生产结合。","example_or_counterexample":"掌握知识与将知识转化为实际生产能力之间仍有实现条件。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.13","module_id":"M7","title":"生产关系三方面","priority":"A","correct_statement":"生产资料所有制关系、生产中的地位和相互关系、产品分配关系构成生产关系的主要方面。","incorrect_statement":"生产关系只指最终如何分配产品，与生产资料归谁占有无关。","explanation":"所有制关系是生产关系的基础，对生产中地位和分配方式具有重要规定作用。","necessary_conditions_and_boundaries":"不把生产关系缩成单一分钱环节。","example_or_counterexample":"同一种产品可以在不同所有制、组织和分配关系下生产。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.14","module_id":"M7","title":"生产关系的客观性","priority":"A","correct_statement":"生产关系由人参与形成和改变，但受生产力和现实条件制约，不由意志任意选择。","incorrect_statement":"生产关系需要人建立，所以人可以完全不顾生产力条件随意设定并保证有效。","explanation":"人为形成与主观任意不是一回事；制度是否可持续依赖实际物质条件。","necessary_conditions_and_boundaries":"改革有能动性，不等于抹除客观约束。","example_or_counterexample":"宣布某种分配办法，不会自动产生足够的可分配产品。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.15","module_id":"M7","title":"生产力决定与生产关系反作用","priority":"A","correct_statement":"生产力决定生产关系，适合生产力要求的生产关系促进生产力发展，不适合则阻碍。","incorrect_statement":"生产关系能反作用于生产力，因此生产关系在根本关系上决定生产力。","explanation":"制度调整可以释放能力，但这种作用仍以现实生产条件和发展要求为基础。","necessary_conditions_and_boundaries":"决定关系不是要求每次行动都严格先变技术再变制度。","example_or_counterexample":"先改革制度以释放潜能，不足以推翻生产力的决定作用。","example_status":"教学自拟示例或一般说明，不当作独立证明普遍哲学规律的证据","source_refs":["H","F","S","R","D","L"]},{"id":"M7.16","module_id":"M7","title":"经济基础不是经济实力","priority":"A","correct_statement":"经济基础指一定生产力发展阶段所决定的生产关系总和，不是GDP、货币财富或基础设施的同义词。","incorrect_statement":"经济基础就是一个地方拥有的资金总量和道路厂房总量。","explanation":"这是社会关系范畴，不是物质财富统计口径。","necessary_conditions_and_boundaries":"不要只凭“经济”“基础”日常语义分类。","exampl
