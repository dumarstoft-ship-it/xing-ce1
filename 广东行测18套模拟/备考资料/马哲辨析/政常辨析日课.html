教育引导（被替换的是：动作——制度约束换成了思想教育）。"},{"text":"主要体现不能腐，说明该市已完成不敢腐阶段、转入下一阶段","correct":false,"why":"错因：机制判断对了，但把三不腐“一体推进、相互促进”换成了依次完成的先后阶段，材料也没有任何“完成不敢腐”的信息（被替换的是：阶段）。"},{"text":"主要体现不能腐，通过制度约束减少权力寻租的机会","correct":true,"why":"电子化交易、随机抽取专家、关键岗位轮岗，都是从制度上压缩操控和寻租空间，最直接对应侧重制度约束的不能腐；这些措施同样可以与惩治、教育协同发挥作用。"}],"answer":"","fix":"","explain":"不敢腐侧重惩治震慑，不能腐侧重制度约束，不想腐侧重思想自觉，三者一体推进、相互促进。问“主要体现”时比较措施最直接的机制，但不能把三者理解成依次完成的流水线。","condition":"","refs":["T20","TPL5"],"origin":"自编","review":"","o":30,"t":1},{"id":"F-P3-07-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P3","cards":["P3-07","LAW-003"],"lead":"","stem":"结合党章和2026年二十届五中全会公报及全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，下列配对正确的是（）","opts":[{"text":"党的组织建设——统领党的各方面建设","correct":false,"why":"错因：把统领地位从党的政治建设换给了组织建设。组织建设很重要，但具有统领地位的是党的政治建设（被替换的是：主体）。"},{"text":"增强党性——全面从严治党的根本性任务","correct":true,"why":"二十届五中全会公报（2026年10月29日）明言“增强党性是全面从严治党的根本性任务”。"},{"text":"民主集中制——全党必须遵循的总规矩","correct":false,"why":"错因：把党章的定位安到了民主集中制上。党章是党的根本大法、全党必须遵循的总规矩；民主集中制是党的根本组织原则和领导制度（被替换的是：主体）。"},{"text":"党章——效力在国家宪法之上的根本大法","correct":false,"why":"错因：把党章在党内规范体系中的“根本大法”地位，抬到了国家宪法之上。宪法具有最高法律效力，党必须在宪法和法律的范围内活动（被替换的是：层级）。"}],"answer":"","fix":"","explain":"几个概念的角色固定、不能互换：党的政治建设具有统领地位；党章是党的根本大法、全党必须遵循的总规矩，这一地位限于党内规范体系；民主集中制是党的根本组织原则和领导制度；2026年五中全会公报强调增强党性是全面从严治党的根本性任务，全会《决定》另把学习、领悟、运用党的创新理论作为加强党性修养的根本途径，“根本性任务”与“根本途径”所指不同。","condition":"依据《中国共产党章程》（2022年修改）、二十届五中全会公报（2026年10月29日）及同日通过、11月1日全文公开的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（E-PT-05）；“宪法具有最高法律效力”依据《中华人民共和国立法法》（2023年修正）。","refs":["TPARTY","TPL5","TPL5DEC","LAW-S01","E-PT-05"],"origin":"自编","review":"","o":0,"t":1},{"id":"F-P3-08-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P3","cards":["P3-08"],"lead":"干部管理既要防止权力失控，也要防止干部因怕担责而不作为。","stem":"关于从严管理监督与激励干部担当作为，下列说法正确的有（）","opts":[{"text":"从严管理监督与激励担当作为应当结合起来，不能只强调其中一方面","correct":true,"why":"严管和激励相结合：只讲严管、只奖励“不出任何风险”，可能诱发不作为；只讲激励、一概免责，又会失去责任约束。"},{"text":"认定工作探索中的失误是否属于违纪违法，主要看造成的损失大小","correct":false,"why":"错因：把依据事实、性质、情节和规则综合判断，换成了只看损失大小（被替换的是：条件）。损失是事实的一部分，但是否违纪违法还要看性质、情节和是否违反明确的纪律法律规定。"},{"text":"追究责任应当依据事实、性质、情节和相关规则作出判断","correct":true,"why":"责任追究要依据事实、性质、情节和规则，这是区分工作探索中的失误与违纪违法的基础。"},{"text":"以改革为名突破明确的纪律和法律底线，不能因此获得免责","correct":true,"why":"鼓励担当不等于改革中的行为都免责，不能借改革名义突破明确的纪律法律底线。"}],"answer":"","fix":"","explain":"从严管理监督与激励担当作为应相结合。责任追究依据事实、性质、情节和规则：不能把工作探索中的一切失误都等同违纪违法，也不能借改革名义突破明确的纪律法律底线。本题只辨析一般原则，不涉及具体容错免责条件，也不据此判定真实案件。","condition":"","refs":["T20","TPL5"],"origin":"自编","review":"","o":184,"t":2},{"id":"F-P1-01-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P1","cards":["P1-01","P1-02","P1-05","P1-03"],"lead":"某市推进城中村改造时，先组织工作人员逐户走访，请居民说出最揪心的难题，梳理出消防通道不畅、雨污混流等几项突出问题；随后把产业转移、租户安置、历史建筑保护和交通组织放进同一个方案统筹设计，方案还吸收了不少居民提出的办法。","stem":"这一做法体现的“必须坚持”有（）","opts":[{"text":"必须坚持人民至上","correct":true,"why":"逐户听取居民诉求、吸收居民提出的办法，体现尊重人民主体地位和创造精神、从人民实践中获得认识与力量。"},{"text":"必须坚持问题导向","correct":true,"why":"从消防通道不畅、雨污混流等真实困难出发提出任务、寻找办法，体现问题导向。"},{"text":"必须坚持胸怀天下","correct":false,"why":"错因：把城市内部治理的材料对应到了“关注人类共同问题、推动共同发展”，材料不涉及国际合作或人类共同问题（被替换的是：层级——城市内部事务换成了人类共同问题）。"},{"text":"必须坚持系统观念","correct":true,"why":"把产业转移、租户安置、历史建筑保护和交通组织放进同一方案统筹，体现把对象置于联系中、统筹整体与局部的系统观念。"}],"answer":"","fix":"","explain":"六个必须坚持可以共同适用于同一件事，逐项判断要分别找材料依据：听取并吸收居民意见对应人民至上，从突出难题出发对应问题导向，统筹多方面关系对应系统观念；材料不涉及人类共同问题，不体现胸怀天下。“一个案例只能对应一项”是常见误区。","condition":"“六个必须坚持”以党的二十大报告（2022年）的表述为准。","refs":["T6","T20","TDEV"],"origin":"自编","review":"","o":1,"t":1},{"id":"F-P1-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P1","cards":["P1-02"],"lead":"","stem":"坚持人民至上，要求让发展成果由人民共享，人民群众是发展成果的接受者，而不是发展的实践主体。","opts":[],"answer":"错误","fix":"坚持人民至上，要求让发展成果由人民共享，人民群众既是发展成果的享有者，也是发展的实践主体。","explain":"错误。错因：只保留“成果接受者”，删去了人民群众“实践主体”的身份，割裂了为了人民和依靠人民（被替换的是：关系）。人民至上还包含尊重人民主体地位和创造精神、从人民实践中获得认识与力量，以人民为中心贯穿发展目的与发展过程。","condition":"","refs":["T20","TDEV"],"origin":"自编","review":"","o":31,"t":1},{"id":"F-P1-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P1","cards":["P1-03"],"lead":"","stem":"立足国情学习借鉴国外有益经验，与坚持自信自立并不矛盾；坚持胸怀天下、推动共同发展，也不意味着放弃本国立场和合法利益。","opts":[],"answer":"正确","fix":"","explain":"正确。自信自立要求立足国情、独立自主探索自己的道路，不等于封闭排外，判断关键在于是否结合自身条件作出选择，而不在于经验最初来自哪里；胸怀天下要求关注共同问题、推动共同发展，不等于放弃本国立场和合法利益。","condition":"","refs":["T20"],"origin":"自编","review":"","o":113,"t":1},{"id":"F-P1-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P1","cards":["P1-04"],"lead":"某街道推进基层治理改革，坚持党建引领、依法办事、为民服务的原则不变，同时把原来由多个部门分别受理的事项整合为“一窗通办”，并根据居民反馈不断调整办理流程。","stem":"对这一做法理解正确的是（）","opts":[{"text":"受理流程变了，说明守正的要求被突破，应恢复原有做法","correct":false,"why":"错因：把“必须坚持的根本方向、原则与立场”扩大成了每一项具体做法。受理流程是可以改进的实现方式，原则没有变（被替换的是：层级——具体做法换成了根本原则）。"},{"text":"坚持根本原则是前提和基础，流程整合是适应新实际的创新","correct":true,"why":"守正是坚持必须坚持的根本方向、原则与立场，是创新的前提和基础；创新是适应新的实际推进实践发展。材料中原则不变是守正，整合流程是创新。"},{"text":"这说明流程创新在先，守住原则是创新取得成效后的结果","correct":false,"why":"错因：把守正与创新的关系倒置。守正是创新的前提和基础，不是创新之后才出现的结果（被替换的是：关系）。"},{"text":"流程是新的，就说明改革方向正确，不必再接受检验","correct":false,"why":"错因：把“新”当成了天然正确，漏掉了“守住根本方向”这一前提（被替换的是：条件）。"}],"answer":"","fix":"","explain":"守正是坚持必须坚持的根本方向、原则与立场，是创新的前提和基础；创新是适应新的实际推进理论和实践发展。“正”不是过去的全部具体做法，“新”也不天然正确。","condition":"","refs":["T20","TSHOU"],"origin":"自编","review":"","o":66,"t":1},{"id":"F-P1-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P1","cards":["P1-05","P1-01"],"lead":"某县城区汛期经常内涝。该县在城区河段加高两岸堤防，并增设大功率泵站把积水快速排入河道，城区积水明显减少；但下游几个乡镇的洪峰水位随之抬高，受淹情况比往年更重。","stem":"从“六个必须坚持”看，该县做法最需要补上的是（）","opts":[{"text":"系统观念——把上下游放在联系中统筹考虑","correct":true,"why":"该县只顾城区一段，把排涝压力转移给下游，暴露的是统筹不足；系统观念要求把对象置于联系中，统筹整体与局部等关系。"},{"text":"问题导向——先找准城区内涝这一真实问题","correct":false,"why":"错因：该县已经从城区内涝这一真实问题出发，缺的不是“提出问题”，而是解决时的统筹（被替换的是：动作——统筹解决换成了找准问题）。问题导向本身在材料中已有体现。"},{"text":"胸怀天下——关注人类面临的共同问题","correct":false,"why":"错因：材料是县域内上下游关系，不涉及人类共同问题（被替换的是：层级）。"},{"text":"自信自立——立足国情独立自主探索道路","correct":false,"why":"错因：材料不涉及道路选择或借鉴外部经验，把与材料无关的原则当成了缺失项（被替换的是：关系）。"}],"answer":"","fix":"","explain":"问题导向回答“要解决什么问题”，系统观念回答“解决时会影响哪些方面、怎样统筹”，二者可以同时运用。该县问题找得准，但只顾城区一段、把代价转移给下游，最需要补的是系统观念。","condition":"“六个必须坚持”以党的二十大报告（2022年）的表述为准。","refs":["T20","T6"],"origin":"自编","review":"","o":5,"t":1},{"id":"F-P1-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P1","cards":["P1-06"],"lead":"","stem":"关于“两个确立”“两个维护”“两个结合”，下列表述正确的是（）","opts":[{"text":"“两个维护”与“两个确立”所指的两项对象一一相同，只是动词不同","correct":false,"why":"错因：把两组的对应关系机械复制。第一个确立与第一个维护对应同一核心地位，但第二个确立是思想的指导地位，第二个维护是党中央权威和集中统一领导（被替换的是：关系）。"},{"text":"“两个确立”的第二项是确立党中央权威和集中统一领导","correct":false,"why":"错因：把第二个“维护”的对象移给了第二个“确立”；第二个确立是确立习近平新时代中国特色社会主义思想的指导地位（被替换的是：关系——对应对象）。"},{"text":"“第一个结合”是马克思主义基本原理同中国具体实际相结合","correct":true,"why":"两个结合是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，前者即第一个结合。"},{"text":"“第二个结合”是马克思主义基本原理同世界优秀文明成果相结合","correct":false,"why":"错因：把结合对象“中华优秀传统文化”换成了“世界优秀文明成果”（被替换的是：关系——结合对象）。"}],"answer":"","fix":"","explain":"三个“两”回答不同问题：两个确立讲核心地位和指导思想的指导地位；两个维护讲核心地位和党中央权威、集中统一领导；两个结合讲马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合。第一个确立与第一个维护对应，第二项不能机械复制。","condition":"以党的二十大报告（2022年）等现行表述为准。","refs":["TPARTY","T20","TCULT"],"origin":"自编","review":"","o":19,"t":1},{"id":"F-P1-07-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P1","cards":["P1-07"],"lead":"学习新时代党的创新理论时，常会遇到几组带“四”字的概念。","stem":"下列关于“四个意识”“四个自信”“四个全面”的说法，正确的有（）","opts":[{"text":"四个意识是指政治意识、大局意识、核心意识、看齐意识","correct":true,"why":"四个意识强调政治自觉，即政治意识、大局意识、核心意识、看齐意识。"},{"text":"四个自信是指道路自信、理论自信、制度自信、历史自信","correct":false,"why":"错因：用相关的正面词“历史自信”替换了固定名称“文化自信”；四个自信是道路、理论、制度、文化（被替换的是：关系——把不属于该组的条目放进了四个自信）。"},{"text":"当前“四个全面”的第一项是全面建设社会主义现代化国家","correct":true,"why":"当前四个全面是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党；“全面建成小康社会”是此前阶段的表述。"},{"text":"“四个全面”与“四个意识”同属强调政治自觉的概念组","correct":false,"why":"错因：把战略布局和政治意识归成了同一类。四个全面属于战略布局，部署需要推进的战略任务；强调政治自觉的是四个意识（被替换的是：层级——概念类别）。"}],"answer":"","fix":"","explain":"三组带“四”的概念不是同一类清单：四个意识（政治、大局、核心、看齐）强调政治自觉；四个自信指向道路、理论、制度、文化；四个全面是战略布局，当前第一项是全面建设社会主义现代化国家，历史题提到全面建成小康社会时按当时语境判断。","condition":"以党的二十大报告（2022年）以来的现行表述为准；题干限定历史年代时按当时表述。","refs":["TPARTY","T20"],"origin":"自编","review":"","o":70,"t":1},{"id":"F-P1-08-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P1","cards":["P1-08","P1-07"],"lead":"","stem":"全面依法治国、全面从严治党都属于“四个全面”战略布局，生态文明建设则属于“五位一体”总体布局。","opts":[],"answer":"正确","fix":"","explain":"正确。五位一体总体布局涵盖经济建设、政治建设、文化建设、社会建设、生态文明建设；四个全面战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。常见错法是把生态文明建设移进四个全面，或因文化与生态相互影响就把生态文明建设并入文化建设。","condition":"以党的二十大报告（2022年）的现行表述为准。","refs":["T20","TPARTY"],"origin":"自编","review":"","o":157,"t":1},{"id":"F-P1-09-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P1","cards":["P1-09"],"lead":"","stem":"关于“十个明确”“十四个坚持”“十三个方面成就”和“六个必须坚持”，下列说法正确的是（）","opts":[{"text":"前三组概括了习近平新时代中国特色社会主义思想的主要内容","correct":true,"why":"十个明确、十四个坚持、十三个方面成就概括这一思想的主要内容。"},{"text":"新时代坚持和发展中国特色社会主义的基本方略，指的是“六个必须坚持”","correct":false,"why":"错因：把两套数量、层次和功能都不同的概括合并了。基本方略是十四个坚持，六个必须坚持体现贯穿其中的立场观点方法（被替换的是：层级）。"},{"text":"贯穿这一思想的立场观点方法，集中体现为“十四个坚持”","correct":false,"why":"错因：把六个必须坚持的定位换给了十四个坚持（被替换的是：主体）。"},{"text":"这四组概括分属四套各自独立、相互竞争的理论体系","correct":false,"why":"错因：把同一思想的不同概括说成了相互竞争的不同理论（被替换的是：关系）。四组都是对习近平新时代中国特色社会主义思想的概括，只是侧重不同。"}],"answer":"","fix":"","explain":"十个明确、十四个坚持、十三个方面成就概括这一思想的主要内容，六个必须坚持体现贯穿其中的立场观点方法。辅助理解：明确偏核心理论命题，坚持偏基本方略，成就偏实践展开与成果，六项偏世界观方法论；这种辅助概括不意味着各组内容毫无交叉。","condition":"“前三组概括主要内容”“六个必须坚持体现贯穿其中的立场观点方法”依据党的二十大报告（2022年）；“十四个坚持”构成新时代坚持和发展中国特色社会主义的基本方略，依据党的十九大报告（2017年）。","refs":["T20"],"origin":"自编","review":"","o":130,"t":1},{"id":"F-P1-10-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P1","cards":["P1-10"],"lead":"党的二十大报告概括了中国式现代化的中国特色。","stem":"下列理解正确的有（）","opts":[{"text":"全体人民共同富裕，意味着各地区、各群体要同步达到相同的收入水平","correct":false,"why":"错因：把共同富裕这一共同目标换成了同步、均等的收入结果；共同富裕允许合理差别、循序推进，反对两极分化（被替换的是：条件）。"},{"text":"人口规模巨大、人与自然和谐共生都属于中国式现代化的中国特色","correct":true,"why":"五个中国特色是：人口规模巨大，全体人民共同富裕，物质文明和精神文明相协调，人与自然和谐共生，走和平发展道路。"},{"text":"“实现高质量发展”是报告概括的中国式现代化五个中国特色之一","correct":false,"why":"错因：把另一张清单的内容放进了五个中国特色。五个中国特色中没有“实现高质量发展”，它出现在报告关于中国式现代化本质要求的表述中，两张清单不能混用（被替换的是：关系——清单归属）。"},{"text":"中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色","correct":true,"why":"中国式现代化是中国共产党领导的社会主义现代化，各国现代化的共同特征与中国特色相统一。"}],"answer":"","fix":"","explain":"五个中国特色：人口规模巨大；全体人民共同富裕；物质文明和精神文明相协调；人与自然和谐共生；走和平发展道路。它们与报告所列“本质要求”不是同一张清单；有中国特色也不意味着没有各国现代化的共同特征。","condition":"以党的二十大报告（2022年）为准。","refs":["T20"],"origin":"自编","review":"","o":18,"t":1},{"id":"F-P1-11-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P1","cards":["P1-11","P1-06"],"lead":"某市举办传统节庆活动时，对本地剪纸、醒狮等技艺进行系统整理，邀请青年设计师把传统纹样用于文创产品和城市公共空间设计；对旧俗中带有迷信色彩、铺张浪费的内容，则不再沿用。","stem":"这一做法最能体现的是（）","opts":[{"text":"把历史上存在过的习俗原样恢复，保持传统的完整面貌","correct":false,"why":"错因：遗漏了“优秀”这一限定和面向当代的转化发展；材料恰恰舍弃了带有迷信色彩、铺张浪费的旧俗（被替换的是：条件）。"},{"text":"以现代设计取代传统技艺，传统内涵不再保留","correct":false,"why":"错因：把“转化发展”换成了“取代”；材料先系统整理传统技艺，再创新运用，传统内涵得到保留（被替换的是：关系）。"},{"text":"马克思主义基本原理同中国具体实际相结合","correct":false,"why":"错因：这一表述本身是“第一个结合”的正确内容，但材料直接讲的是对传统文化的鉴别、转化和创新，用它概括材料，结合对象不对应，不是最能体现的选项（被替换的是：关系——结合对象）。"},{"text":"有鉴别地传承传统文化，推动创造性转化、创新性发展","correct":true,"why":"整理技艺并用于当代设计，是创造性转化、创新性发展；舍弃迷信和铺张的旧俗，是有鉴别地传承、古为今用。"}],"answer":"","fix":"","explain":"文化传承要推进创造性转化、创新性发展，坚持古为今用：传承的是中华优秀传统文化，不是历史上存在过的全部习俗制度；转化发展也不是用现代形式取代传统内涵。“最能体现”比的是材料侧重点。","condition":"依据2023年6月2日文化传承发展座谈会讲话及党的二十大报告（2022年）的表述。","refs":["TCULT","T20"],"origin":"自编","review":"","o":81,"t":1},{"id":"F-P1-12-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P1","cards":["P1-12"],"lead":"","stem":"中华文明突出的统一性与突出的包容性相互排斥，强调其中一方就会削弱另一方。","opts":[],"answer":"错误","fix":"中华文明突出的统一性与突出的包容性可以共同成立，并不相互排斥。","explain":"错误。错因：把可以共同成立的两种特性换成了此消彼长、相互排斥的关系（被替换的是：关系）。五个突出特性是连续性、创新性、统一性、包容性、和平性：统一性与包容性可以共同成立，包容也不等于取消自身文化主体；连续性不等于没有变化，创新性也不等于否定历史。","condition":"依据2023年6月2日文化传承发展座谈会讲话的表述。","refs":["TCULT"],"origin":"自编","review":"","o":116,"t":1},{"id":"F-P2-01-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P2","cards":["P2-01"],"lead":"","stem":"下列每项给出两组概念与内容的对应，两组都正确的是（）","opts":[{"text":"新发展阶段——向第二个百年奋斗目标进军的阶段；新发展格局——国内大循环为主体、国内国际双循环相互促进","correct":true,"why":"两组都对：新发展阶段回答历史方位，新发展格局回答国内国际循环的结构。"},{"text":"新发展理念——创新、协调、绿色、开放、共享的指导原则；新发展格局——全面建设社会主义现代化国家的首要任务","correct":false,"why":"错因：第二组把高质量发展的定位换给了新发展格局（替换的是对应关系）。“首要任务”说的是高质量发展；第一组本身正确。"},{"text":"新发展阶段——标志我国已经走出社会主义初级阶段；新发展理念——创新、协调、绿色、开放、共享的指导原则","correct":false,"why":"错因：第一组把初级阶段内部的新阶段说成越过了初级阶段（替换的是阶段）。新发展阶段是社会主义初级阶段中的一个阶段，不改变基本国情；第二组本身正确。"},{"text":"高质量发展——全面建设社会主义现代化国家的首要任务；新发展理念——国内大循环为主体、国内国际双循环相互促进","correct":false,"why":"错因：第二组把新发展格局的内容换给了新发展理念（替换的是对应关系）。双循环对应新发展格局；第一组本身正确。"}],"answer":"","fix":"","explain":"四个概念各回答一个问题：新发展阶段讲历史方位（全面建设社会主义现代化国家、向第二个百年奋斗目标进军，仍在社会主义初级阶段之中），新发展理念讲指导原则（创新、协调、绿色、开放、共享），新发展格局讲循环结构（国内大循环为主体、国内国际双循环相互促进），高质量发展是全面建设社会主义现代化国家的首要任务。不能因为都带“发展”二字就互换。","condition":"","refs":["T20","TDEV"],"origin":"自编","review":"","o":76,"t":1},{"id":"F-P2-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P2","cards":["P2-02"],"lead":"某市针对县域与中心城区发展差距较大的问题，没有把重点放在向农村增发补贴上，而是让县城产业园承接中心城区外溢的配套环节，乡镇发展农产品初加工，中心城区为县域提供设计、物流和销售渠道，使城乡之间、产业之间形成相互带动的分工。","stem":"这一做法最直接体现的发展理念是（）","opts":[{"text":"共享发展","correct":false,"why":"错因：把材料强调的“城乡、产业之间能否相互促进”换成了“发展成果如何分配”（替换的是关系）。共享注重社会公平正义，侧重成果更公平地惠及群众，而材料明确不以增发补贴为重点。这不等于该做法与共享无关，只是不是最直接的体现。"},{"text":"开放发展","correct":false,"why":"错因：把市域内部的结构关系换成了内外联动（替换的是关系）。开放注重发展内外联动，材料没有涉及国内与国际的联动。"},{"text":"协调发展","correct":true,"why":"协调注重解决发展不平衡问题。材料针对县域与中心城区的差距，着眼于城乡之间、产业之间相互带动，正是协调发展的侧重点。"},{"text":"创新发展","correct":false,"why":"错因：把结构关系问题换成了发展动力问题（替换的是关系）。创新注重发展动力，材料的着力点不是靠技术、制度或管理创新形成新动力，而是调整城乡和产业之间的分工。"}],"answer":"","fix":"","explain":"五大发展理念各有侧重：创新注重发展动力，协调注重发展不平衡，绿色注重人与自然和谐共生，开放注重发展内外联动，共享注重社会公平正义。判断“最直接体现”要看材料强调的是哪一类问题，不能一见“农村”“城乡”就选共享；五者相互联系，要完整、准确、全面贯彻。","condition":"","refs":["TDEV","T20"],"origin":"自编","review":"","o":159,"t":1},{"id":"F-P2-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P2","cards":["P2-03"],"lead":"某沿海省份研究如何更好服务和融入新发展格局，会上出现以下几种观点。","stem":"其中符合新发展格局要求的有（）","opts":[{"text":"扩大省内居民消费、打通产业链上下游的供需堵点，同时稳住外贸外资，让国内国际两个市场都发挥作用、相互促进","correct":true,"why":"以国内大循环为主体、国内国际双循环相互促进：既重视国内市场和供需衔接，又坚持高水平对外开放。"},{"text":"既然以国内大循环为主体，就应把压缩进出口和引进外资规模作为畅通循环的主要抓手","correct":false,"why":"错因：把“主体”换成了“封闭”（替换的是国内循环与国际循环的关系）。以国内大循环为主体并不排斥国际循环，仍要坚持高水平对外开放。"},{"text":"为畅通国内大循环，本省应在各主要产业链上建成不依赖外省的配套，减少从外省采购","correct":false,"why":"错因：把全国层面的大循环换成了各省自给自足的小循环（替换的是层级）。地方自成体系、减少跨省采购会割裂全国大市场，反而妨碍国内大循环；应在统一规则下发挥比较优势、分工协作。"},{"text":"增强关键环节的自主发展能力，同时继续利用国际技术合作和要素流动","correct":true,"why":"新发展格局强调自主发展能力，但不是关起门来搞循环，国际市场、技术合作和要素流动仍有价值。"}],"answer":"","fix":"","explain":"新发展格局以国内大循环为主体、国内国际双循环相互促进：强调国内市场、供需衔接和自主发展能力，同时坚持高水平对外开放。它是全国层面的循环，既不能理解为对外封闭，也不能分割成各地自给自足的小循环。","condition":"","refs":["T20","TMARKET"],"origin":"自编","review":""},{"id":"F-P2-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P2","cards":["P2-04"],"lead":"","stem":"推动高质量发展，既要实现质的有效提升，也要实现量的合理增长，并把发展经济的着力点放在数字经济上。","opts":[],"answer":"错误","fix":"推动高质量发展，既要实现质的有效提升，也要实现量的合理增长，并把发展经济的着力点放在实体经济上。","explain":"错在“数字经济”：把实体经济的政策定位换给了与之相关的一个领域（替换的是关系：数字经济是赋能实体经济，不是着力点本身）。固定表述是把发展经济的着力点放在实体经济上，数字经济是赋能实体经济的重要方向。前半句没有错：质量优先不等于不要数量，要的是质的有效提升和量的合理增长。实体经济也不只等于有形产品制造，研发设计、工业软件、物流等服务同样直接支撑生产。","condition":"依据党的二十大报告（2022年）和国家十五五规划纲要（2026年3月批准）中的表述","refs":["T20","T15"],"origin":"自编","review":"","o":51,"t":1},{"id":"F-P2-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P2","cards":["P2-05"],"lead":"甲企业是一家老牌纺织厂，通过工艺数字化改造和生产要素重新配置，在投入基本不变的情况下，产品质量和生产效率大幅提高。乙企业把名称改为“某某智能科技”，又新增了几条与原来相同的生产线，单位投入的产出没有变化。","stem":"依据新质生产力的核心标志，下列判断正确的是（）","opts":[{"text":"乙企业更接近新质生产力，因为新名称代表了新的产业方向","correct":false,"why":"错因：把企业名称、行业标签当成了判断标准（替换的是条件：判断标准）。核心标志是全要素生产率大幅提升，乙企业单位投入的产出没有变化。"},{"text":"甲企业更接近新质生产力，因为其全要素生产率大幅提升","correct":true,"why":"新质生产力以全要素生产率大幅提升为核心标志。甲企业投入基本不变而质量和效率大幅提高，符合这一标志。"},{"text":"两家企业都接近新质生产力，因为都扩大或改造了生产能力","correct":false,"why":"错因：把设备数量的扩张等同于效率的跃升（替换的是条件）。乙企业只是增加同类生产线，单位产出没有变化，单纯扩大设备数量不足以形成新质生产力。"},{"text":"两家企业都不接近，因为纺织属于传统产业，智能只是名称","correct":false,"why":"错因：把传统产业排除在新质生产力的载体之外（替换的是主体：可以成为载体的产业范围）。传统产业经改造提升也可以成为载体，关键看生产能力和效率是否跃升。"}],"answer":"","fix":"","explain":"新质生产力是创新起主导作用、具有高科技高效能高质量特征的先进生产力质态，以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先进生产力。判断时看生产能力和效率发生了什么变化，不看企业名称里有没有新词，也不因属于传统行业就排除。","condition":"依据习近平2024年1月31日讲话（TNEWQ）和中共中央、国务院《关于发展新质生产力的意见》（新华社2026年10月9日受权发布，E-DB-01）中“以全要素生产率大幅提升为核心标志”的表述；材料为自编情境。","refs":["TNEWQ","TNEW26","E-DB-01"],"origin":"自编","review":"","o":4,"t":1},{"id":"F-P2-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P2","cards":["P2-06"],"lead":"","stem":"发展新质生产力要因地制宜，兼顾传统产业改造、新兴产业壮大和未来产业培育，做到先破后立。","opts":[],"answer":"错误","fix":"发展新质生产力要因地制宜，兼顾传统产业改造、新兴产业壮大和未来产业培育，做到先立后破。","explain":"错在“先破后立”，把顺序颠倒了（替换的是阶段顺序）。应当先立后破：在改造提升传统产业、培育新动能中平稳转型，不能先关停传统产业再等新产业补位。前半句正确：要兼顾传统产业改造、新兴产业壮大、未来产业培育，传统产业不能一概视为落后产能；因地制宜也不要求各地同建一套热门产业，更不意味着可以不顾统一市场规则设置进入壁垒。","condition":"","refs":["TNEW26","TMARKET"],"origin":"自编","review":"","o":37,"t":1},{"id":"F-P2-07-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P2","cards":["P2-07"],"lead":"某大学实验室研制出一种新型电池材料样品，准备与一家企业合作，把成果推向生产。","stem":"关于这一过程，下列说法正确的有（）","opts":[{"text":"中试是把试制阶段的新产品转向生产过程的过渡性试验，是成果产业化的重要环节","correct":true,"why":"这是中试的定位：实验室证明能做出来，中试进一步检验工艺、设备、质量和成本等走向生产的条件。"},{"text":"样品在实验室制备成功，就表明可以直接进入规模化生产，中试环节可以省去","correct":false,"why":"错因：把技术上做得出来与工程上能稳定、规模化生产混为一个阶段（替换的是阶段）。中试正是验证走向生产的技术工艺等条件的环节。"},{"text":"强化企业科技创新主体地位，并不意味着高校从此不再承担基础研究","correct":true,"why":"企业是科技创新主体，不等于所有科研只能由企业承担；把主体地位理解成排他垄断是错的。"},{"text":"推动科技创新和产业创新深度融合，需要高校、科研院所和企业按各自功能分工协同","correct":true,"why":"科技创新与产业创新应深度融合，各类创新主体按功能分工协同、相互补充。"}],"answer":"","fix":"","explain":"科技创新与产业创新要深度融合。中试是把试制阶段的新产品转向生产过程的过渡性试验，是成果产业化的重要环节：样品成功不等于能够规模化生产，完成中试也不等于保证市场需求和商业成功。强化企业科技创新主体地位，不等于其他创新主体退出。","condition":"","refs":["TMID","TNEW26"],"origin":"自编","review":"","o":118,"t":1},{"id":"F-P2-08-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P2","cards":["P2-08"],"lead":"党的二十大报告把教育、科技、人才放在一起部署。","stem":"关于教育、科技、人才，下列说法正确的有（）","opts":[{"text":"科技是第一生产力，人才是第一动力，创新是第一资源","correct":false,"why":"错因：把人才和创新的角色对调了（替换的是对应关系）。应为科技是第一生产力、人才是第一资源、创新是第一动力。"},{"text":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑","correct":true,"why":"党的二十大报告的稳定表述，强调三者共同支撑现代化建设。"},{"text":"看到“人才是基础、教育是根本”的说法，不必核对出处即可判定为错误","correct":false,"why":"错因：把一份材料的措辞当成了唯一标准（替换的是条件：省去了“先限定文件”）。教育部2025年11月的权威文章就写“科技是关键、人才是基础、教育是根本”，与《辅导百问》第44问措辞不同，两种都有依据，要先看题干限定的是哪份文件。"},{"text":"按《党的二十大报告学习辅导百问》第44问的表述，教育是基础，科技是关键，人才是根本","correct":true,"why":"题干限定了文件，这就是该文件的措辞。若换成教育部2025年11月的文章，措辞是“科技是关键、人才是基础、教育是根本”。"}],"answer":"","fix":"","explain":"稳定记忆：科技是第一生产力，人才是第一资源，创新是第一动力；教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。“基础、关键、根本”有两种权威措辞：《辅导百问》第44问为教育是基础、科技是关键、人才是根本；教育部2025年11月文章为科技是关键、人才是基础、教育是根本。不限定文件时，不判这类措辞的对错。","condition":"三个“第一”和“基础性、战略性支撑”依据党的二十大报告（2022年10月16日）；“基础、关键、根本”只在限定文件时判断：《党的二十大报告学习辅导百问》第44问，教育部《开栏的话：强化教育对科技和人才的支撑作用》（2025年11月18日）","refs":["TEDU","TEDU25","T20"],"origin":"自编","review":"","o":166,"t":2},{"id":"F-P2-09-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P2","cards":["P2-09"],"lead":"某市讨论如何处理政府与市场的关系，形成了四种方案。","stem":"最符合“市场在资源配置中起决定性作用，更好发挥政府作用”要求的是（）","opts":[{"text":"由市政府统一确定辖区内企业的产品种类、产量和销售价格，以避免市场波动","correct":false,"why":"错因：让政府代替经营主体作微观经营决策（替换的是决策主体）。政府应通过制度规则、公共服务、监管、宏观调控履职，而不是替企业定产定价。"},{"text":"完善公平竞争规则和产权保护，加强质量安全监管，企业的产销和定价由企业依法自主决定","correct":true,"why":"资源配置由市场起决定性作用、企业自主经营，政府通过规则、监管和公共服务更好履职，体现有效市场和有为政府相结合。"},{"text":"既然市场起决定性作用，政府就应退出监管和公共服务，外部性问题交给企业自行解决","correct":false,"why":"错因：把“市场起决定性作用”推成政府完全退出（替换的是政府与市场的关系）。公共产品、外部性和公平竞争需要政府依法提供制度保障。"},{"text":"既然政府承担公共目标，一般性生产要素也应主要由政府按计划分配给企业","correct":false,"why":"错因：把政府的必要作用与市场的决定性作用倒置（替换的是起决定性作用的主体）。一般资源配置由市场起决定性作用。"}],"answer":"","fix":"","explain":"市场在资源配置中起决定性作用，更好发挥政府作用，有效市场和有为政府相结合。政府的作用不按“干预越多越好”衡量，也不是完全退出，而是看措施是否补足公共职能、是否维护公平竞争。","condition":"","refs":["T20","T15","TMARKET"],"origin":"自编","review":""},{"id":"F-P2-10-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P2","cards":["P2-10"],"lead":"","stem":"建设全国统一大市场，重在统一市场基础制度规则、破除地方保护和市场分割，并不要求各地的产业结构和商品价格完全相同。","opts":[],"answer":"正确","fix":"","explain":"正确。统一大市场统一的是市场基础制度规则，目的是促进要素、商品、服务畅通流动和公平竞争；统一不是抹平差别，各地可以在公平规则下发挥不同的产业优势，价格在公平透明的规则下依法形成。常见错法是把“统一规则”换成“统一价格”“统一产业结构”，或把政府采购中限定本地注册企业说成有利于统一市场。","condition":"依据《中共中央 国务院关于加快建设全国统一大市场的意见》（2022年）","refs":["TMARKET"],"origin":"自编","review":""},{"id":"F-P2-11-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P2","cards":["P2-11"],"lead":"某市设立产业投资基金，支持研发周期较长的早期科技项目；同时加大托育、职业技能培训和基层医疗投入。","stem":"下列理解正确的有（）","opts":[{"text":"耐心资本强调与较长的创新和成长周期相匹配的长期稳定资金支持","correct":true,"why":"耐心资本解决的是资金期限与创新、成长周期不匹配的问题。"},{"text":"耐心资本也要考虑回报和风险，可以按项目周期和约定合理安排退出","correct":true,"why":"长期支持不等于永久锁定，也不等于不计回报和风险。"},{"text":"投资于人重视人的能力、健康和发展，可以与投资于物相结合","correct":true,"why":"托育、技能培训、基层医疗直接关系人的能力和健康；建设设施是物的投入，也要关注服务和能力的质量，两者可以结合。"},{"text":"耐心资本限于财政资金，追求回报的社会资本不属于耐心资本","correct":false,"why":"错因：把耐心资本的来源限定为财政资金（替换的是主体范围）。耐心资本不限于财政资金，关键在资金期限与创新周期相匹配。"}],"answer":"","fix":"","explain":"耐心资本强调与较长创新和成长周期相匹配的长期稳定资金支持，不等于不考虑回报、风险或退出，也不限于财政资金。投资于人重视人的能力、健康、发展与公共服务，人的福祉本身就有目标价值，可以与投资于物相结合。","condition":"","refs":["TPAT","T15","TPEOPLEINV"],"origin":"自编","review":"","o":105,"t":1},{"id":"F-P2-12-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P2","cards":["P2-12"],"lead":"","stem":"国家十五五规划纲要的指导思想中，以经济建设为中心，以推动高质量发展为主题，以改革创新为根本目的，以全面从严治党为根本保障。","opts":[],"answer":"错误","fix":"国家十五五规划纲要的指导思想中，以经济建设为中心，以推动高质量发展为主题，以改革创新为根本动力，以全面从严治党为根本保障。","explain":"错在“根本目的”：把改革创新从动力位置换到了目的位置（替换的是关系）。十五五规划纲要指导思想中，以经济建设为中心，以推动高质量发展为主题，以改革创新为根本动力，以满足人民日益增长的美好生活需要为根本目的，以全面从严治党为根本保障。中心、主题、动力、目的、保障不是同义词，不能凭语感互换。","condition":"限定为国家十五五规划纲要（2026年3月12日十四届全国人大四次会议批准）指导思想中的表述，不外推到所有文件","refs":["T15","E-DB-01"],"origin":"自编","review":"","o":7,"t":1},{"id":"F-P2-13-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P2","cards":["P2-13"],"lead":"某市（自编算例，非真实统计数据）一年内地区生产总值增长8%，单位地区生产总值二氧化碳排放（碳排放强度）下降5%。","stem":"据此，下列判断正确的是（）","opts":[{"text":"该市碳排放总量下降5%，降幅与碳排放强度相同","correct":false,"why":"错因：把比值指标当成了总量指标，遗漏了经济规模的变化（替换的是关系：强度与总量的关系）。总量=GDP×强度，不能直接套用强度降幅。"},{"text":"该市碳排放总量已经下降，说明已经实现碳达峰","correct":false,"why":"错因：把强度下降当成总量下降，又把一年的变化当成达峰（替换的是关系和阶段）。按1.08×0.95计算，总量其实是增加的；碳达峰关注排放总量达到峰值后逐步下降。"},{"text":"强度下降说明该市人为排放与吸收已经平衡，实现了碳中和","correct":false,"why":"错因：把强度下降当成了碳中和的标准（替换的是条件）。碳中和关注人为排放与清除、吸收之间的平衡；强度下降连总量下降都证明不了。"},{"text":"该市碳排放总量约增加2.6%，强度下降不等于总量下降","correct":true,"why":"总量变为原来的1.08×0.95=1.026倍，约增加2.6%。强度是比值，总量还受经济规模影响。"}],"answer":"","fix":"","explain":"碳排放强度通常指单位GDP的二氧化碳排放，是比值；排放总量=GDP×强度。本题1.08×0.95=1.026，总量约增加2.6%。碳达峰关注排放总量达到峰值后逐步下降；碳中和关注人为排放与清除、吸收之间的平衡，不是社会活动从此完全没有排放。","condition":"算例数据为自编，不是历史统计数据","refs":["GCARBDEF","GCARBON"],"origin":"自编","review":"","o":182,"t":2},{"id":"F-P2-14-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P2","cards":["P2-14"],"lead":"","stem":"按照碳排放双控制度的分阶段安排，十五五时期以强度控制为主、总量控制为辅，碳达峰后转为以总量控制为主、强度控制为辅。","opts":[],"answer":"正确","fix":"","explain":"正确。碳排放双控分阶段安排主次：十五五时期以强度控制为主、总量控制为辅；碳达峰后以总量控制为主、强度控制为辅。常见错法是把两个阶段说成相同，或把主次颠倒。积极稳妥推进双碳还要先立后破，统筹能源安全、经济发展和群众正常生活，避免运动式减碳和不分条件一刀切。","condition":"依据国务院办公厅2024年印发的《加快构建碳排放双控制度体系工作方案》和2026年7月印发的《十五五碳达峰行动方案》","refs":["GCARBON","GPEAK26"],"origin":"自编","review":"","o":95,"t":1},{"id":"F-P2-15-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P2","cards":["P2-15"],"lead":"某缺水城市先测算本地水资源承载能力，据此确定新增工业项目的规模；政府核定企业用水定额，同时开展水权交易、实行超定额累进加价，引导企业节水。","stem":"对这一做法的分析，正确的是（）","opts":[{"text":"按承载能力确定项目规模体现以水定产；定额管理与水权交易、累进加价并用，体现政府和市场两手发力","correct":true,"why":"以水定产是以水资源承载能力约束产业布局和规模；两手发力指政府作用和市场机制共同发挥，材料中政府核定定额与交易、价格机制并用。"},{"text":"按承载能力确定项目规模体现以水定产；定额管理与水权交易、累进加价并用，体现地表水和地下水两手发力","correct":false,"why":"错因：把两手发力中的政府与市场换成了地表水与地下水（替换的是关系：把治理机制换成了水体分类）。"},{"text":"水权交易和超定额累进加价运用市场和价格机制，与“节水优先”的治水思路相互冲突","correct":false,"why":"错因：把相互配合的两项要求说成相互冲突（替换的是关系）。节水优先与两手发力同属治水思路，交易和价格机制正是用来促进节水的。"},{"text":"按以水定产的要求，应先确定理想的产业规模，再按需要寻找足够的新水源","correct":false,"why":"错因：把承载能力的约束倒置为需求无限刚性（替换的是关系方向）。以水定产是在水资源条件下安排发展规模，并节约集约利用。"}],"answer":"","fix":"","explain":"治水思路是节水优先、空间均衡、系统治理、两手发力；四水四定是以水定城、以水定地、以水定人、以水定产，强调以水资源承载能力约束布局和规模。两手发力指政府和市场作用共同发挥，不是指地表水和地下水。","condition":"依据2023年《关于进一步加强水资源节约集约利用的意见》及水利部发展研究中心对“两手发力”的释义","refs":["GWATER","GWATER2"],"origin":"自编","review":"","o":192,"t":2},{"id":"F-P2-16-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P2","cards":["P2-16"],"lead":"2025年10月党的二十届四中全会通过的《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，分别列举了要优化提升的传统产业、要培育壮大的新兴产业和未来产业。","stem":"关于这份《建议》中的产业列举，下列说法正确的有（）","opts":[{"text":"按该《建议》，新能源、低空经济见于未来产业部分","correct":false,"why":"错因：把新兴产业的项目放进了未来产业（替换的是对应关系）。按该《建议》，新能源、新材料、航空航天、低空经济等见于新兴产业。"},{"text":"按该《建议》，纺织、机械见于传统产业优化提升部分","correct":true,"why":"按该《建议》，船舶、纺织、机械等见于传统产业优化提升。"},{"text":"纺织列在传统产业部分，说明纺织企业难以形成新质生产力","correct":false,"why":"错因：把文件中的政策分类扩大成了对企业技术和效率的结论（替换的是层级：从文件分类推到具体企业）。传统不等于落后，传统产业可以通过深度转型形成先进生产力。"},{"text":"按该《建议》，脑机接口、第六代移动通信见于未来产业部分","correct":true,"why":"按该《建议》，量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等见于未来产业。"}],"answer":"","fix":"","explain":"按2025年国家十五五《建议》：船舶、纺织、机械等见于传统产业优化提升；新能源、新材料、航空航天、低空经济等见于新兴产业；量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信等见于未来产业。这张表只用于该文件，不代替别的文件分类（广东文件对生物制造的列法另见GD-004）；传统不等于落后，新兴不等于已经高效，未来也不等于现在完全没有产品。","condition":"仅适用于2025年10月23日党的二十届四中全会通过的《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》中的列举，不代替其他国家或地方文件的分类","refs":["G15SUG","TNEW26"],"origin":"自编","review":"","o":15,"t":1},{"id":"F-P4-01-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P4","cards":["P4-01"],"lead":"","stem":"社会主义制度是我国的根本制度，人民代表大会制度是我国的根本政治制度，中国共产党领导的多党合作和政治协商制度也是我国的根本政治制度。","opts":[],"answer":"错误","fix":"社会主义制度是我国的根本制度，人民代表大会制度是我国的根本政治制度，中国共产党领导的多党合作和政治协商制度是我国的基本政治制度。","explain":"错在把多党合作和政治协商制度归为“根本政治制度”（替换的是层级）。社会主义制度是根本制度；人民代表大会制度是根本政治制度，也是我国的政体；中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度是基本政治制度。国体是人民民主专政。","condition":"依据《中华人民共和国宪法》（2018年修正文本）及党的二十大报告的制度表述","refs":["ICONST","T20"],"origin":"自编","review":"","o":101,"t":1},{"id":"F-P4-02-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-02"],"lead":"新闻中常见“二十届四中全会”“十四届全国人大四次会议”这类会议名称。","stem":"对这两个名称的理解，正确的是（）","opts":[{"text":"前者是党的第二十四次全国代表大会，后者仍处在第十四届全国人大的任期之内","correct":false,"why":"错因：把届内全会的次数与党代会的序号相加（替换的是主体：把中央委员会全会换成了党代会）。二十届四中全会是中央委员会的全体会议，不是党的全国代表大会；后半句本身正确。"},{"text":"前者属于党的第二十届中央委员会，后者表明第十四届全国人大任期已满、换届为第十五届","correct":false,"why":"错因：把一届之内的会议次数当成了届次更替（替换的是阶段）。十四届全国人大四次会议仍在第十四届任期内，换届另依程序进行；前半句本身正确。"},{"text":"党的中央委员会与全国人大的届次应当同步，“二十届”与“十四届”的写法相互矛盾","correct":false,"why":"错因：把两套不同组织当成了同一套编号体系（替换的是主体）。党代会及其产生的中央委员会、全国人大、全国政协各有自己的届次和会议次数，号码不必相同。"},{"text":"前者是第二十届中央委员会第四次全体会议，后者是第十四届全国人大任期内的第四次会议","correct":true,"why":"先认组织，再看任期内的次序：前者属于党的第二十届中央委员会，后者属于第十四届全国人大。"}],"answer":"","fix":"","explain":"读会议名称先认组织：党的二十大是第二十次全国代表大会，产生第二十届中央委员会；二十届四中全会是该届中央委员会第四次全体会议。十四届全国人大四次会议是第十四届全国人大任期内的第四次大会，仍在本届任期内。党代会和全国人大不是一套机构，号码不必相同；政协也有自己的届次与会议次数。","condition":"会议名称实例：2025年10月二十届四中全会；2026年3月十四届全国人大四次会议","refs":["TPARTY","ICONST","IPLEN4"],"origin":"自编","review":""},{"id":"F-P4-03-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P4","cards":["P4-03"],"lead":"某党校学员整理党的中央组织和地方组织的有关规定，写下以下几条。","stem":"其中正确的有（）","opts":[{"text":"党的全国代表大会通常每五年举行一次，选举中央委员会和中央纪律检查委员会","correct":true,"why":"党代会通常每五年一次，选举产生中央委员会和中央纪律检查委员会。"},{"text":"中央委员会全体会议每年至少举行一次，中央政治局及其常委会在全会闭会期间行使中央委员会职权","correct":true,"why":"中央全会每年至少一次；闭会期间由中央政治局及其常委会行使中央委员会职权，所以不是五年才作一次决策。"},{"text":"党的全国代表大会在选举中央委员会的同时，直接选举产生中央委员会总书记","correct":false,"why":"错因：把党代会产生中央委员会与中央委员会全会选举总书记合并为一步（替换的是选举主体）。总书记由中央委员会全体会议选举，并须从中央政治局常委中产生。"},{"text":"党的地方各级委员会全体会议每年至少召开两次，与中央全会的最低次数不同","correct":true,"why":"地方党委全会每年至少两次，中央全会每年至少一次，不能把中央与地方的最低次数混写。"}],"answer":"","fix":"","explain":"党的全国代表大会通常每五年一次，选举中央委员会和中央纪律检查委员会；中央委员会全体会议选举中央政治局、政治局常委会和总书记，总书记须从政治局常委中产生；中央全会每年至少一次，闭会期间由中央政治局及其常委会行使中央委员会职权。地方党代会通常每五年一次，地方党委全会每年至少两次。","condition":"依据《中国共产党章程》（2022年修改）和《中国共产党地方委员会工作条例》（2026年修订）","refs":["TPARTY","IPLEN1","ILPARTY"],"origin":"自编","review":"","o":190,"t":2},{"id":"F-P4-04-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"P4","cards":["P4-04"],"lead":"下列是党的二十届中央委员会几次全体会议的主要议题：①通过关于制定国民经济和社会发展第十五个五年规划的建议；②涉及国家机构领导人建议名单和机构改革；③部署进一步全面深化改革、推进中国式现代化；④通过持之以恒推进全面从严治党若干重大问题的决定。","stem":"按会议召开的时间先后排列，正确的是（）","opts":[{"text":"②③①④","correct":true,"why":"二中（2023年2月）→三中（2024年7月）→四中（2025年10月）→五中（2026年10月）。"},{"text":"③②①④","correct":false,"why":"错因：把二中和三中的议题对调（替换的是阶段：会议先后）。国家机构领导人建议名单和机构改革在二中，进一步全面深化改革在三中。"},{"text":"②①③④","correct":false,"why":"错因：把十五五规划建议提前到三中全会之前（替换的是关系：会议与议题的对应）。十五五规划建议由四中全会通过，三中全会部署进一步全面深化改革。"},{"text":"②③④①","correct":false,"why":"错因：套用“五中全会必谈五年规划”的旧口诀，把规划建议放到最后（替换的是关系：会议与议题的对应）。二十届四中全会通过十五五规划建议，五中全会通过全面从严治党的决定。"}],"answer":"","fix":"","explain":"二十届一中全会（2022年10月）产生中央领导机构；二中（2023年2月）涉及国家机构领导人建议名单和机构改革；三中（2024年7月）部署进一步全面深化改革、推进中国式现代化；四中（2025年10月）通过十五五规划建议；五中（2026年10月）通过持之以恒推进全面从严治党若干重大问题的决定。全会议题来自当时任务，“几中全会谈什么”不是固定制度。","condition":"限定为党的二十届中央委员会第二至第五次全体会议，议题以各次全会公报为准","refs":["IPLEN1","IPLEN2","IPLEN3","IPLEN4","TPL5"],"origin":"自编","review":"","o":43,"t":1},{"id":"F-P4-05-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P4","cards":["P4-05"],"lead":"","stem":"全国人民代表大会是最高国家权力机关，地方各级人民代表大会是地方国家权力机关；全国人大会议每年举行一次，依法也可以临时召集。","opts":[],"answer":"正确","fix":"","explain":"正确。全国人大是最高国家权力机关，其常设机关是全国人大常委会；地方各级人大是地方国家权力机关，不能都加“最高”。全国人大每届任期五年，会议每年举行一次，依法可以临时召集，“每年一次”不是禁止增加会议。另外，乡镇人大不设常委会；通常所说的全国两会是全国人大会议和全国政协会议。","condition":"依据《中华人民共和国宪法》（2018年修正文本）和《地方各级人民代表大会和地方各级人民政府组织法》（2022年修正）","refs":["ICONST","ICPPCC","ILOCAL"],"origin":"自编","review":""},{"id":"F-P4-06-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P4","cards":["P4-06"],"lead":"","stem":"2026年全国召开的是十四届全国人大四次会议，同年广东召开的是省十四届人大五次会议，两者会议次数不同并不矛盾。","opts":[],"answer":"正确","fix":"","explain":"正确。届次表示任期，次数表示该任期内已举行的大会次序；国家和省的人大依法各自安排会期。广东2025年10月另行举行了省十四届人大四次会议，所以2026年开的是五次会议。同一年、同为“十四届”，推不出次数相同；全国政协和省政协也各自编号，不能按人大次数套用。","condition":"以2026年十四届全国人大四次会议、广东省十四届人大五次会议及2025年10月广东省十四届人大四次会议为例","refs":["IGD4","IGD5","IPLAN"],"origin":"自编","review":""},{"id":"F-P4-07-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P4","cards":["P4-07"],"lead":"某省推进一项重大发展任务：省委研究确定方向和重大部署，省政府形成具体方案并组织实施，省人大及其常委会依法审议、监督，省政协组织委员协商建言。","stem":"关于各主体的角色，下列说法正确的有（）","opts":[{"text":"省委在本地区发挥总揽全局、协调各方的领导核心作用","correct":true,"why":"党发挥总揽全局、协调各方的领导核心作用，地方党委在本地区同样如此。"},{"text":"省人大及其常委会依照各自的法定权限履职，并非每一级地方人大都有地方性法规制定权","correct":true,"why":"人大及其常委会依各自法定权限履行立法、决定、监督、任免等职权；地方性法规制定权只属于法律规定的层级，不是每一级人大都有。"},{"text":"省政府是地方国家行政机关，负责形成具体方案并组织实施","correct":true,"why":"政府是国家行政机关，负责执行和组织实施。"},{"text":"省政协是统一战线组织和专门协商机构，其协商建言不属于立法表决","correct":true,"why":"政协的主要职能是政治协商、民主监督、参政议政；它不是国家权力机关，不能套用上院、下院的两院制模型。"}],"answer":"","fix":"","explain":"四项都对。党发挥总揽全局、协调各方的领导核心作用；人大及其常委会依各自法定权限履行立法、决定、监督、任免等职权；政府是国家行政机关；政协是统一战线组织、专门协商机构，主要职能是政治协商、民主监督、参政议政。同一任务可以经党委定方向、政府定方案、人大依法审查批准和监督、政协协商建言，但各自的权限和动作不能合并，政府编制规划纲要也不等于政府独自完成法定批准。","condition":"依据《中华人民共和国宪法》（2018年修正文本）、《中国共产党章程》（2022年修改）和《中国人民政治协商会议章程》（2023年修改）","refs":["ICONST","ICPPCC","IPLAN","TPARTY"],"origin":"自编","review":""},{"id":"F-P4-08-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-08"],"lead":"某省换届时，省委推荐省长人选，随后省人民代表大会依法选举产生省长。此后，省委书记主持省委工作，省长领导省政府工作。","stem":"对这一过程理解正确的是（）","opts":[{"text":"省委推荐省长人选后，省人大的选举程序就失去必要，可以不再进行","correct":false,"why":"错因：用政治程序代替了法定产生程序（替换的是动作）。推荐与依法选举相衔接，省长由省人大依法选举产生。"},{"text":"省委书记主持省委工作，因而在法律上可以直接行使省长的行政职权","correct":false,"why":"错因：把政治领导与行政机关的法定职权混同（替换的是主体）。省委领导本地区工作、省委书记主持省委工作；省长领导省政府工作，各按权限履职。"},{"text":"党委推荐人选与人大依法选举是相互衔接的不同环节，推荐不能代替选举","correct":true,"why":"省人大依法选举省长；党委对人选的推荐与人大的法定选举是不同环节。"},{"text":"同一人兼任党内职务和国家职务时，有关党组织和国家机关的法定权限随之合并","correct":false,"why":"错因：把个人兼职当成了机构权限的合并（替换的是关系）。兼任不同职务，不会使党组织和国家机关的法定权限合并。"}],"answer":"","fix":"","explain":"省党委领导本地区工作，省委书记主持省委工作；省长领导省政府工作；省长由省人大依法选举产生，党委推荐人选与人大法定选举是相衔接的不同环节。国家层面，国家主席与国务院总理也属于不同职务和职权系统。弄清“谁提出人选、谁依法决定、谁主持行政工作”，比按新闻中的站位猜职权更可靠。","condition":"依据《地方各级人民代表大会和地方各级人民政府组织法》（2022年修正）、《中华人民共和国宪法》（2018年修正文本）和《中国共产党地方委员会工作条例》（2026年修订）","refs":["ILPARTY","ILOCAL","ICONST"],"origin":"自编","review":""},{"id":"F-P4-09-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P4","cards":["P4-09"],"lead":"","stem":"下列每项给出两组上下级机关之间的关系，两组都正确的是（）","opts":[{"text":"上级人民法院对下级人民法院：领导；上级监察委员会对下级监察委员会：领导","correct":false,"why":"错因：第一组把审判监督关系换成了行政式领导（替换的是关系）。上级法院监督下级法院的审判工作，具体案件依审级和程序处理；第二组本身正确。"},{"text":"国务院对地方各级国家行政机关：统一领导；上级人民检察院对下级人民检察院：监督","correct":false,"why":"错因：第二组把检察机关的领导关系换成了监督（替换的是关系）。上级检察院领导下级检察院的工作；第一组本身正确。"},{"text":"上级监察委员会对下级监察委员会：业务指导；国务院对地方各级国家行政机关：统一领导","correct":false,"why":"错因：第一组把监察机关的领导关系换成了业务指导（替换的是关系）。上级监委领导下级监委的工作；第二组本身正确。"},{"text":"上级人民法院对下级人民法院：监督审判工作；上级人民检察院对下级人民检察院：领导","correct":true,"why":"两组都对：法院之间是审判监督关系，检察院之间是领导关系。"}],"answer":"","fix":"","explain":"国务院统一领导全国地方各级国家行政机关；上级法院监督下级法院的审判工作；上级检察院领导下级检察院工作；上级监委领导下级监委工作。地方政府对本级人大和上一级国家行政机关负责并报告工作，县级以上地方政府在本级人大闭会期间对本级人大常委会负责并报告工作。不能把所有上下关系都套成“总部—分公司”的行政命令模型。","condition":"依据《中华人民共和国宪法》（2018年修正文本）和《地方各级人民代表大会和地方各级人民政府组织法》（2022年修正）","refs":["ICONST","ILOCAL"],"origin":"自编","review":"","o":147,"t":1},{"id":"F-P4-10-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-10"],"lead":"某省政府的一个工作部门，在业务上依法接受国务院对口主管部门的指导；该省某镇人民政府推进村庄环境整治时，与辖区内的村民委员会协同开展工作。","stem":"下列说法正确的是（）","opts":[{"text":"该部门与国务院对口部门业务相近，因此改由国务院部门直接领导，不再受省政府领导","correct":false,"why":"错因：忽略了所属地方政府的统一领导（替换的是领导主体）。地方政府统一领导所属部门，业务部门同时依法接受上级主管部门的业务指导或者领导，具体按法律法规确定。"},{"text":"该部门受省人民政府统一领导，同时依法接受上级主管部门的业务指导","correct":true,"why":"“块”上受本级政府统一领导，“条”上依法接受上级主管部门业务指导或者领导，两者同时存在。"},{"text":"村民委员会是我国最基层的一级人民政府，镇政府是它的上一级政府","correct":false,"why":"错因：把基层群众性自治组织当成了国家行政机关（替换的是性质和层级）。乡镇政府是基层国家行政机关，村委会不是一级政府。"},{"text":"镇人民政府与村民委员会性质相同，同属基层群众性自治组织","correct":false,"why":"错因：把基层国家行政机关说成了自治组织（替换的是主体性质）。乡镇人民政府是基层国家行政机关；村委会、居委会是基层群众性自治组织。"}],"answer":"","fix":"","explain":"地方政府统一领导所属部门，业务部门还依法接受上级主管部门的业务指导或者领导，具体按法律法规确定，垂直管理、双重管理等安排不能用一个口诀包办。村委会、居委会是基层群众性自治组织，乡镇政府是基层国家行政机关，村委会不是一级政府。","condition":"依据《中华人民共和国宪法》（2018年修正文本）和《地方各级人民代表大会和地方各级人民政府组织法》（2022年修正）","refs":["ICONST","ILOCAL"],"origin":"自编","review":""},{"id":"F-P4-11-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P4","cards":["P4-11"],"lead":"","stem":"纪委与监委合署办公，但纪委是党的纪律检查机关、监委是国家监察机关，党内监督与国家监察的身份和依据仍应区分。","opts":[],"answer":"正确","fix":"","explain":"正确。合署办公说明组织运行衔接紧密，不意味着二者是同一机关、党纪处理与监察调查是同一种法律行为，更不意味着纪委可以代替法院审判。同样，党委政法委员会是党委领导和管理政法工作的职能部门，履行统筹协调等职责，不能代替法院、检察院依法履职；不能凭名称字序推断权限。","condition":"依据《中国共产党政法工作条例》（2019年）、《中国共产党纪律检查委员会工作条例》（2022年）和《中华人民共和国宪法》（2018年修正文本）","refs":["IPOLLAW","ICCDI","ICONST"],"origin":"自编","review":"","o":194,"t":2},{"id":"F-P4-12-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-12"],"lead":"2026年1月，广东省十四届人大五次会议批准了广东省十五五规划纲要；同年3月，十四届全国人大四次会议批准了国家十五五规划纲要。","stem":"对此理解正确的是（）","opts":[{"text":"省级纲要早于国家纲要批准，说明省级纲要无须与国家发展规划相衔接","correct":false,"why":"错因：把并行衔接误读为可以不衔接（替换的是关系）。国家发展规划具有统领作用，省级纲要要依法衔接国家规划。"},{"text":"省级纲要应由国务院审查批准，省人民代表大会会议听取情况通报即可","correct":false,"why":"错因：把批准主体换成了国务院（替换的是主体）。省级国民经济和社会发展五年规划纲要由本级人大批准。"},{"text":"省级纲要衔接国家规划并由本级人大批准，其编制可以与国家规划并行推进","correct":true,"why":"省级纲要依法衔接国家规划并由本级人大批准；衔接不等于只能串行，可以在前期部署和建议的基础上并行推进，最终依法批准。"},{"text":"两份纲要批准后，年度政府工作报告可视为新的五年规划，并据此改写纲要","correct":false,"why":"错因：把年度部署与中期纲要混为一类文件（替换的是层级：年度文件与五年纲要不是同一层级）。年度计划、预算和具体政策推动规划实施，年度政府工作报告不能自动修改人大批准的规划。"}],"answer":"","fix":"","explain":"五年规划提出中期目标和任务，年度国民经济和社会发展计划、预算及具体政策工程推动实施。国家发展规划具有统领作用；省级纲要依法衔接国家规划，由本级人大批准。国家建议、国家纲要、省级纲要、年度政府工作报告不是同一份文件。2026年广东1月、国家3月先后批准纲要，正说明两套程序要分开看。","condition":"以2026年1月29日广东省十四届人大五次会议批准的《广东省国民经济和社会发展第十五个五年规划纲要》和2026年3月12日十四届全国人大四次会议批准的国家十五五规划纲要为例；“省级纲要”指省级国民经济和社会发展五年规划纲要；选项按衔接、批准的一般关系判断，国家发展规划法2026年3月12日起施行，不能倒推为广东1月批准时已适用的依据（E-DB-07）","refs":["IPLAN","IGD5","T15","E-DB-07","E-DB-01"],"origin":"自编","review":"","o":163,"t":2},{"id":"F-P4-13-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"P4","cards":["P4-13"],"lead":"①十五五规划期收官；②完成党的二十届三中全会决定部署的改革任务；③基本实现社会主义现代化；④建成社会主义现代化强国。","stem":"将上述目标节点按时间先后排列，正确的是（）","opts":[{"text":"①②③④","correct":false,"why":"错因：把2029年与2030年的先后颠倒（替换的是阶段：时间节点）。三中全会决定部署的改革任务到2029年完成，早于2030年十五五收官；2029年不是十五五收官年。"},{"text":"②③①④","correct":false,"why":"错因：把基本实现现代化提前到十五五收官之前（替换的是阶段：时间节点）。基本实现社会主义现代化在2035年，十五五在2030年收官。"},{"text":"②①④③","correct":false,"why":"错因：把两步走的先后颠倒（替换的是阶段）。先到2035年基本实现社会主义现代化，再到本世纪中叶建成社会主义现代化强国。"},{"text":"②①③④","correct":true,"why":"2029年完成改革任务→2030年十五五收官→2035年基本实现社会主义现代化→本世纪中叶建成社会主义现代化强国。"}],"answer":"","fix":"","explain":"几条时间轴分属不同安排：二十届三中全会决定提出到2029年完成其部署的改革任务；十五五规划期是2026—2030年；新时代两步走是到2035年基本实现社会主义现代化、到本世纪中叶建成社会主义现代化强国。一个节点提前不代表其他期限改变；1987年原三步走的世纪中叶目标属于当时的历史安排，不能替换当前的2035节点。","condition":"依据党的二十大报告（2022年）、二十届三中全会决定（2024年7月）和国家十五五规划纲要（2026年3月批准）","refs":["T20","T15","I2029"],"origin":"自编","review":"","o":83,"t":1},{"id":"F-P4-14-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-14"],"lead":"2023年6月，广东省委十三届三次全会作出“1310”具体部署。","stem":"关于这一部署，下列说法正确的是（）","opts":[{"text":"“1”是锚定“走在前列”总目标，“3”是激活改革、开放、创新三大动力","correct":true,"why":"“1310”指锚定“走在前列”总目标，激活改革、开放、创新三大动力，奋力实现十大新突破。"},{"text":"“1”是锚定“走在前列”总目标，“3”是指制造业、服务业、农业三大产业","correct":false,"why":"错因：把三大动力换成了三类产业（替换的是层级：把“动力”层换成了产业类别）。“3”是改革、开放、创新三大动力；前半句本身正确。"},{"text":"“10”中的新突破集中在工业领域，文化强省、民生不在其列","correct":false,"why":"错因：把十个任务领域缩小为工业领域（替换的是层级：把多领域总体任务缩成单一领域）。十大新突破还涉及文化强省、民生和共同富裕、法治平安广东与新安全格局等。"},{"text":"2026年广东突出两业协同，表明“1310”中的文化和民生任务已被替换","correct":false,"why":"错因：把年度突出主题当成了删除全局任务（替换的是关系）。年度大会在既有部署中选择重点，年度主题与总体部署衔接。"}],"answer":"","fix":"","explain":"“1310”的“1”是总目标（走在前列），“3”是动力（改革、开放、创新），“10”是十个任务领域：思想解放和高质量发展；改革开放与现代化体制机制；自立自强与产业科技互促；实体经济和制造业；百千万与城乡区域协调；海洋强省；绿美广东；文化强省；民生和共同富裕；法治平安广东与新安全格局。总目标、动力、任务领域不是同一层级。","condition":"依据2023年6月广东省委十三届三次全会的部署","refs":["I1310"],"origin":"自编","review":"","o":67,"t":1},{"id":"F-H01-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"H","cards":["H01","H09","H13","H28","H30"],"lead":"党史通常按主要历史任务划分为四个历史时期：新民主主义革命时期，社会主义革命和建设时期，改革开放和社会主义现代化建设新时期，中国特色社会主义新时代。","stem":"按这一专门分期，下列事件与所属时期对应正确的有（）","opts":[{"text":"1956年三大改造基本完成、社会主义基本制度确立——新民主主义革命时期","correct":false,"why":"错因：替换了阶段。党史分期中的新民主主义革命时期是1921—1949年，以新中国成立取得伟大胜利告终；1956年三大改造基本完成属于社会主义革命和建设时期（1949—1978）。"},{"text":"1929年古田会议确立思想建党、政治建军原则——新民主主义革命时期","correct":true,"why":"1929年处在1921—1949年之间，古田会议属于新民主主义革命时期的建军与革命道路探索。"},{"text":"2002年党的十六大把“三个代表”重要思想确立为党的指导思想——中国特色社会主义新时代","correct":false,"why":"错因：替换了阶段。新时代从2012年党的十八大算起；2002年属于改革开放和社会主义现代化建设新时期（1978—2012）。"},{"text":"1992年党的十四大明确建立社会主义市场经济体制的改革目标——改革开放和社会主义现代化建设新时期","correct":true,"why":"1992年处在1978—2012年之间，十四大确立市场经济体制改革目标属于改革开放和社会主义现代化建设新时期。"}],"answer":"","fix":"","explain":"四个时期的年份边界：1921—1949新民主主义革命时期；1949—1978社会主义革命和建设时期；1978—2012改革开放和社会主义现代化建设新时期；2012年党的十八大以来为新时代。归类先看事件年份和当时任务，不能凭“革命”“建设”“改革”等字眼判断。","condition":"按党史四个历史时期的专门分期判断（新民主主义革命作为革命史的开端另以1919年五四运动标记，与本题分期不冲突）","refs":["HS01","HS02","HS09","HS12","HS31","HS34"],"origin":"自编","review":"","o":11,"t":1},{"id":"F-H02-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H02"],"lead":"某党史学习小组讨论“新民主主义革命‘新’在哪里”，决定分三个维度作答：由谁领导，现阶段完成什么任务，发展前途是什么。","stem":"下列归纳正确的是（）","opts":[{"text":"由资产阶级领导；现阶段主要完成反帝反封建的民主革命任务；前途是社会主义","correct":false,"why":"错因：替换了主体。新民主主义革命由无产阶级领导，领导阶级不能换成资产阶级。"},{"text":"由无产阶级领导；现阶段就进行社会主义改造、消灭私人资本；前途是社会主义","correct":false,"why":"错因：替换了阶段。把发展前途提前成现阶段任务，跳过了民主革命阶段；无产阶级领导并不意味着眼前任务就是消灭私人资本。"},{"text":"由无产阶级领导；现阶段主要完成反帝反封建的民主革命任务；前途是社会主义","correct":true,"why":"三个维度各自对应正确：领导阶级是无产阶级，眼前处理反帝反封建等民主革命任务，发展前途是社会主义。"},{"text":"由无产阶级领导；现阶段主要完成反帝反封建的民主革命任务；前途是长期发展资本主义","correct":false,"why":"错因：替换了关系。把现阶段的民主革命任务误当成革命的最终归宿；新民主主义革命的发展前途是社会主义。"}],"answer":"","fix":"","explain":"领导阶级、当前任务、发展前途是三个不同维度：无产阶级领导，现阶段处理反帝反封建等民主革命任务，前途是社会主义。长期目标不会让眼前任务消失，眼前任务也不改变发展前途。","condition":"","refs":["HS01","HS21"],"origin":"自编","review":""},{"id":"F-H03-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H03","H04"],"lead":"","stem":"1921年7月23日，中共一大在上海开幕，最后一天转至浙江嘉兴南湖游船；会议通过党的第一个纲领和决议，选举产生中央局，陈独秀任中央局书记。","opts":[],"answer":"正确","fix":"","explain":"全句正确。三个容易被换掉的点：7月1日是党的成立纪念日，不是一大开幕日；一大通过的是第一个纲领和决议，第一部党章由1922年二大通过；陈独秀当时的职务是中央局书记，不是总书记。","condition":"","refs":["HS03","HS04"],"origin":"自编","review":""},{"id":"F-H04-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"H","cards":["H04","H03"],"lead":"","stem":"关于1922年中共二大，下列说法正确的有（）","opts":[{"text":"第一次提出明确的反帝反封建的民主革命纲领","correct":true,"why":"二大第一次提出明确的反帝反封建的民主革命纲领。"},{"text":"区分两个纲领，意味着党在民主革命阶段放下了共产主义目标","correct":false,"why":"错因：替换了关系。最高纲领与最低纲领是阶段衔接关系，不是二选一；最低纲领解决当前阶段任务，指向共产主义的最高纲领同时保留。"},{"text":"区分最高纲领和最低纲领，最低纲领针对当时民主革命阶段的任务","correct":true,"why":"最低纲领主要是反对帝国主义、军阀统治，争取独立、统一的民主共和国；最高纲领指向共产主义。"},{"text":"通过了中国共产党历史上的第一部党章","correct":true,"why":"第一部党章由二大通过；一大通过的是党的第一个纲领和决议。"}],"answer":"","fix":"","explain":"二大的三项成果：第一次提出明确的反帝反封建民主革命纲领；区分最高纲领与最低纲领；通过第一部党章。“最低”指当前阶段必须解决的任务，不是降低标准，也不是放弃长期目标。","condition":"","refs":["HS04","HS42"],"origin":"自编","review":"","o":167,"t":2},{"id":"F-H05-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H05"],"lead":"","stem":"下列关于第一次国共合作的会议、地点与成果配对，正确的是（）","opts":[{"text":"1923年中共三大—广州—标志第一次国共合作正式形成","correct":false,"why":"错因：替换了动作。三大作出的是合作决策（党员以个人身份加入国民党），合作正式形成以1924年国民党一大为标志。"},{"text":"1924年国民党一大—广州—标志第一次国共合作正式形成","correct":true,"why":"国民党一大在广州召开，标志第一次国共合作正式形成，合作形式是党内合作。"},{"text":"1923年中共三大—广州—决定中国共产党整体并入国民党","correct":false,"why":"错因：替换了关系。三大决定共产党员以个人身份加入国民党，同时保持党在政治、思想、组织上的独立性，不是整党并入。"},{"text":"1924年国民党一大—广州—宣布新三民主义的三项主义是联俄、联共、扶助农工","correct":false,"why":"错因：把三大政策当成了三民主义本身（被替换的是：关系）。新三民主义仍是民族、民权、民生三项主义；联俄、联共、扶助农工是它的政策内涵，国民党一大实际上确立了这三大政策（“三大政策”是后来的概括），毛泽东称之为“联俄、联共、扶助农工三大政策的三民主义”。二者相关，但不是同一份清单。"}],"answer":"","fix":"","explain":"先由共产党内部决定合作方式（1923年中共三大，广州：党员以个人身份加入国民党，保持独立性），再由国民党改组使合作正式成立（1924年国民党一大，广州：党内合作）。新三民主义是政治基础，联俄、联共、扶助农工是三大政策。","condition":"","refs":["HS05","HS07"],"origin":"自编","review":"","o":99,"t":1},{"id":"F-H06-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"H","cards":["H06","H04","H05"],"lead":"①决定共产党员以个人身份加入国民党　②第一次国共合作正式形成　③提出无产阶级在民主革命中的领导权问题和工农联盟问题　④通过党的第一部党章","stem":"上述成果按时间先后排列，正确的是（）","opts":[{"text":"④①③②","correct":false,"why":"错因：替换了阶段（先后顺序）。领导权和工农联盟问题由1925年中共四大提出，晚于1924年国民党一大标志合作正式形成。"},{"text":"①④②③","correct":false,"why":"错因：替换了阶段（先后顺序）。第一部党章由1922年中共二大通过，早于1923年中共三大作出的合作决定。"},{"text":"④③①②","correct":false,"why":"错因：替换了主体。把四大的成果提前到三大之前；三大只决定合作形式，领导权、工农联盟问题是1925年四大提出的。"},{"text":"④①②③","correct":true,"why":"④1922年中共二大；①1923年中共三大；②1924年国民党一大；③1925年中共四大。"}],"answer":"","fix":"","explain":"二大（1922）通过第一部党章→三大（1923，广州）决定党员以个人身份加入国民党→国民党一大（1924，广州）合作正式形成→四大（1925，上海）提出领导权和工农联盟问题。三大记合作形式，四大记领导权与工农联盟。","condition":"","refs":["HS06","HS07","HS04","HS05"],"origin":"自编","review":""},{"id":"F-H07-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H07"],"lead":"某研学团设计“广东早期党史”线路，为几个点位撰写了功能说明。","stem":"下列说明准确的是（）","opts":[{"text":"黄埔军校：国共合作背景下创办，主要培养农民运动骨干","correct":false,"why":"错因：替换了关系（机构与功能的对应）。黄埔军校主要联系军事人才培养；培养农民运动骨干的是广州农民运动讲习所。"},{"text":"海丰县总农会：1922年与六人农会同时成立，是中国第一个县级农会","correct":false,"why":"错因：替换了阶段（组织规模节点）。1922年是六人农会；海丰县总农会1923年成立，是中国第一个县级农会。"},{"text":"省港大罢工：1925年爆发，主要连接广州、香港与反帝工人运动","correct":true,"why":"省港大罢工1925年爆发，属于反帝工人运动，连接广州与香港。"},{"text":"彭湃：主要与1925年广州、香港工人的大罢工相连","correct":false,"why":"错因：替换了主体（人物与事件的对应）。彭湃主要与广东海丰农民运动相连。"}],"answer":"","fix":"","explain":"按功能把广东坐标挂到同一段历史：黄埔军校—军事骨干；广州农讲所—农民运动骨干；彭湃—海丰农民运动（1922年六人农会，1923年海丰县总农会）；1925年省港大罢工—广州、香港的反帝工人运动。","condition":"","refs":["HS02","HS07","HS08"],"origin":"自编","review":"","o":90,"t":1},{"id":"F-H08-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H08"],"lead":"1927年的三个节点：①南昌起义　②八七会议　③秋收起义后毛泽东率部转向井冈山。三种历史地位：甲.确定实行土地革命和武装起义的方针　乙.党独立领导革命战争、创建人民军队和武装夺取政权的开端　丙.建立农村革命根据地，此后在实践中探索农村包围城市的道路","stem":"下列配对正确的是（）","opts":[{"text":"①—乙，②—甲，③—丙","correct":true,"why":"南昌起义是开端；八七会议确定土地革命和武装起义方针；秋收起义后转向井冈山，建立农村革命根据地。"},{"text":"①—甲，②—乙，③—丙","correct":false,"why":"错因：替换了主体。把南昌起义与八七会议互换；“开端”属于南昌起义，土地革命和武装起义方针由八七会议确定。"},{"text":"①—乙，②—丙，③—甲","correct":false,"why":"错因：替换了阶段。把后来在根据地实践中逐步形成的道路安在八七会议名下；八七会议确定的是一般方针，不是完整的农村包围城市道路。"},{"text":"①—丙，②—甲，③—乙","correct":false,"why":"错因：替换了主体。把井冈山根据地的创建提前到南昌起义；井冈山根据地主要联系秋收起义后的转向。"}],"answer":"","fix":"","explain":"南昌起义—开端；八七会议—土地革命和武装起义方针；秋收起义后转向井冈山—农村革命根据地。农村包围城市、武装夺取政权的道路是此后在实践中逐步探索和概括的，不能一次性记在八七会议名下。","condition":"","refs":["HS01","HS02"],"origin":"自编","review":""},{"id":"F-H09-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H09","H10"],"lead":"党对军队绝对领导的根本原则和制度，有一个权威概括：发端于南昌起义、奠基于三湾改编、定型于古田会议。某连队开展传统教育，讲解员要说明“奠基”和“定型”两个环节各自的标志性内容。","stem":"下列说明正确的是（）","opts":[{"text":"三湾改编确立思想建党、政治建军原则；古田会议把党的支部建在连上","correct":false,"why":"错因：替换了主体。把两次的标志性内容互换；支部建在连上属于1927年三湾改编，思想建党、政治建军原则由1929年古田会议确立。"},{"text":"三湾改编的重点是缩减部队编制，与党的领导关系不大；古田会议确立思想建党、政治建军原则","correct":false,"why":"错因：替换了关系。把三湾改编的核心换成了表层整编动作；三湾改编的重要内容是把支部建在连上，从组织上加强党对军队的领导。"},{"text":"三湾改编把党的支部建在连上；遵义会议确立思想建党、政治建军原则","correct":false,"why":"错因：替换了主体（会议）。思想建党、政治建军原则由1929年古田会议确立；1935年遵义会议集中处理的是军事和组织问题。"},{"text":"三湾改编把党的支部建在连上；古田会议确立思想建党、政治建军原则","correct":true,"why":"三湾改编从组织上加强党对军队的领导；古田会议从思想和政治上确立建党建军原则。"}],"answer":"","fix":"","explain":"三湾改编（1927）：支部建在连上，让党的组织进入基层作战单位；古田会议（1929）：确立思想建党、政治建军原则，回答军队为什么而战。发端、奠基、定型是三个环节，不能用一次会议包揽。","condition":"","refs":["HS09"],"origin":"自编","review":"","o":106,"t":1},{"id":"F-H10-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H10"],"lead":"","stem":"1935年1月召开的遵义会议，事实上确立了毛泽东在党中央和红军的领导地位，并选举他担任中共中央总书记。","opts":[],"answer":"错误","fix":"1935年1月召开的遵义会议，事实上确立了毛泽东在党中央和红军的领导地位。","explain":"错在“选举他担任中共中央总书记”：把领导地位换成了会议并未作出的任职（替换了动作）。规范表述是事实上确立毛泽东在党中央和红军的领导地位，开始确立以毛泽东为主要代表的正确路线在党中央的领导地位，开始形成第一代中央领导集体；会后中央负总责的安排和军事指挥分工还在继续调整。","condition":"","refs":["HS01","HS43"],"origin":"自编","review":"","o":72,"t":1},{"id":"F-H11-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"H","cards":["H11","H10"],"lead":"①中央红军到达陕北吴起镇　②红一、红二、红四方面军在会宁、将台堡地区会师　③中央红军因第五次反“围剿”失利开始战略转移　④遵义会议召开","stem":"按时间先后排列，正确的是（）","opts":[{"text":"③①④②","correct":false,"why":"错因：替换了阶段（先后顺序）。遵义会议是1935年1月长征途中召开的，早于1935年10月中央红军到达吴起镇。"},{"text":"③④①②","correct":true,"why":"③1934年；④1935年1月；①1935年10月；②1936年10月。"},{"text":"③④②①","correct":false,"why":"错因：替换了主体和时间。1935年10月到达吴起镇的是中央红军；三大主力会师在1936年10月，晚于中央红军到达陕北。"},{"text":"④③①②","correct":false,"why":"错因：替换了阶段。遵义会议是长征途中召开的，不在战略转移开始之前。"}],"answer":"","fix":"","explain":"长征有两个结束节点：1935年10月中央红军到达陕北吴起镇，完成中央红军长征；1936年10月三大主力在会宁、将台堡地区会师，标志红军长征胜利结束。两者对象、地点、年份都不同。","condition":"","refs":["HS10","HS01","HS43"],"origin":"自编","review":"","o":23,"t":1},{"id":"F-H12-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H12","H05"],"lead":"","stem":"下列对两次国共合作的比较，正确的是（）","opts":[{"text":"第一次1924年国民党一大时正式形成，属党内合作；第二次1937年9月国共合作宣言等公开后正式形成，属党外合作","correct":true,"why":"第一次以1924年国民党一大为正式形成标志，共产党员以个人身份加入国民党；第二次以1937年9月国共合作宣言与蒋介石相关谈话公开为标志，两党组织分别存在。"},{"text":"第一次1924年国民党一大时正式形成，属党内合作；第二次1936年西安事变和平解决时正式形成，属党外合作","correct":false,"why":"错因：替换了动作。把促成事件当成正式形成节点；西安事变和平解决对促成第二次合作起了重大作用，正式形成看1937年9月相关文件公开。"},{"text":"第一次1924年国民党一大时正式形成，属党外合作；第二次1937年9月国共合作宣言等公开后正式形成，属党内合作","correct":false,"why":"错因：替换了关系。把两次的组织形式互换；第一次是党内合作，第二次是党外合作。"},{"text":"第一次主要联系团结抗日，属党内合作；第二次主要联系国民革命和北伐，属党外合作","correct":false,"why":"错因：替换了关系。把两次合作各自的共同任务互换；第一次主要联系国民革命和北伐，第二次形成以国共合作为基础的抗日民族统一战线。"}],"answer":"","fix":"","explain":"第一次：1924年国民党一大正式形成，党内合作，联系国民革命和北伐。第二次：1936年西安事变和平解决起重大促成作用，1937年9月国共合作宣言与蒋介石相关谈话公开标志正式形成，党外合作，团结抗日。“促成”和“正式形成”要分开。","condition":"","refs":["HS07","HS11","HS45"],"origin":"自编","review":"","o":154,"t":1},{"id":"F-H13-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H13"],"lead":"某学习小组用1949、1953、1956三个年份，梳理新中国从成立到社会主义基本制度确立的进程。","stem":"下列表述正确的是（）","opts":[{"text":"1949年新中国成立，标志着社会主义改造已经完成","correct":false,"why":"错因：替换了阶段。1949年标志新民主主义革命取得伟大胜利、进入向社会主义过渡的历史进程；社会主义改造基本完成看1956年。"},{"text":"1953年正式提出过渡时期总路线，“一化”指农业合作化","correct":false,"why":"错因：替换了主体（“一化”的对象）。“一化”是社会主义工业化；对农业的社会主义改造属于“三改”之一。"},{"text":"1953年正式提出过渡时期总路线，“一化”指社会主义工业化","correct":true,"why":"过渡时期总路线简称“一化三改”：社会主义工业化，对农业、手工业和资本主义工商业的社会主义改造。"},{"text":"1956年三大改造基本完成，标志着我国已经实现社会主义工业化","correct":false,"why":"错因：替换了关系。把社会主义基本制度确立换成了工业化完成；工业化是发展生产能力的长期任务，不能用1956年表示完成。"}],"answer":"","fix":"","explain":"1949：新民主主义革命胜利，进入向社会主义过渡；1953：正式提出过渡时期总路线（一化三改）；1956：三大改造基本完成，社会主义基本制度确立。制度确立不等于工业化完成。","condition":"","refs":["HS01","HS12"],"origin":"自编","review":""},{"id":"F-H14-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H14","H18","H19"],"lead":"","stem":"下列著作、年份与代表主张的配对，正确的是（）","opts":[{"text":"《关于正确处理人民内部矛盾的问题》—1937年—用民主方法处理人民内部矛盾","correct":false,"why":"错因：替换了阶段（年份）。该著作是1957年的建设时期著作；1937年是《矛盾论》的写作年份，不能因同有“矛盾”二字混为一谈。"},{"text":"《论十大关系》—1956年—概括统一战线、武装斗争、党的建设三大法宝","correct":false,"why":"错因：替换了主体（主张所属的著作）。三大法宝出自1939年《〈共产党人〉发刊词》；《论十大关系》关注社会主义建设中的重大关系。"},{"text":"《关于正确处理人民内部矛盾的问题》—1957年—对人民内部矛盾采用对敌专政的方法","correct":false,"why":"错因：替换了关系（矛盾性质与处理方式）。该著作区分不同性质的社会矛盾，强调用民主方法处理人民内部矛盾，“团结—批评—团结”是相应方法。"},{"text":"《论十大关系》—1956年—调动一切积极因素为社会主义事业服务","correct":true,"why":"《论十大关系》关注重工业与农业轻工业、中央与地方、沿海与内地等重大关系，基本方针是调动一切积极因素为社会主义事业服务。"}],"answer":"","fix":"","explain":"《论十大关系》（1956）处理社会主义建设中的结构关系，基本方针是调动一切积极因素；《关于正确处理人民内部矛盾的问题》（1957）区分不同性质的矛盾，用民主方法处理人民内部矛盾。两篇都属新中国建设语境，不能因有“矛盾”二字归到1937年《矛盾论》。","condition":"","refs":["HS13","HS14","HS19","HS20"],"origin":"自编","review":"","o":132,"t":1},{"id":"F-H15-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H15"],"lead":"我国社会主要矛盾有三种历史表述：①人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾　②人民日益增长的物质文化需要同落后的社会生产之间的矛盾　③人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。提出它们的会议或文件是：甲.1956年党的八大　乙.1981年《关于建国以来党的若干历史问题的决议》　丙.2017年党的十九大","stem":"下列配对正确的是（）","opts":[{"text":"①—乙，②—甲，③—丙","correct":false,"why":"错因：替换了主体。把八大与1981年历史决议的表述互换；先进工业国的要求同落后农业国现实的矛盾是八大表述，物质文化需要同落后社会生产的矛盾是1981年历史决议的概括。"},{"text":"①—甲，②—乙，③—丙","correct":true,"why":"①是1956年八大表述；②是1981年历史决议对社会主义改造基本完成后主要矛盾的概括；③是2017年十九大表述。"},{"text":"①—甲，②—丙，③—乙","correct":false,"why":"错因：替换了阶段。把1981年与2017年的表述互换；“美好生活需要和不平衡不充分的发展”是十九大的表述，不能提前到1981年。"},{"text":"①—丙，②—乙，③—甲","correct":false,"why":"错因：替换了阶段。把十九大表述提前六十多年安给八大；八大表述突出建立先进工业国的要求同落后农业国现实之间的矛盾。"}],"answer":"","fix":"","explain":"1956年八大：“人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾”，以及“人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾”，主要任务落到发展生产力、实现国家工业化；1981年历史决议：“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”，形成此后沿用的规范表述；2017年十九大：“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”。主要矛盾变化没有改变社会主义初级阶段的基本国情。","condition":"三种表述按提出的会议或文件区分；①只取八大表述的前一项，八大另有“经济文化迅速发展的需要同当前不能满足”一项","refs":["HS15","HS16","HS36"],"origin":"自编","review":"","o":142,"t":1},{"id":"F-H16-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H16","H21"],"lead":"","stem":"1981年十一届六中全会通过的历史决议，对“文化大革命”的性质及错误作出明确评价；但不能因“大跃进”“文化大革命”等严重曲折，就否定1949—1978年间取得的建设成就。","opts":[],"answer":"正确","fix":"","explain":"正确。1958年开始的“大跃进”和人民公社化运动出现急于求成、违背经济规律等严重问题，1959—1961年国民经济发生严重困难；1966—1976年“文化大革命”是严重曲折。1981年十一届六中全会通过的历史决议指出，“文化大革命”使党、国家和人民遭到建国以来最严重的挫折和损失，同时充分肯定了建国以来的基本成就。历史评价要把具体错误与这一时期取得的制度、工业等成就分别看待，也不能把困难全推给自然因素。","condition":"","refs":["HS16","HS01"],"origin":"自编","review":""},{"id":"F-H17-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H17","H18"],"lead":"1930年，毛泽东写下两篇著作。甲篇着重回答中国革命的前途问题，论述农村根据地和红色政权的发展；乙篇着重谈调查研究，批评脱离实际的教条主义。","stem":"关于甲、乙两篇，下列判断正确的是（）","opts":[{"text":"甲篇是《星星之火，可以燎原》，乙篇是《反对本本主义》","correct":true,"why":"《星星之火，可以燎原》联系革命前途、农村根据地和红色政权发展；《反对本本主义》联系调查研究、反对脱离实际的教条主义。"},{"text":"甲篇是《反对本本主义》，乙篇是《星星之火，可以燎原》","correct":false,"why":"错因：替换了主体。把同年两篇的主旨互换；两篇同为1930年，只能靠主旨和问题对象区分。"},{"text":"甲篇是《星星之火，可以燎原》，乙篇是同年的《实践论》","correct":false,"why":"错因：替换了主体和年份。《实践论》写于1937年；1930年谈调查研究、反对教条主义的是《反对本本主义》。"},{"text":"乙篇是《反对本本主义》，它反对的是学习书本理论本身","correct":false,"why":"错因：替换了关系（反对的对象）。《反对本本主义》反对的是脱离实际、教条化地套用本本，不是反对知识和理论本身；理论要同实际结合。"}],"answer":"","fix":"","explain":"1930年的两篇：《星星之火，可以燎原》—革命前途、农村根据地和红色政权；《反对本本主义》—调查研究、反对教条主义（“没有调查，没有发言权”是其标志性论断）。题干只给年份时不能唯一选择，要再看主旨或问题对象。","condition":"","refs":["HS17","HS18"],"origin":"自编","review":""},{"id":"F-H18-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H18","H14","H17"],"lead":"","stem":"下列关于毛泽东著作的作品索引（写作年份、地点、篇名），正确的是（）","opts":[{"text":"1957年，毛泽东写成《矛盾论》，它就是《关于正确处理人民内部矛盾的问题》","correct":false,"why":"错因：替换了主体和年份。把两部不同著作合并；《矛盾论》写于1937年，《关于正确处理人民内部矛盾的问题》是1957年著作。"},{"text":"1930年，毛泽东写成《实践论》，与《反对本本主义》同年","correct":false,"why":"错因：替换了阶段（年份）。1930年写成的是《反对本本主义》《星星之火，可以燎原》；《实践论》写于1937年。"},{"text":"1937年，毛泽东在延安写成《实践论》和《矛盾论》","correct":true,"why":"两篇均为毛泽东1937年抗日战争时期在延安所写。"},{"text":"1937年，毛泽东在延安写成《实践论》和《反对本本主义》","correct":false,"why":"错因：替换了主体（篇名）。与《实践论》同年写成的是《矛盾论》；《反对本本主义》写于1930年。"}],"answer":"","fix":"","explain":"作品索引：《实践论》《矛盾论》，毛泽东，1937年，延安。不要与1930年的《反对本本主义》、1957年的《关于正确处理人民内部矛盾的问题》混淆。本题只记作品，不涉及实践、矛盾等概念辨析。","condition":"H18仅作作品索引（年份、作者、篇名、写作地）；概念辨析由马哲底稿负责","refs":["HS19","HS14","HS18"],"origin":"自编","review":""},{"id":"F-H19-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H19","H20"],"lead":"","stem":"1939年，毛泽东在《〈共产党人〉发刊词》中，把理论联系实际、密切联系群众、批评和自我批评概括为中国革命的三大法宝。","opts":[],"answer":"错误","fix":"1939年，毛泽东在《〈共产党人〉发刊词》中，把统一战线、武装斗争、党的建设概括为中国革命的三大法宝。","explain":"错在把三大优良作风混入了三大法宝（替换了清单内容，属于关系错配）。三大法宝是统一战线、武装斗争、党的建设，出自1939年《〈共产党人〉发刊词》；理论联系实际、密切联系群众、批评和自我批评是1945年《论联合政府》概括的三大优良作风，属于工作和组织行为方式，分类层次不同。","condition":"","refs":["HS20","HS22"],"origin":"自编","review":"","o":47,"t":1},{"id":"F-H20-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H20","H19"],"lead":"","stem":"下列著作与其具有区分度的内容配对，正确的是（）","opts":[{"text":"《新民主主义论》——毛泽东向中共七大提交的政治报告","correct":false,"why":"错因：替换了主体。把理论纲领著作换成了大会报告；向1945年七大提交的政治报告是《论联合政府》。"},{"text":"《论联合政府》——1940年系统阐述新民主主义的政治、经济、文化纲领","correct":false,"why":"错因：替换了主体和年份。把两篇作品互换；1940年系统阐述三大纲领的是《新民主主义论》。"},{"text":"《论联合政府》——概括统一战线、武装斗争、党的建设三大法宝","correct":false,"why":"错因：替换了关系（清单与作品错配）。《论联合政府》概括的是理论联系实际、密切联系群众、批评和自我批评三大优良作风；三大法宝出自1939年《〈共产党人〉发刊词》。"},{"text":"《新民主主义论》——文化主张为民族的、科学的、大众的文化","correct":true,"why":"1940年《新民主主义论》系统阐述新民主主义政治、经济、文化纲领，文化主张是民族的、科学的、大众的文化。"}],"answer":"","fix":"","explain":"《新民主主义论》（1940）：新民主主义政治、经济、文化纲领，文化是民族的、科学的、大众的；《论联合政府》（1945）：七大政治报告，围绕打败侵略者、建立新中国和联合政府主张，并概括三大优良作风。只问“与新民主主义有关”两篇都沾边，要靠这类细节区分。","condition":"","refs":["HS21","HS22","HS20"],"origin":"自编","review":"","o":134,"t":1},{"id":"F-H21-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H21","H23"],"lead":"1978年前后的历史转折可分为几个环节：思想讨论准备条件，中央全会作出决策，历史决议总结评价。","stem":"下列节点与其作用对应正确的是（）","opts":[{"text":"真理标准问题大讨论——作出把工作中心转移到经济建设上来的决策","correct":false,"why":"错因：替换了动作。把准备条件换成了作出决策；大讨论冲破“两个凡是”等思想束缚，为历史转折准备思想条件，决策由十一届三中全会作出。"},{"text":"十一届三中全会——通过《关于建国以来党的若干历史问题的决议》","correct":false,"why":"错因：替换了主体（会议）。该决议是1981年十一届六中全会通过的第二个历史决议。"},{"text":"十一届六中全会——1978年12月决定把工作中心转移到经济建设上来","correct":false,"why":"错因：替换了主体和时间。把后续的历史总结会议换成了转折会议；十一届六中全会在1981年召开，主要通过历史决议。"},{"text":"十一届三中全会——决定把工作中心转移到经济建设上来、实行改革开放","correct":true,"why":"1978年12月十一届三中全会作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。"}],"answer":"","fix":"","explain":"1978年真理标准问题大讨论：冲破“两个凡是”，准备思想条件；1978年12月十一届三中全会：工作中心转移、改革开放的历史性决策；1981年十一届六中全会：第二个历史决议，总结评价。讨论、决策、总结是各自的环节。","condition":"","refs":["HS23","HS16","HS28"],"origin":"自编","review":"","o":152,"t":1},{"id":"F-H22-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"H","cards":["H22"],"lead":"改革开放初期，农村改革和对外开放各有代表性的实践入口。","stem":"关于家庭联产承包责任制和经济特区，下列说法正确的有（）","opts":[{"text":"家庭联产承包责任制把农村集体土地的所有权转给了承包农户","correct":false,"why":"错因：替换了关系。把经营方式变化当成所有权变化；家庭承包是在土地集体所有基础上调整经营方式，不等于土地私有化。"},{"text":"1978年安徽小岗村的大包干探索，是农村改革的代表事件","correct":true,"why":"小岗村大包干探索是农村改革的代表事件。"},{"text":"经济特区作为试验窗口，可以在国家主权和法律之外独立运行","correct":false,"why":"错因：替换了层级。把先行先试的政策空间当成法外地位；经济特区是改革开放的试验窗口和示范区域，不独立于国家主权与法律之外。"},{"text":"1980年设立的经济特区，深圳、珠海、汕头在广东，厦门在福建","correct":true,"why":"1980年设立四个经济特区，深圳、珠海、汕头在广东，厦门在福建。"}],"answer":"","fix":"","explain":"家庭联产承包责任制：土地集体所有不变，调整的是经营方式；经济特区：1980年设立深圳、珠海、汕头（广东）和厦门（福建），是试验窗口和示范区域，仍在国家主权和法律之内。","condition":"","refs":["HS24","HS25","HS01"],"origin":"自编","review":""},{"id":"F-H23-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H23"],"lead":"","stem":"下列历史决议的年份、通过会议与标题配对，正确的是（）","opts":[{"text":"1945年—党的七大—《关于若干历史问题的决议》","correct":false,"why":"错因：替换了层级。把中央全会换成了党的全国代表大会；1945年的决议由六届七中全会通过，为随后召开的七大统一思想。"},{"text":"1981年—十一届六中全会—《关于建国以来党的若干历史问题的决议》","correct":true,"why":"1981年十一届六中全会通过该决议，主要评价新中国成立后重大历史问题及毛泽东的历史地位，坚持并发展毛泽东思想。"},{"text":"2021年—党的十九大—《中共中央关于党的百年奋斗重大成就和历史经验的决议》","correct":false,"why":"错因：替换了层级。第三个历史决议由2021年十九届六中全会通过，不是党代会（十九大在2017年召开）。"},{"text":"2021年—十九届六中全会—《关于若干历史问题的决议》","correct":false,"why":"错因：替换了主体（标题）。《关于若干历史问题的决议》是1945年决议的标题；2021年决议是《中共中央关于党的百年奋斗重大成就和历史经验的决议》。"}],"answer":"","fix":"","explain":"三份决议都由中央全会通过：1945年六届七中全会《关于若干历史问题的决议》；1981年十一届六中全会《关于建国以来党的若干历史问题的决议》；2021年十九届六中全会《中共中央关于党的百年奋斗重大成就和历史经验的决议》。标题提示范围：若干问题、建国以来、百年奋斗。","condition":"按三份历史决议的正式标题和通过会议判断","refs":["HS26","HS16","HS01"],"origin":"自编","review":""},{"id":"F-H24-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"H","cards":["H24","H25","H28"],"lead":"①提出社会主义经济是公有制基础上的有计划的商品经济　②邓小平在党代会开幕词中提出走自己的道路、建设有中国特色的社会主义　③明确经济体制改革的目标是建立社会主义市场经济体制　④系统阐述社会主义初级阶段理论","stem":"按时间先后排列，正确的是（）","opts":[{"text":"②①④③","correct":true,"why":"②1982年十二大；①1984年十二届三中全会；④1987年十三大；③1992年十四大。"},{"text":"①②④③","correct":false,"why":"错因：替换了层级关系。十二届三中全会是十二大选出的中央委员会的一次全会，只能在1982年十二大之后（1984年）。"},{"text":"②④①③","correct":false,"why":"错因：替换了阶段（先后顺序）。有计划的商品经济出自1984年十二届三中全会，早于1987年十三大。"},{"text":"②①③④","correct":false,"why":"错因：替换了阶段（先后顺序）。社会主义市场经济体制改革目标由1992年十四大明确，晚于1987年十三大。"}],"answer":"","fix":"","explain":"十二大（1982）道路命题→十二届三中全会（1984）有计划的商品经济→十三大（1987）初级阶段理论→十四大（1992）市场经济体制改革目标。改革概念逐步发展，不能把1992年的目标提前到1982年或1984年。","condition":"","refs":["HS27","HS28","HS29","HS31"],"origin":"自编","review":""},{"id":"F-H25-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H25","H21"],"lead":"有人说：“1987年党的十三大说我国处在社会主义初级阶段，可见当时我国还没有进入社会主义社会。”","stem":"对这一说法的辨析，正确的是（）","opts":[{"text":"说法正确，“初级阶段”指的是进入社会主义社会之前的准备阶段","correct":false,"why":"错因：替换了关系。用发展程度否定了制度性质；初级阶段理论首先肯定我国社会已经是社会主义社会。"},{"text":"说法错误，十三大判断我国已是社会主义社会，只是仍处于初级阶段","correct":true,"why":"初级阶段包含两个相连判断：我国社会已经是社会主义社会；我国社会主义社会仍处于初级阶段。"},{"text":"说法错误，十三大认为我国当时已越过初级阶段、进入发达阶段","correct":false,"why":"错因：替换了阶段。十三大的判断是我国社会主义社会仍处于初级阶段，不是已经越过。"},{"text":"说法错误，初级阶段理论由十一届三中全会系统阐述，与十三大无关","correct":false,"why":"错因：替换了主体（会议）。系统阐述社会主义初级阶段理论的是1987年十三大；1978年十一届三中全会是改革开放的转折会议。"}],"answer":"","fix":"","explain":"十三大系统阐述社会主义初级阶段理论，包含两个判断：“已经是”社会主义社会，防止否认制度性质；“仍处于”初级阶段，防止超越现实条件。十三大还完整概括基本路线、制定三步走战略，理论、路线、战略不是同义词。","condition":"","refs":["HS29","HS44"],"origin":"自编","review":""},{"id":"F-H26-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H26"],"lead":"","stem":"党在社会主义初级阶段基本路线中的“两个基本点”，是指以经济建设为中心和坚持改革开放。","opts":[],"answer":"错误","fix":"党在社会主义初级阶段基本路线中的“两个基本点”，是指坚持四项基本原则和坚持改革开放。","explain":"错在把“中心”挪进了“基本点”、漏掉四项基本原则（替换了组成关系）。一个中心是以经济建设为中心，两个基本点是坚持四项基本原则、坚持改革开放；四项基本原则是坚持社会主义道路、人民民主专政、中国共产党的领导、马克思列宁主义毛泽东思想。三者分别关联发展任务、政治方向和发展动力，相互联系、不能互相取代。","condition":"","refs":["HS30","HS44"],"origin":"自编","review":"","o":124,"t":1},{"id":"F-H27-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"H","cards":["H27"],"lead":"","stem":"按1987年党的十三大制定的原“三步走”发展战略，第三步是到21世纪中叶基本实现现代化。","opts":[],"answer":"正确","fix":"","explain":"正确。十三大原三步走：第一步解决温饱（常用到1990年表述），第二步到20世纪末达到小康，第三步到21世纪中叶基本实现现代化。“到2035年基本实现社会主义现代化”是后来的战略安排，不能倒填进1987年的原方案。","condition":"题干限定为1987年十三大原三步走，不是当前战略安排","refs":["HS29","HS44","HS36"],"origin":"自编","review":"","o":180,"t":2},{"id":"F-H28-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H28"],"lead":"","stem":"下列节点与其在社会主义市场经济体制形成中的作用，对应正确的是（）","opts":[{"text":"1992年邓小平南方谈话——明确经济体制改革的目标是建立社会主义市场经济体制","correct":false,"why":"错因：替换了动作。把解除认识障碍换成了确定目标；南方谈话强调计划和市场都是经济手段，改革目标由1992年十四大明确。"},{"text":"1992年党的十四大——宣布社会主义市场经济体制已经建立起来","correct":false,"why":"错因：替换了动作。把改革目标换成了完成状态；十四大确定的是建立该体制的目标。"},{"text":"1993年十四届三中全会——把十四大确定的目标系统化、具体化，提出基本框架","correct":true,"why":"1993年十四届三中全会通过相关决定，提出建立社会主义市场经济体制的基本框架。"},{"text":"1993年十四届三中全会——第一次提出建立社会主义市场经济体制的改革目标","correct":false,"why":"错因：替换了动作。把具体化方案当成首次定目标；目标由1992年十四大确立，次年全会给出基本框架。"}],"answer":"","fix":"","explain":"认识突破—确立目标—搭建框架：1992年南方谈话（计划和市场都是经济手段）→1992年十四大（明确建立社会主义市场经济体制的改革目标）→1993年十四届三中全会（系统化、具体化，提出基本框架）。确定目标不等于已经建成。","condition":"区分论述、确定目标、具体化、建成四个动作","refs":["HS28","HS31","HS32"],"origin":"自编","review":"","o":122,"t":1},{"id":"F-H29-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"H","cards":["H29","H10"],"lead":"一个理论被概括、写入党章、以规范名称确立为指导思想，可能是不同的历史节点。","stem":"关于毛泽东思想和邓小平理论的历史节点，下列说法正确的有（）","opts":[{"text":"1945年党的七大把毛泽东思想确立为党的指导思想并载入党章","correct":true,"why":"七大把毛泽东思想确立为党的指导思想并载入党章。"},{"text":"1992年党的十四大通过的党章，已载入“邓小平同志建设有中国特色社会主义的理论”","correct":true,"why":"十四大已将“邓小平同志建设有中国特色社会主义的理论”写入党章，1997年以前党章并非没有相关理论内容。"},{"text":"1935年遵义会议在事实上确立毛泽东领导地位的同时，把毛泽东思想写入了党章","correct":false,"why":"错因：替换了主体和动作。把领导路线的转折换成了党章节点；遵义会议事实上确立毛泽东的领导地位，毛泽东思想确立为指导思想并载入党章是1945年七大。"},{"text":"1997年党的十五大以“邓小平理论”的规范概括，把它确立为党的指导思想并载入党章","correct":true,"why":"十五大以“邓小平理论”的规范概括，把它同马克思列宁主义、毛泽东思想一道确立为党的指导思想并载入党章。"}],"answer":"","fix":"","explain":"毛泽东思想：1945年七大确立为指导思想并载入党章。邓小平理论分两步：1992年十四大党章已载入“邓小平同志建设有中国特色社会主义的理论”；1997年十五大以“邓小平理论”的规范概括，同马克思列宁主义、毛泽东思想一道确立为指导思想并载入党章。","condition":"区分1992年写入相关理论内容与1997年以“邓小平理论”规范名称确立指导地位","refs":["HS02","HS31","HS33"],"origin":"自编","review":""},{"id":"F-H30-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"H","cards":["H30"],"lead":"","stem":"下列思想名称、党的代表大会与动作的配对，正确的是（）","opts":[{"text":"“三个代表”重要思想——2002年党的十六大——写入党章，但当时未确立为指导思想","correct":false,"why":"错因：替换了动作。把同届完成的两个动作拆开；2002年十六大把“三个代表”重要思想确立为党的指导思想并写入党章。"},{"text":"科学发展观——2012年党的十八大——确立为党的指导思想","correct":true,"why":"科学发展观2007年十七大写入党章，2012年十八大确立为党的指导思想。"},{"text":"科学发展观——2007年党的十七大——确立为党的指导思想","correct":false,"why":"错因：替换了动作。2007年十七大将科学发展观等重大战略思想写入党章；确立为指导思想是2012年十八大。"},{"text":"习近平新时代中国特色社会主义思想——2012年党的十八大——写入党章","correct":false,"why":"错因：替换了阶段。把新时代起点与思想入章节点互换；该思想由2017年十九大确立为指导思想并写入党章。"}],"answer":"","fix":"","explain":"2002年十六大：“三个代表”重要思想确立为指导思想并写入党章；2007年十七大：科学发展观写入党章；2012年十八大：科学发展观确立为指导思想；2017年十九大：习近平新时代中国特色社会主义思想确立为指导思想并写入党章。凡问写入、确立，先核对动作再认大会。","condition":"区分“写入党章”与“确立为指导思想”两个动作","refs":["HS34","HS35","HS36"],"origin":"自编","review":"","o":174,"t":2},{"id":"F-H31-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H31","H01"],"lead":"某纪念馆展出一首改革开放以后创作的词作，歌颂焦裕禄在河南兰考工作期间的事迹。讲解员请观众判断焦裕禄主要事迹所处的历史时期。","stem":"下列判断及理由正确的是（）","opts":[{"text":"社会主义革命和建设时期，因为他在兰考工作是在20世纪60年代","correct":true,"why":"焦裕禄20世纪60年代在河南兰考工作，处在1949—1978年的社会主义革命和建设时期。"},{"text":"改革开放和社会主义现代化建设新时期，因为这首词写于改革开放以后","correct":false,"why":"错因：替换了条件。把纪念作品的创作时间当成人物事迹时间；后人写诗、题词的年代不是被歌颂者的事迹年代。"},{"text":"新民主主义革命时期，因为20世纪60年代仍属于新民主主义革命阶段","correct":false,"why":"错因：替换了阶段边界。新民主主义革命时期止于1949年新中国成立。"},{"text":"中国特色社会主义新时代，因为新时代仍在广泛学习和弘扬焦裕禄精神","correct":false,"why":"错因：替换了条件。用后人学习、纪念的时间代替了人物事迹时间。"}],"answer":"","fix":"","explain":"人物题分两步：先还原被歌颂的人或事业，再放到历史阶段。焦裕禄主要事迹在20世纪60年代的河南兰考，属于社会主义革命和建设时期；后人写诗、题词、学习纪念的年代不是人物事迹年代。","condition":"按人物主要事迹发生的年代归类，不按纪念作品的创作年代。导语为自编情境；现实中也有这类作品，例如1990年发表的《念奴娇·追思焦裕禄》。","refs":["HS37","HS01"],"origin":"自编","review":""},{"id":"F-H32-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"H","cards":["H32"],"lead":"有同学用“从1953年起，每五年一届”的公式，推算历次五年计划（规划）的起止年份。","stem":"下列说法正确的是（）","opts":[{"text":"按此公式推算，三五计划应从1963年开始，这一结果与史实相符","correct":false,"why":"错因：替换了阶段（忽略调整间隔）。二五为1958—1962年，1963—1965年有三年继续调整，三五从1966年开始。"},{"text":"“十五”是“十五五”的简称，二者都指2026—2030年这一时期","correct":false,"why":"错因：替换了主体（届次名称）。“十五”是第十个五年计划（2001—2005），“十五五”是第十五个五年规划（2026—2030）。"},{"text":"从“十一五”起改称“规划”，因此“十一五”指2001—2005年","correct":false,"why":"错因：替换了阶段（起止年份）。十一五是2006—2010年，2001—2005年是十五计划；改称规划从十一五开始这一点没错。"},{"text":"二五之后有三年继续调整，三五从1966年开始，公式不能通用","correct":true,"why":"二五结束后有三年继续调整，三五从1966年开始，所以不能用1953年加5的机械公式推算全部届次。"}],"answer":"","fix":"","explain":"时间锚点：一五1953—1957；二五1958—1962；1963—1965三年继续调整；三五从1966年开始；十一五（2006—2010）起“计划”改称“规划”；十四五2021—2025，十五五2026—2030。“十五”是第十个五年计划，不是“十五五”。","condition":"","refs":["HS39","HS40","HS41","T15"],"origin":"自编","review":"","o":169,"t":2},{"id":"F-LAW-001-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-001"],"lead":"某同学2026年11月复习时，把“行政法”“生态环境法”“行政法规”“地方性法规”写在笔记的同一栏里，打算按一个标准排出先后。","stem":"对这份笔记，下列判断正确的是（）","opts":[{"text":"“行政法规”就是“行政法”的另一种叫法，二者可以合并为一栏统一排序","correct":false,"why":"错因：把法的形式换成了法律部门（替换的是分类关系）。行政法规是国务院依法制定的一种法的形式；行政法是按调整的社会关系划分的领域，里面既有法律，也有行政法规等不同形式。"},{"text":"“地方性法规”只调整本地事务，因而不能归入生态环境法、民法商法等法律部门","correct":false,"why":"错因：把地域权限当成了内容领域（替换的是分类标准）。地方性法规是一种法的形式，可以在权限范围内涉及生态环境、民商等多个法律部门。"},{"text":"前两者是法律部门，后两者是法的形式，分属两条分类轴，不能放进一栏排序","correct":true,"why":"法律部门按调整的社会关系分类，回答“管什么”；法的形式和效力层级看制定主体和权限，回答“谁依何种权限制定”。两条分类轴不能混排。"},{"text":"四者可以按效力高低排成一列，其中“行政法”的效力高于“地方性法规”","correct":false,"why":"错因：把领域分类放进了效力层级（替换的是关系）。效力高低只在宪法、法律、行政法规、地方性法规、规章等法的形式之间比较，法律部门之间不比效力。"}],"answer":"","fix":"","explain":"法律部门（如民法商法、行政法、刑法、生态环境法）按调整的社会关系分类；法的形式及效力层级（宪法、法律、行政法规、地方性法规、规章等）看制定主体和权限。同一法律部门里可以同时有法律、行政法规和地方性法规；不能凭名称里的“行政”二字把行政法与行政法规混为一类。","condition":"中国大陆法制；法的形式和效力层级依立法法（2023年修正）；法律部门分类依全国人大常委会法工委宪法室2026年文章（含生态环境法）；截至2026-11-27。","refs":["LAW-S01","LAW-S05"],"origin":"自编","review":""},{"id":"F-LAW-002-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"LAW","cards":["LAW-002"],"lead":"","stem":"下列规范与其所属法的形式的配对，正确的是（）","opts":[{"text":"某省人民代表大会常务委员会表决通过的一部条例——行政法规","correct":false,"why":"错因：凭“条例”这一名称认定形式，替换了制定主体（主体替换）。省级人大及其常委会制定的是地方性法规；“条例”既可能是国务院的行政法规，也可能是地方人大的地方性法规。"},{"text":"国务院以国务院令公布的《全民阅读促进条例》——行政法规","correct":true,"why":"国务院依法制定行政法规；《全民阅读促进条例》以国务院令第823号公布，属于行政法规。"},{"text":"某省人民政府以省政府令形式公布的一项办法——地方性法规","correct":false,"why":"错因：把地方政府和地方人大的职权互换（主体替换）。省政府以政府令公布的办法属于地方政府规章；地方性法规只能由有立法权的地方人大及其常委会制定。"},{"text":"国务院某部委以部令形式公布的一项规定——行政法规","correct":false,"why":"错因：把国务院有关部门换成了国务院（主体替换）。国务院部门在本部门权限内制定的是部门规章，行政法规由国务院制定。"}],"answer":"","fix":"","explain":"名称只是线索，制定主体和法定权限决定法的形式：国务院—行政法规；有立法权的地方人大及其常委会—地方性法规；国务院有关部门—部门规章；有规章制定权的地方政府—地方政府规章。另注意：国家主席以主席令公布法律属于公布程序，不等于法律由主席个人制定。","condition":"中国大陆法制；立法法（2023年修正）；《全民阅读促进条例》为国务院令第823号，2026年2月1日起施行；不涉及经济特区法规、自治条例和单行条例等需另给授权或自治条件的情形；截至2026-11-27。","refs":["LAW-S01","LAW-S10"],"origin":"自编","review":"","o":114,"t":1},{"id":"F-LAW-003-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-003"],"lead":"某单位组织法治学习，讨论法律、行政法规、地方性法规、规章之间的效力关系。","stem":"根据立法法（2023年修正），下列说法正确的有（）","opts":[{"text":"行政法规的效力高于地方性法规，地方性法规的效力又高于本级地方政府规章","correct":true,"why":"立法法规定行政法规的效力高于地方性法规、规章；地方性法规的效力高于本级和下级地方政府规章。"},{"text":"部门规章由国务院部门制定，因而效力高于省级人大制定的地方性法规","correct":false,"why":"错因：用“中央部门高于地方”的行政隶属直觉替换了法定规则（层级替换）。地方性法规与部门规章之间不能简单比高低，对同一事项规定不一致、不能确定如何适用时，按立法法规定的程序处理。"},{"text":"部门规章与地方政府规章之间具有同等效力，在各自的权限范围内施行","correct":true,"why":"立法法规定部门规章之间、部门规章与地方政府规章之间具有同等效力，在各自的权限范围内施行。"},{"text":"全国人大通过的法典，效力高于全国人大制定的其他基本法律","correct":false,"why":"错因：把“法典”当成了独立的效力等级（层级替换）。法典由全国人大制定，属于法律层次，和其他基本法律一样，没有高于它们的独立效力等级；法律之间的冲突按特别规定、新旧规定和立法法规定的裁决程序处理。"}],"answer":"","fix":"","explain":"效力层级只考确定的关系：宪法最高；法律高于行政法规、地方性法规、规章；行政法规高于地方性法规、规章；地方性法规高于本级和下级地方政府规章；部门规章与地方政府规章同等。法典属于法律，不另成一级；地方性法规与部门规章之间不能凭机关大小排序。","condition":"中国大陆法制；立法法（2023年修正）第98—106条；截至2026-11-27。","refs":["LAW-S01","LAW-S02"],"origin":"自编","review":"","o":193,"t":2},{"id":"F-LAW-004-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-004"],"lead":"假设：全国人大常委会先后制定的两部法律中，2018年施行的甲法对某类特定事项作了特别规定，2025年修改后的乙法对同一事项作出新的一般规定，两者不一致，且不能确定如何适用。","stem":"根据立法法（2023年修正），关于这一冲突，下列看法正确的是（）","opts":[{"text":"乙法修改在后，依照“新法优于旧法”，该类事项应当适用乙法","correct":false,"why":"错因：漏掉了一般/特别关系这一条件（条件替换）。“新法优于旧法”解决同一机关新旧规定的冲突；新的一般规定与旧的特别规定不一致、不能确定如何适用时，不能单独套用。"},{"text":"甲法属于特别规定，即使与宪法的规定不一致，也可以优先于宪法得到适用","correct":false,"why":"错因：把特别规定优先扩大到上位法之上（层级替换）。特别法、新法规则只在同一位阶内起作用，不能越过宪法和其他上位法。"},{"text":"乙法施行后，此前依照甲法已经处理完毕的事项，也应按乙法重新评价","correct":false,"why":"错因：把时间效力改成了溯及既往（时间条件替换）。法律一般不溯及既往，只有为了更好地保护公民、法人和其他组织的权利和利益而作的特别规定才是法定例外。"},{"text":"这是新的一般规定与旧的特别规定冲突，不能只凭“新法优于旧法”处理","correct":true,"why":"“新”回答时间先后，“特别”回答适用对象；两条规则指向相反且不能确定如何适用时，须按立法法规定的程序解决，不能只喊“新法优先”。"}],"answer":"","fix":"","explain":"先看效力层级和适用范围；在同一机关制定的同位阶规范中，才比较特别与一般、新与旧。新的一般规定与旧的特别规定冲突且不能确定如何适用时，不能仅凭新法优先；这些规则也都不能越过宪法和上位法。","condition":"中国大陆法制；立法法（2023年修正）；题设甲法、乙法均为全国人大常委会制定的法律，属同一效力位阶；截至2026-11-27。","refs":["LAW-S01"],"origin":"自编","review":""},{"id":"F-LAW-004-2","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-004","LAW-003"],"lead":"","stem":"根据立法法（2023年修正），国务院某部门制定的部门规章对某事项作了特别规定，与全国人大常委会制定的法律中的一般规定不一致时，应依照“特别规定优于一般规定”适用该部门规章。","opts":[],"answer":"错误","fix":"根据立法法（2023年修正），国务院某部门制定的部门规章对某事项作了特别规定，与全国人大常委会制定的法律中的一般规定不一致时，不能依照“特别规定优于一般规定”适用该部门规章，而应适用效力更高的法律。","explain":"错因：把只在同一机关制定的同位阶规范之间适用的“特别规定优于一般规定”，搬到了不同位阶之间（层级替换）。法律的效力高于规章，特别法、新法规则都不能越过上位法。","condition":"中国大陆法制；立法法（2023年修正）；题设部门规章与法律对同一事项的规定不一致，且无法律另行授权；截至2026-11-27。","refs":["LAW-S01"],"origin":"自编","review":""},{"id":"F-LAW-005-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-005"],"lead":"","stem":"针对某类污染新制定一部单行法律，或者把现行环境法律的原文汇集成册出版，都不等于完成了该领域的法典化。","opts":[],"answer":"正确","fix":"","explain":"法典化是通过立法对一个领域的规则作系统整合、编订纂修、协调和必要更新，形成有统一结构、原则和制度联系的法典，并依法通过、公布。单行立法只针对特定事项；法律汇编只是把现有文本编在一起，本身不当然改变原法效力。法典化也不意味着该领域今后只准有一部法律。","condition":"中国大陆法制；以民法典、生态环境法典的编纂及全国人大常委会法工委宪法室2026年文章为准；截至2026-11-27。","refs":["LAW-S02","LAW-S05"],"origin":"自编","review":""},{"id":"F-LAW-006-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"LAW","cards":["LAW-006"],"lead":"民法典于2020年5月28日通过、2021年1月1日起施行，由总则、物权、合同、人格权、婚姻家庭、继承、侵权责任七编和附则组成。","stem":"下列事项与民法典中专门规定该事项的分编配对，正确的是（）","opts":[{"text":"遗嘱的订立和效力——继承编","correct":true,"why":"继承编处理因继承产生的民事关系，遗嘱继承和遗赠规定在这一编，体现家庭财产的延续。"},{"text":"肖像权、名誉权的保护——婚姻家庭编","correct":false,"why":"错因：把人格权编换成了婚姻家庭编（对应关系替换）。肖像权、名誉权属于人格权，由人格权编专门规定，保护人的尊严与人格利益。"},{"text":"所有权、用益物权、担保物权——合同编","correct":false,"why":"错因：把物权编换成了合同编（对应关系替换）。所有权、用益物权、担保物权处理物的归属和利用，由物权编规定；合同编处理交易关系。"},{"text":"离婚时夫妻共同财产的分割——侵权责任编","correct":false,"why":"错因：把婚姻家庭编换成了侵权责任编（对应关系替换）。离婚和夫妻共同财产分割属于婚姻家庭关系；侵权责任编处理侵害民事权益后的责任。"}],"answer":"","fix":"","explain":"民法典按功能组织七编：总则提供主体、行为、权利和责任的一般规则，物权看物的归属利用，合同看交易关系，人格权保护人格利益，婚姻家庭、继承处理家庭关系与财产延续，侵权责任处理侵害后的责任。七编中没有刑事责任编；施行时同时废止的是明文列出的婚姻法、继承法、合同法、物权法等九部法律，不是全部民商事单行法。","condition":"中国大陆法制；民法典（2020年5月28日通过，2021年1月1日起施行）；截至2026-11-27。","refs":["LAW-S02"],"origin":"自编","review":""},{"id":"F-LAW-007-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-007"],"lead":"","stem":"2026年3月12日十四届全国人大四次会议通过的生态环境法典，自2026年8月15日起施行，是继民法典之后我国第二部以“法典”命名的法律。","opts":[],"answer":"正确","fix":"","explain":"生态环境法典由十四届全国人大四次会议通过，属于法律，不是国务院行政法规；通过（2026年3月12日）与施行（2026年8月15日）不是同一天，截至2026年11月已经施行；它是继民法典之后第二部以“法典”命名的法律，共五编1242条。常见错误是把通过日当施行日，或说成第一部法典、行政法规。","condition":"中国大陆法制；生态环境法典（2026年3月12日通过，2026年8月15日起施行）；截至2026-11-27。","refs":["LAW-S03","LAW-S04"],"origin":"自编","review":"","o":13,"t":1},{"id":"F-LAW-008-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-008"],"lead":"2026年通过的生态环境法典采取“适度法典化”，对既有相关法律作了不同处理。","stem":"关于这些处理，下列说法正确的有（）","opts":[{"text":"编订后全部纳入法典的10部法律，在法典施行时依法废止","correct":true,"why":"这是第一类处理：10部法律编订后全部纳入，法典施行时依法废止；废止发生在施行时，判断依据是正式废止条款。"},{"text":"森林法、长江保护法的要旨纳入或体现于法典，这两部法律继续保留","correct":true,"why":"这是第二类处理：森林法、草原法、国家公园法、长江保护法、能源法等20余部法律择取要旨纳入或体现，继续保留。"},{"text":"能源法的相关内容在法典中有所体现，因此该法随法典施行一并废止","correct":false,"why":"错因：把“择要纳入、继续保留”换成了“全部吸收、废止”（关系替换）。能源法属于继续保留的专门法律，内容在法典中有所体现不等于被废止。"},{"text":"对应对气候变化、双碳等新需求作原则性、引领性规定，为后续制度留出空间","correct":true,"why":"这是第三类处理：对气候变化、双碳等新需求作原则性、引领性规定；原则性规定也是法律规范，不等于没有纳入法典。"}],"answer":"","fix":"","explain":"适度法典化分三类：编订后全部纳入、法典施行时废止（10部）；择要纳入或体现、继续保留（20余部，如森林法、草原法、国家公园法、长江保护法、能源法）；对新需求作原则性、引领性规定。某部法律是否废止，按正式废止条款判断，不按名称或内容是否被体现来猜。正式废止条款是法典第1242条：列明同时废止的十部法律，首项为环境保护法，另含土壤污染防治法，未列森林法；森林法继续保留，并于2026年11月6日经全国人大常委会修改、自公布之日起施行，其第25条改为省级以上林业主管部门应当编制林业发展规划、设区的市和县级可以根据实际需要编制。","condition":"中国大陆法制；生态环境法典（2026年3月12日通过，2026年8月15日起施行）第1242条；三类处理依全国人大常委会法工委宪法室2026年文章；森林法按2026年11月6日修改后的文本（第90号主席令）；截至2026-11-27（E-YF-01、E-LAW-02）。","refs":["LAW-S03","LAW-S05","E-LAW-02","E-YF-01"],"origin":"自编","review":"","o":21,"t":1},{"id":"F-LAW-009-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-009"],"lead":"某市整治一条穿城河流：严控沿岸企业污水直排；恢复河岸湿地植被，保护鱼类栖息地；推动沿岸园区节能降碳、发展循环经济。","stem":"对照2026年施行的生态环境法典的编章结构，下列理解有误的是（）","opts":[{"text":"严控沿岸企业污水直排，贴近污染防治编关于污染物治理的制度重心","correct":false,"why":"说法正确，不选：污水直排属于污染物治理，是污染防治编的制度重心。"},{"text":"恢复湿地植被、保护鱼类栖息地，贴近生态保护编的制度重心","correct":false,"why":"说法正确，不选：湿地植被和鱼类栖息地涉及生态系统和物种保护，是生态保护编的制度重心。"},{"text":"推动园区节能降碳、发展循环经济，贴近生态保护编的制度重心","correct":true,"why":"说法有误，应选：把绿色低碳发展编换成了生态保护编（对应关系替换）。循环经济、能源节约与转型、气候变化等是第四编绿色低碳发展的制度重心。"},{"text":"这项整治横跨多个分编，需协同适用，不宜强行归入某一编","correct":false,"why":"说法正确，不选：三大实体编按制度重心组织，现实问题可以跨编协同，不能强行断定只属于某一编。"}],"answer":"","fix":"","explain":"生态环境法典五编依次为总则、污染防治、生态保护、绿色低碳发展、法律责任和附则。污染防治管污染物和公害，生态保护管生态系统、物种、自然资源和重要地理单元，绿色低碳发展管循环经济、能源节约与转型、气候变化等；一个现实问题可以横跨几编。","condition":"中国大陆法制；生态环境法典（2026年3月12日通过，2026年8月15日起施行）的编章结构；截至2026-11-27。","refs":["LAW-S03"],"origin":"自编","review":"","o":45,"t":1},{"id":"F-LAW-010-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-010"],"lead":"","stem":"根据全国人大常委会法工委宪法室2026年的文章，我国法律部门由七个增加至八个，新增的是社会法。","opts":[],"answer":"错误","fix":"根据全国人大常委会法工委宪法室2026年的文章，我国法律部门由七个增加至八个，新增的是生态环境法。","explain":"错因：把新增部门换成了原有部门（对象替换）。原有七个为宪法相关法、民法商法、行政法、经济法、社会法、刑法、诉讼与非诉讼程序法，2026年新增生态环境法。这里的“部门”指法律规范的分类，不是新设国务院部门；宪法仍是法律体系的核心。2026年以前的材料按当时七个部门的表述作答，不倒改旧题。","condition":"全国人大常委会法工委宪法室《编纂生态环境法典 推动宪法关于生态文明制度规定全面有效实施》（2026年；生态环境部网站2026-07-23转载）；截至2026-11-27。","refs":["LAW-S05"],"origin":"自编","review":"","o":173,"t":2},{"id":"F-LAW-011-1","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"LAW","cards":["LAW-011"],"lead":"","stem":"依照生态环境法典，某地修复废弃矿山时以封山育林、自然恢复为主，只在水土流失严重的地段补种乡土树种，这一做法符合自然恢复与人工修复相结合的要求。","opts":[],"answer":"正确","fix":"","explain":"生态环境法典要求生态修复坚持自然恢复为主、自然恢复与人工修复相结合。“为主”不是“只靠”，在必要地段辅以人工修复不违背要求；易错在把补种树木看成违背自然恢复为主。","condition":"中国大陆法制；生态环境法典（2026年3月12日通过，2026年8月15日起施行）关于生态修复的规定；截至2026-11-27。","refs":["LAW-S03"],"origin":"自编","review":""},{"id":"F-LAW-011-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-011"],"lead":"生态环境法典规定，生态环境保护坚持预防为主、系统治理、生态优先、绿色发展、公众参与、损害担责的原则，并强调以水定城、以水定地、以水定人、以水定产。","stem":"下列做法中，符合上述要求的有（）","opts":[{"text":"某县先按招商意向扩大高耗水产业规模，出现用水缺口后再申请跨流域调水补足","correct":false,"why":"错因：把约束条件倒置成需求满足（关系替换）。以水定产要求产业布局和规模与水资源承载能力相适应，不是先扩张、再调水补缺口。"},{"text":"某地编制流域保护方案时，公开征求沿岸居民和企业的意见","correct":true,"why":"体现公众参与原则：公开方案、听取沿岸居民和企业意见。"},{"text":"某流域上下游地区联合制定治污方案，不把治污压力转嫁给下游","correct":true,"why":"体现系统治理：统筹上下游，不把污染或治理压力转移给下游。"},{"text":"某企业在项目设计阶段同步配套污染防治设施，从源头减少污染物产生","correct":true,"why":"体现预防为主：在源头防控污染，而不是等损害发生后再交钱补救。"}],"answer":"","fix":"","explain":"法典原则要落到行动：预防为主重源头，系统治理重统筹，公众参与重公开和参与渠道；以水定城、定地、定人、定产，是让发展的布局和规模服从水资源承载能力。方向相近但行动相反的做法（先扩张、后调水）不符合要求。","condition":"中国大陆法制；生态环境法典（2026年3月12日通过，2026年8月15日起施行）第6条原则及水资源刚性约束的规定；截至2026-11-27。","refs":["LAW-S03"],"origin":"自编","review":"","o":91,"t":1},{"id":"F-LAW-012-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"LAW","cards":["LAW-012"],"lead":"根据2026年3月12日通过、自公布之日起施行的国家发展规划法，国家发展规划（国民经济和社会发展五年规划纲要）的形成有以下环节：①国务院提请全国人民代表大会审查批准；②党中央提出制定五年规划的建议；③国务院依据党中央建议组织编制，规划主管部门会同有关部门具体起草；④纲要草案报党中央、国务院审议。","stem":"按法定环节的先后排列，正确的是（）","opts":[{"text":"②④③①","correct":false,"why":"错因：把审议放到了起草之前（阶段顺序替换）。纲要草案先由国务院组织编制、规划主管部门具体起草，再报党中央、国务院审议。"},{"text":"②③④①","correct":true,"why":"党中央提出建议→国务院组织编制、规划主管部门具体起草→报党中央、国务院审议→国务院提请全国人大审查批准。"},{"text":"②③①④","correct":false,"why":"错因：把全国人大审查批准放到了党中央、国务院审议之前（阶段顺序替换）。草案经党中央、国务院审议后，才由国务院提请全国人大审查批准。"},{"text":"③②④①","correct":false,"why":"错因：把组织编制放到了党中央提出建议之前（阶段顺序替换）。国务院依据党中央建议和部署组织编制，建议在先。"}],"answer":"","fix":"","explain":"规划法把政治方向、行政编制和国家权力机关批准接成一条链：党中央提出建议，国务院组织编制、规划主管部门会同有关部门具体起草，报党中央、国务院审议后由国务院提请全国人大审查批准，批准后由国务院组织实施。建议不等于纲要，具体起草的规划主管部门也不是批准机关。","condition":"国家发展规划法（2026年3月12日通过，自公布之日起施行）；对象为国家发展规划，即国民经济和社会发展五年规划纲要；截至2026-11-27。","refs":["IPLAN"],"origin":"自编","review":"","o":145,"t":1},{"id":"F-LAW-013-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-013"],"lead":"某省人民政府组织起草本省国民经济和社会发展五年规划纲要草案。","stem":"依照2026年3月12日通过的国家发展规划法，下列说法正确的是（）","opts":[{"text":"该纲要草案报国务院规划主管部门衔接后，由该部门审查批准，再报本省人大备案","correct":false,"why":"错因：把批准和备案的主体对调（主体与动作替换）。省级纲要由本级人大批准，国务院规划主管部门负责衔接和接受备案，不代替省人大批准。"},{"text":"国家发展规划确需调整的，由国务院提出方案，报党中央同意后提请全国人大审查和批准","correct":false,"why":"错因：把全国人大常委会换成了全国人大（主体替换）。国家发展规划公布后未经法定程序不得调整；确需调整的，由国务院提出方案，报党中央同意后，提请全国人大常委会审查和批准（第21条）。"},{"text":"规划体系以国土空间规划为统领、国家发展规划为基础、专项规划和区域规划为支撑","correct":false,"why":"错因：把统领与基础对换（关系替换）。规划体系以国家发展规划为统领、国土空间规划为基础、专项和区域规划为支撑。"},{"text":"该纲要草案报国务院规划主管部门衔接，经本省人民代表大会批准后，再报该部门备案","correct":true,"why":"省级五年规划纲要草案报国务院规划主管部门衔接，经本级人大批准后再报该部门备案；衔接和备案维护全国一致，批准权在本级人大。"}],"answer":"","fix":"","explain":"规划依法可以调整，但须走法定程序：国家发展规划确需调整的，报党中央同意后提请全国人大常委会审查和批准（第21条）；中期评估报告则是提请全国人大常委会审议（第30条），评估本身不改变规划目标。省级国民经济和社会发展五年规划纲要由本级人大批准，向国务院规划主管部门衔接并备案，不由国务院批准（第36条）。国家发展规划是统领，国土空间规划是基础。","condition":"国家发展规划法（2026年3月12日通过，自公布之日起施行）第21、30、36条；省级规划指省级国民经济和社会发展五年规划纲要，不同于国土空间规划等另有审批程序的规划；截至2026-11-27（E-DB-07）。","refs":["IPLAN","E-DB-07"],"origin":"自编","review":""},{"id":"F-LAW-014-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-014"],"lead":"2026年3月，甲因琐事殴打邻居乙致其受伤，公安机关依据现行治安管理处罚法对甲处以行政拘留并处罚款。","stem":"下列说法正确的是（）","opts":[{"text":"甲受到的是行政处罚，乙仍可依法要求甲赔偿医疗费等损失","correct":true,"why":"治安管理处罚是行政处罚的一类，行政拘留、罚款都属于治安管理处罚；违法行为对他人造成损害的，除受治安管理处罚外，还应依法承担民事责任。"},{"text":"甲被限制了人身自由，说明其行为已构成犯罪，受到的是刑罚","correct":false,"why":"错因：用“是否被关起来”的外观替换了法律性质（性质替换）。行政拘留是行政处罚，不是刑罚，不能据此断定构成犯罪。"},{"text":"甲已向国家缴纳罚款，其对乙的民事赔偿责任随之免除","correct":false,"why":"错因：用公法处罚吸收了私法赔偿（关系替换）。罚款是对违反治安管理的处罚，承担行政责任不当然排除对乙的民事责任。"},{"text":"若甲的行为构成犯罪，公安机关也可以用行政拘留代替刑事处罚","correct":false,"why":"错因：把刑事责任换成了治安处罚（层级替换）。构成犯罪的应依法追究刑事责任，不得以治安管理处罚代替刑事处罚。"}],"answer":"","fix":"","explain":"民事责任处理民事权益受侵害后的责任，行政处罚针对违反行政管理秩序的行为，刑事责任针对构成犯罪的行为。治安管理处罚是行政处罚的一类，行政拘留不是刑罚；赔偿、行政处理、刑事追责不是选一个就全部结清。","condition":"中国大陆法制；治安管理处罚法（2025年6月27日修订通过，2026年1月1日起施行）；民法典第187条；行政处罚法（2021年修订）；行为和处理均发生在2026年；截至2026-11-27。","refs":["LAW-S02","LAW-S07","LAW-S14"],"origin":"自编","review":""},{"id":"F-LAW-014-2","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"LAW","cards":["LAW-014","LAW-015"],"lead":"2026年，某市几起事件中分别出现了下列处理结果。","stem":"其中属于行政处罚的有（）","opts":[{"text":"人民法院依照刑法，对构成犯罪的被告人判处拘役","correct":false,"why":"错因：用“被限制自由”的外观替换了法律性质（性质替换）。对构成犯罪者判处的拘役是刑罚，属于刑事责任，不是行政拘留。"},{"text":"公安机关依照治安管理处罚法，对违反治安管理的人处以行政拘留","correct":true,"why":"行政拘留是治安管理处罚的一种，治安管理处罚属于行政处罚。"},{"text":"人民法院依照民法典，判令侵权人赔偿受害人医疗费等损失","correct":false,"why":"错因：把民事责任当成了行政处罚（类别替换）。判令赔偿处理的是民事权益受侵害后的民事责任。"},{"text":"公安机关依照治安管理处罚法，吊销由其发放的许可证件","correct":true,"why":"吊销公安机关发放的许可证件是治安管理处罚的一种，属于行政处罚。"}],"answer":"","fix":"","explain":"分类看法律性质和处理机制：治安管理处罚（警告、罚款、行政拘留、吊销公安机关发放的许可证件）属于行政处罚；对犯罪判处的刑罚属于刑事责任；判令赔偿属于民事责任。不看是否“被关起来”或“交了钱”。","condition":"中国大陆法制；治安管理处罚法（2025年6月27日修订通过，2026年1月1日起施行）；行政处罚法（2021年修订）第9条；截至2026-11-27。","refs":["LAW-S07","LAW-S14","LAW-S02"],"origin":"自编","review":"","o":111,"t":1},{"id":"F-LAW-015-1","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-015"],"lead":"2026年3月，某人在公共场所实施扰乱秩序的行为，当地公安机关依据现行治安管理处罚法办理此案。","stem":"关于该法的适用，下列说法正确的是（）","opts":[{"text":"该行为既然违反了治安管理处罚法，就说明它在法律上已经构成了犯罪","correct":false,"why":"错因：把行政违法与犯罪混为一层（层级替换）。是否构成犯罪须依刑法判断，违反治安管理不等于犯罪。"},{"text":"治安管理处罚中的吊销许可证件，也包括吊销市场监管部门发放的营业执照","correct":false,"why":"错因：扩大了吊销的对象（范围替换）。治安管理处罚中的吊销，只针对公安机关发放的许可证件。"},{"text":"构成犯罪的依法追究刑事责任，尚不够刑事处罚的依法给予治安管理处罚","correct":true,"why":"治安管理处罚法规定，构成犯罪的依法追究刑事责任；尚不够刑事处罚的，依法给予治安管理处罚。"},{"text":"该行为如果尚不够刑事处罚，公安机关便不能再追究行为人的法律责任","correct":false,"why":"错因：把“不构成犯罪”换成了“没有法律责任”（后果替换）。尚不够刑事处罚的，由公安机关依法给予治安管理处罚。"}],"answer":"","fix":"","explain":"先识别版本：2026年说“现行治安管理处罚法”，指2025年6月27日修订通过、2026年1月1日起施行的版本。再判规则：构成犯罪的追究刑事责任，尚不够刑事处罚的给予治安管理处罚；治安管理处罚包括警告、罚款、行政拘留、吊销公安机关发放的许可证件。不构成犯罪不等于没有法律责任。","condition":"中国大陆法制；治安管理处罚法（2025年6月27日修订通过，2026年1月1日起施行）；行为发生和处理均在2026年；截至2026-11-27。","refs":["LAW-S07"],"origin":"自编","review":""},{"id":"F-LAW-015-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":
