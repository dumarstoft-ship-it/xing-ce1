在建（阶段替换）。方案把标的限定在已建成并投放至海上的相关养殖设施设备；覆盖在建设施的产品，主管部门解读只列为鼓励探索的后续方向。"},{"text":"已建成并投放至海上的深水养殖网箱，可以作为设施设备险的保险标的","correct":true,"why":"方案第二部分把标的限定在“已建成并投放至海上的”相关养殖设施设备，深水养殖网箱等设施可落入标的范围。"},{"text":"在海上作业的养殖工人，不属于此次设施设备险的保险标的","correct":true,"why":"此次补的是设施设备风险，海上工作人员是另一类对象；主管部门解读说明，原有的人身意外伤害保险面向工作人员。"},{"text":"网箱里养殖的金鲳鱼，不属于此次设施设备险的保险标的","correct":true,"why":"此次补的是设施设备风险，网箱里的水产品是另一类对象；主管部门解读说明，原有养殖保险面向养殖水产品。"}],"answer":"","fix":"","explain":"设施设备险的标的是“已建成并投放至海上的”相关养殖设施设备：在建设施、网箱里的水产品和海上工作人员分别是不同对象，不在此次标的之内。依据：E-GD-08（《广东省现代化海洋牧场设施设备险实施方案》第二部分，粤农农规〔2026〕4号；湛江市海洋与渔业局2026-09-01政策解读）。","condition":"依据广东省农业农村厅、广东省财政厅、国家金融监督管理总局广东监管局《广东省现代化海洋牧场设施设备险实施方案》（粤农农规〔2026〕4号，2026-04-21印发；实施期2026-05-23至2028-12-31，截至2026年11月27日在实施期内）。材料为自编情境。","refs":["E-GD-08"],"origin":"自编","review":""},{"id":"F-K-GD-08-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["K-GD-08"],"lead":"甲公司拥有一组已建成并投放至海上的深水养殖网箱，所在地市在《广东省现代化海洋牧场设施设备险实施方案》（粤农农规〔2026〕4号）所列范围内。甲公司把网箱租给乙合作社经营使用。2026年8月，甲、乙都想为这组网箱投保设施设备险。","stem":"按该方案，下列说法正确的是（）","opts":[{"text":"只有所有权人甲公司可以作为参保人，使用权人乙合作社不能投保","correct":false,"why":"错因：把“所有权人或者使用权人”缩成了只有所有权人（主体替换）。方案规定参保人可为所有权人或者使用权人。"},{"text":"甲、乙可以各自为这组网箱投保一份，出险后分别获得赔付","correct":false,"why":"错因：忽略了“同一设施同一时间只能投保一次”（条件替换）。所有权人和使用权人要协商确定由谁投保。"},{"text":"甲、乙可以协商确定由其中一方投保，这组网箱同一时间只能投保一次","correct":true,"why":"方案规定参保人可为所有权人或者使用权人，同一设施同一时间只能投保一次，由双方协商投保主体。"},{"text":"方案实施期到2028年12月31日，这份保单的保险期间也就到那一天","correct":false,"why":"错因：把政策实施期当成了保单的投保周期（时间替换）。方案实施期为2026年5月23日至2028年12月31日，一个投保周期为一年。"}],"answer":"","fix":"","explain":"投保主体和保单周期分开看：参保人可为所有权人或者使用权人，同一设施同一时间只能投保一次，由双方协商；方案实施期跨年度，单份保单的投保周期为一年。依据：E-GD-08（《广东省现代化海洋牧场设施设备险实施方案》第二部分，粤农农规〔2026〕4号）。","condition":"依据广东省农业农村厅、广东省财政厅、国家金融监督管理总局广东监管局《广东省现代化海洋牧场设施设备险实施方案》（粤农农规〔2026〕4号，2026-04-21印发；实施期2026-05-23至2028-12-31）。材料为自编情境。","refs":["E-GD-08"],"origin":"自编","review":""},{"id":"F-GD-018-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-018"],"lead":"某县拟在近海引入多个开放式养殖用海类的现代化海洋牧场项目，准备按广东推广的“标准海”供应模式推进。","stem":"按《2026年广东省政府工作报告》附件2对“标准海”的释义，下列做法正确的是（）","opts":[{"text":"先把宗海出让给各项目单位，再由各项目单位分别去完成区域整体海域使用论证等前期工作","correct":false,"why":"错因：把先后顺序和承担主体都换了（阶段、主体替换）。应由县级以上人民政府行政主管部门提前完成区域整体论证等前期工作，再就单个项目的宗海办理审批或出让。"},{"text":"县级以上政府行政主管部门先划定适养海域、完成区域整体论证，再就单个项目宗海审批或出让","correct":true,"why":"报告附件2释义：县级以上人民政府行政主管部门依据相关规划划定适养海域，提前完成区域整体海域使用论证等用海前期工作，合理设置控制性指标，再就可用于单个现代化海洋牧场项目（开放式养殖用海类）的宗海办理审批或出让。"},{"text":"区域整体论证已由主管部门提前完成，单个项目申请用海时仍须自行再做一遍同一项区域论证","correct":false,"why":"错因：把“免重复论证”换成了“重新论证”（动作替换）。区域前期工作已经提前完成，相应的单个海洋牧场项目申请用海时无需再做这项论证；减少重复论证的前提是区域前期工作已经完成。"},{"text":"“标准海”供应的海域由项目单位按需要自行选定，不需要依据相关规划划定适养海域","correct":false,"why":"错因：把划定海域的主体和依据都换了（主体、条件替换）。适养海域由县级以上人民政府行政主管部门依据相关规划划定，“标准海”只在这一范围内供应。"}],"answer":"","fix":"","explain":"“标准海”分三个环节：县级以上人民政府行政主管部门依据相关规划划定适养海域，提前完成区域整体海域使用论证等前期工作并设置控制性指标（如离岸距离、水深、用海面积）；再就单个现代化海洋牧场项目（开放式养殖用海类）的宗海办理审批或出让；区域前期工作已完成的，单个项目不必重复同一项论证。减少重复论证不等于放开无序养殖，其他用海许可另核；《广东省国民经济和社会发展第十五个五年规划纲要》把推广“标准海”供应写入“创新管海用海机制”。依据：E-GD-09（《2026年广东省政府工作报告》附件2第13条；省自然资源厅2023年通知第（四）项）。","condition":"依据《2026年广东省政府工作报告》附件2第13条对“标准海”的释义；省自然资源厅《关于加强海洋资源要素保障 促进现代化海洋牧场高质量发展的通知》（2023-08-01起施行，有效期5年）第（四）项在海洋产业园内探索统一论证、单个项目申请用海时无需再做；《广东省国民经济和社会发展第十五个五年规划纲要》（省十四届人大五次会议2026-01-29审查批准）提出推广“标准海”供应。本题只涉及“标准海”这一特定机制，其他用海许可另核。材料为自编情境。","refs":["E-GD-09","GD-S01"],"origin":"自编","review":""},{"id":"F-P4-12-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"P4","cards":["P4-12","P4-04","LAW-012"],"lead":"2026年3月，十四届全国人大四次会议批准了《中华人民共和国国民经济和社会发展第十五个五年规划纲要》。","stem":"关于这份纲要从草案到批准、公布过程中的主体与动作，下列对应正确的是（）","opts":[{"text":"党的二十届四中全会——审查国务院提出的纲要草案","correct":false,"why":"错因：把审查纲要草案的动作安到了党的中央全会上（被替换的是：主体与文件）。二十届四中全会2025年10月23日通过的是《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》；国务院提出的纲要草案由十四届全国人大四次会议审查。"},{"text":"全国人大财政经济委员会——提交纲要草案的审查结果报告","correct":true,"why":"全国人大关于纲要的决议写明，大会同意财政经济委员会的审查结果报告。财经委的动作是审查并提交审查结果报告，不是批准纲要。"},{"text":"国务院——作出批准国家“十五五”规划纲要的决定","correct":false,"why":"错因：把提出草案的机关换成了批准机关（被替换的是：主体与动作）。纲要草案由国务院提出，作出批准决定的是全国人民代表大会。"},{"text":"新华社——3月13日受权播发纲要全文，当天即为批准日","correct":false,"why":"错因：把全文播发日当成了批准日（被替换的是：阶段——播发与批准）。大会2026年3月12日决定批准纲要，新华社3月13日受权播发纲要全文。"}],"answer":"","fix":"","explain":"国家“十五五”规划经过几个主体的不同动作：二十届四中全会（2025年10月23日）通过党中央的《建议》；国务院提出纲要草案；全国人大财政经济委员会提交审查结果报告；十四届全国人大四次会议2026年3月12日同意该报告并决定批准纲要；3月13日新华社受权播发纲要全文。习近平关于《建议》的说明指出，《建议》稿所列发展目标主要是定性要求，必要的定量要求和部分具体部署留待编制《纲要》时研究确定——建议与纲要是不同环节的不同文件。依据：E-PT-01（全国人大关于“十五五”规划纲要的决议首段；《建议》题注；关于《建议》的说明第三部分第二点）。","condition":"国家“十五五”规划纲要即《中华人民共和国国民经济和社会发展第十五个五年规划纲要》；依据十四届全国人大四次会议2026-03-12关于纲要的决议（新华社受权发布）和2026-03-13受权播发的纲要全文；截至2026-11-27。","refs":["E-PT-01","T15","G15SUG","IPLEN4"],"origin":"自编","review":"","o":53,"t":1},{"id":"F-P4-13-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P4","cards":["P4-13","P4-12","GD-006"],"lead":"某同学为学习小组整理“十五五”时期经济增长目标的几种表述，每条都注明了出处。其中“国家‘十五五’规划纲要”指2026年3月十四届全国人大四次会议批准的《中华人民共和国国民经济和社会发展第十五个五年规划纲要》。","stem":"下列表述与所注文件相符的有（）","opts":[{"text":"国务院2026年《政府工作报告》：2026年全国经济增长预期目标为4.5%—5%","correct":true,"why":"报告第三部分写“经济增长4.5%－5%，在实际工作中努力争取更好结果”，这是全国2026年一年的预期目标。"},{"text":"国家“十五五”规划纲要：“十五五”时期全国国内生产总值年均增长5%左右","correct":false,"why":"错因：把广东省纲要的五年年均目标移到了国家纲要上（被替换的是：层级——省级文件换成了国家文件）。“全省GDP年均增长5%左右”出自《广东省国民经济和社会发展第十五个五年规划纲要》；国家纲要第三章对国内生产总值增长写的是“保持在合理区间、各年度视情提出”。"},{"text":"国家“十五五”规划纲要：国内生产总值增长保持在合理区间、各年度视情提出","correct":true,"why":"国家纲要第三章在结构优化、质量提升的前提下这样表述：“十五五”五年中，各年度根据情况提出增速。"},{"text":"国家“十五五”规划纲要：到2035年国内生产总值总量比2020年翻一番","correct":false,"why":"错因：把远景比较的对象从人均换成了总量（被替换的是：条件——指标对象）。国家纲要第三章紧接着的远景比较的是2035年与2020年的人均国内生产总值（比2020年翻一番、达到中等发达国家水平），“十五五”期间的任务是为此打好基础。"}],"answer":"","fix":"","explain":"全国口径分三层：2026年度预期目标4.5%—5%（国务院《政府工作报告》）；“十五五”五年中国内生产总值增长“保持在合理区间、各年度视情提出”（国家纲要第三章）；2035年远景比较的是人均国内生产总值与2020年的关系。“年均增长5%左右”是广东省纲要对全省的五年目标，不能移到国家纲要上；全国和广东2026年的年度预期目标恰好都是4.5%—5%，也要按文件分别记。依据：E-PT-02（国家“十五五”规划纲要第三章；国务院2026年《政府工作报告》第三部分）、E-DB-02（《广东省国民经济和社会发展第十五个五年规划纲要》发展目标）。","condition":"国家“十五五”规划纲要即《中华人民共和国国民经济和社会发展第十五个五年规划纲要》（全国人大2026-03-12批准，新华社2026-03-13受权发布）；国务院《政府工作报告》由李强于2026-03-05在十四届全国人大四次会议上作报告；所列数字除注明外均为全国口径；截至2026-11-27。","refs":["E-PT-02","E-DB-02","T15"],"origin":"自编","review":"","o":108,"t":1},{"id":"F-P4-12-6","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-12"],"lead":"某市近两年新建了一批托育机构，每千人口婴幼儿托位数明显上升，但不少托位空置，实际送托的婴幼儿增加不多。","stem":"对照国家“十五五”规划对托育主要指标的调整，下列理解正确的是（）","opts":[{"text":"“十五五”托育主要指标仍是每千人口婴幼儿托位数，托位上升说明指标完成良好","correct":false,"why":"错因：沿用了旧指标（被替换的是：条件——指标版本）。“十五五”已把每千人口婴幼儿托位数指标调整为婴幼儿入托率提高。"},{"text":"婴幼儿入托率与每千人口托位数同样衡量托位供给数量，二者可以互相替代","correct":false,"why":"错因：把两个指标的观察对象混为一谈（被替换的是：条件——指标对象）。托位数看每千人口拥有多少托位，入托率看实际入托的比例，二者不能互相替代。"},{"text":"托位数明显上升，可以据此推断该市婴幼儿入托率已达到规划要求","correct":false,"why":"错因：由托位供给直接推出入托结果（被替换的是：关系——供给数量换成了实际入托）。材料显示托位空置较多；按指标口径也不能推断当地实际入托率是否达到要求。"},{"text":"“十五五”托育主要指标看婴幼儿入托率提高，托位增加不等于入托比例同步提高","correct":true,"why":"国家发展改革委网站刊载的署名解读说明，“十五五”将每千人口婴幼儿托位数指标调整为婴幼儿入托率提高。新指标观察实际入托比例，旧指标观察托位数量，托位多而空置时两者的变化可以不同。"}],"answer":"","fix":"","explain":"托育主要指标的更新：旧指标“每千人口婴幼儿托位数”看托位供给有多少，“十五五”的“婴幼儿入托率提高”看实际入托的比例。托位增加而空置较多时，两种指标的变化可以不同。本题只按指标口径判断，不推断任何城市的实际入托率。依据：E-PT-03（国家发展改革委网站2026-05-01刊载的郑栅洁署名解读《以高质量实施“十五五”规划推进中国式现代化建设》第二部分）。","condition":"国家“十五五”规划纲要（全国人大2026-03-12批准）；托育指标调整据国家发展改革委网站2026-05-01刊载的署名解读（页面注明来源为求是网）；材料为自编情境，不代表任何城市的实际数据。","refs":["E-PT-03","T15"],"origin":"自编","review":""},{"id":"F-P4-12-7","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P4","cards":["P4-12"],"lead":"","stem":"国家“十五五”规划纲要（2026年3月批准）对约束性指标和公共服务、生态环保、安全保障等任务，要求强化责任分解落实；对预期性指标和产业发展、结构调整等任务，要求通过创造良好的政策、体制和法治环境推进。","opts":[],"answer":"正确","fix":"","explain":"正确。纲要第六十二章按指标性质和相应任务区分落实方式：约束性指标与公共服务、生态环保、安全保障等任务并列，要求强化责任分解落实；预期性指标与产业发展、结构调整等任务，要求通过创造良好的政策、体制和法治环境推进。常见错法是把两种落实方式对调。判断执行方式要同时看指标性质和相应任务；国家纲要20项主要指标中，8项为约束性、12项为预期性。依据：E-PT-03（《中华人民共和国国民经济和社会发展第十五个五年规划纲要》第六十二章）。","condition":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》第六十二章（全国人大2026-03-12批准，新华社2026-03-13受权发布）；截至2026-11-27。","refs":["E-PT-03","T15"],"origin":"自编","review":""},{"id":"F-P3-04-5","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P3","cards":["P3-04"],"lead":"","stem":"截至2026年11月27日，在全党开展的树立和践行正确政绩观学习教育已基本结束，学习教育中查摆出的问题也随之不再整改。","opts":[],"answer":"错误","fix":"截至2026年11月27日，在全党开展的树立和践行正确政绩观学习教育已基本结束，但仍要坚持常态化查改问题，对需要长期整改的问题继续跟踪。","explain":"错在后半句：把“学习教育基本结束”推成了“查改问题随之结束”（被替换的是：阶段——集中学习教育的阶段性安排被当成了全部工作的终点）。据新华社2026年8月24日报道，中央党的建设工作领导小组同日召开总结会议，确认这次学习教育已基本结束；习近平作出重要指示，要求坚持常态化查改问题，并提出经常性教育、用好考核、加强管理监督等后续要求。阶段性的学习教育与常态化要求要分开记。依据：E-PT-04（新华社2026-08-24报道《习近平作出重要指示强调巩固拓展树立和践行正确政绩观学习教育成果》及同日总结会议）。","condition":"中共中央办公厅《关于在全党开展树立和践行正确政绩观学习教育的通知》（新华社2026-02-23报道）；新华社2026-08-24报道的习近平重要指示和中央党的建设工作领导小组总结会议；截至2026-11-27。","refs":["E-PT-04","T2026Z"],"origin":"自编","review":""},{"id":"F-P3-04-6","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P3","cards":["P3-04"],"lead":"2026年春节假期后，某市直机关党委按照中共中央办公厅通知开展树立和践行正确政绩观学习教育。研究实施方案时，出现了几种意见。","stem":"下列意见中，符合通知所定组织方式的是（）","opts":[{"text":"把党员分成两批，领导班子成员先学，其他党员后学","correct":false,"why":"错因：把“不分批次”换成了分批开展（被替换的是：条件——组织方式）。通知明确这次学习教育不分批次、不划阶段。"},{"text":"把查摆、整改、建章立制排成三个阶段，每月开始一个","correct":false,"why":"错因：把几项工作安排编成了按月依次开始的阶段（被替换的是：阶段）。查摆、整改、建章立制都是工作安排，通知要求不划阶段。"},{"text":"不分批次、不划阶段，一体推进学查改","correct":true,"why":"通知规定这次学习教育“不分批次、不划阶段”，以一体推进学查改为抓手。"},{"text":"既然不划阶段，就不必安排启动和结束的时间","correct":false,"why":"错因：把“不划阶段”误解成没有时间安排（被替换的是：条件）。通知同时安排了春节假期后启动、7月底基本结束。"}],"answer":"","fix":"","explain":"通知明确这次学习教育在全党开展，以县处级以上领导班子和领导干部特别是“一把手”为重点，“不分批次、不划阶段”，安排春节假期后启动、7月底基本结束。查摆、整改、建章立制都是工作安排，不宜编成按月依次开始的三个阶段；“不划阶段”也不等于没有起止时间。依据：E-PT-04（中共中央办公厅《关于在全党开展树立和践行正确政绩观学习教育的通知》，新华社2026-02-23报道）。","condition":"中共中央办公厅《关于在全党开展树立和践行正确政绩观学习教育的通知》（新华社2026-02-23报道，报道未给出通知的签发日）；“一体推进学查改”出自同一通知；材料为自编情境。","refs":["E-PT-04","T2026Z"],"origin":"自编","review":""},{"id":"F-P3-07-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P3","cards":["P3-07"],"lead":"2026年10月29日，党的二十届五中全会通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。全会公报和《决定》都对党性建设作出部署。","stem":"下列表述与全会公报和《决定》相符的是（）","opts":[{"text":"加强党性修养的根本途径，是学习、领悟、运用党的创新理论","correct":true,"why":"《决定》第二部分第（二）项写明，把学习、领悟、运用党的创新理论作为加强党性修养的根本途径。"},{"text":"加强党性修养的根本途径，是增强党性","correct":false,"why":"错因：把“任务”放到了“途径”的位置（被替换的是：关系）。增强党性是全面从严治党的根本性任务（全会公报），加强党性修养的根本途径是学习、领悟、运用党的创新理论。"},{"text":"全面从严治党的根本性任务，是学习、领悟、运用党的创新理论","correct":false,"why":"错因：把“途径”放到了“任务”的位置（被替换的是：关系）。全会公报明言，增强党性是全面从严治党的根本性任务。"},{"text":"统领党的各方面建设的，是增强党性","correct":false,"why":"错因：把统领地位从党的政治建设换给了增强党性（被替换的是：主体）。党的政治建设具有统领地位，增强党性是全面从严治党的根本性任务，两者角色不同。"}],"answer":"","fix":"","explain":"同一次全会的公报和《决定》里有几个“根本”“统领”，各有所指：增强党性是全面从严治党的根本性任务（做什么）；学习、领悟、运用党的创新理论是加强党性修养的根本途径（怎样加强修养）；党的政治建设处于统领地位（以什么统领党的建设）。只问“根本是什么”会有多个答案，先看题干问的是任务、途径还是统领。依据：E-PT-05（二十届五中全会公报；《决定》第二部分第（二）项）。","condition":"《中国共产党第二十届中央委员会第五次全体会议公报》（2026-10-29通过并发布）；《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（2026-10-29通过，新华社2026-11-01全文公开）。","refs":["E-PT-05","TPL5","TPL5DEC"],"origin":"自编","review":"","o":2,"t":1},{"id":"F-P4-11-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-11","P3-07"],"lead":"某省直单位党组听取本单位领导班子成员履行管党治党责任情况的汇报；派驻该单位的纪检监察组报告该单位领导班子成员特别是“一把手”履职用权情况，以及本组履行监督责任的情况。","stem":"依据2026年二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，关于这两项报告的方向和最低频次，下列说法正确的是（）","opts":[{"text":"党组至少每半年听取一次汇报；纪检监察组至少每年向派出机关报告一次","correct":false,"why":"错因：两个最低频次对调（被替换的是：条件——频次）。党委（党组）听取汇报至少每年一次，派驻纪检监察组向派出机关报告至少每半年一次。"},{"text":"党组至少每年听取一次汇报；纪检监察组至少每半年向派出机关报告一次","correct":true,"why":"《决定》写明：县级以上党委（党组）至少每年听取一次领导班子成员履行管党治党责任情况汇报；下级纪委（派驻纪检监察组）至少每半年向上级纪委（派出机关）报告一次。"},{"text":"党组至少每年听取一次汇报；纪检监察组至少每半年向本单位党组报告一次","correct":false,"why":"错因：把“向上报告”的接收方换成了被监督单位的党组（被替换的是：关系——报告方向）。派驻纪检监察组向派出机关报告。"},{"text":"党组至少每半年听取一次汇报；纪检监察组至少每年向本单位党组报告一次","correct":false,"why":"错因：既把两个最低频次对调，又把报告的接收方换成了本单位党组（被替换的是：条件与关系——频次和报告方向）。党组听取汇报至少每年一次；派驻纪检监察组至少每半年向派出机关报告一次。"}],"answer":"","fix":"","explain":"同一段规定了两个方向不同的动作：县级以上党委（党组）至少每年听取一次领导班子成员履行管党治党责任情况汇报；下级纪委（派驻纪检监察组）至少每半年向上级纪委（派出机关）报告一次领导班子成员特别是“一把手”履职用权情况，同时报告自身履行监督责任的情况。前者是党委（党组）听取本级班子成员汇报，后者是向上级报告；两个频次只限于这段规定的具体报告事项。依据：E-PT-06（《决定》“持之以恒推进全面从严治党，是全党的共同政治责任”所在段）。","condition":"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（2026-10-29经二十届五中全会通过，新华社2026-11-01全文公开）；省直单位党组属于县级以上党组；材料为自编情境。","refs":["E-PT-06","TPL5DEC"],"origin":"自编","review":"","o":33,"t":1},{"id":"F-P3-07-6","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"P3","cards":["P3-07","P4-11"],"lead":"","stem":"依据二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，在全面从严治党的责任分工中，纪委承担监督责任，主体责任由党委（党组）承担。","opts":[],"answer":"正确","fix":"","explain":"正确。《决定》在“持之以恒推进全面从严治党，是全党的共同政治责任”所在段，把主体责任赋予党委（党组），把监督责任赋予纪委；党委（党组）书记承担第一责任人责任，班子其他成员履行“一岗双责”。常见错法是把纪委写成承担主体责任，或把第一责任人换成班子其他成员。依据：E-PT-06（《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》同段）。","condition":"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》（2026-10-29经二十届五中全会通过，新华社2026-11-01全文公开）。","refs":["E-PT-06","TPL5DEC"],"origin":"自编","review":"","o":6,"t":1},{"id":"F-K-PT-07-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"P3","cards":["K-PT-07"],"lead":"小陈从外省来广东务工，属于流动人员。他在务工所在地的党组织申请入党，已被确定为入党积极分子；经过一年多的培养教育和考察，所在党支部拟将他列为发展对象。","stem":"依据2026年修订的《中国共产党发展党员工作细则》，下列说法正确的有（）","opts":[{"text":"拟列为发展对象的，经党支部委员会会议研究讨论、报上级党委备案后，即可列为发展对象","correct":false,"why":"错因：沿用了2014年旧细则第13条“报上级党委备案后，可列为发展对象”的口径（被替换的是：动作——“同意”换成了“备案”，还漏掉了公示）。2026年修订版第13条要求报上级党委同意拟列为发展对象的进行公示，公示结果不影响发展入党的，才可以列为发展对象。"},{"text":"确定入党积极分子后，应当报上级党委备案","correct":true,"why":"2026年修订版第8条：确定入党积极分子后报上级党委备案。“备案”这一动作留在入党积极分子环节。"},{"text":"对拟列为发展对象的人选进行公示，公示期不超过五个工作日","correct":false,"why":"错因：把下限改成了上限（被替换的是：条件）。第13条规定公示期不少于五个工作日。"},{"text":"小陈拟列为发展对象的，应当在流出地、流入地同时公示","correct":true,"why":"第13条对拟列为发展对象的流动人员，要求流出地、流入地同时公示。"}],"answer":"","fix":"","explain":"2026年修订版把两个环节分开：确定入党积极分子后，按第8条报上级党委备案；拟列为发展对象的，按第13条在一年以上培养教育和考察、基本具备党员条件、听取有关方面意见的前提下，由党支部委员会会议研究讨论，报上级党委同意后公示，公示期不少于五个工作日，流动人员在流出地、流入地同时公示；公示结果不影响发展入党的，可以列为发展对象。2014年旧细则“报上级党委备案后，可列为发展对象”的口径不能用来判断现行程序。依据：E-PT-07（《中国共产党发展党员工作细则》2026年修订版第8、13条；2014年版第13条）。","condition":"《中国共产党发展党员工作细则》2026年修订版：中共中央政治局常委会会议2026-04-02修订，中共中央办公厅2026-05-11发布，第44条规定自发布之日起施行（新华社2026-05-18报道全文）；截至2026-11-27适用该版本；材料为自编情境。","refs":["E-PT-07"],"origin":"自编","review":"","o":140,"t":1},{"id":"F-K-PT-07-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"排序","module":"P3","cards":["K-PT-07"],"lead":"依据2026年修订的《中国共产党发展党员工作细则》，某党支部把一名入党申请人列为发展对象之前，要经过以下环节：①对拟列为发展对象的人选进行公示；②报上级党委同意；③确定为入党积极分子，报上级党委备案；④经一年以上培养教育和考察、听取有关方面意见后，由党支部委员会会议研究讨论。","stem":"按先后顺序排列，正确的是（）","opts":[{"text":"③④①②","correct":false,"why":"错因：把公示放到了报上级党委同意之前（被替换的是：阶段顺序）。第13条是报上级党委同意拟列为发展对象的，再进行公示。"},{"text":"④③①②","correct":false,"why":"错因：既把党支部委员会会议研究讨论放到了确定入党积极分子之前，又把公示放到了报上级党委同意之前（被替换的是：阶段顺序）。先确定入党积极分子，经一年以上培养教育和考察后才研究讨论拟列为发展对象；报上级党委同意后再公示。"},{"text":"③④②①","correct":true,"why":"确定入党积极分子并报上级党委备案（第8条）→培养考察一年以上，党支部委员会会议研究讨论→报上级党委同意→公示（第13条）。"},{"text":"③②④①","correct":false,"why":"错因：把报上级党委同意放到了党支部委员会会议研究讨论之前（被替换的是：阶段顺序）。先由党支部委员会会议研究讨论，再报上级党委同意。"}],"answer":"","fix":"","explain":"现行程序：确定入党积极分子后报上级党委备案（第8条）→经一年以上培养教育和考察、基本具备党员条件、听取有关方面意见，由党支部委员会会议研究讨论→报上级党委同意→对拟列为发展对象的进行公示，公示期不少于五个工作日→公示结果不影响发展入党的，可以列为发展对象（第13条）。上级党委“同意”在公示之前；“备案”用在入党积极分子环节。依据：E-PT-07（《中国共产党发展党员工作细则》2026年修订版第8、13条）。","condition":"《中国共产党发展党员工作细则》2026年修订版（中共中央办公厅2026-05-11发布，第44条规定自发布之日起施行）；截至2026-11-27。","refs":["E-PT-07"],"origin":"自编","review":""},{"id":"F-GD-004-5","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["GD-004","P2-16"],"lead":"2026年，国家和广东省分别批准了各自的“十五五”规划纲要，两份纲要的规划期都是2026—2030年。","stem":"关于生物制造在下列文件中的列举位置，说法正确的有（）","opts":[{"text":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》在“前瞻布局未来产业”一节列生物制造","correct":true,"why":"国家纲要第五章第二节题为“前瞻布局未来产业”，段中列“量子科技、生物制造”。"},{"text":"中共中央、国务院2026年10月发布的《关于发展新质生产力的意见》把生物制造改列为新兴产业","correct":false,"why":"错因：替换了这份文件的列举位置（被替换的是：关系——文件与产业分组的对应）。《意见》第（八）项仍把生物制造列在前瞻布局未来产业项下。"},{"text":"两份“十五五”规划纲要的规划期相同，所以对生物制造的列举位置也相同","correct":false,"why":"错因：由规划期相同推出列举相同（被替换的是：条件——忽略了文件的发布层级）。两份纲要规划期相同而列举不同，只写“据十五五规划纲要”不足以设唯一答案。"},{"text":"《广东省国民经济和社会发展第十五个五年规划纲要》把生物制造与低空经济等一同列为新兴产业","correct":true,"why":"广东省纲要在“着力打造新兴支柱产业”段写“低空经济、生物制造等新兴产业”，随后另起一段列举未来产业；2026年广东省政府工作报告用的是同一分组。"}],"answer":"","fix":"","explain":"同名同期的两份纲要列法不同：国家纲要在“前瞻布局未来产业”中列生物制造；广东省纲要把生物制造写进“着力打造新兴支柱产业”段的新兴产业，未来产业另起一段，2026年广东省政府工作报告分组相同；中共中央、国务院10月《关于发展新质生产力的意见》仍把生物制造列在前瞻布局未来产业项下。题目要写明国家还是广东省及文件全名；也不要据此推断哪份文件写错或政策调整的动机。依据：E-DB-01（国家纲要第五章第二节；广东省纲要“着力打造新兴支柱产业”段；《关于发展新质生产力的意见》第（八）项）。","condition":"限定使用：须按文件层级和全称判断。国家纲要：十四届全国人大四次会议2026-03-12批准；广东省纲要：省十四届人大五次会议2026-01-29审查批准、省政府2026-03-26印发（粤府〔2026〕24号）；《关于发展新质生产力的意见》：新华社2026-10-09受权发布。按各文件原文的列举位置判断，不代表永久统一的产业分类。","refs":["E-DB-01","T15","GD-S06","TNEW26"],"origin":"自编","review":"","o":150,"t":1},{"id":"F-GD-006-5","bank":"fm","src":"政常","kind":"政常新题","type":"判断","form":"判断并纠错","module":"GD","cards":["GD-006","P4-12"],"lead":"","stem":"据《广东省国民经济和社会发展第十五个五年规划纲要》，“十五五”时期全省GDP年均增长5%左右，这意味着2026—2030年每一年的增速都不得低于5%。","opts":[],"answer":"错误","fix":"据《广东省国民经济和社会发展第十五个五年规划纲要》，“十五五”时期全省GDP年均增长5%左右，这是五年期间年均增速的预期目标，并未规定每一年的增速下限。","explain":"错在后半句：把五年“年均”“左右”的预期目标改写成了每一年都要达到的下限（被替换的是：条件——年均预期目标换成了逐年约束性下限）。年均目标说的是五年平均，“左右”也表明它不是硬性下限；2026年当年的预期目标另见省政府工作报告“主要预期目标”中的“地区生产总值增长4.5%—5%”，区间下沿就低于5%。年度目标、五年年均目标和统计实绩是三回事，也不能据五年目标认定某一年已经完成。依据：E-DB-02（《广东省国民经济和社会发展第十五个五年规划纲要》发展目标；2026年广东省政府工作报告第三部分首段）。","condition":"《广东省国民经济和社会发展第十五个五年规划纲要》：省十四届人大五次会议2026-01-29审查批准，省政府2026-03-26印发；2026年广东省政府工作报告：2026-01-26向省人大报告，网页2026-01-31刊载；截至2026-11-27。","refs":["E-DB-02","GD-S06","GD-S01"],"origin":"自编","review":""},{"id":"F-GD-016-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-016","GD-015"],"lead":"2026年11月18日至19日，亚太经合组织（APEC）第三十三次领导人非正式会议在深圳举行。11月19日，外交部发布《中国担任2026年亚太经合组织东道主成果清单》。","stem":"依据这份清单的分组，下列说法正确的是（）","opts":[{"text":"《2026年亚太经合组织领导人深圳展望》列入清单的“会议成果文件”","correct":true,"why":"外交部清单把《领导人深圳展望》列入“会议成果文件”，这是领导人会议的共同成果。"},{"text":"“倡议成立世界湾区经济合作联盟（深圳）”属于领导人会议共同的成果文件","correct":false,"why":"错因：把中方举措换成了领导人会议的共同成果（被替换的是：主体）。清单把它列在“中方推进亚太共同体建设重大举措”项下。"},{"text":"清单表明世界湾区经济合作联盟（深圳）已经成立，各成员经济体负有加入义务","correct":false,"why":"错因：把“倡议成立”换成了“已经成立”，又添加了加入义务（被替换的是：动作与阶段）。清单只写“倡议成立”，不足以证明联盟已经成立，也不能证明成员有加入义务。"},{"text":"亚太共同体研究中心（深圳）由APEC各成员经济体共同倡议成立","correct":false,"why":"错因：替换了主体和动作（被替换的是：主体与动作）。清单在中方举措项下写的是“成立亚太共同体研究中心（深圳）”，主体是中方，动作是“成立”。"}],"answer":"","fix":"","explain":"清单的分组本身说明归属：《领导人深圳展望》列入“会议成果文件”，是领导人会议的共同成果，序段明列三大优先领域“开放、创新、合作”；“成立亚太共同体研究中心（深圳）”“倡议成立世界湾区经济合作联盟（深圳）”列在“中方推进亚太共同体建设重大举措”项下，主体是中方，动作一个是“成立”、一个是“倡议成立”。会后成果属低优先级更新，只需分清“谁提出、做到哪一步”，不必背清单数量和全部文件名。依据：E-DB-03（外交部《中国担任2026年亚太经合组织东道主成果清单》；《2026年亚太经合组织领导人深圳展望》序段）。","condition":"外交部《中国担任2026年亚太经合组织东道主成果清单》与《2026年亚太经合组织领导人深圳展望 建设亚太共同体，促进共同繁荣》，网页均于2026-11-19发布；会后细节，属低优先级补充。","refs":["E-DB-03","GD-S12"],"origin":"自编","review":"","o":165,"t":2},{"id":"F-P4-07-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"P4","cards":["P4-07","GD-001"],"lead":"2026年11月25日下午，广东省十四届人大常委会第二十八次会议举行联组会议，围绕“以法治助力我省制造业和服务业协同融合”开展专题询问。","stem":"关于这次专题询问，下列说法正确的是（）","opts":[{"text":"省政府部门负责同志向常委会组成人员提问，人大代表到会应询","correct":false,"why":"错因：提问方与应询方对调（被替换的是：主体）。由省人大常委会组成人员和人大代表提问，省政府部门负责同志应询。"},{"text":"这次专题询问属于制定地方性法规的表决程序","correct":false,"why":"错因：把监督换成了立法（被替换的是：动作）。专题询问是人大常委会监督政府工作的方式，不是表决法规的程序；会议报道也不能证明有关法规已经通过。"},{"text":"会上谈到的制造业服务化等三个方向，就是年初全省高质量发展大会的主题名称","correct":false,"why":"错因：把落实路径当成了会议主题（被替换的是：层级——路径与主题）。2026年2月全省高质量发展大会的主题是制造业与服务业协同发展；“制造业服务化、服务业制造化、平台生态化”是这次专题询问讨论的落实路径。"},{"text":"常委会组成人员和人大代表提问，省政府有关部门负责同志到会应询","correct":true,"why":"报道记载，省人大常委会组成人员和人大代表提问，省政府11个部门负责同志到会应询；这是人大常委会对政府落实工作的监督。"}],"answer":"","fix":"","explain":"专题询问是人大常委会监督政府工作的一种方式：省人大常委会组成人员和人大代表提问，省政府11个部门负责同志到会应询，会议还对跟踪监督和整改提出要求；黄楚平在会上说明，专题询问的形式是“问答”，目的在“整改”。会上谈到的制造业服务化、服务业制造化、平台生态化是这次讲的落实路径，不能替代年初大会“制造业与服务业协同发展”的主题；专题询问也不是制定条例。依据：E-DB-04（广东人大网2026-11-27发布、标注来源南方日报的会议报道）。","condition":"广东省十四届人大常委会第二十八次会议联组会议（2026-11-25下午），据广东人大网2026-11-27发布的报道（标注来源南方日报）；截至2026-11-27。","refs":["E-DB-04","GD-S02"],"origin":"自编","review":""},{"id":"F-GD-012-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["GD-012"],"lead":"甲是一家计划在广州新设企业的外国投资者，想了解哪些领域可以进入、能否享受与内资同等的准入待遇；乙是一家深圳制造企业，准备到海外设厂，需要当地税务、法律方面的综合服务。","stem":"对照《广东省2026年优化国际化一流营商环境工作方案》，下列说法正确的是（）","opts":[{"text":"甲的问题主要对应建设“粤企出海”综合服务港，乙的需求主要对应落实放宽外资准入政策","correct":false,"why":"错因：两家企业对应的措施对调（被替换的是：关系——问题与措施的对应）。外资进入对应“落实放宽外资准入政策”，广东企业赴海外经营对应“粤企出海”综合服务港。"},{"text":"方案提出建设“粤企出海”综合服务港，说明这一服务载体已经建成并投入使用","correct":false,"why":"错因：把年度工作要求换成了已完成的结果（被替换的是：阶段）。年度方案提出的任务本身不能证明服务载体已经建成。"},{"text":"甲的问题主要对应落实放宽外资准入政策，乙的需求主要对应建设“粤企出海”综合服务港","correct":true,"why":"方案第六项“落实放宽外资准入政策”要求落实外商投资准入前国民待遇加负面清单管理制度，解决外资进入和在粤经营问题；第八项建设“粤企出海”综合服务港，列有金融、税收、法律、检测认证等资源，为广东企业赴海外经营服务。"},{"text":"方案经省委、省政府同意，因此其印发机关就是中共广东省委和广东省人民政府","correct":false,"why":"错因：把同意机关当成了印发机关（被替换的是：主体）。方案经省委、省政府同意，由广东省商务厅和中共广东省委外事工作委员会办公室联合印发。"}],"answer":"","fix":"","explain":"国际化营商环境方案里，外资“进来”和粤企“出去”是两类措施：第六项落实放宽外资准入政策，落实外商投资准入前国民待遇加负面清单管理制度，清理内外资不一致措施；第八项建设“粤企出海”综合服务港，提供金融、税收、法律、检测认证等资源。方案经省委、省政府同意，由省商务厅、省委外办2026年1月31日联合印发；年度工作要求本身不能证明服务载体已经建成。依据：E-DB-05（《广东省2026年优化国际化一流营商环境工作方案》第六、八项及印发通知）。","condition":"《广东省2026年优化国际化一流营商环境工作方案》：经省委、省政府同意，广东省商务厅、中共广东省委外事工作委员会办公室2026-01-31联合印发，省外办发布页日期2026-02-02（正文据香港特区政府工业贸易署保存的同份通知及方案核对）；材料为自编情境。","refs":["E-DB-05","GD-S10"],"origin":"自编","review":""},{"id":"F-K-GD-10-1","bank":"fm","src":"政常","kind":"政常新题","type":"多选","form":"多选逐项","module":"GD","cards":["K-GD-10"],"lead":"2026年广东省政府工作报告附件1《2026年省十件民生实事》第六至十项，分别涉及青少年心理健康、基层健康与检查检验互认、农村污水与河湖、食品药品监管、农村公路与出行服务。","stem":"关于这几项指标衡量的对象和范围，下列理解正确的有（）","opts":[{"text":"第八项对“已建成”的自然村生活污水治理设施，安排的是改造提升","correct":true,"why":"第八项针对“已建成自然村的生活污水治理设施”安排改造提升；对既有设施改造运维与新建处理设施是不同动作，题目要保留“已建成”这一条件。"},{"text":"第九项集采中选药品的抽检覆盖目标，限于省内生产的该类药品","correct":true,"why":"第九项分别规定食品快检、抽检与药品监督抽检的范围，其中集采中选药品的抽检覆盖目标限于省内生产的该类药品。"},{"text":"第七项“项目数增加20%以上”，衡量的是患者就诊时结果被互认的比例","correct":false,"why":"错因：把项目库中的项目数换成了患者层面的互认比例（被替换的是：条件——指标的分母）。第七项要求扩大医疗机构间的互认项目库，用“项目数增加20%以上”衡量扩容，不能换算成某位患者就诊时的互认率。"},{"text":"第十项农村公路里程，把新建和改造提升的里程合计计算","correct":true,"why":"第十项同时安排农村公路新建改造、高速公路服务区和充电设施等任务；农村公路里程把新建、改造提升合计计算。"}],"answer":"","fix":"","explain":"看指标先看它量的对象和动作：第七项用“项目数增加20%以上”衡量医疗机构间互认项目库的扩容，不能换算成某位患者就诊时的互认率；第八项针对已建成的自然村生活污水治理设施安排改造提升，与新建处理设施是不同动作；第九项集采中选药品抽检覆盖目标限于省内生产的该类药品；第十项农村公路里程把新建、改造提升合计计算。各项都是2026年的年度安排，不等于已经实现的结果。依据：E-DB-06（2026年广东省政府工作报告附件1《2026年省十件民生实事》第七至十项）。","condition":"2026年广东省政府工作报告附件1《2026年省十件民生实事》（报告2026-01-26，全文网页2026-01-31发布）；仅涉及第六至十项，均为2026年度安排。","refs":["E-DB-06","GD-S01"],"origin":"自编","review":""},{"id":"F-K-GD-10-2","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"GD","cards":["K-GD-10","GD-006"],"lead":"2026年11月26日，广东人大网报道：11月25日召开的省人大常委会会议，听取了省政府关于2026年十件民生实事实施情况及下一年度候选项目安排的报告。","stem":"仅依据这则报道和2026年广东省政府工作报告附件1，下列判断恰当的是（）","opts":[{"text":"十件民生实事是2026年度工作安排，会议听取的是它们的实施情况报告","correct":true,"why":"附件1列的是2026年度工作安排；会议听取的是实施情况报告。这两点都直接来自题干给的材料。"},{"text":"会议听取实施情况报告，表明十件民生实事已全部完成","correct":false,"why":"错因：把听取实施情况报告当成了完成结论（被替换的是：阶段——实施中的报告换成了完成结果）。题干所引报道只说听取了实施情况报告，没有说十项全部完成。"},{"text":"十件民生实事的各项指标，是“十五五”五年期间的累计目标","correct":false,"why":"错因：把年度安排换成了五年目标（被替换的是：条件——时间范围）。十件民生实事是省政府工作报告附件列出的2026年度安排。"},{"text":"会议听取候选项目安排的报告，表明下一年度实事项目已最终确定","correct":false,"why":"错因：把“候选项目安排”推进成了“最终确定”（被替换的是：阶段）。报道只说到候选项目安排这一步。"}],"answer":"","fix":"","explain":"《2026年省十件民生实事》是省政府工作报告附件列出的2026年度工作安排。11月25日省人大常委会会议听取的是实施情况和下一年度候选项目安排的报告：听取实施情况报告不等于完成结论，“候选”也不等于最终确定。任务、实施情况报告和完成结果要分开，材料说到哪一步就判断到哪一步。依据：E-DB-06（2026年广东省政府工作报告附件1；广东人大网2026-11-26会议报道）。","condition":"2026年广东省政府工作报告附件1（报告2026-01-26，网页2026-01-31）；广东人大网2026-11-26发布的省人大常委会会议报道（会议2026-11-25）；截至2026-11-27。","refs":["E-DB-06","GD-S01"],"origin":"自编","review":""},{"id":"F-LAW-013-5","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"配对","module":"LAW","cards":["LAW-013","LAW-012"],"lead":"国家发展规划实施到中期，开展评估形成中期评估报告；另一种情形是，国家发展规划确需调整，形成调整方案。两类文书都由国务院依相应程序报党中央同意后，提请全国人民代表大会常务委员会。","stem":"依照2026年3月12日起施行的《中华人民共和国国家发展规划法》，全国人大常委会对这两类文书的法定动作，对应正确的是（）","opts":[{"text":"中期评估报告——审查和批准；调整方案——审议","correct":false,"why":"错因：两个动作对调（被替换的是：动作）。第30条对中期评估报告用“审议”，第21条对调整方案用“审查和批准”。"},{"text":"中期评估报告——审查和批准；调整方案——审查和批准","correct":false,"why":"错因：把对报告的动作升格成了批准（被替换的是：动作）。中期评估报告提请全国人大常委会审议，评估结果并不自动改变规划目标。"},{"text":"中期评估报告——审议；调整方案——审议","correct":false,"why":"错因：把对调整方案的动作降成了审议（被替换的是：动作）。国家规划确需调整的，提请全国人大常委会审查和批准。"},{"text":"中期评估报告——审议；调整方案——审查和批准","correct":true,"why":"第30条：中期评估报告提请全国人民代表大会常务委员会审议；第21条：确需调整的国家规划提请全国人民代表大会常务委员会审查和批准。"}],"answer":"","fix":"","explain":"同一提请机关（国务院）、同一接收机关（全国人大常委会），法定动作不同：第30条，中期评估报告提请“审议”；第21条，调整方案提请“审查和批准”。两个程序都要依相应程序报党中央同意。中期评估的结果并不自动改变规划目标，改目标要走调整程序。依据：E-DB-07（《中华人民共和国国家发展规划法》第21、30条）。","condition":"《中华人民共和国国家发展规划法》：十四届全国人大四次会议2026-03-12通过，同日以第72号主席令公布，自公布之日起施行；全国适用，截至2026-11-27已施行。","refs":["E-DB-07","IPLAN"],"origin":"自编","review":""},{"id":"F-LAW-013-6","bank":"fm","src":"政常","kind":"政常新题","type":"单选","form":"情境单选","module":"LAW","cards":["LAW-013","P4-12"],"lead":"某同学整理《广东省国民经济和社会发展第十五个五年规划纲要》的时间线，写下四条笔记。","stem":"下列笔记正确的是（）","opts":[{"text":"2026年1月29日省政府印发纲要，3月26日省人大审查批准","correct":false,"why":"错因：批准与印发的主体、日期对调（被替换的是：主体与动作）。省人大1月29日审查批准，省政府3月26日印发。"},{"text":"2026年1月29日省人大审查批准纲要，3月26日省政府印发","correct":true,"why":"广东省纲要题注和印发通知记载：省十四届人大五次会议1月29日审查批准，省政府3月26日印发（粤府〔2026〕24号）。"},{"text":"1月的批准，依据的是3月12日起施行的国家发展规划法第36条","correct":false,"why":"错因：把3月才施行的新法当成1月批准行为当时的依据（被替换的是：阶段——时间方向倒置）。国家发展规划法2026年3月12日通过并自公布之日起施行，晚于1月29日的批准。"},{"text":"4月29日省委老干部局网页刊载纲要之日，才是纲要的批准日","correct":false,"why":"错因：把网页刊载日当成了批准日（被替换的是：阶段——刊载与批准）。批准日是1月29日，4月29日只是网页刊载日。"}],"answer":"","fix":"","explain":"广东省纲要的时间线：省十四届人大五次会议2026年1月29日审查批准→省政府3月26日印发（粤府〔2026〕24号）→省委老干部局网页4月29日刊载。国家发展规划法3月12日通过并自公布之日起施行，其第36条规定省级纲要草案报国务院规划主管部门衔接、经本级人大审查批准后再报备案；这是现行的一般程序，不能倒推为1月批准行为当时已经生效的依据。具体历史事件与现行一般程序要分开看。依据：E-DB-07（国家发展规划法第36条；广东省纲要题注及印发通知）。","condition":"广东省级纲要与国家法律分开判断；日期以纲要题注、印发通知和法律文本为准：省十四届人大五次会议2026-01-29审查批准，省政府2026-03-26印发（粤府〔2026〕24号），省委老干部局2026-04-29刊载；《中华人民共和国国家发展规划法》2026-03-12通过、公布并施行。","refs":["E-DB-07","IPLAN","IGD5","GD-S06"],"origin":"自编","review":""}],"meta":{"title":"马哲概念辨析训练底稿（M1—M7）","prepared_on":"2026-11-26","modules":[{"id":"M1","title":"总论与哲学立场"},{"id":"M2","title":"物质、运动、意识与规律"},{"id":"M3","title":"联系、发展与辩证否定"},{"id":"M4","title":"矛盾分析"},{"id":"M5","title":"五对范畴与思维方法"},{"id":"M6","title":"实践、认识与真理"},{"id":"M7","title":"唯物史观与道德交叉点"}],"appendices":{"origin_reference":{"formation":"马克思主义形成于19世纪40年代；1848年《共产党宣言》发表是公开问世的标志。","social_background":"资本主义发展及工人运动提供社会历史条件；本轮只识别法国里昂工人起义、英国宪章运动、德国西里西亚纺织工人起义三项背景名称。","three_sources":[{"source":"德国古典哲学","representatives":["黑格尔","费尔巴哈"]},{"source":"英国古典政治经济学","representatives":["亚当·斯密","大卫·李嘉图"]},{"source":"英法空想社会主义","representatives":["圣西门","傅立叶","欧文"]}],"three_components":["马克思主义哲学","马克思主义政治经济学","科学社会主义"],"warning":"来源不等于组成；吸收是批判继承，不是照搬原有思想体系。马克思两大发现与马克思主义哲学的两个组成也不可互换。","source_refs":["H","T","G"]},"books":[{"title":"共产党宣言","author":"马克思、恩格斯","recognition":"1848年2月发表，是马克思主义公开问世的标志；也是科学社会主义的纲领性文献。","trap":"不要与《提纲》的写作或《德意志意识形态》的系统论述混同。","source_refs":["H","T"]},{"title":"关于费尔巴哈的提纲","author":"马克思","recognition":"突出科学实践观，强调从实践理解认识和社会生活，是新世界观的重要早期文献。","trap":"写作与后来发表不是同一时间；不把它简单改写为1848年公开问世的标志。","source_refs":["H","B"]},{"title":"德意志意识形态","author":"马克思、恩格斯","recognition":"系统阐述唯物史观的重要早期著作。","trap":"不能把写作年代与完整文本的后期出版年代混为一谈。","source_refs":["H","B"]},{"title":"资本论","author":"马克思","recognition":"系统研究资本主义生产方式，阐述剩余价值等理论的代表作；第二、三卷由恩格斯整理出版。","trap":"本课只记著作定位，不展开马政经；不要说政治经济学这个学科到此才第一次出现。","source_refs":["H","T"]},{"title":"反杜林论","author":"恩格斯","recognition":"对马克思主义理论体系进行较全面、系统阐述的重要著作。","trap":"不要把作者直接换成马克思，也不要只归为一个孤立的自然科学实验报告。","source_refs":["H","T"]}],"corrected_simplifications":[{"risk":"用‘心、我、道、理’等单字直接判定哲学立场。","correction":"按完整命题判断何者第一性；有歧义的名句不制成无条件单选。"},{"risk":"把哲学物质定义为具体物品的简单总和。","correction":"强调对客观实在性共同特征的概括，区分物质范畴与具体形态。"},{"risk":"由肯定因素引出‘任何存在都在价值上合理’。","correction":"肯定因素描述维持现有性质，不是价值正当性的通行证。"},{"risk":"把任何三阶段经历都认定为否定之否定的严格证明。","correction":"例子只帮助理解；须分析内部否定、保留和发展关系。"},{"risk":"把偶然来源写成‘非根本矛盾的外部条件’并据此机械推断。","correction":"通常区分根本矛盾与非根本矛盾、外部条件；不简化成所有内因必然、所有外因偶然。"},{"risk":"把量变到质变的关系删去程度、度及条件。","correction":"任何微小量变不自动已经构成质变。"},{"risk":"把形成理性认识直接当成形成正确认识。","correction":"感性理性是层次，正确错误是是否符合对象；科学加工是获得正确理性认识的条件。"},{"risk":"仅以维护现有经济基础就认定上层建筑促进进步。","correction":"进一步检查它所服务的经济基础是否适合生产力发展。"},{"risk":"把法律主要规范行为改成法律完全没有思想教育作用。","correction":"区分主要作用方式与全部作用，同时不推出可以任意惩罚单纯思想。"}]},"sources":[{"id":"H","title":"用户仓库：颜培天广东政治理论常识（范围底稿）","url":"https://github.com/dumarstoft- ","H29","H30","H32","LAW-001","LAW-002","LAW-003","LAW-005","LAW-007","LAW-008","LAW-009","LAW-012","LAW-014","LAW-015","LAW-016","LAW-017","LAW-019","LAW-020","GD-001","GD-002","GD-004","GD-007","GD-008","GD-010","GD-012","GD-013","GD-014","GD-015","GD-020","K-LAW-01","K-LAW-02","K-LAW-04","K-GD-02","K-GD-03","K-PT-07"]},"fm_cutoff":"2026-11-27","fm_evidence":{"E-LAW-01":{"title":"港澳律师在大湾区内地九市执业已入法","file":"全国法律","status":"可用","kids":"新增 K-LAW-01，关联 GD-010、GD-012、LAW-002。","date":"《全国人民代表大会常务委员会关于修改〈中华人民共和国律师法〉的决定》由十四届全国人大常委会第二十四次会议于 2026-08-28 通过，同日国家主席以第84号令公布，2026-09-01 施行。配套部门规章《粤港澳大湾区律师执业考试和执业活动管理办法》由司法部以第151号令于 2026-10-05 公布，同日起施行。两者在 2026-11-27 均已施行。[修改决定原文，司法部智慧普法平台 08-29 刊载](https://legalinfo.moj.gov.cn/zhfxfzzx/fzzxyw/202608/t20260829_539051.html)｜[主席令，最高法转载新华社 08-28](https://www.court.gov.cn/zixun/xiangqing/510011.html)｜[部令全文，横琴粤澳深度合作区 10-05](https://www.hengqin.gov.cn/lab/flfg/bmgz/content/post_3956263.html)","quote":"修改决定第十项新增律师法第62条，适用于香港特别行政区法律执业者、澳门特别行政区执业律师。法定条件包括“通过国务院司法行政部门组织的粤港澳大湾区律师执业考试，取得内地执业资质”，地点逐一列举广州、深圳、珠海、佛山、惠州、东莞、中山、江门、肇庆，业务限于“规定范围的法律业务”。《办法》第5条规定培训考核、通过接收执业的律所申请、由广东省司法厅发证等环节；第6条把持证人可办业务界定为“本条第二款、第三款规定范围的民商事法律事务（含诉讼业务和非诉讼业务）”。","conclusion":"法律设立通道，部门规章规定具体考试与执业办法。仅有港澳当地律师身份，或仅通过该项考试，均不足以按此制度直接执业。办案须同时符合执业资质、地域和业务类型要求。","explain":"司法部介绍此次修改将原试点上升为国家法律制度。《办法》适用后，可依上述法定程序继续执业。旧试点文件曾列明延长期到 2026-10-04。[《司法部发布〈粤港澳大湾区律师执业考试和执业活动管理办法〉》，中央港澳办转载，页面标注 2026-10-10](https://www.hmo.gov.cn/2026/10/12/ARTIf9gCYtTDKVUgf4V7XsbA261012.shtml)｜[国务院办公厅旧试点办法，2023-09-28 上网，“六、组织实施”末段](https://app.www.gov.cn/govdata/gov/202309/28/507818/article.html)","contrast":"大湾区内地九市／广东全省；考试合格／取得执业证；规定范围的民商事／刑事辩护；国家法律／司法部规章。原底稿 GD-010 只给出职业资格衔接的概念，未见冲突。若沿用旧文件，把 2026-10-04 当作通道终止日，会产生时效错误。"},"E-LAW-02":{"title":"森林法继续适用，林业规划义务在11月变更","file":"全国法律","status":"可用","kids":"新增 K-LAW-02，关联 LAW-008、LAW-030。","date":"《全国人民代表大会常务委员会关于修改〈中华人民共和国突发事件应对法〉等十五部法律的决定》由十四届全国人大常委会第二十五次会议于 2026-11-06 通过，同日国家主席以第90号令公布，自公布之日起施行。下列森林法条文自当日起适用，截至 2026-11-27 已生效。[决定第七项及末段，新华社受权发布 11-06](https://www.xinhuanet.com/politics/20261106/061c7a805f644c5b9ab080b726fafd9e/c.html)｜[第90号主席令，新华社 11-06](https://www.xinhuanet.com/20261106/35c60690c14c4b5085baf67df210e68b/c.html)","quote":"修改后的森林法第25条规定，省级以上人民政府林业主管部门“应当根据森林资源保护发展目标，编制林业发展规划”，接着写明“设区的市、县级人民政府林业主管部门可以根据实际需要编制林业发展规划”。下级规划仍依据上级规划编制。决定还把森林法第74条第3款所引的土壤污染防治法改为生态环境法典。","conclusion":"省级以上为“应当”；设区的市、县级为“可以根据实际需要”。森林法本身继续保留并被修改。生态环境法典第1242条列明同时废止的十部法律，其中有土壤污染防治法，未列森林法。该法典由十四届全国人大四次会议于 2026-03-12 通过，国家主席同日以第70号令公布，2026-08-15 施行。[生态环境法典原文，生态环境部 03-13](https://www.mee.gov.cn/ywgz/fgbz/fl/202603/t20260313_1146496.shtml)｜[第70号主席令，新华社 03-12](https://www.xinhuanet.com/politics/20260312/e244b694b406413a8629c85de13e01c4/c.html)","explain":"本条结论直接取自修改决定和法典附则，未采用单独解读。","contrast":"单行法被修改／整部法律被废止；更新引文／原法全文并入法典。2019年修订的森林法第25条将“县级以上人民政府林业主管部门”统一列为应编规划的主体；用于 2026-11-06 及以后情境时，旧答案必须订正。原底稿 LAW-008 关于保留森林法的结论正确。[旧森林法第25条，生态环境部 2021-06-08 刊载](https://www.mee.gov.cn/ywgz/fgbz/fl/202106/t20210608_836755.shtml)"},"E-LAW-03":{"title":"检察公益诉讼专门法已经公布，次年元旦施行","file":"全国法律","status":"限定使用：2027-01-01施行","kids":"新增 K-LAW-03，关联 P4-07、LAW-030。","date":"《中华人民共和国检察公益诉讼法》由十四届全国人大常委会第二十五次会议于 2026-11-06 通过，国家主席同日以第86号令公布，2027-01-01 施行。2026-11-27 已公布、尚未施行。[法律原文，新华社受权发布 11-06](https://www.xinhuanet.com/legal/20261106/a0a69ea861f041d1b52ff4f3545c8b90/c.html)｜[第86号主席令，新华社 11-06](https://www.xinhuanet.com/politics/20261106/4356972b01c941b0a4627d9fe00c91c6/c.html)","quote":"新法第2条区分人民检察院办理案件与人民法院审理。行政公益诉讼一节第22条规定，对法定领域负有监管职责的行政机关违法行使或不行使职权、导致国家利益或社会公共利益受侵害的，经调查后检察院“应当向行政机关提出公益诉讼检察建议”。第26条列举应终结案件的情形，包括“行政机关已采取整改措施，依法履行职责”。第53条规定“本法自2027年1月1日起施行”。","conclusion":"依据已公布新文本，先经调查提出检察建议；经审查仍存在第13条规定情形的，依第25条提起行政公益诉讼。检察机关办理公益诉讼早已有法定实践，专门法生效日不能充当制度起点。最高检《人民检察院公益诉讼办案规则》已自 2021-07-01 施行。[最高检办案规则，检察机关官网刊载，第1—2条及施行说明](https://www.hengyang.jcy.gov.cn/ycyw1/fgwj/202312/P020231215502966603278.pdf)","explain":"这里采用已公布法条和前期办案规则，没有把媒体评述作为新的法定程序。","contrast":"提出检察建议／作出法院判决；法定程序中整改到位／仍有法定起诉情形；专门法公布／有效施行。底稿关于人大、法院、检察院的职能区分及 LAW-030 的状态判断与此一致。"},"E-LAW-04":{"title":"临时救助向急难发生地申请，有三项条件时应当先行救助","file":"全国法律","status":"可用","kids":"新增 K-LAW-04，关联 P4-07（行政机关职责）。","date":"《中华人民共和国社会救助法》由十四届全国人大常委会第二十二次会议于 2026-04-30 通过，国家主席同日以第75号令公布，2026-07-01 施行。2026-11-27 已施行。[法律全文，商务部全球法规网标注发布 04-30](https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=105779)｜[第75号主席令及法律全文，《人民日报》05-07 刊载](https://paper.people.com.cn/rmrb/pc/content/202605/07/content_30155240.html)","quote":"第37条先列特困人员供养、低保、医疗救助、住房救助、就业救助，一般向户籍所在地乡镇政府或街道办申请，有条件的地方可推进持居住证人员在居住地申请。同条另款规定临时救助申请应“向急难发生地乡镇人民政府、街道办事处提出”。第50条写明“情况紧急、救助金额较小、需立即采取救助措施的，应当先行救助”，并要求紧急情况解除后按规定补充说明情况。[民政部来源的法条转载，石家庄市民政局页面标注 05-06，第37、50条](https://mzj.sjz.gov.cn/columns/db9a6c71-2591-48e4-9c94-9d0b08c5d1bd/202605/09/c747f069-4eca-42da-9ad3-792325e0f9ca.html)","conclusion":"对流动人员，先辨申请事项。依法申请临时救助的，当事人本人或与其共同生活的家庭成员可在急难发生地向上述机关提出。第50条所列三项条件齐备时，应先行救助，事后仍有补充说明要求。","explain":"全国人大常委会法工委有关负责人将临时救助的适用对象解释为遭受突发性、紧迫性、灾难性等困难，导致基本生活暂时出现严重困难的人员，方式可包括救助金或实物。[法工委负责人解读，司法部智慧普法平台 2026-05-01](https://legalinfo.moj.gov.cn/pub/sfbzhfx/zhfxfzzx/fzzxyw/202605/t20260501_534462.html)","contrast":"临时救助／最低生活保障；急难发生地／户籍所在地及有条件的居住地；先行救助／事后手续。底稿未单列这些申请条件，未见相反表述。"},"E-LAW-05":{"title":"民族工作中谁牵头协调，法定宣传周何时举行","file":"全国法律","status":"可用","kids":"新增 K-LAW-05，关联 LAW-024（不同活动周）、P4-07（职权）。","date":"《中华人民共和国民族团结进步促进法》由十四届全国人大四次会议于 2026-03-12 通过，同日国家主席以第71号令公布，2026-07-01 施行。2026-11-27 已施行。[法律全文，共产党员网 03-13 刊载](https://www.12371.cn/2026/03/13/ARTI1773381338200224.shtml)｜[第71号主席令，共产党员网页面标注 03-13、签署日 03-12](https://www.12371.cn/2026/03/12/ARTI1773324253256502.shtml)","quote":"序言把铸牢中华民族共同体意识同时列为党的民族工作和民族地区各项工作的主线。第41条在民族工作格局中区分“党委统一领导、政府依法管理、统一战线工作部门牵头协调、民族工作部门履职尽责”，并列明各部门通力合作、全社会共同参与。第56条规定“每年9月的第四周为民族团结进步宣传周”，集中开展铸牢中华民族共同体意识宣传教育活动。","conclusion":"可直接确定两组对应关系。牵头协调的主体是统一战线工作部门；民族工作部门承担条文明列的履职职责。宣传周按月内周次设定，每年公历日期可不同。","contrast":"牵头协调／履职尽责；常设法定周次／当年启动日；民族团结进步宣传周／底稿 LAW-024 的全民阅读活动周。底稿未见该法条文，无直接冲突。"},"E-LAW-06":{"title":"医疗保障法已公布，异地直接结算要分基金与个人负担","file":"全国法律","status":"限定使用：2027-01-01施行","kids":"新增 K-LAW-06，关联 LAW-027、LAW-030。","date":"《中华人民共和国医疗保障法》由十四届全国人大常委会第二十四次会议于 2026-08-28 通过，国家主席同日以第80号令公布，2027-01-01 施行。2026-11-27 已公布、尚未施行。[法律全文，福建省医保局转中国人大网，页面标注 08-31](https://ybj.fj.gov.cn/zwgk/zcfg/202609/t20260903_7208724.htm)｜[第80号主席令，最高法转载新华社 08-28](https://www.court.gov.cn/xinshidai/xiangqing/509971.html)","quote":"新法第32条涉及医药费用直接结算。异地就医的参保人员在定点医药机构发生的医药费用，以“应当由医疗保障基金支付的部分”为限，经办机构“应当按照规定审核后及时足额直接结算并拨付”。第56条规定施行日期。2022年的跨省异地就医直接结算通知已区分基金支付和个人负担，并安排就医地与参保地的信息传输和结算流程。[国家医保局、财政部通知，中国政府网页面标注 2022-07-27，第三部分第四项](https://app.www.gov.cn/govdata/gov/202207/26/487780/article.html)","conclusion":"新法公布日、施行日与原有服务开始办理的时间是三个不同事实。到 2026-11-27 不能直接以尚未施行的第32条裁定当日权利义务，也不能由此推出异地直接结算在2026年尚不能办理。“足额”限定在应由基金支付的范围之内。","explain":"全国人大常委会法工委行政法室负责人将建立健全直接结算机制、推行联网结算、优化异地结算服务列为新法完善便民服务的措施。[国家医保局 2026-08-31 刊载答记者问](https://www.nhsa.gov.cn/art/2026/8/31/art_14_21956.html)","contrast":"医保基金应付部分／个人自付部分；新法施行日／既有经办制度；医疗救助／医疗保险。底稿 LAW-027 聚焦缴费主体，未见冲突。"},"E-LAW-07":{"title":"治安法不执行行政拘留，两类例外适用的人群不同","file":"全国法律","status":"可用","kids":"LAW-018；关联 LAW-015。既有知识复核，补充可离线引用的法条。","date":"《中华人民共和国治安管理处罚法》由十四届全国人大常委会第十六次会议于 2025-06-27 修订通过，国家主席同日以第49号令公布，2026-01-01 施行。2026-11-27 适用修订文本。[法律全文，深圳市公安局南山分局 2026-06-23 刊，列明法律发布日 2025-06-27](https://www.szns.gov.cn/xxgk/bmxxgk/nsgafj/xxgk_99908/zcfg_99917/zcfgjgfxwj_99918/content/post_12854925.html)｜[第49号主席令，新华社 2025-06-27](https://www.xinhuanet.com/politics/20250627/0d981e6f532548148d970c6956955d9d/c.html)","quote":"第23条第1款的前提是依本法应当给予行政拘留处罚。四项按顺序为①已满14不满16周岁，②已满16不满18周岁且初次违反治安管理，③70周岁以上，④怀孕或者哺乳自己不满1周岁婴儿。“前款第一项、第二项、第三项规定的行为人违反治安管理情节严重、影响恶劣的”，或者“第一项、第三项规定的行为人在一年以内二次以上违反治安管理的”，不受前款限制。两段引文均来自第2款。","conclusion":"①②③在情节严重、影响恶劣时适用第一类例外；①③还可能适用一年以内二次以上的另一类例外。④未被列入这两类例外。不满14周岁者另适用第12条的不予处罚规则。依第24条，不予处罚或不执行拘留的未成年人另有矫治教育安排。","explain":"本条仅依第12、23、24条区分责任和拘留执行，未补设“严重”“恶劣”的数额或次数标准。","contrast":"不予处罚／不执行行政拘留；一年以内二次以上违反治安管理／曾受过两次拘留；免于执行的一般列举／法定例外。LAW-018 的“正确关系”只概述有例外，底稿的“为什么”已准确列出两组人群。本卡把明确的条文对应关系提供给 Claude，无需改判旧资料。"},"E-PT-01":{"title":"“十五五”建议谁通过，国家纲要谁提出、谁批准","file":"十五五与党建","status":"可用","kids":"P4-04、P4-12、LAW-012。核验日期 2026-11-27。","date":"《第十四届全国人民代表大会第四次会议关于国民经济和社会发展第十五个五年规划纲要的决议》，十四届全国人大四次会议，2026-03-12通过并由新华社受权发布。纲要全文于2026-03-13受权播发。[人大决议](https://www.xinhuanet.com/politics/20260312/e983564b88bc4bf8adea7f8f218a64fe/c.html) · [纲要全文](https://www.xinhuanet.com/politics/20260313/085af5de5a4b4268aa7d87d90817df2f/c.html)","quote":"《建议》题下注明“中国共产党第二十届中央委员会第四次全体会议通过”。人大决议首段先写大会审查“国务院提出的”纲要草案，再写大会同意财经委的审查结果报告，最后写“决定批准这个规划纲要”。","conclusion":"四中全会通过党中央的规划建议。国家纲要草案由国务院提出，财经委提交审查结果报告，批准纲要的主体是全国人大。3月12日为批准日，3月13日为纲要全文播发日。","explain":"起草说明第三部分第二点写明《建议》稿所列发展目标“主要是定性要求”。必要的定量要求和部分具体部署留待编制《纲要》时研究确定。","contrast":"“全会通过建议”“财经委审查”“大会批准纲要”“新华社受权播发”分别对应不同动作。与 Markdown 和 JSON 底稿的上述条目一致，补入人大决议和起草说明的直接依据。"},"E-PT-02":{"title":"全国年度经济增长预期、五年增速安排与2035年远景","file":"十五五与党建","status":"可用","kids":"P4-12、P4-13。核验日期 2026-11-27。","date":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，国务院提出草案、全国人大批准，2026-03-13由新华社受权发布；《政府工作报告》，国务院，李强于2026-03-05在十四届全国人大四次会议上作报告，2026-03-13由新华社受权全文发布。[纲要第三章](https://www.xinhuanet.com/politics/20260313/085af5de5a4b4268aa7d87d90817df2f/c.html) · [政府工作报告第三部分](https://www.xinhuanet.com/politics/20260313/9e24773bf14649f59afe2d62550e48ce/c.html)","quote":"纲要第三章将国内生产总值增长放在结构优化、质量提升的前提下，写“保持在合理区间、各年度视情提出”。紧接着的远景比较的是2035年与2020年的人均国内生产总值。年度政府工作报告第三部分的原话为“经济增长4.5%－5%，在实际工作中努力争取更好结果”。","conclusion":"4.5%—5%是**全国2026年**的增长预期。“十五五”五年中，各年度根据情况提出增速。2035年远景表述所指为人均国内生产总值比2020年翻一番、达到中等发达国家水平，五年规划期内的任务是为此打好基础。","explain":"国务院在报告紧接目标的段落说明，开局之年要为调整结构、防范风险和推进改革留空间，所定年度目标也要与2035年远景相衔接。","contrast":"年度预期、五年安排、远景目标；全国总量增速、人均水平；2020基期、2030规划收官、2035远景。底稿已有五年和远景年份，此处补足指标对象及基期，未发现冲突。"},"E-PT-03":{"title":"“十五五”的约束性、预期性指标怎样落实，托育指标更新在哪里","file":"十五五与党建","status":"可用","kids":"P4-12。核验日期 2026-11-27。","date":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，全国人大2026-03-12批准、新华社2026-03-13受权发布。主管部门解读《以高质量实施“十五五”规划推进中国式现代化建设》，郑栅洁署名，国家发展改革委网站2026-05-01刊载，页面注明来源为求是网。[纲要第六十二章](https://www.xinhuanet.com/politics/20260313/085af5de5a4b4268aa7d87d90817df2f/c.html) · [国家发展改革委署名解读第二部分](https://www.ndrc.gov.cn/fzggw/wld/zsj/zyhd/202605/t20260501_1405047.html)","quote":"纲要第六十二章将约束性指标与公共服务、生态环保、安全保障等任务并列，要求“强化责任分解落实”。同段对预期性指标和产业发展、结构调整等任务，要求通过创造良好的政策、体制和法治环境推进。发改委解读将一项托育指标的更新概括为“将每千人口婴幼儿托位数指标调整为婴幼儿入托率提高”。","conclusion":"国家纲要20项主要指标中，8项为约束性，12项为预期性。判断执行方式须同时看指标性质和相应任务。“十五五”的托育主要指标观察实际入托比例的提高，旧指标观察每千人口拥有的托位数量。","explain":"郑栅洁说明，四中全会建议列出七个方面的目标，纲要再从经济发展、创新驱动、民生福祉、绿色低碳、安全保障五个方面设置20项主要指标。托育指标的调整意在更精准地满足服务需求。","contrast":"七方面目标／五类主要指标／20项具体指标；托位数／入托率；分解责任／创造环境。与 Markdown 和 JSON 底稿无冲突，补充了五年规划实施机制和一例真正变化的指标。"},"E-PT-04":{"title":"2026年政绩观学习教育的完成状态和后续任务","file":"十五五与党建","status":"可用","kids":"P3-04、P3-01。核验日期 2026-11-27。","date":"中共中央办公厅《关于在全党开展树立和践行正确政绩观学习教育的通知》，新华社2026-02-23公开报道通知内容，报道未给出通知的具体签发日。新华社2026-08-24报道习近平重要指示及中央党的建设工作领导小组同日总结会议。[中办通知报道](https://www.12371.cn/2026/02/23/ARTI1771848099115606.shtml) · [习近平作出重要指示强调巩固拓展树立和践行正确政绩观学习教育成果](https://www.news.cn/politics/leaders/20260824/7e69ae5235fb48b49b3e04e8d8e94bbf/c.html)","quote":"2月通知在交代县处级以上领导班子和领导干部特别是“一把手”为重点后，安排“春节假期后启动、7月底基本结束”，组织方式为“不分批次、不划阶段”。8月24日总结会议确认“这次学习教育目前已基本结束”；同篇重要指示要求“坚持常态化查改问题”。","conclusion":"集中教育在全党开展，有重点对象和时间安排；到8月已有会议确认基本结束。后续仍要建立长效机制，跟踪需要长期整改的问题。查摆、整改、建章立制都是工作安排，不宜编成按月依次开始的三个阶段。","explain":"8月重要指示提出经常性教育、常态查改、用好考核和加强管理监督。就经常性教育，点出地方党政正职、新提拔干部、年轻干部、关键岗位干部等培训重点。","contrast":"全党范围／集中教育重点对象／后续培训重点；集中教育基本结束／长期整改继续。P3-04关于范围与抓手的原表述正确，补入8月总结会议确认的状态。"},"E-PT-05":{"title":"二十届五中全会的党建命题与两个不同的“根本”","file":"十五五与党建","status":"可用","kids":"P3-07、P4-04。核验日期 2026-11-27。","date":"《中国共产党第二十届中央委员会第五次全体会议公报》，中共二十届中央委员会第五次全体会议，2026-10-29通过并发布；《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，同次全会2026-10-29通过，新华社2026-11-01全文公开。习近平所作的起草说明同日发布。[五中全会公报](https://www.12371.cn/2026/10/29/ARTI1793267034443539.shtml) · [《决定》第二部分](https://www.12371.cn/2026/11/01/ARTI1793518665119207.shtml) · [关于《决定》的说明](https://www.12371.cn/2026/11/01/ARTI1793519515075225.shtml)","quote":"公报谈习近平党建思想所回答的时代课题，限定在建设与怎样建设长期执政的马克思主义政党；在部署党性建设时明言“增强党性是全面从严治党的根本性任务”。《决定》第二部分第（二）项转向加强党性修养的途径，原文写“把学习、领悟、运用党的创新理论作为加强党性修养的根本途径”。","conclusion":"“根本性任务”所指为增强党性，“根本途径”所指为学习、领悟和运用党的创新理论。政治建设的角色是统领。三句话分别回答做什么、如何加强修养、以什么统领党的建设。","explain":"起草说明将《决定》划为三个板块；其中第二板块部署推进全面从严治党的重点任务，第三板块围绕监督体系和政治责任作部署。","contrast":"四中全会的规划建议／五中全会的管党治党决定；党性任务／修养途径／政治建设统领。与底稿一致，补足相邻措辞，原 JSON 的 TPL5DEC 发布日期为空；其工信部转载页标注 2026-11-01 18:23、来源新华社，与全文公开日一致。[原底稿引用的工信部页](https://www.miit.gov.cn/ztzl/rdzt/xxgcddesjwzqhjs/qhjs/art/2026/art_4d6f71846f1c4a3fa8ce06a8a8a0ef9c.html)"},"E-PT-06":{"title":"管党治党责任中的“听取汇报”与“向上报告”","file":"十五五与党建","status":"可用","kids":"P3-07、P4-11。核验日期 2026-11-27。","date":"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，中共中央，2026-10-29经二十届五中全会通过，新华社2026-11-01全文公开。定位为正文末段“持之以恒推进全面从严治党，是全党的共同政治责任”。[《决定》原文](https://www.12371.cn/2026/11/01/ARTI1793518665119207.shtml)","quote":"同一段分别使用“至少每年听取一次”和“至少每半年向上级纪委（派出机关）报告一次”。前者的动作主体为县级以上党委（党组）；后者为下级纪委（派驻纪检监察组）。两句分别交代如下。","conclusion":"","explain":"此条直接以《决定》具体部署为据。关于起草思路，习近平对《决定》的说明将完善监督体系、落实政治责任归入同一板块。[起草说明第三部分](https://www.12371.cn/2026/11/01/ARTI1793519515075225.shtml)","contrast":"班子集体／书记个人；听取汇报／向上报告；每年／每半年。与底稿对纪委与监委的区分一致，新增的两个频次限定于此段规定的具体报告事项。"},"E-PT-07":{"title":"发展党员新细则把上级党委同意、公示放在哪一步","file":"十五五与党建","status":"可用","kids":"K-PT-07（新增，党内法规）；可与 P3-07 联系。核验日期 2026-11-27。","date":"《中国共产党发展党员工作细则》，中共中央政治局常委会会议2026-04-02修订，中共中央办公厅2026-05-11发布，第44条规定自发布之日起施行，截至核验日适用2026年修订版。新华社2026-05-18报道全文；中组部负责人答记者问同日公开。比较文本为中共中央办公厅2014-05-28发布的旧版，共产党员网2014-06-10刊载。[新细则第8、13、44条](https://www.12371.cn/2026/05/18/ARTI1779102179030620.shtml) · [中央组织部负责人答记者问](https://www.12371.cn/2026/05/18/ARTI1779104451894432.shtml) · [旧细则第13条](https://news.12371.cn/2014/06/10/ARTI1402408565380843.shtml)","quote":"旧第13条为“报上级党委备案后，可列为发展对象”。新第13条在一年以上培养教育和考察、基本具备党员条件、听取有关方面意见的前提下，由党支部委员会会议研究讨论，要求“报上级党委同意拟列为发展对象的”进行公示；公示期“不少于五个工作日”。对拟列为发展对象的流动人员，条文另要求流出地、流入地同时公示。","conclusion":"2026年版本区分两个环节。确定入党积极分子后，按第8条报上级党委备案；拟列为发展对象，按第13条先报上级党委同意，再按规定公示。公示结果不影响发展入党的，可以列为发展对象。日期从文件正式发布日计算施行，网页刊载日在其后。","explain":"中央组织部负责人在“主要修订了哪些内容”的答复中，将发展对象公示列为本次新规定；在关于审核把关的答复中，再次明确拟列发展对象须报上级党委同意。","contrast":"旧版本对照存在实质变化。旧第13条的“备案后可列为”不能用于判断现行程序；现行第8条的备案仍适用于入党积极分子。原训练底稿未收这组程序，没有需要覆盖的原记录。"},"E-DB-01":{"title":"同为“十五五”纲要，生物制造的列举位置不同","file":"国家与广东文件对读","status":"限定使用：须写国家或广东省及文件名","kids":"GD-004、P2-16、P2-05、P2-06。核验日期 2026-11-27。","date":"国家《中华人民共和国国民经济和社会发展第十五个五年规划纲要》由十四届全国人大四次会议于 2026-03-12 批准，香港中联办于 03-14 刊新华社全文。广东省《广东省国民经济和社会发展第十五个五年规划纲要》由省十四届人大五次会议于 01-29 审查批准，省政府 03-26 印发（粤府〔2026〕24号），省委老干部局 04-29 转载省政府正文。[国家纲要](https://www.locpg.gov.cn/20260314/4cab36f71ce14e90957ccd9cebbaf60c/c.html) · [广东省纲要](https://www.gdlgb.gov.cn/xwdt/gdxw5/content/post_107439.html)","quote":"国家纲要第五章第二节题为“前瞻布局未来产业”，段中列“量子科技、生物制造”。广东省纲要在“着力打造新兴支柱产业”段写“低空经济、生物制造等新兴产业”，随后另起一段列举未来产业。广东年度报告在2026年工作安排第（二）项使用同一分组。中央 10 月《意见》第（八）项仍将“生物制造”列在前瞻布局未来产业项下，总体要求另外以“全要素生产率大幅提升为核心标志”说明新质生产力。","conclusion":"国家纲要与广东省纲要的规划期都是 2026—2030 年，但文本中的举例不同。仅加“据十五五纲要”仍不足以设唯一答案。产业举例与新质生产力的核心标志又是两个判断。","explain":"以上为四份正式文本的列举。本文没有采用对分类差异成因的官方解释，不能据此断定政策调整的动机。","contrast":"国家／广东、新兴／未来、产业列举／核心标志。原 GD-004 已指出国家纲要与广东年度报告的差别，本次补全同名省级纲要及中央 10 月《意见》的交叉核对。"},"E-DB-02":{"title":"广东年度经济增长目标与五年年均目标","file":"国家与广东文件对读","status":"可用","kids":"GD-006、P4-12。核验日期 2026-11-27。","date":"广东省政府《政府工作报告》，2026-01-26 向省人大报告、01-31 网页刊载；省政府印发《广东省国民经济和社会发展第十五个五年规划纲要》，省人大 01-29 审查批准、省政府 03-26 印发，04-29 网页刊载。[报告第三部分首段](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [纲要发展目标](https://www.gdlgb.gov.cn/xwdt/gdxw5/content/post_107439.html)","quote":"报告在当年的“主要预期目标”下写“地区生产总值增长4.5%—5%”；省纲要在五年发展目标中写“全省GDP年均增长5%左右”。报告另有回顾上年实绩的段落，应按段落选取数据。","conclusion":"4.5%—5% 对应 2026 全年预期，5%左右对应全省五年平均增速目标。后者并未规定每一年的增速下限，也不能据此认定 2026 年已完成目标。","explain":"这里直接采用省政府提交的目标及省人大批准的纲要，未使用对经济表现的事后解释。","contrast":"年度目标／五年年均目标／已公布的统计实绩。GD-006 数值一致；此次补上省级纲要正文，离线核验不再依赖此前加载超时的发布会页面。"},"E-DB-03":{"title":"深圳APEC会议成果与中方倡议的归属","file":"国家与广东文件对读","status":"可用；会后细节低优先","kids":"GD-014、GD-015、GD-016。核验日期 2026-11-27。","date":"APEC领导人《2026年亚太经合组织领导人深圳展望 建设亚太共同体，促进共同繁荣》；外交部发布《中国担任2026年亚太经合组织东道主成果清单》。两份网页发布日期均为 2026-11-19，会议于 11-18 至 19 在深圳举行。[领导人深圳展望](https://www.fmprc.gov.cn/web/gjhdq_676201/gjhdqzz_681964/zgzyjz_148206/zywj_688970/202611/t20261119_12063256.shtml) · [东道主成果清单](https://www.fmprc.gov.cn/web/wjbzhd/202611/t20261119_12063130.shtml)","quote":"《展望》序段明列三大优先领域“开放、创新、合作”。外交部清单将领导人深圳展望列入“会议成果文件”；另设“中方推进亚太共同体建设重大举措”，该项下分别写“成立亚太共同体研究中心（深圳）”“倡议成立世界湾区经济合作联盟（深圳）”。","conclusion":"《展望》是领导人会议成果。研究中心与湾区联盟在清单中的主体均为中方，动作一为“成立”、一为“倡议成立”。该清单不足以证明联盟已经成立或各成员均有加入义务。","explain":"沿用外交部清单自身的分组。有关区域一体化，《展望》说明领导人将继续以市场驱动的方式推进。","contrast":"东道主的一项举措／领导人共同成果、倡议／成立。GD-016 已确认会议及会后文件，本条补充可准确区分的动词和主体，保留原稿对会后细节较低的训练优先级。"},"E-DB-04":{"title":"两业协同专题询问中谁提问、谁应询","file":"国家与广东文件对读","status":"可用","kids":"GD-001、GD-002、GD-003、P4-07。核验日期 2026-11-27。","date":"广东人大网《黄楚平主持省十四届人大常委会第二十八次会议联组会议开展专题询问 以法治助力我省制造业和服务业协同融合》，2026-11-27 发布，网页标注来源南方日报。会议于 11-25 下午举行。[省人大会议报道](https://www.gdpc.gov.cn/gdrdw/tp/content/post_244151.html)","quote":"报道记载省人大常委会组成人员和人大代表提问，“省政府11个部门负责同志到会应询”。讨论的产业路径包括“制造业服务化、服务业制造化、平台生态化”。报道另载会议对跟踪监督和整改的要求。","conclusion":"专题询问把省人大监督与政府部门落实年度产业部署连在一起。会上的三个方向是这次讲话中讲的路径，不能替代年初全省高质量发展大会的主题名称。","explain":"据省人大网报道，黄楚平在会上说明“专题询问的形式是‘问答’，目的在‘整改’”。这是对本次监督工作的说明。","contrast":"人大监督／政府执行、会议主题／落实路径、专题询问／制定条例。与 GD-001、P4-07 一致，补入真实的跨模块案例。"},"E-DB-05":{"title":"优化国际化营商环境中的外资准入与粤企出海","file":"国家与广东文件对读","status":"可用","kids":"GD-012、LAW-019。核验日期 2026-11-27。","date":"《广东省2026年优化国际化一流营商环境工作方案》经省委、省政府同意，由广东省商务厅、中共广东省委外事工作委员会办公室于 2026-01-31 联合印发，省外办发布页日期 02-02。原网页在本轮直接读取超时，已打开香港特区政府工业贸易署转载的同份通知及方案正文，对照第六、八项。[省外办发布页](https://www.gdfao.gd.gov.cn/wsdt/zwdt/content/post_1317957.html) · [工业贸易署保存的正文](https://www.tid.gov.hk/en/tradecircular/files/2026/ci1772026a.pdf)","quote":"第六项“落实放宽外资准入政策”要求“落实外商投资准入前国民待遇加负面清单管理制度”，接着谈清理内外资不一致措施，并以广深服务业扩大开放综合试点为例。第八项转向海外综合服务，写“建设‘粤企出海’综合服务港”，列有金融、税收、法律、检测认证等资源。","conclusion":"一项解决外资进入和在粤经营问题，另一项为广东企业赴海外经营提供服务。方案的印发机关与同意机关应分别识别；年度工作要求本身不能证明服务载体已全部建成。","explain":"本条采用责任部门联合印发的方案正文，未引入实施效果评估。","contrast":"外资进入／粤企走出、外商投资准入负面清单／全国统一市场准入负面清单。与 GD-012 一致，补存此前未能直接打开的正式文件内容。"},"E-DB-06":{"title":"省十件民生实事后五项中，哪些指标在量什么","file":"国家与广东文件对读","status":"可用","kids":"K-GD-10（新增），关联 GD-006。与 E-GD-02 至 E-GD-06 分别覆盖的第一至第五项合读。核验日期 2026-11-27。","date":"广东省人民政府《政府工作报告》附件1《2026年省十件民生实事》，报告日 2026-01-26，全文网页发布 01-31。第六至十项分别涉及青少年心理健康、基层健康与检查检验互认、农村污水与河湖、食品药品监管、农村公路与出行服务。[省政府报告及附件全文](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html)","quote":"第六项同时写青少年心理服务和学生体育锻炼。第七项要求扩大医疗机构间互认项目库，用“项目数增加20%以上”衡量扩容。第八项针对“已建成自然村的生活污水治理设施”安排改造提升。第九项分别规定食品快检、抽检与药品监督抽检范围。第十项同时安排农村公路新建改造、高速公路服务区和充电设施等任务。","conclusion":"互认项目数的增长不能换算成某位患者就诊时的互认率。第八项既有设施的改造运维与新建处理设施是不同动作。第九项的集采中选药品抽检覆盖目标限于省内生产的该类药品。第十项的农村公路里程将新建、改造提升合计计算。各指标均为年度安排。","explain":"未另引解读。11-25 省人大常委会会议另行听取省政府关于本年度实事实施情况及下一年度候选项目安排的报告；会议报道没有给出十项全部完成的结论。该报道在 11-26 发布。[广东人大网会议报道](https://www.gdpc.gov.cn/gdrdw/tp/content/post_244137.html)","contrast":"任务／结果、项目库中的项目数／患者人数、改造运维／新建。原底稿没有十件实事专卡，GD-006 的“目标与实绩分开”适用于这里。"},"E-DB-07":{"title":"国家规划调整、中期评估和省级纲要批准","file":"国家与广东文件对读","status":"可用","kids":"LAW-012、LAW-013、P4-12。核验日期 2026-11-27。","date":"《中华人民共和国国家发展规划法》由十四届全国人大四次会议于 2026-03-12 通过，国家主席同日以第72号主席令公布，自公布之日起施行。全国适用，核验日已施行。商务部法规库标记发布、实施日均为 03-12，晋城市发改委 04-01 刊载主席令与法律全文。广东省政府《广东省国民经济和社会发展第十五个五年规划纲要》记载省人大 01-29 审查批准，省政府 03-26 印发，省委老干部局 04-29 刊载。[国家法律正文](https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=105441) · [主席令与全文](https://xxgk.jcgov.gov.cn/szfgzbm/jcsfzhggwyh/fdzdgknr_31111/fgwj_31121/202604/t20260401_2336580.shtml) · [省级纲要及印发通知](https://www.gdlgb.gov.cn/xwdt/gdxw5/content/post_107439.html)","quote":"第21条针对确需调整的国家规划，写“提请全国人民代表大会常务委员会审查和批准”。第30条针对中期评估报告，动词为“提请全国人民代表大会常务委员会审议”。两个程序均由国务院依相应程序报党中央同意后提请。第36条另行规定省级纲要草案须报国务院国家发展规划主管部门衔接，经本级人大审查批准后，再报该主管部门备案。","conclusion":"中期评估的结果并不自动改变规划目标。评估报告与调整方案提交到同一机关，该机关对两类文书作出的法定动作不同。广东这份纲要获批在 1 月，全国新法施行在 3 月；不能用新法条文倒推它是 1 月批准行为当时已经生效的依据。","explain":"本条据第21、30、36条和广东纲要题注核实，没有另引制度动机解释。","contrast":"审议报告／审查批准调整方案，省人大批准／向国务院主管部门备案。LAW-013 的一般规则与法条一致，本卡补入中期评估的相邻动作及广东案例的先后顺序。"},"E-GD-01":{"title":"“百千万工程”的2027年目标","file":"广东政策与实事","status":"限定使用：省委《决定》的年份可用；2026方案逐字条文待补","kids":"GD-007，关联 GD-008。**核验日**　2026-11-27。","date":"《中共广东省委关于实施“百县千镇万村高质量发展工程”促进城乡区域协调发展的决定》，中共广东省委，2022-12-08 经省委十三届二次全会通过，省委统战部网页 2023-02-27 发布全文。省“百千万工程”指挥部印发的五年显著变化行动方案，由“广东发布”发布消息，省委老干部局网页日期 2026-05-08。广东网信网 05-07 也刊载了指挥部近日印发的消息。两处网页均未载方案签发日期。[广东网信网 05-07 发布消息](https://www.cagd.gov.cn/v/2026/05/9043.html) · [省委《决定》全文](https://www.gdtzb.gov.cn/yw/gd/content/mpost_86850.html) · [2026年官方方案发布消息](https://www.gdlgb.gov.cn/xwdt/gdxw5/content/post_107689.html)","quote":"《决定》第一部分第（四）项依次列 2025 年、2027 年、2035 年三个节点，其中写明“到2027年，城乡区域协调发展取得明显成效，县域综合实力明显增强”。2026 年发布消息将五项行动及工作机制指向「全面推进“百千万工程”高质量实现五年显著变化目标任务」。《广东建设报》2026-05-15 对同一省级方案的报道亦明确将经济强县、强镇、和美乡村的目标落在 2027 年。[《五大行动推动城乡区域协调发展》，首段](https://ep.ycwb.com/epaper/gdjs/html/2026-05/15/content_1161_751562.htm)","explain":"“广东发布”的消息将五项行动概括为县域产业、县城龙头引领、镇村特色化差异化、集成式改革、社会力量参与，并另列工作机制保障。"},"E-GD-02":{"title":"城乡低保最低比例与特困供养基数","file":"广东政策与实事","status":"可用","kids":"K-GD-02（新增），关联 GD-006。**核验日**　2026-11-27。","date":"广东省人民政府《2026年广东省政府工作报告》附件1第一项，报告 2026-01-26，网页 2026-01-31。落实例为汕头市民政局《关于印发2026年全市城乡最低生活保障等社会救助标准的通知》，2026-05-26 发布。[省报告附件1](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [汕头市民政局通知](https://www.shantou.gov.cn/cnst/zdly/mzxxgk/shjzxx/content/post_2540678.html)","quote":"省报告第一项将农村低保标准占城镇低保标准的最低比例从77%调至“80%以上”。同项紧接着以当地上年补差水平约束当年补差，又规定特困人员基本生活保障标准“不低于当地最低生活保障标准的1.6倍”。汕头通知第一、二项分别列出低保和特困基本生活供养的当地标准。","explain":"未另引解读。汕头通知作为实施原文，同时列出城乡低保标准、补差水平、特困供养标准，能直接对照。"},"E-GD-03":{"title":"县中帮扶的覆盖单位与帮扶主体","file":"广东政策与实事","status":"可用","kids":"K-GD-03（新增），关联 GD-007、GD-008。**核验日**　2026-11-27。","date":"广东省人民政府《2026年广东省政府工作报告》附件1第三项，报告 2026-01-26，网页 2026-01-31。全省教育工作会议由省教育厅部署，汕尾市教育局在 2026-01-26 刊载会议工作要点。[省报告附件1](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [教育系统工作要点](https://www.shanwei.gov.cn/swsjyj/gkmlpt/content/1/1220/post_1220487.html)","quote":"报告把托管扩围、优质高中结对帮扶、师范院校纵向帮扶放在同一项。教育工作要点提出「完善“横向+纵向”帮扶机制」，紧接着要求“推动57个县（市）公办县中帮扶工作全覆盖”。","explain":"省教育厅在年度会议部署中将上述做法归入提高教育帮扶质效，提出签订托管协议、确定并派出团队。这里的全年目标据报告写入；不凭报告单独判定某日已完成。"},"E-GD-04":{"title":"生育医疗费用的两类参保人员","file":"广东政策与实事","status":"限定使用：省报告与河源实施例各有地域边界","kids":"K-GD-04（新增），关联 LAW-027。**核验日**　2026-11-27。","date":"广东省人民政府《2026年广东省政府工作报告》附件1第四项，报告 2026-01-26，网页 2026-01-31。地方落实解释为河源市医保局《〈关于完善职工生育保险有关事项的通知〉解读》，2026-10-26 发布。[省报告附件1](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [河源市医保局解读，第二部分第（二）项](https://www.heyuan.gov.cn/hysylbzj/gkmlpt/content/0/722/post_722419.html)","quote":"省报告第四项先写育儿补贴，再分别写职工生育保险和职工基本医疗保险的支付情形。待遇句用“符合国家和省规定的药品、诊疗项目和医用耗材支付范围的”限制费用，并写明支付方为职工基本医保统筹基金，支付幅度是全额。在河源市解读中，相应的安胎住院待遇按当地职工生育保险的住院费用规则保障。","explain":"河源市医保局说明当地文件于2026-11-01实施，并在情形中列“前置胎盘伴出血”。作为河源实施举例引用，其列举和日期只适用于该市文件。该解读第一部分明确列出《关于进一步完善产前生育医疗费用保障工作的通知》（粤医保函〔2026〕102号），本轮未取得省级发文全文。复核发现，解读页末“政策原文”链接指向河医保发〔2026〕13号，正文写的是 05-01 起实施，而解读第（六）项明确该旧文件自 11-01 起废止。此链接不能用作省函原文或河源11月新规全文。[被链接的13号旧文件](https://www.heyuan.gov.cn/hysylbzj/gkmlpt/content/0/722/post_722417.html)"},"E-GD-05":{"title":"今年的长护险民生实事与次年施行的机构定点规则","file":"广东政策与实事","status":"限定使用：定点细则2027-01-01施行","kids":"K-GD-05（新增），关联 GD-020。**核验日**　2026-11-27。","date":"广东省人民政府《2026年广东省政府工作报告》附件1第二项（报告 2026-01-26，网页 2026-01-31）；广东省医疗保障局《广东省长期护理保险护理服务机构定点管理实施细则》，粤医保规〔2026〕5号，2026-11-03 印发，11-05 在省医保局网站发布，同日发布政策解读。[年度任务](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [省医保局通知及细则](https://hsa.gd.gov.cn/zwgk/zfxxgkml/bmwj/gfxwj/content/post_4975624.html) · [省医保局解读](https://hsa.gd.gov.cn/zwgk/zfxxgkml/jcgk/zcjd/content/post_4975632.html)","quote":"年度任务所保的是重度失能人员的基本生活照料及密切相关的医疗护理。细则第二条界定定点机构，第七条列服务类型“居家护理、社区护理和机构护理”；第四十条写明“自2027年1月1日起施行，有效期5年”。","explain":"省医保局将准入过程解释为受理后综合审核、社会公示、协商谈判，双方签协议后纳入定点管理。文件管的是机构准入、运行与监管，无法据其施行日推定全省此前没有长护险试点。"},"E-GD-06":{"title":"新就业形态职业伤害保障如何缴费、如何受理","file":"广东政策与实事","status":"可用","kids":"K-GD-06（新增），关联 LAW-027。**核验日**　2026-11-27。","date":"广东省人民政府年度报告附件1第五项（2026-01-26 报告，网页 01-31）。人社部等九部门《关于扩大新就业形态人员职业伤害保障试点的通知》及所附《新就业形态人员职业伤害保障办法（试行）》落款 2025-04-22，深圳市人社局所载网页 2026-08-07 发布。广东省人社厅、国家税务总局广东省税务局及深圳市税务局《关于加强我省职业伤害保障业务经办和征收管理有关工作的通知》（粤人社规〔2026〕2号），深圳市人社局网页 2026-08-07 发布，文件明确自 2026-03-01 实施，有效期5年。[年度任务](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [国家试行办法第2、7条](https://hrss.sz.gov.cn/gkmlpt/content/12/12926/mpost_12926075.html) · [广东三部门通知第一、二项](https://hrss.sz.gov.cn/xxgk/qtxx/tzgg/content/post_12926305.html)","quote":"国家办法第二条在规定平台为经平台注册接单并符合条件者缴费后，明确“适用《工伤保险条例》规定的劳动者，企业应当依法为其参加工伤保险”。广东通知对线下受理写明“就近受理、属地办理”，职业伤害确认由事故伤害发生地人社行政部门负责办理。","explain":"2026-07-02 中国就业网说明，自 07-01 起试点在31个省份和新疆生产建设兵团全面推开，并概括为“按日参保、按单计费、月度缴费、总参总保”。地理上的推开须与具体平台、行业和人员范围分别判断。[中国就业网专题说明](https://chinajob.mohrss.gov.cn/h5/c/2026-07-02/567232.shtml)"},"E-GD-07":{"title":"服务业扩能提质的两条方向","file":"广东政策与实事","status":"可用","kids":"GD-003、GD-001，关联 GD-006。**核验日**　2026-11-27。","date":"广东省人民政府《关于印发〈广东省推进服务业扩能提质实施方案〉的通知》，粤府〔2026〕36号，落款 2026-06-13。南方网 06-19 全文刊载，注明来源为广东省人民政府网站；清远市清新区政府门户 08-11 刊载同一正文。[正式方案全文（政府门户转载）](https://www.qingxin.gov.cn/qyqxhy/gkmlpt/content/2/2174/post_2174882.html) · [6月公开全文](https://news.southcn.com/node_54a44f01a2/a56f14dd1a.shtml)","quote":"总述连续提出“推动生产性服务业向专业化和价值链高端延伸，推进生活性服务业高品质多样化便利化发展”，随后将行业总量目标写为力争到2030年全省服务业增加值突破11万亿元。","explain":"广东省邮政管理局 2026-06-22 说明，落实方案还包括将邮政服务嵌入供应链产业链，支持寄递企业为岭南果蔬等特色农产品开通专线。这为“生产性服务”提供了与单纯居民收寄不同的使用情境。[广东省邮政管理局说明](https://gd.spb.gov.cn/gdsyzglj/c100057/c100060/202606/32ee59fb5d34486d96f08284dfc8d78a.shtml)"},"E-GD-08":{"title":"海洋牧场设施设备险保什么、谁能投保","file":"广东政策与实事","status":"可用","kids":"K-GD-08（新增），关联 GD-017、GD-018。**核验日**　2026-11-27。","date":"广东省农业农村厅、广东省财政厅、国家金融监督管理总局广东监管局印发《广东省现代化海洋牧场设施设备险实施方案》，粤农农规〔2026〕4号，2026-04-21 印发，湛江市海洋与渔业局网页 07-08 发布全文，09-01 刊载政策解读。方案载明实施期 2026-05-23 至 2028-12-31，截至核验日在实施期内。[三部门通知及方案](https://www.zhanjiang.gov.cn/hyyyj/gkmlpt/content/2/2199/post_2199412.html) · [湛江市海洋与渔业局政策解读](https://www.zhanjiang.gov.cn/zjsfw/bmdh/hyj/zwgk/jd/content/mpost_2217400.html)","quote":"第一部分圈定10个沿海地市，保留动态调整空间。第二部分将标的限定在“已建成并投放至海上的”相关养殖设施设备，参保人可为“所有权人或者使用权人”，同一设施同一时间只能投保一次，由双方协商投保主体。一个投保周期为一年。","explain":"主管部门解读指出，原有养殖保险、人身意外伤害保险已经分别面向养殖水产品、工作人员，此次补设施设备风险。解读把覆盖在建设施、陆基及物流设施的产品列作鼓励探索的后续方向。"},"E-GD-09":{"title":"“标准海”供应中由谁先做什么","file":"广东政策与实事","status":"可用","kids":"GD-018，关联 GD-017、P4-12。**核验日**　2026-11-27。","date":"《广东省国民经济和社会发展第十五个五年规划纲要》由省十四届人大五次会议于 2026-01-29 审查批准，广东省人民政府 03-26 发文印发（粤府〔2026〕24号），省委老干部局 04-29 转发全文。广东省人民政府年度报告附件2第13条解释“标准海”。省自然资源厅《关于加强海洋资源要素保障 促进现代化海洋牧场高质量发展的通知》2023-07-01 落款，汕尾市自然资源局 08-01 发布，自 2023-08-01 施行，有效期5年。[省“十五五”纲要全文](https://www.gdlgb.gov.cn/xwdt/gdxw5/content/post_107439.html) · [年度报告附件2](https://www.gdjct.gd.gov.cn/ttxw/content/post_209009.html) · [省自然资源厅通知第（四）项](https://www.shanwei.gov.cn/swszrj/gkmlpt/content/0/942/post_942380.html)","quote":"省“十五五”纲要“创新管海用海机制”段提出「推广“标准海”供应」。自然资源厅通知在海洋产业园内探索的模式是“统一开展区域整体海域使用论证等用海前期工作”，随后说明相应单个海洋牧场项目申请用海时无需再做这项论证。","explain":"年度报告附件2明确宗海的用途，并举离岸距离、水深和用海面积为控制性指标。能减少重复论证的前提是区域前期工作已经完成。"},"E-YF-01":{"title":"同一天施行的国家法典与广东条例","file":"广东立法进度与适用","status":"可用","kids":"LAW-007、LAW-008、LAW-010、LAW-011、LAW-002。核验日期 2026-11-27。","date":"十四届全国人大四次会议于 2026-03-12 通过《中华人民共和国生态环境法典》，国家主席同日以第70号主席令公布；法律正文于 03-13 刊在生态环境部网站。广东省十四届人大常委会第二十六次会议于 07-31 修订通过《广东省环境保护条例》，省人大常委会同日以第80号公告公布，08-04 上网。两者均自 08-15 施行；核验日均已施行，前者为国家法律，后者为适用于广东省行政区域的地方性法规。[主席令](https://www.12371.cn/2026/03/12/ARTI1773324183994484.shtml) · [法典正文](https://www.mee.gov.cn/ywgz/fgbz/fl/202603/t20260313_1146496.shtml) · [广东省公告和条例](https://www.gdpc.gov.cn/gdrdw/zyfb/ggtz/content/post_242854.html)","quote":"法典第1242条写明“本法自2026年8月15日起施行”，随即列出同时废止的十部全国法律，首项为《中华人民共和国环境保护法》。省条例第1条将《中华人民共和国生态环境法典》列为制定依据。第3条先规定“各级人民政府对本行政区域的生态环境质量负责”，再规定生态环境主管部门实施统一监督管理，其他有关部门依法分工；街道办事处和基层群众性自治组织协助开展工作。","conclusion":"国家旧《环境保护法》在法典施行日废止；广东同日适用新修订的省条例。旧国家法律的废止与省条例的修订是两个立法动作。地方政府对环境质量负责和主管部门统一监管也是两个不同职责。","explain":"全国人大常委会法工委宪法室在《编纂生态环境法典 推动宪法关于生态文明制度规定全面有效实施》第二部分（三）说明，有的法律全部纳入，有的仅择其要旨继续保留；该文对法律部门作出“由7个增加至8个”的说明。这是对法律体系分类的阐释，勿写成法典某条规定新增行政机关。生态环境部于 2026-07-23 转载。[法工委宪法室署名文章](https://www.mee.gov.cn/home/ztbd/2022/sthjpf/xfxcz/202607/t20260723_1162631.shtml)","contrast":"国家法／省条例、依法废止／修订施行、政府负责／部门监管。与 LAW-007、008、010 一致。省条例填补了旧稿缺少的广东实例。"},"E-YF-02":{"title":"规范性文件的对象和新条例的施行时点","file":"广东立法进度与适用","status":"限定使用：2027-01-01施行","kids":"LAW-001、LAW-002、LAW-030。核验日期 2026-11-27。","date":"《广东省规范性文件制定和管理监督条例》由广东省十四届人大常委会第二十六次会议于 2026-07-31 通过，省人大常委会同日以第79号公告公布。正文网页发布于 08-03。第40条定于 2027-01-01 施行。核验日为已公布、尚未施行，适用于广东。[公告与条例](https://www.gdpc.gov.cn/gdrdw/zyfb/ggtz/content/post_242855.html)","quote":"第3条在制定机关、权限程序、公开发布和涉及权利义务之外，还要求“具有普遍约束力、在一定时期内可以反复适用”。下一款列举内部工作制度、人事任免、对具体事项作出的处理决定等排除情形。第2条对地方性法规、地方政府规章等另指其制定和管理的法律依据。","conclusion":"判断对象要看效力和适用方式。一份任免某人的决定即使已经公开，仍是针对特定对象的事项。这部省级地方性法规规范有关文件的制定和管理，条例自身的性质与其管理的文件要分开。","explain":"省人大网 2026-08-04 发布的解读把起草、审查、公布、备案、清理、评估等连成全过程，并专门说明对规章以下文件进行源头管理的缘由。[广东人大网解读](https://www.gdpc.gov.cn/gdrdw/zyfb/ggtz/content/post_243404.html)","contrast":"通用且可反复适用的文件／具体处理决定，地方性法规／规章以下文件，公布／施行。与 LAW-030 一致，新增有确定施行日的本省例证。"},"E-YF-03":{"title":"人工智能发展促进、县域经济振兴两项省级法规案","file":"广东立法进度与适用","status":"待补实体依据；已核到11-25草案说明","kids":"LAW-030、GD-020。核验日期 2026-11-27。","date":"广东人大网 2026-11-26 刊《省十四届人大常委会第二十八次会议召开，黄楚平主持会议》，来源为南方日报，报道 11-25 会议。另核省人大常委会 10-30 公开的下一年度立法计划征求意见稿，反馈截止日为 11-30。[省人大会议记录报道](https://www.gdpc.gov.cn/gdrdw/tp/content/post_244137.html) · [2027年度立法计划征求意见稿](https://www.gdpc.gov.cn/gdrdw/zyfb/fgyjzj/content/post_243923.html)","quote":"11 月会议报道将《广东省人工智能发展促进条例（草案）》《广东省县域经济振兴条例（草案）》并列，记载会议“听取省人民政府关于”两项“等法规案的说明”。10 月公开的计划稿将这两项列在“一、继续审议项目”下；该计划自身还在征求意见。","conclusion":"已证实 11-25 两项均以草案进入会议议程，省政府作说明。分别检索两项全称，并核对省人大会议与权威发布栏目，本轮均未取得正式通过文本、公布公告及施行日。**后续通过、公布、施行及适用状态均待核实**；不能反向断言 11-27 一定没有通过。","explain":"本条使用会议报道和公开征求意见的计划稿，两份材料都没有解释生效后的实体权利义务。","contrast":"法规草案说明／审议结果报告／通过公告。与 LAW-030 一致。省人大网页可作为底稿原报纸链接的并行出处。"},"E-YF-04":{"title":"数据条例的立法调研与低空经济发展条例的继续审议安排","file":"广东立法进度与适用","status":"待补实体依据；只确认所列立法进展","kids":"GD-020、LAW-030。核验日期 2026-11-27。","date":"广东人大网 2026-10-11 发布《黄宁生率队开展数据立法调研座谈》，记 10-10 赴省政务和数据局调研。省人大常委会 10-30 公布《广东省人大常委会2027年度立法计划（公开征求意见稿）》。[数据立法调研](https://www.gdpc.gov.cn/gdrdw/rdlz/lfgz/content/post_243656.html) · [立法计划稿](https://www.gdpc.gov.cn/gdrdw/zyfb/fgyjzj/content/post_243923.html)","quote":"关于数据条例，调研报道明确目的为“扎实做好省数据条例的制定工作”，座谈收集数据产权登记、跨境流动等方面意见。关于低空经济，计划稿在“继续审议项目”下列“广东省低空经济发展条例”。该稿征求意见的对象是下一年度立法计划。","conclusion":"前者证实立法工作已开展，后者证实一份拟议安排。对两项省级法规，本轮均未核得正式通过日期、公布公告或施行条款；**截至核验日，实体规则及有效状态待核实**。一个项目未出现在某张计划表中，同样不足以确定其状态。","explain":"省人大网的座谈报道说明了安全与开发利用并重的立法考虑；未提供已经生效的行为规范。","contrast":"立法调研／立法计划／有效法规，广东省级法规／其他地区或广东省内某一市的法规。与 GD-020 一致，补充年初部署之后可追溯的步骤。"}},"plan":{"core":160,"backup":40,"generated":"2026-11-27","basis":["对照2013—2026年广东卷的405道政治常识题，近三年的三张卷看得最重。近三年每卷15题：马哲2题（多选、判断各1道），新思想3—5题，中央全会文件和政策逐年增加（1、3、5题），广东1—3题，法律1题，党史2、1、0题；科技、地理、文史这类常识已经不考。","三位预测人各自独立预测下一张卷，结论一致：10月二十届五中全会的《决定》（全面从严治党）占2—3题；“六个必须坚持”轮到还没当过答案的问题导向或人民至上；马哲最可能轮到近三年没考的认识论（实践、认识、真理）；广东看11月的深圳APEC和2月的省高质量发展大会；法律首选生态环境法典。","九位估值人按“考到的可能”和“容易错的程度”给318个知识点和题目打分，两位校准人拉平各组打分的松紧，一位总评人按考试的15个位置查漏。分数够“应当留”的63道全部进核心，其余名额按分数从高到低补足。核心160道按分数排序，排在前面的先学。","马哲420道留80道核心、21道备选：多选和仿真题优先（真题就是这两种出法），基础判断只留定性词容易被换主语的；近三年真题原题你已经做过，没有再放。","新思想、政策、党建这三块在考试里占一半左右，题库里一共只有42道，值得留的都留了。","按三位预测人的估计，每张卷15题里大约有7题题库帮不上：三道原话判断摘的是文件原句（题库只收了其中几句）、古语配观点、当年成就、总书记视察广东讲话的原话。这部分要靠读原文和《广东时政易错点》的考前速记，不在这份计划里。"],"modules":[{"name":"马哲","share":"6题","core":80,"backup":21,"total":420},{"name":"新思想","share":"13题","core":12,"backup":0,"total":12},{"name":"政策","share":"9题","core":10,"backup":3,"total":16},{"name":"党建","share":"1题","core":10,"backup":1,"total":14},{"name":"制度规划","share":"2题","core":8,"backup":3,"total":20},{"name":"党史","share":"3题","core":14,"backup":4,"total":32},{"name":"法律","share":"3题","core":12,"backup":6,"total":63},{"name":"广东","share":"6题","core":14,"backup":2,"total":48}],"note":"没进精选的题没有删，在“练习”里把“精选”选成“扩展（计划外）”就能做。近三年真题另有2题在题库之外（当年成就）。"}}}</script>
<script>
"use strict";
const EXAM_DAY = "2026-12-06";
const LS_KEY = "mzbx-progress-v1";
const INTERVALS = [1, 2, 4, 7, 14, 30];          // 答对后按盒子编号推迟复习的天数；答错回到第0盒，次日复习
const BANKS = { mz: "马哲", fm: "政常" };
const S = { cards: [], blocks: [], qs: [], meta: null, q: {}, card: {}, qByCard: {}, mod: {}, prog: null, run: null,
            ref: null, saving: false, again: false, cloud: "connecting", cloudNote: "", synced: false, setSeen: "" };

// ---------- 小工具 ----------
const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function dayStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(day, n) { const [y, m, d] = day.split("-").map(Number); return dayStr(new Date(y, m - 1, d + n)); }
function dayDiff(a, b) { const f = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 86400000); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const bankOf = (q) => (q.bank === "fm" ? "fm" : "mz");
function prioOf(q) { let best = "C"; for (const c of q.cards) { const p = S.card[c] && S.card[c].priority; if (p === "A") return "A"; if (p === "B") best = "B"; } return best; }
const isA = (q) => prioOf(q) === "A";
const kindLabel = (q) => q.bank === "fm" ? "政常新题" : q.src === "底稿" ? "底稿判断" : q.src === "真题" ? "广东真题" : q.kind === "拓展" ? "拓展题" : "仿真题";
const paused = (q) => !!(q.hold || q.review);

// ---------- 进度：云端（db，仅所有者可读写）＋本机缓存 ----------
const DEFAULT_SETTINGS = { size: 15, size2: 15, daily: 50, why: false, fmB: true, fmC: false };
function blankProg() { return { v: 1, q: {}, days: {}, settings: { ...DEFAULT_SETTINGS }, today: null, today2: null, plan: null, updated: "" }; }
function normalize(p) { p.settings = { ...DEFAULT_SETTINGS, ...(p.settings || {}) }; p.q = p.q || {}; p.days = p.days || {}; return p; }
function loadLocal() {
  try { const s = localStorage.getItem(LS_KEY); if (s) { const p = JSON.parse(s); if (p && p.v === 1) return normalize(p); } } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.prog)); } catch (e) {} }
function stamp() {   // 记录的更新时间：保证比上一次的大（另一台设备的时钟偏快时，这边的改动也不会被当成旧的）
  const now = new Date().toISOString(), prev = S.prog.updated || "";
  if (now > prev) return now;
  const t = new Date(prev).getTime();
  return isNaN(t) ? now : new Date(t + 1).toISOString();
}
function touch() {
  S.prog.updated = stamp();
  const sj = canon(S.prog.settings);
  if (sj !== S.setSeen) { S.setSeen = sj; S.prog.st = S.prog.updated; }      // 设置改动的时间单独记：合并时设置跟最后改它的那台设备走
  saveLocal(); scheduleCloud();
}
let cloudTimer = 0, retryTimer = 0, retryWait = 0, lastWrote = "", wroteSame = 0;
function scheduleCloud() { clearTimeout(cloudTimer); cloudTimer = setTimeout(() => { cloudTimer = 0; pushCloud(); }, 900); }
function flushCloud() { if (cloudTimer) { clearTimeout(cloudTimer); cloudTimer = 0; pushCloud(); } }   // 页面转到后台或关掉之前，把还没推的记录马上推出去
// 比较两份内容不看键的先后：云端返回的文档，键是按字母排过的，和本机写出去时的顺序不同
const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map((key) => [key, x[key]])) : x));
const sameRec = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every((k) => a[k] === b[k]); };
async function pushCloud() {
  if (!S.ref || S.cloud === "local" || !S.synced) return;     // 没拿到云端确认过的记录之前不写，免得用这台设备的旧记录盖掉云端
  if (S.saving) { S.again = true; return; }
  S.saving = true; clearTimeout(retryTimer);
  try {
    const cur = await S.ref.get();                             // 写之前先读云端现在的记录并进来：整份写入才不会盖掉别的设备刚写的
    if (cur.metadata && cur.metadata.fromCache) throw { code: "unavailable" };
    const r = cur.exists ? cur.data() : null;
    if (r && r.v === 1 && mergeProg(JSON.parse(JSON.stringify(r))).took) { normalize(S.prog); saveLocal(); cloudSettled(true); }
    const body = JSON.parse(JSON.stringify(S.prog)), cb = canon(body);
    if (!r || cb !== canon(r)) {                              // 内容一样就不写
      // 同一份内容写上去又被别的设备改回去：再写两次还这样，就不顶了，等下一次真有改动再写。
      // 头两次要补写，是因为两台设备同时写时后到的会盖掉先到的；一直顶下去，就成了两边各执一词来回写
      if (cb !== lastWrote) { lastWrote = cb; wroteSame = 0; }
      if (!r || wroteSame < 3) { await S.ref.set(body); wroteSame++; }
    }
    if (S.cloud === "slow") { S.cloudNote = ""; renderCloudNote(); }
    S.cloud = "ok"; retryWait = 0;
  }
  catch (e) {
    const code = e && e.code;
    if (code === "quota_exceeded") { S.cloud = "local"; S.cloudNote = "云端存储已满，记录先存在这台设备上。"; }
    else if (["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "transform_error"].includes(code)) { S.cloud = "local"; S.cloudNote = "只有页面的所有者能把记录存到云端；你的记录存在这台设备的浏览器里。"; }
    else { retryWait = Math.min(60000, (retryWait || 1000) * 2); retryTimer = setTimeout(pushCloud, retryWait + Math.random() * 1000); }   // 一时连不上：过一会儿再试，只留一条重试，间隔逐次加长
    renderCloudNote();
  } finally {
    S.saving = false;
    if (S.again) { S.again = false; pushCloud(); }
  }
}
// 把另一份记录并进本机。返回 took（采用了对方几处）和 ahead（本机有几处比对方新，需要推回云端）。
// 规则：同一道题留最近练过的那份（同一天取作答次数多的；同一天只要有一边答错过，就照答错处理，明天再出），每天的作答数取多的，
// 当天定好的题组留今天的那份，设置跟最后改它的一边，其余拿不准的地方跟较新的整份记录。
// “清除全部记录”：清除时间较晚的一边算数，另一边在清除当天及之前的记录作废；清除之后的日子里做的题留下（清除迟到时不连累后来做的题）。
function mergeProg(inc) {
  const ie = inc.epoch || "", me = S.prog.epoch || "";
  let took = 0, ahead = 0;
  if (ie !== me) {
    const hi = ie > me ? ie : me, cut = dayStr(new Date(hi)), old = ie > me ? S.prog : inc;

    h("thead", null, h("tr", null, h("th", { text: "模块" }), h("th", { text: "做过" }), h("th", { text: "正确率" }), h("th", { text: "待复习" }))), h("tbody", null, ...mods.map(modRow))));
  box.append(h("h3", { text: "马哲" }), table(S.meta.modules), h("h3", { text: "政常（非马哲）" }), table(S.meta.fm_modules || []),
    h("p", { class: "note", text: "正确率按全部作答次数算。“待复习”是最近一次答错的题数。" }));
  const bs = S.blocks.filter((b) => (S.qByCard[b.id] || []).length);
  const ds = bs.map((b) => dims(b.id)).filter(Boolean);
  box.append(h("h3", { text: "政常知识块三项记录" }), h("div", { class: "stats3" },
    h("div", { class: "stat" }, h("div", { class: "v", text: `${ds.filter((d) => d.ind === 1).length}/${bs.length}` }), h("div", { class: "k", text: "独立作答都对" })),
    h("div", { class: "stat" }, h("div", { class: "v", text: `${ds.filter((d) => d.exp === 1).length}/${bs.length}` }), h("div", { class: "k", text: "自评能讲清" })),
    h("div", { class: "stat" }, h("div", { class: "v", text: `${ds.filter((d) => d.later === 1).length}/${bs.length}` }), h("div", { class: "k", text: "隔天回忆答对" }))),
    h("p", { class: "note", text: "三项分开算，讲过、看过不算掌握；全部初始为未测试。" }));
  const set = h("section", { class: "panel" }, h("h2", { text: "设置" }),
    h("div", { class: "setting" }, h("label", { for: "size-mz", text: "马哲每组题数" }), sizeSelect("mz")),
    h("div", { class: "setting", style: "margin-top:8px" }, h("label", { for: "size-fm", text: "政常每组题数" }), sizeSelect("fm")),
    hasPlan() ? h("div", { class: "setting", style: "margin-top:8px" }, h("label", { for: "dailySel", text: "今日计划每天题数" }), dailySelect()) : null,
    h("div", { class: "setting", style: "margin-top:10px" }, h("input", { type: "checkbox", id: "whyChk", checked: !!S.prog.settings.why, onchange: (e) => { S.prog.settings.why = e.target.checked; touch(); } }),
      h("label", { for: "whyChk", text: "判断题选“错误”时，先写一句错在哪再看答案" })),
    h("div", { class: "setting", style: "margin-top:6px" }, h("input", { type: "checkbox", id: "fmB2", checked: !!S.prog.settings.fmB, onchange: (e) => { S.prog.settings.fmB = e.target.checked; touch(); } }), h("label", { for: "fmB2", text: "政常练B档" })),
    h("div", { class: "setting", style: "margin-top:6px" }, h("input", { type: "checkbox", id: "fmC2", checked: !!S.prog.settings.fmC, onchange: (e) => { S.prog.settings.fmC = e.target.checked; touch(); } }), h("label", { for: "fmC2", text: "政常练C档（默认关）" })),
    cloudNoteEl());
  const io = h("section", { class: "panel" }, h("h2", { text: "导出、导入记录" }),
    h("p", { class: "sub", text: "导出一份记录文件备份；在另一台设备或离线版里导入，就能接着练。导入是合并：同一道题保留最近练过的那份记录。" }),
    h("div", { class: "row", style: "margin-top:10px" },
      h("button", { class: "btn", onclick: exportProg }, "导出记录"),

      h("input", { type: "file", id: "importFile", accept: ".json,application/json", hidden: true, onchange: (e) => { const f = e.target.files && e.target.files[0]; if (f) { const r = new FileReader(); r.onload = () => importProg(String(r.result)); r.readAsText(f); } } })),

async function exportProg() {
  const name = `政常辨析记录_${dayStr()}.json`, data = JSON.stringify(S.prog, null, 1);
  const msg = (t) => { const el = $("#ioMsg"); if (el) el.textContent = t; };
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); msg("已导出：" + name); return; }
    catch (e) { if (e && e.code === "declined") { msg("没有保存。"); return; } }
  }
  try {
    const a = h("a", { href: URL.createObjectURL(new Blob([data], { type: "application/json" })), download: name });
    document.body.append(a); a.click(); a.remove();
    msg("已导出：" + name + "（如果没有下载，用下面“显示记录文本”复制保存）");
  } catch (e) { msg("这里导不出文件，用下面“显示记录文本”复制保存。"); }
}
function importProg(text) {
  const msg = (t) => { const el = $("#ioMsg"); if (el) el.textContent = t; };
  let inc;
  try { inc = JSON.parse(text); } catch (e) { msg("读不出记录：不是有效的记录文件。"); return; }
  if (!inc || inc.v !== 1 || typeof inc.q !== "object") { msg("读不出记录：格式不对。"); return; }
  let added = 0, kept = 0;
  for (const [id, p] of Object.entries(inc.q)) {
    const mine = S.prog.q[id];
    if (!mine || (p.d || "") > (mine.d || "") || ((p.d || "") === (mine.d || "") && (p.n || 0) > (mine.n || 0))) { S.prog.q[id] = p; added++; } else kept++;
  }
  for (const [d, v] of Object.entries(inc.days || {})) { const m = S.prog.days[d]; if (!m || (v.n || 0) > (m.n || 0)) S.prog.days[d] = v; }
  touch();
  route();
  const el = $("#ioMsg"); if (el) el.textContent = `导入完成：更新${added}道题的记录，保留本机较新的${kept}道。`;
}
function confirmReset(e) {
  const b = e.currentTarget;
  if (b.dataset.armed) {
    // 清除时间只往后走：另一台设备的时钟偏快时，这一次清除也不会被当成更早的。设置和它的改动时间留着
    const pe = S.prog.epoch || "", ne = new Date().toISOString(), pt = new Date(pe).getTime();
    S.prog = { ...blankProg(), settings: S.prog.settings, ...(S.prog.st ? { st: S.prog.st } : {}), updated: S.prog.updated || "", epoch: ne > pe || isNaN(pt) ? ne : new Date(pt + 1).toISOString() };
    touch(); flushCloud(); route(); return;
  }
  b.dataset.armed = "1"; b.textContent = "再点一次确认清除（不能恢复，建议先导出）";
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "清除全部记录"; } }, 5000);
}

// ---------- 启动 ----------
async function start(hot) {
  try {
    const inline = document.getElementById("mz-data");   // 单文件导出版：题库打包在页面里
    if (inline) { const d = JSON.parse(inline.textContent); S.cards = d.cards; S.blocks = d.blocks || []; S.qs = d.questions; S.meta = d.meta; }
    else {
      const get = (f) => fetch(f).then((r) => { if (!r.ok) throw new Error(f); return r.json(); });
      const [cards, blocks, qs, meta] = await Promise.all([get("cards.json"), get("blocks.json").catch(() => []), get("questions.json"), get("meta.json")]);
      S.cards = cards; S.blocks = blocks; S.qs = qs; S.meta = meta;
    }
  } catch (e) {
    $("#main").replaceChildren(h("div", { class: "panel" }, h("h2", { text: "题库没有载入" }), h("p", { class: "sub", text: "刷新页面再试一次；如果一直这样，告诉Claude。" })));
    return;
  }
  for (const c of S.cards) S.card[c.id] = c;
  for (const b of S.blocks) { b.fm = true; S.card[b.id] = b; }
  for (const m of [...S.meta.modules, ...(S.meta.fm_modules || [])]) S.mod[m.id] = m;
  for (const q of S.qs) { S.q[q.id] = q; for (const c of q.cards) (S.qByCard[c] = S.qByCard[c] || []).push(q); }
  S.prog = loadLocal() || blankProg();
  S.setSeen = canon(S.prog.settings);
  if (hot && hot.run && Array.isArray(hot.run.ids)) {
    S.run = { list: hot.run.ids.map((id) => S.q[id]).filter(Boolean), pos: hot.run.pos, res: hot.run.res || {}, label: hot.run.label, tkey: hot.run.tkey || "", mode: hot.run.mode || "", day: hot.run.day || (hot.run.tkey ? dayStr() : "") };
  }
  route();
  connectCloud();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => ({ run: S.run ? { ids: S.run.list.map((q) => q.id), pos: S.run.pos, res: S.run.res, label: S.run.label, tkey: S.run.tkey, mode: S.run.mode, day: S.run.day } : null }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
