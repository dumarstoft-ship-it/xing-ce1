<title>马哲辨析日课</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* 布局：单栏练习本。顶栏固定（倒计时＋分栏），下面一张题卡；题面用宋体，界面用黑体。 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #eaedf2;
  --ink: #18202e;
  --muted: #586274;
  --line: #d8dde6;
  --accent: #2c4a8a;
  --accent-soft: #e4eaf6;
  --ok: #1b7650;
  --ok-soft: #e1f2ea;
  --bad: #b03c2c;
  --bad-soft: #f8e4df;
  --warn: #8c6210;
  --warn-soft: #f6ecd6;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131a; --surface: #171b24; --sunk: #1f2430; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2b313d;
    --accent: #93aee8; --accent-soft: #1f2a42; --ok: #5cc596; --ok-soft: #15302a; --bad: #f08b78; --bad-soft: #3a201c;
    --warn: #ddb057; --warn-soft: #352a14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #171b24; --sunk: #1f2430; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2b313d;
  --accent: #93aee8; --accent-soft: #1f2a42; --ok: #5cc596; --ok-soft: #15302a; --bad: #f08b78; --bad-soft: #3a201c;
  --warn: #ddb057; --warn-soft: #352a14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--accent); font-weight: 700; }
nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { flex: 0 0 auto; padding: 8px 8px 9px; text-decoration: none; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
nav.tabs .n { font-size: 11px; margin-left: 3px; color: var(--bad); font-variant-numeric: tabular-nums; }

main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; text-wrap: balance; }
.panel h3 { margin: 14px 0 6px; font-size: 15px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.loading { color: var(--muted); padding: 24px 0; text-align: center; }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); }

/* 今日 */
.today { display: grid; gap: 14px; }
.today .big { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.mix { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill.a { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.mods { display: grid; gap: 6px; }
.mod { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.mod:hover { border-color: var(--line); background: var(--sunk); }
.mod .id { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.mod .t { min-width: 0; }
.mod .t span { display: block; font-size: 14px; }
.bar { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.mod .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 做题 */
.runbar { display: flex; align-items: center; gap: 12px; }
.runbar .prog { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.runbar .prog i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.runbar .pos { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.lead { font-family: var(--serif); color: var(--muted); margin: 0 0 8px; font-size: 15px; }
.stem { font-family: var(--serif); font-size: 18px; line-height: 1.75; margin: 0 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 1.8em 1fr; gap: 8px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--serif); font-size: 16px; line-height: 1.6; width: 100%; }
.opt .L { font-family: var(--sans); font-weight: 700; color: var(--muted); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.missed { border-color: var(--ok); border-style: dashed; }
.opt[disabled] { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { grid-template-columns: 1fr; text-align: center; font-family: var(--sans); font-size: 16px; font-weight: 500; padding: 12px; }
.tf .opt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.why { margin-top: 12px; display: grid; gap: 8px; }
.why input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; font-weight: 700; margin-top: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict span { font-weight: 400; color: var(--ink); }
.reveal { display: grid; gap: 10px; margin-top: 12px; }
.blk { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.blk .h { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.blk p { margin: 2px 0 0; white-space: pre-line; }
.blk.good { border-color: var(--ok); }
.blk.good .h { color: var(--ok); }
.blk.trap { border-color: var(--bad); }
.blk.trap .h { color: var(--bad); }
.blk.warn { border-color: var(--warn); background: var(--warn-soft); padding: 6px 10px 6px 12px; border-radius: 0 6px 6px 0; }
.blk.warn .h { color: var(--warn); }
.blk.fix { border-color: var(--accent); }
.blk.fix .h { color: var(--accent); }
.blk .serif { font-family: var(--serif); }
.mine { font-size: 13px; color: var(--muted); }
.runfoot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.kbd { font-size: 12px; color: var(--muted); }
.flag { font-size: 12px; color: var(--warn); }

/* 概念卡、错题本 */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.search { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.cardlist { display: grid; gap: 8px; }
details.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.card summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
details.card summary::-webkit-details-marker { display: none; }
details.card .cid { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
details.card .ct { min-width: 0; font-weight: 500; }
details.card .body { padding: 0 12px 12px; display: grid; gap: 10px; }
.wrongq { font-family: var(--serif); font-size: 14px; margin: 4px 0 0; padding-left: 12px; border-left: 2px solid var(--bad); }
.setting { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.setting label { font-size: 14px; }
select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); }

/* 附录、记录 */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 90px; margin-top: 8px; }
.days div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.days div.zero { background: var(--sunk); }
.daylbl { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) {
  .stem { font-size: 17px; }
  .stats3 .v { font-size: 18px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>马哲辨析日课</h1>
      <div class="count" id="countdown"></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#today">今日</a>
      <a href="#practice">自选练习</a>
      <a href="#review">错题本<span class="n" id="wrongN"></span></a>
      <a href="#cards">概念卡</a>
      <a href="#appendix">附录</a>
      <a href="#stats">记录</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="panel loading">正在载入题库……</div>
</main>

<script>
"use strict";
const EXAM_DAY = "2026-12-06";
const LS_KEY = "mzbx-progress-v1";
const INTERVALS = [1, 2, 4, 7, 14, 30];          // 答对后按盒子编号推迟复习的天数；答错回到第0盒，次日复习
const S = { cards: [], qs: [], meta: null, q: {}, card: {}, qByCard: {}, mods: {}, prog: null, run: null,
            ref: null, saving: false, again: false, cloud: "connecting", cloudNote: "" };

// ---------- 小工具 ----------
const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function dayStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(day, n) { const [y, m, d] = day.split("-").map(Number); return dayStr(new Date(y, m - 1, d + n)); }
function dayDiff(a, b) { const f = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 86400000); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isA = (q) => q.cards.some((c) => S.card[c] && S.card[c].priority === "A");
const kindLabel = (q) => q.src === "底稿" ? "底稿判断" : q.src === "真题" ? "广东真题" : q.kind === "拓展" ? "拓展题" : "仿真题";

// ---------- 进度：云端（db，仅所有者可读写）＋本机缓存 ----------
function blankProg() { return { v: 1, q: {}, days: {}, settings: { size: 15, why: false }, today: null, updated: "" }; }
function loadLocal() {
  try { const s = localStorage.getItem(LS_KEY); if (s) { const p = JSON.parse(s); if (p && p.v === 1) return p; } } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.prog)); } catch (e) {} }
function touch() { S.prog.updated = new Date().toISOString(); saveLocal(); scheduleCloud(); }
let cloudTimer = 0;
function scheduleCloud() { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 900); }
async function pushCloud() {
  if (!S.ref || S.cloud === "local") return;
  if (S.saving) { S.again = true; return; }
  S.saving = true;
  try { await S.ref.set(JSON.parse(JSON.stringify(S.prog))); S.cloud = "ok"; }
  catch (e) {
    const code = e && e.code;
    if (code === "unavailable") { setTimeout(pushCloud, 1500 + Math.random() * 1500); }
    else if (code === "quota_exceeded") { S.cloud = "local"; S.cloudNote = "云端存储已满，记录先存在这台设备上。"; }
    else { S.cloud = "local"; S.cloudNote = "只有页面的所有者能把记录存到云端；你的记录存在这台设备的浏览器里。"; }
    renderCloudNote();
  } finally {
    S.saving = false;
    if (S.again) { S.again = false; pushCloud(); }
  }
}
async function connectCloud() {
  const timer = setTimeout(() => { if (S.cloud === "connecting") { S.cloud = "slow"; S.cloudNote = "云端记录暂时连不上，先存在这台设备上，连上后会自动同步。"; renderCloudNote(); } }, 10000);
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); S.cloud = "local"; S.cloudNote = "在这里打开时记录只存在这台设备的浏览器里。"; renderCloudNote(); return; }
  try { S.ref = db.doc("progress/main"); } catch (e) { clearTimeout(timer); S.cloud = "local"; renderCloudNote(); return; }
  S.ref.onSnapshot((snap) => {
    if (snap.metadata.fromCache && !snap.exists) return;
    clearTimeout(timer);
    if (S.cloud === "connecting" || S.cloud === "slow") { S.cloud = "ok"; S.cloudNote = ""; }
    if (snap.metadata.hasPendingWrites) return;
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.v === 1 && (remote.updated || "") > (S.prog.updated || "")) {
      S.prog = JSON.parse(JSON.stringify(remote));
      saveLocal();
      if (!S.run) route();
      else updateTabs();
    } else if ((!remote || (remote.updated || "") < (S.prog.updated || "")) && S.prog.updated) {
      scheduleCloud();
    }
    renderCloudNote();
  }, (e) => { clearTimeout(timer); S.cloud = "local"; S.cloudNote = "云端记录连不上，记录先存在这台设备上。"; renderCloudNote(); });
}
function renderCloudNote() { const el = $("#cloudNote"); if (el) { el.textContent = S.cloudNote; el.hidden = !S.cloudNote; } }

// ---------- 作答记录 ----------
function record(q, correct) {
  const today = dayStr();
  const p = S.prog.q[q.id] || { n: 0, c: 0, l: 0, b: 0, f: today, d: today, due: today };
  p.n += 1; p.c += correct ? 1 : 0; p.l = correct ? 1 : 0; p.d = today;
  if (correct) { p.b = Math.min(p.b + 1, INTERVALS.length - 1); p.due = addDays(today, INTERVALS[p.b]); }
  else { p.b = 0; p.due = addDays(today, 1); }
  if (correct && p.f < today) p.x = 1;   // 跨天答对过（不是当天看完解析马上答对）
  S.prog.q[q.id] = p;
  const dd = S.prog.days[today] || { n: 0, c: 0 };
  dd.n += 1; dd.c += correct ? 1 : 0; S.prog.days[today] = dd;
  touch();
}
function cardStatus(cid) {
  const qs = S.qByCard[cid] || [];
  const ps = qs.map((q) => S.prog.q[q.id]).filter(Boolean);
  if (!ps.length) return { k: "untested", t: "未练", cls: "" };
  if (ps.some((p) => !p.l)) return { k: "wrong", t: "有错待复习", cls: "bad" };
  const base = qs.filter((q) => q.src === "底稿");
  const allBase = base.every((q) => S.prog.q[q.id] && S.prog.q[q.id].l);
  if (allBase && ps.some((p) => p.x)) return { k: "steady", t: "跨天答对", cls: "ok" };
  return { k: "some", t: "做对过", cls: "a" };
}

// ---------- 选题 ----------
function pickGroup(pool, size, opts = {}) {
  pool = pool.filter((q) => !q.hold);
  const today = dayStr();
  const P = S.prog.q;
  const used = new Set(), cardsUsed = new Set(), out = [];
  const take = (q) => { if (used.has(q.id) || out.length >= size) return false; if (!opts.allowSameCard && q.cards.some((c) => cardsUsed.has(c))) return false; used.add(q.id); q.cards.forEach((c) => cardsUsed.add(c)); out.push(q); return true; };
  const due = pool.filter((q) => P[q.id] && P[q.id].due <= today)
    .sort((a, b) => (P[a.id].l - P[b.id].l) || (isA(b) - isA(a)) || (P[a.id].due < P[b.id].due ? -1 : P[a.id].due > P[b.id].due ? 1 : 0));
  const fresh = pool.filter((q) => !P[q.id]);
  const reviewCap = opts.reviewCap == null ? Math.ceil(size / 2) : opts.reviewCap;
  for (const q of due) { if (out.length >= reviewCap) break; take(q); }
  // 新题：A级卡和仿真题优先，各模块轮流出
  const byMod = {};
  for (const q of shuffle(fresh.slice())) (byMod[q.module] = byMod[q.module] || []).push(q);
  for (const m in byMod) byMod[m].sort((a, b) => ((isA(b) + (b.src !== "底稿") * 0.8 + Math.random() * 0.9) - (isA(a) + (a.src !== "底稿") * 0.8 + Math.random() * 0.9)));
  const mods = Object.keys(byMod).sort();
  const start = mods.length ? dayDiff("2026-01-01", today) % mods.length : 0;
  // 真题式的题（新题、真题）每组先占约四成，各模块轮流出
  const examQuota = Math.min(size, out.length + (opts.examQuota == null ? Math.ceil(size * 0.4) : opts.examQuota));
  let progress = true;
  while (out.length < examQuota && progress) {
    progress = false;
    for (let i = 0; i < mods.length && out.length < examQuota; i++) {
      const list = byMod[mods[(start + i) % mods.length]];

    group("来源", "src", [["底稿判断", "底稿判断"], ["仿真题", "仿真题"], ["拓展题", "拓展题"], ["广东真题", "广东真题"]]),
    group("题型", "type", [["判断", "判断"], ["单选", "单选"], ["多选", "多选"]]),

  const scope = h("div", { class: "filters" });

  }

  box.append(h("div", { class: "row", style: "margin-top:16px" }, cnt, h("label", { class: "note", for: "sizeSel" }, "每组"), sizeSelect(),
    h("button", { class: "btn primary", id: "fstart", onclick: () => { const pool = filtered(); startRun(F.scope === "wrong" ? spread(shuffle(pool)).slice(0, S.prog.settings.size || 15) : pickGroup(pool, S.prog.settings.size || 15, { reviewCap: S.prog.settings.size }), "自选练习"); } }, "开始")));

}
function filtered() {
  return S.qs.filter((q) => (!F.mods.size || F.mods.has(q.module)) && (!F.src.size || F.src.has(kindLabel(q))) && (!F.type.size || F.type.has(q.type))

    && (F.scope === "all" || (F.scope === "fresh" ? !S.prog.q[q.id] : S.prog.q[q.id] && !S.prog.q[q.id].l)));
}
function updateCount() { const n = filtered().length; const c = $("#fcount"); if (c) c.textContent = `符合条件的题：${n}道`; const b = $("#fstart"); if (b) b.disabled = !n; }

// ---------- 错题本 ----------
function wrongCards() {
  if (!S.prog) return [];
  const set = new Set();
  for (const q of S.qs) { const p = S.prog.q[q.id]; if (p && !p.l) q.cards.forEach((c) => set.add(c)); }
  return [...set].filter((c) => S.card[c]).sort();
}
function viewReview() {
  const ids = wrongCards();
  const box = h("section", { class: "panel" }, h("h2", { text: "错题本" }),

  if (!ids.length) { box.append(h("p", { class: "note", text: "现在没有错题。" })); return box; }

  const list = h("div", { class: "cardlist" });

    list.append(h("details", { class: "card" },
      h("summary", null, h("span", { class: "cid", text: c.id }), h("span", { class: "ct", text: c.title }), h("span", { class: "pill bad", text: `错${wrongQs.length}` })),
      h("div", { class: "body" }, ...wrongQs.map((q) => h("p", { class: "wrongq", text: q.stem })), cardBody(c))));
  }

  return box;
}

// ---------- 概念卡 ----------
const CF = { mod: "", q: "" };
function cardBody(c) {
  return h("div", { class: "body" },
    c.review_note ? blk("warn", "待核验（核对人意见，底稿答案未改）", c.review_note) : null,
    blk("good", "正确说法", c.correct_statement, true),
    blk("trap", "易错说法（不要记成结论）", c.incorrect_statement, true),
    blk("", "为什么", c.explanation),
    blk("fix", "条件与边界", c.necessary_conditions_and_boundaries),
    blk("", "例子", c.example_or_counterexample + (c.example_status ? `\n（${c.example_status}）` : "")),
    h("p", { class: "note", text: `${c.priority === "A" ? "A级：优先辨析与条件检查" : "B级：基础确认"} · 来源：${refNames(c.source_refs)} · 本卡共${(S.qByCard[c.id] || []).length}道题` }));
}
function viewCards() {
  const box = h("section", { class: "panel" }, h("h2", { text: "概念卡" }),
    h("p", { class: "sub", text: "主动翻看：每张卡有正确说法、易错说法、解释、条件和例子。“跨天答对”指这张卡的底稿两题最近都答对，且有题在第一次之后的另一天答对过；只看解析不会改变状态。" }));
  const chips = h("div", { class: "filters", style: "margin:10px 0" });
  for (const [v, label] of [["", "全部"], ...S.meta.modules.map((m) => [m.id, m.id])]) {
    chips.append(h("button", { class: "chip", "aria-pressed": String(CF.mod === v), onclick: () => { CF.mod = v; route(); } }, label));
  }
  const input = h("input", { class: "search", id: "cardSearch", type: "search", placeholder: "搜标题或句子里的词，如“反作用”", value: CF.q,
    oninput: (e) => { CF.q = e.target.value.trim(); fillCards(list); } });
  const list = h("div", { class: "cardlist" });
  box.append(chips, input, h("div", { style: "height:10px" }), list);
  fillCards(list);
  return box;
}
function fillCards(list) {
  const kw = CF.q;
  const rows = S.cards.filter((c) => (!CF.mod || c.module_id === CF.mod) && (!kw || [c.title, c.correct_statement, c.incorrect_statement, c.explanation, c.necessary_conditions_and_boundaries].some((t) => t.includes(kw))));
  list.replaceChildren(...rows.map((c) => {
    const st = cardStatus(c.id);
    return h("details", { class: "card" },
      h("summary", null, h("span", { class: "cid", text: c.id }), h("span", { class: "ct", text: c.title }),
        h("span", { class: "row", style: "gap:4px" }, c.priority === "A" ? h("span", { class: "pill warn", text: "A" }) : null, h("span", { class: "pill " + st.cls, text: st.t }))),
      cardBody(c));
  }));
  if (!rows.length) list.append(h("p", { class: "note", text: "没有符合的卡。" }));
}

// ---------- 附录 ----------
function viewAppendix() {

      h("td", null, /^https:\/\//.test(s.url) ? h("a", { href: s.url, target: "_blank", rel: "noopener" }, s.title) : s.title), h("td", { class: "note", text: s.role })))))));

// ---------- 记录 ----------
function viewStats() {
  const box = h("section", { class: "panel" }, h("h2", { text: "练习记录" }));
  const today = dayStr();
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(today, -i));
  const mx = Math.max(10, ...days.map((d) => (S.prog.days[d] || { n: 0 }).n));
  box.append(h("p", { class: "sub", text: "近14天每天答题数" }),
    h("div", { class: "days" }, ...days.map((d) => { const n = (S.prog.days[d] || { n: 0 }).n; return h("div", { class: n ? "" : "zero", title: `${d}：${n}题`, style: `height:${Math.max(2, n / mx * 100)}%` }); })),
    h("div", { class: "daylbl" }, ...days.map((d) => h("span", { text: String(Number(d.slice(8))) }))));

    const qs = S.qs.filter((q) => q.module === m.id);

    const n = ps.reduce((s, p) => s + p.n, 0), c = ps.reduce((s, p) => s + p.c, 0);

  });
  box.append(h("h3", { text: "各模块" }), h("div", { class: "tbl" }, h("table", null,
    h("thead", null, h("tr", null, h("th", { text: "模块" }), h("th", { text: "做过" }), h("th", { text: "正确率" }), h("th", { text: "待复习" }))), h("tbody", null, ...rows))),
    h("p", { class: "note", text: "正确率按全部作答次数算（同一题答了几次就算几次）。“待复习”是最近一次答错的题数。" }));
  const set = h("section", { class: "panel" }, h("h2", { text: "设置" }),
    h("div", { class: "setting" }, h("label", { for: "sizeSel", text: "每组题数" }), sizeSelect()),
    h("div", { class: "setting", style: "margin-top:10px" }, h("input", { type: "checkbox", id: "whyChk", checked: !!S.prog.settings.why, onchange: (e) => { S.prog.settings.why = e.target.checked; touch(); } }),
      h("label", { for: "whyChk", text: "判断题选“错误”时，先写一句错在哪再看答案" })),
    h("p", { class: "note", id: "cloudNote", hidden: !S.cloudNote, text: S.cloudNote }),
    h("div", { class: "row", style: "margin-top:14px" }, h("button", { class: "btn danger", id: "resetBtn", onclick: confirmReset }, "清除全部记录")));
  return [box, set];
}
function confirmReset(e) {
  const b = e.currentTarget;
  if (b.dataset.armed) { S.prog = { ...blankProg(), settings: S.prog.settings }; touch(); route(); return; }
  b.dataset.armed = "1"; b.textContent = "再点一次确认清除（不能恢复）";
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "清除全部记录"; } }, 5000);
}

// ---------- 启动 ----------
async function start(hot) {
  try {
    const inline = document.getElementById("mz-data");   // 单文件导出版：题库打包在页面里
    if (inline) { const d = JSON.parse(inline.textContent); S.cards = d.cards; S.qs = d.questions; S.meta = d.meta; }
    else {
      const [cards, qs, meta] = await Promise.all(["cards.json", "questions.json", "meta.json"].map((f) => fetch(f).then((r) => { if (!r.ok) throw new Error(f); return r.json(); })));
      S.cards = cards; S.qs = qs; S.meta = meta;
    }
  } catch (e) {
    $("#main").replaceChildren(h("div", { class: "panel" }, h("h2", { text: "题库没有载入" }), h("p", { class: "sub", text: "刷新页面再试一次；如果一直这样，告诉Claude。" })));
    return;
  }
  for (const c of S.cards) S.card[c.id] = c;
  for (const q of S.qs) { S.q[q.id] = q; for (const c of q.cards) (S.qByCard[c] = S.qByCard[c] || []).push(q); }
  S.prog = loadLocal() || blankProg();
  if (hot && hot.run && Array.isArray(hot.run.ids)) {
    S.run = { list: hot.run.ids.map((id) => S.q[id]).filter(Boolean), pos: hot.run.pos, res: hot.run.res || {}, label: hot.run.label, today: hot.run.today };
  }
  route();
  connectCloud();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => ({ run: S.run ? { ids: S.run.list.map((q) => q.id), pos: S.run.pos, res: S.run.res, label: S.run.label, today: S.run.today } : null }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
