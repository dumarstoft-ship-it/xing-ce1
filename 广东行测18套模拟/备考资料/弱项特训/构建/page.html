<style>

<script>
/*GEN*/
/*SVG*/
// ---------- 基础 ----------
const EXAM_DAY = "2026-12-06";
const LS_KEY = "xcrx-progress-v1", DEV_KEY = "xcrx-device";
const S = { data: null, q: {}, prog: null, run: null, cloud: "connecting", cloudNote: "", synced: false, ref: null, saving: false, again: false, setSeen: "" };
const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;      // 只用于本页自己生成的 SVG
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c === null || c === undefined || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function dayStr(d = new Date()) { const p = (v) => String(v).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function addDays(day, n) { const [y, m, d] = day.split("-").map(Number); return dayStr(new Date(y, m - 1, d + n)); }
function dayDiff(a, b) { const f = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 86400000); }
const maxStr = (a, b) => ((a || "") > (b || "") ? a : b) || undefined;
const DEV = (() => { try { let d = localStorage.getItem(DEV_KEY); if (!d) { d = "d" + Math.random().toString(36).slice(2, 9); localStorage.setItem(DEV_KEY, d); } return d; } catch (e) { return "d" + Math.random().toString(36).slice(2, 9); } })();

// ---------- 记录：本机缓存＋云端（db，仅所有者可读写） ----------
// r[题号] = { n 作答次数, c 答对次数, l 最近一次对错, d 最近作答日, f 首次作答日, wd 最近答错日, k/s 自编题的生成器与种子 }
// 真题每次都记；自编题只记答错过的（错题本要能原样重出），答对的只进计数。
// cnt[设备][d][日期] = [题数, 答对]；cnt[设备][g][分类] = [题数, 答对]——各设备只加自己的，合并时取各设备各项的较大值，总数是各设备相加。
const DEFAULT_SETTINGS = { batch: 20 };
function blankProg() { return { v: 1, r: {}, cnt: {}, settings: { ...DEFAULT_SETTINGS }, updated: "" }; }
function normalize(p) { p.r = p.r || {}; p.cnt = p.cnt || {}; p.settings = { ...DEFAULT_SETTINGS, ...(p.settings || {}) }; return p; }
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) { const p = JSON.parse(s); if (p && p.v === 1) return normalize(p); } } catch (e) {} return null; }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.prog)); } catch (e) {} }
function stamp() { const now = new Date().toISOString(), prev = S.prog.updated || ""; if (now > prev) return now; const t = new Date(prev).getTime(); return isNaN(t) ? now : new Date(t + 1).toISOString(); }
const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map((key) => [key, x[key]])) : x));
const sameRec = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every((k) => a[k] === b[k]); };
function touch() {
  S.prog.updated = stamp();
  const sj = canon(S.prog.settings);
  if (sj !== S.setSeen) { S.setSeen = sj; S.prog.st = S.prog.updated; }
  saveLocal(); scheduleCloud();
}
let cloudTimer = 0, retryTimer = 0, retryWait = 0, lastWrote = "", wroteSame = 0;
function scheduleCloud() { clearTimeout(cloudTimer); cloudTimer = setTimeout(() => { cloudTimer = 0; pushCloud(); }, 900); }
function flushCloud() { if (cloudTimer) { clearTimeout(cloudTimer); cloudTimer = 0; pushCloud(); } }
async function pushCloud() {
  if (!S.ref || S.cloud === "local" || !S.synced) return;     // 没拿到云端确认过的记录之前不写
  if (S.saving) { S.again = true; return; }
  S.saving = true; clearTimeout(retryTimer);
  try {
    const cur = await S.ref.get();                             // 写之前先读云端现在的记录并进来
    if (cur.metadata && cur.metadata.fromCache) throw { code: "unavailable" };
    const r = cur.exists ? cur.data() : null;
    if (r && r.v === 1 && mergeProg(JSON.parse(JSON.stringify(r))).took) { normalize(S.prog); saveLocal(); cloudSettled(true); }
    const body = JSON.parse(JSON.stringify(S.prog)), cb = canon(body);
    if (!r || cb !== canon(r)) {                               // 内容一样就不写；同一份写了三次还被改回去，就不再顶
      if (cb !== lastWrote) { lastWrote = cb; wroteSame = 0; }
      if (!r || wroteSame < 3) { await S.ref.set(body); wroteSame++; }
    }
    if (S.cloud === "slow") { S.cloudNote = ""; renderCloudNote(); }
    S.cloud = "ok"; retryWait = 0;
  } catch (e) {
    const code = e && e.code;
    if (code === "quota_exceeded") { S.cloud = "local"; S.cloudNote = "云端存储已满，记录先存在这台设备上。"; }
    else if (["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "transform_error"].includes(code)) { S.cloud = "local"; S.cloudNote = "只有页面的所有者能把记录存到云端；你的记录存在这台设备的浏览器里。"; }
    else { retryWait = Math.min(60000, (retryWait || 1000) * 2); retryTimer = setTimeout(pushCloud, retryWait + Math.random() * 1000); }
    renderCloudNote();
  } finally { S.saving = false; if (S.again) { S.again = false; pushCloud(); } }
}

// ---------- 做题 ----------

function optList(q) { if (Array.isArray(q.opts)) return q.opts.map((t, i) => [LET[i], t]); if (q.opts) return LET.filter((L) => q.opts[L] !== undefined).map((L) => [L, q.opts[L]]); return LET.map((L) => [L, ""]); }

}
function gridFig(q) {
  const cell = 22, F = q.fig;
  const s = F.stem.map((g) => h("span", { html: svgGrid(g, cell) }));
  return h("div", { class: "figbox grids" },
    h("div", { class: "grp" }, s[0], s[1], s[2]), h("div", { class: "grp" }, s[3], s[4], h("span", { class: "qm", text: "？" })));
}

function renderRun() {

document.addEventListener("keydown", (e) => {
