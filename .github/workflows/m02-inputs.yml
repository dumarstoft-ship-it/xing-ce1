name: M02 reference inputs
on:
  push:
    branches: ['gpt/m02-20261115']
    paths: ['.github/workflows/m02-inputs.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /江浙行测_AI题库/answers.jsonl
            /国考/言语理解/2016-2025/
            /广东行测18套模拟/用题登记.jsonl
            /广东行测18套模拟/M02/
            /广东行测24天集训/
            /习题本/图推/
            !*.pdf
            !*.zip
            !*.png
      - uses: actions/upload-artifact@v4
        with:
          name: M02-reference-inputs
          path: |
            江浙行测_AI题库/answers.jsonl
            国考/言语理解/2016-2025/
            广东行测18套模拟/用题登记.jsonl
            广东行测18套模拟/M02/
            广东行测24天集训/
            习题本/图推/
          retention-days: 3
