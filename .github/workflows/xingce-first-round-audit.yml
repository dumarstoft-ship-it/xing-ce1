name: Xingce one-time audit source bundle
on:
  push:
    branches: [gpt/first-round-audit-20261108]
    paths: [.github/workflows/xingce-first-round-audit.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main_snapshot
          sparse-checkout: 广东行测24天集训
      - uses: actions/checkout@v4
        with:
          ref: claude/optimistic-bardeen-qkrbx0
          path: claude_snapshot
          sparse-checkout: 广东行测24天集训
      - name: Prepare scoped source bundle
        shell: python
        run: |
          import pathlib, shutil, subprocess, json
          out=pathlib.Path('audit_bundle'); out.mkdir()
          project='广东行测24天集训'
          refs={}
          for label in ('main','claude'):
              root=pathlib.Path(label+'_snapshot')
              refs[label]=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
              src=root/project
              dst=out/label/project
              dst.mkdir(parents=True)
              if label=='main':
                  shutil.copytree(src/'GPT_数量',dst/'GPT_数量')
              else:
                  for name in ('Claude_资料判断言语','交接'):
                      if (src/name).exists(): shutil.copytree(src/name,dst/name)
                  q=src/'共享输入'/'数量原文'
                  target=dst/'共享输入'/'数量原文'; target.mkdir(parents=True)
                  for p in q.iterdir():
                      if p.is_file(): shutil.copy2(p,target/p.name)
                  for name in ('已做情况记录.md','用户决定记录.md'):
                      if (src/name).exists(): shutil.copy2(src/name,dst/name)
          (out/'source_refs.json').write_text(json.dumps(refs,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(refs))
      - uses: actions/upload-artifact@v4
        with:
          name: xingce-first-round-audit-source
          path: audit_bundle
          retention-days: 2
          if-no-files-found: error
