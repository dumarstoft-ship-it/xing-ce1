name: M01 review workspace
on:
  push:
    branches: ['gpt/m01-claude-revision-20261115']
    paths: ['.github/workflows/m01-review-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /协作原则_指月之指非月.md
            /广东行测18套模拟/
            /江浙行测_AI题库/questions.jsonl
            /江浙行测_AI题库/images/
            /模考/2026下半年广东卷_16-33季_AI可读/
            /国考/言语理解/2016-2025/all.jsonl
            /学习资料/政治理论常识/*.jsonl
            !*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: M01-scoped-review-workspace
          path: |
            广东行测18套模拟/
            江浙行测_AI题库/
            模考/2026下半年广东卷_16-33季_AI可读/
            国考/言语理解/2016-2025/all.jsonl
            学习资料/政治理论常识/*.jsonl
          retention-days: 2
