name: Collect planar source reserve 2015-2016
on:
  push:
    branches: ['chatgpt/planar201-400-sources-20261113']
    paths: ['.github/workflows/planar201-400-reserve-20261113.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect original reserve PDFs
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,re,urllib.request,urllib.parse,time
          root=pathlib.Path('reserve-export');root.mkdir();items=[];seen=set()
          def get(url):
              for k in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'planar-reserve'}),timeout=120) as r:return r.read()
                  except Exception:
                      if k==3:raise
                      time.sleep(2**k)
          for repo in ['xing-ce1','xingce']:
              tree=json.loads(get('https://api.github.com/repos/dumarstoft-ship-it/'+repo+'/git/trees/main?recursive=1'))
              for e in tree['tree']:
                  p=e['path'];n=p.rsplit('/',1)[-1]
                  if e['type']!='blob' or not re.match(r'201[56]',n) or not n.lower().endswith('.pdf') or '行测' not in n:continue
                  if any(x in p for x in ['习题本','集训','模考']) or e['sha'] in seen:continue
                  seen.add(e['sha']);items.append({'repo':repo,'path':p,'sha':e['sha'],'source_commit':tree['sha']})
          def one(x):
              b=get('https://raw.githubusercontent.com/dumarstoft-ship-it/'+x['repo']+'/'+x['source_commit']+'/'+urllib.parse.quote(x['path'],safe='/'))
              assert b.startswith(b'%PDF-') and hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==x['sha']
              local='pdf/'+x['repo']+'/'+x['path'];dst=root/local;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(b)
              return dict(x,local=local,sha256=hashlib.sha256(b).hexdigest(),bytes=len(b))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:out=list(ex.map(one,items))
          (root/'manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8');print(len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planar201-400-reserve-2015-2016
          path: reserve-export/
          compression-level: 1
          retention-days: 3
