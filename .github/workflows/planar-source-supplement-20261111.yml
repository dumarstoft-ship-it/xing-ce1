name: Planar source supplement 20261111
on:
  push:
    branches: ['chatgpt/planar-200-20261111']
    paths: ['.github/workflows/planar-source-supplement-20261111.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Collect public supplementary PDFs
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,re,time,urllib.request,urllib.parse
          root=pathlib.Path('exam-source-supplement');root.mkdir();items=[];seen=set()
          def get(url):
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'exam-source-export'}),timeout=90) as r:return r.read()
                  except Exception:
                      if i==3:raise
                      time.sleep(2**i)
          for repo in ['xing-ce1','xingce']:
              t=json.loads(get('https://api.github.com/repos/dumarstoft-ship-it/'+repo+'/git/trees/main?recursive=1'))
              for e in t['tree']:
                  p=e['path'];n=p.rsplit('/',1)[-1]
                  if e['type']!='blob' or not n.lower().endswith('.pdf'):continue
                  choose=(re.match('2022',n) and ('行测' in n or '答案解析' in n)) or (re.match('2026',n) and '解析' in n)
                  if not choose or e['sha'] in seen:continue
                  seen.add(e['sha']);items.append({'repo':repo,'path':p,'sha':e['sha']})
          def work(x):
              u='https://raw.githubusercontent.com/dumarstoft-ship-it/'+x['repo']+'/main/'+urllib.parse.quote(x['path'],safe='/');data=get(u)
              if not data.startswith(b'%PDF-'):raise ValueError(u)
              local='pdf/'+x['repo']+'/'+x['path'];f=root/local;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(data)
              return dict(x,local=local,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:out=list(ex.map(work,items))
          (root/'manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8');print(len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planar-exam-source-supplement
          path: exam-source-supplement/
          compression-level: 1
          retention-days: 3
